id: act.quiz.fraction-intro-01
schema: activity-def/1
kind: quiz
version: 1
title: 分数小挑战
targets: [math.number.fraction-intro]
age_band: G3-4
duration_min: 10
review: approved
engine: 1
sources:
  - type: textbook
    ref: 人教版三年级上册“分数的初步认识”
body:
  items:
    - id: q1
      stem: 涂色部分是这个圆的几分之几？
      figure: {type: pie, parts: 4, shaded: 1}
      answer:
        type: choice
        choices:
          - {id: a, text: 1/4, correct: true}
          - id: b
            text: 1/3
            misconception: part-vs-rest
            feedback: 涂色部分要和整个圆的总份数相比。
          - id: c
            text: 4/1
            misconception: flip
            feedback: 总份数写在横线下面，涂色份数写在横线上面。
      hints:
        - 分母表示平均分成的总份数。
        - 分子表示涂色的份数。
      feedback:
        correct: 总份数和涂色份数都找对了。
        wrong: 先数总份数，再数涂色份数。
    - id: q2
      stem: 长方形被分成三份，涂色部分能直接用 1/3 表示吗？
      figure: {type: rect-unequal, widths: [1, 2, 1], shaded: [0]}
      answer:
        type: choice
        choices:
          - id: a
            text: 不能，因为三份不一样大
            correct: true
          - id: b
            text: 能，因为一共分成三份
            misconception: equal-parts
            feedback: 只有平均分时，其中一份才是整体的 1/3。
          - id: c
            text: 能，涂色一份和没涂色两份比较即可
            misconception: part-vs-rest
            feedback: 分母要表示整个图形平均分成的总份数。
      hints:
        - 比较三份的大小。
        - 用分数表示这样的部分前，先检查是不是平均分。
    - id: q3
      stem: 一张纸条平均分成 4 份，涂其中 3 份，所得分数的分子是几？
      answer:
        type: number
        value: 3
        tolerance: 0
        common_wrong:
          - value: 4
            misconception: flip
            feedback: 分子表示涂色份数，不是总份数。
      hints:
        - 看横线上面的数。
        - 横线上面的数表示涂色的份数。
    - id: q4
      stem: 一张正方形纸平均分成 8 份，涂其中 2 份，涂色部分用分数怎样表示？
      figure: {type: rect, parts: 8, shaded: 2, direction: v}
      answer:
        type: fraction
        numerator: 2
        denominator: 8
        accept_equivalent: true
        common_wrong:
          - numerator: 2
            denominator: 6
            misconception: part-vs-rest
            feedback: 分母是总份数，不是没涂色的份数。
          - numerator: 8
            denominator: 2
            misconception: flip
            feedback: 总份数写在横线下面，涂色份数写在横线上面。
      hints:
        - 先数平均分成的总份数，写在横线下面。
        - 再数涂色的份数，写在横线上面。
    - id: q5
      stem: 一张长方形纸平均分成 6 份，涂其中 1 份，涂色部分用分数怎样表示？
      figure: {type: rect, parts: 6, shaded: 1, direction: h}
      answer:
        type: fraction
        numerator: 1
        denominator: 6
        accept_equivalent: false
        common_wrong:
          - numerator: 1
            denominator: 5
            misconception: part-vs-rest
            feedback: 分母要对应全部份数。
      hints:
        - 分母要把涂色和没涂色的份数都算上。
        - 分子只数涂色的份数。
  shuffle: true
# END OF FILE
