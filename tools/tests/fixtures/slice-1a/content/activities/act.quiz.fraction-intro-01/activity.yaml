# 竖切片 1a 的演示夹具：只有五道选择题、固定题序（切片规格第 7、8 节）。只给演示页用，不是正式内容。
id: act.quiz.fraction-intro-01
schema: activity-def/1
kind: quiz
version: 1
title: 分数小挑战
targets: [math.number.fraction-intro]
age_band: G3-4
duration_min: 5
review: approved
engine: 1
sources:
  - type: textbook
    ref: 人教版三年级上册“分数的初步认识”
body:
  shuffle: false
  items:
    - id: q1
      stem: 涂色部分是这个圆的几分之几？
      figure: {type: pie, parts: 4, shaded: 1}
      answer:
        type: choice
        choices:
          - id: c
            text: 4/1
            misconception: flip
            feedback: 总份数写在横线下面，涂色份数写在横线上面。
          - {id: a, text: 1/4, correct: true}
          - id: b
            text: 1/3
            misconception: part-vs-rest
            feedback: 涂色的 1 份要和整个圆的 4 份相比，不是和没涂色的 3 份比。
      feedback:
        correct: 平均分成 4 份，涂了 1 份，就是 1/4。
    - id: q2
      stem: 长方形被分成三份，涂色部分能直接用 1/3 表示吗？
      figure: {type: rect-unequal, widths: [1, 2, 1], shaded: [0]}
      answer:
        type: choice
        choices:
          - id: a
            text: 不能，因为三份不一样大
            correct: true
          - id: b
            text: 能，因为一共分成三份
            misconception: equal-parts
            feedback: 只有平均分时，其中一份才是整体的 1/3。
          - id: c
            text: 能，涂色一份和没涂色两份比较即可
            misconception: part-vs-rest
            feedback: 分母要表示整个图形平均分成的总份数。
    - id: q3
      stem: 一张纸条平均分成 4 份，涂了其中 3 份。涂色部分是这张纸条的几分之几？
      answer:
        type: choice
        choices:
          - id: a
            text: 4/3
            misconception: flip
            feedback: 分母是平均分成的总份数 4，分子是涂色的份数 3。
          - id: b
            text: 3/1
            misconception: part-vs-rest
            feedback: 涂色的 3 份要和整张纸条的 4 份相比。
          - {id: c, text: 3/4, correct: true}
    - id: q4
      stem: 把一个西瓜平均切成 8 块，吃了 1 块。吃了这个西瓜的几分之几？
      answer:
        type: choice
        choices:
          - id: a
            text: 1/7
            misconception: part-vs-rest
            feedback: 吃掉的 1 块要和整个西瓜的 8 块相比，不是和剩下的 7 块比。
          - {id: b, text: 1/8, correct: true}
          - id: c
            text: 8/1
            misconception: flip
            feedback: 平均切成的总块数写在横线下面。
    - id: q5
      stem: 一个正方形平均分成 2 份，涂了 1 份。涂色部分是这个正方形的几分之几？
      answer:
        type: choice
        choices:
          - id: a
            text: 2/1
            misconception: flip
            feedback: 总份数 2 写在横线下面。
          - id: b
            text: 1/1
            misconception: part-vs-rest
            feedback: 涂色的 1 份要和整个正方形的 2 份相比。
          - {id: c, text: 1/2, correct: true}
# END OF FILE
