tions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 共用零件：分数、「1」记号、圆钮、数线条  kit:parts ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 0 ? CN1[0] : n === 100 ? \"百\" : n === 999 ? \"九百九十九\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;                // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 3;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1q\", hold: false, press: false, kbd: false, dirty: true, t1: 0, p1: 0, t2: 0, p2: 0 };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.innerHTML = (a.hold ? RIDGES : \"\") + `<span>${a.label}<\/span>`;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); if (v) touched(); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(ev, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(true); } });\n      b.addEventListener(\"keyup\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(false); } });\n      b.addEventListener(\"blur\", () => on(false));\n      b.addEventListener(\"contextmenu\", e => e.preventDefault());\n 17,\"food\")+\n        P(box(x-50,194,100,17,3,.4))+TC(x,295,label,\"lb\");\n      return segment(left,86,left+width,86,\"k\")+ticks(100,left,75,width,11)+TC(mid,55,\"同一把 1 米尺\",\"ttl\")+\n        lens(158,22,\"离 1 米差 1 厘米\")+lens(395,2.2,\"离 1 米差 1 毫米\");\n    },discovery:\"先看在一半的哪边，再细比。1 米的 \"+F(99,100)+\" 差 1 厘米才满，\"+F(999,1000)+\" 只差 1 毫米。\",save:v=>v.drops.slice()\n  }];\nconst cardTitle=\"我排的队\";\nfunction cardArt(s){\n  return ranking({drops:s[3]},true)+strip(206,8,12)+strip(279,9,12,12,{color:\"sky\"});\n}\nconst cardCaption=s=>\"你把两对刀口都对齐了。\"+F(3,4)+\" 比 \"+F(2,3)+\" 多 \"+F(1,12)+\"。四张卡片里，\"+s[3].filter((p,i)=>grade(p,cards[i][0]/cards[i][1])===\"正中\").length+\" 张正中。\";\n\nHost.ready();\nfitView();\nenter1();\n<\/script>\n<\/body>\n<\/html>\n", "id": "act.simulation.match-cuts-01", "kind": "simulation", "targets": ["math.fraction.compare"], "title": "对刀口"}, {"age_band": "G5-6", "body": {"items": [{"answer": {"choices": [{"feedback": "8 比 6 大。把同一整块切得更细，每份会怎样？", "id": "a", "misconception": "bigger-denominator-bigger", "text": "八分之五"}, {"correct": true, "id": "b", "text": "六分之五"}, {"feedback": "取的份数一样，再看每一份是不是一样大。", "id": "c", "misconception": "numerator-only", "text": "一样大"}], "type": "choice"}, "feedback": {"correct": "切成六份时每份较大，同样取五份，六分之五较大。", "wrong": "想想同样多的小块，每块分别有多大。"}, "figure": {"src": "content/assets/math.fraction.compare/instrument.svg", "type": "svg"}, "hints": ["把两个相同的整条左端对齐。", "一个切八等份，一个切六等份，分别取五份。"], "id": "q1", "stem": "同一块蛋糕的八分之五和六分之五，哪一份更大？"}, {"answer": {"choices": [{"feedback": "都是差一份。那两份的长度一样吗？", "id": "a", "misconception": "gap-thinking", "text": "一样长"}, {"feedback": "每个四分之一确实更长，但取了多少份也要算进去。", "id": "b", "misconception": "piece-size-only", "text": "四分之三长"}, {"correct": true, "id": "c", "text": "五分之四长"}], "type": "choice"}, "feedback": {"correct": "五分之四差五分之一才满，四分之三差四分之一才满。差得少的更长。", "wrong": "两条都只剩一份，先比剩下的部分。"}, "hints": ["把两根彩带左端叠在一起。", "剩下的那一份分别有多宽？"], "id": "q2", "stem": "两根同样长的彩带，剪下四分之三和五分之四。哪一段长？"}, {"answer": {"accept_equivalent": fal cale(1.8);opacity:0}100%{transform:scale(1.8);opacity:0}}\n@media (prefers-reduced-motion:reduce){#cue{animation:none;transform:scale(1.3);opacity:.9}}\n/* kit:frac 2026-11-14 —— 分数一律上下结构（A.4 第 2 条）。HTML 里用 .frac，SVG 里用 fracS() */\n.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-family:var(--f-mono);font-size:.84em;margin:0 .2em;font-variant-numeric:tabular-nums}\n.frac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .28em .04em}\n.frac>span:last-child{padding:.04em .28em 0}\n.fl{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}\n.fs{fill:var(--ink);font-family:var(--f-mono);font-size:16px} .fm{fill:var(--ink);font-family:var(--f-mono);font-size:22px} .fb{fill:var(--ink);font-family:var(--f-mono);font-size:34px}\nbody.narrow .fs{font-size:20px} body.narrow .fm{font-size:26px} body.narrow .fb{font-size:38px}\n/* 模块自己的画面样式写在这里：字号全写在类上，窄屏在 body.narrow 里放大（教训 14、28）。下面几个类可以直接用 */\n.food{fill:var(--apricot)} .lead{fill:var(--accent)} .papr{fill:var(--paper)} .pane{fill:var(--pane)}\n.kacc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.one{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:7 6}\n.faint{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;opacity:.75}\n.lb{fill:var(--ink);font-family:var(--f-sans);font-size:17px}\n.lbg{fill:var(--muted);font-family:var(--f-sans);font-size:16px}\n.lbm{fill:var(--ink);font-family:var(--f-mono);font-size:17px}\n.big{fill:var(--ink);font-family:var(--f-mono);font-size:44px}\n.ttl{fill:var(--ink);font-family:var(--f-serif);font-size:26px}\n.sign{fill:var(--ink);font-family:var(--f-serif);font-size:24px}\n.tk{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round} .tkd{fill:none;stroke:var(--accent);stroke-width:1.1}\nbody.narrow .lb{font-size:21px} body.narrow .lbg{font-size:20px} body.narrow .lbm{font-size:20px}\n.hint{white-space:normal}.sky{fill:var(--sky)}.sage{fill:var(--sage)}\nbody.narrow .big{font-size:50px} body.narrow .ttl{font-size:30px} body.narrow .sign{font-size:28px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\"><\/span><h1 id=\"title\"><\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 800 610\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <g id=\"dyn\"><\/g>\n      <g id=\"fx\"><circle id=\"cue\" cx=\"0\" cy=\"0\" r=\"10\" style=\"display:none\"/><\/g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n      <rect id=\"touch\" x=\"-50\" y=\"0\" width=\"660\" height=\"365\" fill=\"transparent\"/><!-- 永不重画的触摸层（教训 25） -->\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: p d} .tkd{fill:none;stroke:var(--accent);stroke-width:1.1}\nbody.narrow .lb{font-size:21px} body.narrow .lbg{font-size:20px} body.narrow .lbm{font-size:20px}\nbody.narrow .big{font-size:50px} body.narrow .ttl{font-size:30px} body.narrow .sign{font-size:28px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\"><\/span><h1 id=\"title\"><\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 800 610\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <g id=\"fixed\"><\/g>\n      <g id=\"dyn\"><\/g>\n      <g id=\"fx\"><circle id=\"cue\" cx=\"0\" cy=\"0\" r=\"10\" style=\"display:none\"/><\/g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n      <rect id=\"touch\" x=\"-400\" y=\"-400\" width=\"1600\" height=\"1410\" fill=\"transparent\"/><!-- 永不重画的触摸层（教训 25） -->\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 共用零件：分数、「1」记号、圆钮、数线条  kit:parts ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 0 ? \"零\" : n === 100 ? \"百\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;                // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 3;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1q\", hold: false, press: false, kbd: false, dirty: true, t1: 0, p1: 0, t2: 0, p2: 0 };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\n n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 共用零件：分数、「1」记号、圆钮、数线条  kit:parts ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 0 ? \"零\" : n === 100 ? \"百\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;                // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 3;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1q\", hold: false, press: false, kbd: false, dirty: true, t1: 0, p1: 0, t2: 0, p2: 0 };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.innerHTML = (a.hold ? RIDGES : \"\") + `<span>${a.label}<\/span>`;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); if (v) touched(); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(ev, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(true); } });\n      b.addEventListener(\"keyup\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(false); } });\n      b.addEventListener(\"blur\", () => on(false));\n      b.addEventListener(\"contextmenu\", e => e.preventDefault());\n    } else {\n      b.addEventListener(\"click\", e => { if (performance.now() - born < 400 || (keyGuard && e.detail === 0)) return; a.go(e); });\n      if (guard){ b.disabled = true; const en = () => { setTimeout(() => { b.disabled = false; }, 120); removeEventListener(\"pointerup\", en, true); }; addEventListener(\"pointerup\", en, true); }\n    }\n    boxEl.append(b);\n  }\n  const first = boxEl.querySelector(\"button\");\n  if (first && !/^act/.test(S.mode)) first.focus({ preventScroll: true });\n  return boxEl;\n}\n// 猜测：只记下来，不在这里判对错的颜色。猜错的反馈先接住、再说清，然后一律去动手，让实物来回答\nfunction ask(question, options, onAnswer){\n  say(question);\n  actions(options.map((o, i) => ({ label: o.label, cls: \"choice\", go: () => {\n    if (!sentPred.has(S.station)){ sentPred.add(S.station); Host.event(\"predicted\", { station: S.station, choice: i, correct: !!o.correct, misconception: o.mis || null }); }\n    S.guess = S.guess || {}; S.guess[S.station] = o;\n    say(o.feedback, o.correct ? \"good\" : \"hmm\");\n    onAnswer(o);\n  }})));\n}\nfunction next(label, go, cls){ actions([{ label, go, cls }]); }\n// 星卡上选站重玩（#154）：replay 是正在重玩的站号，0 是从头往下走。重玩一站跳过开场和猜测题，直接进这一站的动手；\n// 揭晓完，原来「去第 k+1 站」「看我的星卡」的按钮换成「回星卡」（用 nextOr）。不出猜测题就不发 predicted；\n// observed 靠 observedOnce、complete 靠 completed，都只记第一次。每站怎么复位、怎么进动手是模块自己的事，写在 REPLAY[站号] 里\nlet replay = 0;\nconst REPLAY = {};\nfunction nextOr(label, go, cls){ if (replay) next(\"回星卡\", enterEnd); else next(label, go, cls); }\nfunction replayAt(k){ replay = k; gen++; S.station = k; hint(\"\"); readout(\"\"); disarmCue(); REPLAY[k](); }\nfunction restart(){ replay = 0; sentPred.clear(); sentObs.clear(); S.guess = {}; lastState = \"\"; enter1(); }   // 从头玩：和以前的「再玩一次」一样\nfunction endActions(){   // 星卡的按钮：从头玩 + 第 1 站…第 N 站。enterEnd() 最后调它\n  replay = 0;\n  actions([{ label: \"从头玩\", go: restart, cls: \"ghost tight\" }].concat(Array.from({ length: STATIONS }, (_, i) => ({ label: `第 ${i + 1} 站`, go: () => replayAt(i + 1), cls: \"tight\" }))));   // tight：手机上一行排得下\n}\n\n(function(){   // 「我有个问题」：随时可以问，发到信号站\n  const area = $(\"qarea\");\n  const open = document.createElement(\"button\");\n  open.type = \"button\"; open.className = \"btn ghost small\"; open.textContent = \"我有个问题\";\n  open.style.marginTop = \"12px\";\n  open.addEventListener(\"click\", () => {\n    if (area.querySelector(\"textarea\")) return;\n    const ta = document.createElement(\"textarea\"); ta.maxLength = 120; ta.placeholder = \"想问领航员什么？\";\n    const send = document.createElement(\"button\"); send.type = \"button\"; send.className = \"btn small\"; send.textContent = \"发给领航员\";\n    const bx = document.createElement(\"div\"); bx.className = \"qbox\"; bx.append(ta, send);\n    send.addEventListener(\"click\", () => { const q = ta.value.trim(); if (!q) return; Host.noteQuestion(q); bx.remove(); say(\"好问题，我记下来了。等会儿一起找答案。\"); });\n    area.append(bx); ta.focus();\n  });\n  area.append(open);\n})();\n\n// 第一屏的提醒（G6）：进入动手 1.5 秒还没碰，第一个圆钮外面扩出一圈细环；一碰就再也不出现\nlet cuePos = null, cueTimer = 0;\nfunction armCue(pos){ disarmCue(); const g = gen; cueTimer = setTimeout(() => { if (g === gen && /^act/.test(S.mode)){ cuePos = pos; S.dirty = true; } }, 1500); }\nfunction disarmCue(){ clearTimeout(cueTimer); cuePos = null; cueEl.style.display = \"none\"; }\nfunction touched(){ if (cuePos || cueTimer) disarmCue(); cueTimer = 0; }\nfunction placeCue(){ if (!cuePos) return; const [x, y, r] = cuePos(); cueEl.setAttribute(\"cx\", r1(x)); cueEl.setAttribute(\"cy\", r1(y)); cueEl.setAttribute(\"r\", r1((r || gripR()) + 2)); cueEl.style.display = \"\"; }   // 第三个数是被提醒的东西的半径（托里的一个）\n\n// 窄屏：viewBox 缩到中间 600 宽的操作区，字号类放大（教训 13、28）。每个场景写明自己用到的高度\n// 排版规矩：要紧的东西都画在 x = 110～690 之间；每个场景在这里写 [起始 y, 高度]\nconst VIEW = { question: [78, 235], work: [8, 440], end: [8, 520] };\nfunction fitView(){\n  const nar = (svg.clientWidth || 800) < 600, [y, h] = VIEW[S.scene] || [0, 610];\n  document.body.classList.toggle(\"narrow\", nar);\n  const v = (nar ? [100, y, 600, h] : [0, y, 800, h]).join(\" \");\n  if (svg.getAttribute(\"viewBox\") !== v){ svg.setAttribute(\"viewBox\", v); S.dirty = true; }\n}\naddEventListener(\"resize\", fitView);\nfunction scene(name){ S.scene = name; fitView(); S.dirty = true; }\n\n/* ============ 工作台：先猜、动手、揭晓、带走自己的星卡 ============ */\nconst model = {};   // 当前这张工作台上的实物\nconst album = {};   // 已做完的站留下的作品\nlet zones = [], drag = null, commandKey = \"\", holdTime = 0;\nfunction rect(x, y, w, h, fill, radius = 2, extra = \"\") {\n  return `<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"${radius}\" fill=\"var(--${fill})\" ${extra}/>`;\n}\nfunction line(x, y, xx, yy, style = \"k1\") { return P(Sk.line(x,y,xx,yy,13,.28),style); }\nfunction repeat(n, draw) { return Array.from({length:n}, (_,i) => draw(i)).join(\"\"); }\nfunction opening(text) {\n  return rect(176,115,448,154,\"paper\",14) + P(box(176,115,448,154,11,.8),\"k\") + TC(400,205,text,\"ttl\");\n}\nfunction knob(x,y,dir,id,options = {}) {\n  if (S.mode !== \"act\") return \"\";\n  zones.push({x,y,id,r:hitR()});\n  return grip(x,y,dir,options);\n}\nfunction beginStation(n) {\n  gen++; S.station=n; S.mode=\"talk\"; S.hold=false; disarmCue(); scene(\"question\");\n  const spec=stations[n-1];\n  head(n,spec.name); hint(\"\"); readout(\"\"); say(spec.intro);\n  next(\"猜一猜\", () => ask(spec.question,spec.choices, () => next(\"动手试\",() => operate(n))));\n}\nfunction operate(n) {\n  gen++; S.station=n; S.mode=\"act\"; S.hold=false; drag=null; holdTime=0; commandKey=null;\n  const spec=stations[n-1];\n  head(n,spec.name); scene(\"work\"); $(\"fixed\").innerHTML=spec.fixed?.() || \"\";\n  spec.reset(); say(spec.instruction); hint(spec.hint); update();\n  svg.focus({preventScroll:true}); armCue(() => zones.length ? [zones[0].x,zones[0].y] : [400,300]);\n}\nconst enter1 = () => beginStation(1);\nfor (const n of [1,2,3]) REPLAY[n]=() => operate(n);\nfunction reveal() {\n  const spec=stations[S.station-1];\n  spec.save(); S.hold=false; S.mode=\"reveal\"; disarmCue(); observedOnce(S.station);\n  render(); hint(\"\"); const guess=!replay && S.guess?.[S.station];\n  say((guess ? \"你猜的是「\"+guess.label+\"」。\" : \"\")+spec.reveal,\"good\");\n  nextOr(S.station===3 ? \"看我的星卡\" : `去第 ${S.station+1} 站`,\n         S.station===3 ? enterEnd : () => beginStation(S.station+1));\n}\nfunction enterEnd() {\n  gen++; S.station=4; S.mode=\"end\"; head(0,cardTitle); hint(\"\"); readout(\"\"); disarmCue(); scene(\"end\");\n  say(cardMessage,\"good\"); if (!completed){completed=true; Host.complete({});} endActions();\n}\nfunction update() {\n  if (S.mode!==\"act\") return;\n  const spec=stations[S.station-1];\n  sendState({station:S.station,...spec.state()}); readout(spec.read());\n  hint(spec.done() ? \"这站做好了，还可以接着试\" : spec.progress?.() || spec.hint);\n  const buttons=spec.buttons ? spec.buttons() : [];\n  if (spec.done()) buttons.push({label:\"看发现\",go:reveal});\n  const key=buttons.map(b=>b.label).join(\"|\");\n  if(key!==commandKey || !$(\"actions\").dataset.active){\n    commandKey=key; actions(buttons); $(\"actions\").dataset.active=\"1\";\n  }\n  render();\n}\nfunction render() {\n  zones=[];\n  $(\"fixed\").style.display=S.scene===\"work\" ? \"\" : \"none\";\n  if(S.scene===\"end\") gDyn.innerHTML=card();\n  else {\n    const spec=stations[S.station-1];\n    gDyn.innerHTML=S.scene===\"question\" ? spec.open() : spec.draw();\n  }\n  placeCue();\n}\nfunction point(e) {\n  const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse());\n}\nfunction target(p) {\n  if(S.mode!==\"act\")return null;\n  return zones.map(z=>({z,dist:Math.hypot(z.x-p.x,z.y-p.y)})).filter(a=>a.dist<=a.z.r)\n    .sort((a,b)=>a.dist-b.dist)[0]?.z;\n}\nsvg.addEventListener(\"touchstart\",e=>{if(e.touches[0] && target(point(e.touches[0])))e.preventDefault();},{passive:false});\nsvg.addEventListener(\"pointerdown\",e=>{\n  if(drag)return;\n  const p=point(e),z=target(p);\n  if(!z)return;\n  e.preventDefault(); touched(); svg.focus({preventScroll:true});\n  drag={id:z.id,start:p,now:p,pointer:e.pointerId}; svg.setPointerCapture(e.pointerId); render();\n});\nsvg.addEventListener(\"pointermove\",e=>{\n  if(!drag || e.pointerId!==drag.pointer){svg.style.cursor=target(point(e)) ? \"grab\" : \"\";return;}\n  drag.now=point(e); stations[S.station-1].move?.(drag); update();\n});\nsvg.addEventListener(\"pointerup\",e=>{\n  if(!drag || e.pointerId!==drag.pointer)return;\n  const current=drag; drag=null; current.now=point(e);\n  if(S.mode===\"act\"){stations[S.station-1].drop?.(current); update();}\n});\nfor(const event of [\"pointercancel\",\"lostpointercapture\"])svg.addEventListener(event,e=>{\n  if(drag && drag.pointer===e.pointerId){drag=null; S.dirty=true;}\n});\nsvg.addEventListener(\"keydown\",e=>{\n  if(S.mode!==\"act\")return;\n  if(stations[S.station-1].key(e)){\n    e.preventDefault(); touched(); svg.classList.add(\"kbd\"); update();\n  }\n});\nsvg.addEventListener(\"keyup\",e=>{if(e.key===\" \"){S.hold=false;holdTime=0;}});\nlet lastFrame=0;\nfunction tick(now){\n  if(S.mode===\"act\" && S.hold && stations[S.station-1].pour){\n    holdTime+=Math.min(100,now-lastFrame);\n    if(holdTime>=150){holdTime=0; stations[S.station-1].pour(); update();}\n  } else holdTime=150;\n  lastFrame=now;\n  if(S.dirty){S.dirty=false;render();}\n  requestAnimationFrame(tick);\n}\n/* 一块板横竖等分，交集是 a × c 小块，整板是 b × d 小块。*/\nconst MODEL={maxDen:6, boards:[[2,1,3,1],[3,2,4,3]], strips:[[3,2,5],[4,2,3]]};\nconst cardTitle=\"我切的巧克力\",cardMessage=\"换一种切法，半块巧克力还是半块。看看你收集到的三个算式。\";\nconst boardX=250, boardY=110, boardW=300,boardH=172;\nfunction clearBoard(){\n  Object.assign(model,{b:2,d:2,cols:new Set(),rows:new Set()});\n}\nfunction snapshot(){\n  return {b:model.b,a:model.cols.size,d:model.d,c:model.rows.size,pieces:model.b*model.d,taken:model.cols.size*model.rows.size};\n}\nfunction matchCut(){\n  const {b,a,d,c}=snapshot();\n  const goal=MODEL.boards[model.recipe];\n  return [b,a,d,c].every((v,i)=>v===goal[i]);\n}\nfunction halfMatch(){\n  const {a,b,c,d,taken,pieces}=snapshot();\n  return a<b && c<d && 2*taken===pieces;\n}\nfunction saveHalf(){\n  if(!halfMatch())return;\n  const {a,b,c,d}=snapshot(),key=[a,b,c,d].join(\":\");\n  if(!model.halves.has(key)&&model.halves.size<3)model.halves.set(key,[a,b,c,d]);\n}\nfunction switchDen(axis,value){\n  const n=clamp(Math.round(value),2,MODEL.maxDen);\n  if(n===model[axis])return;\n  model[axis]=n;\n  (axis===\"b\"?model.cols:model.rows).clear();\n}\nfunction toggle(axis,i){\n  const set=axis===\"b\"?model.cols:model.rows;\n  if(i>=0 && i<model[axis]){\n    if(set.has(i))set.delete(i);else set.add(i);\n    if(S.station===3)saveHalf();\n  }\n}\nfunction smallGrip(x,y,id){\n  if(S.mode!==\"act\")return \"\";\n  zones.push({x,y,id,r:hitR()});\n  return `<circle cx=\"${x}\" cy=\"${y}\" r=\"9\" class=\"gfill\"/>`+P(Sk.ellipse(x,y,9,9,22,.3),\"gring\")+\n    line(x-2,y-4,x-2,y+4,\"gridge\")+line(x+2,y-4,x+2,y+4,\"gridge\");\n}\nfunction chocolate(x,y,w,h,b,d,cols,rows){\n  const dx=w/b,dy=h/d;\n  let s=rect(x-3,y-3,w+6,h+6,\"paper\",5);\n  for(let c=0;c<b;c++)for(let r=0;r<d;r++){\n    const cx=x+c*dx,cy=y+r*dy, selected=cols.has(c), both=selected&&rows.has(r);\n    s+=rect(cx+2,cy+2,dx-4,dy-4,both?\"accent\":selected?\"sage\":\"apricot\",4);\n    s+=P(`M${cx+7} ${cy+dy-8}V${cy+8}H${cx+dx-7}`,\"faint\");\n    if(both)s+=line(cx+8,cy+dy-9,cx+dx-7,cy+8,\"k1\");\n  }\n  for(let c=1;c<b;c++)s+=line(x+c*dx,y,x+c*dx,y+h);\n  for(let r=1;r<d;r++)s+=line(x,y+r*dy,x+w,y+r*dy,\"kf\");\n  return s;\n}\nfunction dial(axis,x,y){\n  const val=model[axis];\n  return P(Sk.ellipse(x,y,23,23,25,.5),\"k\")+knob(x,y,[1,0],axis)+\n    TC(x,y+50,`${val} ${axis===\"b\"?\"列\":\"行\"}`,\"lb\");\n}\nfunction halfCards(x,y){\n  return [...model.halves.values()].map(([a,b,c,d],i)=>{\n    const xx=x+i*147;\n    return rect(xx,y,132,59,\"paper\",6)+fracS(xx+30,y+27,a,b,\"fs\")+TC(xx+64,y+33,\"×\",\"lb\")+fracS(xx+98,y+27,c,d,\"fs\");\n  }).join(\"\");\n}\nfunction badgeSet(n){return new Set(Array.from({length:n},(_,i)=>i));}\nfunction earth(){\n  return chocolate(258,73,285,240,10,10,badgeSet(3),badgeSet(1))+TC(400,380,\"地球表面 · 约 3 个百分之一是耕地\",\"lb\");\n}\nfunction drawBoard(){\n  if(S.station===3 && S.mode===\"reveal\")return earth();\n  let s=dial(\"b\",166,138)+dial(\"d\",628,138)+\n    chocolate(boardX,boardY,boardW,boardH,model.b,model.d,model.cols,model.rows);\n  for(let i=0;i<model.b;i++)s+=smallGrip(boardX+(i+.5)*boardW/model.b,boardY-21,\"col\"+i);\n  for(let i=0;i<model.d;i++)s+=smallGrip(boardX-22,boardY+(i+.5)*boardH/model.d,\"row\"+i);\n  if(S.station===3){\n    const ratio=snapshot().taken/snapshot().pieces;\n    s+=rect(245,304,300*ratio,16,\"accent\")+P(box(245,304,150,16,40,.4),\"one\")+\n      T(558,321,\"半块线\",\"lb\")+halfCards(185,362);\n  } else {\n    const [b,a,d,c]=MODEL.boards[model.recipe];\n    s+=TC(400,358,`把板切成 ${b} 列，选 ${a} 列`,\"lb\")+TC(400,396,`再切 ${d} 行，选 ${c} 行`,\"lb\");\n  }\n  return s;\n}\nfunction boardRead(){\n  const {a,b,c,d,pieces,taken}=snapshot();\n  return `${F(a,b)} 的 ${F(c,d)} · 共 ${b} × ${d} = ${pieces} 小块 · 取到 ${taken} 块 · <b>${F(taken,pieces)}<\/b>`;\n}\nfunction boardKeys(e){\n  if(e.key.startsWith(\"Arrow\")){\n    const horizontal=[\"ArrowLeft\",\"ArrowRight\"].includes(e.key),axis=horizontal?\"b\":\"d\";\n    switchDen(axis,model[axis]+([\"ArrowRight\",\"ArrowUp\"].includes(e.key)?1:-1));return true;\n  }\n  const number=/^Digit([1-6])$/.exec(e.code)?.[1] || (/^[1-6]$/.test(e.key)?e.key:\"\");\n  if(!number)return false;\n  if(!e.repeat)toggle(e.shiftKey?\"d\":\"b\",Number(number)-1);\n  return true;\n}\nfunction slideDial(drag){\n  if(![\"b\",\"d\"].includes(drag.id))return;\n  const dx=drag.now.x-drag.start.x;\n  if(drag.original==null)drag.original=model[drag.id];\n  switchDen(drag.id,drag.original+Math.round(dx/22));\n}\nfunction dropBoard(drag){\n  if([\"b\",\"d\"].includes(drag.id)){\n    if(Math.abs(drag.now.x-drag.start.x)<7){\n      const n=model[drag.id];\n      switchDen(drag.id,n===6?2:n+1);\n    }else slideDial(drag);\n  }\n  else if(Math.hypot(drag.now.x-drag.start.x,drag.now.y-drag.start.y)<hitR())\n    toggle(drag.id.startsWith(\"col\")?\"b\":\"d\",Number(drag.id.slice(3)));\n}\nfunction changeBoard(){model.recipe=1; clearBoard();say(\"再来一块。竖着三列取两列，横着四行取三行。\");update();svg.focus({preventScroll:true});}\nfunction stripShape(x,y,w,h,parts,filled){\n  let s=rect(x,y,w,h,\"paper\",4)+rect(x,y,w*filled/parts,h,\"apricot\",3);\n  for(let i=1;i<parts;i++)s+=line(x+i*w/parts,y,x+i*w/parts,y+h);\n  return s+P(box(x,y,w,h,17,.4),\"k1\");\n}\nfunction stripState(){\n  const [times,num,den]=MODEL.strips[model.recipe],n=model.units,whole=Math.floor(n/den),rest=n%den;\n  return {times,frac:[num,den].join(\"/\"),units:n,mixed:rest?([whole,[rest,den].join(\"/\")].filter(Boolean).join(\" \")):String(whole)};\n}\nfunction stripRead(){\n  const [times,num,den]=MODEL.strips[model.recipe],n=model.units;\n  return `${n} 个 ${F(1,den)} · ${F(n,den)}`+\n    (n>=den ? ` = <b>${Math.floor(n/den)}${n%den?\" 又 \"+F(n%den,den):\"\"}<\/b>`:\"\");\n}\nfunction stripDraw(){\n  const [times,num,den]=MODEL.strips[model.recipe],n=model.units, width=99, gap=128,x0=400-((times-1)*gap+width)/2;\n  let s=\"\";\n  for(let i=0;i<times;i++){\n    const x=x0+i*gap;\n    s+=stripShape(x,92,width,47,den,0);\n    for(let j=0;j<num;j++){\n      const index=i*num+j;\n      if(index>=n)s+=rect(x+width*j/den+1,93,width/den-2,45,index===n?\"accent\":\"apricot\");\n      if(index===n)s+=knob(x+width*(j+.5)/den,65,[0,1],\"piece\");\n    }\n  }\n  for(let row=0;row<Math.ceil(times*num/den);row++)\n    s+=stripShape(250,208+64*row,300,40,den,clamp(n-row*den,0,den));\n  if(drag?.id===\"piece\")s+=rect(drag.now.x-16,drag.now.y-10,32,20,\"accent\",2);\n  return s;\n}\nfunction addUnit(){const [times,num]=MODEL.strips[model.recipe];model.units=Math.min(times*num,model.units+1);}\nfunction nextStrip(){model.recipe=1;model.units=0;say(\"这回拼四个三分之二。一共能拼满几根？\");update();svg.focus({preventScroll:true});}\nconst stations=[\n {name:\"切两次 · 两层颜色\",intro:\"舰长拿走半块巧克力，把这一半的三分之一分给领航员。领航员究竟拿到多少？\",\n  open:()=>opening(\"半块的三分之一\"),question:\"拿到的是整块巧克力的几分之几？\",\n  choices:[{label:F(2,5),mis:\"add-instead-of-of\",feedback:\"你把两个数合起来了。看看第二刀切的是哪一块。\"},\n    {label:F(1,6),correct:true,feedback:\"把板切开，到时能直接数出来。\"},\n    {label:F(1,5),mis:\"add-denominators\",feedback:\"先数数切成几列、几行。小块总数会是多少？\"}],\n  hint:\"拖或点圆盘切份 · 点边钮选行列\",instruction:\"带圆钮的地方都能抓。拖两侧圆盘改变份数，点板上方选列、点左边选行。\",\n  reset(){model.recipe=0;clearBoard();},fixed:()=>oneMark(241,101,318,190,32,{below:true}),\n  draw:drawBoard,move:slideDial,drop:dropBoard,key:boardKeys,state:snapshot,read:boardRead,\n  buttons:()=>!model.recipe && matchCut()?[{label:\"换一块\",go:changeBoard}]:[],\n  done:()=>model.recipe===1 && matchCut(),save(){album.first=snapshot();},\n  reveal:\"竖着 3 列，横着 4 行，整块有 12 小块。选中的 2 列和 3 行有 6 块重叠。分母相乘数所有小块，分子相乘数重叠的小块。\"},\n {name:\"拼一拼 · 份的大小\",intro:\"每段长五分之二米。三段接起来会比一米还长吗？\",\n  open:()=>opening(\"3 个五分之二\"),question:\"3 个五分之二是多少？\",\n  choices:[{label:F(6,15),mis:\"multiply-both\",feed nt-family:var(--f-mono);font-size:.84em;margin:0 .2em;font-variant-numeric:tabular-nums}\n.frac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .28em .04em}\n.frac>span:last-child{padding:.04em .28em 0}\n.fl{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}\n.fs{fill:var(--ink);font-family:var(--f-mono);font-size:16px} .fm{fill:var(--ink);font-family:var(--f-mono);font-size:22px} .fb{fill:var(--ink);font-family:var(--f-mono);font-size:34px}\nbody.narrow .fs{font-size:20px} body.narrow .fm{font-size:26px} body.narrow .fb{font-size:38px}\n/* 模块自己的画面样式写在这里：字号全写在类上，窄屏在 body.narrow 里放大（教训 14、28）。下面几个类可以直接用 */\n.food{fill:var(--apricot)} .lead{fill:var(--accent)} .papr{fill:var(--paper)} .pane{fill:var(--pane)}\n.kacc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.one{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:7 6}\n.faint{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;opacity:.75}\n.lb{fill:var(--ink);font-family:var(--f-sans);font-size:17px}\n.lbg{fill:var(--muted);font-family:var(--f-sans);font-size:16px}\n.lbm{fill:var(--ink);font-family:var(--f-mono);font-size:17px}\n.big{fill:var(--ink);font-family:var(--f-mono);font-size:44px}\n.ttl{fill:var(--ink);font-family:var(--f-serif);font-size:26px}\n.sign{fill:var(--ink);font-family:var(--f-serif);font-size:24px}\n.tk{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round} .tkd{fill:none;stroke:var(--accent);stroke-width:1.1}\nbody.narrow .lb{font-size:21px} body.narrow .lbg{font-size:20px} body.narrow .lbm{font-size:20px}\nbody.narrow .big{font-size:50px} body.narrow .ttl{font-size:30px} body.narrow .sign{font-size:28px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\"><\/span><h1 id=\"title\"><\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 800 610\" tabindex=\"0\" role=\"application\" a ult }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 共用零件：分数、「1」记号、圆钮、数线条  kit:parts ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 0 ? \"零\" : n === 100 ? \"百\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;                // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 3;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1q\", hold: false, press: false, kbd: false, dirty: true, t1: 0, p1: 0, t2: 0, p2: 0 };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.innerHTML = (a.hold ? RIDGES : \"\") + `<span>${a.label}<\/span>`;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); if (v) touched(); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(ev, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(true); } });\n      b.addEventListener(\"keyup\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(false); } });\n      b.addEventListener(\"blur\", () => on(false));\n      b.addEventListener(\"contextmenu\", e => e.preventDefault());\n    } else {\n      b.addEventListener(\"click\", e => { if (performance.now() - born < 400 || (keyGuard && e.detail === 0)) return; a.go(e); });\n      if (guard){ b.disabled = true; const en = () => { setTimeout(() => { b.disabled = false; }, 120); removeEventListener(\"pointerup\", en, true); }; addEventListener(\"pointerup\", en, true); }\n    }\n    boxEl.append(b);\n  }\n  const first = boxEl.querySelector(\"button\");\n  if (first && !/^act/.test(S.mode)) first.focus({ preventScroll: true });\n  return boxEl;\n}\n// 猜测：只记下来，不在这里判对错的颜色。猜错的反馈先接住、再说清，然后一律去动手，让实物来回答\nfunction ask(question, options, onAnswer){\n  say(question);\n  actions(options.map((o, i) => ({ label: o.label, cls: \"choice\", go: () => {\n    if (!sentPred.has(S.station)){ sentPred.add(S.station); Host.event(\"predicted\", { station: S.station, choice: i, correct: !!o.correct, misconception: o.mis || null }); );\n  area.append(open);\n})();\n\n// 第一屏的提醒（G6）：进入动手 1.5 秒还没碰，第一个圆钮外面扩出一圈细环；一碰就再也不出现\nlet cuePos = null, cueTimer = 0;\nfunction armCue(pos){ disarmCue(); const g = gen; cueTimer = setTimeout(() => { if (g === gen && /^act/.test(S.mode)){ cuePos = pos; S.dirty = true; } }, 1500); }\nfunction disarmCue(){ clearTimeout(cueTimer); cuePos = null; cueEl.style.display = \"none\"; }\nfunction touched(){ if (cuePos || cueTimer) disarmCue(); cueTimer = 0; }\nfunction placeCue(){ if (!cuePos) return; const [x, y, r] = cuePos(); cueEl.setAttribute(\"cx\", r1(x)); cueEl.setAttribute(\"cy\", r1(y)); cueEl.setAttribute(\"r\", r1((r || gripR()) + 2)); cueEl.style.display = \"\"; }   // 第三个数是被提醒的东西的半径（托里的一个）\n\n// 窄屏：viewBox 缩到中间 600 宽的操作区，字号类放大（教训 13、28）。每个场景写明自己用到的高度\n// 排版规矩：要紧的东西都画在 x = 110～690 之间；每个场景在这里写 [起始 y, 高度]\nconst VIEW = { question: [78, 235], work: [8, 440], end: [8, 520] };\nfunction fitView(){\n  const nar = (svg.clientWidth || 800) < 600, [y, h] = VIEW[S.scene] || [0, 610];\n  document.body.classList.toggle(\"narrow\", nar);\n  const v = (nar ? [100, y, 600, h] : [0, y, 800, h]).join(\" \");\n  if (svg.getAttribute(\"viewBox\") !== v){ svg.setAttribute(\"viewBox\", v); S.dirty = true; }\n}\naddEventListener(\"resize\", fitView);\nfunction scene(name){ S.scene = name; fitView(); S.dirty = true; }\n\n/* ============ 工作台：先猜、动手、揭晓、带走自己的星卡 ============ */\nconst model = {};   // 当前这张工作台上的实物\nconst album = {};   // 已做完的站留下的作品\nlet zones = [], drag = null, commandKey = \"\", holdTime = 0;\nfunction rect(x, y, w, h, fill, radius = 2, extra = \"\") {\n  return `<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"${radius}\" fill=\"var(--${fill})\" ${extra}/>`;\n}\nfunction line(x, y, xx, yy, style = \"k1\") { return P(Sk.line(x,y,xx,yy,13,.28),style); }\nfunction repeat(n, draw) { return Array.from({length:n}, (_,i) => draw(i)).join(\"\"); }\nfunction opening(text) {\n  return rect(176,115,448,154,\"paper\",14) + P(box(176,115,448,154,11,.8),\"k\") + TC(400,20 ist.add(\"kbd\"); update();\n  }\n});\nsvg.addEventListener(\"keyup\",e=>{if(e.key===\" \"){S.hold=false;holdTime=0;}});\nlet lastFrame=0;\nfunction tick(now){\n  if(S.mode===\"act\" && S.hold && stations[S.station-1].pour){\n    holdTime+=Math.min(100,now-lastFrame);\n    if(holdTime>=150){holdTime=0; stations[S.station-1].pour(); update();}\n  } else holdTime=150;\n  lastFrame=now;\n  if(S.dirty){S.dirty=false;render();}\n  requestAnimationFrame(tick);\n}\n/* 同一桶 6 升水。杯数 = 6 × 分母 ÷ 分子。小杯的容量均大于零。 */\nconst MODEL={litres:6, cups:[[2,1],[1,1],[1,2],[1,3]], cutCups:[[3,4],[2,3]], ribbon:[3,4], stick:[1,8]};\nconst cardTitle=\"我倒的水\", cardMessage=\"你留下的每一道圈和每一个刻度，都量出了一个「里面有几个」。\";\nfunction ratioText(a,b){return b===1?String(a):F(a,b);}\nfunction ratioKey([a,b]){return b===1?String(a):[a,b].join(\"/\");}\nfunction capacityCount([a,b]){return MODEL.litres*b/a;}\nfunction bucket(x,y,litres){\n  const w=129,h=184,top=y+h*(1-litres/MODEL.litres);\n  let s=rect(x+2,top+1,w-4,Math.max(0,y+h-top-2),\"sky\",4)+\n    P(`M${x} ${y}v${h-10}q0 10 10 10h${w-20}q10 0 10-10V${y}Z`,\"k\")+\n    P(`M${x+13} ${y}Q${x+w/2} ${y-58} ${x+w-13} ${y}`,\"k\");\n  for(let i=1;i<=6;i++)s+=line(x,y+h-h*i/6,x+20,y+h-h*i/6);\n  return s+oneMark(x-10,y+h-h/6,w+20,h/6,101,{below:true})+TC(x+w/2,y+h+45,\"每格 1 升\",\"lb\");\n}\nfunction cup(x,y,w,h,filled,active=false){\n  return `<path d=\"M${x} ${y}h${w}l${-w*.1} ${h}h${-w*.8}z\" fill=\"var(--${filled?(active?\"accent\":\"sky\"):\"pane\"})\" stroke=\"var(--ink)\" stroke-width=\"1.6\"/>`;\n}\nfunction selectCup(i){\n  const next=clamp(i,0,MODEL.cups.length-1);\n  if(next===model.cupIndex)return;\n  model.cupIndex=next;model.count=0;S.hold=false;\n}\nfunction pourOne(){\n  const limit=capacityCount(MODEL.cups[model.cupIndex]);model.count=Math.min(limit,model.count+1);\n  if(model.count===limit){model.seen.add(model.cupIndex);S.hold=false;}\n}\nfunction drawPour(){\n  const [a,b]=MODEL.cups[model.cupIndex], left=MODEL.litres-model.count*a/b,limit=capacityCount([a,b]);\n  let s=bucket(174,98,left);\n  const columns=limit>12?6:limit>3?4:3, width=clamp(22+12*a/b,22,53),height=clamp(14+21*a/b,20,60);\n  for(let i=0;i<limit;i++){\n    const x=362+(i%columns)*45+(47-width)/2,y=124+Math.floor(i/columns)*63;\n    s+=cup(x,y-height/2,width,height,i<model.count,i===model.count-1);\n  }\n  s+=rect(172,341,456,65,\"paper\",28);\n  for(let i=0;i<MODEL.cups.length;i++){\n    const [p,q]=MODEL.cups[i],x=225+116*i;\n    if(i===model.cupIndex)s+=P(Sk.ellipse(x,373,47,32,13,.5),\"gring on\");\n    if(S.mode===\"act\")zones.push({id:\"cup\"+i,x,y:373,r:hitR()});\n    s+=(q===1?TC(x,380,p,\"fm\"):fracS(x,371,p,q,\"fs\"));\n    if(model.seen.has(i))s+=P(`M${x+27} 361l4 5 8-12`,\"k\");\n  }\n  return s;\n}\nfunction cutState(){\n  const div=MODEL.cutCups[model.recipe];return {divisor:ratioKey(div),parts:model.cut?MODEL.litres*div[1]:MODEL.litres,cups:model.count};\n}\nfunction cutWater(){\n  model.cut=true;\n}\nfunction fillGroup(){\n  if(!model.cut)return;\n  const limit=capacityCount(MODEL.cutCups[model.recipe]);model.count=Math.min(limit,model.count+1);\n  if(model.count===limit)S.hold=false;\n}\nfunction measuredWater(x,y,width,parts,perCup,cups){\n  const columns=parts>12 ? Math.ceil(parts/(2*perCup))*perCup : parts,dx=width/columns,height=43;\n  let s=\"\", rings=\"\";\n  for(let i=0;i<parts;i++){\n    const col=i%columns,row=Math.floor(i/columns),xx=x+dx*col, yy=y+row*65;\n    s+=rect(xx+1,yy,dx-2,height,\"sky\",1,'stroke=\"var(--ink)\" stroke-width=\"1\"');\n    if(i%perCup===0 && i<perCup*cups){\n      // 每行的格数都能分成整杯。两行之间不拆开一杯。\n      rings+=P(box(xx+1,yy-5,dx*perCup-2,height+10,99+i,.45),\"kacc\");\n    }\n  }\n  return s+rings;\n}\nfunction drawGroups(){\n  const [a,b]=MODEL.cutCups[model.recipe],parts=model.cut?MODEL.litres*b:MODEL.litres;\n  return TC(400,94,model.cut?`每升切成 ${b} 小格`:\"每格 1 升 · 共 6 升\",\"ttl\")+\n    measuredWater(174,144,452,parts,model.cut?a:1,model.count)+\n    (model.cut?TC(400,312,`每 ${a} 小格装 1 杯 · 已装 $ },\n   reveal:\"6 升水，杯子从十分之一升缩到千分之一升，杯数从 60 涨到 6000。如果一杯装 0 升，再多杯合起来也装不下 6 升。所以 6 除以 0 没有答案。\"}\n];\nfunction card(){\n  return T(158,58,cardTitle,\"ttl\")+MODEL.cups.map(([a,b],i)=>{\n    const x=202+i*128;\n    return cup(x-18,90,36,36,album.sizes.includes(i))+(b===1?TC(x,153,a+\" 升\",\"lb\"):fracS(x,150,a,b,\"fs\"))+TC(x,193,`${capacityCount([a,b])} 杯`,\"lb\");\n  }).join(\"\")+measuredWater(174,217,452,24,3,album.groups)+\n    T(174,383,\"一条丝带 · 六个八分之一米\",\"lb\")+\n    rect(174,409,390,20,\"apricot\")+repeat(album.marks,i=>line(174+65*(i+1),399,174+65*(i+1),435,\"kacc\"))+\n    line(175,474,625,474)+[2,1,.5,.001].map((volume,i)=>{\n      const x=625-225*volume;\n      return line(x,467,x,482)+TC(x,512,[\"2 升\",\"1 升\",\"半升\",\"0.001 升\"][i],\"lb\");\n    }).join(\"\");\n}\n\nHost.ready();\nfitView();\nenter1();\nrequestAnimationFrame(tick);\n<\/script>\n<\/body>\n<\/html>\n", "id": "act.simulation.pour-cups-01", "kind": "simulation", "targets": ["math.fraction.divide"], "title": "倒水"}, {"age_band": "G5-6", "body": {"items": [{"answer": {"common_wrong": [{"feedback": "你把水分成了两份。这里每半升就算一杯。", "misconception": "divide-as-halve", "value": 2}, {"feedback": "4 杯是每杯装 1 升时的杯数。再换成小杯看看。", "misconception": "fraction-ignored", "value": 4}], "tolerance": 0, "type": "number", "unit": "杯", "value": 8}, "feedback": {"correct": "1 升可以装 2 个半升杯，4 升里有 8 个半升。", "wrong": "先看 1 升能装几杯。"}, "hints": ["先看 1 升能装几杯。", "有 4 个这样的 1 升。"], "id": "q1", "stem": "一壶水有 4 升，每半升装一杯，能装满几杯？"}, {"answer": {"common_wrong": [{"feedback": "0.75 是这壶水的四分之一。我们要数的是整壶里有几个四分之一升。", "misconception": "multiply-instead", "value": 0.75}], "tolerance": 0, "type": "number", "unit": "杯", "value": 12}, "feedback": {"correct": "每升分成 4 个四分之一升，3 升共有 12 杯。", "wrong": "把 1 升水切成四等份，每份装一杯。"}, "hints": ["把 1 升水切成四等份，每份装一杯。", "3 升里有几组这样的杯子？"], "id": "q2", "stem": "3 升水，每杯装四分之一升。能倒满几杯？"}, {"answer": {"common_wrong": [{"feedback": "4 升是 6 升的三分之二。这里要把 6 升都装进杯子。", "misconception": "multiply-instead", "value": 4}, {"feedback": "杯子装的是 2
