*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 120px}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.topbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 18px;min-height:56px}
.topbar .title{flex:1;font-family:var(--f-serif);font-weight:600;color:var(--ink);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:1px solid var(--rule);background:var(--pane);border-radius:10px;padding:6px 12px;font-size:15px}
.tag{font-size:12px;color:var(--muted);border:1px dashed var(--rule);border-radius:999px;padding:1px 9px;white-space:nowrap}
h1,h2,h3{font-family:var(--f-serif);color:var(--ink);line-height:1.35;margin:0}
.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* 首页 */
.hero{margin:22px 0 8px;padding:22px;border-radius:18px;background:var(--c-sci-bg);display:flex;gap:16px;align-items:center}
.hero .eyebrow{font-size:13px;color:var(--muted);letter-spacing:.05em}
.hero h1{font-size:28px;margin:4px 0 6px}
.hero p{margin:0}
.hero svg{flex:none;width:96px;height:96px}
.note{font-size:14px;color:var(--muted);margin:10px 2px 18px}
.line{position:relative;padding-left:34px}
.line:before{content:"";position:absolute;left:13px;top:18px;bottom:18px;border-left:2px dashed var(--c-sci-2)}
.star{position:relative;background:var(--pane);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;margin:0 0 16px;box-shadow:var(--shadow)}
.star .dot{position:absolute;left:-34px;top:16px;width:28px;height:28px;border-radius:50%;background:var(--c-sci);border:2px solid var(--ink);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink)}
.star h2{font-size:20px}
.star .dq{font-family:var(--f-hand);color:var(--ink);font-size:18px;margin:6px 0 12px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.act{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--bg);border-radius:12px;padding:9px 14px;min-height:48px;font-size:16px}
.act:hover{background:var(--hover)}
.act small{color:var(--muted);font-size:13px}
.act.done{background:var(--good-soft);border-color:var(--good)}
.act .tick{color:var(--good);font-weight:700}
.act small.new{color:var(--accent);font-weight:700}
.act.sim{border-color:var(--accent);border-width:2px}
.simframe{display:block;width:100%;border:0;min-height:600px;background:transparent;margin-top:8px}
.parent{display:block;margin:26px auto 0;border:1px dashed var(--rule);background:transparent;border-radius:12px;padding:10px 16px;color:var(--muted);font-size:15px}

/* 领航员对话 */
.chat{padding:18px 0 8px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:flex-end}
.row.me{justify-content:flex-end}
.ava{flex:none;width:40px;height:40px}
.bub{max-width:min(560px,82%);background:var(--pane);border:1px solid var(--rule);border-radius:16px 16px 16px 4px;padding:10px 14px;color:var(--ink);box-shadow:var(--shadow)}
.row.me .bub{background:var(--accent-soft);border-color:transparent;border-radius:16px 16px 4px 16px}

.bub.good{background:var(--good-soft);border-color:transparent}
.bub.bad{background:var(--bad-soft);border-color:transparent}
.bub .lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.bub.fig{max-width:min(620px,88%);padding:10px}
.fig-box{background:var(--bg);border-radius:12px;padding:6px}
.fig-box svg{display:block;width:100%;height:auto;max-height:52vh}
.fig-box [fill="#CCD6C0" i]{fill:var(--c-sci)} .fig-box [fill="#CFDCE6" i]{fill:var(--c-sky)}
.fig-box [fill="#ECCDB6" i]{fill:var(--c-math)} .fig-box [fill="#EFE4D6" i]{fill:var(--wash)}
.fig-box [fill="#4F7FA8" i]{fill:var(--dad)} .fig-box [fill="#C2603F" i]{fill:var(--mom)}
.fig-box [stroke="#4F7FA8" i]{stroke:var(--dad)} .fig-box [stroke="#C2603F" i]{stroke:var(--mom)}
.fig-box [stroke="#1F1E1C" i]{stroke:var(--ink)} .fig-box text{fill:var(--ink)}
.cap{font-size:15px;color:var(--text);margin:8px 4px 2px}
.ask{margin-top:4px}
.ask .stem{font-weight:600}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choice{text-align:left;border:1.5px solid var(--ink);background:var(--bg);border-radius:12px;padding:10px 14px;min-height:48px;font-size:17px}
.choice:hover:not(:disabled){background:var(--hover)}
.choice:disabled{cursor:default}
.choice.wrong{border-color:var(--bad);color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.choice.right{border-color:var(--good);background:var(--good-soft);font-weight:600}
.numrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.numrow input{width:130px;font:inherit;font-size:20px;padding:8px 12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink)}
.numrow .unit{font-size:18px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 18px;min-height:48px;font-size:17px;font-weight:600}
.btn.ghost{background:var(--pane);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 26%);padding:26px 0 calc(14px + env(safe-area-inset-bottom,0))}
.dock .in{max-width:760px;margin:0 auto;padding:0 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.composer{background:var(--pane);border:1px solid var(--rule);border-radius:16px;padding:12px;box-shadow:var(--shadow);margin:6px 0}
textarea{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical;min-height:96px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px dashed var(--ink);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:16px;min-height:40px}
.row-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.endcard{background:var(--c-sci-bg);border-radius:16px;padding:18px;margin:16px 0}
.endcard h3{font-size:19px;margin-bottom:6px}
.endcard .row-btns{justify-content:flex-start}

/* 挑战 */
.qcard{background:var(--pane);border:1px solid var(--rule);border-radius:18px;padding:18px;margin-top:18px;box-shadow:var(--shadow)}
.progress{display:flex;gap:6px;margin:18px 0 0;align-items:center;color:var(--muted);font-size:14px}
.progress i{display:inline-block;width:20px;height:8px;border-radius:4px;background:var(--rule)}
.progress i.on{background:var(--ink)} .progress i.ok{background:var(--good)}
.qcard .stem{font-size:19px;font-weight:600;color:var(--ink)}
.fb{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.fb .bub{max-width:100%}
.counter{font-size:13px;color:var(--muted);text-align:right}

/* 记录 */
.rec h2{font-size:20px;margin:22px 0 8px}
.rec h3{font-size:17px;margin:14px 0 6px}
.rec ul{margin:4px 0;padding-left:20px}
.rec .muted{color:var(--muted)}
.rec pre{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--pane);border:1px solid var(--rule);border-radius:12px;padding:12px}

@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .28s ease-out both}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .draw .k,.draw .k1{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}
@media (max-width:520px){
  body{font-size:16px}
  .hero{padding:16px} .hero h1{font-size:24px} .hero svg{width:72px;height:72px}
  .bub{max-width:86%}
}
</style>

   <svg id=\"stage\" viewBox=\"0 0 800 610\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <g id=\"dyn\"><\/g>\n      <g id=\"fx\"><circle id=\"cue\" cx=\"0\" cy=\"0\" r=\"10\" style=\"display:none\"/><\/g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n      <rect id=\"touch\" x=\"-400\" y=\"-400\" width=\"1600\" height=\"1410\" fill=\"transparent\"/><!-- 永不重画的触摸层（教训 25） -->\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* Curio · 切分机 act.simulation.fair-cut-01（几分之一：越分越小）。设计说明：docs/constellations/zero-to-one/g1.md C.1 */\n\n/* ============ 1. 真相模型：页面上的每个数字都从这里算 ============ */\nconst MODEL = {\n  nMin: 2, nMax: 12,          // 一张饼平均切成 2 到 12 份（设计约定；1 是「还没切」）\n  mustTry: [3, 8],            // 谜题里的两种切法，舰长必须亲手切一次（设计约定）\n  minKinds: 4,                // 至少切过 4 种份数才揭晓（设计约定：3、8 再加 2 种）\n  settleMs: 600,              // 转盘停住 0.6 秒算试过一种（手感约定）\n  rollCells: 100,             // 蛋糕卷长 100 小格，粗细处处一样，所以一样长就是一样多（画面约定；小格不显示）\n  snap: 2,                    // 刀离目标不超过 2 格就吸过去（手感约定）\n  opening: [50, 30, 20],      // 开场那条切歪的蛋糕卷，问的是中间 30 格那段（设计约定）\n  // 1 米 = 10 分米 = 100 厘米 = 1000 毫米：相邻单位进率都是 10，由 1 米 = 10 分米、1 分米 = 10 厘米、1 厘米 = 10 毫米推出\n  // （人教版三年级上册，2024 年审定、2025 年秋起用，第三单元「毫米、分米和千米」；2026-11-14 独立核对）\n  units: [ { n: 10, name: \"分米\", secs: 3, pow: 1 }, { n: 100, name: \"厘米\", secs: 4, pow: 1.6 }, { n: 1000, name: \"毫米\", secs: 5, pow: 2 } ],\n  mmPerMetre: 1000,\n  cardMm: 0.76,               // 银行卡标称厚 0.76 毫米（ISO/IEC 7810:2019 ID-1）。比 1 毫米薄一点，只说「差不多一张卡片那么薄」\n};\nconst sliceDeg = n => 360 / n;                                   // 每份的角：2→180，3→120，4→90，5→72，6→60，8→45，10→36，12→30\nconst deg2 = n => Math.round(sliceDeg(n) * 100) / 100;           // 保留两位：7→51.43，11→32.73\nconst halfCuts = () => { const h = MODEL.rollCells / 2; return [h, h / 2, h + h / 2]; };   // 三刀的目标：50、25、75\nconst CN = { 1: \"一\", 2: \"二\", 3: \"三\", 4: \"四\", 5: \"五\", 6: \"六\", 7: \"七\", 8: \"八\", 9: \"九\", 10: \"十\", 11: \"十一\", 12: \"十二\", 100: \"百\", 1000: \"千\" };\nconst cnFrac = (a, b) => `${CN[b]}分之${CN[a]}`;                 // 读法：3/4 读作四分之三\nconst fmt = n => String(Math.round(n));\n\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 本星座的共用零件  kit:zero-to-one ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed){\n  const tx = x + 4, ty = y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 3;\nconst S = { station: 1, mode: \"talk\", scene: \"s1q\", hold: false, press: false, kbd: false, dirty: true };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = fals \n  hint(S.s1ready ? `转一转圆钮 · 切过 ${k.length} 种` : miss.length ? `转一转圆钮 · 还要试 ${miss.join(\" 份、\")} 份` : `转一转圆钮 · 再试 ${MODEL.minKinds - k.length} 种`);\n}\nfunction settle1(){   // 转盘停住 0.6 秒：这一份的一个复制品落到托盘上\n  S.settled = true; const n = S.n; S.lastN = n; S.settles++; addToTray(n);\n  const k = kinds(), miss = MODEL.mustTry.filter(m => !k.includes(m));\n  if (S.settles === 1) say(`平均切成 ${n} 份，这一份就是这张饼的 ${F(1, n)}，读作${cnFrac(1, n)}。这样的数叫分数。`);\n  else if (S.settles === 2) say(\"下面的数是平均切成几份，叫分母。上面的数是拿了几份，叫分子。中间那道叫分数线。\");\n  else if (!S.s1ready && miss.length) say(`${n} 份的那一块也上托盘了。再切成 ${miss[0]} 份看看。`);\n  else if (!S.s1ready && k.length < MODEL.minKinds) say(\"再换一种份数试试，看托盘上那一排怎么变。\");\n  if (!S.s1ready && !miss.length && k.length >= MODEL.minKinds){\n    S.s1ready = true; say(\"托盘上排好了一队。还想切就接着转，看够了点「看托盘」。\"); next(\"看托盘\", done1);\n  }\n  hint1();\n}\nfunction enter1(){\n  gen++; S.station = 1; S.mode = \"talk\"; S.s1step = 1; head(1, \"转：切成几份\"); hint(\"\"); readout(\"\"); disarmCue(); scene(\"s1q\");\n  say(`舰长，我们分两张一样大的饼。我要这张的 ${F(1, 8)}，读作八分之一。`);\n  next(\"然后呢\", () => {\n    S.s1step = 2; S.dirty = true;\n    say(`你拿那张的 ${F(1, 3)}，读作三分之一。8 比 3 大，我这块肯定更大。`);\n    next(\"是吗\", () => ask(`你觉得呢：${F(1, 8)} 张饼和 ${F(1, 3)} 张饼，哪一块大？`, [\n      { label: `${F(1, 8)} 那块大`, mis: \"bigger-denominator-bigger\", feedback: \"8 确实比 3 大，这么想很自然。可这里的 8 说的是切成几份，不是饼有多大。\" },\n      { label: \"一样大，上面都是 1\", mis: \"numerator-only\", feedback: \"上面都是 1，看着是一样。可下面的数不一样，切法就不一样。\" },\n      { label: `${F(1, 3)} 那块大`, correct: true, feedback: \"你不信我的话。那就切开看看，到底谁说得对。\" }\n    ], () => next(\"动手切\", act1)));\n  });\n}\nfunction act1(){\n  S.mode = \"act1\"; Object.assign(S, { n: 1, wd: 360, out: 0, ang: 30, tray: [], settles: 0, settled: true, lastN: 0, s1ready: false });\n  scene(\"s1\"); actions([]); readout1(); hint1();\n  say(\"带圆钮的地方，都能用手抓。转一转切分盘，看这张饼被切成几份。\");\n  svg.focus({ preventScroll: true }); armCue(dialGrip);\n}\nfunction done1(){\n  S.mode = \"talk\"; hint(\"\"); disarmCue(); observedOnce(1);\n  const have = kinds(); let d = 0, filled = false;\n  for (let n = MODEL.nMin; n <= MODEL.nMax; n++) if (!have.includes(n)){ filled = true; later(d += 110, () => addToTray(n, true)); }\n  say((filled ? \"没切过的几种，我也补上了。\" : \"\") + \"同一张饼，切的份数越多，每一份越小。\", \"good\");\n  next(\"所以呢\", () => {\n    const g = S.guess && S.guess[1];\n    say(`8 比 3 大，${F(1, 8)} 反而比 ${F(1, 3)} 小。` + (g && g.correct ? \"你没上我的当。\" : \"我也想错了，是这张饼帮我们改过来的。\"), \"good\");\n    next(\"去第 2 站\", enter2);\n  });\n}\n\n/* ============ 7. 第 2 站 · 切：每份一样大，才叫平均分 ============ */\nconst ROLL = { x: 150, y: 156, h: 60, cell: 5 }, KN = { tip: 138, top: 84, grip: 56, off: 8, drop: ROLL.y + ROLL.h + 8 }, SC = { x: 400, y: 322, half: 170, hang: 50, base: 486, per: 1.5, ph: 30 };\nconst cellX = c => ROLL.x + c * ROLL.cell;\n// 一段蛋糕卷：侧着看是一条，右端看得见卷起来的截面\nfunction rollPiece(x, y, len, h, seed){\n  const rx = Math.min(7, h * .14), ex = x + len, cy = y + h / 2;\n  return `<rect x=\"${r1(x)}\" y=\"${r1(y)}\" width=\"${r1(len)}\" height=\"${r1(h)}\" rx=\"${r1(h * .16)}\" class=\"food\"/>` +\n    P(Sk.line(x + 3, y, ex, y, seed, .5) + Sk.line(x + 3, y + h, ex, y + h, seed + 1, .5) + Sk.curve([[x + 3, y], [x, cy], [x + 3, y + h]], seed + 2, .4)) +\n    `<ellipse cx=\"${r1(ex)}\" cy=\"${r1(cy)}\" rx=\"${r1(rx)}\" ry=\"${r1(h / 2)}\" class=\"papr\"/>` + P(Sk.ellipse(ex, cy, rx, h / 2, seed + 3, .4)) +\n    P(Sk.curve([[ex + rx * .1, cy - h * .3], [ex - rx * .45, cy - h * .05], [ex + rx * .05, cy + h * .16], [ex + rx * .3, cy], [ex, cy - h * .08]], seed + 4, .3), \"k1\");\n}\nfunction rollCut(a, b, y, h, seed){   // 整条里从 a 格到 b 格的一段，刀口处留一道缝\n  const x = cellX(a) + (a > 0 ? 6 : 0), e = cellX(b) - (b < MODEL.rollCells ? 6 : 0);\n  return rollPiece(x, y, e - x, h, seed);\n}\nconst pieces2 = () => { const c = [0, ...S.cuts, MODEL.rollCells]; return c.slice(0, -1).map((a, i) => [a, c[i + 1]]); };\nconst target2 = () => halfCuts()[{ cut1: 0, cut2: 1, cut3: 2 }[S.ph]];\nconst range2 = () => ({ cut1: [1, 99], cut2: [1, 49], cut3: [51, 99] })[S.ph];\nconst sides2 = k => S.ph === \"cut1\" ? [k, MODEL.rollCells - k] : S.ph === \"cut2\" ? [k, 50 - k] : [k - 50, MODEL.rollCells - k];   // 天平两个盘里各有几格\nconst tiltOf = (L, R) => clamp((R - L) / (L + R) * 70, -16, 16);    // 右边重，右边沉\nfunction drawScale(tilt, L, R, seedL, seedR){\n  const a = tilt * Math.PI / 180, ex = Math.cos(a) * SC.half, ey = Math.sin(a) * SC.half;\n  let s = P(Sk.line(SC.x, SC.y, SC.x - 34, SC.base, 301, .4) + Sk.line(SC.x, SC.y, SC.x + 34, SC.base, 302, .4) + Sk.line(SC.x - 62, SC.base, SC.x + 62, SC.base, 303, .4)) +\n    P(Sk.line(SC.x - ex, SC.y - ey, SC.x + ex, SC.y + ey, 304, .3), \"k\", 'stroke-width=\"3\"') + `<circle cx=\"${SC.x}\" cy=\"${SC.y}\" r=\"5\" fill=\"var(--ink)\"/>`;\n  [[-1, L, seedL], [1, R, seedR]].forEach(([sg, cells, seed]) => {\n    const px = SC.x + sg * ex, py = SC.y + sg * ey, py2 = py + SC.hang, w = cells * SC.per;\n    s += P(Sk.line(px, py, px - 68, py2, 310 + sg, .3) + Sk.line(px, py, px + 68, py2, 312 + sg, .3), \"k1\") + P(Sk.line(px - 84, py2, px + 84, py2, 314 + sg, .4));\n    if (cells > 0) s += rollPiece(px - w / 2, py2 - SC.ph - 2, w, SC.ph, seed);\n  });\n  return s;\n}\nfunction draw2q(){\n  let s = oneMark(ROLL.x - 14, ROLL.y - 16, MODEL.rollCells * ROLL.cell + 34, ROLL.h + 32, 320), a = 0;\n  MODEL.opening.forEach((len, i) => { s += rollCut(a, a + len, ROLL.y, ROLL.h, 330 + i * 7); if (i === 1) s += TC(cellX(a + len / 2), ROLL.y + ROLL.h + 76, \"？\", \"big\") + P(Sk.line(cellX(a) + 8, ROLL.y + ROLL.h + 26, cellX(a + len) - 8, ROLL.y + ROLL.h + 26, 350, .4), \"kacc\"); a += len; });\n  return s;\n}\nfunction draw2(){\n  const act = S.mode === \"act2\" && !S.cutting, kx = cellX(S.knifeP), d = S.cutting ? clamp(S.cutT / .55) : 0, dy = (KN.drop - KN.tip) * d;\n  let s = oneMark(ROLL.x - 14, ROLL.y - 16, MODEL.rollCells * ROLL.cell + 34, ROLL.h + 32, 320);\n  pieces2().forEach(([a, b], i) => {\n    s += rollCut(a, b, ROLL.y, ROLL.h, 360 + a);\n    const den = MODEL.rollCells / (b - a);\n    if (S.cuts.length === 3 || (S.cuts.length && den === 2)) s += fracS(cellX((a + b) / 2) - 3, ROLL.y + ROLL.h / 2 + 2, 1, den, \"fm\", 380 + i);\n  });\n  if (S.ph !== \"done\"){   // 刀：刀身是主角，刀柄上装圆钮\n    const hx = kx - KN.off;   // 刀背是直的，正对着要切的地方；刀柄和圆钮在刀身正上方\n    s += `<g transform=\"translate(0 ${r1(dy)})\"><path d=\"M${r1(kx)} ${KN.top}L${r1(kx)} ${KN.tip}Q${r1(kx - 19)} ${KN.tip - 16} ${r1(kx - 17)} ${KN.top}Z\" class=\"lead\"/>` +\n      P(Sk.line(kx, KN.top, kx, KN.tip, 391, .25) + `M${r1(kx)} ${KN.tip}Q${r1(kx - 19)} ${KN.tip - 16} ${r1(kx - 17)} ${KN.top}` + Sk.line(kx - 17, KN.top, kx, KN.top, 392, .25)) +\n      `<rect x=\"${r1(hx - 10)}\" y=\"${KN.grip - 28}\" width=\"20\" height=\"${KN.top - KN.grip + 28}\" rx=\"8\" class=\"papr\"/>` + P(box(hx - 10, KN.grip - 28, 20, KN.top - KN.grip + 28, 393, .4));\n    if (act) s += grip(hx, KN.grip, [1, 0], { on: S.press, kbd: S.kbd, seed: 395 });\n    s += `<\/g>`;\n  }\n  const [L, R] = sides2(S.knifeP);\n  if (S.ph === \"cut1\") s += drawScale(S.tilt, L, R, 401, 402); else s += drawScale(S.tilt, Math.max(L, .01), Math.max(R, .01), 401, 402);\n  return s;\n}\nfunction draw2stack(){\n  const p = S.stackP, e = p * p * (3 - 2 * p); let s = \"\";\n  pieces2().forEach(([a, b], i) => {\n    const x = lerp(cellX(a) + (a > 0 ? 6 : 0), 400 - 62, e), y = lerp(ROLL.y, 104 + i * 70, e);\n    s += rollPiece(x, y, (b - a) * ROLL.cell - 12, ROLL.h, 360 + a) + fracS(x + 58, y + ROLL.h / 2 + 2, 1, 4, \"fm\", 380 + i);\n  });\n  if (p > .96) s += P(`M338 92V386M451 92V386`, \"kf\");   // 两道虚线：四段的两头都对得齐，一样长\n  return s;\n}\nfunction draw2weigh(){\n  const [a, b, c] = MODEL.opening;\n  return drawScale(S.wtilt, a, b, 331, 337) + rollPiece(SC.x + 150, SC.base - SC.ph - 2, c * SC.per, SC.ph, 344) + P(Sk.line(SC.x + 130, SC.base, SC.x + 200, SC.base, 420, .4), \"k1\");\n}\nfunction readout2(){\n  const k = S.knife, [L, R] = sides2(k), den = S.ph === \"cut1\" ? 2 : 4;\n  if (S.cuts.length === 3) readout(`4 份一样大 · 每份是它的 ${F(1, 4)}`);\n  else if (S.justCut) readout(`2 份一样大 · 每份是它的 ${F(1, 2)}`);\n  else if (Math.abs(k - target2()) <= MODEL.snap && S.press) readout(\"天平快平了 · 松手落刀\");\n  else readout(`${den === 2 ? \"两份\" : \"这两份\"}不一样大 · 还不能叫 ${F(1, den)}`);\n  sendState({ station: 2, knife: k, cuts: S.cuts.slice(), balanced: L === R });\n}\nfunction setKnife(c){ const [lo, hi] = range2(); c = clamp(Math.round(c), lo, hi); if (c === S.knife) return; S.knife = c; S.justCut = false; S.dirty = true; readout2(); }\nfunction tryCut(){   // 松手（或回车）：天平放平才落刀\n  if (S.mode !== \"act2\" || S.cutting) return;\n  const t = target2(), [L, R] = sides2(S.knife);\n  if (Math.abs(S.knife - t) <= MODEL.snap){ S.knife = t; S.cutting = true; S.cutT = 0; S.dirty = true; readout2(); return; }\n  S.fails++; readout2();\n  say((L < R ? \"右边沉，右边那份多了。刀往右挪一点。\" : \"左边沉，左边那份多了。刀往左挪一点。\") + (S.fails === 3 ? \"看天平：哪边低，刀就往哪边挪。\" : \"\"), \"hmm\");\n}\nfunction finishCut(){\n  S.cutting = false; S.cuts.push(S.knife); S.cuts.sort((a, b) => a - b); S.justCut = true; S.fails = 0; readout2();\n  if (S.ph === \"cut1\"){\n    S.mode = \"talk\"; hint(\"\");\n    say(`天平放平了，刀落下来了。2 份一样大，每份是这条蛋糕卷的 ${F(1, 2)}。`, \"good\");\n    next(\"接着切\", () => { S.ph = \"cut2\"; S.knife = S.knifeP = 12; S.justCut = false; S.mode = \"act2\"; actions([]); hint(\"拖动圆钮，天平放平了再松手\"); say(\"把左边这一半，也切成一样大的 2 份。\"); readout2(); svg.focus({ preventScroll: true }); S.dirty = true; });\n  } else if (S.ph === \"cut2\"){\n    S.ph = \"cut3\"; S.knife = S.knifeP = 62; S.justCut = false; say(\"切平了。右边这一半也来一刀。\"); readout2();\n  } else {\n    S.ph = \"done\"; S.mode = \"talk\"; hint(\"\"); readout2();\n    later(700, () => { scene(\"s2stack\"); S.stackP = 0; S.stackT = 1; say(`4 份叠起来比一比，一样长。每份是这条蛋糕卷的 ${F(1, 4)}。`, \"good\");\n      next(\"开场那 3 块呢\", () => { scene(\"s2weigh\"); S.wtilt = 0; S.wtiltT = tiltOf(MODEL.opening[0], MODEL.opening[1]); say(\"开场那 3 块也上天平。一头沉下去了，它们不一样大。\"); next(\"所以呢\", done2); }); });\n  }\n  S.dirty = true;\n}\nfunction enter2(){\n  gen++; S.station = 2; S.mode = \"talk\"; head(2, \"切：天平放平\"); hint(\"\"); readout(\"\"); disarmCue(); scene(\"s2q\");\n  say(\"这条蛋糕卷被切成了 3 块。舰长拿中间这块。\");\n  next(\"然后呢\", () => ask(`它是这条蛋糕卷的 ${F(1, 3)} 吗？`, [\n    { label: \"是，3 块里拿了 1 块\", mis: \"unequal-parts\", feedback: \"3 块里拿了 1 块，数得没错。可这 3 块有大有小，光数块数还不够。\" },\n    { label: \"不是，3 块不一样大\", correct: true, feedback: \"你看出 3 块不一样大。那要怎么切才算数？请天平来帮忙。\" },\n    { label: `不是，该叫 ${F(1, 2)}`, mis: \"part-to-part\", feedback: \"你拿它和剩下的 2 块比，才想到 2。分数比的是这一块和一整条。\" }\n  ], () => next(\"动手切\", act2)));\n}\nfunction act2(){\n  Object.assign(S, { mode: \"talk\", ph: \"cut1\", knife: 30, knifeP: 30, cuts: [], tilt: 0, cutting: false, cutT: 0, justCut: false, fails: 0, stackP: 0, stackT: 0, wtilt: 0, wtiltT: 0 });\n  scene(\"s2\"); readout(\"\");\n  say(\"换一条新的。这条蛋糕卷粗细都一样，所以一样长就是一样多。\");\n  next(\"明白\", () => { S.mode = \"act2\"; actions([]); hint(\"拖动圆钮，天平放平了再松手\"); say(\"先切成一样大的 2 份。拖动刀上的圆钮，天平放平了再松手。\"); readout2(); svg.focus({ preventScroll: true }); armCue(() => [cellX(S.knifeP) - KN.off, KN.grip]); S.dirty = true; });\n}\nfunction done2(){\n  observedOnce(2); const g = S.guess && S.guess[2];\n  say(\"每份一样大，才叫平均分。平均分出来的一份，才能叫几分之一。\" + (g && g.correct ? \"你一开始就看出来了。\" : \"\"), \"good\");\n  next(\"还有呢\", () => { say(`刚才你把一半又切成两半。一半的一半，就是 ${F(1, 4)}。`, \"good\"); next(\"去第 3 站\", enter3); });\n}\n\n/* ============ 8. 第 3 站 · 拼：1000 个千分之一才拼回 1 米 ============ */\nconst BR = { x: 150, w: 500, y: 150, h: 42 }, TRK = { y: 232, h: 36 }, RUL = { y: 300, h: 36 }, LP = { x: 566, y: 462, r: 84 };\nconst unit3 = () => MODEL.units[S.round];\nconst count3 = () => { const u = unit3(); return S.tp >= 1 ? u.n : Math.floor(u.n * Math.pow(S.tp, u.pow) + 1e-9); };\nfunction bread(seed){\n  const { x, w, y, h } = BR; let s = `<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"${h / 2}\" class=\"food\"/>` +\n    P(Sk.line(x + 18, y, x + w - 18, y, seed, .6) + Sk.line(x + 18, y + h, x + w - 18, y + h, seed + 1, .6) + Sk.curve([[x + 18, y] r1(kx + cw / 2), cy - hh - 8, \"卡片\", \"lbg\");\n}\nfunction draw3q(){ return `<rect x=\"250\" y=\"236\" width=\"300\" height=\"84\" rx=\"10\" class=\"papr\"/>` + P(box(250, 236, 300, 84, 501, .7)) + P(Sk.line(300, 236, 330, 190, 505, .4) + Sk.line(500, 236, 470, 190, 506, .4), \"k1\") + TC(400, 288, \"1 米长的面包\", \"sign\"); }\nfunction draw3(){\n  const u = unit3(), c = count3(), w = BR.w / u.n, xf = BR.x + c * w, act = S.mode === \"act3\";\n  let s = bread(510);\n  if (S.round === 2) s += P(`M${r1(xf)} ${TRK.y + TRK.h + 3}L${LP.x - 50} ${LP.y - LP.r + 14}M${r1(xf)} ${TRK.y + TRK.h + 3}L${LP.x + 50} ${LP.y - LP.r + 14}`, \"faint\");   // 引线从尺子后面走，不压住刻度上的数\n  s += `<rect x=\"${BR.x - 14}\" y=\"${RUL.y}\" width=\"${BR.w + 60}\" height=\"${RUL.h + 32}\" class=\"pane\"/>` + ruler(S.round + 1 > 2 ? 2 : S.round + 1, 540);\n  s += P(`M${BR.x} ${BR.y + BR.h + 12}h${r1(Math.max(w, 1.2))}` + (w > 3 ? `M${BR.x} ${BR.y + BR.h + 7}v10M${r1(BR.x + w)} ${BR.y + BR.h + 7}v10` : \"\"), \"kacc\");   // 面包上的那一小段\n  s += P(box(BR.x, TRK.y, BR.w, TRK.h, 550, .4), \"kf\");\n  if (c > 0){\n    s += `<rect x=\"${BR.x}\" y=\"${TRK.y}\" width=\"${r1(c * w)}\" height=\"${TRK.h}\" class=\"food\"/>`;\n    if (w >= 3){ s += `<rect x=\"${r1(xf - w)}\" y=\"${TRK.y}\" width=\"${r1(w)}\" height=\"${TRK.h}\" class=\"lead\"/>`; let d = \"\"; for (let i = 0; i <= c; i++) d += `M${r1(BR.x + i * w)} ${TRK.y}v${TRK.h}`; s += P(d, \"k1\", w < 10 ? 'opacity=\".55\"' : \"\"); }\n    else s += P(`M${r1(xf)} ${TRK.y - 3}v${TRK.h + 6}`, \"kacc\");\n    s += P(Sk.line(BR.x, TRK.y, xf, TRK.y, 551, .3) + Sk.line(BR.x, TRK.y + TRK.h, xf, TRK.y + TRK.h, 552, .3), \"k1\");\n  }\n  s += T(304, 478, c, \"big\", 'text-anchor=\"end\"') + T(314, 476, \"个\", \"sign\") + fracS(narrow() ? 386 : 376, 462, 1, u.n, \"fm\", 560);\n  if (S.round === 2){\n    s += loupe(LP.x, LP.y, LP.r, thinInner(LP.x - 6, LP.y + 10, 30, 3, 570), 580);\n  }\n  return s;\n}\nconst LP3 = [{ x: 205, n: 10, name: \"1 分米\" }, { x: 400, n: 100, name: \"1 厘米\" }, { x: 595, n: 1000, name: \"1 毫米\" }];\nfunction tenInner(cx, cy, seed){   // 放大圈里的一小段尺子：再分成 10 小格，第一格是主角\n  const x0 = cx - 60, w = 12; let d = \"\";\n  for (let i = 0; i <= 10; i++) d += `M${x0 + i * w} ${cy - 4}v${i % 10 ? 12 : 22}`;\n  return `<rect x=\"${cx - 90}\" y=\"${cy - 46}\" width=\"180\" height=\"34\" class=\"food\"/><rect x=\"${cx - 90}\" y=\"${cy - 4}\" width=\"180\" height=\"40\" class=\"papr\"/>` + `<rect x=\"${x0}\" y=\"${cy - 46}\" width=\"${w}\" height=\"34\" class=\"lead\"/>` +\n    P(`M${cx - 90} ${cy - 46}h180M${cx - 90} ${cy - 12}h180M${cx - 90} ${cy - 4}h180M${cx - 90} ${cy + 36}h180`, \"k1\") + P(d, \"k1\");\n}\nfunction draw3r(){\n  const cy = 472, r = 74; let s = bread(510) + ruler(2, 540);\n  s += P(`M${BR.x} ${RUL.y + RUL.h + 34}L${LP3[0].x - 52} ${cy - r + 20}M${BR.x + 50} ${RUL.y + RUL.h + 34}L${LP3[0].x + 52} ${cy - r + 20}`, \"faint\") + P(`M${BR.x} ${RUL.y - 5}h50`, \"kacc\");\n  LP3.forEach((L, i) => {\n    if (i) s += P(`M${LP3[i - 1].x - 60} ${cy - 50}L${L.x - r + 8} ${cy - 30}M${LP3[i - 1].x - 48} ${cy + 20}L${L.x - r + 8} ${cy + 30}`, \"faint\");\n    s += loupe(L.x, cy, r, i < 2 ? tenInner(L.x, cy, 600 + i * 20) : thinInner(L.x - 4, cy + 14, 44, 1, 650, 40), 660 + i);\n    s += fracS(L.x - 44, cy + r + 34, 1, L.n, \"fs\", 670 + i) + T(L.x - 6, cy + r + 40, L.name, \"lb\");\n  });\n  return s;\n}\nfunction readout3(){\n  const u = unit3(), c = count3();\n  readout(c >= u.n ? `${u.n} 个 ${F(1, u.n)} = 1 · 正好 1 米` : `${c} 个 ${F(1, u.n)} · 排到 ${c} ${u.name}`);\n  sendState({ station: 3, unit: u.n, count: c });\n}\nfunction startRound(r){\n  S.round = r; S.tau = 0; S.tp = 0; S.hold = false; S.mode = \"act3\"; S.dirty = true; const u = unit3();\n  hint(\"按住「再来一段」\"); readout3();\n  say([`先排 ${F(1, 10)}。按住「再来一段」，看要几段才排满 1 米。`, `这回每段是 1 米的 ${F(1, 100)}。按住，看它排到哪。`, `最后是 ${F(1, 1000)}。太细了，我拿放大圈给你看。`][r]);\n  actions([{ label: \"按住 再来一段\", cls: \"hold\", hold: true }]); svg.focus({ preventScroll: true });\n}\nfunction roundDone     box.append(s);
  } else box.append(el("p", {class:"cap"}, "（这张图还没准备好）"));
  return box;
}

// ---------- 判分 ----------
function normNum(s){
  return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[．。]/g, ".").replace(/[－—]/g, "-").replace(/[，,\s]/g, "").replace(/[条对个本卷米厘次]+$/, "");
}
function parseNumber(s){
  const t = normNum(s); if (!/^-?\d+(\.\d+)?$/.test(t)) return null; return Number(t);
}
function parseFraction(s){
  const t = String(s).trim().replace(/／/g, "/").replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  let m = t.match(/^(\d+)\s*\/\s*(\d+)$/); if (m) return [Number(m[1]), Number(m[2])];
  m = t.match(/^(\d+)\s*分之\s*(\d+)$/); if (m) return [Number(m[2]), Number(m[1])];
  return null;
}
function grade(answer, input){
  // 返回 {ok, misconception, feedback} 或 null（写法认不出来，不算一次作答）
  if (answer.type === "choice"){
    const c = answer.choices.find(x => x.id === input);
    return {ok: !!c.correct, misconception: c.misconception || null, feedback: c.feedback || "", shown: c.text};
  }
  if (answer.type === "number"){
    const x = parseNumber(input); if (x === null) return null;
    const tol = answer.tolerance || 0, hit = v => Math.abs(x - v) <= tol + 1e-9;
    if (hit(answer.value)) return {ok:true, feedback:"", shown:String(x)};
    const w = (answer.common_wrong||[]).find(cw => hit(cw.value));
    return {ok:false, misconception: w && w.misconception || null, feedback: w && w.feedback || "", shown:String(x)};
  }
  if (answer.type === "fraction"){
    const f = parseFraction(input); if (!f) return null;
    const [a,b] = f; if (b === 0) return {ok:false, feedback:"", shown:`${a}/${b}`};
    const ok = answer.accept_equivalent ? a*answer.denominator === b*answer.numerator : (a === answer.numerator && b === answer.denominator);
    if (ok) return {ok:true, feedback:"", shown:`${a}/${b}`};
    const w = (answer.common_wrong||[]).find(cw => answer.accept_equivalent ? a*cw.denominator === b*cw.numerator : (a === cw.numerator && b === cw.denominator));
    return {ok:false, misconception: w && w.misconception || null, feedback: w && w.feedback || "", shown:`${a}/${b}`};
  }
  return null;
}
function answerText(answer){
  if (answer.type === "choice") return answer.choices.find(c => c.correct).text;
  if (answer.type === "number") return `${answer.value}${answer.unit ? " " + answer.unit : ""}`;
  if (answer.type === "fraction") return `${answer.numerator}/${answer.denominator}`;
  return "";
}

// ---------- 一道题（讲解里的小问题和挑战共用） ----------
// say(role, text)：role 是 nav / me / good / bad / hint
function askItem(host, item, say, onDone){
  const ans = item.answer, hints = item.hints || [];
  const rec = {stem:item.stem, tries:[], hints:0, result:null};
  let usedHints = 0, finished = false;
  const ctrl = el("div", {class:"ask"});
  let choiceBtns = [], numInput = null, okBtn = null;

  function finish(result){
    finished = true; rec.result = result;
    choiceBtns.forEach(b => b.disabled = true);
    if (numInput){ numInput.disabled = true; okBtn.disabled = true; }
    hintBtn.hidden = true;
    onDone(rec);
  }
  function submit(value, btn){
    if (finished) return;
    const g = grade(ans, value);
    if (!g){ say("nav", "写一个数字试试，比如 12。"); return; }
    rec.tries.push({shown:g.shown, ok:g.ok, misconception:g.misconception||null});
    if (ans.type !== "choice") say("me", g.shown + (ans.unit ? " " + ans.unit : ""));
    else say("me", g.shown);
    if (g.ok){
      if (btn) btn.classList.add("right");
      say("good", g.feedback ? "对了。" + g.feedback : "对了。");
      finish(rec.tries.length === 1 && usedHints === 0 ? "first" : "later");
    } else {
      if (btn){ btn.classList.add("wrong"); btn.disabled = true; }
      say("bad", g.feedback || "这个想法很多人都有。再想想看，也可以要个提示。");
      if (numInput){ numInput.select(); }
    }
  }

  if (ans.type === "choice"){
    const box = el("div", {class:"choices"});
    for (const c of ans.choices){
      const b = el("button", {class:"choice", type:"button", onclick:()=>submit(c.id, b)}, c.text);
      choiceBtns.push(b); box.append(b);
    }
    ctrl.append(box);
  } else {
    numInput = el("input", {type:"text", inputmode: ans.type === "number" ? "decimal" : "text", "aria-label":"写答案", autocomplete:"off",
      placeholder: ans.type === "fraction" ? "比如 1/4" : "写数字",
      onkeydown: e => { if (e.key === "Enter") submit(numInput.value); }});
    okBtn = el("button", {class:"btn", type:"button", onclick:()=>submit(numInput.value)}, "确定");
    ctrl.append(el("div", {class:"numrow"}, numInput, ans.unit ? el("span", {class:"unit"}, ans.unit) : null, okBtn));
  }
  const hintBtn = el("button", {class:"btn ghost", type:"button", onclick: () => {
    if (finished) return;
    if (usedHints < hints.length){
      say("hint", hints[usedHints]); usedHints++; rec.hints = usedHints;
      if (usedHints >= hints.length) hintBtn.textContent = "看答案";
    } else {
      say("nav", "答案是：" + answerText(ans) + "。");
      choiceBtns.forEach((b, i) => { if (ans.choices[i].correct) b.classList.add("right"); });
      if (numInput) numInput.value = answerText(ans).split(" ")[0];
      finish("revealed");
    }
  }}, hints.length ? "要个提示" : "看答案");
  ctrl.append(el("div", {class:"row-btns"}, hintBtn));
  host.append(ctrl);
  return rec;
}

// ---------- 页面 ----------
function setTop(title, showBack){
  document.getElementById("title").textContent = title;
  document.getElementById("back").hidden = !showBack;
}
function dock(...btns){ $dockIn.replaceChildren(...btns.filter(Boolean)); $dock.hidden = btns.filter(Boolean).length === 0; }
function nextAfter(a){ const i = ACTS.indexOf(a); return ACTS[i+1] || null; }
function endButtons(a){
  const n = nextAfter(a);
  return el("div", {class:"row-btns"},
    n ? el("button", {class:"btn", type:"button", onclick:()=>go("act:" + n.id)}, `${n.star !== a.star ? "下一颗星：" : "接着做"}${kindLabel(n, n.star)}`) : null,
    el("button", {class:"btn ghost", type:"button", onclick:()=>go("home")}, "回星图"));
}

function viewHome(){
  setTop("Curio", false); dock();
  const hero = el("div", {class:"hero"},
    el("div", {}, el("div", {class:"eyebrow"}, "Curio · 星座"), el("h1", {}, DATA.constellation),
      el("p", {}, "三颗星，按顺序飞：" + DATA.stars.map(s => s.title.split("：")[0]).join(" → ") + "。")),
    svgEl(SHIP));
  const line = el("div", {class:"line"});
  DATA.stars.forEach((st, i) => {
    const acts = el("div", {class:"acts"});
    for (const a of st.activities){
      const done = S.done[a.id];
      acts.append(el("button", {class:"act" + (done ? " done" : "") + (a.kind === "simulation" ? " sim" : ""), type:"button", onclick:()=>go("act:" + a.id)},
        done ? el("span", {class:"tick"}, "✓") : null, kindLabel(a, st), a.kind === "simulation" ? el("small", {class:"new"}, "新") : null, a.duration_min ? el("small", {}, `${a.duration_min} 分钟`) : null));
    }
    line.append(el("section", {class:"star"}, el("div", {class:"dot"}, i+1), el("h2", {}, st.title), el("div", {class:"dq"}, st.dq), acts));
  });
  $app.replaceChildren(hero, el("p", {class:"note"}, "这是试玩版：做过的不会保存，刷新页面就从头开始。"), line,
    el("button", {class:"parent", type:"button", onclick:()=>go("record")}, "试玩记录（给家长看）"));
}

function bubbleRow(role, content){
  const cls = {nav:"", hint:"hint", good:"good", bad:"bad"}[role];
  if (role === "me") return el("div", {class:"row me pop"}, el("div", {class:"bub"}, content));
  const bub = el("div", {class:"bub " + (cls||"")}, role === "hint" ? el("span", {class:"lbl"}, "提示") : null, content);
  return el("div", {class:"row pop"}, svgEl(AVA), bub);
}

function viewExplain(a){
  const log = S.log[a.id] = {kind:"explain", items:[], questions:[]};
  const chat = el("div", {class:"chat"});
  $app.replaceChildren(chat);
  const steps = a.body.steps; let i = 0;
  const say = (role, text) => { const r = bubbleRow(role, text); chat.append(r); scrollEnd(r); };
  const contBtn = el("button", {class:"btn", type:"button", onclick:()=>step()}, "继续");
  const qBtn = el("button", {class:"btn ghost", type:"button", onclick:()=>openAsk()}, "我有个问题");

  function openAsk(){
    if (chat.querySelector(".composer")) return;
    const ta = el("textarea", {maxlength:"120", placeholder:"想问领航员什么？"});
    const box = el("div", {class:"composer pop"}, ta, el("div", {class:"row-btns"},
      el("button", {class:"btn ghost", type:"button", onclick:()=>box.remove()}, "算了"),
      el("button", {class:"btn", type:"button", onclick:()=>{
        const q = ta.value.trim(); if (!q) return; box.remove();
        log.questions.push(q); say("me", q);
        say("nav", "好问题。我把它记在试玩记录里了，等会儿和家长一起找答案。");
      }}, "问领航员")));
    chat.append(box); scrollEnd(box); ta.focus();
  }
  function step(){
    if (i >= steps.length) return;
    const s = steps[i++];
    if (s.type === "text") say("nav", s.text);
    else if (s.type === "figure"){
      const r = el("div", {class:"row pop"}, svgEl(AVA), el("div", {class:"bub fig"}, figureNode(s.figure), s.caption ? el("div", {class:"cap"}, s.caption) : null));
      chat.append(r); scrollEnd(r);
    } else if (s.type === "check"){
      const bub = el("div", {class:"bub"}, el("div", {class:"stem"}, s.item.stem));
      const r = el("div", {class:"row pop"}, svgEl(AVA), bub); chat.append(r);
      dock(qBtn);
      const rec = askItem(bub, s.item, say, rec => { log.items.push(rec); afterStep(); });
      scrollEnd(r);
      return;
    }
    afterStep();
  }
  function afterStep(){
    if (i < steps.length){ dock(qBtn, contBtn); return; }
    S.done[a.id] = true; dock(qBtn);
    const card = el("div", {class:"endcard pop"}, el("h3", {}, "这一段讲完了"), endButtons(a));
    chat.append(card); scrollEnd(card);
  }
  step();
}

function shuffled(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function viewQuiz(a){
  const items = a.body.shuffle ? shuffled(a.body.items) : a.body.items.slice();
  const log = S.log[a.id] = {kind:"quiz", items:[]};
  let k = 0;
  function show(){
    dock();
    if (k >= items.length) return summary();
    const it = items[k];
    const prog = el("div", {class:"progress"}, ...items.map((_, j) => el("i", {class: j < k ? (log.items[j].result === "first" ? "ok" : "on") : (j === k ? "on" : "")})), el("span", {}, ` 第 ${k+1} 题，共 ${items.length} 题`));
    const fb = el("div", {class:"fb"});
    const card = el("div", {class:"qcard pop"}, el("div", {class:"stem"}, it.stem));
    if (it.figure) card.append(figureNode(it.figure));
    const say = (role, text) => {
      if (role === "me") return;
      const cls = {nav:"", hint:"hint", good:"good", bad:"bad"}[role];
      if (role !== "hint") fb.querySelectorAll(".bub:not(.hint)").forEach(n => n.remove());
      const b = el("div", {class:"bub pop " + cls}, role === "hint" ? el("span", {class:"lbl"}, "提示") : null, text);
      fb.append(b); scrollEnd(b);
    };
    $app.replaceChildren(prog, card);
    askItem(card, it, say, rec => {
      log.items.push(rec);
      dock(el("button", {class:"btn", type:"button", onclick:()=>{ k++; show(); window.scrollTo(0,0); }}, k + 1 < items.length ? "下一题" : "看看结果"));
    });
    card.append(fb);
  }
  function summary(){
    S.done[a.id] = true;
    const first = log.items.filter(r => r.result === "first").length;
    const card = el("div", {class:"endcard pop"},
      el("h3", {}, "挑战完成"),
      el("p", {}, `${items.length} 道题里，一次就答对 ${first} 道。` + (first < items.length ? "想岔的地方，正好看清楚了。" : "全部一次答对。")),
      endButtons(a));
    $app.replaceChildren(card);
  }
  show();
}

function viewReflection(a){
  const b = a.body, max = b.max_chars || 120;
  const log = S.log[a.id] = {kind:"reflection", text:""};
  const ta = el("textarea", {maxlength:String(max), placeholder:"想到什么就写什么。"});
  const counter = el("div", {class:"counter"}, `0 / ${max}`);
  const doneBtn = el("button", {class:"btn", type:"button", disabled:true}, "写好了");
  const upd = () => { counter.textContent = `${ta.value.length} / ${max}`; doneBtn.disabled = !ta.value.trim(); };
  ta.addEventListener("input", upd);
  const chips = el("div", {class:"chips"}, ...(b.starters||[]).map(s => el("button", {class:"chip", type:"button", onclick:()=>{
    const t = s.replace(/[…\.。]+$/, "");
    ta.value = (ta.value ? ta.value.replace(/\s*$/, "") + "\n" : "") + t; ta.focus(); upd();
  }}, s)));
  const chat = el("div", {class:"chat"});
  chat.append(bubbleRow("nav", b.prompt));
  const box = el("div", {class:"composer"}, b.starters && b.starters.length ? el("div", {class:"lbl muted", style:"font-size:13px;color:var(--muted)"}, "不知道怎么开头？点一个：") : null, chips, ta, counter, el("div", {class:"row-btns"}, doneBtn));
  doneBtn.addEventListener("click", () => {
    log.text = ta.value.trim(); S.done[a.id] = true;
    box.replaceWith(bubbleRow("me", log.text));
    const end = el("div", {class:"endcard pop"}, el("h3", {}, "记下来了"), el("p", {}, "家长可以在「试玩记录」里看到你写的话。"), endButtons(a));
    chat.append(bubbleRow("nav", "谢谢舰长。"), end); scrollEnd(end);
  });
  chat.append(box);
  $app.replaceChildren(chat);
}

// 动手探索：沙箱 iframe + activity/1.1 契约
let simListener = null;
function viewSim(a){
  const log = S.log[a.id] = {kind:"simulation", events:[], questions:[]};
  dock();
  const frame = el("iframe", {class:"simframe", sandbox:"allow-scripts", title:a.title});
  frame.srcdoc = a.html;
  const end = el("div", {});
  if (simListener) removeEventListener("message", simListener);
  simListener = e => {
    if (e.source !== frame.contentWindow) return;
    const m = e.data; if (!m || m.contract !== "activity/1.1") return;
    const p = m.payload || {};
    const post = (type, payload) => frame.contentWindow.postMessage({contract:"activity/1.1", type, payload}, "*");
    if (m.type === "ready") post("init", {age_band:a.age_band || "G3-4", lang:"zh-CN", phase:"observe", palette:{}, mastery:null});
    else if (m.type === "resize" && p.h) frame.style.height = Math.max(600, Math.ceil(p.h) + 8) + "px";
    else if (m.type === "event") log.events.push(p);
    else if (m.type === "note_question" && p.text) log.questions.push(p.text);
    else if (m.type === "complete"){ S.done[a.id] = true; end.replaceChildren(el("div", {class:"endcard pop"}, el("h3", {}, "这一段做完了"), endButtons(a))); }
  };
  addEventListener("message", simListener);
  $app.replaceChildren(frame, end);
}

function recordText(){
  const out = [`Curio 试玩记录 · ${DATA.constellation}`];
  for (const st of DATA.stars){
    out.push("", `【${st.title}】`);
    for (const a of st.activities){
      const L = S.log[a.id];
      out.push(`${kindLabel(a, st)}：${S.done[a.id] ? "做完了" : (L ? "做到一半" : "没做")}`);
      if (!L) continue;
      (L.items||[]).forEach(r => {
        const res = r.result === "first" ? "一次答对" : r.result === "revealed" ? "看了答案" : `答错 ${r.tries.filter(t => !t.ok).length} 次后答对`;
        out.push(`  · ${r.stem}　${res}${r.hints ? `，用了 ${r.hints} 条提示` : ""}`);
        r.tries.filter(t => !t.ok).forEach(t => out.push(`      选了/写了「${t.shown}」${t.misconception ? `（误区：${st.misconceptions[t.misconception] || t.misconception}）` : ""}`));
      });
      (L.events||[]).filter(ev => ev.verb === "predicted" || ev.verb === "answered").forEach(ev => {
        const r = ev.result || {};
        if (r.item === "pair-try" || (r.item || "").startsWith("pair-")) return;
        out.push(`  · 第 ${r.station || "?"} 站${ev.verb === "predicted" ? "猜测" : "回答"}：${r.correct ? "对" : "错"}${r.misconception ? `（误区：${st.misconceptions[r.misconception] || r.misconception}）` : ""}`);
      });
      const tries = (L.events||[]).filter(ev => ev.verb === "answered" && (ev.result || {}).item === "pair-try").length;
      if (tries) out.push(`  · 配对时配错 ${tries} 次`);
      (L.questions||[]).forEach(q => out.push(`  · 问了领航员：${q}`));
      if (L.text) out.push(`  · 写下：${L.text}`);
    }
  }
  return out.join("\n");
}
function viewRecord(){
  setTop("试玩记录", true); dock();
  const txt = recordText();
  const pre = el("pre", {}, txt);
  const msg = el("span", {class:"muted", style:"font-size:14px;color:var(--muted)"});
  const copy = el("button", {class:"btn", type:"button", onclick: async () => {
    try { await navigator.clipboard.writeText(txt); msg.textContent = "复制好了，可以粘贴发出去。"; }
    catch(e){ const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = "已经选中，长按或按 Ctrl+C 复制。"; }
  }}, "复制成文字");
  $app.replaceChildren(el("div", {class:"rec"},
    el("h2", {}, "这次试玩做了什么"),
    el("p", {class:"muted"}, "只记在这一页里，刷新就没了。试玩完可以复制下来，发给 Claude 当作试玩反馈。"),
    el("div", {class:"row-btns", style:"justify-content:flex-start"}, copy, msg), pre));
}

// 页面内切换，不用地址栏（托管网页里地址栏的 # 不一定传得进来）
let VIEW = "home";
function go(v){ VIEW = v; route(); }
function route(){
  window.scrollTo(0,0);
  const m = VIEW.match(/^act:(.+)$/);
  if (m){
    const a = actById(m[1]);
    if (a){
      setTop(`${kindLabel(a, a.star)} · ${a.title}`, true);
      if (simListener && a.kind !== "simulation"){ removeEventListener("message", simListener); simListener = null; }
      ({simulation:viewSim, explain:viewExplain, quiz:viewQuiz, reflection:viewReflection})[a.kind](a);
      return;
    }
  }
  if (VIEW === "record") return viewRecord();
  viewHome();
}
document.getElementById("back").addEventListener("click", () => go("home"));
route();
