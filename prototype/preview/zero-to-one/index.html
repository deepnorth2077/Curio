opacity:0}}\n@media (prefers-reduced-motion:reduce){#cue{animation:none;transform:scale(1.3);opacity:.9}}\n/* kit:frac 2026-11-14 —— 分数一律上下结构（A.4 第 2 条）。HTML 里用 .frac，SVG 里用 fracS() */\n.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-family:var(--f-mono);font-size:.84em;margin:0 .2em;font-variant-numeric:tabular-nums}\n.frac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .28em .04em}\n.frac>span:last-child{padding:.04em .28em 0}\n.fl{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}\n.fs{fill:var(--ink);font-family:var(--f-mono);font-size:16px} .fm{fill:var(--ink);font-family:var(--f-mono);font-size:22px} .fb{fill:var(--ink);font-family:var(--f-mono);font-size:34px}\nbody.narrow .fs{font-size:20px} body.narrow .fm{font-size:26px} body.narrow .fb{font-size:38px}\n/* 模块自己的画面样式写在这里：字号全写在类上，窄屏在 body.narrow 里放大（教训 14、28）。下面几个类可以直接用 */\n.food{fill:var(--apricot)} .lead{fill:var(--accent)} .papr{fill:var(--paper)} .pane{fill:var(--pane)}\n.kacc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.one{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:7 6}\n.faint{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;opacity:.75}\n.lb{fill:var(--ink);font-family:var(--f-sans);font-size:17px}\n.lbg{fill:var(--muted);font-family:var(--f-sans);font-size:16px}\n.lbm{fill:var(--ink);font-family:var(--f-mono);font-size:17px}\n.big{fill:var(--ink);font-family:var(--f-mono);font-size:44px}\n.ttl{fill:var(--ink);font-family:var(--f-serif);font-size:26px}\n.sign{fill:var(--ink);font-family:var(--f-serif);font-size:24px}\n.tk{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round} .tkd{fill:none;stroke:var(--accent);stroke-width:1.1}\nbody.narrow .lb{font-size:21px} body.narrow .lbg{font-size:20px} body.narrow .lbm{font-size:20px}\nbody.narrow .big{font-size:50px} body.narrow .ttl{font-size:30px} body.narrow .sign{font-size:28px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\"><\/span><h1 id=\"title\"><\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 800 610\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <g id=\"dyn\"><\/g>\n      <g id=\"fx\"><circle id=\"cue\" cx=\"0\" cy=\"0\" r=\"10\" style=\"display:none\"/><\/g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n      <rect id=\"touch\" x=\"-400\" y=\"-400\" width=\"1600\" height=\"1410\" fill=\"transparent\"/><!-- 永不重画的触摸层（教训 25） -->\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* Curio · 数线跳跳 act.simulation.hop-line-01（几分之几：分数也能数）。设计说明：docs/constellations/zero-to-one/g1.md C.2 */\n\n/* ============ 1. 真相模型：页面上的每个数字都从这里算。只放数和纯函数，不碰页面 ============ */\nconst MODEL = {\n  firstDen: 4,                               // 第一趟每步 1/4（设计约定）\n  dens: [2, 3, 5, 6, 8, 10],                 // 第二趟可选的步长：1/2、1/3、1/5、1/6、1/8、1/10（设计约定）\n  lineMax: 2,                                // 跳和插旗用的数线画的是 0 到 2，只标 0、1、2（设计约定）\n  flags: [[1, 2], [1, 4], [3, 4]],           // 三面旗依次是 1/2、1/4、3/4（设计约定）\n  spots: [[\"甲\", 1, 2], [\"乙\", 2, 2], [\"丙\", 3, 2]],   // 提问时的三个候选点：甲在 1/2，乙在 1，丙在 1 又 1/2（设计约定）\n  hit: 0.04, near: 0.12,                     // 离真实位置不超过 0.04 算正中，不超过 0.12 算差一点，再远算差得远（手感约定）\n  flagStep: 0.02,                            // 键盘每按一次移 0.02（手感约定）\n  flagStart: 1.75,                           // 旗子出场的位置：离三面旗的答案和 0、1、2 都远，不暗示（设计约定）\n  gears: [2, 3, 4, 5, 6, 8, 10, 12, 20, 50, 100, 1000],   // 加密盘的档位（设计约定）\n  crowd: 50,                                 // 到 50 段以上，线上的刻度挤成一片，出现放大圈（画面约定）\n  mustReach: [100, 1000], minGears: 3,       // 至少在 3 个档位停过，并且到过 100 或 1000（设计约定）\n  settleMs: 600,                             // 转盘停住 0.6 秒算停过一档（手感约定）\n};\nconst pos = (k, n) => k / n;                                  // k 个 1/n 是 k/n，离 0 的距离是 k ÷ n（0 到 1 的距离当作 1）\nconst between = n => n - 1;                                   // 0 到 1 平均分成 n 段，中间多出 n − 1 个点：100→99，1000→999\nconst grade = (drop, target) => { const d = Math.abs(drop - target); return d <= MODEL.hit + 1e-9 ? \"hit\" : d <= MODEL.near + 1e-9 ? \"near\" : \"far\"; };\nconst r2 = v => Math.round(v * 100) / 100;\nconst fmt = n => String(Math.round(n));\n\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 共用零件：分数、「1」记号、圆钮、数线条  kit:parts ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 100 ? \"百\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;          // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 3;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1\", hold: false, press: false, kbd: false, dirty: true };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.innerHTML = (a.hold ? RIDGES : \"\") + `<span>${a.label}<\/span>`;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); if (v) touched(); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(ev, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(true); } });\n      b.addEventListener(\"keyup\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(false); } });\n      b.addEventListener(\"blur\", () => on(false));\n      b.addEventListener(\"contextmenu\", e => e.preventDefault());\n    } else {\n      b.addEventListener(\"click\", e => { if (performance.now() - born < 400 || (keyGuard && e.detail === 0)) return; a.go(e); });\n      if (guard){ b.disabled = true; const en = () => { setTimeout(() => { b.disabled = false; }, 120); removeEventListener(\"pointerup\", en, true); }; addEventListener(\"pointerup\", en, true); }\n    }\n    boxEl.append(b);\n  }\n  const first = boxEl.querySelector(\"button\");\n  if (first && !/^act/.test(S.mode)) first.focus({ preventScroll: true });\n  return boxEl;\n}\n// 猜测：只记下来，不在这里判对错的颜色。猜错的反馈先接住、再说清，然后一律去动手，让实物来回答\nfunction ask(question, options, onAnswer){\n  say(question);\n  actions(options.map((o, i) => ({ label: o.label, cls: \"choice\", go: () => {\n    if (!sentPred.has(S.station)){ sentPred.add(S.station); Host.event(\"predicted\", { station: S.station, choice: i, correct: !!o.correct, misconception: o.mis || null }); }\n    S.guess = S.guess || {}; S.guess[S.station] = o;\n    say(o.feedback, o.correct ? \"good\" : \"hmm\");\n    onAnswer(o);\n  }})));\n}\nfunction next(label, go, cls){ actions([{ label, go, cls }]); }\n// 星卡上选站重玩（#154）：replay 是正在重玩的站号，0 是从头往下走。重玩一站跳过开场和猜测题，直接进这一站的动手；\n// 揭晓完，原来「去第 k+1 站」「看我的星卡」的按钮换成「回星卡」（用 nextOr）。不出猜测题就不发 predicted；\n// observed 靠 observedOnce、complete 靠 completed，都只记第一次。每站怎么复位、怎么进动手是模块自己的事，写在 REPLAY[站号] 里\nlet replay = 0;\nconst REPLAY = {};\nfunction nextOr(label, go, cls){ if (replay) next(\"回星卡\", enterEnd); else next(label, go, cls); }\nfunction replayAt(k){ replay = k; gen++; S.station = k; hint(\"\"); readout(\"\"); disarmCue(); REPLAY[k](); }\nfunction restart(){ replay = 0; sentPred.clear(); sentObs.clear(); S.guess = {}; lastState = \"\"; enter1(); }   // 从头玩：和以前的「再玩一次」一样\nfunction endActions(){   // 星卡的按钮：从头玩 + 第 1 站…第 N 站。enterEnd() 最后调它\n  replay = 0;\n  actions([{ label: \"从头玩\", go: restart, cls: \"ghost tight\" }].concat(Array.from({ length: STATIONS }, (_, i) => ({ label: `第 ${i + 1} 站`, go: () => replayAt(i + 1), cls: \"tight\" }))));   // tight：手机上一行排得下\n}\n\n(function(){   // 「我有个问题」：随时可以问，发到信号站\n  const area = $(\"qarea\");\n  const open = document.createElement(\"button\");\n  open.type = \"button\"; open.className = \"btn ghost small\"; open.textContent = \"我有个问题\";\n  open.style.marginTop = \"12px\";\n  open.addEventListener(\"click\", () => {\n    if (area.querySelector(\"textarea\")) return;\n    const ta = document.createElement(\"textarea\"); ta.maxLength = 120; ta.placeholder = \"想问领航员什么？\";\n    const send = document.createElement(\"button\"); send.type = \"button\"; send.className = \"btn small\"; send.textContent = \"发给领航员\";\n    const bx = document.createElement(\"div\"); bx.className = \"qbox\"; bx.append(ta, send);\n    send.addEventListener(\"click\", () => { const q = ta.value.trim(); if (!q) return; Host.noteQuestion(q); bx.remove(); say(\"好问题，我记下来了。等会儿一起找答案。\"); });\n    area.append(bx); ta.focus();\n  });\n  area.append(open);\n})();\n\n// 第一屏的提醒（G6）：进入动手 1.5 秒还没碰，第一个圆钮外面扩出一圈细环；一碰就再也不出现\nlet cuePos = null, cueTimer = 0;\nfunction armCue(pos){ disarmCue(); const g = gen; cueTimer = setTimeout(() => { if (g === gen && /^act/.test(S.mode)){ cuePos = pos; S.dirty = true; } }, 1500); }\nfunction disarmCue(){ clearTimeout(cueTimer); cuePos = null; cueEl.style.display = \"none\"; }\nfunction touched(){ if (cuePos || cueTimer) disarmCue(); cueTimer = 0; }\nfunction placeCue(){ if (!cuePos) return; const [x, y, r] = cuePos(); cueEl.setAttribute(\"cx\", r1(x)); cueEl.setAttribute(\"cy\", r1(y)); cueEl.setAttribute(\"r\", r1((r || gripR()) + 2)); cueEl.style.display = \"\"; }   // 第三个数是被提醒的东西的半径（托里的一个）\n\n// 窄屏：viewBox 缩到中间 600 宽的操作区，字号类放大（教训 13、28）。每个场景写明自己用到的高度\n// 排版规矩：要紧的东西都画在 x = 110～690 之间；每个场景在这里写 [起始 y, 高度]\nconst VIEW = { s1: [110, 330], s1c: [110, 500], s2: [110, 330], s3q: [150, 300], s3: [120, 470], end: [8, 596] };\nfunction fitView(){\n  const nar = (svg.clientWidth || 800) < 600, [y, h] = VIEW[S.scene] || [0, 610];\n  document.body.classList.toggle(\"narrow\", nar);\n  const v = (nar ? [100, y, 600, h] : [0, y, 800, h]).join(\" \");\n  if (svg.getAttribute(\"viewBox\") !== v){ svg.setAttribute(\"viewBox\", v); S.dirty = true; }\n}\naddEventListener(\"resize\", fitView);\nfunction scene(name){ S.scene = name; fitView(); S.dirty = true; }\n\n/* ============ 6. 这个模块的零件：数线、停靠环、小火箭、旗 ============ */\nconst LN = { x0: 140, u: 260, y: 290 };                       // 第 1、2 站：0 到 2 的数线，1 个单位画 260 宽\nconst X = v => LN.x0 + LN.u * v;\nfunction numLine(y, x0, u, max, seed){   // 一条墨线，0、1、2 三个站各一个停靠环，数写在环里\n  let s = P(Sk.line(x0 - 20, y, x0 + u * max + 20, y, seed, .5));\n  for (let i = 0; i <= max; i++) s += `<circle cx=\"${x0 + u * i}\" cy=\"${y}\" r=\"14\" class=\"pane\"/>` + P(Sk.ellipse(x0 + u * i, y, 14, 14, seed + 1 + i, .4)) + TC(x0 + u * i, y + 6, i, \"lbm\");\n  return s;\n}\nconst oneBand = (y, x0, u, seed) => oneMark(x0 - 22, y - 24, u + 44, 48, seed, { below: true });   // 「1」是 0 到 1 这一段，不是整条线\nfunction rocket(x, by, fire){   // 原创的手绘小火箭：身子、舷窗、两片尾翼，跳的时候有一小撮火\n  return `<path d=\"M${r1(x)} ${by - 38}C${r1(x + 11)} ${by - 27} ${r1(x + 10)} ${by - 12} ${r1(x + 7)} ${by - 5}L${r1(x - 7)} ${by - 5}C${r1(x - 10)} ${by - 12} ${r1(x - 11)} ${by - 27} ${r1(x)} ${by - 38}Z\" class=\"lead\"/>` +\n    P(`M${r1(x)} ${by - 38}C${r1(x + 11)} ${by - 27} ${r1(x + 10)} ${by - 12} ${r1(x + 7)} ${by - 5}L${r1(x - 7)} ${by - 5}C${r1(x - 10)} ${by - 12} ${r1(x - 11)} ${by - 27} ${r1(x)} ${by - 38}M${r1(x - 8)} ${by - 12}L${r1(x - 14)} ${by - 2}L${r1(x - 7)} ${by - 5}M${r1(x + 8)} ${by - 12}L${r1(x + 14)} ${by - 2}L${r1(x + 7)} ${by - 5}`) +\n    `<circle cx=\"${r1(x)}\" cy=\"${by - 22}\" r=\"3.6\" fill=\"var(--pane)\"/>` + P(Sk.ellipse(x, by - 22, 3.6, 3.6, 31, .3), \"k1\") +\n    (fire ? P(`M${r1(x - 4)} ${by - 3}Q${r1(x)} ${by + 9} ${r1(x + 4)} ${by - 3}`, \"kacc\") : \"\");\n}\nfunction flag(x, base, a, b, o){   // 一面旗：旗杆、三角旗、上面写着它的分数。ghost 是当时插的地方留下的淡影\n  o = o || {}; const top = base - 58;\n  if (o.ghost) return P(`M${r1(x)} ${base}V${top}M${r1(x)} ${top}L${r1(x + 22)} ${top + 9}L${r1(x)} ${top + 18}`, \"kf\");\n  return `<path d=\"M${r1(x)} ${top}L${r1(x + 24)} ${top + 10}L${r1(x)} ${top + 20}Z\" class=\"lead\"/>` + P(Sk.line(x, base, x, top - 2, 41 + a + b, .25) + `M${r1(x)} ${top}L${r1(x + 24)} ${top + 10}L${r1(x)} ${top + 20}`) + fracS(x + 2, top - 26, a, b, \"fs\", 45 + b);\n}\nconst hopH = w => clamp(w * .45, 20, 64);\nconst arc = (xa, xb, y, cls) => P(`M${r1(xa)} ${y}Q${r1((xa + xb) / 2)} ${r1(y - 2 * hopH(xb - xa))} ${r1(xb)} ${y}`, cls);\nconst labelFits = (n, u) => u / n >= (narrow() ? 50 : 40);          // 标签太挤就只标当前这一步\n\n/* ============ 7. 第 1 站 · 跳：分数也能一个一个数 ============ */\nconst chipPos = i => narrow() ? { x: 400 + (i % 3 - 1) * 100, y: 452 + Math.floor(i / 3) * 92, r: 40 } : { x: 400 + (i - 2.5) * 70, y: 470, r: 28 };\nfunction trail(den, steps, ghost){   // 一趟跳下来留下的弧线、刻度和分数标签\n  let s = \"\";\n  for (let k = 1; k <= steps; k++){\n    const x = X(pos(k, den));\n    s += arc(X(pos(k - 1, den)), x, LN.y - 24, ghost ? \"faint\" : \"kf\") + P(`M${r1(x)} ${LN.y - 9}V${LN.y + 9}`, ghost ? \"faint\" : \"k\");\n    if (!ghost && k % den && (labelFits(den, LN.u) || k === steps)) s += fracS(x, LN.y + 46, k, den, \"fs\", 50 + k);\n    if (!ghost && k % den === 0 && k === steps) s += fracS(x, LN.y + 46, k, den, \"fs\", 50 + k);\n  }\n  return s;\n}\nfunction draw1(){\n  const e = S.hop < 1 ? S.hop * S.hop * (3 - 2 * S.hop) : 1, xa = X(pos(Math.max(S.steps - 1, 0), S.den)), xb = X(pos(S.steps, S.den));\n  const rx = S.steps ? lerp(xa, xb, e) : X(0), ry = LN.y - 24 - (S.steps && S.hop < 1 ? 2 * hopH(xb - xa) * 2 * e * (1 - e) : 0);\n  let s = (S.ghost ? trail(S.ghost.den, S.ghost.steps, true) : \"\") + oneBand(LN.y, LN.x0, LN.u, 60) + numLine(LN.y, LN.x0, LN.u, MODEL.lineMax, 70);\n  s += trail(S.den, S.hop < 1 ? S.steps - 1 : S.steps) + rocket(rx, ry, S.hop < 1);\n  if (S.scene === \"s1c\"){   // 步长的托：一组里挑一个\n    const a = chipPos(0), b = chipPos(MODEL.dens.length - 1);\n    s += `<rect x=\"${a.x - a.r - 12}\" y=\"${a.y - a.r - 12}\" width=\"${b.x - a.x + 2 * a.r + 24}\" height=\"${b.y - a.y + 2 * a.r + 24}\" rx=\"${a.r + 12}\" class=\"gsoft\"/>`;\n    MODEL.dens.forEach((d, i) => { const c = chipPos(i), on = d === S.den && S.trip === 2;\n      s += `<circle cx=\"${c.x}\" cy=\"${c.y}\" r=\"${c.r}\" class=\"${on ? \"gfill\" : \"pane\"}\"/>` + P(Sk.ellipse(c.x, c.y, c.r, c.r, 80 + i, .4), on ? \"gring\" : \"k1\") + `<g${on ? ' style=\"--ink:var(--bg)\"' : \"\"}>` + fracS(c.x, c.y + 1, 1, d, \"fs\", 90 + i) + `<\/g>` +\n        (S.kbd && on ? `<circle cx=\"${c.x}\" cy=\"${c.y}\" r=\"${c.r + 6}\" class=\"gkbd\"/>` : \"\"); });\n  }\n  return s;\n}\nfunction readout1(){\n  const k = S.steps, n = S.den;\n  readout(!k ? `还没跳 · 每步 ${F(1, n)}` : `跳了 ${k} 步 · ${k} 个 ${F(1, n)} ` + (k % n ? `是 ${F(k, n)}` : `正好是 ${k / n}`));\n  sendState({ station: 1, den: n, steps: k });\n}\nfunction hint1(){ hint(S.done2 ? \"按「跳一步」，或者换个步子\" : S.done4 ? \"点一个小圆片换步子，再跳到 1\" : \"按「跳一步」\"); }\nfunction hop(){\n  if (S.mode !== \"act1\" || S.hop < 1 || S.steps >= S.den * MODEL.lineMax) return;\n  S.steps++; S.hop = reduced ? 1 : 0; S.dirty = true; touchedHop(); if (reduced) landed();\n}\nfunction touchedHop(){ if (!S.done4) return; }\nfunction landed(){\n  const k = S.steps, n = S.den; readout1();\n  if (k === n){\n    if (S.trip === 2) S.lastDen = n;   // 星卡只画跳到了 1 的步长：选了没跳完的不算（教训 12）\n    if (S.trip === 1 && !S.done4){ S.done4 = true; scene(\"s1c\"); say(`4 个 ${F(1, 4)}，正好到 1。想换个步子，就点下面的小圆片。`); armCue(() => { const c = chipPos(0); return [c.x, c.y, c.r]; }); }\n    else if (S.trip === 2 && !S.done2){ S.done2 = true; say(`${n} 个 ${F(1, n)}，也正好到 1。还想换步子就接着玩，看够了点「看明白了」。`); acts1(); }\n    else say(`${n} 个 ${F(1, n)}，正好到 1。`);\n  } else if (k > n && !S.overSaid){ S.overSaid = true; say(\"跳过 1 了。分数也可以比 1 大，以后会给它起名字。\"); }\n  else if (k === n * MODEL.lineMax) say(\"到 2 了，线只画到这儿。换个步子再跳。\");\n  else if (S.trip === 1 && k === 1) say(`跳了一步，落在 ${F(1, 4)} 上。这里也是一个数。`);\n  else if (S.trip === 1 && k === 2) say(`2 个 ${F(1, 4)}，是 ${F(2, 4)}。`);\n  else if (S.trip === 1 && k === 3) say(`3 个 ${F(1, 4)} 合起来，叫四分之三，写作 ${F(3, 4)}。`);\n  hint1();\n}\nfunction pickDen(d){\n  if (S.mode !== \"act1\" || !S.done4 || S.hop < 1 || (d === S.den && S.trip === 2)) return;\n  S.ghost = { den: S.den, steps: Math.min(S.steps, S.den) }; S.den = d; S.steps = 0; S.trip = 2; S.dirty = true;\n  say(`每步 ${F(1, d)}。按「跳一步」，数一数几步到 1。`); readout1(); hint1();\n}\nfunction acts1(){ actions([{ label: \"跳一步\", go: hop }].concat(S.done2 ? [{ label: \"看明白了\", go: done1, cls: \"ghost\" }] : [])); }\nfunction enter1(){\n  gen++; S.station = 1; S.mode = \"talk\"; head(1, \"跳：一步一个\"); hint(\"\"); readout(\"\"); disarmCue();\n  Object.assign(S, { den: MODEL.firstDen, steps: 0, hop: 1, trip: 1, ghost: null, done4: false, done2: false, overSaid: false, lastDen: 0 }); scene(\"s1\");\n  say(\"尺子上，0 后面是 1，1 后面是 2。0 和 1 中间那一小段空着。\");\n  next(\"然后呢\", () => ask(\"0 和 1 之间，还有别的数吗？\", [\n    { label: \"没有，0 后面就是 1\", mis: \"no-numbers-between\", feedback: \"数数的时候，0 后面确实就是 1。可火箭不一定要一步跳那么远。\" },\n    { le": "几分之几：分数也能数"}, {"activities": [{"age_band": "G3-4", "duration_min": 8, "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>谁的几分之几<\/title>\n<style>\n/* kit:base —— 颜色、卡片、气泡、按钮。色值不要改；模块自己的样式写在最后一段 */\n/* 长按不选字、不弹菜单（#156）。输入框照常能选能改 */\nhtml{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\ninput,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}\n:root{\n  --bg:#F5F4EE; --pane:#FBFAF6; --rule:#E0DCD0; --hover:#E7E4D9;\n  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;\n  --accent:#C2603F; --accent-soft:#F3E0D6;\n  --grip:#2A7F7C; --grip-soft:#D3E8E5;\n  --sage:#CCD6C0; --sage-bg:#DCE3D2; --sky:#CFDCE6; --apricot:#ECCDB6; --paper:#EFE4D6;\n  --dad:#4F7FA8; --mom:#C2603F; --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;\n  --f-serif:\"Noto Serif SC\",\"Source Han Serif SC\",\"Songti SC\",Georgia,serif;\n  --f-sans:\"Noto Sans SC\",\"PingFang SC\",\"Microsoft YaHei\",system-ui,sans-serif;\n  --f-mono:ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n  color-scheme:light;\n}\n@media (prefers-color-scheme:dark){:root{\n  --bg:#1E1E1E; --pane:#252525; --rule:#353535; --hover:#2E2E2E;\n  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;\n  --accent:#E0876A; --accent-soft:#3A2A24;\n  --grip:#5FC4BE; --grip-soft:#1F3634;\n  --sage:#3C4836; --sage-bg:#28301F; --sky:#2D3B47; --apricot:#5A4536; --paper:#33302A;\n  --dad:#7FA9CF; --mom:#E0876A; --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;\n  color-scheme:dark;\n}}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}\nbutton{font:inherit;color:inherit;cursor:pointer}\n.wrap{max-width:820px;margin:0 auto;padding:12px 14px 28px}\n.card{background:var(--pane);border:1px s  infinite}\n@keyframes cue{0%{transform:scale(1);opacity:.95}50%{transform:scale(1.8);opacity:0}100%{transform:scale(1.8);opacity:0}}\n@media (prefers-reduced-motion:reduce){#cue{animation:none;transform:scale(1.3);opacity:.9}}\n/* kit:frac 2026-11-14 —— 分数一律上下结构（A.4 第 2 条）。HTML 里用 .frac，SVG 里用 fracS() */\n.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-family:var(--f-mono);font-size:.84em;margin:0 .2em;font-variant-numeric:tabular-nums}\n.frac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .28em .04em}\n.frac>span:last-child{padding:.04em .28em 0}\n.fl{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}\n.fs{fill:var(--ink);font-family:var(--f-mono);font-size:16px} .fm{fill:var(--ink);font-family:var(--f-mono);font-size:22px} .fb{fill:var(--ink);font-family:var(--f-mono);font-size:34px}\nbody.narrow .fs{font-size:20px} body.narrow .fm{font-size:26px} body.narrow .fb{font-size:38px}\n/* 模块自己的画面样式写在这里：字号全写在类上，窄屏在 body.narrow 里放大（教训 14、28）。下面几个类可以直接用 */\n.food{fill:var(--apricot)} .lead{fill:var(--accent)} .papr{fill:var(--paper)} .pane{fill:var(--pane)}\n.kacc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.one{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:7 6}\n.faint{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;opacity:.75}\n.lb{fill:var(--ink);font-family:var(--f-sans);font-size:17px}\n.lbg{fill:var(--muted);font-family:var(--f-sans);font-size:16px}\n.lbm{fill:var(--ink);font-family:var(--f-mono);font-size:17px}\n.big{fill:var(--ink);font-family:var(--f-mono);font-size:44px}\n.ttl{fill:var(--ink);font-family:var(--f-serif);font-size:26px}\n.sign{fill:var(--ink);font-family:var(--f-serif);font-size:24px}\n.tk{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round} .tkd{fill:none;stroke:var(--accent);stroke-width:1.1}\nbody.narrow .lb{font-size:21px} body.narrow .lbg{font-size:20px} body.narrow .lbm{font-size:20px}\nbody.narrow .big{font-size:50px} body.narrow .ttl{font-size:30px} body.narrow .sign{font-size:28px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\"><\/span><h1 id=\"title\"><\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 800 610\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <g id=\"dyn\"><\/g>\n      <g id=\"fx\"><circle id=\"cue\" cx=\"0\" cy=\"0\" r=\"10\" style=\"display:none\"/><\/g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n      <rect id=\"touch\" x=\"-400\" y=\"-400\" width=\"1600\" height=\"1410\" fill=\"transparent\"/><!-- 永不重画的触摸层（教训 25） -->\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* Curio · 谁的一半 act.simulation.whose-half-01（谁的几分之几）。设计说明：docs/constellations/zero-to-one/stars/03-the-whole.md */\n\n/* ============ 1. 真相模型：页面上的每个数字都从这里算。只放数和纯函数，不碰页面 ============ */\nconst MODEL = {\n  navLen: 20, navDen: 2,                     // 领航员那条蛋糕卷 20 厘米，吃 1/2（设计约定）\n  capDen: 4,                                 // 舰长吃的是 1/4（设计约定）\n  lenMin: 8, lenMax: 64, lenStep: 8, lenStart: 16,   // 舰长那条：8 到 64 厘米，每 8 厘米吸一格，一开始 16（设计约定）\n  same: 40, longer: 48,                      // 停在 40 一样多，停在 48 以上舰长多（由 navPart 算：20 ÷ 2 = 10 = 40 ÷ 4）\n  stopMs: 600,                               // 键盘最后一次按键之后 0.6 秒没再按，算停下（手感约定）\n  bag: 12, plateCounts: [2, 3, 4, 6], platesStart: 4, lightTarget: 3,   // 一袋 12 颗；盘子数只取能平均分的（设计约定）\n  part: 5, dens: [2, 3, 4, 5, 10], denStart: 3, mustFill: 3,            // 第 3 站：5 颗是一袋的 1/n（设计约定）；1/3 加另外两种\n  holdFirst: 300, holdEvery: 700,            // 按住：0.3 秒摆第一份，之后每 0.7 秒一份（手感约定）\n  whale: 30, whaleDen: 10, kid: 130,         // 大的蓝鲸能长到 30 米左右（NOAA：27～33.5 米，取整）；8 岁孩子大约 130 厘米（WS/T 612—2018 中位数），两个叠起来 260 厘米，9 岁也不到 3 米\n};\nconst navPart = () => MODEL.navLen / MODEL.navDen;            // 10 厘米\nconst capPart = L => L / MODEL.capDen;                        // 8→2，16→4，…，40→10，64→16\nconst each = n => MODEL.bag / n;                              // 2 盘 6 颗，3 盘 4 颗，4 盘 3 颗，6 盘 2 颗\nconst wholeOf = den => MODEL.part * den;                      // 5 颗是一袋的 1/n，一整袋 5 × n 颗\nconst whalePart = () => MODEL.whale / MODEL.whaleDen;         // 3 米\nconst kids2 = () => MODEL.kid * 2;                            // 260 厘米\nconst fmt = n => String(Math.round(n));\n\n\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 共用零件：分数、「1」记号、圆钮、数线条  kit:parts ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 100 ? \"百\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;          // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 3;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1\", hold: false, press: false, kbd: false, dirty: true };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"ke dback, o.correct ? \"good\" : \"hmm\");\n    onAnswer(o);\n  }})));\n}\nfunction next(label, go, cls){ actions([{ label, go, cls }]); }\n// 星卡上选站重玩（#154）：replay 是正在重玩的站号，0 是从头往下走。重玩一站跳过开场和猜测题，直接进这一站的动手；\n// 揭晓完，原来「去第 k+1 站」「看我的星卡」的按钮换成「回星卡」（用 nextOr）。不出猜测题就不发 predicted；\n// observed 靠 observedOnce、complete 靠 completed，都只记第一次。每站怎么复位、怎么进动手是模块自己的事，写在 REPLAY[站号] 里\nlet replay = 0;\nconst REPLAY = {};\nfunction nextOr(label, go, cls){ if (replay) next(\"回星卡\", enterEnd); else next(label, go, cls); }\nfunction replayAt(k){ replay = k; gen++; S.station = k; hint(\"\"); readout(\"\"); disarmCue(); REPLAY[k](); }\nfunction restart(){ replay = 0; sentPred.clear(); sentObs.clear(); S.guess = {}; lastState = \"\"; enter1(); }   // 从头玩：和以前的「再玩一次」一样\nfunction endActions(){   // 星卡的按钮：从头玩 + 第 1 站…第 N 站。enterEnd() 最后调它\n  replay = 0;\n  actions([{ label: \"从头玩\", go: restart, cls: \"ghost tight\" }].concat(Array.from({ length: STATIONS }, (_, i) => ({ label: `第 ${i + 1} 站`, go: () => replayAt(i + 1), cls: \"tight\" }))));   // tight：手机上一行排得下\n}\n\n(function(){   // 「我有个问题」：随时可以问，发到信号站\n  const area = $(\"qarea\");\n  const open = document.createElement(\"button\");\n  open.type = \"button\"; open.className = \"btn ghost small\"; open.textContent = \"我有个问题\";\n  open.style.marginTop = \"12px\";\n  open.addEventListener(\"click\", () => {\n    if (area.querySelector(\"textarea\")) return;\n    const ta = document.createElement(\"textarea\"); ta.maxLength = 120; ta.placeholder = \"想问领航员什么？\";\n    const send = document.createElement(\"button\"); send.type = \"button\"; send.className = \"btn small\"; send.textContent = \"发给领航员\";\n    const bx = document.createElement(\"div\"); bx.className = \"qbox\"; bx.append(ta, send);\n    send.addEventListener(\"click\", () => { const q = ta.value.trim(); if (!q) return; Host.noteQuestion(q); bx.remove(); say(\"好问题，我记下来了。等会儿一起找答案。\"); });\n    area.append(bx); ta.focus();\n  });\n  area.append(open);\n})();\n\n// 第一屏的提醒（G6）：进入动手 1.5 秒还没碰，第一个圆钮外面  tw(String(p).trim(), sz));\n  let x = cx - ws.reduce((a, b) => a + b, 0) / 2, s = \"\";\n  parts.forEach((p, i) => { s += Array.isArray(p) ? fracS(r1(x + ws[i] / 2), r1(y - sz * .34), p[0], p[1], \"fs\", (seed || 300) + i) : T(r1(x), y, String(p).trim(), cls); x += ws[i]; });\n  return s;\n}\nfunction rbox(x, y, w, h, r, seed, j){   // 手绘的圆角框\n  const p = [], q = [[x + w - r, y + r, -90], [x + w - r, y + h - r, 0], [x + r, y + h - r, 90], [x + r, y + r, 180]];\n  for (const [cx, cy, a0] of q) for (const t of [0, 45, 90]){ const a = (a0 + t) * Math.PI / 180; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }\n  const rnd = Sk.R(seed); j = j == null ? .6 : j;\n  return Sk.cr(p.map(([a, b]) => [a + (rnd() - .5) * j, b + (rnd() - .5) * j]), true) + \"Z\";\n}\nconst smallR = () => Math.max(11, 9.5 * pxScale());                   // 小圆钮：画出来直径不小于 18 px（G4）\nfunction smallGrip(x, y, o){   // 小圆钮：和圆钮一样，小一号，没有箭头（G1）\n  o = o || {}; const r = smallR() * (o.on ? 1.12 : 1);\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 73, .4), \"gring\" + (o.on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]) s += P(`M${r1(x + i * r * .38)} ${r1(y - r * (i ? .34 : .48))}V${r1(y + r * (i ? .34 : .48))}`, \"gridge\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 一段蛋糕卷：杏色的圆角长条，中间一道奶油卷纹；cut 是平均切成几份，gone 是被吃走的那一份（只剩虚线轮廓）\nfunction cake(x, y, w, h, cut, gone, o){\n  o = o || {}; const n = cut || 1, pw = w / n; let s = \"\";\n  for (let i = 0; i < n; i++){\n    const px = x + i * pw;\n    if (i === gone){ s += P(rbox(px + 1, y + 1, pw - 2, h - 2, Math.min(8, pw / 3), 400 + i, .4), \"kf\"); continue; }\n    s += `<rect x=\"${r1(px)}\" y=\"${y}\" width=\"${r1(pw)}\" height=\"${h}\" rx=\"${Math.min(9, pw / 3)}\" class=\"${o.fill || \"food\"}\"/>`;\n    if (pw > 22) s += P(Sk.curve([[px + 6, y + h * .55], [px + pw * .35, y + h * .42], [px + pw * .65, y + h * .62], [px + pw - 6, y + h * .48]], 410 + i, .4), \"faint\");\n  }\n  const outline = gone == null ? rbox(x, y, w, h, Math.min(10, w / 3), o.seed || 420) : \"\";\n  if (outline) s += P(outline, o.ink || \"k\");\n  else for (let i = 0; i < n; i++) if (i !== gone) s += P(rbox(x + i * pw, y, pw, h, Math.min(9, pw / 3), (o.seed || 420) + i, .5), o.ink || \"k\");\n  for (let i = 1; i < n; i++) if (gone == null) s += P(Sk.line(x + i * pw, y + 2, x + i * pw, y + h - 2, 430 + i, .3), \"k1\");\n  return `<g class=\"roll\">${s}<\/g>`;\n}\nfunction plate(cx, y, rx, seed, cls){   // 一个盘子：扁椭圆，墨线描边\n  return `<ellipse cx=\"${r1(cx)}\" cy=\"${y}\" rx=\"${r1(rx)}\" ry=\"${r1(Math.max(9, rx * .22))}\" ${cls === \"lit\" ? 'fill=\"var(--accent-soft)\"' : `class=\"${cls || \"pane\"}\"`}/>` + P(Sk.ellipse(cx, y, rx, Math.max(9, rx * .22), seed, .5), \"k1\");   // lit：点亮的盘子垫一层淡色\n}\nfunction candy(x, y, i, r){   // 一颗糖：圆圆的糖身，两头拧起来的糖纸。鼠尾草绿和天蓝轮着来，颜色没有含义\n  r = r || 10; const c = i % 2 ? \"var(--sky)\" : \"var(--sage)\", rr = r * .78, a = r * .62, b = r * .52;\n  const ends = `M${r1(x - r + 1)} ${r1(y)}L${r1(x - r - a)} ${r1(y - b)}L${r1(x - r - a)} ${r1(y + b)}ZM${r1(x + r - 1)} ${r1(y)}L${r1(x + r + a)} ${r1(y - b)}L${r1(x + r + a)} ${r1(y + b)}Z`;\n  return `<g class=\"candy\"><path d=\"${ends}\" fill=\"${c}\"/><ellipse cx=\"${r1(x)}\" cy=\"${r1(y)}\" rx=\"${r}\" ry=\"${r1(rr)}\" fill=\"${c}\"/>` + P(Sk.ellipse(x, y, r, rr, 500 + i, .3) + ends, \"k1\") + `<\/g>`;\n}\nfunction sign(cx, y, w, h, inner, seed){   // 纸色的牌子\n  return `<rect x=\"${r1(cx - w / 2)}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"8\" class=\"papr\"/>` + P(box(cx - w / 2, y, w, h, seed, .6), \"k1\") + inner;\n}\nfunction kid(x, base, h, seed){   // 一个原创的小人：圆脑袋、短身子、两条腿。h 是身高（画面单位）\n  const hr = h * .13, hy = base - h + hr, sy = hy + hr, sb = base - h * .36;\n  return `<circle cx=\"${x}\" cy=\"${r1(hy)}\" r=\"${r1(hr)}\" class=\"papr\"/>` + P(Sk.ellipse(x, hy, hr, hr, seed, .3), \"k1\") +\n    `<path d=\"M${r1(x - h * .13)} ${r1(sb)}L${r1(x - h * .1)} ${r1(sy + 3)}L${r1(x + h * .1)} ${r1(sy + 3)}L${r1(x + h * .13)} ${r1(sb)}Z\" class=\"papr\"/>` +\n    P(`M${r1(x - h * .13)} ${r1(sb)}L${r1(x - h * .1)} ${r1(sy + 3)}L${r1(x + h * .1)} ${r1(sy + 3)}L${r1(x + h * .13)} ${r1(sb)}Z` + Sk.line(x - h * .06, sb, x - h * .07, base, seed + 1, .3) + Sk.line(x + h * .06, sb, x + h * .07, base, seed + 2, .3) +\n      Sk.line(x - h * .1, sy + h * .08, x - h * .2, sy + h * .26, seed + 3, .3) + Sk.line(x + h * .1, sy + h * .08, x + h * .2, sy + h * .26, seed + 4, .3), \"k1\") +\n    `<circle cx=\"${r1(x - hr * .35)}\" cy=\"${r1(hy - hr * .05)}\" r=\"1.6\" fill=\"var(--ink)\"/><circle cx=\"${r1(x + hr * .35)}\" cy=\"${r1(hy - hr * .05)}\" r=\"1.6\" fill=\"var(--ink)\"/>`;\n}\n\n/* ============ 7. 第 1 站 · 拉：整体变大，同样的 1/4 也跟着变大 ============ */\nconst CM = 8, RX0 = 130;                                        // 1 厘米画 8 宽；两条蛋糕卷、尺子、两块蛋糕的左端都在 x = 130\nconst R1 = { nav: 150, cap: 236, h: 34, ruler: 306, navTray: 408, capTray: 476, ph: 26 };\nconst lenX = cm => RX0 + cm * CM;\nconst handleXY = () => [lenX(S.Lp) + gripR() * .55, R1.cap + R1.h / 2];   // 圆钮装在蛋糕卷右端，稍往外，不压住 8 厘米那么短的卷\nfunction draw1q(){   // 提问时：两个扣着餐罩的盘子、两块牌子。不画蛋糕卷\n  let s = \"\";\n  [[255, \"领航员\", 2, 1], [545, \"舰长\", 4, 2]].forEach(([cx, who, d, k]) => {\n    s += sign(cx, 196, 262, 62, rich(cx, 236, [`${who}：一条蛋糕卷的`, [1, d]], \"lb\", 600 + k * 10), 610 + k);\n    s += plate(cx, 352, 112, 620 + k) + `<path d=\"M${cx - 92} 350C${cx - 92} 262 ${cx + 92} 262 ${cx + 92} 350Z\" class=\"papr\"/>` +\n      P(`M${cx - 92} 350C${cx - 92} 262 ${cx + 92} 262 ${cx + 92} 350` + Sk.line(cx - 92, 350, cx + 92, 350, 630 + k, .4)) +\n      `<circle cx=\"${cx}\" cy=\"283\" r=\"8\" class=\"pane\"/>` + P(Sk.ellipse(cx, 283, 8, 8, 640 + k, .3), \"k1\") + P(Sk.curve([[cx - 58, 322], [cx - 50, 300], [cx - 32, 288]], 650 + k, .4), \"faint\");\n  });\n  return s;\n}\nfunction draw1(){\n  const L = S.Lp, act = S.mode === \"act1\", wN = lenX(MODEL.navLen) - RX0, wC = L * CM, pN = navPart() * CM, pC = capPart(L) * CM;\n  let s = \"\";\n  // 两条蛋糕卷，各套一个「1」记号；舰长那条（主角）随拉手伸缩，始终平均切成 4 份\n  s += oneMark(RX0 - 8, R1.nav - 9, wN + 16, R1.h + 18, 700) + T(RX0 + 42, R1.nav - 15, `领航员的蛋糕卷 · ${MODEL.navLen} 厘米`, \"lbg\");\n  s += cake(RX0, R1.nav, wN, R1.h, MODEL.navDen, 0, { seed: 710 });\n  s += oneMark(RX0 - 8, R1.cap - 9, wC + 16, R1.h + 18, 720) + T(RX0 + 42, R1.cap - 15, `舰长的蛋糕卷 · ${S.L} 厘米`, \"lbg\");\n  s += cake(RX0, R1.cap, wC, R1.h, MODEL.capDen, 0, { seed: 730, ink: \"kacc\" });\n  // 尺子：0 对着蛋糕卷的左端，每 8 厘米一个数\n  s += P(Sk.line(RX0, R1.ruler, lenX(MODEL.lenMax), R1.ruler, 740, .4));\n  let d = \"\"; for (let c = 0; c <= MODEL.lenMax; c++) d += `M${lenX(c)} ${R1.ruler}v${c % 8 ? 6 : 13}`;\n  s += P(d, \"k1\"); for (let c = 0; c <= MODEL.lenMax; c += 8) s += TC(lenX(c), R1.ruler + 34, c, \"lbm\");\n  s += TC(lenX(MODEL.lenMax), R1.ruler + 58, \"厘米\", \"lbg\");\n  // 两个盘子里的两块：左端对齐，一道虚线对着领航员那块的右端，长短一眼看出\n  s += plate(RX0 + 70, R1.navTray, 84, 750) + `<rect x=\"${RX0}\" y=\"${R1.navTray - R1.ph - 2}\" width=\"${r1(pN)}\" height=\"${R1.ph}\" rx=\"8\" class=\"food\"/>` + P(rbox(RX0, R1.navTray - R1.ph - 2, pN, R1.ph, 8, 751, .5));\n  s += T(RX0 + 178, R1.navTray - 6, `领航员 · ${navPart()} 厘米`, \"lb\");\n  s += plate(RX0 + 70, R1.capTray, 84, 760) + `<rect x=\"${RX0}\" y=\"${R1.capTray - R1.ph - 2}\" width=\"${r1(pC)}\" height=\"${R1.ph}\" rx=\"8\" class=\"lead\"/>` + P(rbox(RX0, R1.capTray - R1.ph - 2, pC, R1.ph, 8, 761, .5));\n  s += T(RX0 + 178, R1.capTray - 6, `舰长 · ${fmt(capPart(S.L))} 厘米`, \"lb\");\n  s += P(`M${RX0 + pN} ${R1.navTray - R1.ph - 12}V${R1.capTray + 8}`, \"kf\");\n  if (act){ const [hx, hy] = handleXY(); s += grip(hx, hy, [1, 0], { on: S.press, kbd: S.kbd, seed: 770 }); }\n  return s;\n}\nfunction readout1(){ readout(`领航员：${MODEL.navLen} 厘米的 ${F(1, MODEL.navDen)} 是 ${navPart()} 厘米 · 舰长：${S.L} 厘米的 ${F(1, MODEL.capDen)} 是 ${fmt(capPart(S.L))} 厘米`); }\nfunction hint1(){\n  const need = [!S.stop40 && \"拉到两块一样长\", !S.stop48 && \"拉到比我的还长\"].filter(Boolean);\n  hint(need.length ? `拖动圆钮 · 还要${need.join(\"、\")}` : \"拖动圆钮，接着试\");\n}\nfunction setL(v){ v = clamp(Math.round(v / MODEL.lenStep) * MODEL.lenStep, MODEL.lenMin, MODEL.lenMax); if (v === S.L) return false; S.L = v; S.dirty = true; readout1(); return true; }\nfunction stop1(){\n  S.keyStop = 0; if (S.mode !== \"act1\") return;\n  const L = S.L, p = capPart(L), first40 = L === MODEL.same && !S.stop40, first48 = L >= MODEL.longer && !S.stop48;\n  S.lastL = L; S.maxL = Math.max(S.maxL || 0, L);\n  sendState({ station: 1, whole: L, part: p, other: navPart() });\n  if (L === MODEL.same){ S.stop40 = true; say(`一样多了。你吃的是 ${F(1, 4)}，我吃的是 ${F(1, 2)}。`); }\n  else if (L >= MODEL.longer){ S.stop48 = true; say(`你那块比我的还长。${L} 厘米的 ${F(1, 4)} 是 ${p} 厘米。`); }\n  else if (L < MODEL.same) say(`${L} 厘米的 ${F(1, 4)} 是 ${p} 厘米。还是我的长。`);\n  if (S.stop40 && S.stop48 && (first40 || first48)){ $(\"say\").innerHTML += \"还能接着拉。看够了点「看明白了」。\"; acts1(); }\n  hint1();\n}\nfunction acts1(){ actions(S.stop40 && S.stop48 ? [{ label: \"看明白了\", go: done1, cls: \"ghost\" }] : []); }\nfunction enter1(){\n  gen++; S.station = 1; S.mode = \"intro1\"; head(1, \"拉：谁的蛋糕卷\"); hint(\"\"); readout(\"\"); disarmCue();\n  Object.assign(S, { L: MODEL.lenStart, Lp: MODEL.lenStart, stop40: false, stop48: false, keyStop: 0, maxL: 0 }); scene(\"s1q\");\n  say(`我吃了一条蛋糕卷的 ${F(1, 2)}。你吃了一条蛋糕卷的 ${F(1, 4)}。`);\n  next(\"然后呢\", () => { S.mode = \"ask1\"; ask(\"谁吃得多？\", [\n    { label: `领航员，${F(1, 2)} 比 ${F(1, 4)} 大`, mis: \"ignore-the-whole\", feedback: `你记得 ${F(1, 2)} 比 ${F(1, 4)} 大，这没有错。可这两条蛋糕卷，你还没见过呢。` },\n    { label: \"不一定，要看蛋糕卷有多长\", correct: true, feedback: \"你想先看看蛋糕卷。那就揭开餐罩。\" },\n    { label: \"一样多，都是吃了一份\", mis: \"ignore-the-whole\", feedback: \"都是一份，听着是一样多。可这一份和那一份，一定一样大吗？\" }\n  ], () => next(\"揭开餐罩\", act1)); });\n}\nfunction act1(){\n  S.mode = \"act1\"; scene(\"s1\"); acts1(); readout1(); hint1();\n  say((replay ? \"\" : \"带圆钮的地方，都能用手抓。\") + \"现在你那块比我的短。拖动圆钮，把你那条蛋糕卷拉长。\");\n  svg.focus({ preventScroll: true }); armCue(handleXY);\n}\nREPLAY[1] = () => {   // 重玩第 1 站：蛋糕卷回到 16 厘米、两个「停过」清掉，跳过开场和猜测题。lastL 留着，停下时才换成新的\n  head(1, \"拉：谁的蛋糕卷\"); Object.assign(S, { L: MODEL.lenStart, Lp: MODEL.lenStart, stop40: false, stop48: false, keyStop: 0, maxL: 0 }); act1();\n};\nfunction done1(){\n  S.mode = \"rev1\"; hint(\"\"); disarmCue(); observedOnce(1); S.dirty = true;\n  say(\"分数说的是占整体的多少。被平均分的那条蛋糕卷，就叫整体。\", \"good\");\n  next(\"我来说\", () => {   // 让舰长自己说出结论：只挑半句，不记事件\n    S.mode = \"say1\"; say(`你来说：整体变大，同样的 ${F(1, 4)} 也跟着变＿。`);\n    const big = fmt(capPart(S.maxL || MODEL.lenMax));\n    actions([[\"大\", true], [\"小\", false], [\"不变\", false]].map(([w, ok]) => ({ label: w, cls: \"choice\", go: () => {\n      say((ok ? \"对，跟着变大。\" : \"是跟着变大。\") + `你的 ${F(1, 4)} 从 ${fmt(capPart(MODEL.lenStart))} 厘米，长到过 ${big} 厘米。`, ok ? \"good\" : \"hmm\");\n      next(\"还有呢\", () => { S.mode = \"rev1\"; const g = S.guess && S.guess[1];\n        say(`同一条蛋糕卷上，${F(1, 2)} 比 ${F(1, 4)} 多。换了一条，就要先问一句：谁的 ${F(1, 4)}？` + (g && g.correct ? \"你一开始就想到要看蛋糕卷。\" : \"所以光比分数，比不出谁吃得多。\"), \"good\");\n        nextOr(\"去第 2 站\", enter2); });\n    }})));\n  });\n}\n\n/* ============ 8. 第 2 站 · 发：一袋糖也能当一个整体 ============ */\nconst BAG = { x: 400, top: 118, bot: 262, wt: 196, wb: 220 }, PY = 386;\nconst bagXY = () => [BAG.x, 196];\nconst bagGrip = () => [BAG.x + BAG.wt / 2 + 6, BAG.top + 4];\nconst gapOf = n => Math.min(136, 560 / n), rxOf = n => Math.min(54, gapOf(n) * .42);\nconst plateXY = i => [BAG.x + (i - (S.plates - 1) / 2) * gapOf(S.plates), PY - 12];\nconst plateGrip = i => [plateXY(i)[0] + rxOf(S.plates) * .86, PY + 4];\nconst inBag = k => { const c = k % 4, r = Math.floor(k / 4); return [BAG.x + (c - 1.5) * 42 + (r % 2 ? 6 : -6), 238 - r * 32]; };   // 袋里第 k 颗糖的位置，从底下一层往上排\nfunction onPlate(i, j){ const e = each(S.plates), per = e === 4 ? 2 : Math.min(3, e), [cx] = plateXY(i), row = Math.floor(j / per), col = j % per, n = Math.min(per, e - row * per); return [cx + (col - (n - 1) / 2) * 30, PY - 11 - row * 21]; }\nconst dealDone = () => S.dealt >= each(S.plates);\nfunction draw2q(){ return sign(400, 236, 330, 84, TC(400, 288, `一袋糖，${MODEL.bag} 颗`, \"sign\"), 801) + P(Sk.line(330, 236, 352, 192, 805, .4) + Sk.line(470, 236, 448, 192, 806, .4), \"k1\"); }\nfunction draw2(){\n  const n = S.plates, act = S.mode === \"act2\", e = S.flyT < 1 ? S.flyT * S.flyT * (3 - 2 * S.flyT) : 1, flying = S.flyT < 1 ? 1 : 0;\n  const left = MODEL.bag - S.dealt * n;   // 已经离开袋子的糖（含正在飞的那一轮）\n  let s = oneMark(116, 98, 568, PY + 54 - 98, 800) + T(158, 86, `一袋糖 · ${MODEL.bag} 颗`, \"lbg\");\n  // 糖袋（主角）：网兜一样的袋子，看得见里面的糖\n  const { x, top, bot, wt, wb } = BAG;\n  s += `<g class=\"bag\"><path d=\"M${x - wt / 2} ${top}L${x + wt / 2} ${top}L${x + wb / 2} ${bot}Q${x} ${bot + 8} ${x - wb / 2} ${bot}Z\" fill=\"var(--accent-soft)\"/>` +\n    P(Sk.line(x - wt / 2, top, x - wb / 2, bot, 810, .5) + Sk.line(x + wt / 2, top, x + wb / 2, bot, 811, .5) + `M${x - wb / 2} ${bot}Q${x} ${bot + 8} ${x + wb / 2} ${bot}` + Sk.line(x - wt / 2 - 6, top, x + wt / 2 + 6, top, 812, .4), \"kacc\") +\n    P(Sk.curve([[x - wt / 2 + 4, top + 12], [x, top + 18], [x + wt / 2 - 4, top + 12]], 813, .4), \"k1\") + `<\/g>`;\n  for (let k = 0; k < left; k++){ const [cx, cy] = inBag(k); s += candy(cx, cy, k, 12); }\n  if (act && !dealDone()){ const [gx, gy] = bagGrip(); s += smallGrip(gx, gy, { on: S.press && S.pressOn === \"bag\", kbd: S.kbd, seed: 820 }); }\n  // 一排盘子：点亮的盘子垫一层淡色；每个盘子下面一个小计数\n  for (let i = 0; i < n; i++){\n    const [cx] = plateXY(i), on = S.litSet.has(i), k = Math.max(0, S.dealt - flying);\n    if (on) s += `<ellipse cx=\"${r1(cx)}\" cy=\"${PY - 14}\" rx=\"${r1(rxOf(n) + 12)}\" ry=\"${r1(Math.max(26, rxOf(n) * .62))}\" fill=\"var(--accent-soft)\"/>` + P(Sk.ellipse(cx, PY - 14, rxOf(n) + 12, Math.max(26, rxOf(n) * .62), 840 + i, .5), \"faint\");   // 点亮：盘子后面亮起一圈淡色\n    s += plate(cx, PY, rxOf(n), 830 + i, \"pane\");\n    for (let j = 0; j < k; j++){ const [px, py] = onPlate(i, j); s += candy(px, py, j * n + i, 9); }\n    if (flying){ const j = S.dealt - 1, [ax, ay] = inBag(left + i), [bx, by] = onPlate(i, j); s += candy(lerp(ax, bx, e), lerp(ay, by, e) - Math.sin(e * Math.PI) * 30, j * n + i, 9); }\n    s += TC(cx, PY + 36, `${Math.max(0, S.dealt - (flying && S.flyT < .9 ? 1 : 0))} 颗`, \"lbg\");\n    if (act && dealDone() && (n <= 4 || i === [...Array(n).keys()].find(q => !S.litSet.has(q)))){ const [gx, gy] = plateGrip(i); s += smallGrip(gx, gy, { kbd: S.kbd && i === S.kbdPlate, seed: 850 + i }); }\n  }\n  return s;\n}\nfunction readout2(){\n  const n = S.plates, e = each(n), k = S.litSet.size;\n  readout(S.dealt === 0 ? `${MODEL.bag} 颗 · 还没发 · ${n} 个盘子` : !dealDone() ? `发了 ${S.dealt} 轮 · 每盘 ${S.dealt} 颗 · 袋里还剩 ${MODEL.bag - S.dealt * n} 颗` :\n    k ? `${k} 盘是一袋的 ${F(k, n)} · ${k * e} 颗` : `${MODEL.bag} 颗平均分成 ${n} 份 · 每份 ${e} 颗 · 一袋的 ${F(1, n)} 是 ${e} 颗`);\n  sendState({ station: 2, plates: n, each: S.dealt, taken: k });\n}\nfunction hint2(){\n  hint(!dealDone() ? \"点一下带小圆钮的糖袋，发一轮\" : !S.lit3 ? `点盘子，点亮 ${MODEL.lightTarget} 盘` : !S.redealt ? \"按「少一盘」或「多一盘」，换了再发一遍\" : \"点糖袋、点盘子、换盘子数，接着试\");\n}\nfunction acts2(){\n  const list = [];\n  if (S.lit3) list.push({ label: \"少一盘\", go: () => changePlates(-1), cls: \"ghost tight\" }, { label: \"多一盘\", go: () => changePlates(1), cls: \"ghost tight\" });\n  if (S.lit3 && S.redealt) list.push({ label: \"看明白了\", go: done2 });\n  actions(list);\n}\nfunction deal(){\n  if (S.mode !== \"act2\" || dealDone()) return;\n  S.flyT = 1; S.dealt++; S.flyT = reduced ? 1 : 0; S.dirty = true; touched(); readout2();\n  if (dealDone()){\n    S.lastPlates = S.plates; const n = S.plates, e = each(n), again = S.changed && !S.redealt;\n    if (S.changed) S.redealt = true;\n    if (!S.lit3) say(`发完了，每盘 ${e} 颗。一盘就是这袋糖的 ${F(1, n)}。点一下盘子，把它点亮。`);\n    else say(`${MODEL.bag} 颗分成 ${n} 盘，每盘 ${e} 颗，一盘是这袋糖的 ${F(1, n)}。` + (again ? \"看够了点「看明白了」。\" : \"\"));\n    if (again) acts2();\n  } else say(`发了 ${S.dealt} 轮，每盘 ${S.dealt} 颗。接着点。`);\n  hint2();\n}\nfunction lightPlate(i, v){\n  if (S.mode !== \"act2\" || !dealDone() || i < 0 || i >= S.plates) return;\n  if (v == null) v = !S.litSet.has(i); if (v === S.litSet.has(i)) return;\n  if (v) S.litSet.add(i); else S.litSet.delete(i);\n  S.lit = S.litSet.size; S.dirty = true; touched(); readout2();\n  const k = S.lit, n = S.plates, e = each(n);\n  if (k === MODEL.lightTarget && !S.lit3 && n === MODEL.platesStart){ S.lit3 = true; say(`${k} 盘是这袋糖的 ${F(k, n)}，${k * e} 颗。想换个盘子数，就按「少一盘」或「多一盘」。`); acts2(); }\n  else if (k) say(`${k} 盘是这袋糖的 ${F(k, n)}，${k * e} 颗。`);\n  else say(\"一盘也没点亮。\");\n  hint2();\n}\nfunction changePlates(step){\n  if (S.mode !== \"act2\" || !S.lit3) return;\n  const i = clamp(MODEL.plateCounts.indexOf(S.plates) + step, 0, MODEL.plateCounts.length - 1), n = MODEL.plateCounts[i];\n  if (n === S.plates) return;\n  Object.assign(S, { plates: n, dealt: 0, lit: 0, flyT: 1, changed: true }); S.litSet.clear(); S.dirty = true; touched(); readout2();\n  say(`换成 ${n} 个盘子了，糖都回到了袋里。再点糖袋发一遍。`); hint2();\n}\nfunction enter2(){\n  gen++; S.station = 2; S.mode = \"intro2\"; head(2, \"发：一袋糖分盘子\"); hint(\"\"); readout(\"\"); disarmCue(); reset2(); scene(\"s2q\");\n  say(`这里有一袋糖，${MODEL.bag} 颗。`);\n  next(\"然后呢\", () => { S.mode = \"ask2\"; ask(`这袋糖的 ${F(1, 4)} 是几颗？`, [\n    { label: \"3 颗\", correct: true, feedback: \"你猜 3 颗。把糖发到盘子里，数一数。\" },\n    { label: \"1 颗\", mis: \"numerator-as-count\", feedback: `${F(1, 4)} 上面写着 1，想到 1 颗很自然。可这袋糖有 ${MODEL.bag} 颗呢。` },\n    { label: \"4 颗\", mis: \"denominator-as-count\", feedback: \"下面写着 4，想到 4 颗也有道理。可 4 说的是分成几份，一份有几颗还没数过。\" }\n  ], () => next(\"发糖\", act2)); });\n}\nfunction reset2(){ Object.assign(S, { plates: MODEL.platesStart, dealt: 0, lit: 0, flyT: 1, lit3: false, changed: false, redealt: false, kbdPlate: 0 }); S.litSet = new Set(); }\nfunction act2(){\n  S.mode = \"act2\"; scene(\"s2\"); acts2(); readout2(); hint2();\n  say(\"这 4 个盘子，一盘一份。点一下带小圆钮的糖袋，每个盘子落进一颗。\"); svg.focus({ preventScroll: true }); armCue(() => [...bagGrip(), smallR()]);\n}\nREPLAY[2] = () => { head(2, \"发：一袋糖分盘子\"); reset2(); act2(); };   // 重玩第 2 站：糖回袋、4 个盘子、清掉点亮，跳过开场和猜测题\nfunction done2(){\n  S.mode = \"rev2\"; hint(\"\"); disarmCue(); observedOnce(2); S.dirty = true; const g = S.guess && S.guess[2];\n  say(`一袋糖也能当一个整体。平均分成 4 份，一份 3 颗，就是这袋糖的 ${F(1, 4)}。` + (g && g.correct ? \"你猜对了。\" : \"一份有几颗，要看这袋糖有多少颗。\"), \"good\");\n  nextOr(\"去第 3 站\", enter3);\n}\n\n/* ============ 9. 第 3 站 · 找回来：知道一份，就能找回整体 ============ */\nconst SW = 98, SH = 80, SY = 196;\nconst cols = den => den <= 5 ? den : 5, rows = den => den <= 5 ? 1 : 2;\nconst slotXY = (i, den) => { const c = cols(den); return [400 + (i % c - (c - 1) / 2) * SW, SY + Math.floor(i / c) * SH + SH / 2]; };\nconst bagBox = den => { const w = cols(den) * SW + 36, h = rows(den) * SH + 30; return { x: 400 - w / 2, y: SY - 18, w, h }; };\nconst CHIPY = 474;\nconst chipR = () => narrow() ? 40 : 31;\nconst chipXY = d => [400 + (MODEL.dens.indexOf(d) - 2) * (narrow() ? 106 : 86), CHIPY];   // 接缝：走查用它点小圆片\nconst DICE = [[-26, -9], [0, -9], [26, -9], [-13, 10], [13, 10]];\nfunction five(cx, cy, seed, r){ let s = \"\"; DICE.forEach(([dx, dy], j) => { s += candy(cx + dx * (r || 10) / 10, cy + dy * (r || 10) / 10, seed + j, (r || 10) * .8); }); return s; }\nfunction draw3q(){\n  return sign(400, 196, 330, 62, rich(400, 236, [\"这是一袋糖的\", [1, 3]], \"lb\", 900), 901) +\n    plate(400, 352, 92, 902) + five(400, 330, 0, 12);\n}\nfunction bagShape(b, cls, seed){   // 袋子的轮廓：方方的袋身，上面收口、扎一道\n  const nk = b.w * .3, top = b.y - 34;\n  return P(Sk.line(b.x, b.y, b.x, b.y + b.h, seed, .5) + Sk.line(b.x, b.y + b.h, b.x + b.w, b.y + b.h, seed + 1, .5) + Sk.line(b.x + b.w, b.y + b.h, b.x + b.w, b.y, seed + 2, .5) +\n    `M${r1(b.x)} ${b.y}Q${r1(400 - nk)} ${b.y - 4} ${r1(400 - nk / 2)} ${top}M${r1(b.x + b.w)} ${b.y}Q${r1(400 + nk)} ${b.y - 4} ${r1(400 + nk / 2)} ${top}` + Sk.line(400 - nk / 2 - 8, top, 400 + nk / 2 + 8, top, seed + 3, .4), cls);\n}\nfunction draw3(){\n  const den = S.den, b = bagBox(den), act = S.mode === \"act3\", e = S.dropT < 1 ? 1 - Math.pow(1 - S.dropT, 3) : 1;\n  let s = sign(400, 76, 330, 54, rich(400, 110, [\"这 5 颗是一袋的\", [1, den]], \"lb\", 910), 911);\n  // 「1」记号就套在空袋子的虚线轮廓上：袋子随分母变大变小\n  s += `<g class=\"bag\">` + bagShape(b, \"one\", 920) + `<g transform=\"rotate(-5 ${r1(b.x + 18)} ${b.y - 4})\"><rect x=\"${r1(b.x + 4)}\" y=\"${b.y - 19}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(b.x + 4, b.y - 19, 28, 30, 929, .4), \"k1\") + TC(r1(b.x + 18), b.y + 3, \"1\", \"fm\") + `<\/g><\/g>`;\n  for (let i = 0; i < den; i++){\n    const [sx, sy] = slotXY(i, den), full = i < S.copies, drop = i === S.copies - 1 && S.dropT < 1 ? (1 - e) * 46 : 0;\n    if (!full){ s += P(Sk.ellipse(sx, sy + 22, 41, 10, 930 + i, .4), \"kf\"); continue; }\n    s += plate(sx, sy + 22, 43, 940 + i, i === 0 ? \"lead\" : \"pane\") + `<g${drop ? ` opacity=\"${r1(e * .9 + .1)}\"` : \"\"}>` + five(sx, sy - 2 - drop, i * 5, 10) + `<\/g>`;\n    if (i === 0) s += P(Sk.ellipse(sx, sy + 4, 49, 36, 950, .5), \"kacc\");   // 主角：已知的那一份\n  }\n  s += TC(400, b.y + b.h + 36, `${S.copies} 份 · ${MODEL.part * S.copies} 颗`, \"lb\");\n  if (S.chips){   // 分母的托：一组里挑一个\n    const [ax, ay] = chipXY(MODEL.dens[0]), ar = chipR(), [bx] = chipXY(MODEL.dens[MODEL.dens.length - 1]);\n    s += `<rect x=\"${r1(ax - ar - 12)}\" y=\"${r1(ay - ar - 12)}\" width=\"${r1(bx - ax + 2 * ar + 24)}\" height=\"${r1(2 * ar + 24)}\" rx=\"${r1(ar + 12)}\" class=\"gsoft\"/>`;\n    MODEL.dens.forEach((d, i) => { const [cx, cy] = chipXY(d), r = chipR(), on = d === den && act;\n      s += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${r}\" class=\"${on ? \"gfill\" : \"pane\"}\"/>` + P(Sk.ellipse(cx, cy, r, r, 960 + i, .4), on ? \"gring\" : \"k1\") + `<g${on ? ' style=\"--ink:var(--bg)\"' : \"\"}>` + fracS(cx, cy + 1, 1, d, \"fs\", 970 + i) + `<\/g>` +\n        (S.kbd && on ? `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${r + 6}\" class=\"gkbd\"/>` : \"\"); });\n  }\n  return s;\n}\nfun
