-stroke}\n.scene-name{fill:var(--muted);font:18px var(--f-sans);letter-spacing:.12em}\nbody.narrow .scene-name{font-size:21px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\"><\/span><h1 id=\"title\"><\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 800 610\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <g id=\"static\"><\/g>\n      <g id=\"dyn\"><\/g>\n      <g id=\"fx\"><circle id=\"cue\" cx=\"0\" cy=\"0\" r=\"10\" style=\"display:none\"/><\/g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n      <rect id=\"touch\" x=\"-400\" y=\"-400\" width=\"1600\" height=\"1410\" fill=\"transparent\"/><!-- 永不重画的触摸层（教训 25） -->\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* Curio · 动手探索模块骨架。复制本文件，把 {{…}} 换成具体内容，换掉两个示例站。\n   2026-11-14 起以切分机 act.simulation.fair-cut-01 为准（Luka 验收通过后抽出来的）：带 kit: 记号的段落照抄不改，\n   要改就先改这里，再同步到用它的模块。先读 lessons.md 和 docs/constellations/zero-to-one/notes-star1.md。 */\n/* ============ 1. 真相模型：页面上的每个数字都从这里算，每个值旁边写出处。只放数和纯函数，不碰页面 ============ */\nconst MODEL = {\n  radix: 10,                 // 人教版四下「小数的意义和性质」：十进制计数\n  objects: [                 // 本站示意物的设定值，以分米为单位\n    { name: \"身高\", dm: 13 }, { name: \"门\", dm: 19 }, { name: \"桌子\", dm: 7 }\n  ],\n  top: 22,                   // 横杆从 2.2 米开始，让孩子从上往下量\n  zoomDepth: 3,              // 本站用十分位、百分位和千分位\n  lensDepth: 6,              // 十的六次方：1 米 = 100 万微米\n  hairMicrons: 70,           // 沿用 act.simulation.cell-zoom-01 的约 0.07 毫米\n  units: [\"米\", \"分米\", \"厘米\"],\n  places: [\"个位\", \"十分位\", \"百分位\"],\n  goals: [[1, 3, 0], [1, 0, 3]]\n};\nconst B = MODEL.radix;\nconst power = depth => B ** depth;\nconst cm = counts => counts.reduce((sum, digit, i) => sum + digit * power(2 - i), 0);\nconst lengthValue = counts => String(cm(counts) / power(2));\nconst tenths = MODEL.objects[0].dm % B;\nconst held = { label: \"放大\", cls: \"hold\", hold: true };\nconst seen = [[], null, null];\n\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.body.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 共用零件：分数、「1」记号、圆钮、数线条  kit:parts ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 100 ? \"百\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;                // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 3;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1q\", hold: false, press: false, kbd: false, dirty: true };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.innerHTML = (a.hold ? RIDGES : \"\") + `<span>${a.label}<\/span>`;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); if (v) touched(); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(ev, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(true); } });\n      b.addEventListener(\"keyup\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(false); } });\n      b.addEventListener(\"blur\", () => on(false));\n      b.addEventListener(\"contextmenu\", e => e.preventDefault());\n    } else {\n      b.addEventListener(\"click\", e => { if (performance.now() - born < 400 || (keyGuard && e.detail === 0)) return; a.go(e); });\n      if (guard){\n        b.disabled = true;\n        const release = () => {\n          removeEventListener(\"pointerup\", release, true);\n          removeEventListener(\"pointercancel\", release, true);\n          setTimeout(() => { b.disabled = false; }, 120);\n        };\n        addEventListener(\"pointerup\", release, true);\n        addEventListener(\"pointercancel\", release, true);\n      }\n    }\n    boxEl.append(b);\n  }\n  const first = boxEl.querySelector(\"button\");\n  if (first && !/^act/.test(S.mode)) first.focus({ preventScroll: true });\n  return boxEl;\n}\n// 猜测：只记下来，不在这里判对错的颜色。猜错的反馈先接住、再说清，然后一律去动手，让实物来回答\nfunction ask(question, options, onAnswer){\n  say(question);\n  actions(options.map((o, i) => ({ label: o.label, cls: \"choice\", go: () => {\n    if (!sentPred.has(S.station)){ sentPred.add(S.station); Host.event(\"predicted\", { station: S.station, choice: i, correct: !!o.correct, misconception: o.mis || null }); }\n    S.guess = S.guess || {}; S.guess[S.station] = o;\n    say(o.feedback, o.correct ? \"good\" : \"hmm\");\n    onAnswer(o);\n  }})));\n}\nfunction next(label, go, cls){ actions([{ label, go, cls }]); }\n// 星卡上选站重玩（#154）：replay 是正在重玩的站号，0 是从头往下走。重玩一站跳过开场和猜测题，直接进这一站的动手；\n// 揭晓完，原来「去第 k+1 站」「看我的星卡」的按钮换成「回星卡」（用 nextOr）。不出猜测题就不发 predicted；\n// observed 靠 observedOnce、complete 靠 completed，都只记第一次。每站怎么复位、怎么进动手是模块自己的事，写在 REPLAY[站号] 里\nlet replay = 0;\nconst REPLAY = {};\nfunction nextOr(label, go, cls){ if (replay) next(\"回星卡\", enterEnd); else next(label, go, cls); }\nfunction replayAt(k){ replay = k; gen++; S.station = k; hint(\"\"); readout(\"\"); disarmCue(); REPLAY[k](); }\nfunction restart(){ replay = 0; sentPred.clear(); sentObs.clear(); S.guess = {}; lastState = \"\"; enter1(); }   // 从头玩：和以前的「再玩一次」一样\nfunction endActions(){   // 星卡的按钮：从头玩 + 第 1 站…第 N 站。enterEnd() 最后调它\n  replay = 0;\n  actions([{ label: \"从头玩\", go: restart, cls: \"ghost tight\" }].concat(Array.from({ length: STATIONS }, (_, i) => ({ label: `第 ${i + 1} 站`, go: () => replayAt(i + 1), cls: \"tight\" }))));   // tight：手机上一行排得下\n}\n\n(function(){   // 「我有个问题」：随时可以问，发到信号站\n  const area = $(\"qarea\");\n  const open = document.createElement(\"button\");\n  open.type = \"button\"; open.className = \"btn ghost small\"; open.textContent = \"我有个问题\";\n  open.style.marginTop = \"12px\";\n  open.addEventListener(\"click\", () => {\n    if (area.querySelector(\"textarea\")) return;\n    const ta = document.createElement(\"textarea\"); ta.maxLength = 120; ta.placeholder = \"想问领航员什么？\";\n    const send = document.createElement(\"button\"); send.type = \"button\"; send.className = \"btn small\"; send.textContent = \"发给领航员\";\n    const bx = document.createElement(\"div\"); bx.className = \"qbox\"; bx.append(ta, send);\n    send.addEventListener(\"click\", () => { const q = ta.value.trim(); if (!q) return; Host.noteQuestion(q); bx.remove(); say(\"好问题，我记下来了。等会儿一起找答案。\"); });\n    area.append(bx); ta.focus();\n  });\n  area.append(open);\n})();\n\n// 第一屏的提醒（G6）：进入动手 1.5 秒还没碰，第一个圆钮外面扩出一圈细环；一碰就再也不出现\nlet cuePos = null, cueTimer = 0;\nfunction armCue(pos){ disarmCue(); const g = gen; cueTimer = setTimeout(() => { if (g === gen && /^act/.test(S.mode)){ cuePos = pos; S.dirty = true; } }, 1500); }\nfunction disarmCue(){ clearTimeout(cueTimer); cuePos = null; cueEl.style.display = \"none\"; }\nfunction touched(){ if (cuePos || cueTimer) disarmCue(); cueTimer = 0; }\nfunction placeCue(){ if (!cuePos) return; const [x, y, r] = cuePos(); cueEl.setAttribute(\"cx\", r1(x)); cueEl.setAttribute(\"cy\", r1(y)); cueEl.setAttribute(\"r\", r1((r || gripR()) + 2)); cueEl.style.display = \"\"; }   // 第三个数是被提醒的东西的半径（托里的一个）\n\n// 窄屏：viewBox 缩到中间 600 宽的操作区，字号类放大（教训 13、28）。每个场景写明自己用到的高度\n// 排版规矩：要紧的东西都画在 x = 110～690 之间；每个场景在这里写 [起始 y, 高度]\nconst VIEW = { s1q: [72, 330], s2q: [72, 330], s3q: [72, 330], s1: [0, 518],\n  s2: [16, 428], s3: [0, 563], wow: [8, 440], end: [0, 638] };\nfunction fitView(){\n  const nar = (svg.clientWidth || 800) < 600, [y, h] = VIEW[S.scene] || [0, 610];\n  document.body.classList.toggle(\"narrow\", nar);\n  const v = (nar ? [100, y, 600, h] : [0, y, 800, h]).join(\" \");\n  if (svg.getAttribute(\"viewBox\") !== v){ svg.setAttribute(\"viewBox\", v); S.dirty = true; }\n}\naddEventListener(\"resize\", fitView);\nfunction scene(name){ S.scene = name; fitView(); S.dirty = true; }\n\nconst rect = (x, y, w, h, cls, r = 0, extra = \"\") => `<rect x=\"${r1(x)}\" y=\"${r1(y)}\" width=\"${r1(w)}\" height=\"${r1(h)}\" rx=\"${r}\" class=\"${cls}\" ${extra}/>`;\nconst line = (x1, y1, x2, y2, seed, cls) => P(Sk.line(x1, y1, x2, y2, seed, .45), cls);\nconst point = (x, y, r, cls) => `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r}\" class=\"${cls}\"/>`;\nconst act = n => S.mode === \"act\" + n;\nconst guessEcho = n => {\n  const guess = S.guess?.[n];\n  return guess ? (guess.correct ? \"你刚才就猜到了。\" : \"看实物，刚才的猜法可以换一换。\") : \"\";\n};\nfunction startQuestion(n, mode, title, intro, question, options, go){\n  gen++; S.station = n; S.mode = \"talk\"; head(n, title); hint(\"\"); readout(\"\"); disarmCue(); scene(mode);\n  say(intro); next(\"然后呢\", () => ask(question, options, () => next(\"动手试\", go)));\n}\nfunction startAct(n, title, mode, message, cue){\n  S.mode = \"act\" + n; head(n, title); scene(mode);\n  const shortcuts = [\"ArrowUp ArrowDown\", \"ArrowLeft ArrowRight Space Enter\", \"ArrowLeft ArrowRight Enter Backspace\"];\n  svg.setAttribute(\"aria-keyshortcuts\", shortcuts[n - 1]);\n  say(message); svg.focus({ preventScroll: true }); armCue(cue);\n}\nfunction finishAct(n){\n  S.mode = \"talk\"; S.hold = false; hint(\"\"); disarmCue(); observedOnce(n);\n}\nfunction plaque(x, w, title, main, subtitle = \"\"){\n  return rect(x, 126, w, 224, \"wall\", 12) + P(box(x, 126, w, 224, x, .7), \"k1\") +\n    point(x + 16, 143, 3, \"pane\") + TC(x + w / 2, 192, title, \"scene-name\") +\n    TC(x + w / 2, 265, main, \"big\") + TC(x + w / 2, 312, subtitle, \"lb\");\n}\n\n/* 第 1 站：固定的墙尺；压杆每分米吸一次。 */\nconst HEIGHT = { bottom: 464, dm: 17.4, ruler: 268, barStart: 305, barEnd: 610 };\nconst hy = dm => HEIGHT.bottom - HEIGHT.dm * dm;\nconst knob1 = () => [HEIGHT.barEnd, hy(S.height)];\nconst measure = () => MODEL.objects[S.object];\nconst marks = (bottom, x, seed) => Array.from({ length: B - 1 }, (_, i) =>\n  line(x, hy(bottom + i + 1), x + (i === B / 2 - 1 ? 23 : 16), hy(bottom + i + 1), seed + i, \"k1\")).join(\"\");\nconst draw1q = () => plaque(205, 390, \"身高\", measureText(MODEL.objects[0]), \"读作一点三米\");\nconst measureText = o => `${o.dm / B} 米`;\nfunction wall(){\n  const { bottom, ruler } = HEIGHT;\n  return rect(199, 65, 378, bottom - 65, \"wall\", 5) + rect(ruler - 3, 72, 42, bottom - 72, \"pane\", 4) +\n    line(ruler, hy(MODEL.top), ruler, bottom, 21) + line(ruler, bottom, 615, bottom, 22) +\n    [0, B, power(1) * 2].map(dm => line(ruler, hy(dm), ruler + 36, hy(dm), dm + 25) +\n      T(ruler - 12, hy(dm) + 6, `${dm / B} 米`, \"lbm\", 'text-anchor=\"end\"')).join(\"\");\n}\nfunction wallObject(which){\n  const o = MODEL.objects[which], y = hy(o.dm), b = HEIGHT.bottom, x = 468;\n  if (which === 0){\n    const body = `M${x - 29} 0q-18 17 -23 63l20 4 10-29 -2 39 -7 48h22l15-40 15 40h22l-7-49 -2-39 10 29 20-4q-8-48-31-63z`;\n "q4", "stem": "把 1 平均分成 10 份。每份再平均分成 10 小份，一共有多少小份？"}, {"answer": {"common_wrong": [{"feedback": "你把两个数加起来了。把这个点放回数线，它落在 0.3 和 0.4 之间吗？", "value": 0.7}, {"feedback": "你找到了 3 和 4 的中点。再找找，0.3 和 0.4 在 0 到 1 的哪一段？", "value": 3.5}], "tolerance": 0, "type": "number", "value": 0.35}, "feedback": {"correct": "把这一大格分成 10 小格。从 0.3 走 5 小格到 0.35，两边一样远。", "wrong": "把两个点画在数线上。找一个点，看看它离两边是不是一样远。"}, "hints": ["想想你钉小数的那一站。把 0.3 到 0.4 这一格放大，会看见什么？", "把这一大格平均分成 10 小格。从 0.3 走一半，想想该停在哪条刻度。"], "id": "q5", "stem": "数线上有 0.3 和 0.4 两个点。它们正中间是哪个数？"}], "shuffle": false}, "duration_min": 5, "id": "act.quiz.tenths-01", "kind": "quiz", "targets": ["math.decimal.tenths"], "title": "数线放大镜大挑战"}], "dq": "身高 1 米 3，那个「点 3」到底是 3 个什么？", "id": "math.decimal.tenths", "misconceptions": {"glue-digits": "不看小数点，把数字连起来读，例如把 1.3 米当成 13 厘米，把 0.5 当成 5。", "ignore-place": "不看数字站在哪一格，认为 1.03 和 1.3 一样，都是「1 和 3」。", "still-tenths": "觉得再放大一次，每一格还是 1/10，没有变小。", "tail-as-small-unit": "把小数点后面的数当成最小单位的个数，例如认为 1.3 米是 1 米 3 厘米。", "ten-plus-ten": "两次十等分算成加法，认为分了 10 份再分 10 份，一共是 20 份。"}, "title": "小数是什么"}]}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const KIND = {simulation:"动手探索", explain:"讲解", quiz:"挑战", reflection:"反思"};
const hasSim = st => st.activities.some(a => a.kind === "simulation");
const kindLabel = (a, st) => a.kind === "explain" && hasSim(st) ? "旧版讲解" : KIND[a.kind];
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $app = document.getElementById("app"), $dock = document.getElementById("dock"), $dockIn = document.getElementById("dockIn");

// 这一页里的试玩记录，只放在内存里，刷新就没了
const S = {done:{}, log:{}};

const ACTS = [];   // 按顺序排好的全部活动
for (const st of DATA.stars) for (const a of st.activities) ACTS.push({...a, star:st});
const actById = id => ACTS.find(a => a.id === id);

function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
function svgEl(markup){
  const t = document.createElement("template"); t.innerHTML = markup.trim(); return t.content.firstElementChild;
}

const AVA = `<svg class="ava" viewBox="0 0 48 48" aria-hidden="true">
  <circle cx="24" cy="27" r="16" fill="var(--c-sky)"/>
  <path class="k" d="M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z"/>
  <path class="k1" d="M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5"/>
  <circle cx="18.5" cy="25" r="2.2" fill="var(--ink)"/><circle cx="29.5" cy="25" r="2.2" fill="var(--ink)"/>
  <path class="k1" d="M18 32 C21 35 27 35 30 32"/></svg>`;
const SHIP = `<svg viewBox="0 0 100 100" aria-hidden="true">
  <path d="M50 10 C64 24 68 44 64 66 L36 66 C32 44 36 24 50 10 Z" fill="var(--c-sky)"/>
  <path class="k" d="M50 10 C64 24 68 44 64 66 L36 66 C32 44 36 24 50 10 Z"/>
  <path class="k1" d="M44 40 C44 35 56 35 56 40 C56 45 44 45 44 40 Z"/>
  <path class="k" d="M36 52 L24 72 L37 66 M64 52 L76 72 L63 66"/>
  <path d="M43 70 C45 80 47 86 50 92 C53 86 55 80 57 70 Z" fill="var(--c-math)"/>
  <path class="k1" d="M43 70 C45 80 47 86 50 92 C53 86 55 80 57 70"/></svg>`;

function scrollEnd(node){ node.scrollIntoView({block:"end", behavior: reduced ? "auto" : "smooth"}); }

/* 手绘线稿和挑战配图：从正式外壳 app/app.js 原样搬来（sketchLib、wedge、figureSvg），
   孩子在试玩页和正式外壳看到同一张图。改的时候两边一起改 */
function sketchLib() {
  const R = (seed) => { let s = ((seed | 0) * 2654435761) >>> 0 || 7; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; };
  const f = (n) => Math.round(n * 10) / 10;
  function cr(p, closed) {
    const n = p.length; let d = `M${f(p[0][0])} ${f(p[0][1])}`;
    for (let i = 0; i < (closed ? n : n - 1); i++) {
      const p1 = p[i], p2 = p[(i + 1) % n]; const p0 = (!closed && i === 0) ? p1 : p[(i - 1 + n) % n]; const p3 = (!closed && i + 2 >= n) ? p2 : p[(i + 2) % n];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d;
  }
  function line(x1, y1, x2, y2, seed, j) {
    const r = R(seed); j = j == null ? 1 : j; const L = Math.hypot(x2 - x1, y2 - y1) || 1; const a = Math.min(1.8, .5 + L * .008) * j; const o = () => (r() - .5) * 2 * a;
    const nx = -(y2 - y1) / L, ny = (x2 - x1) / L, bow = (r() - .5) * Math.min(L * .035, 6) * j;
    return `M${f(x1 + o())} ${f(y1 + o())}Q${f((x1 + x2) / 2 + nx * bow)} ${f((y1 + y2) / 2 + ny * bow)} ${f(x2 + o())} ${f(y2 + o())}`;
  }
  function ellipse(cx, cy, rx, ry, seed, j) {
    const r = R(seed); j = j == null ? 1 : j; const N = 12, a0 = r() * Math.PI * 2, turn = 1.05 + r() * .06, p = [];
    for (let i = 0; i <= N; i++) { const t = a0 + i / N * Math.PI * 2 * turn, k = 1 + (r() - .5) * .07 * j; p.push([cx + Math.cos(t) * rx * k, cy + Math.sin(t) * ry * k]); }
    return cr(p, false);
  }
  function rect(x, y, w, h, seed, j) { return line(x, y, x + w, y, seed, j) + line(x + w, y, x + w, y + h, seed + 1, j) + line(x + w, y + h, x, y + h, seed + 2, j) + line(x, y + h, x, y, seed + 3, j); }
  function area(pts) { return "M" + pts.map((q) => f(q[0]) + " " + f(q[1])).join("L") + "Z"; }
  return { line, ellipse, rect, area, R };
}
const Sk = sketchLib();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const wedge = (cx, cy, r, a0, a1) => {
  const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
  return `M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z`;
};
const FIG_TYPES = ["pie", "rect", "rect-unequal", "number-line"];
/** 题目配图（内容规格 3.6），只画 FIG_TYPES 里的四种。 */
function figureSvg(fig, seed = 7) {
  let inner = "", vb = "0 0 200 120", label = "配图";
  if (fig.type === "pie") {
    const n = fig.parts, k = fig.shaded, cx = 100, cy = 60, r = 48;
    for (let i = 0; i < k; i++) inner += `<path class="fig-shade" d="${wedge(cx, cy, r, -Math.PI / 2 + i / n * 2 * Math.PI, -Math.PI / 2 + (i + 1) / n * 2 * Math.PI)}"/>`;
    inner += `<path class="k" d="${Sk.ellipse(cx, cy, r, r, seed, .5)}"/>`;
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i / n * 2 * Math.PI; inner += `<path class="k1" d="${Sk.line(cx, cy, cx + Math.cos(a) * r, cy + Math.sin(a) * r, seed + 3 + i, .4)}"/>`; }
    label = `一个圆，分成 ${n} 份，涂色 ${k} 份`; // 只描述形状：「平均」「不一样大」可能就是题目要问的
  } else if (fig.type === "rect" || fig.type === "rect-unequal") {
    const widths = fig.type === "rect" ? Array(fig.parts).fill(1) : fig.widths;
    const shaded = fig.type === "rect" ? [...Array(fig.shaded).keys()] : fig.shaded;
    const vertical = fig.type === "rect" && fig.direction === "v";
    const X = 20, Y = 20, W = 160, H = 80, sum = widths.reduce((a, b) => a + b, 0);
    let at = 0;
    widths.forEach((w, i) => {
      const a = at / sum, b = (at + w) / sum; at += w;
      const box = vertical ? [X, Y + a * H, W, (b - a) * H] : [X + a * W, Y, (b - a) * W, H];
      if (shaded.includes(i)) inner += `<path class="fig-shade" d="${Sk.area([[box[0], box[1]], [box[0] + box[2], box[1]], [box[0] + box[2], box[1] + box[3]], [box[0], box[1] + box[3]]])}"/>`;
      if (i > 0) inner += `<path class="k1" d="${vertical ? Sk.line(X, box[1], X + W, box[1], seed + 10 + i, .4) : Sk.line(box[0], Y, box[0], Y + H, seed + 10 + i, .4)}"/>`;
    });
    inner += `<path class="k" d="${Sk.rect(X, Y, W, H, seed, .5)}"/>`;
    label = `一个长方形，分成 ${widths.length} 份，涂色 ${shaded.length} 份`;
  } else if (fig.type === "number-line") {
    const from = Number(fig.from), to = Number(fig.to), stp = Number(fig.step) || 1;
    const x = (v) => 20 + (v - from) / ((to - from) || 1) * 160;
    vb = "0 0 200 70";
    inner += `<path class="k" d="${Sk.line(14, 34, 196, 34, seed, .4)}"/><path class="k1" d="${Sk.line(196, 34, 190, 30, seed + 1, .3) + Sk.line(196, 34, 190, 38, seed + 2, .3)}"/>`;   // 箭头在最后一个刻度（x=180）右边，不挨着
    const n = Math.min(60, Math.round((to - from) / stp));
    for (let i = 0; i <= n; i++) inner += `<path class="k1" d="${Sk.line(x(from + i * stp), 29, x(from + i * stp), 39, seed + 5 + i, .3)}"/>`;
    for (const m of fig.marks || []) inner += `<text x="${x(Number(m.at)).toFixed(1)}" y="58" text-anchor="middle" class="fig-txt">${esc(m.label ?? m.at)}</text>`;
    label = "一条数轴";
  }
  return `<svg class="fig" viewBox="${vb}" role="img" aria-label="${esc(label)}">${inner}</svg>`;
}

function figureNode(fig){
  const box = el("div", {class:"fig-box"});
  if (fig && FIG_TYPES.includes(fig.type)){
    box.classList.add("q-fig");
    box.append(svgEl(figureSvg(fig, 9)));   // 正式外壳挑战题用种子 9（app.js 里 figureSvg(item.figure, 9)）
  } else if (fig && fig.type === "svg" && DATA.figures[fig.src]){
    const s = svgEl(DATA.figures[fig.src]);
    s.removeAttribute("width"); s.removeAttribute("height");
    if (!reduced){
      s.querySelectorAll(".k,.k1").forEach(p => { if (!p.hasAttribute("stroke-dasharray")) p.setAttribute("pathLength","1"); else p.classList.remove("k","k1"); });
      s.classList.add("draw");
    }
    box.append(s);
  } else box.append(el("p", {class:"cap"}, "（这张图还没准备好）"));
  return box;
}

// ---------- 判分 ----------
function normNum(s){
  return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[．。]/g, ".").replace(/[－—]/g, "-").replace(/[，,\s]/g, "").replace(/[条对个本卷米厘次]+$/, "");
}
function parseNumber(s){
  const t = normNum(s); if (!/^-?\d+(\.\d+)?$/.test(t)) return null; return Number(t);
}
function parseFraction(s){
  const t = String(s).trim().replace(/／/g, "/").replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  let m = t.match(/^(\d+)\s*\/\s*(\d+)$/); if (m) return [Number(m[1]), Number(m[2])];
  m = t.match(/^(\d+)\s*分之\s*(\d+)$/); if (m) return [Number(m[2]), Number(m[1])];
  return null;
}
function grade(answer, input){
  // 返回 {ok, misconception, feedback} 或 null（写法认不出来，不算一次作答）
  if (answer.type === "choice"){
    const c = answer.choices.find(x => x.id === input);
    return {ok: !!c.correct, misconception: c.misconception || null, feedback: c.feedback || "", shown: c.text};
  }
  if (answer.type === "number"){
    const x = parseNumber(input); if (x === null) return null;
    const tol = answer.tolerance || 0, hit = v => Math.abs(x - v) <= tol + 1e-9;
    if (hit(answer.value)) return {ok:true, feedback:"", shown:String(x)};
    const w = (answer.common_wrong||[]).find(cw => hit(cw.value));
    return {ok:false, misconception: w && w.misconception || null, feedback: w && w.feedback || "", shown:String(x)};
  }
  if (answer.type === "fraction"){
    const f = parseFraction(input); if (!f) return null;
    const [a,b] = f; if (b === 0) return {ok:false, feedback:"", shown:`${a}/${b}`};
    const ok = answer.accept_equivalent ? a*answer.denominator === b*answer.numerator : (a === answer.numerator && b === answer.denominator);
    if (ok) return {ok:true, feedback:"", shown:`${a}/${b}`};
    const w = (answer.common_wrong||[]).find(cw => answer.accept_equivalent ? a*cw.denominator === b*cw.numerator : (a === cw.numerator && b === cw.denominator));
    return {ok:false, misconception: w && w.misconception || null, feedback: w && w.feedback || "", shown:`${a}/${b}`};
  }
  return null;
}
function answerText(answer){
  if (answer.type === "choice") return answer.choices.find(c => c.correct).text;
  if (answer.type === "number") return `${answer.value}${answer.unit ? " " + answer.unit : ""}`;
  if (answer.type === "fraction") return `${answer.numerator}/${answer.denominator}`;
  return "";
}

// ---------- 一道题（讲解里的小问题和挑战共用） ----------
// say(role, text)：role 是 nav / me / good / bad / hint
function askItem(host, item, say, onDone){
  const ans = item.answer, hints = item.hints || [];
  const rec = {stem:item.stem, tries:[], hints:0, result:null};
  let usedHints = 0, finished = false;
  const ctrl = el("div", {class:"ask"});
  let choiceBtns = [], numInput = null, okBtn = null;

  function finish(result){
    finished = true; rec.result = result;
    choiceBtns.forEach(b => b.disabled = true);
    if (numInput){ numInput.disabled = true; okBtn.disabled = true; }
    hintBtn.hidden = true;
    onDone(rec);
  }
  function submit(value, btn){
    if (finished) return;
    const g = grade(ans, value);
    if (!g){ say("nav", "写一个数字试试，比如 12。"); return; }
    rec.tries.push({shown:g.shown, ok:g.ok, misconception:g.misconception||null});
    if (ans.type !== "choice") say("me", g.shown + (ans.unit ? " " + ans.unit : ""));
    else say("me", g.shown);
    if (g.ok){
      if (btn) btn.classList.add("right");
      say("good", g.feedback ? "对了。" + g.feedback : (item.feedback?.correct || "对了。"));
      finish(rec.tries.length === 1 && usedHints === 0 ? "first" : "later");
    } else {
      if (btn){ btn.classList.add("wrong"); btn.disabled = true; }
      say("bad", g.feedback || item.feedback?.wrong || "这个想法很多人都有。再想想看，也可以要个提示。");
      if (numInput){ numInput.select(); }
    }
  }

  if (ans.type === "choice"){
    const box = el("div", {class:"choices"});
    for (const c of ans.choices){
      const b = el("button", {class:"choice", type:"button", onclick:()=>submit(c.id, b)}, c.text);
      choiceBtns.push(b); box.append(b);
    }
    ctrl.append(box);
  } else {
    numInput = el("input", {type:"text", inputmode: ans.type === "number" ? "decimal" : "text", "aria-label":"写答案", autocomplete:"off",
      placeholder: ans.type === "fraction" ? "比如 1/4" : "写数字",
      onkeydown: e => { if (e.key === "Enter") submit(numInput.value); }});
    okBtn = el("button", {class:"btn", type:"button", onclick:()=>submit(numInput.value)}, "确定");
    ctrl.append(el("div", {class:"numrow"}, numInput, ans.unit ? el("span", {class:"unit"}, ans.unit) : null, okBtn));
  }
  const hintBtn = el("button", {class:"btn ghost", type:"button", onclick: () => {
    if (finished) return;
    if (usedHints < hints.length){
      say("hint", hints[usedHints]); usedHints++; rec.hints = usedHints;
      if (usedHints >= hints.length) hintBtn.textContent = "看答案";
    } else {
      say("nav", "答案是：" + answerText(ans) + "。");
      choiceBtns.forEach((b, i) => { if (ans.choices[i].correct) b.classList.add("right"); });
      if (numInput) numInput.value = answerText(ans).split(" ")[0];
      finish("revealed");
    }
  }}, hints.length ? "要个提示" : "看答案");
  ctrl.append(el("div", {class:"row-btns"}, hintBtn));
  host.append(ctrl);
  return rec;
}

// ---------- 页面 ----------
function setTop(title, showBack){
  document.getElementById("title").textContent = title;
  document.getElementById("back").hidden = !showBack;
}
function dock(...btns){ $dockIn.replaceChildren(...btns.filter(Boolean)); $dock.hidden = btns.filter(Boolean).length === 0; }
function nextAfter(a){ const i = ACTS.indexOf(a); return ACTS[i+1] || null; }
function endButtons(a){
  const n = nextAfter(a);
  return el("div", {class:"row-btns"},
    n ? el("button", {class:"btn", type:"button", onclick:()=>go("act:" + n.id)}, `${n.star !== a.star ? "下一颗星：" : "接着做"}${kindLabel(n, n.star)}`) : null,
    el("button", {class:"btn ghost", type:"button", onclick:()=>go("home")}, "回星图"));
}

function viewHome(){
  setTop("Curio", false); dock();
  const hero = el("div", {class:"hero"},
    el("div", {}, el("div", {class:"eyebrow"}, "Curio · 星座"), el("h1", {}, DATA.constellation),
      el("p", {}, (["", "一", "两", "三", "四", "五", "六", "七", "八", "九", "十"][DATA.stars.length] || DATA.stars.length) + "颗星，按顺序飞：" + DATA.stars.map(s => s.title.split("：")[0]).join(" → ") + "。")),
    svgEl(SHIP));
  const line = el("div", {class:"line"});
  DATA.stars.forEach((st, i) => {
    const acts = el("div", {class:"acts"});
    for (const a of st.activities){
      const done = S.done[a.id];
      acts.append(el("button", {class:"act" + (done ? " done" : "") + (a.kind === "simulation" ? " sim" : ""), type:"button", onclick:()=>go("act:" + a.id)},
        done ? el("span", {class:"tick"}, "✓") : null, kindLabel(a, st), a.kind === "simulation" ? el("small", {class:"new"}, "新") : null, a.duration_min ? el("small", {}, `${a.duration_min} 分钟`) : null));
    }
    line.append(el("section", {class:"star"}, el("div", {class:"dot"}, i+1), el("h2", {}, st.title), el("div", {class:"dq"}, st.dq), acts));
  });
  $app.replaceChildren(hero, el("p", {class:"note"}, "这是试玩版：做过的不会保存，刷新页面就从头开始。"), line,
    el("button", {class:"parent", type:"button", onclick:()=>go("record")}, "试玩记录（给家长看）"));
}

function bubbleRow(role, content){
  const cls = {nav:"", hint:"hint", good:"good", bad:"bad"}[role];
  if (role === "me") return el("div", {class:"row me pop"}, el("div", {class:"bub"}, content));
  const bub = el("div", {class:"bub " + (cls||"")}, role === "hint" ? el("span", {class:"lbl"}, "提示") : null, content);
  return el("div", {class:"row pop"}, svgEl(AVA), bub);
}

function viewExplain(a){
  const log = S.log[a.id] = {kind:"explain", items:[], questions:[]};
  const chat = el("div", {class:"chat"});
  $app.replaceChildren(chat);
  const steps = a.body.steps; let i = 0;
  const say = (role, text) => { const r = bubbleRow(role, text); chat.append(r); scrollEnd(r); };
  const contBtn = el("button", {class:"btn", type:"button", onclick:()=>step()}, "继续");
  const qBtn = el("button", {class:"btn ghost", type:"button", onclick:()=>openAsk()}, "我有个问题");

  function openAsk(){
    if (chat.querySelector(".composer")) return;
    const ta = el("textarea", {maxlength:"120", placeholder:"想问领航员什么？"});
    const box = el("div", {class:"composer pop"}, ta, el("div", {class:"row-btns"},
      el("button", {class:"btn ghost", type:"button", onclick:()=>box.remove()}, "算了"),
      el("button", {class:"btn", type:"button", onclick:()=>{
        const q = ta.value.trim(); if (!q) return; box.remove();
        log.questions.push(q); say("me", q);
        say("nav", "好问题。我把它记在试玩记录里了，等会儿和家长一起找答案。");
      }}, "问领航员")));
    chat.append(box); scrollEnd(box); ta.focus();
  }
  function step(){
    if (i >= steps.length) return;
    const s = steps[i++];
    if (s.type === "text") say("nav", s.text);
    else if (s.type === "figure"){
      const r = el("div", {class:"row pop"}, svgEl(AVA), el("div", {class:"bub fig"}, figureNode(s.figure), s.caption ? el("div", {class:"cap"}, s.caption) : null));
      chat.append(r); scrollEnd(r);
    } else if (s.type === "check"){
      const bub = el("div", {class:"bub"}, el("div", {class:"stem"}, s.item.stem));
      const r = el("div", {class:"row pop"}, svgEl(AVA), bub); chat.append(r);
      dock(qBtn);
      const rec = askItem(bub, s.item, say, rec => { log.items.push(rec); afterStep(); });
      scrollEnd(r);
      return;
    }
    afterStep();
  }
  function afterStep(){
    if (i < steps.length){ dock(qBtn, contBtn); return; }
    S.done[a.id] = true; dock(qBtn);
    const card = el("div", {class:"endcard pop"}, el("h3", {}, "这一段讲完了"), endButtons(a));
    chat.append(card); scrollEnd(card);
  }
  step();
}

function shuffled(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function viewQuiz(a){
  const items = a.body.shuffle ? shuffled(a.body.items) : a.body.items.slice();
  const log = S.log[a.id] = {kind:"quiz", items:[]};
  let k = 0;
  function show(){
    dock();
    if (k >= items.length) return summary();
    const it = items[k];
    const prog = el("div", {class:"progress"}, ...items.map((_, j) => el("i", {class: j < k ? (log.items[j].result === "first" ? "ok" : "on") : (j === k ? "on" : "")})), el("span", {}, ` 第 ${k+1} 题，共 ${items.length} 题`));
    const fb = el("div", {class:"fb"});
    const card = el("div", {class:"qcard pop"}, el("div", {class:"stem"}, it.stem));
    if (it.figure) card.append(figureNode(it.figure));
    const say = (role, text) => {
      if (role === "me") return;
      const cls = {nav:"", hint:"hint", good:"good", bad:"bad"}[role];
      if (role !== "hint") fb.querySelectorAll(".bub:not(.hint)").forEach(n => n.remove());
      const b = el("div", {class:"bub pop " + cls}, role === "hint" ? el("span", {class:"lbl"}, "提示") : null, text);
      fb.append(b); scrollEnd(b);
    };
    $app.replaceChildren(prog, card);
    askItem(card, it, say, rec => {
      log.items.push(rec);
      dock(el("button", {class:"btn", type:"button", onclick:()=>{ k++; show(); window.scrollTo(0,0); }}, k + 1 < items.length ? "下一题" : "看看结果"));
    });
    card.append(fb);
  }
  function summary(){
    S.done[a.id] = true;
    const first = log.items.filter(r => r.result === "first").length;
    const card = el("div", {class:"endcard pop"},
      el("h3", {}, "挑战完成"),
      el("p", {}, `${items.length} 道题里，一次就答对 ${first} 道。` + (first < items.length ? "想岔的地方，正好看清楚了。" : "全部一次答对。")),
      endButtons(a));
    $app.replaceChildren(card);
  }
  show();
}

function viewReflection(a){
  const b = a.body, max = b.max_chars || 120;
  const log = S.log[a.id] = {kind:"reflection", text:""};
  const ta = el("textarea", {maxlength:String(max), placeholder:"想到什么就写什么。"});
  const counter = el("div", {class:"counter"}, `0 / ${max}`);
  const doneBtn = el("button", {class:"btn", type:"button", disabled:true}, "写好了");
  const upd = () => { counter.textContent = `${ta.value.length} / ${max}`; doneBtn.disabled = !ta.value.trim(); };
  ta.addEventListener("input", upd);
  const chips = el("div", {class:"chips"}, ...(b.starters||[]).map(s => el("button", {class:"chip", type:"button", onclick:()=>{
    const t = s.replace(/[…\.。]+$/, "");
    ta.value = (ta.value ? ta.value.replace(/\s*$/, "") + "\n" : "") + t; ta.focus(); upd();
  }}, s)));
  const chat = el("div", {class:"chat"});
  chat.append(bubbleRow("nav", b.prompt));
  const box = el("div", {class:"composer"}, b.starters && b.starters.length ? el("div", {class:"lbl muted", style:"font-size:13px;color:var(--muted)"}, "不知道怎么开头？点一个：") : null, chips, ta, counter, el("div", {class:"row-btns"}, doneBtn));
  doneBtn.addEventListener("click", () => {
    log.text = ta.value.trim(); S.done[a.id] = true;
    box.replaceWith(bubbleRow("me", log.text));
    const end = el("div", {class:"endcard pop"}, el("h3", {}, "记下来了"), el("p", {}, "家长可以在「试玩记录」里看到你写的话。"), endButtons(a));
    chat.append(bubbleRow("nav", "谢谢舰长。"), end); scrollEnd(end);
  });
  chat.append(box);
  $app.replaceChildren(chat);
}

// 动手探索：沙箱 iframe + activity/1.1 契约
let simListener = null;
function viewSim(a){
  const log = S.log[a.id] = {kind:"simulation", events:[], questions:[]};
  dock();
  const frame = el("iframe", {class:"simframe", sandbox:"allow-scripts", title:a.title});
  frame.srcdoc = a.html;
  const end = el("div", {});
  if (simListener) removeEventListener("message", simListener);
  simListener = e => {
    if (e.source !== frame.contentWindow) return;
    const m = e.data; if (!m || m.contract !== "activity/1.1") return;
    const p = m.payload || {};
    const post = (type, payload) => frame.contentWindow.postMessage({contract:"activity/1.1", type, payload}, "*");
    if (m.type === "ready") post("init", {age_band:a.age_band || "G3-4", lang:"zh-CN", phase:"observe", palette:{}, mastery:null});
    else if (m.type === "resize" && p.h) frame.style.height = Math.max(600, Math.ceil(p.h) + 8) + "px";
    else if (m.type === "event") log.events.push(p);
    else if (m.type === "note_question" && p.text) log.questions.push(p.text);
    else if (m.type === "complete"){ S.done[a.id] = true; end.replaceChildren(el("div", {class:"endcard pop"}, el("h3", {}, "这一段做完了"), endButtons(a))); }
  };
  addEventListener("message", simListener);
  $app.replaceChildren(frame, end);
}

function recordText(){
  const out = [`Curio 试玩记录 · ${DATA.constellation}`];
  for (const st of DATA.stars){
    out.push("", `【${st.title}】`);
    for (const a of st.activities){
      const L = S.log[a.id];
      out.push(`${kindLabel(a, st)}：${S.done[a.id] ? "做完了" : (L ? "做到一半" : "没做")}`);
      if (!L) continue;
      (L.items||[]).forEach(r => {
        const res = r.result === "first" ? "一次答对" : r.result === "revealed" ? "看了答案" : `答错 ${r.tries.filter(t => !t.ok).length} 次后答对`;
        out.push(`  · ${r.stem}　${res}${r.hints ? `，用了 ${r.hints} 条提示` : ""}`);
        r.tries.filter(t => !t.ok).forEach(t => out.push(`      选了/写了「${t.shown}」${t.misconception ? `（误区：${st.misconceptions[t.misconception] || t.misconception}）` : ""}`));
      });
      (L.events||[]).filter(ev => ev.verb === "predicted" || ev.verb === "answered").forEach(ev => {
        const r = ev.result || {};
        if (r.item === "pair-try" || (r.item || "").startsWith("pair-")) return;
        out.push(`  · 第 ${r.station || "?"} 站${ev.verb === "predicted" ? "猜测" : "回答"}：${r.correct ? "对" : "错"}${r.misconception ? `（误区：${st.misconceptions[r.misconception] || r.misconception}）` : ""}`);
      });
      const tries = (L.events||[]).filter(ev => ev.verb === "answered" && (ev.result || {}).item === "pair-try").length;
      if (tries) out.push(`  · 配对时配错 ${tries} 次`);
      (L.questions||[]).forEach(q => out.push(`  · 问了领航员：${q}`));
      if (L.text) out.push(`  · 写下：${L.text}`);
    }
  }
  return out.join("\n");
}
function viewRecord(){
  setTop("试玩记录", true); dock();
  const txt = recordText();
  const pre = el("pre", {}, txt);
  const msg = el("span", {class:"muted", style:"font-size:14px;color:var(--muted)"});
  const copy = el("button", {class:"btn", type:"button", onclick: async () => {
    try { await navigator.clipboard.writeText(txt); msg.textContent = "复制好了，可以粘贴发出去。"; }
    catch(e){ const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = "已经选中，长按或按 Ctrl+C 复制。"; }
  }}, "复制成文字");
  $app.replaceChildren(el("div", {class:"rec"},
    el("h2", {}, "这次试玩做了什么"),
    el("p", {class:"muted"}, "只记在这一页里，刷新就没了。试玩完可以复制下来，发给 Claude 当作试玩反馈。"),
    el("div", {class:"row-btns", style:"justify-content:flex-start"}, copy, msg), pre));
}

// 页面内切换，不用地址栏（托管网页里地址栏的 # 不一定传得进来）
let VIEW = "home";
function go(v){ VIEW = v; route(); }
function route(){
  window.scrollTo(0,0);
  const m = VIEW.match(/^act:(.+)$/);
  if (m){
    const a = actById(m[1]);
    if (a){
      setTop(`${kindLabel(a, a.star)} · ${a.title}`, true);
      if (simListener && a.kind !== "simulation"){ removeEventListener("message", simListener); simListener = null; }
      ({simulation:viewSim, explain:viewExplain, quiz:viewQuiz, reflection:viewReflection})[a.kind](a);
      return;
    }
  }
  if (VIEW === "record") return viewRecord();
  viewHome();
}
document.getElementById("back").addEventListener("click", () => go("home"));
route();
</script>
