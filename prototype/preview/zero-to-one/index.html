<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curio · 试玩版</title>
<style>
/* 长按不选字、不弹菜单（#156）。输入框照常能选能改 */
html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
:root{
  --bg:#F5F4EE; --pane:#FBFAF6; --side:#EFEDE5; --hover:#E7E4D9; --rule:#E0DCD0;
  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;
  --accent:#C2603F; --accent-soft:#F3E0D6; --on-accent:#FFFFFF;
  --c-math:#ECCDB6; --c-sci:#CCD6C0; --c-sci-2:#93A982; --c-sci-bg:#DCE3D2;
  --c-sky:#CFDCE6; --wash:#EFE4D6; --dad:#4F7FA8; --mom:#C2603F;
  --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;
  --shadow:0 1px 2px rgba(31,30,28,.06),0 8px 28px rgba(31,30,28,.08);
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-hand:"ZCOOL KuaiLe","Kaiti SC","STKaiti","KaiTi","Noto Sans SC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1E1E1E; --pane:#252525; --side:#1B1B1B; --hover:#2E2E2E; --rule:#353535;
  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;
  --accent:#A797F7; --accent-soft:#2D2943; --on-accent:#15121F;
  --c-math:#5A4536; --c-sci:#3C4836; --c-sci-2:#6F8560; --c-sci-bg:#28301F;
  --c-sky:#2D3B47; --wash:#2A2738; --dad:#7FA9CF; --mom:#E0876A;
  --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 120px}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.topbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 18px;min-height:56px}
.topbar .title{flex:1;font-family:var(--f-serif);font-weight:600;color:var(--ink);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:1px solid var(--rule);background:var(--pane);border-radius:10px;padding:6px 12px;font-size:15px}
.tag{font-size:12px;color:var(--muted);border:1px dashed var(--rule);border-radius:999px;padding:1px 9px;white-space:nowrap}
h1,h2,h3{font-family:var(--f-serif);color:var(--ink);line-height:1.35;margin:0}
.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* 首页 */
.hero{margin:22px 0 8px;padding:22px;border-radius:18px;background:var(--c-sci-bg);display:flex;gap:16px;align-items:center}
.hero .eyebrow{font-size:13px;color:var(--muted);letter-spacing:.05em}
.hero h1{font-size:28px;margin:4px 0 6px}
.hero p{margin:0}
.hero svg{flex:none;width:96px;height:96px}
.note{font-size:14px;color:var(--muted);margin:10px 2px 18px}
.line{position:relative;padding-left:34px}
.groups{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.groups a{display:flex;align-items:center;min-height:44px;border:1px solid var(--rule);border-radius:10px;padding:4px 12px;color:var(--ink);background:var(--pane);text-decoration:none}
.groups a:hover,.groups a:focus-visible{background:var(--hover)}
.group-title,.star{scroll-margin-top:72px}
.group-title{position:relative;background:var(--bg);padding:12px 0;font-size:18px}
.line:before{content:"";position:absolute;left:13px;top:18px;bottom:18px;border-left:2px dashed var(--c-sci-2)}
.star{position:relative;background:var(--pane);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;margin:0 0 16px;box-shadow:var(--shadow)}
.star .dot{position:absolute;left:-34px;top:16px;width:28px;height:28px;border-radius:50%;background:var(--c-sci);border:2px solid var(--ink);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink)}
.star h2,.star h3{font-size:20px}
.star .dq{font-family:var(--f-hand);color:var(--ink);font-size:18px;margin:6px 0 12px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.act{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--bg);border-radius:12px;padding:9px 14px;min-height:48px;font-size:16px}
.act:hover{background:var(--hover)}
.act small{color:var(--muted);font-size:13px}
.act.done{background:var(--good-soft);border-color:var(--good)}
.act .tick{color:var(--good);font-weight:700}
.act small.new{color:var(--accent);font-weight:700}
.act.sim{border-color:var(--accent);border-width:2px}
.simframe{display:block;width:100%;border:0;min-height:600px;background:transparent;margin-top:8px}
.parent{display:block;margin:26px auto 0;border:1px dashed var(--rule);background:transparent;border-radius:12px;padding:10px 16px;color:var(--muted);font-size:15px}

/* 领航员对话 */
.chat{padding:18px 0 8px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:flex-end}
.row.me{justify-content:flex-end}
.ava{flex:none;width:40px;height:40px}
.bub{max-width:min(560px,82%);background:var(--pane);border:1px solid var(--rule);border-radius:16px 16px 16px 4px;padding:10px 14px;color:var(--ink);box-shadow:var(--shadow)}
.row.me .bub{background:var(--accent-soft);border-color:transparent;border-radius:16px 16px 4px 16px}
.bub.hint{background:var(--c-sky);border-color:transparent}
.bub.good{background:var(--good-soft);border-color:transparent}
.bub.bad{background:var(--bad-soft);border-color:transparent}
.bub .lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.bub.fig{max-width:min(620px,88%);padding:10px}
.fig-box{background:var(--bg);border-radius:12px;padding:6px}
.fig-box svg{display:block;width:100%;height:auto;max-height:52vh}
.fig-box [fill="#CCD6C0" i]{fill:var(--c-sci)} .fig-box [fill="#CFDCE6" i]{fill:var(--c-sky)}
.fig-box [fill="#ECCDB6" i]{fill:var(--c-math)} .fig-box [fill="#EFE4D6" i]{fill:var(--wash)}
.fig-box [fill="#4F7FA8" i]{fill:var(--dad)} .fig-box [fill="#C2603F" i]{fill:var(--mom)}
.fig-box [stroke="#4F7FA8" i]{stroke:var(--dad)} .fig-box [stroke="#C2603F" i]{stroke:var(--mom)}
.fig-box [stroke="#1F1E1C" i]{stroke:var(--ink)} .fig-box text{fill:var(--ink)}
/* 挑战配图（pie / rect / rect-unequal / number-line），和正式外壳 app/index.html 的 .figbox .fig 一样 */
.fig-box.q-fig{display:flex;justify-content:center;padding:8px}
.fig-box svg.fig{width:100%;max-width:340px}
svg.fig .k,svg.fig .k1{vector-effect:non-scaling-stroke}
.fig-shade{fill:var(--c-math)}
.fig-txt{fill:var(--ink);font-size:12px}
.cap{font-size:15px;color:var(--text);margin:8px 4px 2px}
.ask{margin-top:4px}
.ask .stem{font-weight:600}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choice{text-align:left;border:1.5px solid var(--ink);background:var(--bg);border-radius:12px;padding:10px 14px;min-height:48px;font-size:17px}
.choice:hover:not(:disabled){background:var(--hover)}
.choice:disabled{cursor:default}
.choice.wrong{border-color:var(--bad);color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.choice.right{border-color:var(--good);background:var(--good-soft);font-weight:600}
.numrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.numrow input{width:130px;font:inherit;font-size:20px;padding:8px 12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink)}
.numrow .unit{font-size:18px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 18px;min-height:48px;font-size:17px;font-weight:600}
.btn.ghost{background:var(--pane);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 26%);padding:26px 0 calc(14px + env(safe-area-inset-bottom,0))}
.dock .in{max-width:760px;margin:0 auto;padding:0 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.composer{background:var(--pane);border:1px solid var(--rule);border-radius:16px;padding:12px;box-shadow:var(--shadow);margin:6px 0}
textarea{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical;min-height:96px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px dashed var(--ink);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:16px;min-height:40px}
.row-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.endcard{background:var(--c-sci-bg);border-radius:16px;padding:18px;margin:16px 0}
.endcard h3{font-size:19px;margin-bottom:6px}
.endcard .row-btns{justify-content:flex-start}

/* 挑战 */
.qcard{background:var(--pane);border:1px solid var(--rule);border-radius:18px;padding:18px;margin-top:18px;box-shadow:var(--shadow)}
.progress{display:flex;gap:6px;margin:18px 0 0;align-items:center;color:var(--muted);font-size:14px}
.progress i{display:inline-block;width:20px;height:8px;border-radius:4px;background:var(--rule)}
.progress i.on{background:var(--ink)} .progress i.ok{background:var(--good)}
.qcard .stem{font-size:19px;font-weight:600;color:var(--ink)}
.fb{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.fb .bub{max-width:100%}
.counter{font-size:13px;color:var(--muted);text-align:right}

/* 记录 */
.rec h2{font-size:20px;margin:22px 0 8px}
.rec h3{font-size:17px;margin:14px 0 6px}
.rec ul{margin:4px 0;padding-left:20px}
.rec .muted{color:var(--muted)}
.rec pre{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--pane);border:1px solid var(--rule);border-radius:12px;padding:12px}

@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .28s ease-out both}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .draw .k,.draw .k1{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}
@media (max-width:520px){
  body{font-size:16px}
  .hero{padding:16px} .hero h1{font-size:24px} .hero svg{width:72px;height:72px}
  .bub{max-width:86%}
}
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <button class="back" id="back" hidden>← 星图</button>
  <div class="title" id="title">Curio</div>
  <span class="tag">试玩版 · 不保存</span>
</div></div>
<main class="wrap" id="app"></main>
<div class="dock" id="dock" hidden><div class="in" id="dockIn"></div></div>

p=\"round\" d=\"M61.83333333333333 142v33\"/><path fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M81.66666666666666 142v33\"/><path fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M101.5 142v33\"/><path fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M121.33333333333333 142v33\"/><path fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M141.16666666666669 142v33\"/><path fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M161.0 142v33\"/><path fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M180.83333333333334 142v33\"/><path fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M200.66666666666666 142v33\"/><path fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M220.5 142v33\"/><path fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M240.33333333333334 142v33\"/><path fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M260.16666666666663 142v33\"/><path fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M280.0 142v33\"/><path fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M42 142h238m-238 33h238\"/>\n<\/svg>", "content/assets/math.fraction.the-whole/two-pies.svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 230\" role=\"img\" aria-label=\"一张小饼和一张大饼，各涂了半张\">\n  <title>小饼和大饼，各涂了半张<\/title>\n  <desc>左边是一张小饼，右边是一张大饼，两张饼都平均分成 2 份，各涂了其中 1 份。<\/desc>\n  <circle cx=\"130\" cy=\"100\" r=\"42\" fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\"/>\n  <path d=\"M 130 58 A 42 42 0 0 0 130 142 Z\" fill=\"#C2603F\" fill-opacity=\"0.8\"/>\n  <line x1=\"130\" y1=\"58\" x2=\"130\" y2=\"142\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n  <circle cx=\"130\" cy=\"100\" r=\"42 ei\",system-ui,sans-serif;\n  --f-mono:ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n  color-scheme:light;\n}\n@media (prefers-color-scheme:dark){:root{\n  --bg:#1E1E1E; --pane:#252525; --rule:#353535; --hover:#2E2E2E;\n  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;\n  --accent:#E0876A; --accent-soft:#3A2A24;\n  --grip:#5FC4BE; --grip-soft:#1F3634;\n  --sage:#3C4836; --sage-bg:#28301F; --sky:#2D3B47; --apricot:#5A4536; --paper:#33302A;\n  --dad:#7FA9CF; --mom:#E0876A; --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;\n  color-scheme:dark;\n}}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}\nbutton{font:inherit;color:inherit;cursor:pointer}\n.wrap{max-width:820px;margin:0 auto;padding:12px 14px 28px}\n.card{background:var(--pane);border:1px solid var(--rule);border-radius:18px;overflow:hidden}\n.card header,.card footer{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 16px}\n.card header{border-bottom:1px solid var(--rule)}\n.card footer{border-top:1px solid var(--rule);min-height:52px;align-items:center}\n.station{font-size:13px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}\nh1{font-family:var(--f-serif);font-size:20px;font-weight:600;color:var(--ink);margin:0;text-align:right}\n.hint{font-size:14px;color:var(--muted)}\n.readout{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px;text-align:right}\n.readout b{color:var(--accent);font-weight:600}\nsvg#stage{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}\nsvg#stage:focus,svg#stage:focus-visible{outline:none}\nsvg#stage.kbd:focus-visible{outline:2px solid var(--grip);outline-offset:-4px}\n.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}\n.kf{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:3 6}\n.t{fill:var(--ink);font-family:var(--f-sans);font-size:15px}\n.tm{fill:var(--muted);font-family:var(--f-sans);font-size:15px}\n.talk{display:flex;gap:10px;align-items:flex-start;margin:14px 2px 6px}\n.ava{flex:none;width:42px;height:42px}\n.bubble{background:var(--pane);border:1px solid var(--rule);border-radius:16px 16px 16px 4px;padding:10px 14px;color:var(--ink);min-height:44px;flex:1}\n.bubble.good{background:var(--good-soft);border-color:transparent}\n.bubble.bad{background:var(--bad-soft);border-color:transparent}\n.bubble.hmm{background:var(--paper);border-color:transparent}\n.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin:10px 0 0}\n.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 18px;min-height:48px;font-size:17px;font-weight:600;touch-action:manipulation}\n.btn.ghost{background:var(--pane);color:var(--ink)}\n.btn.choice{background:var(--bg);color:var(--ink);font-weight:500;text-align:left;flex:1 1 220px}\n.btn.choice:hover{background:var(--hover)}\n.btn:disabled{opacity:.4;cursor:default}\n.btn.small{min-height:40px;font-size:15px;padding:6px 14px;font-weight:500} .btn.tight{padding:9px 12px}\n.qbox{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}\n.qbox textarea{flex:1 1 260px;font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);min-height:64px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n@media (max-width:520px){ body{font-size:16px} h1{font-size:17px} .card header,.card footer{padding:8px 12px} .card footer{flex-wrap:wrap;row-gap:2px} .hint{white-space:nowrap} .readout{font-size:14px;flex:1 1 auto} }\n/* kit:grip 2026-11-14 —— 圆钮（「可抓」记号，g1.md A.4 G1～G8）。--grip 只给圆钮、托、按住按钮、焦点框用；--accent 不给任何控件用 */\n.btn.hold{touch-action:none;background:var(--grip);border-color:var(--grip);color:var(--bg);display:inline-flex;align-items:center;gap:10px;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}\n.btn.hold.on{filter:brightness(.82)}\n.btn.hold svg{width:18px;height:18px;flex:none}\n.btn.hold svg path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}\n.gfill{fill:var(--grip)}\n.gring{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}\n.gring.on{stroke-width:3.2}\n.gridge{fill:none;stroke:var(--bg);stroke-width:2.2;stroke-linecap:round}\n.garrow{fill:none;stroke:var(--grip);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.gkbd{fill:none;stroke:var(--ink);stroke-width:1.6}\n#cue{fill:none;stroke:var(--grip);stroke-width:2.4;transform-box:fill-box;transform-origin:center;animation:cue 2.4s ease-out infinite}\n@keyframes cue{0%{transform:scale(1);opacity:.95}50%{transform:scale(1.8);opacity:0}100%{transform:scale(1.8);opacity:0}}\n@media (prefers-reduced-motion:reduce){#cue{animation:none;transform:scale(1.3);opacity:.9}}\n/* kit:frac 2026-11-14 —— 分数一律上下结构（A.4 第 2 条）。HTML 里用 .frac，SVG 里用 fracS() */\n.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-family:var(--f-mono);font-size:.84em;margin:0 .2em;font-variant-numeric:tabular-nums}\n.frac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .28em .04em}\n.frac>span:last-child{padding:.04em .28em 0}\n.fl{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}\n.fs{fill:var(--ink);font-family:var(--f-mono);font-size:16px} .fm{fill:var(--ink);font-family:var(--f-mono);font-size:22px} .fb{fill:var(--ink);font-family:var(--f-mono);font-size:34px}\nbody.narrow .fs{font-size:20px} body.narrow .fm{font-size:26px} body.narrow .fb{font-size:38px}\n/* 本模块的画面样式：字号全写在类上，窄屏在 body.narrow 里放大（教训 14、28） */\n.food{fill:var(--apricot)} .lead{fill:var(--accent)} .papr{fill:var(--paper)} .pane{fill:var(--pane)}\n.kacc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.one{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:7 6}\n.faint{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;opacity:.75}\n.lb{fill:var(--ink);font-family:var(--f-sans);font-size:17px}\n.lbg{fill:var(--muted);font-family:var(--f-sans);font-size:16px}\n.lbm{fill:var(--ink);font-family:var(--f-mono);font-size:17px}\n.big{fill:var(--ink);font-family:var(--f-mono);font-size:44px}\n.ttl{fill:var(--ink);font-family:var(--f-serif);font-size:26px}\n.sign{fill:var(--ink);font-family:var(--f-serif);font-size:24px}\nbody.narrow .lb{font-size:21px} body.narrow .lbg{font-size:20px} body.narrow .lbm{font-size:20px}\nbody.narrow .big{font-size:50px} body.narrow .ttl{font-size:30px} body.narrow .sign{font-size:28px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\"><\/span><h1 id=\"title\"><\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 800 610\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <g id=\"dyn\"><\/g>\n      <g id=\"fx\"><circle id=\"cue\" cx=\"0\" cy=\"0\" r=\"10\" style=\"display:none\"/><\/g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n      <rect id=\"touch\" x=\"-400\" y=\"-400\" width=\"1600\" height=\"1410\" fill=\"transparent\"/><!-- 永不重画的触摸层（教训 25） -->\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* Curio · 切分机 act.simulation.fair-cut-01（几分之一：越分越小）。设计说明：docs/constellations/zero-to-one/g1.md C.1 */\n\n/* ============ 1. 真相模型：页面上的每个数字都从这里算 ============ */\nconst MODEL = {\n  nMin: 2, nMax: 12,          // 一张饼平均切成 2 到 12 份（设计约定；1 是「还没切」）\n  mustTry: [3, 8],            // 谜题里的两种切法，舰长必须亲手切一次（设计约定）\n  minKinds: 4,                // 至少切过 4 种份数才揭晓（设计约定：3、8 再加 2 种）\n  settleMs: 600,              // 转盘停住 0.6 秒算试过一种（手感约定）\n  rollCells: 100,             // 蛋糕卷长 100 小格，粗细处处一样，所以一样长就是一样多（画面约定；小格不显示）\n  snap: 2,                    // 刀离目标不超过 2 格就吸过去（手感约定）\n  opening: [50, 30, 20],      // 开场那条切歪的蛋糕卷，问的是中间 30 格那段（设计约定）\n  // 1 米 = 10 分米 = 100 厘米 = 1000 毫米：相邻单位进率都是 10，由 1 米 = 10 分米、1 分米 = 10 厘米、1 厘米 = 10 毫米推出\n  // （人教版三年级上册，2024 年审定、2025 年秋起用，第三单元「毫米、分米和千米」；2026-11-14 独立核对）\n  units: [ { n: 10, name: \"分米\", secs: 3, pow: 1 }, { n: 100, name: \"厘米\", secs: 4, pow: 1.6 }, { n: 1000, name: \"毫米\", secs: 5, pow: 2 } ],\n  mmPerMetre: 1000,\n  cardMm: 0.76,               // 银行卡标称厚 0.76 毫米（ISO/IEC 7810:2019 ID-1）。比 1 毫米薄一点，只说「差不多一张卡片那么薄」\n};\nconst sliceDeg = n => 360 / n;                                   // 每份的角：2→180，3→120，4→90，5→72，6→60，8→45，10→36，12→30\nconst deg2 = n => Math.round(sliceDeg(n) * 100) / 100;           // 保留两位：7→51.43，11→32.73\nconst halfCuts = () => { const h = MODEL.rollCells / 2; return [h, h / 2, h + h / 2]; };   // 三刀的目标：50、25、75\nconst CN = { 1: \"一\", 2: \"二\", 3: \"三\", 4: \"四\", 5: \"五\", 6: \"六\", 7: \"七\", 8: \"八\", 9: \"九\", 10: \"十\", 11: \"十一\", 12: \"十二\", 100: \"百\", 1000: \"千\" };\nconst cnFrac = (a, b) => `${CN[b]}分之${CN[a]}`;                 // 读法：3/4 读作四分之三\nconst fmt = n => String(Math.round(n));\n\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 本星座的共用零件  kit:zero-to-one ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed){\n  const tx = x + 4, ty = y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 3;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1q\", hold: false, press: false, kbd: false, dirty: true };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.innerHTML = (a.hold ? RIDGES : \"\") + `<span>${a.label}<\/span>`;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); if (v) touched(); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(ev, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(true); } });\n      b.addEventListener(\"keyup\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(false); } });\n      b.addEventListener(\"blur\", () => on(false));\n      b.addEventListener(\"contextmenu\", e => e.preventDefault());\n    } else {\n      b.addEventListener(\"click\", e => { if (performance.now() - born < 400 || (keyGuard && e.detail === 0)) return; a.go(e); });\n      if (guard){ b.disabled = true; const en = () => { setTimeout(() => { b.disabled = false; }, 120); removeEventListener(\"pointerup\", en, true); }; addEventListener(\"pointerup\", en, true); }\n    }\n    boxEl.append(b);\n  }\n  const first = boxEl.querySelector(\"button\");\n  if (first && !/^act/.test(S.mode)) first.focus({ preventScroll: true });\n  return boxEl;\n}\n// 猜测：只记下来，不在这里判对错的颜色。猜错的反馈先接住、再说清，然后一律去动手，让实物来回答\nfunction ask(question, options, onAnswer){\n  say(question);\n  actions(options.map((o, i) => ({ label: o.label, cls: \"choice\", go: () => {\n    if (!sentPred.has(S.station)){ sentPred.add(S.station); Host.event(\"predicted\", { station: S.station, choice: i, correct: !!o.correct, misconception: o.mis || null }); }\n    S.guess = S.guess || {}; S.guess[S.station] = o;\n    say(o.feedback, o.correct ? \"good\" : \"hmm\");\n    onAnswer(o);\n  }})));\n}\nfunction next(label, go, cls){ actions([{ label, go, cls }]); }\n// 星卡上选站重玩（#154）：replay 是正在重玩的站号，0 是从头往下走。重玩一站跳过开场和猜测题，直接进这一站的动手；\n// 揭晓完，原来「去第 k+1 站」「看我的星卡」的按钮换成「回星卡」（用 nextOr）。不出猜测题就不发 predicted；\n// observed 靠 observedOnce、complete 靠 completed，都只记第一次。每站怎么复位、怎么进动手是模块自己的事，写在 REPLAY[站号] 里\nlet replay = 0;\nconst REPLAY = {};\nfunction nextOr(label, go, cls){ if (replay) next(\"回星卡\", enterEnd); else next(label, go, cls); }\nfunction replayAt(k){ replay = k; gen++; S.station = k; hint(\"\"); readout(\"\"); disarmCue(); REPLAY[k](); }\nfunction restart(){ replay = 0; sentPred.clear(); sentObs.clear(); S.guess = {}; lastState = \"\"; enter1(); }   // 从头玩：和以前的「再玩一次」一样\nfunction endActions(){   // 星卡的按钮：从头玩 + 第 1 站…第 N 站。enterEnd() 最后调它\n  replay = 0;\n  actions([{ label: \"从头玩\", go: restart, cls: \"ghost tight\" }].concat(Array.from({ length: STATIONS }, (_, i) => ({ label: `第 ${i + 1} 站`, go: () => replayAt(i + 1), cls: \"tight\" }))));   // tight：手机上一行排得下\n}\n\n(function(){   // 「我有个问题」：随时可以问，发到信号站\n  const area = $(\"qarea\");\n  const open = document.createElement(\"button\");\n  open.type = \"button\"; open.className = \"btn ghost small\"; open.textContent = \"我有个问题\";\n  open.style.marginTop = \"12px\";\n  open.addEventListener(\"click\", () => {\n    if (area.querySelector(\"textarea\")) return;\n    const ta = document.createElement(\"textarea\"); ta.maxLength = 120; ta.placeholder = \"想问领航员什么？\";\n    const send = document.createElement(\"button\"); send.type = \"button\"; send.className = \"btn small\"; send.textContent = \"发给领航员\";\n    const bx = document.createElement(\"div\"); bx.className = \"qbox\"; bx.append(ta, send);\n    send.addEventListener(\"click\", () => { const q = ta.value.trim(); if (!q) return; Host.noteQuestion(q); bx.remove(); say(\"好问题，我记下来了。等会儿一起找答案。\"); });\n    area.append(bx); ta.focus();\n  });\n  area.append(open);\n})();\n\n// 第一屏的提醒（G6）：进入动手 1.5 秒还没碰，第一个圆钮外面扩出一圈细环；一碰就再也不出现\nlet cuePos = null, cueTimer = 0;\nfunction armCue(pos){ disarmCue(); const g = gen; cueTimer = setTimeout(() => { if (g === gen && /^act/.test(S.mode)){ cuePos = pos; S.dirty = true; } }, 1500); }\nfunction disarmCue(){ clearTimeout(cueTimer); cuePos = null; cueEl.style.display = \"none\"; }\nfunction touched(){ if (cuePos || cueTimer) disarmCue(); cueTimer = 0; }\nfunction placeCue(){ if (!cuePos) return; const [x, y, r] = cuePos(); cueEl.setAttribute(\"cx\", r1(x)); cueEl.setAttribute(\"cy\", r1(y)); cueEl.setAttribute(\"r\", r1((r || gripR()) + 2)); cueEl.style.display = \"\"; }   // 第三个数是被提醒的东西的半径（托里的一个）\n\n// 窄屏：viewBox 缩到中间 600 宽的操作区，字号类放大（教训 13、28）。每个场景写明自己用到的高度\n// 排版规矩：要紧的东西都画在 x = 110～690 之间；每个场景在这里写 [起始 y, 高度]\nconst VIEW = { s1q: [80, 440], s1: [56, 554], s2q: [96, 330], s2: [16, 560], s2stack: [76, 330], s2weigh: [200, 330], s3q: [150, 300], s3: [84, 500], s3r: [84, 540], end: [8, 596] };\nfunction fitView(){\n  const nar = (svg.clientWidth || 800) < 600, [y, h] = VIEW[S.scene] || [0, 610];\n  document.body.classList.toggle(\"narrow\", nar);\n  const v = (nar ? [100, y, 600, h] : [0, y, 800, h]).join(\" \");\n  if (svg.getAttribute(\"viewBox\") !== v){ svg.setAttribute(\"viewBox\", v); S.dirty = true; }\n}\naddEventListener(\"resize\", fitView);\nfunction scene(name){ S.scene = name; fitView(); S.dirty = true; }\n\n/* ============ 6. 第 1 站 · 转：同一张饼，切的份数越多，每一份越小 ============ */\nconst PIE = { x: 248, y: 226, r: 116, out: 16 }, DIAL = { x: 572, y: 288, r: 72 }, TRAY = { y: 552, r: 46, gap: 8, x0: 104, x1: 696 };\n// 一张饼：从圆心切（每份的角一样大，A.5）。wd 是画面上那一份的角，out 是取出来的距离；lead 为真时取出的那一份是主角\nfunction pie(cx, cy, R, n, wd, out, seed, lead){\n  if (n < 2 && wd > 359) return `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${R}\" class=\"food\"/>` + P(Sk.ellipse(cx, cy, R, R, seed, .5));\n  const [bx, by] = pol(0, 0, out, wd / 2), ox = r1(bx), oy = r1(by);\n  let s = `<path d=\"${sectorD(cx, cy, R, wd, 360)}\" class=\"food\"/>` + P(arcD(cx, cy, R, wd, 360, seed));\n  for (let k = 1; k <= n; k++){ const a = k * wd; if (a > 359.5) break; const [px, py] = pol(cx, cy, R, a); s += P(Sk.line(cx, cy, px, py, seed + k, .45)); }\n  { const [px, py] = pol(cx, cy, R, 0); s += P(Sk.line(cx, cy, px, py, seed + 40, .45)); }\n  const [p0x, p0y] = pol(cx, cy, R, 0), [p1x, p1y] = pol(cx, cy, R, wd);\n  s += `<g transform=\"translate(${ox} ${oy})\"><path d=\"${sectorD(cx, cy, R, 0, wd)}\" class=\"${lead ? \"lead\" : \"food\"}\"${lead ? ' opacity=\".88\"' : \"\"}/>` +\n    P(arcD(cx, cy, R, 0, wd, seed + 50) + Sk.line(cx, cy, p0x, p0y, seed + 51, .45) + Sk.line(cx, cy, p1x, p1y, seed + 52, .45)) + `<\/g>`;\n  return s;\n}\n// 托盘上的一份：尖朝左躺着，所以越小的一份越矮，排起来是一段下坡的台阶\nconst sliceH = (n, r) => 2 * r * Math.sin(Math.PI / n);\nfunction slice(x, yc, r, n, seed, o){\n  const h = 180 / n, [ax, ay] = pol(x, yc, r, 90 - h), [bx2, by2] = pol(x, yc, r, 90 + h);\n  return `<path d=\"${sectorD(x, yc, r, 90 - h, 90 + h)}\" class=\"food\"${o && o.auto ? ' opacity=\".5\"' : \"\"}/>` +\n    P(arcD(x, yc, r, 90 - h, 90 + h, seed) + Sk.line(x, yc, ax, ay, seed + 1, .4) + Sk.line(x, yc, bx2, by2, seed + 2, .4), o && o.auto ? \"k1\" : \"k\");\n}\nfunction trayLayout(){   // 按份数从少到多排，同一个 n 只留一块\n  const items = S.tray.slice().sort((a, b) => a.n - b.n), w = items.length * TRAY.r + (items.length - 1) * TRAY.gap, x0 = 400 - w / 2;\n  items.forEach((it, i) => { it.tx = x0 + i * (TRAY.r + TRAY.gap); it.ty = TRAY.y - 4 - sliceH(it.n, TRAY.r) / 2; });\n  return items;\n}\nfunction addToTray(n, auto){\n  if (S.tray.some(it => it.n === n)) return;\n  const [bx, by] = pol(PIE.x, PIE.y, PIE.out, sliceDeg(n) / 2);\n  S.tray.push({ n, auto: !!auto, x: auto ? 400 : PIE.x + bx, y: auto ? TRAY.y - 120 : PIE.y + by, sc: auto ? 1 : PIE.r / TRAY.r, tx: 0, ty: 0 });\n  trayLayout(); S.dirty = true;\n}\nconst dialGripR = () => DIAL.r + gripR() * .8;       // 圆钮装在盘边外面，不压住盘上的数字\nconst dialGrip = () => pol(DIAL.x, DIAL.y, dialGripR(), S.ang);\n\nfunction draw1q(){\n  let s = \"\";\n  [[250, 8, \"领航员要\"], [550, 3, \"舰长拿\"]].forEach(([cx, d, who], i) => {\n    s += pie(cx, 222, 100, 1, 360, 0, 11 + i * 30) + oneMark(cx - 114, 108, 228, 228, 20 + i * 30);\n    if (S.s1step > i) s += `<rect x=\"${cx - 38}\" y=\"366\" width=\"76\" height=\"92\" rx=\"8\" class=\"papr\"/>` + P(box(cx - 38, 366, 76, 92, 60 + i * 9, .5), \"k1\") + fracS(cx, 410, 1, d, \"fb\", 66 + i) + TC(cx, 490, who, \"lbg\");\n  });\n  return s;\n}\nfunction draw1(){\n  const n = S.n, act = S.mode === \"act1\";\n  let s = oneMark(PIE.x - PIE.r - 14, PIE.y - PIE.r - 14, PIE.r * 2 + 28, PIE.r * 2 + 28, 101) + pie(PIE.x, PIE.y, PIE.r, n, S.wd, S.out, 110, true);\n  if (n >= 2){   // 上下结构的分数，第二次停住以后标出三个零件的名字\n    s += fracS(436, 128, 1, n, \"fb\", 131);\n    if (S.settles >= 2) s += [[\"分子\", 110], [\"分数线\", 134], [\"分母\", 158]].map(([w, y], i) => P(Sk.line(462, y - 6, 472, y - 6, 140 + i, .3), \"faint\") + T(478, y, w, \"lbg\")).join(\"\");\n  }\n  // 切分盘：钟面一样的 12 格，指针指着切成几份\n  s += `<circle cx=\"${DIAL.x}\" cy=\"${DIAL.y}\" r=\"${DIAL.r}\" class=\"papr\"/>` + P(Sk.ellipse(DIAL.x, DIAL.y, DIAL.r, DIAL.r, 150, .5));\n  for (let i = 1; i <= 12; i++){ const [tx, ty] = pol(DIAL.x, DIAL.y, DIAL.r - 19, i * 30); s += TC(r1(tx), r1(ty + 6), i, \"lbm\", i === n ? 'font-weight=\"700\"' : 'opacity=\".62\"'); }\n  const [nx, ny] = pol(DIAL.x, DIAL.y, DIAL.r - 36, S.ang);\n  s += P(Sk.line(DIAL.x, DIAL.y, nx, ny, 160, .3), \"k\", 'stroke-width=\"3\"') + `<circle cx=\"${DIAL.x}\" cy=\"${DIAL.y}\" r=\"5\" fill=\"var(--ink)\"/>`;\n  if (act){ const [gx, gy] = dialGrip(), a = S.ang * Math.PI / 180; s += grip(gx, gy, [Math.cos(a), Math.sin(a)], { arc: [DIAL.x, DIAL.y], on: S.press, kbd: S.kbd, seed: 171 }); }\n  // 长托盘：试过的每种一份各留一块\n  s += P(Sk.line(TRAY.x0, TRAY.y, TRAY.x1, TRAY.y, 180, .6) + Sk.line(TRAY.x0, TRAY.y, TRAY.x0, TRAY.y - 9, 181, .3) + Sk.line(TRAY.x1, TRAY.y, TRAY.x1, TRAY.y - 9, 182, .3));\n  for (const it of S.tray){\n    s += slice(r1(it.x), r1(it.y), r1(TRAY.r * it.sc), it.n, 200 + it.n * 3, it);\n    if (Math.abs(it.sc - 1) < .05) s += fracS(r1(it.x + TRAY.r / 2), 578, 1, it.n, \"fs\", 240 + it.n);\n  }\n  return s;\n}\nfunction readout1(){\n  readout(S.n < 2 ? \"一整张饼 · 还没切\" : `切成 ${S.n} 份 · 这一份是这张饼的 ${F(1, S.n)}`);\n  sendState({ station: 1, n: S.n, deg: deg2(S.n) });\n}\nfunction setN(n){\n  n = clamp(Math.round(n), 1, MODEL.nMax); if (n === S.n) return;\n  S.n = n; S.nAt = performance.now(); S.settled = false; S.dirty = true; readout1();\n}\nconst kinds = () => S.tray.filter(it => !it.auto).map(it => it.n).sort((a, b) => a - b);\nfunction hint1(){\n  const k = kinds(), miss = MODEL.mustTry.filter(m => !k.includes(m));\n  hint(S.s1ready ? `转一转圆钮 · 切过 ${k.length} 种` : miss.length ? `转一转圆钮 · 还要试 ${miss.join(\" 份、\")} 份` : `转一转圆钮 · 再试 ${MODEL.minKinds - k.length} 种`);\n}\nfunction settle1(){   // 转盘停住 0.6 秒：这一份的一个复制品落到托盘上\n  S.settled = true; const n = S.n; S.lastN = n; S.settles++; addToTray(n);\n  const k = kinds(), miss = MODEL.mustTry.filter(m => !k.includes(m));\n  if (S.settles === 1) say(`平均切成 ${n} 份，这一份就是这张饼的 ${F(1, n)}，读作${cnFrac(1, n)}。这样的数叫分数。`);\n  else if (S.settles === 2) say(\"下面的数是平均切成几份，叫分母。上面的数是拿了几份，叫分子。中间那道叫分数线。\");\n  else if (!S.s1ready && miss.length) say(`${n} 份的那一块也上托盘了。再切成 ${miss[0]} 份看看。`);\n  else if (!S.s1ready && k.length < MODEL.minKinds) say(\"再换一种份数试试，看托盘上那一排怎么变。\");\n  if (!S.s1ready && !miss.length && k.length >= MODEL.minKinds){\n    S.s1ready = true; say(\"托盘上排好了一队。还想切就接着转，看够了点「看托盘」。\"); next(\"看托盘\", done1);\n  }\n  hint1();\n}\nfunction enter1(){\n  gen++; S.station = 1; S.mode = \"talk\"; S.s1step = 1; head(1, \"转：切成几份\"); hint(\"\"); readout(\"\"); disarmCue(); scene(\"s1q\");\n  say(`舰长，我们分两张一样大的饼。我要这张的 ${F(1, 8)}，读作八分之一。`);\n  next(\"然后呢\", () => {\n    S.s1step = 2; S.dirty = true;\n    say(`你拿那张的 ${F(1, 3)}，读作三分之一。8 比 3 大，我这块肯定更大。`);\n    next(\"是吗\", () => ask(`你觉得呢：${F(1, 8)} 张饼和 ${F(1, 3)} 张饼，哪一块大？`, [\n      { label: `${F(1, 8)} 那块大`, mis: \"bigger-denominator-bigger\", feedback: \"8 确实比 3 大，这么想很自然。可这里的 8 说的是切成几份，不是饼有多大。\" },\n      { label: \"一样大，上面都是 1\", mis: \"numerator-only\", feedback: \"上面都是 1，看着是一样。可下面的数不一样，切法就不一样。\" },\n      { label: `${F(1, 3)} 那块大`, correct: true, feedback: \"你不信我的话。那就切开看看，到底谁说得对。\" }\n    ], () => next(\"动手切\", act1)));\n  });\n}\nfunction act1(){\n  S.mode = \"act1\"; Object.assign(S, { n: 1, wd: 360, out: 0, ang: 30, tray: [], settles: 0, settled: true, lastN: 0, s1ready: false });\n  scene(\"s1\"); actions([]); readout1(); hint1();\n  say((replay ? \"\" : \"带圆钮的地方，都能用手抓。\") + \"转一转切分盘，看这张饼被切成几份。\");   // 这句整个模块只说一次（G8），重玩一站时不再说\n  svg.focus({ preventScroll: true }); armCue(dialGrip);\n}\nREPLAY[1] = () => { head(1, \"转：切成几份\"); act1(); };   // 重玩第 1 站：act1() 清空托盘、转盘回到 1 份，跳过开场两张饼和猜测题\nfunction done1(){\n  S.mode = \"talk\"; hint(\"\"); disarmCue(); observedOnce(1);\n  const have = kinds(); let d = 0, filled = false;\n  for (let n = MODEL.nMin; n <= MODEL.nMax; n++) if (!have.includes(n)){ filled = true; later(d += 110, () => addToTray(n, true)); }\n  say((filled ? \"没切过的几种，我也补上了。\" : \"\") + \"同一张饼，切的份数越多，每一份越小。\", \"good\");\n  next(\"所以呢\", () => {\n    const g = S.guess && S.guess[1];\n    say(`8 比 3 大，${F(1, 8)} 反而比 ${F(1, 3)} 小。` + (g && g.correct ? \"你没上我的当。\" : \"我也想错了，是这张饼帮我们改过来的。\"), \"good\");\n    nextOr(\"去第 2 站\", enter2);\n  });\n}\n\n/* ============ 7. 第 2 站 · 切：每份一样大，才叫平均分 ============ */\nconst ROLL = { x: 150, y: 156, h: 60, cell: 5 }, KN = { tip: 138, top: 84, grip: 56, off: 8, drop: ROLL.y + ROLL.h + 8 }, SC = { x: 400, y: 322, half: 170, hang: 50, base: 486, per: 1.5, ph: 30 };\nconst cellX = c => ROLL.x + c * ROLL.cell;\n// 一段蛋糕卷：侧着看是一条，右端看得见卷起来的截面\nfunction rollPiece(x, y, len, h, seed){\n  const rx = Math.min(7, h * .14), ex = x + len, cy = y + h / 2;\n  return `<rect x=\"${r1(x)}\" y=\"${r1(y)}\" width=\"${r1(len)}\" height=\"${r1(h)}\" rx=\"${r1(h * .16)}\" class=\"food\"/>` +\n    P(Sk.line(x + 3, y, ex, y, seed, .5) + Sk.line(x + 3, y + h, ex, y + h, seed + 1, .5) + Sk.curve([[x + 3, y], [x, cy], [x + 3, y + h]], seed + 2, .4)) +\n    `<ellipse cx=\"${r1(ex)}\" cy=\"${r1(cy)}\" rx=\"${r1(rx)}\" ry=\"${r1(h / 2)}\" class=\"papr\"/>` + P(Sk.ellipse(ex, cy, rx, h / 2, seed + 3, .4)) +\n    P(Sk.curve([[ex + rx * .1, cy - h * .3], [ex - rx * .45, cy - h * .05], [ex + rx * .05, cy + h * .16], [ex + rx * .3, cy], [ex, cy - h * .08]], seed + 4, .3), \"k1\");\n}\nfunction rollCut(a, b, y, h, seed){   // 整条里从 a 格到 b 格的一段，刀口处留一道缝\n  const x = cellX(a) + (a > 0 ? 6 : 0), e = cellX(b) - (b < MODEL.rollCells ? 6 : 0);\n  return rollPiece(x, y, e - x, h, seed);\n}\nconst pieces2 = () => { const c = [0, ...S.cuts, MODEL.rollCells]; return c.slice(0, -1).map((a, i) => [a, c[i + 1]]); };\nconst target2 = () => halfCuts()[{ cut1: 0, cut2: 1, cut3: 2 }[S.ph]];\nconst range2 = () => ({ cut1: [1, 99], cut2: [1, 49], cut3: [51, 99] })[S.ph];\nconst sides2 = k => S.ph === \"cut1\" ? [k, MODEL.rollCells - k] : S.ph === \"cut2\" ? [k, 50 - k] : [k - 50, MODEL.rollCells - k];   // 天平两个盘里各有几格\nconst tiltOf = (L, R) => clamp((R - L) / (L + R) * 70, -16, 16);    // 右边重，右边沉\nfunction drawScale(tilt, L, R, seedL, seedR){\n  const a = tilt * Math.PI / 180, ex = Math.cos(a) * SC.half, ey = Math.sin(a) * SC.half;\n  let s = P(Sk.line(SC.x, SC.y, SC.x - 34, SC.base, 301, .4) + Sk.line(SC.x, SC.y, SC.x + 34, SC.base, 302, .4) + Sk.line(SC.x - 62, SC.base, SC.x + 62, SC.base, 303, .4)) +\n    P(Sk.line(SC.x - ex, SC.y - ey, SC.x + ex, SC.y + ey, 304, .3), \"k\", 'stroke-width=\"3\"') + `<circle cx=\"${SC.x}\" cy=\"${SC.y}\" r=\"5\" fill=\"var(--ink)\"/>`;\n  [[-1, L, seedL], [1, R, seedR]].forEach(([sg, cells, seed]) => {\n    const px = SC.x + sg * ex, py = SC.y + sg * ey, py2 = py + SC.hang, w = cells * SC.per;\n    s += P(Sk.line(px, py, px - 68, py2, 310 + sg, .3) + Sk.line(px, py, px + 68, py2, 312 + sg, .3), \"k1\") + P(Sk.line(px - 84, py2, px + 84, py2, 314 + sg, .4));\n    if (cells > 0) s += rollPiece(px - w / 2, py2 - SC.ph - 2, w, SC.ph, seed);\n  });\n  return s;\n}\nfunction draw2q(){\n  let s = oneMark(ROLL.x - 14, ROLL.y - 16, MODEL.rollCells * ROLL.cell + 34, ROLL.h + 32, 320), a = 0;\n  MODEL.opening.forEach((len, i) => { s += rollCut(a, a + len, ROLL.y, ROLL.h, 330 + i * 7); if (i === 1) s += TC(cellX(a + len / 2), ROLL.y + ROLL.h + 76, \"？\", \"big\") + P(Sk.line(cellX(a) + 8, ROLL.y + ROLL.h + 26, cellX(a + len) - 8, ROLL.y + ROLL.h + 26, 350, .4), \"kacc\"); a += len; });\n  return s;\n}\nfunction draw2(){\n  const act = S.mode === \"act2\" && !S.cutting, kx = cellX(S.knifeP), d = S.cutting ? clamp(S.cutT / .55) : 0, dy = (KN.drop - KN.tip) * d;\n  let s = oneMark(ROLL.x - 14, ROLL.y - 16, MODEL.rollCells * ROLL.cell + 34, ROLL.h + 32, 320);\n  pieces2().forEach(([a, b], i) => {\n    s += rollCut(a, b, ROLL.y, ROLL.h, 360 + a);\n    const den = MODEL.rollCells / (b - a);\n    if (S.cuts.length === 3 || (S.cuts.length && den === 2)) s += fracS(cellX((a + b) / 2) - 3, ROLL.y + ROLL.h / 2 + 2, 1, den, \"fm\", 380 + i);\n  });\n  if (S.ph !== \"done\"){   // 刀：刀身是主角，刀柄上装圆钮\n    const hx = kx - KN.off;   // 刀背是直的，正对着要切的地方；刀柄和圆钮在刀身正上方\n    s += `<g transform=\"translate(0 ${r1(dy)})\"><path d=\"M${r1(kx)} ${KN.top}L${r1(kx)} ${KN.tip}Q${r1(kx - 19)} ${KN.tip - 16} ${r1(kx - 17)} ${KN.top}Z\" class=\"lead\"/>` +\n      P(Sk.line(kx, KN.top, kx, KN.tip, 391, .25) + `M${r1(kx)} ${KN.tip}Q${r1(kx - 19)} ${KN.tip - 16} ${r1(kx - 17)} ${KN.top}` + Sk.line(kx - 17, KN.top, kx, KN.top, 392, .25)) +\n      `<rect x=\"${r1(hx - 10)}\" y=\"${KN.grip - 28}\" width=\"20\" height=\"${KN.top - KN.grip + 28}\" rx=\"8\" class=\"papr\"/>` + P(box(hx - 10, KN.grip - 28, 20, KN.top - KN.grip + 28, 393, .4));\n    if (act) s += grip(hx, KN.grip, [1, 0], { on: S.press, kbd: S.kbd, seed: 395 });\n    s += `<\/g>`;\n  }\n  const [L, R] = sides2(S.knifeP);\n  if (S.ph === \"cut1\") s += drawScale(S.tilt, L, R, 401, 402); else s += drawScale(S.tilt, Math.max(L, .01), Math.max(R, .01), 401, 402);\n  return s;\n}\nfunction draw2stack(){\n  const p = S.stackP, e = p * p * (3 - 2 * p); let s = \"\";\n  pieces2().forEach(([a, b], i) => {\n    const x = lerp(cellX(a) + (a > 0 ? 6 : 0), 400 - 62, e), y = lerp(ROLL.y, 104 + i * 70, e);\n    s += rollPiece(x, y, (b - a) * ROLL.cell - 12, ROLL.h, 360 + a) + fracS(x + 58, y + ROLL.h / 2 + 2, 1, 4, \"fm\", 380 + i);\n  });\n  if (p > .96) s += P(`M338 92V386M451 92V386`, \"kf\");   // 两道虚线：四段的两头都对得齐，一样长\n  return s;\n}\nfunction draw2weigh(){\n  const [a, b, c] = MODEL.opening;\n  return drawScale(S.wtilt, a, b, 331, 337) + rollPiece(SC.x + 150, SC.base - SC.ph - 2, c * SC.per, SC.ph, 344) + P(Sk.line(SC.x + 130, SC.base, SC.x + 200, SC.base, 420, .4), \"k1\");\n}\nfunction readout2(){\n  const k = S.knife, [L, R] = sides2(k), den = S.ph === \"cut1\" ? 2 : 4;\n  if (S.cuts.length === 3) readout(`4 份一样大 · 每份是它的 ${F(1, 4)}`);\n  else if (S.justCut) readout(`2 份一样大 · 每份是它的 ${F(1, 2)}`);\n  else if (Math.abs(k - target2()) <= MODEL.snap && S.press) readout(\"天平快平了 · 松手落刀\");\n  else readout(`${den === 2 ? \"两份\" : \"这两份\"}不一样大 · 还不能叫 ${F(1, den)}`);\n  sendState({ station: 2, knife: k, cuts: S.cuts.slice(), balanced: L === R });\n}\nfunction setKnife(c){ const [lo, hi] = range2(); c = clamp(Math.round(c), lo, hi); if (c === S.knife) return; S.knife = c; S.justCut = false; S.dirty = true; readout2(); }\nfunction tryCut(){   // 松手（或回车）：天平放平才落刀\n  if (S.mode !== \"act2\" || S.cutting) return;\n  const t = target2(), [L, R] = sides2(S.knife);\n  if (Math.abs(S.knife - t) <= MODEL.snap){ S.knife = t; S.cutting = true; S.cutT = 0; S.dirty = true; readout2(); return; }\n  S.fails++; readout2();\n  say((L < R ? \"右边沉，右边那份多了。刀往右挪一点。\" : \"左边沉，左边那份多了。刀往左挪一点。\") + (S.fails === 3 ? \"看天平：哪边低，刀就往哪边挪。\" : \"\"), \"hmm\");\n}\nfunction finishCut(){\n  S.cutting = false; S.cuts.push(S.knife); S.cuts.sort((a, b) => a - b); S.justCut = true; S.fails = 0; readout2();\n  if (S.ph === \"cut1\"){\n    S.mode = \"talk\"; hint(\"\");\n    say(`天平放平了，刀落下来了。2 份一样大，每份是这条蛋糕卷的 ${F(1, 2)}。`, \"good\");\n    next(\"接着切\", () => { S.ph = \"cut2\"; S.knife = S.knifeP = 12; S.justCut = false; S.mode = \"act2\"; actions([]); hint(\"拖动圆钮，天平放平了再松手\"); say(\"把左边这一半，也切成一样大的 2 份。\"); readout2(); svg.focus({ preventScroll: true }); S.dirty = true; });\n  } else if (S.ph === \"cut2\"){\n    S.ph = \"cut3\"; S.knife = S.knifeP = 62; S.justCut = false; say(\"切平了。右边这一半也来一刀。\"); readout2();\n  } else {\n    S.ph = \"done\"; S.mode = \"talk\"; hint(\"\"); readout2();\n    later(700, () => { scene(\"s2stack\"); S.stackP = 0; S.stackT = 1; say(`4 份 : "simulation", "targets": ["math.fraction.unit-fraction"], "title": "切分机"}, {"age_band": "G3-4", "body": {"items": [{"answer": {"choices": [{"feedback": "9 确实比 5 大。可 9 说的是切成 9 份，份数多，每一份反而小。", "id": "a", "misconception": "bigger-denominator-bigger", "text": "九分之一那块大"}, {"correct": true, "id": "b", "text": "五分之一那块大"}, {"feedback": "都拿了 1 份没错。可一个是 5 份里的 1 份，一个是 9 份里的 1 份。", "id": "c", "misconception": "numerator-only", "text": "一样大，都只拿了 1 份"}], "type": "choice"}, "feedback": {"correct": "对。同一张饼，切成 5 份的每一份，比切成 9 份的每一份大。", "wrong": "想想切分盘：从 5 拧到 9，取出来的那一份是变大还是变小？"}, "hints": ["想想切分盘从 5 拧到 9 时，取出来的那一份怎么变。", "同一张饼，切的份数越多，每一份会怎样？"], "id": "q1", "stem": "同一张饼，一种切法拿到它的五分之一，另一种拿到它的九分之一。哪一块大？"}, {"answer": {"choices": [{"feedback": "4 段里涂了 1 段，数得没错。可这 4 段有长有短，不是平均分。", "id": "a", "misconception": "unequal-parts", "text": "是，4 段里涂了 1 段"}, {"feedback": "你拿它和剩下的 3 段比了。分数比的是这一段和一整条。", "id": "b", "misconception": "part-to-part", "text": "不是，它是三分之一"}, {"correct": true, "id": "c", "text": "不是，4 段不一样大"}], "type": "choice"}, "feedback": {"correct": "对。每份一样大才叫平均分，平均分出来的一份才能叫四分之一。", "wrong": "把这 4 段放上天平想一想：它们一样重吗？"}, "figure": {"shaded": [1], "type": "rect-unequal", "widths": [3, 2, 4, 1]}, "hints": ["先看看这 4 段是不是一样长。", "想想天平：放不平的时候，刀落下来了吗？"], "id": "q2", "stem": "一条蛋糕卷切成了 4 段，涂色的是其中 1 段。涂色的这段是这条蛋糕卷的四分之一吗？"}, {"answer": {"accept_equivalent": false, "common_wrong": [{"denominator": 5, "feedback": "5 是没涂色的份数。下面的数要写一共平均分成了几份。", "misconception": "part-to-part", "numerator": 1}, {"denominator": 1, "feedback": "两个数都找对了，位置反了。下面写一共几份，上面写拿了几份。", "misconception": "swap-top-bottom", "numerator": 6}], "denominator": 6, "numerator": 1, "type": "fraction"}, "feedback": {"correct": "对。平均分成 6 份，拿了 1 份，就是这块糕的六分之一。", "wrong": "先数一共平均分成了几份，写在下面；再数涂了几份，写在上面。"}, "figure": {"direction": "h", "parts": 6, "shaded": 1, "type": "rect"}, "hints": ["先数一数，这块糕一共平均分成了几份。", "分母是一共几份，分子是涂了几份。"], "id": "q3", "stem": "一块长方形的糕平均分成了 6 份，涂色的是 1 份。涂色的是这块糕的几分之几？"}, {"answer": {"common_wrong": [{"feedback": "6 是剩下的块数。拼回一整张，手里这 1 g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n      <rect id=\"touch\" x=\"-400\" y=\"-400\" width=\"1600\" height=\"1410\" fill=\"transparent\"/><!-- 永不重画的触摸层（教训 25） -->\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* Curio · 数线跳跳 act.simulation.hop-line-01（几分之几：分数也能数）。设计说明：docs/constellations/zero-to-one/g1.md C.2 */\n\n/* ============ 1. 真相模型：页面上的每个数字都从这里算。只放数和纯函数，不碰页面 ============ */\nconst MODEL = {\n  firstDen: 4,                               // 第一趟每步 1/4（设计约定）\n  dens: [2, 3, 5, 6, 8, 10],                 // 第二趟可选的步长：1/2、1/3、1/5、1/6、1/8、1/10（设计约定）\n  lineMax: 2,                                // 跳和插旗用的数线画的是 0 到 2，只标 0、1、2（设计约定）\n  flags: [[1, 2], [1, 4], [3, 4]],           // 三面旗依次是 1/2、1/4、3/4（设计约定）\n  spots: [[\"甲\", 1, 2], [\"乙\", 2, 2], [\"丙\", 3, 2]],   // 提问时的三个候选点：甲在 1/2，乙在 1，丙在 1 又 1/2（设计约定）\n  hit: 0.04, near: 0.12,                     // 离真实位置不超过 0.04 算正中，不超过 0.12 算差一点，再远算差得远（手感约定）\n  flagStep: 0.02,                            // 键盘每按一次移 0.02（手感约定）\n  flagStart: 1.75,                           // 旗子出场的位置：离三面旗的答案和 0、1、2 都远，不暗示（设计约定）\n  gears: [2, 3, 4, 5, 6, 8, 10, 12, 20, 50, 100, 1000],   // 加密盘的档位（设计约定）\n  crowd: 50,                                 // 到 50 段以上，线上的刻度挤成一片，出现放大圈（画面约定）\n  mustReach: [100, 1000], minGears: 3,       // 至少在 3 个档位停过，并且到过 100 或 1000（设计约定）\n  settleMs: 600,                             // 转盘停住 0.6 秒算停过一档（手感约定）\n};\nconst pos = (k, n) => k / n;                                  // k 个 1/n 是 k/n，离 0 的距离是 k ÷ n（0 到 1 的距离当作 1）\nconst between = n => n - 1;                                   // 0 到 1 平均分成 n 段，中间多出 n − 1 个点：100→99，1000→999\nconst grade = (drop, target) => { const d = Math.abs(drop - target); return d <= MODEL.hit + 1e-9 ? \"hit\" : d <= MODEL.near + 1e-9 ? \"near\" : \"far\"; };\nconst r2 = v => Math.round(v * 100) / 100;\nconst fmt = n => String(Math.round(n));\n\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 共用零件：分数、「1」记号、圆钮、数线条  kit:parts ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 100 ? \"百\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;          // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 3;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1\", e; render(); }\n  requestAnimationFrame(tick);\n}\nHost.ready();      // 必须先于任何 state、event（教训 31）\nfitView();\nenter1();\nrequestAnimationFrame(tick);\n<\/script>\n<\/body>\n<\/html>\n", "id": "act.simulation.hop-line-01", "kind": "simulation", "targets": ["math.fraction.count-on-line"], "title": "数线跳跳"}, {"age_band": "G3-4", "body": {"items": [{"answer": {"common_wrong": [{"feedback": "你数的是 0 和 1 中间的刻度线。可火箭跳的是一段一段，不是一条一条。", "misconception": "count-ticks-not-steps", "value": 4}, {"feedback": "你把 0 和 1 那两条线也数进去了。火箭跳的是线和线中间的段。", "misconception": "count-ticks-not-steps", "value": 6}], "tolerance": 0, "type": "number", "unit": "步", "value": 5}, "feedback": {"correct": "对。5 个五分之一，正好跳到 1。", "wrong": "别数线，数段。0 到 1 平均分成了几段，就要跳几步。"}, "hints": ["想想第 1 站：每步四分之一的时候，跳了几步到 1？", "一步就是一段。0 到 1 平均分成了几段？"], "id": "q1", "stem": "小火箭每步跳五分之一。从 0 出发，正好跳到 1，要跳几步？"}, {"answer": {"accept_equivalent": true, "common_wrong": [{"denominator": 6, "feedback": "六分之一是跳 1 步停的地方。火箭跳了好几步，要把步数数进去。", "numerator": 1}, {"denominator": 4, "feedback": "两个数都找对了，位置反了。上面写跳了几步，下面写每步是几分之一。", "numerator": 6}], "denominator": 6, "numerator": 4, "type": "fraction"}, "feedback": {"correct": "对。4 个六分之一合起来，就是六分之四。", "wrong": "跳了几步，上面就写几。每步是几分之一，下面就写几。"}, "hints": ["想想第 1 站：每步四分之一，跳 3 步，停在哪个数？", "一步是六分之一。几个六分之一，就是六分之几？"], "id": "q2", "stem": "小火箭每步跳六分之一。从 0 出发，跳了 4 步。它停在哪个数？"}, {"answer": {"choices": [{"feedback": "你从 0 那条线数起，数到了第 3 条线。要数的是段：从 0 跳 3 段。", "id": "a", "misconception": "count-ticks-not-steps", "text": "乙"}, {"correct": true, "id": "b", "text": "甲"}, {"feedback": "丙是整条线的四分之三。可 1 在中间，四分之三要在 0 到 1 里找。", "id": "c", "misconception": "whole-line-as-one", "text": "丙"}], "type": "choice"}, "feedback": {"correct": "对。0 到 1 平均分成 4 段，从 0 跳 3 段，就停在甲。", "wrong": "先找到 1 在哪儿。四分之三在 0 和 1 中间。"}, "figure": {"from": 0, "marks": [{"at": 0, "label": "0"}, {"at": 1, "label": "1"}, {"at": 2, "label": "2"}, {"at": 0.75, "label": "甲"}, {"at": 0.5, "label": "乙"}, {"at": 1.5, "label": "丙"}], "step": 0.25, "to": 2, "type": "number-l
