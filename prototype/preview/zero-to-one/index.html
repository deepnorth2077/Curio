4 第 2 条）。HTML 里用 .frac，SVG 里用 fracS() */\n.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-family:var(--f-mono);font-size:.84em;margin:0 .2em;font-variant-numeric:tabular-nums}\n.frac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .28em .04em}\n.frac>span:last-child{padding:.04em .28em 0}\n.fl{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}\n.fs{fill:var(--ink);font-family:var(--f-mono);font-size:16px} .fm{fill:var(--ink);font-family:var(--f-mono);font-size:22px} .fb{fill:var(--ink);font-family:var(--f-mono);font-size:34px}\nbody.narrow .fs{font-size:20px} body.narrow .fm{font-size:26px} body.narrow .fb{font-size:38px}\n/* 模块自己的画面样式写在这里：字号全写在类上，窄屏在 body.narrow 里放大（教训 14、28）。下面几个类可以直接用 */\n.food{fill:var(--apricot)} .lead{fill:var(--accent)} .papr{fill:var(--paper)} .pane{fill:var(--pane)}\n.kacc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.one{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:7 6}\n.faint{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;opacity:.75}\n.lb{fill:var(--ink);font-family:var(--f-sans);font-size:17px}\n.lbg{fill:var(--muted);font-family:var(--f-sans);font-size:16px}\n.lbm{fill:var(--ink);font-family:var(--f-mono);font-size:17px}\n.big{fill:var(--ink);font-family:var(--f-mono);font-size:44px}\n.ttl{fill:var(--ink);font-family:var(--f-serif);font-size:26px}\n.sign{fill:var(--ink);font-family:var(--f-serif);font-size:24px}\n.tk{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round} .tkd{fill:none;stroke:var(--accent);stroke-width:1.1}\nbody.narrow .lb{font-size:21px} body.narrow .lbg{font-size:20px} body.narrow .lbm{font-size:20px}\nbody.narrow .big{font-size:50px} body.narrow .ttl{font-size:30px} body.narrow .sign{font-size:28px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\"><\/span><h1 id=\"title\"><\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 800 610\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <g id=\"dyn\"><\/g>\n      <g id=\"fx\"><circle id=\"cue\" cx=\"0\" cy=\"0\" r=\"10\" style=\"display:none\"/><\/g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n      <rect id=\"touch\" x=\"0\" y=\"0\" width=\"800\" height=\"440\" fill=\"transparent\"/><!-- 永不重画的触摸层（教训 25） -->\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 100 ? \"百\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;                // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 3;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1q\", hold: false, press: false, kbd: false, dirty: true, t1: 0, p1: 0, t2: 0, p2: 0 };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.innerHTML = (a.hold ? RIDGES : \"\") + `<span>${a.label}<\/span>`;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); if (v) touched(); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(ev, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(true); } });\n      b.addEventListener(\"keyup\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(false); } });\n      b.addEventListener(\"blur\", () => on(false));\n      b.addEventListener(\"contextmenu\", e => e.preventDefault());\n    } else {\n      b.addEventListener(\"click\", e => { if (performance.now() - born < 400 || (keyGuard && e.detail === 0)) return; a.go(e); });\n      if (guard){ b.disabled = true; const en = () => { setTimeout(() => { b.disabled = false; }, 120); removeEventListener(\"pointerup\", en, true); }; addEventListener(\"pointerup\", en, true); }\n    }\n    boxEl.append(b);\n  }\n  const first = boxEl.querySelector(\"button\");\n  if (first && !/^act/.test(S.mode)) first.focus({ preventScroll: true });\n  return boxEl;\n}\n// 猜测：只记下来，不在这里判对错的颜色。猜错的反馈先接住、再说清，然后一律去动手，让实物来回答\nfunction ask(question, options, onAnswer){\n  say(question);\n  actions(options.map((o, i) => ({ label: o.label, cls: \"choice\", go: () => {\n    if (!sentPred.has(S.station)){ sentPred.add(S.station); Host.event(\"predicted\", { station: S.station, choice: i, correct: !!o.correct, misconception: o.mis || null }); }\n    S.guess = S.guess || {}; S.guess[S.station] = o;\n    say(o.feedback, o.correct ? \"good\" : \"hmm\");\n    onAnswer(o);\n  }})));\n}\nfunction next(label, go, cls){ actions([{ label, go, cls }]); }\n// 星卡上选站重玩（#154）：replay 是正在重玩的站号，0 是从头往下走。重玩一站跳过开场和猜测题，直接进这一站的动手；\n// 揭晓完，原来「去第 k+1 站」「看我的星卡」的按钮换成「回星卡」（用 nextOr）。不出猜测题就不发 predicted；\n// observed 靠 observedOnce、complete 靠 completed，都只记第一次。每站怎么复位、怎么进动手是模块自己的事，写在 REPLAY[站号] 里\nlet replay = 0;\nconst REPLAY = {};\nfunction nextOr(label, go, cls){ if (replay) next(\"回星卡\", enterEnd); else next(label, go, cls); }\nfunction replayAt(k){ replay = k; gen++; S.station = k; hint(\"\"); readout(\"\"); disarmCue(); REPLAY[k](); }\nfunction restart(){ replay = 0; sentPred.clear(); sentObs.clear(); S.guess = {}; lastState = \"\"; enter1(); }   // 从头玩：和以前的「再玩一次」一样\nfunction endActions(){   // 星卡的按钮：从头玩 + 第 1 站…第 N 站。enterEnd() 最后调它\n  replay = 0;\n  actions([{ label: \"从头玩\", go: restart, cls: \"ghost tight\" }].concat(Array.from({ length: STATIONS }, (_, i) => ({ label: `第 ${i + 1} 站`, go: () => replayAt(i + 1), cls: \"tight\" }))));   // tight：手机上一行排得下\n}\n\n(function(){   // 「我有个问题」：随时可以问，发到信号站\n  const area = $(\"qarea\");\n  const open = document.createElement(\"button\");\n  open.type = \"button\"; open.className = \"btn ghost small\"; open.textContent = \"我有个问题\";\n  open.style.marginTop = \"12px\";\n  open.addEventListener(\"click\", () => {\n    if (area.querySelector(\"textarea\")) return;\n    const ta = document.createElement(\"textarea\"); ta.maxLength = 120; ta.placeholder = \"想问领航员什么？\";\n    const send = document.createElement(\"button\"); send.type = \"button\"; send.className = \"btn small\"; send.textContent = \"发给领航员\";\n    const bx = document.createElement(\"div\"); bx.className = \"qbox\"; bx.append(ta, send);\n    send.addEventListener(\"click\", () => { const q = ta.value.trim(); if (!q) return; Host.noteQuestion(q); bx.remove(); say(\"好问题，我记下来了。等会儿一起找答案。\"); });\n    area.append(bx); ta.focus();\n  });\n  area.append(open);\n})();\n\n// 第一屏的提醒（G6）：进入动手 1.5 秒还没碰，第一个圆钮外面扩出一圈细环；一碰就再也不出现\nlet cuePos = null, cueTimer = 0;\nfunction armCue(pos){ disarmCue(); const g = gen; cueTimer = setTimeout(() => { if (g === gen && /^act/.test(S.mode)){ cuePos = pos; placeCue(); } }, 1500); }\nfunction disarmCue(){ clearTimeout(cueTimer); cuePos = null; cueEl.style.display = \"none\"; }\nfunction touched(){ if (cuePos || cueTimer) disarmCue(); cueTimer = 0; }\nfunction placeCue(){ if (!cuePos) return; const [x, y, r] = cuePos(); cueEl.setAttribute(\"cx\", r1(x)); cueEl.setAttribute(\"cy\", r1(y)); cueEl.setAttribute(\"r\", r1((r || gripR()) + 2)); cueEl.style.display = \"\"; }   // 第三个数是被提醒的东西的半径（托里的一个）\n\n\nconst cardName = \"我的配方\",\n  cardMessage = \"你留下了自己的同味配方。看数线，三个味道计按浓淡排好了。\";\nconst mix = {},\n  jugNumbers = [2, 3, 6];\nlet savedRecipe = [4, 6];\n\nfunction drops(x, y, count, kind) {\n  const amount = Math.min(count, 18);\n  return Array.from({\n    length: amount\n  }, (_, i) => {\n    const px = x + (i % 9) * 10,\n      py = y + Math.floor(i / 9) * 10;\n    return kind === \"powder\" ? P(`M${px} ${py}l4 4`, \"k1\") + circle(px, py, 2.6, \"var(--accent)\") :\n      P(`M${px-3} ${py-2}l1 5h4l1-5z`, \"k1\");\n  }).join(\"\");\n}\n\nfunction pitcher(x, y, p, w, name, shown = true, size = 1, icons = true) {\n  const ratio = p + w ? p / (p + w) : 0;\n  // 颜色表示粉在全部勺杯数中的份额。放大常见配方附近的色差，让两壶容易对照。\n  const shade = .08 + .86 / (1 + Math.exp(-24 * (ratio - .415)));\n  const liquid = shown && (p + w) > 0 ? `<path d=\"M-40 3 Q0 -4 39 1L33 64Q0 72 -34 64Z\" fill=\"var(--accent)\" opacity=\"${shade}\"/>` : \"\";\n  return `<g transform=\"translate(${x},${y}) scale(${size})\">` +\n    P(\"M38 -33C85 -44 82 34 38 32\", \"k\") + liquid + P(\"M-55 -51L-41 -34L-35 65Q0 73 35 65L43 -51Z\") +\n    TC(0, -70, name, \"lb\") + TC(0, 101, `${p} : ${w}`, \"lbm\") +\n    (icons ? drops(-40, 123, p, \"powder\") + drops(-40, 150, w, \"water\") : \"\") + \"<\/g>\";\n}\n\nfunction meter(x, y, p, w) {\n  let pic = P(`M${x-42} ${y}a42 42 0 0 1 84 0`, \"k\");\n  if (w) {\n    // 比值在常见配方附近改变一点，指针也要明显可见。\n    const value = p / w;\n    const position = .5 + Math.atan((value - 2 / 3) * 5) / Math.PI;\n    const angle = Math.PI * (1 - position);\n    pic += P(`M${x} ${y}l${38*Math.cos(angle)} ${-38*Math.sin(angle)}`, \"kacc\");\n  }\n  return pic + circle(x, y, 4, \"var(--ink)\") + TC(x, y + 24, \"味道计\", \"lbg\");\n}\n\nfunction changeIngredient(which, step) {\n  mix[which] = clamp(mix[which] + step, 0, 18);\n  if (mix.powder === 3 && mix.water === 4) mix.made34 = true;\n  if (mix.made34 && mix.water && mix.powder !== 2 && mix.powder * 3 === mix.water * 2) {\n    mix.match = true;\n    savedRecipe = [mix.powder, mix.water];\n  }\n  paint();\n}\n\nfunction chooseJugs(i) {\n  mix.index = clamp(i, 0, 2);\n  mix.has.add(jugNumbers[mix.index]);\n  paint();\n}\n\nfunction batch(op) {\n  mix.op = op;\n  if (op === \"add\") mix.plus = clamp(mix.plus + 1, 0, 4);\n  else mix.times = clamp(mix.times + 1, 0, 3);\n  paint();\n}\n\nfunction leftMix() {\n  return [2 + 2 * mix.plus, 3 + 2 * mix.plus];\n}\n\nfunction rightMix() {\n  return [2 * 2 ** mix.times, 3 * 2 ** mix.times];\n}\n\nfunction saltBath() {\n  let pic = P(\"M154 272h202l-18 64q-74 26 -155 0z\") + P(\"M169 277q65 -20 171 0\", \"kacc\");\n  for (let i = 0; i < 14; i++) pic += rect(408 + (i % 7) * 35, 260 + Math.floor(i / 7) * 42, 30, 37, \"var(--paper)\", 5);\n  return pic + TC(256, 385, \"200 千克海水\", \"lb\") + TC(530, 385, \"14 袋盐 · 每袋 500 克\", \"lb\");\n}\nconst lessons = [{\n  name: \"调饮料台 · 调\",\n  question: \"领航员用 2 勺粉兑 3 杯水。你打算用 3 勺兑 4 杯。哪一壶浓？\",\n  options: [option(\"3 勺兑 4 杯的浓\"), option(\"一样，都是水比粉多 1\", {\n    mis: \"additive-comparison\"\n  }), option(\"3 勺兑 4 杯的淡，它水多\", {\n    mis: \"one-quantity-only\"\n  })],\n  hint: \"一勺一杯地调\",\n  task: \"先调出 3 勺粉、4 杯水。再调一壶和领航员一样味道的，勺数要不同。飞船上，粉占得越多，颜色画得越深。\",\n  fact: \"2 勺兑 3 杯，写作 2 : 3，读作 2 比 3。4 : 6、6 : 9 都是这个味道。3 : 4 的粉占得更多。\",\n  reset() {\n    Object.assign(mix, {\n      powder: 0,\n      water: 0,\n      made34: false,\n      match: false\n    });\n  },\n  buttons() {\n    return [\n      [\"加一勺\", \"powder\", 1],\n      [\"减一勺\", \"powder\", -1],\n      [\"加一杯\", \"water\", 1],\n      [\"减一杯\", \"water\", -1]\n    ].map(([l, k, s]) => button(l, () => changeIngredient(k, s)));\n  },\n  key(k) {\n    const d = {\n      ArrowLeft: [\"powder\", -1],\n      ArrowRight: [\"powder\", 1],\n      ArrowDown: [\"water\", -1],\n      ArrowUp: [\"water\", 1]\n    } [k];\n    if (!d) return false;\n    changeIngredient(...d);\n    return true;\n  },\n  draw() {\n    const shown = S.mode !== \"guess\";\n    return pitcher(265, 148, 2, 3, \"领航员\", shown) + pitcher(530, 148, mix.powder, mix.water, \"我的壶\", shown) +\n      (shown ? meter(265, 383, 2, 3) + meter(530, 383, mix.powder, mix.water) : TC(400, 345, \"配方牌　3 勺粉 : 4 杯水\", \"lb\"));\n  },\n  reading() {\n    if (!mix.water) return \"再加一杯水，看看味道计\";\n    const p = mix.powder,\n      w = mix.water,\n      [a, b] = reducedPair(p, w);\n    return `${p} 勺 : ${w} 杯 · 比值 ${a===0?0:F(a,b)} · ${p*3===w*2?\"一样浓\":p*3>w*2?\"比领航员的浓\":\"比领航员的淡\"} · ${mix.match?\"两壶调好了\":mix.made34?\"已调出 3 : 4，再试同味配方\":\"先试 3 : 4\"}`;\n  },\n  state() {\n    const p = mix.powder,\n      w = mix.water;\n    return {\n      powder: p,\n      water: w,\n      value: w ? reducedPair(p, w).join(\"/\") : \"\",\n      same_as_a: w > 0 && p * 3 === w * 2\n    };\n  },\n  done() {\n    return mix.made34 && mix.match;\n  }\n}, {\n  name: \"调饮料台 · 分\",\n  question: \"大桶里有 12 勺粉、18 杯水。它和 2 勺兑 3 杯的小壶一样浓吗？\",\n  options: [option(\"不一样，12 勺的浓得多\", {\n    mis: \"one-quantity-only\"\n  }), option(\"一样\"), option(\"不一样，一个差 6，一个差 1\", {\n    mis: \"additive-comparison\"\n  })],\n  hint: \"转动小壶数转盘\",\n  task: \"试着把大桶平均分进 2 只、3 只、6 只小壶。看看每只分到多少。\",\n  fact: \"把 12 : 18 的前项和后项都除以 6，得到 2 : 3，这叫化简比。前项除以后项得到比值，每只小壶的比值都相同。\",\n  reset() {\n    mix.index = 0;\n    mix.has = new Set();\n  },\n  buttons() {\n    return jugNumbers.map((n, i) => button(`${n} 只小壶`, () => chooseJugs(i)));\n  },\n  key(k) {\n    if (![\"ArrowLeft\", \"ArrowRight\"].includes(k)) return false;\n    chooseJugs(mix.index + (k === \"ArrowRight\" ? 1 : -1));\n    return true;\n  },\n  cue() {\n    return dialPoint(560, 107, mix.index, 3);\n  },\n  targets() {\n    return [{\n      x: 560,\n      y: 107,\n      r: 85,\n      start: p => chooseJugs(dialIndex(p, 560, 107, 3)),\n      move: p => chooseJugs(dialIndex(p, 560, 107, 3))\n    }];\n  },\n  draw() {\n    const n = jugNumbers[mix.index];\n    let result = pitcher(300, 100, 12, 18, \"大桶\", S.mode !== \"guess\", .8, false);\n    if (S.mode === \"guess\") return result + pitcher(520, 190, 2, 3, \"领航员\", false, .8, false);\n    result += drawDial(560, 107, jugNumbers.map(String), mix.index);\n    for (let i = 0; i < n; i++) {\n      const x = 400 + (i - (n - 1) / 2) * Math.min(130, 480 / (n - 1));\n      result += P(`M300 197v18H${x}v30`, \"kacc\") + pitcher(x, 294, 12 / n, 18 / n, \"\", true, .58);\n    }\n    return result;\n  },\n  reading() {\n    const n = jugNumbers[mix.index];\n    return `${n} 只小壶 · 每壶 ${12/n} 勺 : ${18/n} 杯 · 分过 ${mix.has.size} 种`;\n  },\n  state() {\n    const n = jugNumbers[mix.index];\n    return {\n      jugs: n,\n      each: [12 / n, 18 / n].join(\":\")\n    };\n  },\n  done() {\n    return mix.has.size === 3;\n  }\n}, {\n  name: \"调饮料台 · 加还是乘\",\n  question: \"从 2 勺粉、3 杯水开始，两样各加 2。味道会怎样？\",\n  options: [option(\"没变，两样加的一样多\", {\n    mis: \"add-same-keeps-ratio\"\n  }), option(\"变淡了，水也加了\", {\n    mis: \"one-quantity-only\"\n  }), option(\"变浓了\")],\n  hint: \"分别改变两壶\",\n  task: \"两壶原来都是 2 : 3。左边各加 2，右边各乘 2，看看指针。\",\n  fact: \"同样的配方按倍数做，味道不变。平均每 1000 克海水约含 35 克盐。假设浴缸里装了 200 千克海水，盐约有 7 千克，装半千克一袋就有 14 袋。\",\n  reset() {\n    Object.assign(mix, {\n      plus: 0,\n      times: 0,\n      op: \"add\",\n      side: 0\n    });\n  },\n  buttons() {\n    return [button(\"各加 2\", () => batch(\"add\")), button(\"各乘 2\", () => batch(\"mul\"))];\n  },\n  key(k) {\n    if (k === \"ArrowLeft\" || k === \"ArrowRight\") {\n      mix.side = +(k === \"ArrowRight\");\n      $(\"actions\").children[mix.side].focus();\n      return true;\n    }\n    if (k !== \"Enter\") return false;\n    batch(mix.side ? \"mul\" : \"add\");\n    return true;\n  },\n  draw() {\n    if (S.mode === \"reveal\") return pitcher(265, 100, ...leftMix(), \"各加 2\", true, .65, false) + pitcher(530, 100, ...rightMix(), \"各乘 2\", true, .65, false) + saltBath();\n    return pitcher(265, 150, ...leftMix(), \"各加 2\") + pitcher(530, 150, ...rightMix(), \"各乘 2\") + meter(265, 383, ...leftMix()) + meter(530, 383, ...rightMix());\n  },\n  reading() {\n    return `左壶 ${ratioText(leftMix())} · 右壶 ${ratioText(rightMix())}`;\n  },\n  state() {\n    const [powder, water] = mix.op === \"add\" ? leftMix() : rightMix();\n    return {\n      op: mix.op,\n      powder,\n      water,\n      same: powder * 3 === water * 2\n    };\n  },\n  done() {\n    return mix.plus > 0 && mix.times > 0;\n  }\n}];\n\nfunction drawCard() {\n  let pic = pitcher(220, 88, 2, 3, \"领航员\", true, .67, false) + pitcher(390, 88, ...savedRecipe, \"我的同味配方\", true, .67, false) +\n    pitcher(590, 88, 12, 18, \"大桶\", true, .67, false);\n  pic += P(\"M590 164v21H425\", \"kacc\");\n  for (let i = 0; i < 6; i++) pic += pitcher(433 + i * 36, 213, 2, 3, \"\", true, .29, false);\n  pic += TC(282, 206, \"各加 2 → 4 : 5\", \"lb\") + TC(282, 241, \"各乘 2 → 4 : 6\", \"lb\") +\n    TC(510, 273, \"12 : 18 化简是 2 : 3\", \"lb\");\n  const left = 155,\n    width = 480,\n    y = 368;\n  pic += P(`M${left} ${y}h${width}`, \"k\") + TC(left, y + 26, \"0\", \"lbm\") + TC(left + width, y + 26, \"1\", \"lbm\");\n  [\n    [2, 3, -34],\n    [3, 4, 0],\n    [4, 5, 35]\n  ].forEach(([a, b, offset]) => {\n    const x = left + width * a / b;\n    pic += circle(x, y, 5, \"var(--accent)\") + P(`M${x} ${y-5}l${offset} -23`, \"k1\") + fracS(x + offset, y - 49, a, b, \"fs\", a + b);\n  });\n  return pic + TC(400, 426, \"越往右，味道越浓\", \"lb\");\n}\n\n/* ============ 三站的开场、实物操作、揭晓和星卡 ============ */\nfunction option(label, reason = {}) {\n  return {\n    label,\n    ...reason,\n    correct: !reason.mis,\n    feedback: \"记下你的猜想了。动手看看会发生什么。\"\n  };\n}\n\nfunction button(label, go) {\n  return {\n    label,\n    go,\n    cls: \"ghost\"\n  };\n}\n\nfunction rect(x, y, w, h, fill, radius = 6) {\n  return `<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"${radius}\" fill=\"${fill}\" stroke=\"var(--ink)\" stroke-width=\"2\"/>`;\n}\n\nfunction circle(x, y, r, fill) {\n  return `<circle cx=\"${x}\" cy=\"${y}\" r=\"${r}\" fill=\"${fill}\"/>`;\n}\n\nfunction gcd(a, b) {\n  return b ? gcd(b, a % b) : a || 1;\n}\n\nfunction reducedPair(a, b) {\n  const d = gcd(a, b);\n  return [a / d, b / d];\n}\n\nfunction ratioText(parts) {\n  return parts.join(\" : \");\n}\nconst dialLimit = 1.95;\n\nfunction dialPoint(x, y, index, count) {\n  const angle = -dialLimit + 2 * dialLimit * index / (count - 1);\n  return [x + 46 * Math.sin(angle), y - 46 * Math.cos(angle)];\n}\n\nfunction drawDial(x, y, labels, index) {\n  let result = circle(x, y, 49, \"var(--paper)\") + P(Sk.ellipse(x, y, 49, 49, 11, .6));\n  labels.forEach((_, i) => {\n    const [dx, dy] = dialPoint(x, y, i, labels.length);\n    result += circle(dx, dy, 3, \"var(--ink)\");\n  });\n  const [kx, ky] = dialPoint(x, y, index, labels.length);\n  return result + TC(x, y + 16, labels[index], \"lbm\") + grip(kx, ky, [1, 0], {\n    arc: [x, y]\n  });\n}\n\nfunction dialIndex(point, x, y, count) {\n  const angle = clamp(Math.atan2(point.x - x, y - point.y), -dialLimit, dialLimit);\n  return Math.round((angle + dialLimit) * (count - 1) / (2 * dialLimit));\n}\n\nfunction enter1() {\n  enterStation(1);\n}\n\nfunction station() {\n  return lessons[S.station - 1];\n}\n\nfunction enterStation(n) {\n  gen++;\n  S.station = n;\n  S.mode = \"guess\";\n  S.scene = \"table\";\n  disarmCue();\n  station().reset();\n  head(n, station().name);\n  hint(\"\");\n  readout(\"\");\n  ask(station().question, station().options, () => next(\"动手试试\", begin));\n  paint();\n}\n\nfunction begin() {\n  gen++;\n  S.mode = \"act\";\n  head(S.station, station().name);\n  hint(station().hint);\n  say(station().task);\n  installControls();\n  paint();\n  const first = station().cue?.();\n  if (first) armCue(() => station().cue());\n  svg.focus({\n    preventScroll: true\n  });\n}\n\nfunction installControls() {\n  actions([...station().buttons(), {\n    label: \"看看发现\",\n    go: finish\n  }]);\n}\n\nfunction finish() {\n  if (!station().done()) return;\n  S.mode = \"reveal\";\n  disarmCue();\n  observedOnce(S.station);\n  hint(\"\");\n  say(station().fact, \"good\");\n  const n = S.station;\n  nextOr(n === 3 ? \"看我的星卡\" : `去第 ${n+1} 站`, n === 3 ? enterEnd : () => enterStation(n + 1));\n  paint();\n}\n\nfunction enterEnd() {\n  gen++;\n  S.mode = \"end\";\n  S.scene = \"end\";\n  S.station = 4;\n  head(0, cardName);\n  hint(\"\");\n  readout(\"\");\n  disarmCue();\n  say(cardMessage, \"good\");\n  if (!completed) {\n    completed = true;\n    Host.complete({});\n  }\n  endActions();\n  paint();\n}\n\nfunction paint() {\n  fitView();\n  if (S.mode === \"end\") {\n    gDyn.innerHTML = drawCard();\n    return;\n  }\n  gDyn.innerHTML = station().draw();\n  if (S.mode === \"act\") {\n    const gate = $(\"actions\").lastElementChild;\n    if (gate) gate.disabled = !station().done();\n    readout(station().reading());\n    sendState({\n      station: S.station,\n      ...station().state()\n    });\n    placeCue();\n  }\n}\n\nfunction hitTarget(p) {\n  return station().targets?.().find(t => Math.hypot(p.x - t.x, p.y - t.y) <= (t.r || hitR()));\n}\n\nfunction svgPoint(e) {\n  const p = svg.createSVGPoint();\n  p.x = e.clientX;\n  p.y = e.clientY;\n  return p.matrixTransform(svg.getScreenCTM().inverse());\n}\nlet activeTarget = null,\n  activePointer = null;\nsvg.addEventListener(\"touchstart\", e => {\n  if (S.mode === \"act\" && hitTarget(svgPoint(e.changedTouches[0]))) e.preventDefault();\n}, {\n  passive: false\n});\nsvg.addEventListener(\"pointerdown\", e => {\n  if (S.mode !== \"act\" || activePointer !== null) return;\n  activeTarget = hitTarget(svgPoint(e));\n  if (!activeTarget) return;\n  e.preventDefault();\n  activePointer = e.pointerId;\n  svg.setPointerCapture(e.pointerId);\n  touched();\n  activeTarget.start?.(svgPoint(e));\n  paint();\n});\nsvg.addEventListener(\"pointermove\", e => {\n  if (activePointer !== e.pointerId || S.mode !== \"act\") return;\n  activeTarget.move?.(svgPoint(e));\n  paint();\n});\n\nfunction stopPointer(e) {\n  if (activePointer !== e.pointerId) return;\n  const t = activeTarget;\n  activeTarget = null;\n  activePointer = null;\n  if (e.type === \"pointerup\") t.end?.(svgPoint(e));\n  else t.cancel?.();\n  paint();\n}\nfor (const name of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) svg.addEventListener(name, stopPointer);\nsvg.addEventListener(\"keydown\", e => {\n  if (S.mode !== \"act\") return;\n  if (e.key === \"Escape\") {\n    $(\"actions\").firstElementChild?.focus();\n    return;\n  }\n  // 达标后 Tab 继续走到屏上的按钮；Shift+Tab 始终可以离开实物。\n  if (e.key === \"Tab\" && (e.shiftKey || station().done())) return;\n  if (!station().key?.(e.key, e.shiftKey)) return;\n  e.preventDefault();\n  touched();\n  paint();\n});\nfor (let n = 1; n <= 3; n++) REPLAY[n] = () => {\n  station().reset();\n  begin();\n};\naddEventListener(\"resize\", paint);\n\nfunction fitView() {\n  const narrow = svg.clientWidth < 600;\n  document.body.classList.toggle(\"narrow\", narrow);\n  svg.setAttribute(\"viewBox\", narrow ? \"100 0 600 440\" : \"0 0 800 440\");\n}\nHost.ready();\nenter1();\n<\/script>\n<\/body>\n<\/html>\n", "id": "act.simulation.mix-drink-01", "kind": "simulation", "targets": ["math.ratio.meaning"], "title": "调饮料台"}, {"age_band": "G5-6", "body": {"items": [{"answer": {"choices": [{"feedback": "第二壶粉多了，水也多了。试着 24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 共用零件：分数、「1」记号、圆钮、数线条  kit:parts ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 100 ? \"百\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;                // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 3;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1q\", hold: false, press: false, kbd: false, dirty: true, t1: 0, p1: 0, t2: 0, p2: 0 };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.innerHTML = (a.hold ? RIDGES : \"\") + `<span>${a.label}<\/span>`;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); if (v) touched(); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(ev, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === ndy = {},\n  mixes = [\n    [1, 1],\n    [1, 2],\n    [1, 3],\n    [1, 5],\n    [5, 7],\n    [1, 2, 3]\n  ];\nconst labels = [\"领航员占全部的\", \"舰长占全部的\", \"领航员的是舰长的\", \"舰长的是领航员的\"];\nconst fractions = [\n  [2, 5],\n  [3, 5],\n  [2, 3],\n  [3, 2]\n];\nlet lastShares = [2, 4, 6],\n  lastRatio = [1, 2, 3];\n\nfunction sum(parts) {\n  return parts.reduce((a, b) => a + b, 0);\n}\n\nfunction loadCandy(total) {\n  candy.total = total;\n  candy.rounds = 0;\n  candy.lastDrop = -1000;\n  paint();\n}\n\nfunction partsNow() {\n  return S.station === 1 ? [2, 3] : mixes[candy.index];\n}\n\nfunction distribute() {\n  const parts = partsNow(),\n    batch = sum(parts);\n  if (candy.rounds * batch >= candy.total) return;\n  candy.rounds++;\n  candy.lastDrop = performance.now();\n  if (candy.rounds * batch === candy.total) {\n    candy.tried.add(S.station === 1 ? candy.total : candy.index);\n    if (S.station === 3) {\n      lastRatio = parts;\n      lastShares = parts.map(p => p * candy.rounds);\n    }\n  }\n  paint();\n}\n\nfunction selectRatio(index) {\n  const nextIndex = clamp(index, 0, mixes.length - 1);\n  if (nextIndex === candy.index) return;\n  candy.index = nextIndex;\n  loadCandy(12);\n}\n\nfunction candyPiece(x, y) {\n  return `<g transform=\"translate(${x},${y})\">` +\n    P(\"M-6 -2l-5 -3v9l5-3m11-4 5-2v9l-6-4\", \"k1\") + rect(-6, -5, 12, 10, \"var(--accent)\", 3) + \"<\/g>\";\n}\n\nfunction slideCandy(x, y, ex, ey) {\n  if (reduced || performance.now() - candy.lastDrop > 320) return \"\";\n  return `<g><animateTransform attributeName=\"transform\" type=\"translate\" from=\"${x} ${y}\" to=\"${ex} ${ey}\" dur=\".32s\" fill=\"freeze\"/>${candyPiece(0,0)}<\/g>`;\n}\n\nfunction chute(parts, total, rounds, showControls) {\n  const n = sum(parts),\n    width = 222,\n    left = 400 - width / 2,\n    top = 130;\n  let pic = P(\"M268 52Q400 40 532 52L511 129H289Z\") + P(\"M271 52Q403 70 529 52\", \"k1\") + TC(400, 92, `还有 ${total-n*rounds} 块`, \"lb\");\n  if (S.mode === \"guess\" tton(\"上一个比\", () => selectRatio(candy.index - 1)), button(\"下一个比\", () => selectRatio(candy.index + 1)), button(\"放一轮\", distribute)];\n  },\n  key(k) {\n    if (k === \" \") distribute();\n    else if (k === \"ArrowRight\" || k === \"ArrowLeft\") selectRatio(candy.index + (k === \"ArrowRight\" ? 1 : -1));\n    else return false;\n    return true;\n  },\n  cue() {\n    return dialPoint(180, 90, candy.index, mixes.length);\n  },\n  targets() {\n    return [{\n      x: 535,\n      y: 64,\n      start: distribute\n    }, {\n      x: 400,\n      y: 91,\n      r: 69,\n      start: distribute\n    }, {\n      x: 180,\n      y: 90,\n      r: 70,\n      start: p => selectRatio(dialIndex(p, 180, 90, 6)),\n      move: p => selectRatio(dialIndex(p, 180, 90, 6))\n    }];\n  },\n  draw() {\n    if (S.mode === \"reveal\") return airChutes();\n    if (S.mode === \"guess\") return chute(mixes[5], 12, 0, false);\n    return chute(partsNow(), 12, candy.rounds, true) + drawDial(180, 90, mixes.map(a => a.join(\":\")), candy.index);\n  },\n  reading() {\n    return `${ratioText(partsNow())} · ${partsNow().map(p=>p*candy.rounds).join(\"、\")} 块 · 已分完 ${candy.tried.size} 种`;\n  },\n  state() {\n    return {\n      ratio: partsNow().join(\":\"),\n      shares: partsNow().map(p => p * candy.rounds)\n    };\n  },\n  done() {\n    return candy.tried.has(5) && candy.tried.size >= 3;\n  }\n}];\n\nfunction drawCard() {\n  let pic = TC(400, 37, \"第一漏斗 · 10 块按 2 : 3 分\", \"ttl\");\n  [4, 6].forEach((count, i) => {\n    const x = 216 + i * 208;\n    pic += rect(x, 61, 154, 67, \"var(--paper)\");\n    for (let j = 0; j < count; j++) pic += candyPiece(x + 27 + (j % 3) * 25, 80 + Math.floor(j / 3) * 22);\n    pic += T(x + 105, 102, `${count} 块`, \"lb\");\n  });\n  labels.forEach((label, i) => {\n    const x = i % 2 ? 415 : 135,\n      y = 167 + Math.floor(i / 2) * 48;\n    pic += T(x, y + 6, label, \"lb\") + fracS(x + 224, y, ...fractions[i], \"fs\", i + 30);\n  });\n  pic += TC(400, 282, `最后一漏斗 · 按 ${ratioText(lastRatio)} 分得 ${lastShares.join(\"、\")} 块`, \"lb\");\n  return pic + lineStrip(158, 371, 484, [\n    [2, 5],\n    [3, 5],\n    [2, 3]\n  ], 42) + TC(400, 428, \"同一堆糖，三颗钉子\", \"lb\");\n}\n\n/* ============ 三站的开场、实物操作、揭晓和星卡 ============ */\nfunction option(label, reason = {}) {\n  return {\n    label,\n    ...reason,\n    correct: !reason.mis,\n    feedback: \"记下你的猜想了。动手看看会发生什么。\"\n  };\n}\n\nfunction button(label, go) {\n  return {\n    label,\n    go,\n    cls: \"ghost\"\n  };\n}\n\nfunction rect(x, y, w, h, fill, radius = 6) {\n  return `<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"${radius}\" fill=\"${fill}\" stroke=\"var(--ink)\" stroke-width=\"2\"/>`;\n}\n\nfunction circle(x, y, r, fill) {\n  return `<circle cx=\"${x}\" cy=\"${y}\" r=\"${r}\" fill=\"${fill}\"/>`;\n}\n\nfunction gcd(a, b) {\n  return b ? gcd(b, a % b) : a || 1;\n}\n\nfunction reducedPair(a, b) {\n  const d = gcd(a, b);\n  return [a / d, b / d];\n}\n\nfunction ratioText(parts) {\n  return parts.join(\" : \");\n}\nconst dialLimit = 1.95;\n\nfunction dialPoint(x, y, index, count) {\n  const angle = -dialLimit + 2 * dialLimit * index / (count - 1);\n  return [x + 46 * Math.sin(angle), y - 46 * Math.cos(angle)];\n}\n\nfunction drawDial(x, y, labels, index) {\n  let result = circle(x, y, 49, \"var(--paper)\") + P(Sk.ellipse(x, y, 49, 49, 11, .6));\n  labels.forEach((_, i) => {\n    const [dx, dy] = dialPoint(x, y, i, labels.length);\n    result += circle(dx, dy, 3, \"var(--ink)\");\n  });\n  const [kx, ky] = dialPoint(x, y, index, labels.length);\n  return result + TC(x, y + 16, labels[index], \"lbm\") + grip(kx, ky, [1, 0], {\n    arc: [x, y]\n  });\n}\n\nfunction dialIndex(point, x, y, count) {\n  const angle = clamp(Math.atan2(point.x - x, y - point.y), -dialLimit, dialLimit);\n  return Math.round((angle + dialLimit) * (count - 1) / (2 * dialLimit));\n}\n\nfunction enter1() {\n  enterStation(1);\n}\n\nfunction station() {\n  return lessons[S.station - 1];\n}\n\nfunction enterStation(n) {\n  gen++;\n  S.station = n;\n  S.mode = \"guess\";\n  S.scene = \"table\";\n  disarmCue();\n  station().reset();\n  head(n, station().name);\n  hint(\"\");\n  readout(\"\");\n  ask(station().question, station().options, () => next(\"动手试试\", begin));\n  paint();\n}\n\nfunction begin() {\n  gen++;\n  S.mode = \"act\";\n  head(S.station, station().name);\n  hint(station().hint);\n  say(station().task);\n  installControls();\n  paint();\n  const first = station().cue?.();\n  if (first) armCue(() => station().cue());\n  svg.focus({\n    preventScroll: true\n  });\n}\n\nfunction installControls() {\n  actions([...station().buttons(), {\n    label: \"看看发现\",\n    go: finish\n  }]);\n}\n\nfunction finish() {\n  if (!station().done()) return;\n  S.mode = \"reveal\";\n  disarmCue();\n  observedOnce(S.station);\n  hint(\"\");\n  say(station().fact, \"good\");\n  const n = S.station;\n  nextOr(n === 3 ? \"看我的星卡\" : `去第 ${n+1} 站`, n === 3 ? enterEnd : () => enterStation(n + 1));\n  paint();\n}\n\nfunction enterEnd() {\n  gen++;\n  S.mode = \"end\";\n  S.scene = \"end\";\n  S.station = 4;\n  head(0, cardName);\n  hint(\"\");\n  readout(\"\");\n  disarmCue();\n  say(cardMessage, \"good\");\n  if (!completed) {\n    completed = true;\n    Host.complete({});\n  }\n  endActions();\n  paint();\n}\n\nfunction paint() {\n  fitView();\n  if (S.mode === \"end\") {\n    gDyn.innerHTML = drawCard();\n    return;\n  }\n  gDyn.innerHTML = station().draw();\n  if (S.mode === \"act\") {\n    const gate = $(\"actions\").lastElementChild;\n    if (gate) gate.disabled = !station().done();\n    readout(station().reading());\n    sendState({\n      station: S.station,\n      ...station().state()\n    });\n    placeCue();\n  }\n}\n\nfunction hitTarget(p) {\n  return station().targets?.().find(t => Math.hypot(p.x - t.x, p.y - t.y) <= (t.r || hitR()));\n}\n\nfunction svgPoint(e) {\n  const p = svg.createSVGPoint();\n  p.x = e.clientX;\n  p.y = e.clientY;\n  return p.matrixTransform(svg.getScreenCTM().inverse());\n}\nlet activeTarget = null,\n  activePointer = null;\nsvg.addEventListener(\"touchstart\", e => {\n  if (S.mode === \"act\" && hitTarget(svgPoint(e.changedTouches[0]))) e.preventDefault();\n}, {\n  passive: false\n});\nsvg.addEventListener(\"pointerdown\", e => {\n  if (S.mode !== \"act\" || activePointer !== null) return;\n  activeTarget = hitTarget(svgPoint(e));\n  if (!activeTarget) return;\n  e.preventDefault();\n  activePointer = e.pointerId;\n  svg.setPointerCapture(e.pointerId);\n  touched();\n  activeTarget.start?.(svgPoint(e));\n  paint();\n});\nsvg.addEventListener(\"pointermove\", e => {\n  if (activePointer !== e.pointerId || S.mode !== \"act\") return;\n  activeTarget.move?.(svgPoint(e));\n  paint();\n});\n\nfunction stopPointer(e) {\n  if (activePointer !== e.pointerId) return;\n  const t = activeTarget;\n  activeTarget = null;\n  activePointer = null;\n  if (e.type === \"pointerup\") t.end?.(svgPoint(e));\n  else t.cancel?.();\n  paint();\n}\nfor (const name of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) svg.addEventListener(name, stopPointer);\nsvg.addEventListener(\"keydown\", e => {\n  if (S.mode !== \"act\") return;\n  if (e.key === \"Escape\") {\n    $(\"actions\").firstElementChild?.focus();\n    return;\n  }\n  // 达标后 Tab 继续走到屏上的按钮；Shift+Tab 始终可以离开实物。\n  if (e.key === \"Tab\" && (e.shiftKey || station().done())) return;\n  if (!station().key?.(e.key, e.shiftKey)) return;\n  e.preventDefault();\n  touched();\n  paint();\n});\nfor (let n = 1; n <= 3; n++) REPLAY[n] = () => {\n  station().reset();\n  begin();\n};\naddEventListener(\"resize\", paint);\n\nfunction fitView() {\n  const narrow = svg.clientWidth < 600;\n  document.body.classList.toggle(\"narrow\", narrow);\n  svg.setAttribute(\"viewBox\", narrow ? \"100 0 600 440\" : \"0 0 800 440\");\n}\nHost.ready();\nenter1();\n<\/script>\n<\/body>\n<\/html>\n", "id": "act.simulation.ratio-chute-01", "kind": "simulation", "targets": ["math.ratio.sharing"], "title": "分配槽"}, {"age_band": "G5-6", "body": {"items": [{"answer": {"common_wrong": [{"feedback": "2 数的是份数。先求每份有几块。", "misconception": "ratio-as-count", "value": 2}], "tolerance": 0, "type": "number", "unit": "块", "value": 8}, "feedback": {"correct": "20 块分成 5 份，每份 4 块。少的那人拿两份，一共 8 块。", "wrong": "数一数一共有几份。"}, "hints": ["数一数一共有几份。", "20 块平均分成这些份，每份再乘 2。"], "id": "q1", "stem": "20 块糖按 2 : 3 分，拿得少的人有几块？"}, {"answer": {"accept_equivalent": true, "common_wrong": [{"denominator": 5, "feedback": "五分之四用女生当 1。题目问的是占全班多少。", "misconception": "part-part-as-part-whole", "numerator": 4}], "denominator": 9, "numerator": 4, "type": "fraction"}, "feedback": {"correct": "全班是 4 + 5 = 9 份。男生有其中 4 份，占九分之四。", "wrong": "这一题拿谁当 1？"}, "hints": ["这一题拿谁当 1？", "全班有男生也有女生。把两边的份数加起来。"], "id": "q2", "stem": "男生和女生人数的比是 4 : 5。男生占全班的几分之几？"}, {"answer": {"accept_equivalent": true, "common_wrong": [{"denominator": 9, "feedback": "九分之四是男生占全班的分数。这次只跟女生比。", "numerator": 4}], "denominator": 5, "numerator": 4, "type": "fraction"}, "feedback": {"correct": "女生的 5 份当 1，男生有同样大小的 4 份，所以是五分之四。", "wrong": "先圈出这次拿来当 1 的人。"}, "hints": ["先圈出这次拿来当 1 的人。", "女生有几份？男生有几份？"], "id": "q3", "stem": "男生和女生人数的比是 4 : 5。男生人数是女生人数的几分之几？"}, {"answer": {"common_wrong": [{"feedback": "每人 10 颗是平均分。看看最多的那个人要拿几份。", "misconception": "equal-share-ignores-ratio", "value": 10}, {"feedback": "3 是份数，还要看看每份有几颗糖。", "misconception": "ratio-as-count", "value": 3}], "tolerance": 0, "type": "number", "unit": "颗", "value": 15}, "feedback": {"correct": "一共 6 份，每份 5 颗。最多的人拿 3 份，共 15 颗。", "wrong": "把三个人的份数加起来。"}, "hints": ["把三个人的份数加起来。", "先算每份有几颗，再算三份。"], "id": "q4", "stem": "30 颗糖按 1 : 2 : 3 分给三个人。拿得最多的人拿几颗？"}, {"answer": {"common_wrong": [{"feedback": "4 块是差，把两人的份数也相减看看。", "value": 4}, {"feedback": "先用相差的块数找出每份的大小。", "value": 10}], "tolerance": 0, "type": "number", "unit": "块", "value": 20}, "feedback": {"correct": "两人差 1 份，正好是 4 块。两人合起来 5 份，一共 20 块。", "wrong": "多拿的是几份？"}, "hints": ["多拿的是几份？", "一共几份？每份有几块？"], "id": "q5", "stem": "两人按 3 : 2 分糖。多的那个人比少的多拿 4 块。一共有多少块糖？"}], "shuffle": false}, "duration_min": 5, "id": "act.quiz.ratio-sharing-01", "kind": "quiz", "targets": ["math.ratio.sharing"], "title": "分配槽大挑战"}], "dq": "两个人按 2 : 3 分糖，第一个人拿走的是 2/3 吗？", "id": "math.ratio.sharing", "misconceptions": {"equal-share-ignores-ratio": "不管比，直接平均分，例如 12 块按 1 : 2 : 3 分，认为每人 4 块。", "part-part-as-part-whole": "把比的两个数直接写成占全部的分数，例如认为 2 : 3 里第一个人占全部的 2/3。", "ratio-as-count": "把比里的数直接当成个数，例如 10 块糖按 2 : 3 分，认为一个人拿 2 块。"}, "title": "按比分配"}, {"activities": [{"age_band": "G5-6", "duration_min": 8, "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>拉伸相框<\/title>\n<style>\n/* kit:base —— 颜色、卡片、气泡、按钮。色值不要改；模块自己的样式写在最后一段 */\n/* 长按不选字、不弹菜单（#156）。输入框照常能选能改 */\nhtml{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\ninput,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}\n:root{\n  --bg:#F5F4EE; --pane:#FBFAF6; --rule:#E0DCD0; --hover:#E7E4D9;\n  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;\n  --accent:#C2603F; --accent-soft:#F3E0D6;\n  --grip:#2A7F7C; --grip-soft:#D3E8E5;\n  --sage:#CCD6C0; --sage-bg:#DCE3D2; --sky:#CFDCE6; --apricot:#ECCDB6; --paper:#EFE4D6;\n  --dad:#4F7FA8; --mom:#C2603F; --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;\n  --f-serif:\"Noto Serif SC\",\"Source Han Serif SC\",\"Songti SC\",Georgia,serif;\n  --f-sans:\"Noto Sans SC\",\"PingFang SC\",\"Microsoft YaHei\",system-ui,sans-serif;\n  --f-mono:ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n  color-scheme:light;\n}\n@media (prefers-color-scheme:dark){:root{\n  --bg:#1E1E1E; --pane:#252525; --rule:#353535; --hover:#2E2E2E;\n  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;\n  --accent:#E0876A; --accent-soft:#3A2A24;\n  --grip:#5FC4BE; --grip-soft:#1F3634;\n  --sage:#3C4836; --sage-bg:#28301F; --sky:#2D3B47; --apricot:#5A4536; --paper:#33302A;\n  --dad:#7FA9CF; --mom:#E0876A; --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;\n  color-scheme:dark;\n}}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}\nbutton{font:inherit;color:inherit;cursor:pointer}\n.wrap{max-width:820px;margin:0 auto;padding:12px 14px 28px}\n.card{background:var(--pane);border:1px solid var(--rule);border-radius:18px;overflow:hidden}\n.card header,.card footer{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 16px}\n.card header{border-bottom:1px solid var(--rule)}\n.card footer{border-top:1px solid var(--rule);min-height:52px;align-items:center}\n.station{font-size:13px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}\nh1{font-family:var(--f-serif);font-size:20px;font-weight:600;color:var(--ink);margin:0;text-align:right}\n.hint{font-size:14px;color:var(--muted)}\n.readout{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px;text-align:right}\n.readout b{color:var(--accent);font-weight:600}\nsvg#stage{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}\nsvg#stage:focus,svg#stage:focus-visible{outline:none}\nsvg#stage.kbd:focus-visible{outline:2px solid var(--grip);outline-offset:-4px}\n.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}\n.kf{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:3 6}\n.t{fill:var(--ink);font-family:var(--f-sans);font-size:15px}\n.tm{fill:var(--muted);font-family:var(--f-sans);font-size:15px}\n.talk{display:flex;gap:10px;align-items:flex-start;margin:14px 2px 6px}\n.ava{flex:none;width:42px;height:42px}\n.bubble{background:var(--pane);border:1px solid var(--rule);border-radius:16px 16px 16px 4px;padding:10px 14px;color:var(--ink);min-height:44px;flex:1}\n.bubble.good{background:var(--good-soft);border-color:transparent}\n.bubble.bad{background:var(--bad-soft);border-color:transparent}\n.bubble.hmm{background:var(--paper);border-color:transparent}\n.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin:10px 0 0}\n.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 18px;min-height:48px;font-size:17px;font-weight:600;touch-action:manipulation}\n.btn.ghost{background:var(--pane);color:var(--ink)}\n.btn.choice{background:var(--bg);color:var(--ink);font-weight:500;text-align:left;flex:1 1 220px}\n.btn.choice:hover{background:var(--hover)}\n.btn:disabled{opacity:.4;cursor:default}\n.btn.small{min-height:40px;font-size:15px;padding:6px 14px;font-weight:500} .btn.tight{padding:9px 12px}\n.qbox{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}\n.qbox textarea{flex:1 1 260px;font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);min-height:64px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n@media (max-width:520px){ body{font-size:16px} h1{font-size:17px} .card header,.card footer{padding:8px 12px} .card footer{flex-wrap:wrap;row-gap:2px} .hint{white-space:nowrap} .readout{font-size:14px;flex:1 1 auto} }\n/* kit:grip 2026-11-14 —— 圆钮（「可抓」记号，g1.md A.4 G1～G8）。--grip 只给圆钮、托、按住按钮、焦点框用；--accent 不给任何控件用 */\n.btn.hold{touch-action:none;background:var(--grip);border-color:var(--grip);color:var(--bg);display:inline-flex;align-items:center;gap:10px;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}\n.btn.hold.on{filter:brightness(.82)}\n.btn.hold svg{width:18px;height:18px;flex:none}\n.btn.hold svg path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}\n.gfill{fill:var(--grip)} .gsoft{fill:var(--grip-soft)}\n.gring{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}\n.gring.on{stroke-width:3.2}\n.gridge{fill:none;stroke:var(--bg);stroke-width:2.2;stroke-linecap:round}\n.garrow{fill:none;stroke:var(--grip);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.gkbd{fill:none;stroke:var(--ink);stroke-width:1.6}\n#cue{fill:none;stroke:var(--grip);stroke-width:2.4;transform-box:fill-box;transform-origin:center;animation:cue 2.4s ease-out infinite}\n@keyframes cue{0%{transform:scale(1);opacity:.95}50%{transform:scale(1.8);opacity:0}100%{transform:scale(1.8);opacity:0}}\n@media (prefers-reduced-motion:reduce){#cue{animation:none;transform:scale(1.3);opacity:.9}}\n/* kit:frac 2026-11-14 —— 分数一律上下结构（A.4 第 2 条）。HTML 里用 .frac，SVG 里用 fracS() */\n.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-family:var(--f-mono);font-size:.84em;margin:0 .2em;font-variant-numeric:tabular-nums}\n.frac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .28em .04em}\n.frac>span:last-child{padding:.04em .28em 0}\n.fl{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}\n.fs{fill:var(--ink);font-family:var(--f-mono);font-size:16px} .fm{fill:var(--ink);font-family:var(--f-mono);font-size:22px} .fb{fill:var(--ink);font-family:var(--f-mono);font-size:34px}\nbody.narrow .fs{font-size:20px} body.narrow .fm{font-size:26px} body.narrow .fb{font-size:38px}\n/* 模块自己的画面样式写在这里：字号全写在类上，窄屏在 body.narrow 里放大（教训 14、28）。下面几个类可以直接用 */\n.food{fill:var(--apricot)} .lead{fill:var(--accent)} .papr{fill:var(--paper)} .pane{fill:var(--pane)}\n.kacc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.one{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:7 6}\n.faint{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;opacity:.75}\n.lb{fill:var(--ink);font-family:var(--f-sans);font-size:17px}\n.lbg{fill:var(--muted);font-family:var(--f-sans);font-size:16px}\n.lbm{fill:var(--ink);font-family:var(--f-mono);font-size:17px}\n.big{fill:var(--ink);font-family:var(--f-mono);font-size:44px}\n.ttl{fill:var(--ink);font-family:var(--f-serif);font-size:26px}\n.sign{fill:var(--ink);font-family:var(--f-serif);font-size:24px}\n.tk{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round} .tkd{fill:none;stroke:var(--accent);stroke-width:1.1}\nbody.narrow .lb{font-size:21px} body.narrow .lbg{font-size:20px} body.narrow .lbm{font-size:20px}\nbody.narrow .big{font-size:50px} body.narrow .ttl{font-size:30px} body.narrow .sign{font-size:28px}\n/* ============ 地月模型的尺带 ============ */\n@media (prefers-reduced-motion:no-preference) {\n  .unroll { animation:expand-tape .45s ease-out both; transform-origin:150px 0; }\n  @keyframes expand-tape { from {transform:scaleX(0)} to {transform:scaleX(1)} }\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\"><\/span><h1 id=\"title\"><\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 800 610\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <g id=\"dyn\"><\/g>\n      <g id=\"fx\"><circle id=\"cue\" cx=\"0\" cy=\"0\" r=\"10\" style=\"display:none\"/><\/g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n      <rect id=\"touch\" x=\"0\" y=\"0\" width=\"800\" height=\"440\" fill=\"transparent\"/><!-- 永不重画的触摸层（教训 25） -->\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px "星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.innerHTML = (a.hold ? RIDGES : \"\") + `<span>${a.label}<\/span>`;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); if (v) touched(); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(ev, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(true); } });\n      b.addEventListener(\"keyup\", e => { if (e.key === ner(name, stopPointer);\nsvg.addEventListener(\"keydown\", e => {\n  if (S.mode !== \"act\") return;\n  if (e.key === \"Escape\") {\n    $(\"actions\").firstElementChild?.focus();\n    return;\n  }\n  // 达标后 Tab 继续走到屏上的按钮；Shift+Tab 始终可以离开实物。\n  if (e.key === \"Tab\" && (e.shiftKey || station().done())) return;\n  if (!station().key?.(e.key, e.shiftKey)) return;\n  e.preventDefault();\n  touched();\n  paint();\n});\nfor (let n = 1; n <= 3; n++) REPLAY[n] = () => {\n  station().reset();\n  begin();\n};\naddEventListener(\"resize\", paint);\n\nfunction fitView() {\n  const narrow = svg.clientWidth < 600;\n  document.body.classList.toggle(\"narrow\", narrow);\n  svg.setAttribute(\"viewBox\", narrow ? \"100 0 600 440\" : \"0 0 800 440\");\n}\nHost.ready();\nenter1();\n<\/script>\n<\/body>\n<\/html>\n", "id": "act.simulation.stretch-frame-01", "kind": "simulation", "targets": ["math.ratio.proportion"], "title": "拉伸相框"}, {"age_band": "G5-6", "body": {"items": [{"answer": {"choices": [{"feedback": "宽高都加了 2 厘米，宽和高放大的倍数一样吗？", "id": "a", "misconception": "add-same-keeps-ratio", "text": "8 × 6 厘米"}, {"correct": true, "id": "b", "text": "12 × 8 厘米"}, {"feedback": "宽变成两倍，高还在原地。看相框里的人会不会变扁。", "id": "c", "misconception": "bigger-is-similar", "text": "12 × 4 厘米"}], "type": "choice"}, "feedback": {"correct": "宽和高都变成原来的 2 倍，形状保留下来了。", "wrong": "比较两条边各自放大的倍数。"}, "hints": ["比较两条边各自放大的倍数。", "找到宽和高放大倍数相同的一张。"], "id": "q1", "stem": "一张照片宽 6 厘米、高 4 厘米。放大成哪种大小，里面的人像不会走样？"}, {"answer": {"common_wrong": [{"feedback": "你给两边各加了 16。照片不走样时，两边放大的倍数相同。", "misconception": "add-same-keeps-ratio", "value": 19}], "tolerance": 0, "type": "number", "value": 15}, "feedback": {"correct": "20 是 4 的 5 倍，高也变成 3 × 5 = 15。", "wrong": "4 变成 20，是放大几倍？"}, "hints": ["4 变成 20，是放大几倍？", "让高也放大同样的倍数。"], "id": "q2", "stem": "相框保持形状。4 : 3 = 20 : □。方框里填几？"}, {"answer": {"common_wrong": [{"feedback": "6 × 50000 得到的是厘米。1 千米等于多少厘米？", "misconception": "unit-slip", "value": 30}, {"feedback": "50000 厘米是图上 1 厘米的实际长度。题里的线有 6 厘米。",
