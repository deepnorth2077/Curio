10\" fill=\"transparent\"/><!-- 永不重画的触摸层（教训 25） -->\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n// 同一箱子沿光滑直坡匀速上升：F×坡长 = 重力×升高。OpenStax College Physics 2e §9.5。\n// 这些重量、尺寸是码头工装的选择。图中沿坡和竖直方向使用同一个长度比例。\nconst MODEL={weight:12,height:1,minLength:2,maxLength:4,scale:104,pushStep:.125};\nlet length=MODEL.minLength,progress=0;\nconst runs=[];\nfunction slope(){\n  const run=Math.sqrt(length*length-MODEL.height*MODEL.height);\n  const foot=606-run*MODEL.scale,force=MODEL.weight*MODEL.height/length;\n  return {foot,dx:run/length,dy:-MODEL.height/length,force};\n}\n\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 共用零件：分数、「1」记号、圆钮、数线条  kit:parts ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 100 ? \"百\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;                // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 3;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1q\", hold: false, press: false, kbd: false, dirty: true, t1: 0, p1: 0, t2: 0, p2: 0 };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.innerHTML = (a.hold ? RIDGES : \"\") + `<span>${a.label}<\/span>`;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); if (v) touched(); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(ev, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(true); } });\n      b.addEventListener(\"keyup\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(false); } });\n      b.addEventListener(\"blur\", () => on(false));\n      b.addEventListener(\"contextmenu\", e => e.preventDefault());\n    } else {\n      b.addEventListener(\"click\", e => { if (performance.now() - born < 400 || (keyGuard && e.detail === 0)) return; a.go(e); });\n      if (guard){ b.disabled = true; const en = () => { setTimeout(() => { b.disabled = false; }, 120); removeEventListener(\"pointerup\", en, true); }; addEventListener(\"pointerup\", en, true); }\n    }\n    boxEl.append(b);\n  }\n  const first = boxEl.querySelector(\"button\");\n  if (first && !/^act/.test(S.mode)) first.focus({ preventScroll: true });\n  return boxEl;\n}\n// 猜测：只记下来，不在这里判对错的颜色。猜错的反馈先接住、再说清，然后一律去动手，让实物来回答\nfunction ask(question, options, onAnswer){\n  say(question);\n  actions(options.map((o, i) => ({ label: o.label, cls: \"choice\", go: () => {\n    if (!sentPred.has(S.station)){ sentPred.add(S.station); Host.event(\"predicted\", { station: S.station, choice: i, correct: !!o.correct, misconception: o.mis || null }); }\n    S.guess = S.guess || {}; S.guess[S.station] = o;\n    say(o.feedback, o.correct ? \"good\" : \"hmm\");\n    onAnswer(o);\n  }})));\n}\nfunction next(label, go, cls){ actions([{ label, go, cls }]); }\n// 星卡上选站重玩（#154）：replay 是正在重玩的站号，0 是从头往下走。重玩一站跳过开场和猜测题，直接进这一站的动手；\n// 揭晓完，原来「去第 k+1 站」「看我的星卡」的按钮换成「回星卡」（用 nextOr）。不出猜测题就不发 predicted；\n// observed 靠 observedOnce、complete 靠 completed，都只记第一次。每站怎么复位、怎么进动手是模块自己的事，写在 REPLAY[站号] 里\nlet replay = 0;\nconst REPLAY = {};\nfunction nextOr(label, go, cls){ if (replay) next(\"回星卡\", enterEnd); else next(label, go, cls); }\nfunction replayAt(k){ replay = k; gen++; S.station = k; hint(\"\"); readout(\"\"); disarmCue(); REPLAY[k](); }\nfunction restart(){ replay = 0; sentPred.clear(); sentObs.clear(); S.guess = {}; lastState = \"\"; enter1(); }   // 从头玩：和以前的「再玩一次」一样\nfunction endActions(){   // 星卡的按钮：从头玩 + 第 1 站…第 N 站。enterEnd() 最后调它\n  replay = 0;\n  actions([{ label: \"从头玩\", go: restart, cls: \"ghost tight\" }].concat(Array.from({ length: STATIONS }, (_, i) => ({ label: `第 ${i + 1} 站`, go: () => replayAt(i + 1), cls: \"tight\" }))));   // tight：手机上一行排得下\n}\n\n(function(){   // 「我有个问题」：随时可以问，发到信号站\n  const area = $(\"qarea\");\n  const open = document.createElement(\"button\");\n  open.type = \"button\"; open.className = \"btn ghost small\"; open.textContent = \"我有个问题\";\n  open.style.marginTop = \"12px\";\n  open.addEventListener(\"click\", () => {\n    if (area.querySelector(\"textarea\")) return;\n    const ta = document.createElement(\"textarea\"); ta.maxLength = 120; ta.placeholder = \"想问领航员什么？\";\n    const send = document.createElement(\"button\"); send.type = \"button\"; send.className = \"btn small\"; send.textContent = \"发给领航员\";\n    const bx = document.createElement(\"div\"); bx.className = \"qbox\"; bx.append(ta, send);\n    send.addEventListener(\"click\", () => { const q = ta.value.trim(); if (!q) return; Host.noteQuestion(q); bx.remove(); say(\"好问题，我记下来了。等会儿一起找答案。\"); });\n    area.append(bx); ta.focus();\n  });\n  area.append(open);\n})();\n\n// 第一屏的提醒（G6）：进入动手 1.5 秒还没碰，第一个圆钮外面扩出一圈细环；一碰就再也不出现\nlet cuePos = null, cueTimer = 0;\nfunction armCue(pos){ disarmCue(); const g = gen; cueTimer = setTimeout(() => { if (g === gen && /^act/.test(S.mode)){ cuePos = pos; placeCue(); } }, 1500); }\nfunction disarmCue(){ clearTimeout(cueTimer); cuePos = null; cueEl.style.display = \"none\"; }\nfunction touched(){ if (cuePos || cueTimer) disarmCue(); cueTimer = 0; }\nfunction placeCue(){ if (!cuePos) return; const [x, y, r] = cuePos(); cueEl.setAttribute(\"cx\", r1(x)); cueEl.setAttribute(\"cy\", r1(y)); cueEl.setAttribute(\"r\", r1((r || gripR()) + 2)); cueEl.style.display = \"\"; }   // 第三个数是被提醒的东西的半径（托里的一个）\n\n// 小屏收掉台面两侧的留白，动态零件始终处在同一把坐标尺上。\nfunction fitView(){\n  const small=svg.clientWidth<600;\n  document.body.classList.toggle(\"narrow\",small);\n  svg.setAttribute(\"viewBox\",small?\"100 22 600 355\":\"40 12 720 375\");\n}\naddEventListener(\"resize\",()=>{fitView();paint();});\nconst fmt=value=>String(Math.round(value*100)/100);\nconst line=(x1,y1,x2,y2,cls=\"k\",seed=19)=>P(Sk.line(x1,y1,x2,y2,seed,.45),cls);\nconst label=(x,y,text,cls=\"lb\")=>TC(x,y,text,cls);\nfunction crate(x,y,w,h,cls=\"wood\"){\n  return `<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"3\" class=\"${cls}\"/>`+\n    line(x+5,y+5,x+w-5,y+h-5,\"k1\")+line(x+5,y+h-5,x+w-5,y+5,\"k1\");\n}\nfunction station(number,title,mode){\n  gen++; S.station=number; S.mode=mode; S.press=false; disarmCue();\n  head(number,title); hint(\"\"); readout(\"\"); actions([]);\n  $(\"bench\").innerHTML=bench(); paint();\n}\nfunction controls(list,message,instruction){\n  say(message);hint(instruction);actions(list);\n  svg.focus({preventScroll:true});\n  armCue(()=>{const h=handle();return h?[h.x,h.y]:[0,0];});\n  paint();\n}\nfunction paint(){\n  gDyn.innerHTML=drawing();\n  const h=handle();\n  if(h) gDyn.insertAdjacentHTML(\"beforeend\",grip(h.x,h.y,[h.dx,h.dy],{on:S.press,kbd:S.kbd}));\n  placeCue();\n  if(S.mode!==\"end\") updateReading();\n}\nfunction card(title,summary){\n  gen++; S.station=STATIONS+1; S.mode=\"end\"; head(0,title); hint(\"\"); readout(\"\"); disarmCue();\n  $(\"bench\").innerHTML=\"\"; paint(); say(summary,\"good\");\n  if(!completed){completed=true;Host.complete({});}\n  endActions();\n}\nfunction toSvg(e){\n  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;\n  return pt.matrixTransform(svg.getScreenCTM().inverse());\n}\nfunction hit(e){\n  const h=handle();if(!h)return null;\n  const q=toSvg(e);return Math.hypot(q.x-h.x,q.y-h.y)<=hitR()?h:null;\n}\nlet drag=null;\nsvg.addEventListener(\"touchstart\",e=>{if(e.touches.length===1&&hit(e.touches[0]))e.preventDefault();},{passive:false});\nsvg.addEventListener(\"pointerdown\",e=>{\n  const h=hit(e);if(!h||drag)return;\n  drag={id:e.pointerId,start:toSvg(e),h};S.press=true;S.kbd=false;svg.classList.remove(\"kbd\");\n  touched();svg.setPointerCapture(e.pointerId);e.preventDefault();paint();\n});\nsvg.addEventListener(\"pointermove\",e=>{\n  if(!drag){svg.style.cursor=hit(e)?\"grab\":\"\";return;}\n  if(e.pointerId!==drag.id||!handle())return;\n  const q=toSvg(e),{start,h}=drag;\n  move(h.value+((q.x-start.x)*h.dx+(q.y-start.y)*h.dy)/h.scale);\n});\nfor(const name of [\"pointerup\",\"pointercancel\",\"lostpointercapture\"])svg.addEventListener(name,e=>{\n  if(drag?.id!==e.pointerId)return;\n  drag=null;S.press=false;paint();\n});\nsvg.addEventListener(\"keydown\",e=>{\n  const h=handle();if(!h)return;\n  const step={ArrowRight:h.dx,ArrowLeft:-h.dx,ArrowUp:-h.dy,ArrowDown:h.dy}[e.key];\n  if(step===undefined||Math.abs(step)<.01)return;\n  e.preventDefault();S.kbd=true;svg.classList.add(\"kbd\");touched();move(h.value+Math.sign(step)*h.step);\n});\nfunction ticket(y,title,text){\n  return `<rect x=\"133\" y=\"${y}\" width=\"534\" height=\"83\" rx=\"9\" fill=\"var(--paper)\"/>`+\n    T(154,y+32,title,\"lbg\")+T(154,y+65,text,\"lbm\");\n}\n\n\nfunction bench(){\n  const top=244-MODEL.height*MODEL.scale;\n  return line(120,244,680,244)+P(`M606 ${top}h63v${244-top}h-63z`,\"steel\")+\n    line(606,top,133,top,\"kf\")+line(655,top,655,244,\"k1\")+\n    label(635,top-22,`站台 ${MODEL.height} m`,\"lbm\");\n}\nfunction cratePose(){\n  const r=slope(),s=progress*length*MODEL.scale;\n  return {x:r.foot+s*r.dx,y:244+s*r.dy,deg:Math.atan2(r.dy,r.dx)*180/Math.PI};\n}\nfunction handle(){\n  if(S.mode===\"actFoot\"){\n    const r=slope();\n    return {x:r.foot,y:280,dx:-1,dy:0,value:length,step:1,scale:MODEL.scale};\n  }\n  if(S.mode===\"actPush\"){\n    const r=slope(),q=cratePose();\n    return {x:q.x-20*r.dx+22*r.dy,y:q.y-20*r.dy-22*r.dx,dx:r.dx,dy:r.dy,value:progress,step:MODEL.pushStep,scale:length*MODEL.scale};\n  }\n  return null;\n}\nfunction move(value){\n  if(S.mode===\"actFoot\")length=clamp(Math.round(value),MODEL.minLength,MODEL.maxLength);\n  if(S.mode===\"actPush\"){progress=clamp(value);if(progress>=.985)progress=1;if(progress<.005)progress=0;}\n  paint();\n}\nfunction drawing(){\n  if(S.mode===\"end\"){\n    const baseline=171,scale=30,top=baseline-MODEL.height*scale;\n    let out=T(150,54,\"我的坡板记录\",\"ttl\")+line(150,top,650,top,\"kf\");\n    for(const [i,r] of runs.entries()){\n      const x=150+i*172,y=baseline,dx=Math.sqrt(r.length*r.length-MODEL.height*MODEL.height)*scale;\n      out+=line(x,y,x+dx,top,\"k\")+line(x+dx,y,x+dx,top,\"k1\")+\n        T(x,210,i===2?\"我选的坡\":\"第 \"+(i+1)+\" 块坡板\",\"lbg\")+\n        T(x,242,`${r.length} m · ${fmt(r.force)} N`,\"lbm\");\n    }\n    return out+label(400,310,`升高 ${MODEL.height} m，每次做功 ${MODEL.weight*MODEL.height} J`,\"lb\");\n  }\n  const r=slope(),q=cratePose(),top=244-MODEL.scale*MODEL.height;\n  let out=P(`M${r.foot} 244L606 ${top}v8L${r.foot+10} 251z`,S.mode===\"actFoot\"?\"activePart\":\"wood\");\n  for(let m=0;m<=length;m++){\n    const x=r.foot+r.dx*m*MODEL.scale,y=244+r.dy*m*MODEL.scale;\n    out+=line(x,y,x-10*r.dy,y+10*r.dx,\"k1\",46+m);\n  }\n  out+=`<g transform=\"translate(${q.x} ${q.y}) rotate(${q.deg})\">${crate(-34,-50,68,48,S.mode===\"actPush\"?\"activePart\":\"wood\")}`+\n    label(0,-61,MODEL.weight+\" N\",\"lbm\")+\"<\/g>\";\n  if(S.mode!==\"guess\"){\n    // 两把表用同一把牛顿刻度，让指针位置也能比较推力。\n    const gauges=S.station===1?[[153,\"当前\",r.force]]:[[153,\"短坡\",runs[0].force],[306,\"当前\",r.force]];\n    for(const [x,name,force] of gauges){\n      const width=106,y=86,pos=x+width*force/(MODEL.weight/MODEL.minLength);\n      out+=T(x,y-15,name+\" \"+fmt(force)+\" N\",\"lbm\")+line(x,y,x+width,y)+\n        line(x,y-4,x,y+5,\"k1\")+line(x+width,y-4,x+width,y+5,\"k1\")+\n        P(`M${pos-4} ${y+13}l4-9 4 9z`,\"lead\");\n    }\n  }\n  if(S.mode!==\"guess\")out+=label(401,330,`坡面 ${length} m　·　沿坡推力 ${fmt(r.force)} N`,\"lbm\");\n  return out;\n}\nfunction updateReading(){\n  if(S.mode===\"guess\"){readout(\"同一个箱子 · 同一个站台\");return;}\n  const distance=length*progress,height=MODEL.height*progress,force=slope().force;\n  readout(`沿坡走 <b>${fmt(distance)} m<\/b>　升高 ${fmt(height)} m<br>推力 ${fmt(force)} N　做功 ${fmt(force*distance)} J`);\n  sendState({station:S.station,length,height:r1(height*100)/100,distance:r1(distance*100)/100,force,work:r1(force*distance*100)/100});\n}\nfunction enter1(){\n  length=MODEL.minLength;progress=0;runs.length=0;\n  station(1,\"把货送上站台\",\"guess\");\n  ask(\"站台始终一样高。把光滑坡板换长些，慢慢把箱子推到顶，手要更费力吗？\",[\n    {label:\"会更省力\",correct:true,feedback:\"先在短板上试一次，再看换长板会怎样。\"},\n    {label:\"板变长，箱子也升得更高\",mis:\"length-is-height\",feedback:\"板是变长了。留心箱子最后停在哪条高度线上。\"}\n  ],()=>next(\"试推短坡\",()=>push(1)));\n}\nfunction push(n){\n  station(n,n===1?\"先推短坡\":n===2?\"换长坡再推\":\"试推你选的坡\",\"actPush\");\n  controls([{label:\"把货交给站台\",go:finishRun}],\n    \"坡面没有摩擦。拖圆钮，沿着板匀速推。m 是米，N 是牛，做的功用焦（J）记。\",\"沿坡拖箱，或按左右键\");\n}\nfunction finishRun(){\n  if(progress!==1){say(\"货箱还没到站台，再沿着板推一段。\",\"hmm\");return;}\n  const force=slope().force;\n  runs[S.station-1]={length,force};S.mode=\"talk\";disarmCue();hint(\"\");paint();observedOnce(S.station);\n  if(S.station===1){\n    say(`短坡走了 ${length} m，推力 ${fmt(force)} N。记住站台的高度线，再换块板。`,\"good\");nextOr(\"抽出长坡板\",enter2);\n  }else if(S.station===2){\n    say(`长坡用了 ${fmt(force)} N，箱底仍停在同一高度。站台一厘米也没长高。`,\"good\");nextOr(\"我来选块板\",enter3);\n  }else{\n    say(`你选的坡板长 ${length} m，匀速推上去需要 ${fmt(force)} N。三笔账可以放在一起了。`,\"good\");nextOr(\"收下坡板记录\",enterEnd);\n  }\n}\nfunction choose(n){\n  length=n===2?MODEL.minLength:MODEL.minLength+1;progress=0;\n  station(n,n===2?\"把坡脚往外拉\":\"自己搭一条坡\",\"actFoot\");\n  controls([{label:\"固定坡脚\",go:()=>{\n    if(n===2&&length!==MODEL.maxLength){say(`这一趟试 ${MODEL.maxLength} m 的长板。再把坡脚往左拉一点。`);return;}\n    push(n);\n  }}],n===2?`坡顶钉在原处。把坡脚向左拉，让板面伸到 ${MODEL.maxLength} m。`:\n    \"试试要多远、多费力，选好长度再推箱子。\",\"拖板脚，或按左右键\");\n}\nfunction enter2(){choose(2);}function enter3(){choose(3);}\nfunction enterEnd(){card(\"我的坡板记录\",\"箱子升得一样高。你走的路越长，手需要的推力越小。\");}\nREPLAY[1]=()=>{length=MODEL.minLength;progress=0;push(1);};REPLAY[2]=enter2;REPLAY[3]=enter3;\n\nHost.ready();\nfitView();\nenter1();\n<\/script><\/body><\/html>\n", "id": "act.simulation.ramp-dock-01", "kind": "simulation", "targets": ["physics.machine.ramp"], "title": "伸缩坡板"}, {"age_band": "G3-4", "body": {"items": [{"answer": {"choices": [{"feedback": "两块板的上端都靠在同一站台边。", "id": "a", "misconception": "length-is-height", "text": "路和高度都变大"}, {"feedback": "沿着较长的板量，箱子走的路会变长。", "id": "b", "misconception": "length-is-height", "text": "路和高度都相同"}, {"correct": true, "id": "c", "text": "路变长，高度相同"}], "type": "choice"}, "feedback": {"correct": "你分别看了坡面和竖直高度尺。两块板绕了不同长的路，却到达同一层。", "wrong": "先找箱子最后停在哪一层。"}, "hints": ["先找箱子最后停在哪一层。", "再让手指沿坡板从脚走到顶。"], "id": "q1", "stem": "同一只箱子沿光滑直坡匀速上同一站台，手沿坡推。短板换成长板。箱子走的路和升高的高度怎样变？"}, {"answer": {"common_wrong": [{"feedback": "竖直抬箱时用箱重作力。沿坡推时可以多走些路。", "misconception": "length-is-height", "value": 12}], "tolerance": 0, "type": "number", "unit": "牛", "value": 4}, "feedback": {"correct": "升高箱子需要 12 焦，分到 3 米坡路上，沿坡只需用 4 牛的力推。", "wrong": "算一算把货升到这个高度要做多少功。"}, "hints": ["算一算把货升到这个高度要做多少功。", "把这份功均分到沿坡推过的路程上。"], "id": "q2", "stem": "箱重 12 牛，沿光滑坡板匀速升高 1 米。坡板长 3 米。沿坡推它的手需要用几牛？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "一样多"}, {"feedback": "长板上的推力小些，可手要推更远。", "id": "b", "misconception": "length-is-height", "text": "变少"}, {"feedback": "坡板虽长，箱子升高的距离没有变。", "id": "c", "misconception": "length-is-height", "text": "变多"}], "type": "choice"}, "feedback": {"correct": "两块板都把同一箱子送上同一层，箱子增加的重力势能相同。", "wrong": "在起点和站台顶各贴一根高度线。"}, "hints": ["在起点和站台顶各贴一根高度线。", "比一比两种路线的终点比起点高多少。"], "id": "q3", "stem": "同一箱子匀速上同一层。有两块光滑坡板。你试过短板，换成长板也沿坡推。手推箱所做的功会怎样？"}, {"answer": {"common_wrong": [{"feedback": "你量的是沿坡走的长度。高度要用竖直的尺量。", "misconception": "length-is-height", "value": 6}], "tolerance": 0, "type": "number", "unit": "米", "value": 2}, "feedback": {"correct": "手做了 6 × 6 = 36 焦的功。箱子每升高一米需要 18 焦，所以升高 2 米。", "wrong": "先读出推力和沿坡走的距离。"}, "hints": ["先读出推力和沿坡走的距离。", "算出手做的功，再除以箱重。"], "id": "q4", "stem": "一箱货重 18 牛。沿光滑坡面用 6 牛的力匀速推了 6 米。站台比起点高几米？"}, {"answer": {"choices": [{"feedback": "这对读数仍按原站台的高度计算。", "id": "a", "misconception": "length-is-height", "text": "4 米板需 3 牛，6 米板需 2 牛"}, {"correct": true, "id": "b", "text": "4 米板需 6 牛，6 米板需 4 牛"}, {"feedback": "同一新高度上，较长的坡板所需推力更小。", "id": "c", "misconception": "length-is-height", "text": "4 米板需 4 牛，6 米板需 6 牛"}], "type": "choice"}, "feedback": {"correct": "新站台需要 12 × 2 = 24 焦。再分别除以 4 米、6 米，得到 6 牛、4 牛。", "wrong": "先把工作票上的站台高度改好。"}, "hints": ["先把工作票上的站台高度改好。", "算出新高度需要的功，再分别摊到两块坡板的长度上。"], "id": "q5", "stem": "箱重 12 牛，原站台高 1 米，新站台高 2 米。新台可搭 4 米或 6 米的光滑坡板。沿坡匀速推，两块板各需几牛？"}], "shuffle": false}, "duration_min": 7, "id": "act.quiz.ramp-dock-01", "kind": "quiz", "targets": ["physics.machine.ramp"], "title": "给货箱搭坡板"}], "dq": "终点一样高，把坡拉长，手上的力怎么变？", "id": "physics.machine.ramp", "misconceptions": {"length-is-height": "坡长当高度"}, "title": "斜面：长路怎样省力"}, {"activities": [{"age_band": "G3-4", "duration_min": 6, "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>做功纸带机<\/title>\n<style>\n/* kit:base —— 颜色、卡片、气泡、按钮。色值不要改；模块自己的样式写在最后一段 */\n/* 长按不选字、不弹菜单（#156）。输入框照常能选能改 */\nhtml{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\ninput,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}\n:root{\n  --bg:#F5F4EE; --pane:#FBFAF6; --rule:#E0DCD0; --hover:#E7E4D9;\n  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;\n  --accent:#C2603F; --accent-soft:#F3E0D6;\n  --grip:#2A7F7C; --grip-soft:#D3E8E5;\n  --sage:#CCD6C0; --sage-bg:#DCE3D2; --sky:#CFDCE6; --apricot:#ECCDB6; --paper:#EFE4D6;\n  --dad:#4F7FA8; --mom:#C2603F; --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;\n  --f-serif:\"Noto Serif SC\",\"Source Han Serif SC\",\"Songti SC\",Georgia,serif;\n  --f-sans:\"Noto Sans SC\",\"PingFang SC\",\"Microsoft YaHei\",system-ui,sans-serif;\n  --f-mono:ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n  color-scheme:light;\n}\n@media (prefers-color-scheme:dark){:root{\n  --bg:#1E1E1E; --pane:#252525; --rule:#353535; --hover:#2E2E2E;\n  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;\n  --accent:#E0876A; --accent-soft:#3A2A24;\n  --grip:#5FC4BE; --grip-soft:#1F3634;\n  --sage:#3C4836; --sage-bg:#28301F; --sky:#2D3B47; --apricot:#5A4536; --paper:#33302A;\n  --dad:#7FA9CF; --mom:#E0876A; --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;\n  color-scheme:dark;\n}}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}\nbutton{font:inherit;color:inherit;cursor:pointer}\n.wrap{max-width:820px;margin:0 auto;padding:12px 14px 28px}\n.card{background:var(--pane);border:1px solid var(--rule);border-radius:18px;overflow:hidden}\n.card header,.card foot ale(1.8);opacity:0}100%{transform:scale(1.8);opacity:0}}\n@media (prefers-reduced-motion:reduce){#cue{animation:none;transform:scale(1.3);opacity:.9}}\n/* kit:frac 2026-11-14 —— 分数一律上下结构（A.4 第 2 条）。HTML 里用 .frac，SVG 里用 fracS() */\n.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-family:var(--f-mono);font-size:.84em;margin:0 .2em;font-variant-numeric:tabular-nums}\n.frac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .28em .04em}\n.frac>span:last-child{padding:.04em .28em 0}\n.fl{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}\n.fs{fill:var(--ink);font-family:var(--f-mono);font-size:16px} .fm{fill:var(--ink);font-family:var(--f-mono);font-size:22px} .fb{fill:var(--ink);font-family:var(--f-mono);font-size:34px}\nbody.narrow .fs{font-size:20px} body.narrow .fm{font-size:26px} body.narrow .fb{font-size:38px}\n/* 模块自己的画面样式写在这里：字号全写在类上，窄屏在 body.narrow 里放大（教训 14、28）。下面几个类可以直接用 */\n.food{fill:var(--apricot)} .lead{fill:var(--accent)} .papr{fill:var(--paper)} .pane{fill:var(--pane)}\n.kacc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.one{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:7 6}\n.faint{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;opacity:.75}\n.lb{fill:var(--ink);font-family:var(--f-sans);font-size:17px}\n.lbg{fill:var(--muted);font-family:var(--f-sans);font-size:16px}\n.lbm{fill:var(--ink);font-family:var(--f-mono);font-size:17px}\n.big{fill:var(--ink);font-family:var(--f-mono);font-size:44px}\n.ttl{fill:var(--ink);font-family:var(--f-serif);font-size:26px}\n.sign{fill:var(--ink);font-family:var(--f-serif);font-size:24px}\n.tk{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round} .tkd{fill:none;stroke:var(--accent);stroke-width:1.1}\nbody.narrow .lb{font-size:21px} body.narrow .lbg{font-size:20px} body.narrow .lbm{font-size:20px}\nbody.narrow .big{font-size:50px} body.narrow .ttl{font-size:30px} body.narrow .sign{font-size:28px}\n\n/* ============ 码头仪表 ============ */\n#gear{padding:0 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}\n#gear:empty{display:none}\n#gear label{display:flex;align-items:center;flex:1 1 190px;gap:8px;font-size:16px;color:var(--ink)}\n#gear input,#gear select{font:inherit;min-height:48px;min-width:70px;max-width:100%;flex:1}\n#gear input{accent-color:var(--ink)}\n#gear select{background:var(--pane);color:var(--ink);border:1px solid var(--rule);border-radius:8px}\n.readout{white-space:normal}\nbody.narrow .t,body.narrow .tm{font-size:20px}\n\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\"><\/span><h1 id=\"title\"><\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 800 610\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <g id=\"dyn\"><\/g>\n      <g id=\"fx\"><circle id=\"cue\" cx=\"0\" cy=\"0\" r=\"10\" style=\"display:none\"/><\/g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n      <rect id=\"touch\" x=\"-400\" y=\"-400\" width=\"1600\" height=\"1410\" fill=\"transparent\"/><!-- 永不重画的触摸层（教训 25） -->\n    <\/svg>\n    <div id=\"gear\"><\/div>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n// 理想直提与无摩擦斜坡，匀速；#193 船坞设定。OpenStax College Physics 2e §7.1。\nconst MODEL = {\n  weight:12, height:1, ramp:4,\n  trial(station){const length=station===1?this.height:this.ramp; return {length,force:this.weight*this.height/length};},\n  work(force,distance){return force*distance;}\n};\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 共用零件：分数、「1」记号、圆钮、数线条  kit:parts ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 100 ? \"百\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;                // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 2;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1q\", hold: false, press: false, kbd: false, dirty: true, t1: 0, p1: 0, t2: 0, p2: 0 };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.innerHTML = (a.hold ? RIDGES : \"\") + `<span>${a.label}<\/span>`;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); if (v) touched(); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(ev, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(true); } });\n      b.addEventListener(\"keyup\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(false); } });\n      b.addEventListener(\"blur\", () => on(false));\n      b.addEventListener(\"contextmenu\", e => e.preventDefault());\n    } else {\n      b.addEventListener(\"click\", e => { if (performance.now() - born < 400 || (keyGuard && e.detail === 0)) return; a.go(e); });\n      if (guard){ b.disabled = true; const en = () => { setTimeout(() => { b.disabled = false; }, 120); removeEventListener(\"pointerup\", en, true); }; addEventListener(\"pointerup\", en, true); }\n    }\n    boxEl.append(b);\n  }\n  const first = boxEl.querySelector(\"button\");\n  if (first && !/^act/.test(S.mode)) first.focus({ preventScroll: true });\n  return boxEl;\n}\n// 猜测：只记下来，不在这里判对错的颜色。猜错的反馈先接住、再说清，然后一律去动手，让实物来回答\nfunction ask(question, options, onAnswer){\n  say(question);\n  actions(options.map((o, i) => ({ label: o.label, cls: \"choice\", go: () => {\n    if (!sentPred.has(S.station)){ sentPred.add(S.station); Host.event(\"predicted\", { station: S.station, choice: i, correct: !!o.correct, misconception: o.mis || null }); }\n    S.guess = S.guess || {}; S.guess[S.station] = o;\n    say(o.feedback, o.correct ? \"good\" : \"hmm\");\n    onAnswer(o);\n  }})));\n}\nfunction next(label, go, cls){ actions([{ label, go, cls }]); }\n// 星卡上选站重玩（#154）：replay 是正在重玩的站号，0 是从头往下走。重玩一站跳过开场和猜测题，直接进这一站的动手；\n// 揭晓完，原来「去第 k+1 站」「看我的星卡」的按钮换成「回星卡」（用 nextOr）。不出猜测题就不发 predicted；\n// observed 靠 observedOnce、complete 靠 completed，都只记第一次。每站怎么复位、怎么进动手是模块自己的事，写在 REPLAY[站号] 里\nlet replay = 0;\nconst REPLAY = {};\nfunction nextOr(label, go, cls){ if (replay) next(\"回星卡\", enterEnd); else next(label, go, cls); }\nfunction replayAt(k){ replay = k; gen++; S.station = k; hint(\"\"); readout(\"\"); disarmCue(); REPLAY[k](); }\nfunction restart(){ replay = 0; sentPred.clear(); sentObs.clear(); S.guess = {}; lastState = \"\"; enter1(); }   // 从头玩：和以前的「再玩一次」一样\nfunction endActions(){   // 星卡的按钮：从头玩 + 第 1 站…第 N 站。enterEnd() 最后调它\n  replay = 0;\n  actions([{ label: \"从头玩\", go: restart, cls: \"ghost tight\" }].concat(Array.from({ length: STATIONS }, (_, i) => ({ label: `第 ${i + 1} 站`, go: () => replayAt(i + 1), cls: \"tight\" }))));   // tight：手机上一行排得下\n}\n\n(function(){   // 「我有个问题」：随时可以问，发到信号站\n  const area = $(\"qarea\");\n  const open = document.createElement(\"button\");\n  open.type = \"button\"; open.className = \"btn ghost small\"; open.textContent = \"我有个问题\";\n  open.style.marginTop = \"12px\";\n  open.addEventListener(\"click\", () => {\n    if (area.querySelector(\"textarea\")) return;\n    const ta = document.createElement(\"textarea\"); ta.maxLength = 120; ta.placeholder = \"想问领航员什么？\";\n    const send = document.createElement(\"button\"); send.type = \"button\"; send.className = \"btn small\"; send.textContent = \"发给领航员\";\n    const bx = document.createElement(\"div\"); bx.className = \"qbox\"; bx.append(ta, send);\n    send.addEventListener(\"click\", () => { const q = ta.value.trim(); if (!q) return; Host.noteQuestion(q); bx.remove(); say(\"好问题，我记下来了。等会儿一起找答案。\"); });\n    area.append(bx); ta.focus();\n  });\n  area.append(open);\n})();\n\n// 第一屏的提醒（G6）：进入动手 1.5 秒还没碰，第一个圆钮外面扩出一圈细环；一碰就再也不出现\nlet cuePos = null, cueTimer = 0;\nfunction armCue(pos){ disarmCue(); const g = gen; cueTimer = setTimeout(() => { if (g === gen && /^act/.test(S.mode)){ cuePos = pos; S.dirty = true; } }, 1500); }\nfunction disarmCue(){ clearTimeout(cueTimer); cuePos = null; cueEl.style.display = \"none\"; }\nfunction touched(){ if (cuePos || cueTimer) disarmCue(); cueTimer = 0; }\nfunction placeCue(){ if (!cuePos) return; const [x, y, r] = cuePos(); cueEl.setAttribute(\"cx\", r1(x)); cueEl.setAttribute(\"cy\", r1(y)); cueEl.setAttribute(\"r\", r1((r || gripR()) + 2)); cueEl.style.display = \"\"; }   // 第三个数是被提醒的东西的半径（托里的一个）\n\n// 窄屏：viewBox 缩到中间 600 宽的操作区，字号类放大（教训 13、28）。每个场景写明自己用到的高度\n// 排版规矩：要紧的东西都画在 x = 110～690 之间；每个场景在这里写 [起始 y, 高度]\nconst VIEW = { s1q: [120, 360], s1: [120, 360], s2: [120, 360], end: [8, 596] };\nfunction fitView(){\n  const nar = (svg.clientWidth || 800) < 600, [y, h] = VIEW[S.scene] || [0, 610];\n  document.body.classList.toggle(\"narrow\", nar);\n  const v = (nar ? [100, y, 600, h] : [0, y, 800, h]).join(\" \");\n  if (svg.getAttribute(\"viewBox\") !== v){ svg.setAttribute(\"viewBox\", v); S.dirty = true; }\n}\naddEventListener(\"resize\", fitView);\nfunction scene(name){ S.scene = name; fitView(); S.dirty = true; }\n\n\n/* ============ 桌面与工票 ============ */\nfunction fitBench(){\n  const narrow = svg.clientWidth < 600;\n  document.body.classList.toggle(\"narrow\", narrow);\n  svg.setAttribute(\"viewBox\", narrow ? \"100 0 600 380\" : \"50 0 700 380\");\n}\naddEventListener(\"resize\", fitBench);\nfunction frame(x,y,w,h,fill,seed){\n  return '<rect x=\"'+x+'\" y=\"'+y+'\" width=\"'+w+'\" height=\"'+h+'\" rx=\"4\" fill=\"var(--'+fill+')\"/>'+P(box(x,y,w,h,seed,.5));\n}\nfunction crate(x,y,w,h){\n  return frame(x,y,w,h,\"apricot\",42)+P(Sk.line(x+4,y+4,x+w-4,y+h-4,44,.4),\"k1\")\n    +P(Sk.line(x+4,y+h-4,x+w-4,y+4,45,.4),\"k1\");\n}\nfunction bench(station,title){\n  gen++; S.station=station; S.mode=\"act\"; S.scene=\"bench\";\n  head(station,title); hint(\"\"); readout(\"\"); $(\"gear\").replaceChildren(); disarmCue();\n}\n\nconst tickets=[null,null];\nlet distance=0, stamp=null;\nfunction tape(x,y,force,meters,cell){\n  const w=meters*cell,h=force*cell;\n  let drawing=frame(x-7,y-12*cell-12,4*cell+14,12*cell+23,\"paper\",80);\n  if (meters>0){\n    drawing+=`<rect x=\"${x}\" y=\"${y-h}\" width=\"${w}\" height=\"${h}\" fill=\"var(--accent-soft)\"/>`;\n    drawing+=P(box(x,y-h,w,h,84,.3),\"kacc\");\n    for(let row=1;row<force;row++) drawing+=P(Sk.line(x,y-row*cell,x+w,y-row*cell,90+row,.15),\"k1\");\n    for(let col=1;col<meters;col++) drawing+=P(Sk.line(x+col*cell,y-h,x+col*cell,y,100+col,.15),\"k1\");\n  }\n  return drawing;\n}\nfunction drawWork(){\n  const {length,force}=MODEL.trial(S.station),along=distance/length;\n  const incline=S.station===2, scale=64, dy=MODEL.height*scale;\n  const dx=incline?Math.sqrt(length*length-MODEL.height*MODEL.height)*scale:0;\n  const ox=180, oy=252, cx=ox+along*dx, cy=oy-along*dy;\n  let art=P(Sk.line(138,oy+2,445,oy+2,12,.4),\"k1\");\n  if(incline){\n    art+=`<path d=\"M${ox} ${oy} l${dx} -${dy} v${dy} Z\" fill=\"var(--sage)\"/>`;\n    art+=P(Sk.line(ox,oy,ox+dx,oy-dy,14,.3));\n  }else{\n    art+=P(Sk.line(146,oy-dy,146,oy,17,.5),\"faint\")+T(120,oy-dy-12,MODEL.height+\" m\",\"lbm\");\n    art+=P(Sk.line(225,oy-dy,340,oy-dy,18,.5),\"k1\");\n  }\n  art+=`<g transform=\"translate(${cx},${cy}) rotate(${incline?-Math.atan2(dy,dx)*180/Math.PI:0})\">`\n    +crate(-22,-42,44,42)+P(Sk.line(incline?22:0,incline?-19:-42,incline?57:0,incline?-19:-80,22,.4),\"kacc\")+\"<\/g>\";\n  art+=P(Sk.line(140,oy-dy,445,oy-dy,56,.4),\"faint\");\n  art+=T(147,315,force+\" N · \"+(incline?\"沿坡推\":\"向上托\"),\"lb\")+tape(492,280,force,distance,14)\n    +T(463,63,\"做功纸带\",\"ttl\")+T(463,316,\"一整格 1 J\",\"lb\");\n  gDyn.innerHTML=art;\n  const work=MODEL.work(force,distance);\n  readout(`手用了 ${force} N · 箱走了 ${distance} m · 手做功 <b>${work} J<\/b>`);\n  sendState({station:S.station,force,distance,work});\n}\nfunction moveBox(station){\n  bench(station,station===1?\"把箱子直直提起\":\"沿长坡送箱子\"); distance=0;\n  const {length,force}=MODEL.trial(station);\n  say(station===1?\"拉把手，把箱子向上提。看看纸带什么时候开始有格子。\":\"这次只用 \"+force+\" N。沿光滑的长坡把箱子推到同一高度。\");\n  hint(\"N 是牛，J 是焦耳 · 拉动把手\");\n  const label=document.createElement(\"label\"), slider=document.createElement(\"input\");\n  label.append(\"拉货把手\",slider); slider.type=\"range\"; slider.min=0; slider.max=length;\n  slider.step=length/4; slider.value=0; $(\"gear\").append(label);\n  const buttons=actions([\n    {label:\"盖一枚中途印\",cls:\"ghost\",go:()=>{\n      stamp={station,work:MODEL.work(force,distance),distance};\n      say(\"印好了。继续把箱子送到顶。\");\n    }},\n    {label:replay?\"回星卡\":station===1?\"换长坡\":\"收好工作票\",\n      go:replay||station===2?enterEnd:enter2}\n  ]).children;\n  buttons[0].disabled=true; buttons[1].disabled=true;\n  slider.oninput=()=>{\n    distance=Number(slider.value); drawWork();\n    buttons[0].disabled=distance===0 || distance===length;\n    buttons[1].disabled=distance!==length;\n    if(distance===length){\n      tickets[station-1]={force,distance,work:MODEL.work(force,distance)};\n      observedOnce(station);\n      say(station===1?\"到顶了，纸上印出一条高高的格子。\":\"这张票矮了，也长了。数数里面的格子。\",\"good\");\n    }else say(\"看着箱子和纸带。你可以在半路盖印，也可以把箱子送到顶。\");\n  };\n  drawWork();\n}\nfunction holdBox(){\n  bench(1,\"托住，箱子走了吗\"); distance=0; drawWork();\n  say(\"箱子原先就放在你手上。先托稳，观察货箱和纸带。\");\n  next(\"托稳箱子\",()=>{\n    say(\"手用着力，箱子还在原地。托力对箱做了 0 J 功。手臂还是会累。纸带今天有了休息。\");\n    next(\"试试直提\",()=>moveBox(1));\n  });\n}\nfunction enter1(){\n  stamp=null; bench(1,\"托住一只箱子\"); distance=0;\n  gDyn.innerHTML=crate(350,142,102,82)+P(Sk.line(318,226,480,226,31,.4),\"kacc\");\n  ask(\"箱子稳稳托在手上，一直没动。托力对箱子做了功吗？\",[\n    {label:\"用着劲，就做了功\",mis:\"effort-is-work\",feedback:\"手臂确实用劲。去看箱子走了多远。\"},\n    {label:\"箱子没动，可能没有\",correct:true,feedback:\"用纸带来检验。\"}\n  ],()=>next(\"到纸带机\",holdBox));\n}\nfunction enter2(){moveBox(2);}\nREPLAY[1]=holdBox; REPLAY[2]=enter2;\nfunction enterEnd(){\n  bench(0,\"我的两张工作票\"); S.mode=\"end\";\n  let art=frame(130,15,540,345,\"paper\",47)+T(158,58,\"我的两张工作票\",\"ttl\");\n  tickets.forEach((t,i)=>{\n    const x=190+250*i;\n    art+=tape(x,249,t.force,t.distance,12)+T(x-15,82,i?\"沿长坡\":\"直直提\",\"lb\")\n      +T(x-15,290,`${t.force} N × ${t.distance} m = ${t.work} J`,\"lbm\");\n  });\n  if(stamp) art+=T(158,335,`我的中途印：${stamp.distance} m 时，${stamp.work} J`,\"lb\");\n  gDyn.innerHTML=art; say(\"力更小，路更长。两张纸上的格子数一样。\",\"good\");\n  if(!completed){completed=true; Host.complete({});} endActions();\n}\n\nHost.ready();\nfitBench();\nenter1();\n<\/script>\n<\/body>\n<\/html>\n", "id": "act.simulation.work-dock-01", "kind": "simulation", "targets": ["physics.energy.work"], "title": "做功纸带机"}, {"age_band": "G3-4", "body": {"items": [{"answer": {"choices": [{"feedback": "磅秤能读出力，还要在尺上找到箱子的移动。", "id": "a", "misconception": "effort-is-work", "text": "按托力有多大来记"}, {"correct": true, "id": "b", "text": "记 0 焦"}, {"feedback": "时间过去了，但箱子仍停在同一条刻线上。", "id": "c", "misconception": "effort-is-work", "text": "托得越久，焦数越多"}], "type": "choice"}, "feedback": {"correct": "箱子的位移为零，所以托力对它做了 0 焦的功。手臂依然可能觉得累。", "wrong": "看看箱子起点和终点的刻线。"}, "hints": ["看看箱子起点和终点的刻线。", "找找箱子在托力方向上走了多远。"], "id": "q1", "stem": "你一直向上托着装书的箱子，箱子停在同一条高度线上。只算托力对箱子做的机械功。工作票该怎么记？"}, {"answer": {"common_wrong": [{"feedback": "你记下了力的大小，还要乘上箱子沿力走过的路。", "misconception": "effort-is-work", "value": 3}], "tolerance": 0, "type": "number", "unit": "焦", "value": 15}, "feedback": {"correct": "每向右走一米，推力做 3 焦的功。走 5 米就是 15 焦。", "wrong": "在纸上标出手推的方向。"}, "hints": ["在纸上标出手推的方向。", "沿这个方向，把每米的功累加起来。"], "id": "q2", "stem": "机器人用 3 牛的恒力向右推箱子。箱子也向右走了 5 米。这股推力对箱子做了几焦的功？"}, {"answer": {"choices": [{"feedback": "小灯的力大一倍，可它推过的路只有一半。", "id": "a", "misconception": "effort-is-work", "text": "小灯更多"}, {"feedback": "小环走的路长一倍，每米用的力却小一半。", "id": "b", "misconception": "effort-is-work", "text": "小环更多"}, {"correct": true, "id": "c", "text": "一样多"}], "type": "choice"}, "feedback": {"correct": "把两张工作票铺开，8 × 2 和 4 × 4 的格子数都是 16。", "wrong": "每张票都要标出推力和同方向的路程。"}, "hints": ["每张票都要标出推力和同方向的路程。", "用两边的乘积比格子总数。"], "id": "q3", "stem": "小灯用 8 牛向右推箱子 2 米，小环用 4 牛向右推同一箱子 4 米。两次力恒定，箱子都向右移动。谁对箱做功更多？"}, {"answer": {"common_wrong": [{"feedback": "水平走的路，不能填在向上托力的距离栏里。", "misconception": "effort-is-work", "value": 45}], "tolerance": 0, "type": "number", "unit": "焦", "value": 18}, "feedback": {"correct": "沿托力方向只升高了 2 米。托力做功为 9 × 2 = 18 焦。", "wrong": "从侧面看托盘起点和终点的高度。"}, "hints": ["从侧面看托盘起点和终点的高度。", "给向上移动的那段盖章，再核对水平方向那段。"], "id": "q4", "stem": "手始终竖直向上托着托盘，托力恒为 9 牛。托盘先升高 2 米，又保持高度水平走了 3 米。托力共做几焦的功？"}, {"answer": {"common_wrong": [{"feedback": "这只够一段的工作票。两段移动都要计入。", "misconception": "effort-is-work", "value": 12}], "tolerance": 0, "type": "number", "unit": "焦", "value": 24}, "feedback": {"correct": "两段各做了 12 焦。挡住后位移为零，合计 12 + 12 = 24 焦。", "wrong": "每当拉力改变，就另开一行工作票。"}, "hints": ["每当拉力改变，就另开一行工作票。", "每行用这段的拉力乘同向位移，再合计。"], "id": "q5", "stem": "拖拉机先向右用 6 牛拉箱子走 2 米，再向右用 4 牛拉它走 3 米，两段拉力各自恒定。最后箱子被挡住，绳仍绷紧。拉力共做几焦的功？"}], "shuffle": false}, "duration_min": 7, "id": "act.quiz.work-dock-01", "kind": "quiz", "targets": ["physics.energy.work"], "title": "给推力开工作票"}], "dq": "力省下了，哪一栏的账补上了？", "id": "physics.energy.work", "misconceptions": {"effort-is-work": "用劲就有机械功"}, "title": "功：力和路程合起来"}, {"activities": [{"age_band": "G3-4", "duration_min": 6, "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>并排卷扬台<\/title>\n<style>\n/* kit:base —— 颜色、卡片、气泡、按钮。色值不要改；模块自己的样式写在最后一段 */\n/* 长按不选字、不弹菜单（#156）。输入框照常能选能改 */\nhtml{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\ninput,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}\n:root{\n  --bg:#F5F4EE; --pane:#FBFAF6; --rule:#E0DCD0; --hover:#E7E4D9;\n  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;\n  --accent:#C2603F; --accent-soft:#F3E0D6;\n  --grip:#2A7F7C; --grip-soft:#D3E8E5;\n  --sage:#CCD6C0; --sage-bg:#DCE3D2; --sky:#CFDCE6; --apricot:#ECCDB6; --paper:#EFE4D6;\n  --dad:#4F7FA8; --mom:#C2603F; --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;\n  --f-serif:\"Noto Serif SC\",\"Source Han Serif SC\",\"Songti SC\",Georgia,serif;\n  --f-sans:\"Noto Sans SC\",\"PingFang SC\",\"Microsoft YaHei\",system-ui,sans-serif;\n  --f-mono:ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n  color-scheme:light;\n}\n@media (prefers-color-scheme:dark){:root{\n  --bg:#1E1E1E; --pane:#252525; --rule:#353535; --hover:#2E2E2E;\n  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;\n  --accent:#E0876A; --accent-soft:#3A2A24;\n  --grip:#5FC4BE; --grip-soft:#1F3634;\n  --sage:#3C4836; --sage-bg:#28301F; --sky:# t:42px}\n.bubble{background:var(--pane);border:1px solid var(--rule);border-radius:16px 16px 16px 4px;padding:10px 14px;color:var(--ink);min-height:44px;flex:1}\n.bubble.good{background:var(--good-soft);border-color:transparent}\n.bubble.bad{background:var(--bad-soft);border-color:transparent}\n.bubble.hmm{background:var(--paper);border-color:transparent}\n.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin:10px 0 0}\n.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 18px;min-height:48px;font-size:17px;font-weight:600;touch-action:manipulation}\n.btn.ghost{background:var(--pane);color:var(--ink)}\n.btn.choice{background:var(--bg);color:var(--ink);font-weight:500;text-align:left;flex:1 1 220px}\n.btn.choice:hover{background:var(--hover)}\n.btn:disabled{opacity:.4;cursor:default}\n.btn.small{min-height:40px;font-size:15px;padding:6px 14px;font-weight:500} .btn.tight{padding:9px 12px}\n.qbox{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}\n.qbox textarea{flex:1 1 260px;font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);min-height:64px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n@media (max-width:520px){ body{font-size:16px} h1{font-size:17px} .card header,.card footer{padding:8px 12px} .card footer{flex-wrap:wrap;row-gap:2px} .hint{white-space:nowrap} .readout{font-size:14px;flex:1 1 auto} }\n/* kit:grip 2026-11-14 —— 圆钮（「可抓」记号，g1.md A.4 G1～G8）。--grip 只给圆钮、托、按住按钮、焦点框用；--accent 不给任何控件用 */\n.btn.hold{touch-action:none;background:var(--grip);border-color:var(--grip);color:var(--bg);display:inline-flex;align-items:center;gap:10px;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}\n.btn.hold.on{filter:brightness(.82)}\n.btn.hold svg{width:18px;height:18px;flex:none}\n.btn.hold svg path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}\n
