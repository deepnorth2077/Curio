<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curio · 试玩版</title>
<style>
/* 长按不选字、不弹菜单（#156）。输入框照常能选能改 */
html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
:root{
  --bg:#F5F4EE; --pane:#FBFAF6; --side:#EFEDE5; --hover:#E7E4D9; --rule:#E0DCD0;
  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;
  --accent:#C2603F; --accent-soft:#F3E0D6; --on-accent:#FFFFFF;
  --c-math:#ECCDB6; --c-sci:#CCD6C0; --c-sci-2:#93A982; --c-sci-bg:#DCE3D2;
  --c-sky:#CFDCE6; --wash:#EFE4D6; --dad:#4F7FA8; --mom:#C2603F;
  --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;
  --shadow:0 1px 2px rgba(31,30,28,.06),0 8px 28px rgba(31,30,28,.08);
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-hand:"ZCOOL KuaiLe","Kaiti SC","STKaiti","KaiTi","Noto Sans SC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1E1E1E; --pane:#252525; --side:#1B1B1B; --hover:#2E2E2E; --rule:#353535;
  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;
  --accent:#A797F7; --accent-soft:#2D2943; --on-accent:#15121F;
  --c-math:#5A4536; --c-sci:#3C4836; --c-sci-2:#6F8560; --c-sci-bg:#28301F;
  --c-sky:#2D3B47; --wash:#2A2738; --dad:#7FA9CF; --mom:#E0876A;
  --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 120px}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.topbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 18px;min-height:56px}
.topbar .title{flex:1;font-family:var(--f-serif);font-weight:600;color:var(--ink);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:1px solid var(--rule);background:var(--pane);border-radius:10px;padding:6px 12px;font-size:15px}
.tag{font-size:12px;color:var(--muted);border:1px dashed var(--rule);border-radius:999px;padding:1px 9px;white-space:nowrap}
h1,h2,h3{font-family:var(--f-serif);color:var(--ink);line-height:1.35;margin:0}
.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* 首页 */
.hero{margin:22px 0 8px;padding:22px;border-radius:18px;background:var(--c-sci-bg);display:flex;gap:16px;align-items:center}
.hero .eyebrow{font-size:13px;color:var(--muted);letter-spacing:.05em}
.hero h1{font-size:28px;margin:4px 0 6px}
.hero p{margin:0}
.hero svg{flex:none;width:96px;height:96px}
.note{font-size:14px;color:var(--muted);margin:10px 2px 18px}
.line{position:relative;padding-left:34px}
.groups{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.groups a{display:flex;align-items:center;min-height:44px;border:1px solid var(--rule);border-radius:10px;padding:4px 12px;color:var(--ink);background:var(--pane);text-decoration:none}
.groups a:hover,.groups a:focus-visible{background:var(--hover)}
.group-title,.star{scroll-margin-top:72px}
.group-title{position:relative;background:var(--bg);padding:12px 0;font-size:18px}
.line:before{content:"";position:absolute;left:13px;top:18px;bottom:18px;border-left:2px dashed var(--c-sci-2)}
.star{position:relative;background:var(--pane);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;margin:0 0 16px;box-shadow:var(--shadow)}
.star .dot{position:absolute;left:-34px;top:16px;width:28px;height:28px;border-radius:50%;background:var(--c-sci);border:2px solid var(--ink);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink)}
.star h2,.star h3{font-size:20px}
.star .dq{font-family:var(--f-hand);color:var(--ink);font-size:18px;margin:6px 0 12px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.act{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--bg);border-radius:12px;padding:9px 14px;min-height:48px;font-size:16px}
.act:hover{background:var(--hover)}
.act small{color:var(--muted);font-size:13px}
.act.done{background:var(--good-soft);border-color:var(--good)}
.act .tick{color:var(--good);font-weight:700}
.act small.new{color:var(--accent);font-weight:700}
.act.sim{border-color:var(--accent);border-width:2px}
.simframe{display:block;width:100%;border:0;min-height:600px;background:transparent;margin-top:8px}
.parent{display:block;margin:26px auto 0;border:1px dashed var(--rule);background:transparent;border-radius:12px;padding:10px 16px;color:var(--muted);font-size:15px}

/* 领航员对话 */
.chat{padding:18px 0 8px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:flex-end}
.row.me{justify-content:flex-end}
.ava{flex:none;width:40px;height:40px}
.bub{max-width:min(560px,82%);background:var(--pane);border:1px solid var(--rule);border-radius:16px 16px 16px 4px;padding:10px 14px;color:var(--ink);box-shadow:var(--shadow)}
.row.me .bub{background:var(--accent-soft);border-color:transparent;border-radius:16px 16px 4px 16px}
.bub.hint{background:var(--c-sky);border-color:transparent}
.bub.good{background:var(--good-soft);border-color:transparent}
.bub.bad{background:var(--bad-soft);border-color:transparent}
.bub .lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.bub.fig{max-width:min(620px,88%);padding:10px}
.fig-box{background:var(--bg);border-radius:12px;padding:6px}
.fig-box svg{display:block;width:100%;height:auto;max-height:52vh}
.fig-box [fill="#CCD6C0" i]{fill:var(--c-sci)} .fig-box [fill="#CFDCE6" i]{fill:var(--c-sky)}
.fig-box [fill="#ECCDB6" i]{fill:var(--c-math)} .fig-box [fill="#EFE4D6" i]{fill:var(--wash)}
.fig-box [fill="#4F7FA8" i]{fill:var(--dad)} .fig-box [fill="#C2603F" i]{fill:var(--mom)}
.fig-box [stroke="#4F7FA8" i]{stroke:var(--dad)} .fig-box [stroke="#C2603F" i]{stroke:var(--mom)}
.fig-box [stroke="#1F1E1C" i]{stroke:var(--ink)} .fig-box text{fill:var(--ink)}
/* 挑战配图（pie / rect / rect-unequal / number-line），和正式外壳 app/index.html 的 .figbox .fig 一样 */
.fig-box.q-fig{display:flex;justify-content:center;padding:8px}
.fig-box svg.fig{width:100%;max-width:340px}
svg.fig .k,svg.fig .k1{vector-effect:non-scaling-stroke}
.fig-shade{fill:var(--c-math)}
.fig-txt{fill:var(--ink);font-size:12px}
.cap{font-size:15px;color:var(--text);margin:8px 4px 2px}
.ask{margin-top:4px}
.ask .stem{font-weight:600}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choice{text-align:left;border:1.5px solid var(--ink);background:var(--bg);border-radius:12px;padding:10px 14px;min-height:48px;font-size:17px}
.choice:hover:not(:disabled){background:var(--hover)}
.choice:disabled{cursor:default}
.choice.wrong{border-color:var(--bad);color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.choice.right{border-color:var(--good);background:var(--good-soft);font-weight:600}
.numrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.numrow input{width:130px;font:inherit;font-size:20px;padding:8px 12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink)}
.numrow .unit{font-size:18px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 18px;min-height:48px;font-size:17px;font-weight:600}
.btn.ghost{background:var(--pane);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 26%);padding:26px 0 calc(14px + env(safe-area-inset-bottom,0))}
.dock .in{max-width:760px;margin:0 auto;padding:0 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.composer{background:var(--pane);border:1px solid var(--rule);border-radius:16px;padding:12px;box-shadow:var(--shadow);margin:6px 0}
textarea{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical;min-height:96px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px dashed var(--ink);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:16px;min-height:40px}
.row-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.endcard{background:var(--c-sci-bg);border-radius:16px;padding:18px;margin:16px 0}
.endcard h3{font-size:19px;margin-bottom:6px}
.endcard .row-btns{justify-content:flex-start}

/* 挑战 */
.qcard{background:var(--pane);border:1px solid var(--rule);border-radius:18px;padding:18px;margin-top:18px;box-shadow:var(--shadow)}
.progress{display:flex;gap:6px;margin:18px 0 0;align-items:center;color:var(--muted);font-size:14px}
.progress i{display:inline-block;width:20px;height:8px;border-radius:4px;background:var(--rule)}
.progress i.on{background:var(--ink)} .progress i.ok{background:var(--good)}
.qcard .stem{font-size:19px;font-weight:600;color:var(--ink)}
.fb{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.fb .bub{max-width:100%}
.counter{font-size:13px;color:var(--muted);text-align:right}

/* 记录 */
.rec h2{font-size:20px;margin:22px 0 8px}
.rec h3{font-size:17px;margin:14px 0 6px}
.rec ul{margin:4px 0;padding-left:20px}
.rec .muted{color:var(--muted)}
.rec pre{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--pane);border:1px solid var(--rule);border-radius:12px;padding:12px}

@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .28s ease-out both}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .draw .k,.draw .k1{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}
@media (max-width:520px){
  body{font-size:16px}
  .hero{padding:16px} .hero h1{font-size:24px} .hero svg{width:72px;height:72px}
  .bub{max-width:86%}
}
</style>
</head>

color:var(--ink)}\n.btn.choice{background:var(--bg);color:var(--ink);font-weight:500;text-align:left;flex:1 1 220px}\n.btn.choice:hover{background:var(--hover)}\n.btn:disabled{opacity:.4;cursor:default}\n.btn.small{min-height:40px;font-size:15px;padding:6px 14px;font-weight:500} .btn.tight{padding:9px 12px}\n.qbox{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}\n.qbox textarea{flex:1 1 260px;font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);min-height:64px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n@media (max-width:520px){ body{font-size:16px} h1{font-size:17px} .card header,.card footer{padding:8px 12px} .card footer{flex-wrap:wrap;row-gap:2px} .hint{white-space:nowrap} .readout{font-size:14px;flex:1 1 auto} }\n/* kit:grip 2026-11-14 —— 圆钮（「可抓」记号，g1.md A.4 G1～G8）。--grip 只给圆钮、托、按住按钮、焦点框用；--accent 不给任何控件用 */\n.btn.hold{touch-action:none;background:var(--grip);border-color:var(--grip);color:var(--bg);display:inline-flex;align-items:center;gap:10px;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}\n.btn.hold.on{filter:brightness(.82)}\n.btn.hold svg{width:18px;height:18px;flex:none}\n.btn.hold svg path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}\n.gfill{fill:var(--grip)} .gsoft{fill:var(--grip-soft)}\n.gring{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}\n.gring.on{stroke-width:3.2}\n.gridge{fill:none;stroke:var(--bg);stroke-width:2.2;stroke-linecap:round}\n.garrow{fill:none;stroke:var(--grip);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.gkbd{fill:none;stroke:var(--ink);stroke-width:1.6}\n#cue{fill:none;stroke:var(--grip);stroke-width:2.4;transform-box:fill-box;transform-origin:center;animation:cue 2.4s ease-out infinite}\n@keyframes cue{0%{transform:scale(1);opacity:.95}50%{transform:scale(1.8);opacity:0}100%{transform:scale(1.8);opacity:0}}\n@media (prefers-reduced-motion:reduce){#cue{animation:none;transform:scale(1.3);opacity:.9}}\n\n/* kit:lever —— 木杆、墨印与拓印纸 */\n:root{--beam:#E7CAA4;--grain:#96774E;--frame:#858473;--chalk:#E8E4C4;--board:#525C55;--cargo:#81958F;--cargo-edge:#536E67;--seal:#D4B665;--iron:#AA583C}\n@media(prefers-color-scheme:dark){:root{--beam:#68533E;--grain:#AA8B6B;--frame:#A8AC98;--chalk:#D6D6B6;--board:#3A443C;--cargo:#586D67;--cargo-edge:#93ABA1;--seal:#9F915B;--iron:#DF9876}}\n.wrap{max-width:810px}.card{box-shadow:0 1px 4px #0001}\n.wood,.cargo,.board,.skirt,.iron,.metal,.seal,.inkdot,.edge,.chalk,.thread,.pin,.mesh,.sealLine,.printBorder{stroke-linecap:round;stroke-linejoin:round}\n.wood{fill:var(--beam);stroke:var(--ink);stroke-width:2}\n.grain{fill:none;stroke:var(--grain);stroke-width:1.4;stroke-linecap:round}\n.board{fill:var(--board);stroke:var(--ink);stroke-width:1.6}\n.chalk{fill:var(--chalk);stroke:none}\n.cargo{fill:var(--cargo);stroke:var(--ink);stroke-width:2}\n.seal{fill:var(--seal);stroke:var(--ink);stroke-width:1}\n.sealLine{fill:none;stroke:var(--grain);stroke-width:1}\n.inkdot{fill:var(--ink);stroke:none}\n.iron{fill:none;stroke:var(--iron);stroke-width:6}\n.metal{fill:var(--sky);stroke:var(--ink);stroke-width:1.5}\n.pin{fill:var(--ink);stroke:var(--pane);stroke-width:1.1}\n.skirt{fill:var(--paper);stroke:var(--frame);stroke-width:1}\n.mesh{fill:none;stroke:var(--frame);stroke-width:1.25}\n.thread{fill:none;stroke:var(--ink);stroke-width:2}\n.edge{fill:none;stroke:var(--ink);stroke-width:2}\n.smallLetter,.inscription,.fine{fill:var(--text);font-family:var(--f-sans);font-size:15px}\n.inscription{font-weight:650}.fine{fill:var(--muted);font-size:14px}\n.imprint{stroke:var(--frame);stroke-width:.8}.imprint.left{fill:var(--apricot)}.imprint.right{fill:var(--sage)}\n.armBand{fill:var(--pane);opacity:.86}.armMark{stroke:var(--ink);stroke-width:1;fill:var(--apricot)}.armMark.right{fill:var(--sage)}\n.printBorder{fill:var(--paper);stroke:var(--rule);stroke-width:1.5}\n#printFormula{margin:0 16px 10px;padding:8px 12px;border-left:3px solid var(--frame);font:600 16px var(--f-mono);color:var(--ink)}\n#touch{touch-action:none;cursor:grab}#touch:active{cursor:grabbing}\n.actions{justify-content:flex-start}.actions .btn[hidden]{display:none}\n.card footer{flex-wrap:wrap;align-items:center}.hint{white-space:normal}\n.readout{font-family:var(--f-sans)}.readout b{color:var(--ink)}\n@media(max-width:520px){.wrap{padding:6px 6px 18px}.smallLetter,.inscription,.fine{font-size:18px}\n.card footer{display:grid;gap:0}.readout{text-align:left}.actions{gap:6px}.actions .btn{font-size:15px;padding:8px 11px}.actions .choice{flex:1 1 auto}}\n<\/style><\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\"><\/span><h1 id=\"title\"><\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 560 338\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <defs><clipPath id=\"cut-window\"><rect x=\"8\" y=\"29\" width=\"109\" height=\"69\"/><\/clipPath><\/defs>\n      <g id=\"bench\"><\/g>\n      <g id=\"dyn\"><\/g>\n      <g id=\"fx\"><circle id=\"cue\" cx=\"0\" cy=\"0\" r=\"10\" style=\"display:none\"/><\/g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n      <rect id=\"touch\" x=\"0\" y=\"0\" width=\"0\" height=\"0\" fill=\"transparent\"/><!-- 永不重画的触摸层（教训 25） -->\n    <\/svg>\n    <div id=\"printFormula\" hidden><\/div>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 木工台 ============ */\n// 忽略轻杆自重和支点摩擦，竖直载荷、等距孔。从水平松手后先向哪边转见 OpenStax 9.5。\n// 画出的倾角只表示初始转向，不把微小位移标成实测高度。\nconst MODEL = {\n  box: 6, last: 7, sealedSpan: 6, middle: 3, near: 4, tilt: 7,\n  read(s) {\n    const first = s.station === 1;\n    const leftArm = first ? s.hole : s.pivot;\n    const rightArm = first ? 1 : this.sealedSpan - s.pivot;\n    const leftWeight = first ? s.rings : s.weight;\n    const leftMoment = leftArm * leftWeight, rightMoment = rightArm * this.box;\n    return {station:s.station, leftArm,rightArm,leftWeight,rightWeight:this.box,leftMoment,rightMoment,\n      direction:Math.sign(rightMoment-leftMoment)};\n  }\n};\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\");\nconst initial = () => ({station:1,hole:1,rings:1,pivot:MODEL.middle,weight:MODEL.box});\nlet state = initial(), phase = \"guess\", sawLevel = false, sawLift = false, formula = false;\nlet proofs = new Map(), prints = [], replay = false, drag = null, artGrip = null;\nlet delayedLine = 0, dwellTimer = 0;\nconst motionReduced = window.matchMedia(\"(prefers-reduced-motion:reduce)\");\nconst clamp = (v,min,max) => Math.min(max,Math.max(min,v));\nconst path = (d,cls,attr=\"\") => `<path d=\"${d}\" class=\"${cls}\" ${attr}/>`;\nconst rect = (x,y,w,h,cls,extra=\"\") => `<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"1.2\" class=\"${cls}\" ${extra}/>`;\nconst circle = (x,y,r,cls,extra=\"\") => `<circle cx=\"${x}\" cy=\"${y}\" r=\"${r}\" class=\"${cls}\" ${extra}/>`;\nconst text = (x,y,words,cls=\"smallLetter\",anchor=\"middle\") => `<text x=\"${x}\" y=\"${y}\" class=\"${cls}\" text-anchor=\"${anchor}\">${words}<\/text>`;\nconst group = (art,attr=\"\") => `<g ${attr}>${art}<\/g>`;\nconst move = (x,y) => `transform=\"translate(${x} ${y})\"`;\nfunction geometry(s,locked=false) {\n  const first = s.station === 1, read = MODEL.read(s);\n  const pitch = first ? 54 : 65;\n  const start = first ? 36 : 82;\n  const pin = first ? MODEL.last : s.pivot;\n  const x = start + pin*pitch, y=163;\n  const degrees = locked ? 0 : read.direction*MODEL.tilt;\n  const a = degrees*Math.PI/180;\n  const point = i => [x+(i-pin)*pitch*Math.cos(a),y+(i-pin)*pitch*Math.sin(a)];\n  return {pitch,start,pin,x,y,degrees,point, last:first?MODEL.last+1:MODEL.sealedSpan,\n    left: first?MODEL.last-s.hole:0, right:first?MODEL.last+1:MODEL.sealedSpan};\n}\nfunction crate(x,y,weight) {\n  const width=49,h=44;\n  let art=rect(-width/2,0,width,h,\"cargo\",'data-part=\"crate\"');\n  art+=path(\"M-24 6L24 5.8M-24 36.7L24 36.5M-17 6.5V36M17 6V36M-17 35L15 7M-12 36L17 11\",\"edge\");\n  for(let i=0;i<weight;i++) art+=circle(-17+(i%3)*17,3+Math.floor(i/3)*37,1.35,\"inkdot\");\n  return group(art,move(x,y));\n}\nfunction cargo(read,point) {\n  const [x,y]=point;\n  return path(`M${x} ${y}v19l-23 20M${x} ${y+19}l23 20`,\"thread\")+crate(x,y+39,read.rightWeight);\n}\nfunction hangingLeft(s, point) {\n  const [x,y]=point;\n  let art=path(\"M0 0q3 14 0 23\",\"thread\");\n  if(s.station===1) {\n    for(let i=0;i<s.rings;i++){\n      const dx=s.rings===1?0:(i===0?-7:7);\n      art+=circle(dx,35,11,\"iron\",'data-part=\"ring\"')+circle(dx-5,26,1.5,\"inkdot\");\n    }\n  } else {\n    art+=path(\"M0 10L-30 63Q0 72 30 63L0 10\",\"thread\");\n    for(let i=0;i<s.weight;i++) {\n      const xx=-21+(i%3)*14, yy=57-Math.floor(i/3)*10;\n      art+=rect(xx,yy,13,9,\"metal\",'data-part=\"weight\"')+circle(xx+6,yy+3,1,\"inkdot\");\n    }\n  }\n  return group(art,move(x,y));\n}\nfunction fixedSeals(geo) {\n  let seals=\"\";\n  for(const i of [geo.left,geo.right]) {\n    const xx=geo.start+i*geo.pitch;\n    seals+=rect(xx-10,geo.y-11,20,19,\"seal\")+path(`M${xx-8} ${geo.y+6}l9 -16m-1 16l9 -16`,\"sealLine\");\n  }\n  return seals;\n}\nfunction armPrints(g, s) {\n  // 每跨一格，左环就在那段杆面上留下自己的墨印；右箱独占一格，留下六印。\n  function press(first,last,weight,side) {\n    let art=\"\";\n    for(let i=first;i<last;i++){\n      const center=g.start+(i+.5)*g.pitch;\n      const spacing=6.4, width=weight*spacing;\n      let marks=rect(center-width/2-2,g.y-10.5,width+4,8.8,\"armBand\");\n      for(let n=0;n<weight;n++)\n        marks+=rect(center-width/2+n*spacing+.5,g.y-10,5.3,6.8,\"armMark \"+side,'data-beam-stamp=\"\"');\n      art+=group(marks,`data-beam-segment=\"${side}\"`);\n    }\n    return art;\n  }\n  return press(g.left,g.pin,s.rings,\"left\")+press(g.pin,g.right,MODEL.box,\"right\");\n}\nfunction apparatus(s, kind, locked=false) {\n  const first=s.station===1, g=geometry(s,locked), read=MODEL.read(s);\n  const [lx,ly]=g.point(g.left),[rx,ry]=g.point(g.right);\n  const firstX=g.start-18, lastX=g.start+g.last*g.pitch+19;\n  let beam=path(`M${firstX} ${g.y-10} Q${g.x} ${g.y-13} ${lastX} ${g.y-10}l2 15Q${g.x} ${g.y+8} ${firstX-1} ${g.y+6}Z`,\"wood\");\n  beam+=path(`M${firstX+8} ${g.y-5}q34 -2 66 -1m32 0q18 -2 37 -1M${lastX-78} ${g.y-5}q28 -2 62 -1`,\"grain\");\n  for(let i=0;i<=g.last;i++){\n    const hx=g.start+i*g.pitch;\n    beam+=circle(hx,g.y,2.8,\"inkdot\");\n    if(first&&i<MODEL.last&&kind===\"live\"&&!locked){\n      beam+=rect(hx-g.pitch/2,g.y-13,g.pitch,27,\"\",'fill=\"transparent\" data-hole=\"'+(MODEL.last-i)+'\"');\n    }\n  }\n  if(first&&!locked)beam+=armPrints(g,s);\n  if(!first) beam+=fixedSeals(g);\n  const base=g.y+79;\n  let frame=path(`M${g.x} ${g.y+2}L${g.x+13} ${base-4}l-26 1Z`,\"wood\")\n    +path(`M${g.x-9} ${base-10}l9 -41m2 36l5 -15`,\"grain\")\n    +rect(g.x-17,base-4,34,9,\"wood\");\n  frame+=group(beam,`transform=\"rotate(${g.degrees} ${g.x} ${g.y})\"`);\n  frame+=circle(g.x,g.y,4.8,\"pin\",'data-part=\"pivot\"');\n  frame+=cargo(read,[rx,ry])+hangingLeft(s,[lx,ly]);\n  frame+=circle(lx,ly,4.5,\"pin\",'data-part=\"left-hook\"')+circle(rx,ry,4.5,\"pin\",'data-part=\"right-hook\"');\n  if(kind===\"live\"){\n    frame+=text(lx-(first&&s.hole===1?13:0),ly+(first?65:94),read.leftWeight+\" 牛\",\"inscription\");\n    frame+=text(rx+37,ry+66,read.rightWeight+\" 牛\",\"inscription\",\"start\");\n    if(locked) frame+=path(`M${g.x-18} ${g.y+16}v-26h7v25z`,\"metal\");\n  }\n  return group(frame,`data-lever=\"${kind}\"`);\n}\nfunction stamps(read) {\n  // 同一站的墨印共用一把尺，换孔后，六枚仍占原来的宽度。\n  const step=read.station===1?18:10, size=Math.min(step-1.5,15);\n  function row(y,side,n,perHole) {\n    let art=text(20,y+size*.8,side===\"left\"?\"左\":\"右\",\"inscription\",\"start\");\n    for(let i=0;i<n;i++){\n      const x=49+i*step;\n      art+=rect(x,y,size,size,\"imprint \"+side,`data-stamp=\"${side}\"`);\n      if(i%perHole===0) {\n        const last=x+(perHole-1)*step+size;\n        art+=path(`M${x} ${y+size+2}v2H${last}v-2`,\"mesh\");\n      }\n    }\n    return art;\n  }\n  return text(20,22,\"两边的方印\",\"fine\",\"start\")\n    +row(32,\"left\",read.leftMoment,read.leftWeight)+row(63,\"right\",read.rightMoment,read.rightWeight);\n}\nfunction chalkMark(x,y,w,h,attr){\n  // 纸上的缺口和断开的粉笔屑，在放大窗里也认得出来。\n  const start=x-w/2;\n  return group(path(`M0 0l${w*.55} .2l${w*.07} ${h*.45}l${w*.06} ${-h*.45}l${w*.22} .1l${-w*.015} ${h*.7}l${-w*.86} ${h*.2}Z`,\"chalk\")\n    +circle(w*.97,h*.48,h*.42,\"chalk\"),attr+\" \"+move(start,y));\n}\nfunction floorPaper() {\n  const g=geometry(initial(),true), [x,y]=g.point(g.right);\n  const bottom=y+83;\n  return rect(x-29,bottom-45,58,61,\"board\")\n    +chalkMark(x,bottom-3.2,36,2.8,'data-part=\"footprint\"');\n}\nfunction blowup(s,locked) {\n  const g=geometry(s,locked), [rx,ry]=g.point(g.right);\n  const gap=(g.y-ry)*5, baseline=84, boxY=baseline-gap;\n  // 纸框固定，木箱边缘相对粉笔印上下移动。\n  const art=rect(0,0,125,111,\"skirt\")+text(62,20,\"箱底放大\",\"inscription\")\n    +rect(8,29,109,69,\"board\")+chalkMark(62,baseline-5,88,4.5,'data-detail=\"footprint\"')\n    +group(rect(18,boxY-66,90,66,\"cargo\",'data-detail=\"crate\"')+\n      path(`M22 ${boxY-8}h82M31 ${boxY-8}l28 -18M48 ${boxY-8}l28 -18`,\"edge\"),\n      'clip-path=\"url(#cut-window)\"');\n  return path(`M${rx+30} ${ry+72}L532 170V110`,\"mesh\")+group(art,move(409,9));\n}\nfunction seesaw() {\n  const points=[[24,43],[131,26]], [left,right]=points;\n  let art=path(\"M97 32L106 54H89Z\",\"wood\")+path(\"M12 45L143 24l1 5L13 50Z\",\"wood\");\n  art+=circle(...left,3,\"pin\",'data-part=\"left-hook\"')+circle(...right,3,\"pin\",'data-part=\"right-hook\"');\n  // 公园座椅的远端和近端，跟此时的挂环和重箱同向。\n  art+=path(\"M12 44q10 -5 22 -2l1 3q-12 0 -22 3zM119 27q10 -5 21 -3l1 3l-22 4z\",\"metal\");\n  art+=path(\"M35 41l-3 -10q-1 -5 6 -6q4 0 4 4M117 27l-3 -10q-1 -5 -6 -4q-4 0 -3 4\",\"edge\");\n  art+=circle(21,21,4.8,\"wood\")+path(\"M21 27l3 11l8 1l3 11M24 30l11 -3\",\"edge\");\n  art+=circle(132,0,6.4,\"wood\")+path(\"M131 8l-5 13l-10 1l-1 12M129 11l-18 4\",\"edge\");\n  return group(art,'data-lever=\"seesaw\" transform=\"translate(263 260) scale(1.18)\"');\n}\nfunction markPrint(p) {\n  const shift=(p.pivot-MODEL.middle)*14;\n  return group(path(`M4 9h44M${23+shift} 9l-4 9h8z`,\"edge\")\n    +text(55,16,p.weight+\" 牛\",\"inscription\",\"start\"),'data-proof=\"\" transform=\"translate('+ (p.pivot===MODEL.middle?32:171)+' 327)\"');\n}\nfunction visualGrip(s) {\n  const first=s.station===1,g=geometry(s);\n  const [lx,ly]=g.point(g.left);\n  const x=first?lx:g.x,y=first?ly+90:g.y+111;\n  const r=Math.max(13,15*560/svg.clientWidth);\n  const nub=group(circle(0,0,r,\"gfill\")+circle(0,0,r,\"gring\")\n     +path(`M-4 ${-r*.38}v${r*.76}m4 ${-r*.76}v${r*.76}m4 ${-r*.76}v${r*.76}`,\"gridge\"),\n     `data-grip=\"${first?\"ring\":\"pivot\"}\" ${move(x,y)}`);\n  artGrip={x,y,pitch:g.pitch};\n  return path(first?`M${x} ${ly+48}q8 7 13 19t-9 17`:`M${x} ${g.y+83}v23`,\"mesh\")+nub;\n}\nfunction setTarget() {\n  const touch=$(\"touch\");\n  const r=24*560/Math.max(svg.clientWidth,1);\n  if(!artGrip){touch.setAttribute(\"width\",0);return;}\n  for(const [key,val] of Object.entries({x:artGrip.x-r,y:artGrip.y-r,width:2*r,height:2*r})) touch.setAttribute(key,val);\n}\nfunction printCard() {\n  let paper=\"\";\n  prints.forEach((s,i)=>{\n    const top=i*193;\n    const title=i===0?\"我的挂法\":\"我的支点\";\n    const r=MODEL.read(s);\n    paper+=group(rect(11,6,538,183,\"printBorder\")+text(29,34,title,\"inscription\",\"start\")\n      +text(531,34,`左 ${r.leftWeight} 牛　右 ${r.rightWeight} 牛`,\"fine\",\"end\")\n      +group(apparatus(s,\"print-\"+(i+1)), 'transform=\"translate(6 -64) scale(.97 .92)\"'),move(0,top));\n  });\n  return paper;\n}\nfunction paint() {\n  artGrip=null;\n  const end=phase===\"card\", first=state.station===1, locked=phase===\"guess\"||phase===\"unlatch\";\n  svg.setAttribute(\"aria-label\",end?\"我的两张杠杆拓印\":first?\"杠杆台，左右方向键移动铁环\":\"杠杆台，左右方向键移动支点\");\n  svg.setAttribute(\"viewBox\",end?\"0 0 560 392\":first?\"0 0 560 338\":\"0 0 560 358\");\n  if(end){$(\"dyn\").innerHTML=printCard();setTarget();return;}\n  const r=MODEL.read(state);\n  let art=first?floorPaper():\"\";\n  if(!locked) art+=stamps(r);\n  art+=apparatus(state,\"live\",locked);\n  if(first) {\n    art+=blowup(state,locked);\n    if(!locked&&r.direction<0&&state.hole===MODEL.last&&state.rings===1) art+=seesaw();\n  } else {\n    art+=text(325,44,\"钩上的封条\",\"fine\",\"start\");\n    art+=path(\"M418 48q41 6 49 48l3 40\",\"mesh\");\n    art+=path(\"M20 316H540\",\"mesh\");\n    proofs.forEach(p=>{art+=markPrint(p);});\n  }\n  if(!locked) art+=visualGrip(state);\n  $(\"dyn\").innerHTML=art;\n  setTarget();\n  sendState(r);\n}\n\nfunction say(words,tone=\"\"){\n  clearTimeout(delayedLine);\n  $(\"say\").textContent=words;\n  $(\"say\").className=\"bubble\"+(tone?\" \"+tone:\"\");\n}\nfunction header() {\n  const titles=[\"让粉笔印见光\",\"这次，挪下面\"];\n  $(\"station\").textContent=phase===\"card\"?\"星卡\":`第 ${state.station} 站 · 共 2 站`;\n  $(\"title\").textContent=phase===\"card\"?\"我的两根杠杆\":titles[state.station-1];\n}\nfunction footer() {\n  const locked=phase===\"guess\"||phase===\"unlatch\", first=state.station===1;\n  $(\"printFormula\").hidden=!(formula&&phase===\"play\"&&first);\n  if(!$(\"printFormula\").hidden){\n    const r=MODEL.read(state);\n    const relation=r.leftMoment===r.rightMoment?\"=\":(r.leftMoment>r.rightMoment?\"＞\":\"＜\");\n    $(\"printFormula\").textContent=`左 ${r.leftWeight} × ${r.leftArm} ${relation} ${r.rightWeight} × ${r.rightArm} 右（牛·格）`;\n  }\n  if(phase===\"card\"){\n    $(\"hint\").textContent=\"两张都是你亲手拓的\";\n    $(\"readout\").textContent=\"\";\n  } else if(locked){\n    $(\"hint\").textContent=\"牛是力的单位\";\n    $(\"readout\").textContent=\"木杆扣住了\";\n  } else if(first) {\n    $(\"hint\").textContent=\"拖铁环的尾带，也可以点孔\";\n    $(\"readout\").textContent=`左第 ${state.hole} 格 · ${state.rings} 牛　右第 1 格 · ${MODEL.box} 牛`;\n  } else {\n    $(\"hint\").textContent=\"拨三角木，再给左钩配重\";\n    $(\"readout\").textContent=`左 ${state.pivot} 格 · ${state.weight} 牛　右 ${MODEL.sealedSpan-state.pivot} 格 · ${MODEL.box} 牛`;\n  }\n}\nconst buttons=new Map();\nfunction showButtons(names) {\n  const box=$(\"actions\");\n  for(const [name,el] of buttons){ if(!names.includes(name)) el.hidden=true; }\n  for(const name of names){\n    let el=buttons.get(name);\n    if(!el){\n      el=document.createElement(\"button\");el.type=\"button\";el.className=\"btn\";\n      el.textContent=name;\n      el.addEventListener(\"click\",()=>command(name));\n      box.append(el);buttons.set(name,el);\n    }\n    el.hidden=false;\n    el.classList.toggle(\"choice\",phase===\"guess\");\n    el.classList.toggle(\"ghost\",![\"松开木杆\",\"拓下这根杆\",\"收进星卡\"].includes(name));\n  }\n}\nconst guesses=[{label:\"能，得挑个孔\",correct:true},{label:\"不能，箱子重\",mis:\"heavy-wins\"},{label:\"最多让杆停平\",mis:\"balance-ceiling\"}];\nfunction draw() {\n  header();paint();footer();\n  if(phase===\"guess\")return showButtons(guesses.map(g=>g.label));\n  if(phase===\"unlatch\")return showButtons([\"松开木杆\"]);\n  if(phase===\"card\")return showButtons([\"再玩第一站\",\"再玩第二站\",\"再玩一次\"]);\n  let controls=[];\n  if(state.station===1){\n    if(sawLevel)controls.push(formula?\"合上算式\":\"翻看算式\");\n    if(sawLevel&&sawLift)controls.push(state.rings===1?\"加一枚环\":\"取下一枚环\",\"拓下这根杆\");\n  } else {\n    controls.push(\"取下 1 牛\",\"加上 1 牛\");\n    if(MODEL.read(state).direction)controls.push(\"给我一点线索\");\n    else if(proofs.size===2)controls.push(\"收进星卡\");\n  }\n  showButtons(controls);\n  if(state.station===2){\n    buttons.get(\"取下 1 牛\").disabled=state.weight<=1;\n    buttons.get(\"加上 1 牛\").disabled=state.weight>=MODEL.box;\n  }\n}\nfunction ringInstructions(){\n  if(sawLevel&&sawLift) return \"桌边还有一枚环。挑一种挂法，拓在纸上带走。\";\n  return \"拖铁环换个孔，看箱底。\";\n}\nfunction noticePose() {\n  const r=MODEL.read(state);\n  if(state.station===1){\n    if(state.rings===1&&!r.direction)sawLevel=true;\n    const lifted=state.rings===1&&state.hole===MODEL.last;\n    if(lifted)sawLift=true;\n    if(lifted){\n      say(\"看箱底和那张粉笔纸。\");\n      delayedLine=setTimeout(()=>{\n        say(sawLevel?\"箱子没瘦。它把脚印留下了。喜欢这一摆，就把它拓下来。\":\"箱子没瘦。它把脚印留下了。回头找找杆停平的是哪一孔。\");\n      },motionReduced.matches?80:360);\n    } else if(!r.direction) say(sawLift?\"两排方印对齐。现在你可以换另一枚环，挑自己的拓印。\":\"两排方印对齐了。箱底碰着哪道记号？\");\n    else say(ringInstructions());\n  } else {\n    if(!r.direction){\n      proofs.set(state.pivot,{...state});\n      say(proofs.size===2?\"三角木靠近箱子，三牛就能托平。两枚钉子全程站岗，一步没挪。挑一档拓下来。\":\"这一档留下了平衡印。另一档也能让木杆停平吗？\");\n    } else say(\"哪头先低了？\");\n  }\n  draw();\n}\nfunction change(key,value) {\n  if(phase!==\"play\"||state[key]===value)return;\n  state[key]=value;\n  clearTimeout(dwellTimer);\n  if(drag){\n    // 每一孔都实时显示；只有停看或明确落定才收进发现。\n    drag.moved=true;\n    say(state.station===1?\"看看杆两头。\":\"两枚封钉还在。\");\n    draw();\n    dwellTimer=setTimeout(()=>{if(drag&&drag.moved)noticePose();},500);\n  }else noticePose();\n}\nfunction enter1() {\n  state=initial();phase=\"guess\";sawLevel=false;sawLift=false;formula=false;\n  proofs.clear();prints=[];replay=false;drag=null;\n  say(\"只有这枚小铁环。换个孔，能把箱子抬起来吗？\");draw();\n}\nfunction openFirst() {\n  phase=\"play\";state=initial();formula=false;sawLevel=false;sawLift=false;\n  say(ringInstructions());draw();\n}\nfunction openSecond() {\n  state={...initial(),station:2};phase=\"play\";formula=false;proofs.clear();\n  say(\"我把两头封上了。还剩哪块木头能搬？\");draw();\n}\nfunction showCard(){\n  phase=\"card\";replay=false;\n  if(!completed){completed=true;Host.complete({});}\n  say(\"封钉还在杆上。你搬过的铁环和三角木，都留在这两张拓印里了。\");\n  draw();\n}\nfunction command(name){\n  if(phase===\"guess\"){\n    const guess=guesses.find(g=>g.label===name);\n    if(!guess)return;\n    if(!sentPred.has(1)){\n      sentPred.add(1);Host.event(\"predicted\",{station:1,choice:guesses.indexOf(guess),correct:!!guess.correct,misconception:guess.mis||null});\n    }\n    phase=\"unlatch\";say(\"我在箱底描了个印。待会儿盯着那儿。\",\"hmm\");draw();\n  }else if(phase===\"unlatch\"&&name===\"松开木杆\"){openFirst();}\n  else if(phase===\"card\"){\n    if(name===\"再玩一次\"){sentPred.clear();sentObs.clear();lastState=\"\";enter1();}\n    if(name===\"再玩第一站\"){replay=true;openFirst();}\n    if(name===\"再玩第二站\"){replay=true;openSecond();}\n  }else if(phase===\"play\"&&state.station===1){\n    if((name===\"翻看算式\"||name===\"合上算式\")&&sawLevel){formula=!formula;draw();}\n    if(sawLevel&&sawLift){\n      if(name===\"加一枚环\")change(\"rings\",2);\n      if(name===\"取下一枚环\")change(\"rings\",1);\n      if(name===\"拓下这根杆\"){\n        prints[0]={...state};observedOnce(1);\n        if(replay)showCard();else openSecond();\n      }\n    }\n  }else if(phase===\"play\"&&state.station===2){\n    if(name===\"给我一点线索\"){\n      const direction=MODEL.read(state).direction;\n      if(direction)say(direction<0?\"试着从左盘取下一牛，再看哪头动。\":\"试着给左盘添一牛，再看。\");\n    }\n    if(name===\"取下 1 牛\")change(\"weight\",Math.max(1,state.weight-1));\n    if(name===\"加上 1 牛\")change(\"weight\",Math.min(MODEL.box,state.weight+1));\n    if(name===\"收进星卡\"&&proofs.size===2&&MODEL.read(state).direction===0){\n      prints[1]={...state};observedOnce(2);showCard();\n    }\n  }\n}\nfunction step(dx){\n  if(phase!==\"play\")return;\n  if(state.station===1) change(\"hole\",clamp(state.hole-dx,1,MODEL.last));\n  else change(\"pivot\",clamp(state.pivot+dx,MODEL.middle,MODEL.near));\n}\nsvg.addEventListener(\"keydown\",e=>{\n  if(phase!==\"play\"||![\"ArrowLeft\",\"ArrowRight\"].includes(e.key))return;\n  e.preventDefault();svg.classList.add(\"kbd\");step(e.key===\"ArrowLeft\"?-1:1);\n});\nconst touch=$(\"touch\");\ntouch.addEventListener(\"pointerdown\",e=>{\n  if(phase!==\"play\"||drag)return;\n  svg.classList.remove(\"kbd\");svg.focus({preventScroll:true});\n  const ctm=svg.getScreenCTM();\n  drag={id:e.pointerId,x:e.clientX,scale:Math.hypot(ctm.a,ctm.b),pitch:artGrip.pitch,\n    value:state.station===1?state.hole:state.pivot};\n  touch.setPointerCapture(e.pointerId);e.preventDefault();\n});\ntouch.addEventListener(\"pointermove\",e=>{\n  if(!drag||drag.id!==e.pointerId)return;\n  const steps=Math.round((e.clientX-drag.x)/(drag.pitch*drag.scale));\n  if(state.station===1)change(\"hole\",clamp(drag.value-steps,1,MODEL.last));\n  else change(\"pivot\",clamp(drag.value+steps,MODEL.middle,MODEL.near));\n});\nfunction release(e){\n  if(!drag||e.pointerId!==drag.id)return;\n  const selected=drag.moved&&e.type===\"pointerup\";\n  drag=null;\n  clearTimeout(dwellTimer);\n  if(selected)noticePose();\n}\nfor(const event of [\"pointerup\",\"pointercancel\",\"lostpointercapture\"])touch.addEventListener(event,release);\nsvg.addEventListener(\"click\",e=>{\n  if(phase!==\"play\"||drag)return;\n  const hole=e.target.closest(\"[data-hole]\");\n  if(hole&&state.station===1)change(\"hole\",Number(hole.dataset.hole));\n});\nnew ResizeObserver(()=>{if(phase===\"play\")paint();}).observe(svg);\n\n// 直接把舰长的原话交给宿主的信号站。\nconst questionArea=$(\"qarea\");\nconst question=document.createElement(\"button\");\nquestion.type=\"button\";question.className=\"btn ghost small\";question.textContent=\"我有个问题\";\nquestion.style.marginTop=\"12px\";questionArea.append(question);\nquestion.onclick=()=>{\n  if(questionArea.querySelector(\"textarea\"))return;\n  const field=document.createElement(\"textarea\");field.maxLength=120;field.placeholder=\"想问领航员什么？\";\n  const send=document.createElement(\"button\");send.type=\"button\";send.className=\"btn small\";send.textContent=\"发给领航员\";\n  const row=document.createElement(\"div\");row.className=\"qbox\";row.append(field,send);questionArea.append(row);field.focus();\n  send.onclick=()=>{if(field.value.trim()){Host.noteQuestion(field.value.trim());row.remove();say(\"好问题，我记下来了。\");}};\n};\nHost.ready();\nenter1();\n<\/script><\/body><\/html>\n", "id": "act.simulation.lever-dock-01", "kind": "simulation", "targets": ["physics.machine.lever"], "title": "让粉笔印见光"}, {"age_band": "G3-4", "body": {"items": [{"answer": {"choices": [{"correct": true, "id": "a", "text": "右头先低"}, {"feedback": "两边确实各两牛。右边的两牛，挂在了第三孔。", "id": "b", "misconception": "equal-loads", "text": "两头一样高"}], "type": "choice"}, "feedback": {"correct": "两边挂得一样重，你还看了孔。右钩离木尖更远，右头先低。", "wrong": "要让一样重的两端停平，两钩还得离木尖一样远。"}, "figure": {"src": "content/assets/physics.machine.lever/before-release.svg", "type": "svg"}, "hints": ["用手指从三角木分别走到两个钩。"], "id": "q1", "stem": "牛是力的单位。木杆两头各挂 2 牛。左钩离三角木 1 格，右钩 3 格。把杆放平再松手，会怎样？"}, {"answer": {"choices": [{"feedback": "左钩挂着五牛。右钩虽只有两牛，每牛却能盖三枚印。", "id": "a", "misconception": "heavy-wins", "text": "左边先低"}, {"correct": true, "id": "b", "text": "右边先低"}], "type": "choice"}, "feedback": {"correct": "左钩盖了五枚印，右钩盖了六枚。右头先低。", "wrong": "左钩离木尖只有一格。右钩的两牛各盖三枚印，得把它们合在一块儿数。"}, "hints": ["给左边的每牛盖一枚印，再给右边的每牛盖三枚。"], "id": "q2", "stem": "这回左钩挂 5 牛，离木尖 1 格。右钩挂 2 牛，离木尖 3 格。杆放平再松手，哪头先低？"}, {"answer": {"choices": [{"feedback": "右钩确实远。它的两排只有六枚印，左边的五排一共有十枚。", "id": "a", "misconception": "far-wins", "text": "更远的右头"}, {"correct": true, "id": "b", "text": "更近的左头"}], "type": "choice"}, "feedback": {"correct": "左钩离木尖近一格，可五排两枚凑成十枚，压过了右边的六枚。", "wrong": "右边的钩走得远，却只有两个环在那儿挂着。"}, "hints": ["给每一牛画一排，把经过的格数点进去。"], "id": "q3", "stem": "左钩在第 2 格，挂 5 牛。右钩在第 3 格，挂 2 牛。小伙伴说离木尖远的那头总会低。松开水平的杆，你押哪头？"}, {"answer": {"common_wrong": [{"feedback": "左钩的封条还在原孔，木尖已经走开一步。", "misconception": "pivot-carries-hooks", "value": 3}, {"feedback": "两格是木尖到右箱的路，你找到了另一头。", "misconception": "wrong-side", "value": 2}], "tolerance": 0, "type": "number", "unit": "格", "value": 4}, "feedback": {"correct": "原先左边留了三格。木尖朝右箱挪一步，左边那段路就多了一格。", "wrong": "从左钩起，一格一格往右数。走到新的木尖就停。"}, "hints": ["手指按住左钩，把另一根手指放在新的木尖上。"], "id": "q4", "stem": "两个挂钩钉死在杆 ard header,.card footer{padding:8px 12px} .card footer{flex-wrap:wrap;row-gap:2px} .hint{white-space:nowrap} .readout{font-size:14px;flex:1 1 auto} }\n/* kit:grip 2026-11-14 —— 圆钮（「可抓」记号，g1.md A.4 G1～G8）。--grip 只给圆钮、托、按住按钮、焦点框用；--accent 不给任何控件用 */\n.btn.hold{touch-action:none;background:var(--grip);border-color:var(--grip);color:var(--bg);display:inline-flex;align-items:center;gap:10px;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}\n.btn.hold.on{filter:brightness(.82)}\n.btn.hold svg{width:18px;height:18px;flex:none}\n.btn.hold svg path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}\n.gfill{fill:var(--grip)} .gsoft{fill:var(--grip-soft)}\n.gring{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}\n.gring.on{stroke-width:3.2}\n.gridge{fill:none;stroke:var(--bg);stroke-width:2.2;stroke-linecap:round}\n.garrow{fill:none;stroke:var(--grip);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.gkbd{fill:none;stroke:var(--ink);stroke-width:1.6}\n#cue{fill:none;stroke:var(--grip);stroke-width:2.4;transform-box:fill-box;transform-origin:center;animation:cue 2.4s ease-out infinite}\n@keyframes cue{0%{transform:scale(1);opacity:.95}50%{transform:scale(1.8);opacity:0}100%{transform:scale(1.8);opacity:0}}\n@media (prefers-reduced-motion:reduce){#cue{animation:none;transform:scale(1.3);opacity:.9}}\n/* kit:frac 2026-11-14 —— 分数一律上下结构（A.4 第 2 条）。HTML 里用 .frac，SVG 里用 fracS() */\n.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-family:var(--f-mono);font-size:.84em;margin:0 .2em;font-variant-numeric:tabular-nums}\n.frac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .28em .04em}\n.frac>span:last-child{padding:.04em .28em 0}\n.fl{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}\n.fs{fill:var(--ink);font-family:var(--f-mono);font-size:16px} .fm{fill:var(--ink);font-family:var(--f-mono);font-size:22px} .fb{fill:var(--ink);font-family:var(--f-mono);font-size:34px}\nbody.narrow .fs{font-size:20px} body.narrow .fm{font-size:26px} body.narrow .fb{font-size:38px}\n/* 模块自己的画面样式写在这里：字号全写在类上，窄屏在 body.narrow 里放大（教训 14、28）。下面几个类可以直接用 */\n.food{fill:var(--apricot)} .lead{fill:var(--accent)} .papr{fill:var(--paper)} .pane{fill:var(--pane)}\n.kacc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.one{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:7 6}\n.faint{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;opacity:.75}\n.lb{fill:var(--ink);font-family:var(--f-sans);font-size:17px}\n.lbg{fill:var(--muted);font-family:var(--f-sans);font-size:16px}\n.lbm{fill:var(--ink);font-family:var(--f-mono);font-size:17px}\n.big{fill:var(--ink);font-family:var(--f-mono);font-size:44px}\n.ttl{fill:var(--ink);font-family:var(--f-serif);font-size:26px}\n.sign{fill:var(--ink);font-family:var(--f-serif);font-size:24px}\n.tk{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round} .tkd{fill:none;stroke:var(--accent);stroke-width:1.1}\nbody.narrow .lb{font-size:21px} body.narrow .lbg{font-size:20px} body.narrow .lbm{font-size:20px}\nbody.narrow .big{font-size:50px} body.narrow .ttl{font-size:30px} body.narrow .sign{font-size:28px}\n/* ============ 台架样式 ============ */\n#stage{max-height:58vh}\n.rope{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}\n.steel{fill:var(--sky);stroke:var(--ink);stroke-width:2}\n.wood{fill:var(--apricot);stroke:var(--ink);stroke-width:2}\n.activePart{fill:var(--accent);stroke:var(--ink);stroke-width:2}\nbody.narrow .lb,body.narrow .lbm,body.narrow .lbg{font-size:21px}\n@media (max-width:520px){.card footer{display:flex;flex-direction:column;align-items:flex-start;gap:3px}.hint{white-space:normal}.readout{text-align:left}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\"><\/span><h1 id=\"title\"><\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 800 610\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <g id=\"bench\"><\/g>\n      <g id=\"dyn\"><\/g>\n      <g id=\"fx\"><circle id=\"cue\" cx=\"0\" cy=\"0\" r=\"10\" style=\"display:none\"/><\/g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n      <rect id=\"touch\" x=\"-400\" y=\"-400\" width=\"1600\" height=\"1410\" fill=\"transparent\"/><!-- 永不重画的触摸层（教训 25） -->\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n// 理想轻绳与轻滑轮、匀速。绳段等张力；总承重力 = 绳段数 × 张力。\n// OpenStax College Physics 2e §9.5；箱重、目标高度和试拉步长均为本码头设定。\nconst MODEL={weight:8,height:1,step:.25,scale:67};\nlet rope=0,compareSeen=false,mark=null;\nconst lifts=[];\nfunction rig(){\n  const strands=S.station===1?1:2, height=rope/strands,force=MODEL.weight/strands;\n  return {strands,height,force,work:force*rope};\n}\nconst limits=()=>MODEL.height*rig().strands;\n\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 共用零件：分数、「1」记号、圆钮、数线条  kit:parts ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 100 ? \"百\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;                // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 2;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1q\", hold: false, press: false, kbd: false, dirty: true, t1: 0, p1: 0, t2: 0, p2: 0 };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.innerHTML = (a.hold ? RIDGES : \"\") + `<span>${a.label}<\/span>`;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); if (v) touched(); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(ev, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(true); } });\n      b.addEventListener(\"keyup\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(false); } });\n      b.addEventListener(\"blur\", () => on(false));\n      b.addEventListener(\"contextmenu\", e => e.preventDefault());\n    } else {\n      b.addEventListener(\"click\", e => { if (performance.now() - born < 400 || (keyGuard && e.detail === 0)) return; a.go(e); });\n      if (guard){ b.disabled = true; const en = () => { setTimeout(() => { b.disabled = false; }, 120); removeEventListener(\"pointerup\", en, true); }; addEventListener(\"pointerup\", en, true); }\n    }\n    boxEl.append(b);\n  }\n  const first = boxEl.querySelector(\"button\");\n  if (first && !/^act/.test(S.mode)) first.focus({ preventScroll: true });\n  return boxEl;\n}\n// 猜测：只记下来，不在这里判对错的颜色。猜错的反馈先接住、再说清，然后一律去动手，让实物来回答\nfunction ask(question, options, onAnswer){\n  say(question);\n  actions(options.map((o, i) => ({ label: o.label, cls: \"choice\", go: () => {\n    if (!sentPred.has(S.station)){ sentPred.add(S.station); Host.event(\"predicted\", { station: S.station, choice: i, correct: !!o.correct, misconception: o.mis || null }); }\n    S.guess = S.guess || {}; S.guess[S.station] = o;\n    say(o.feedback, o.correct ? \"good\" : \"hmm\");\n    onAnswer(o);\n  }})));\n}\nfunction next(label, go, cls){ actions([{ label, go, cls }]); }\n// 星卡上选站重玩（#154）：replay 是正在重玩的站号，0 是从头往下走。重玩一站跳过开场和猜测题，直接进这一站的动手；\n// 揭晓完，原来「去第 k+1 站」「看我的星卡」的按钮换成「回星卡」（用 nextOr）。不出猜测题就不发 predicted；\n// observed 靠 observedOnce、complete 靠 completed，都只记第一次。每站怎么复位、怎么进动手是模块自己的事，写在 REPLAY[站号] 里\nlet replay = 0;\nconst REPLAY = {};\nfunction nextOr(label, go, cls){ if (replay) next(\"回星卡\", enterEnd); else next(label, go, cls); }\nfunction replayAt(k){ replay = k; gen++; S.station = k; hint(\"\"); readout(\"\"); disarmCue(); REPLAY[k](); }\nfunction restart(){ replay = 0; sentPred.clear(); sentObs.clear(); S.guess = {}; lastState = \"\"; enter1(); }   // 从头玩：和以前的「再玩一次」一样\nfunction endActions(){   // 星卡的按钮：从头玩 + 第 1 站…第 N 站。enterEnd() 最后调它\n  replay = 0;\n  actions([{ label: \"从头玩\", go: restart, cls: \"ghost tight\" }].concat(Array.from({ length: STATIONS }, (_, i) => ({ label: `第 ${i + 1} 站`, go: () => replayAt(i + 1), cls: \"tight\" }))));   // tight：手机上一行排得下\n}\n\n(function(){   // 「我有个问题」：随时可以问，发到信号站\n  const area = $(\"qarea\");\n  const open = document.createElement(\"button\");\n  open.type = \"button\"; open.className = \"btn ghost small\"; open.textContent = \"我有个问题\";\n  open.style.marginTop = \"12px\";\n  open.addEventListener(\"click\", () => {\n    if (area.querySelector(\"textarea\")) return;\n    const ta = document.createElement(\"textarea\"); ta.maxLength = 120; ta.placeholder = \"想问领航员什么？\";\n    const send = document.createElement(\"button\"); send.type = \"button\"; send.className = \"btn small\"; send.textContent = \"发给领航员\";\n    const bx = document.createElement(\"div\"); bx.className = \"qbox\"; bx.append(ta, send);\n    send.addEventListener(\"click\", () => { const q = ta.value.trim(); if (!q) return; Host.noteQuestion(q); bx.remove(); say(\"好问题，我记下来了。等会儿一起找答案。\"); });\n    area.append(bx); ta.focus();\n  });\n  area.append(open);\n})();\n\n// 第一屏的提醒（G6）：进入动手 1.5 秒还没碰，第一个圆钮外面扩出一圈细环；一碰就再也不出现\nlet cuePos = null, cueTimer = 0;\nfunction armCue(pos){ disarmCue(); const g = gen; cueTimer = setTimeout(() => { if (g === gen && /^act/.test(S.mode)){ cuePos = pos; placeCue(); } }, 1500); }\nfunction disarmCue(){ clearTimeout(cueTimer); cuePos = null; cueEl.style.display = \"none\"; }\nfunction touched(){ if (cuePos || cueTimer) disarmCue(); cueTimer = 0; }\nfunction placeCue(){ if (!cuePos) return; const [x, y, r] = cuePos(); cueEl.setAttribute(\"cx\", r1(x)); cueEl.setAttribute(\"cy\", r1(y)); cueEl.setAttribute(\"r\", r1((r || gripR()) + 2)); cueEl.style.display = \"\"; }   // 第三个数是被提醒的东西的半径（托里的一个）\n\n// 小屏收掉台面两侧的留白，动态零件始终处在同一把坐标尺上。\nfunction fitView(){\n  const small=svg.clientWidth<600;\n  document.body.classList.toggle(\"narrow\",small);\n  svg.setAttribute(\"viewBox\",small?\"100 22 600 355\":\"40 12 720 375\");\n}\naddEventListener(\"resize\",()=>{fitView();paint();});\nconst fmt=value=>String(Math.round(value*100)/100);\nconst line=(x1,y1,x2,y2,cls=\"k\",seed=19)=>P(Sk.line(x1,y1,x2,y2,seed,.45),cls);\nconst label=(x,y,text,cls=\"lb\")=>TC(x,y,text,cls);\nfunction crate(x,y,w,h,cls=\"wood\"){\n  return `<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"3\" class=\"${cls}\"/>`+\n    line(x+5,y+5,x+w-5,y+h-5,\"k1\")+line(x+5,y+h-5,x+w-5,y+5,\"k1\");\n}\nfunction station(number,title,mode){\n  gen++; S.station=number; S.mode=mode; S.press=false; disarmCue();\n  head(number,title); hint(\"\"); readout(\"\"); actions([]);\n  $(\"bench\").innerHTML=bench(); paint();\n}\nfunction controls(list,message,instruction){\n  say(message);hint(instruction);actions(list);\n  svg.focus({preventScroll:true});\n  armCue(()=>{const h=handle();return h?[h.x,h.y]:[0,0];});\n  paint();\n}\nfunction paint(){\n  gDyn.innerHTML=drawing();\n  const h=handle();\n  if(h) gDyn.insertAdjacentHTML(\"beforeend\",grip(h.x,h.y,[h.dx,h.dy],{on:S.press,kbd:S.kbd}));\n  placeCue();\n  if(S.mode!==\"end\") updateReading();\n}\nfunction card(title,summary){\n  gen++; S.station=STATIONS+1; S.mode=\"end\"; head(0,title); hint(\"\"); readout(\"\"); disarmCue();\n  $(\"bench\").innerHTML=\"\"; paint(); say(summary,\"good\");\n  if(!completed){completed=true;Host.complete({});}\n  endActions();\n}\nfunction toSvg(e){\n  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;\n  return pt.matrixTransform(svg.getScreenCTM().inverse());\n}\nfunction hit(e){\n  const h=handle();if(!h)return null;\n  const q=toSvg(e);return Math.hypot(q.x-h.x,q.y-h.y)<=hitR()?h:null;\n}\nlet drag=null;\nsvg.addEventListener(\"touchstart\",e=>{if(e.touches.length===1&&hit(e.touches[0]))e.preventDefault();},{passive:false});\nsvg.addEventListener(\"pointerdown\",e=>{\n  const h=hit(e);if(!h||drag)return;\n  drag={id:e.pointerId,start:toSvg(e),h};S.press=true;S.kbd=false;svg.classList.remove(\"kbd\");\n  touched();svg.setPointerCapture(e.pointerId);e.preventDefault();paint();\n});\nsvg.addEventListener(\"pointermove\",e=>{\n  if(!drag){svg.style.cursor=hit(e)?\"grab\":\"\";return;}\n  if(e.pointerId!==drag.id||!handle())return;\n  const q=toSvg(e),{start,h}=drag;\n  move(h.value+((q.x-start.x)*h.dx+(q.y-start.y)*h.dy)/h.scale);\n});\nfor(const name of [\"pointerup\",\"pointercancel\",\"lostpointercapture\"])svg.addEventListener(name,e=>{\n  if(drag?.id!==e.pointerId)return;\n  drag=null;S.press=false;paint();\n});\nsvg.addEventListener(\"keydown\",e=>{\n  const h=handle();if(!h)return;\n  const step={ArrowRight:h.dx,ArrowLeft:-h.dx,ArrowUp:-h.dy,ArrowDown:h.dy}[e.key];\n  if(step===undefined||Math.abs(step)<.01)return;\n  e.preventDefault();S.kbd=true;svg.classList.add(\"kbd\");touched();move(h.value+Math.sign(step)*h.step);\n});\nfunction ticket(y,title,text){\n  return `<rect x=\"133\" y=\"${y}\" width=\"534\" height=\"83\" rx=\"9\" fill=\"var(--paper)\"/>`+\n    T(154,y+32,title,\"lbg\")+T(154,y+65,text,\"lbm\");\n}\n\n\nfunction bench(){\n  const targetY=321-MODEL.scale*MODEL.height;\n  return line(180,43,471,43)+line(180,50,471,50)+line(191,51,191,350,\"k1\")+\n    line(167,351,487,351)+line(210,targetY,320,targetY,\"kf\")+T(150,targetY-9,\"升高 \"+MODEL.height+\" m\",\"lbg\");\n}\nfunction hand(){\n  const fixed=S.station===1;\n  return {x:363,y:(fixed?129:222)+(fixed?1:-1)*MODEL.scale*rope,dx:0,dy:fixed?1:-1,value:rope,step:MODEL.step,scale:MODEL.scale};\n}\nfunction handle(){return S.mode===\"actRope\"?hand():null;}\nfunction move(value){\n  rope=clamp(Math.round(value/MODEL.step)*MODEL.step,0,limits());\n  if(S.station===2&&!compareSeen&&rope>=MODEL.height){\n    // 第一次在与定滑轮相同的绳长停住，让孩子看一眼半高处的箱底。\n    rope=MODEL.height;compareSeen=true;S.mode=\"compare\";disarmCue();\n    say(`绳头同样走了 ${MODEL.height} m，箱子只升了 ${fmt(rig().height)} m。这次滑轮也跟着箱子往上走了。`);\n    next(\"补收一段绳\",beginPull);\n  }\n  paint();\n}\nfunction wheel(x,y,r,turn){\n  let spokes=\"\";\n  for(let i=0;i<4;i++){\n    const a=i*Math.PI/2;spokes+=line(x+8*Math.cos(a),y+8*Math.sin(a),x+(r-5)*Math.cos(a),y+(r-5)*Math.sin(a),\"k1\",42+i);\n  }\n  return `<circle cx=\"${x}\" cy=\"${y}\" r=\"${r}\" class=\"steel\"/><g id=\"wheelSpokes\" transform=\"rotate(${turn*180/Math.PI} ${x} ${y})\">${spokes}<\/g>`+\n    `<circle cx=\"${x}\" cy=\"${y}\" r=\"5\" fill=\"var(--ink)\"/>`;\n}\nfunction drawing(){\n  if(S.mode===\"end\")return label(400,68,\"同高吊运单\",\"ttl\")+\n    lifts.map((q,i)=>ticket(90+i*96,i===0?\"轮子挂在架上\":\"轮子跟着箱子走\",\n      `${q.strands} 段托重　${q.force} N × ${fmt(q.length)} m = ${fmt(q.work)} J`)).join(\"\")+\n    label(400,325,`我的绳印：收 ${fmt(mark)} m，箱升 ${fmt(mark/lifts[1].strands)} m`,\"lb\");\n  const fixed=S.station===1,{height,force,strands}=rig();\n  const pull=hand(),cx=332,r=31,cy=fixed?100:233-height*MODEL.scale;\n  const bx=fixed?cx-r:cx,base=321-height*MODEL.scale,top=base-45;\n  // SVG 的正角为顺时针：定轮右缘随绳向下，动轮左缘相对轮心向下。\n  const turn=(fixed?1:-1)*height*MODEL.scale/r;\n  const rigging=fixed?\n    line(cx,52,cx,cy)+P(`M${cx-r} ${top-16}V${cy}a${r} ${r} 0 0 1 ${2*r} 0V${pull.y}`,\"rope\"):\n    P(`M${cx-r} 51V${cy}a${r} ${r} 0 0 0 ${2*r} 0V${pull.y}`,\"rope\")+\n      line(cx,cy,cx,top-16);\n  let out=wheel(cx,cy,r,turn)+rigging+line(bx,top-16,bx-23,top)+line(bx,top-16,bx+23,top)+crate(bx-37,top,74,45);\n  out+=label(bx,base+24,MODEL.weight+\" N\",\"lbm\");\n  out+=`<circle cx=\"${pull.x}\" cy=\"${pull.y}\" r=\"8\" class=\"${handle()?\"activePart\":\"wood\"}\"/>`;\n  if(!fixed)out+=`<circle cx=\"${cx-r}\" cy=\"51\" r=\"5\" fill=\"var(--ink)\"/>`;\n  if(S.mode!==\"guess\"){\n    // 指针与承重绳的张力取自同一模型，刻线表示牛。\n    const rulerX=407,startY=fixed?129:222,direction=fixed?1:-1;\n    out+=line(rulerX,startY,rulerX,startY+direction*limits()*MODEL.scale,\"k1\");\n    for(let m=0;m<=limits();m+=MODEL.step){\n      const y=startY+direction*m*MODEL.scale,whole=Number.isInteger(m);\n      out+=line(rulerX,y,rulerX+(whole?12:6),y,\"k1\");\n      if(whole)out+=T(rulerX+16,y+5,m,\"lbm\");\n    }\n    out+=T(rulerX-8,Math.max(startY,startY+direction*limits()*MODEL.scale)+34,\"绳尺 m\",\"lbg\");\n    const zx=478,zy=131,span=140;\n    out+=T(zx,zy-37,\"绳头测力计\",\"lb\")+P(box(zx,zy-19,span,42,41,.45),\"k1\");\n    for(let n=0;n<=MODEL.weight;n+=2){\n      const x=zx+8+(span-16)*n/MODEL.weight;\n      out+=line(x,zy+5,x,zy+14,\"k1\")+TC(x,zy+47,n,\"lbm\");\n    }\n    const x=zx+8+(span-16)*force/MODEL.weight;\n    out+=P(`M${x-5} ${zy-12}l5 15 5-15z`,\"lead\")+T(zx,zy+87,`手拉 ${force} N`,\"lb\")+\n      T(zx,zy+125,`${strands} 段绳托着箱`,\"lb\");\n  }\n  return out;\n}\nfunction updateReading(){\n  if(S.mode===\"guess\"){readout(\"箱重 \"+MODEL.weight+\" N\");return;}\n  const q=rig();\n  readout(`轮绳很轻，忽略摩擦，按匀速提升来读数<br>绳头走 <b>${fmt(rope)} m<\/b>　箱升 <b>${fmt(q.height)} m<\/b><br>手拉 ${q.force} N　手做功 ${fmt(q.work)} J`);\n  sendState({station:S.station,rope, height:q.height, force:q.force, work:q.work,strands:q.strands});\n}\nfunction enter1(){\n  rope=0;compareSeen=false;mark=null;lifts.length=0;\n  station(1,\"轮子挂在架上\",\"guess\");\n  ask(\"8 N 读作八牛，这是箱子的重力。一个轮子挂在架上，一个轮子挂在箱上。拉起来一样费力吗？\",[\n    {label:\"一样，都只用一个轮子\",mis:\"wheel-count\",feedback:\"轮子确实都只有一个。试着找找，几段绳在往上托。\"},\n    {label:\"要看绳子怎样托住箱子\",correct:true,feedback:\"先装第一条绳。绳头和箱底各有一把尺。\"}\n  ],()=>next(\"拉起第一箱\",()=>{rope=0;beginPull();}));\n}\nfunction beginPull(){\n  station(S.station,S.station===1?\"把箱底升到刻线\":\"轮子跟着箱子走\",\"actRope\");\n  const list=[{label:\"对齐刻线\",go:finishLift}];\n  if(S.station===2&&compareSeen)list.unshift({label:\"在绳上留印\",cls:\"ghost\",go:()=>{\n    mark=rope;say(`绳印留在 ${fmt(mark)} m，这时箱子升了 ${fmt(rig().height)} m。`);\n  }});\n  controls(list,S.station===1?\"这架轮和绳都很轻，转起来没有摩擦。向下匀速拖绳头，吊到虚线处。m 是米，做功用焦（J）记。\":\n    compareSeen?\"向上再收一段绳。你也可以在绳上选个位置，留一道自己的印。\":\"这次轮轴跟着箱子走。向上收绳，先走和上次一样远。\",\"上下拖绳头，或按上下键\");\n}\nfunction finishLift(){\n  const q=rig();\n  if(q.height!==MODEL.height){say(\"看箱子的底边。它还要往上走一点，才能和虚线对齐。\",\"hmm\");return;}\n  lifts[S.station-1]={...q,length:rope};S.mode=\"talk\";disarmCue();observedOnce(S.station);paint();hint(\"\");\n  if(S.station===1){say(`绳头走 ${fmt(rope)} m，箱子也走 ${fmt(q.height)} m。一段绳独自托着整箱，轮子倒是一步没走。`,\"good\");nextOr(\"把轮子挂到箱上\",enter2);}\n  else{\n    if(mark===null)mark=MODEL.height;\n    say(`两段绳每段托 ${q.force} N。箱子一样高，手只用一半的力，却多走了一段路。J 读作焦，记录力沿途做的功。`,\"good\");\n    nextOr(\"收下吊运单\",enterEnd);\n  }\n}\nfunction enter2(){rope=0;compareSeen=false;mark=null;S.station=2;beginPull();}\nfunction enterEnd(){card(\"同高吊运单\",\"两次都把同一箱吊到同一刻线。绳印记下了你亲手拉到的位置。\");}\nREPLAY[1]=()=>{rope=0;beginPull();};REPLAY[2]=enter2;\n\nHost.ready();\nfitView();\nenter1();\n<\/script><\/body><\/html>\n", "id": "act.simulation.pulley-dock-01", "kind": "simulation", "targets": ["physics.machine.pulley"], "title": "港口吊箱机"}, {"age_band": "G3-4", "body": {"items": [{"answer": {"choices": [{"correct": true, "id": "a", "text": "8 牛"}, {"feedback": "轮子两旁都有绳，可直接提箱子的只有一段。", "id": "b", "misconception": "wheel-count", "text": "4 牛"}, {"feedback": "轮子改了拉绳方向，箱子并没有变重。", "id": "c", "misconception": "wheel-count", "text": "16 牛"}], "type": "choice"}, "feedback": {"correct": "跟着箱子的挂钩找，一段绳向上托它。这一段的拉力等于箱重。", "wrong": "从箱子的挂钩往上看。"}, "hints": ["从箱子的挂钩往上看。", "数真正向上提箱子的绳段。"], "id": "q1", "stem": "绳和轮都很轻，没有摩擦。绳绕过天花板上的定滑轮，一端挂 8 牛的箱子。向下匀速拉另一端，要用多大力？"}, {"answer": {"common_wrong": [{"feedback": "若每段绳都拉 10 牛，两段合起来就超过箱重了。", "misconception": "wheel-count", "value": 10}], "tolerance": 0, "type": "number", "unit": "牛", "value": 5}, "feedback": {"correct": "两段绳拉力一样，托住的总重是 10 牛。每段分到 5 牛。", "wrong": "只数直接托着动滑轮的绳段。"}, "hints": ["只数直接托着动滑轮的绳段。", "让各段绳的拉力加在一起，刚好等于箱重。"], "id": "q2", "stem": "轻动滑轮和箱子一起匀速上升。两段竖直的轻绳托着重 10 牛的箱子，不计摩擦。手拉绳头要用几牛？"}, {"answer": {"common_wrong": [{"feedback": "你只数了篮子向上走的路。轮子两边的绳都会变短。", "misconception": "wheel-count", "value": 3}], "tolerance": 0, "type": "number", "unit": "米", "value": 6}, "feedback": {"correct": "两段各缩短 3 米，手端总共收进 3 + 3 = 6 米。", "wrong": "观察会变短的绳段。"}, "hints": ["观察会变短的绳段。", "把每段缩短的长度加在一起。"], "id": "q3", "stem": "一根绷紧的绳不会伸长。两段竖直绳托着动滑轮和篮子。篮子匀速升高 3 米，手要收进几米绳？"}, {"answer": {"choices": [{"feedback": "新增的轮子固定在天花板上，没有给箱子增加承重绳段。", "id": "a", "misconception": "wheel-count", "text": "手需要的力减半"}, {"feedback": "绕行让手能朝下拉，原有两段绳仍在一起托箱子。", "id": "b", "misconception": "wheel-count", "text": "手需要的力加倍"}, {"correct": true, "id": "c", "text": "手需要的力和原来一样"}], "type": "choice"}, "feedback": {"correct": "看哪几段绳随箱子缩短，就能找到分担重量的绳段。新增的轮子只改拉绳方向。", "wrong": "跟踪新轮子挂在哪里。"}, "hints": ["跟踪新轮子挂在哪里。", "比较改绳路前后，直接向上拉动滑轮的绳段数。"], "id": "q4", "stem": "一台理想吊机有两段竖直绳托箱。再在天花板加一个定滑轮，只把绳头转向下。匀速升起同一箱子，手感怎样？"}, {"answer": {"choices": [{"feedback": "货升高时，两段承重绳都会缩短。", "id": "a", "misconception": "wheel-count", "text": "力和能拉的绳都够"}, {"correct": true, "id": "b", "text": "力够，能拉的绳不够"}, {"feedback": "比较手的力时，要先把箱重分到两段绳上。", "id": "c", "misconception": "wheel-count", "text": "绳够，手的力不够"}], "type": "choice"}, "feedback": {"correct": "每段是 6 牛，手能拉动。升高 2 米要收 4 米绳，现有行程还差 1 米。", "wrong": "给手力和可拉绳长各画一个勾选框。"}, "hints": ["给手力和可拉绳长各画一个勾选框。", "先用箱重除以段数，再用升高量乘段数，分别核对。"], "id": "q5", "stem": "两段竖直绳托着理想动滑轮。箱重 12 牛，要匀速升高 2 米。手能拉 7 牛，绳头只剩 3 米可拉。能到吗？"}], "shuffle": false}, "duration_min": 7, "id": "act.quiz.pulley-dock-01", "kind": "quiz", "targets": ["physics.machine.pulley"], "title": "给吊箱选绳路"}], "dq": "都是一个轮子，为什么有的能把手上的力减半？", "id": "physics.machine.pulley", "misconceptions": {"wheel-count": "看轮数不看承重段"}, "title": "滑轮：谁在托箱子"}, {"activities": [{"age_band": "G5-6", "duration_min": 7, "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>伸缩坡板<\/title>\n<style>\n/* kit:base —— 颜色、卡片、气泡、按钮。色值不要改；模块自己的样式写在最后一段 */\n/* 长按不选字、不弹菜单（#156）。输入框照常能选能改 */\nhtml{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\ninput,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}\n:root{\n  --bg:#F5F4EE; --pane:#FBFAF6; --rule:#E0DCD0; --hover:#E7E4D9;\n  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;\n  --accent:#C2603F; --accent-soft:#F3E0D6;\n  --grip:#2A7F7C; --grip-soft:#D3E8E5;\n  --sage:#CCD6C0; --sage-bg:#DCE3D2; --sky:#CFDCE6; --apricot:#ECCDB6; --paper:#EFE4D6;\n  --dad:#4F7FA8; --mom:#C2603F; --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;\n  --f-serif:\"Noto Serif SC\",\"Source Han Serif SC\",\"Songti SC\",Georgia,serif;\n  --f-sans:\"Noto Sans SC\",\"PingFang SC\",\"Microsoft YaHei\",system-ui,sans-serif;\n  --f-mono:ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n  color-scheme:light;\n}\n@media (prefers-color-scheme:dark){:root{\n  --bg:#1E1E1E; --pane:#252525; --rule:#353535; --hover:#2E2E2E;\n  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;\n  --accent:#E0876A; --accent-soft:#3A2A24;\n  --grip:#5FC4BE; --grip-soft:#1F3634;\n  --sage:#3C4836; --sage-bg:#28301F; --sky:#2D3B47; --apricot:#5A4536; --paper:#33302A;\n  --dad:#7FA9CF; --mom:#E0876A; --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;\n  color-scheme:dark;\n}}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}\nbutton{font:inherit;color:inherit;cursor:pointer}\n.wrap{max-width:820px;margin:0 auto;padding:12px 14px 28px}\n.card{background:var(--pane);border:1px solid var(--rule);border-radius:18px;overflow:hidden}\n.card header,.card footer{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 16px}\n.card header{border-bottom:1px solid var(--rule)}\n.card footer{border-top:1px solid var(--rule);min-height:52px;align-items:center}\n.station{font-size:13px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}\nh1{font-family:var(--f-serif);font-size:20px;font-weight:600;color:var(--ink);margin:0;text-align:right}\n.hint{font-size:14px;color:var(--muted)}\n.readout{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px;text-align:right}\n.readout b{color:var(--accent);font-weight:600}\nsvg#stage{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}\nsvg#stage:focus,svg#stage:focus-visible{outline:none}\nsvg#stage.kbd:focus-visible{outline:2px solid var(--grip);outline-offset:-4px}\n.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}\n.kf{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:3 6}\n.
