"0\" cy=\"0\" r=\"10\" style=\"display:none\"/><\/g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n    <\/svg>\n    <div id=\"bench\" class=\"bench\" hidden><\/div>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* Curio · 动手探索模块骨架。复制本文件，把 {{…}} 换成具体内容，换掉两个示例站。\n   2026-11-14 起以切分机 act.simulation.fair-cut-01 为准（Luka 验收通过后抽出来的）：带 kit: 记号的段落照抄不改，\n   要改就先改这里，再同步到用它的模块。先读 lessons.md 和 docs/constellations/zero-to-one/notes-star1.md。 */\n/* ============ 1. 真相模型：页面上的每个数字都从这里算，每个值旁边写出处。只放数和纯函数，不碰页面 ============ */\nconst MODEL = {\n  emptyMass: 2, cargoMass: 2,     // 模型设定：空车 2 千克，可装一件 2 千克的货。\n  push: 6, drag: 2, seconds: 1,   // 两车从静止起步；这段时间受到向左 2 牛顿的恒阻力。\n  minPush: 4, maxPush: 10, step: 2,\n  initialSpeed: 0,                // 水平直轨上，同时从地面看两辆车。\n  motion(mass, force, seconds){\n    const net = force - this.drag;\n    const acceleration = net / mass;  // OpenStax College Physics 2e 4.3：水平合力产生的加速度。\n    return {mass, force, net, acceleration, speed:this.initialSpeed + acceleration*seconds,\n      distance:this.initialSpeed*seconds + acceleration*seconds*seconds/2};\n  }\n};\n\n\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 共用零件：分数、「1」记号、圆钮、数线条  kit:parts ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 100 ? \"百\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;                // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 2;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1q\", hold: false, press: false, kbd: false, dirty: true, t1: 0, p1: 0, t2: 0, p2: 0 };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.innerHTML = (a.hold ? RIDGES : \"\") + `<span>${a.label}<\/span>`;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); if (v) touched(); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(ev, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(true); } });\n      b.addEventListener(\"keyup\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); on(false); } });\n      b.addEventListener(\"blur\", () => on(false));\n      b.addEventListener(\"contextmenu\", e => e.preventDefault());\n    } else {\n      b.addEventListener(\"click\", e => { if (performance.now() - born < 400 || (keyGuard && e.detail === 0)) return; a.go(e); });\n      if (guard){ b.disabled = true; const en = () => { setTimeout(() => { b.disabled = false; }, 120); removeEventListener(\"pointerup\", en, true); }; addEventListener(\"pointerup\", en, true); }\n    }\n    boxEl.append(b);\n  }\n  const first = boxEl.querySelector(\"button\");\n  if (first && !/^act/.test(S.mode)) first.focus({ preventScroll: true });\n  return boxEl;\n}\n// 猜测：只记下来，不在这里判对错的颜色。猜错的反馈先接住、再说清，然后一律去动手，让实物来回答\nfunction ask(question, options, onAnswer){\n  say(question);\n  actions(options.map((o, i) => ({ label: o.label, cls: \"choice\", go: () => {\n    if (!sentPred.has(S.station)){ sentPred.add(S.station); Host.event(\"predicted\", { station: S.station, choice: i, correct: !!o.correct, misconception: o.mis || null }); }\n    S.guess = S.guess || {}; S.guess[S.station] = o;\n    say(o.feedback, o.correct ? \"good\" : \"hmm\");\n    onAnswer(o);\n  }})));\n}\nfunction next(label, go, cls){ actions([{ label, go, cls }]); }\n// 星卡上选站重玩（#154）：replay 是正在重玩的站号，0 是从头往下走。重玩一站跳过开场和猜测题，直接进这一站的动手；\n// 揭晓完，原来「去第 k+1 站」「看我的星卡」的按钮换成「回星卡」（用 nextOr）。不出猜测题就不发 predicted；\n// observed 靠 observedOnce、complete 靠 completed，都只记第一次。每站怎么复位、怎么进动手是模块自己的事，写在 REPLAY[站号] 里\nlet replay = 0;\nconst REPLAY = {};\nfunction nextOr(label, go, cls){ if (replay) next(\"回星卡\", enterEnd); else next(label, go, cls); }\nfunction replayAt(k){ replay = k; gen++; S.station = k; hint(\"\"); readout(\"\"); disarmCue(); REPLAY[k](); }\nfunction restart(){ replay = 0; sentPred.clear(); sentObs.clear(); S.guess = {}; lastState = \"\"; enter1(); }   // 从头玩：和以前的「再玩一次」一样\nfunction endActions(){   // 星卡的按钮：从头玩 + 第 1 站…第 N 站。enterEnd() 最后调它\n  replay = 0;\n  actions([{ label: \"从头玩\", go: restart, cls: \"ghost tight\" }].concat(Array.from({ length: STATIONS }, (_, i) => ({ label: `第 ${i + 1} 站`, go: () => replayAt(i + 1), cls: \"tight\" }))));   // tight：手机上一行排得下\n}\n\n(function(){   // 「我有个问题」：随时可以问，发到信号站\n  const area = $(\"qarea\");\n  const open = document.createElement(\"button\");\n  open.type = \"button\"; open.className = \"btn ghost small\"; open.textContent = \"我有个问题\";\n  open.style.marginTop = \"12px\";\n  open.addEventListener(\"click\", () => {\n    if (area.querySelector(\"textarea\")) return;\n    const ta = document.createElement(\"textarea\"); ta.maxLength = 120; ta.placeholder = \"想问领航员什么？\";\n    const send = document.createElement(\"button\"); send.type = \"button\"; send.className = \"btn small\"; send.textContent = \"发给领航员\";\n    const bx = document.createElement(\"div\"); bx.className = \"qbox\"; bx.append(ta, send);\n    send.addEventListener(\"click\", () => { const q = ta.value.trim(); if (!q) return; Host.noteQuestion(q); bx.remove(); say(\"好问题，我记下来了。等会儿一起找答案。\"); });\n    area.append(bx); ta.focus();\n  });\n  area.append(open);\n})();\n\n// 第一屏的提醒（G6）：进入动手 1.5 秒还没碰，第一个圆钮外面扩出一圈细环；一碰就再也不出现\nlet cuePos = null, cueTimer = 0;\nfunction armCue(pos){ disarmCue(); const g = gen; cueTimer = setTimeout(() => { if (g === gen && /^act/.test(S.mode)){ cuePos = pos; S.dirty = true; } }, 1500); }\nfunction disarmCue(){ clearTimeout(cueTimer); cuePos = null; cueEl.style.display = \"none\"; }\nfunction touched(){ if (cuePos || cueTimer) disarmCue(); cueTimer = 0; }\nfunction placeCue(){ if (!cuePos) return; const [x, y, r] = cuePos(); cueEl.setAttribute(\"cx\", r1(x)); cueEl.setAttribute(\"cy\", r1(y)); cueEl.setAttribute(\"r\", r1((r || gripR()) + 2)); cueEl.style.display = \"\"; }   // 第三个数是被提醒的东西的半径（托里的一个）\n\n// 窄屏：viewBox 缩到中间 600 宽的操作区，字号类放大（教训 13、28）。每个场景写明自己用到的高度\n// 排版规矩：要紧的东西都画在 x = 110～690 之间；每个场景在这里写 [起始 y, 高度]\nconst VIEW = { s1q: [120, 360], s1: [120, 360], s2: [120, 360], end: [8, 596] };\nfunction fitView(){\n  const nar = (svg.clientWidth || 800) < 600, [y, h] = VIEW[S.scene] || [0, 610];\n  document.body.classList.toggle(\"narrow\", nar);\n  const v = (nar ? [100, y, 600, h] : [0, y, 800, h]).join(\" \");\n  if (svg.getAttribute(\"viewBox\") !== v){ svg.setAttribute(\"viewBox\", v); S.dirty = true; }\n}\naddEventListener(\"resize\", fitView);\nfunction scene(name){ S.scene = name; fitView(); S.dirty = true; }\n\n\n/* ============ 6. 水平直轨 ============ */\nfunction cart(name, x, y, mass, details = \"\", pick = false){\n  const side = name === \"甲\" ? \"a\" : \"b\";\n  const boxes = Math.round((mass - MODEL.emptyMass) / MODEL.cargoMass);\n  let crates = \"\";\n  for(let i=0;i<boxes;i++){\n    const left = -17+i*27;\n    crates += `<rect class=\"crate\" x=\"${left}\" y=\"-52\" width=\"25\" height=\"28\" rx=\"2\"/>` +\n      P(Sk.line(left+2,-50,left+22,-27,16), \"k1\") + P(Sk.line(left+22,-50,left+2,-27,17), \"k1\");\n  }\n  const role = pick ? ' role=\"button\" tabindex=\"0\" aria-label=\"贴到'+name+'车\"' : \"\";\n  return `<g data-car=\"${name}\" transform=\"translate(${x} ${y})\"${role}>\n    <rect x=\"-47\" y=\"-62\" width=\"94\" height=\"84\" fill=\"transparent\"/>\n    ${crates}<path class=\"cart-face cart-${side}\" d=\"M-38 -24 L36 -25 Q40 -24 39 -20 L36 1 L-35 2 Q-40 -1 -38 -24Z\"/>\n    <circle class=\"tyre\" cx=\"-24\" cy=\"7\" r=\"8\"/><circle class=\"tyre\" cx=\"24\" cy=\"7\" r=\"8\"/>\n    ${TC(0,-4,name,\"lb\")}${details}<\/g>`;\n}\nfunction arrow(from, y, len, label, dark=false){\n  const end = from + len, wing = 9 * Math.sign(len);\n  return `<g class=\"force-arrow\" data-length=\"${len}\">` +\n    P(`M${from} ${y}h${len}m${-wing} -6l${wing} 6l${-wing} 6`, \"force-line\"+(dark?\" opposite\":\"\")) +\n    TC((from+end)/2,y-13,label,\"measure\") + \"<\/g>\";\n}\nfunction track(y){\n  let s=P(Sk.line(115,y,685,y,81,.27))+P(Sk.line(115,y+5,685,y+5,83,.25),\"k1\");\n  for(let x=120; x<=680; x+=28) s+=P(Sk.line(x,y+7,x-5,y+13,x,.35),\"k1\");\n  return s;\n}\nfunction slider(id, label, min, max, step, value, unit){\n  return `<label for=\"${id}\">${label}<output for=\"${id}\">${value} ${unit}<\/output>\n    <input id=\"${id}\" type=\"range\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${value}\" data-unit=\"${unit}\"><\/label>`;\n}\nfunction showBench(html){\n  $(\"bench\").innerHTML = html;\n  $(\"bench\").hidden = !html;\n}\nfunction settingsChanged(e){\n  if(e.target.tagName!==\"INPUT\" || running) return;\n  e.target.previousElementSibling.textContent = e.target.value + \" \" + e.target.dataset.unit;\n  elapsed = 0;\n  paint();\n}\n$(\"bench\").addEventListener(\"input\",settingsChanged);\nlet running = false, elapsed = 0, frame = 0;\nfunction stopRun(){\n  cancelAnimationFrame(frame);\n  running = false;\n  elapsed = 0;\n}\nfunction startRun(done){\n  if(running) return;\n  running = true;\n  actions([]);\n  for(const input of $(\"bench\").querySelectorAll(\"input\")) input.disabled=true;\n  const start = performance.now();\n  function step(now){\n    elapsed = reduced ? MODEL.seconds : Math.max(0, Math.min(MODEL.seconds, (now-start)/1000));\n    paint();\n    if(elapsed < MODEL.seconds) frame=requestAnimationFrame(step);\n    else {\n      running=false;\n      for(const input of $(\"bench\").querySelectorAll(\"input\")) input.disabled=false;\n      done();\n    }\n  }\n  frame=requestAnimationFrame(step);\n}\nfunction present(n,title,mode){\n  gen++; stopRun(); S.station=n; S.mode=mode; head(n,title); scene(n===2?\"s2\":\"s1\"); hint(\"\"); readout(\"\"); showBench(\"\");\n}\n/* ============ 7. 比两趟车 ============ */\nlet contrastedMass=false, contrastedPush=false, saved=null;\nconst massMax=MODEL.emptyMass+MODEL.cargoMass;\nfunction cars(t){\n  const mass=$(\"mass\") ? +$(\"mass\").value : MODEL.emptyMass;\n  const force=$(\"force\") ? +$(\"force\").value : MODEL.push;\n  const referencePush=$(\"referenceForce\") ? +$(\"referenceForce\").value : MODEL.push;\n  return [MODEL.motion(MODEL.emptyMass,referencePush,t), MODEL.motion(mass,force,t)];\n}\nfunction paint(){\n  const pair=cars(elapsed);\n  const lane=(v,i)=>{\n    const y=i ? 354 : 216;\n    const x=305+v.distance*78, name=i?\"乙\":\"甲\";\n    // 同一比例的两支力箭头从同一辆车体画出。每条纸带的每格代表相同的速度增量。\n    const forces=arrow(36,-14,v.force*12,\"推 \"+v.force+\" N\")+\n      arrow(-37,-14,-MODEL.drag*12,\"阻 \"+MODEL.drag+\" N\",true);\n    const filled=v.speed*40;\n    return cart(name,x,y,v.mass,forces)+T(125,y-15,name+\"车\",\"train-label\")+\n      T(125,y+11,v.mass+\" kg\",\"measure\")+\n      `<rect x=\"286\" y=\"${y+36}\" width=\"167\" height=\"12\" rx=\"3\" class=\"ticket\"/>\n       <rect x=\"286\" y=\"${y+36}\" width=\"${filled}\" height=\"12\" rx=\"3\" class=\"lead\"/>`+\n      [...Array(5)].map((_,k)=>P(`M${286+k*40} ${y+36}v12`,\"k1\")).join(\"\")+\n      T(469,y+48,r1(v.speed)+\" 米每秒\",\"measure\");\n  };\n  gDyn.innerHTML=pair.map(lane).join(\"\");\n  if(S.mode===\"talk\") return;\n  readout(`<b>${r1(elapsed)} 秒<\/b>　甲合力向右 ${pair[0].net} N，乙合力向右 ${pair[1].net} N。`);\n  if(elapsed===MODEL.seconds || elapsed===0) sendState({station:S.station,time:elapsed,\n    mass:pair[1].mass,push:pair[1].force,resistance:MODEL.drag,net:pair[1].net,\n    acceleration:pair[1].acceleration,speed:pair[1].speed,reference_speed:pair[0].speed});\n}\nfunction enter1(){\n  saved=null; contrastedMass=false; contrastedPush=false;\n  present(1,\"看每秒多快一点\",\"talk\");\n  $(\"rails\").innerHTML=track(231)+track(369);\n  paint();\n  ask(\"一辆车原来跑得快。这就能断定它接下来加快得更多吗？\",[\n    {label:\"能，跑得快就加快得多\",mis:\"speed-is-acceleration\",feedback:\"先留着这个猜想。试车台能量出一秒里速度多了多少。\"},\n    {label:\"还要量它一秒里快了多少\",correct:true,feedback:\"我们用两张测速纸带，把这一秒留下来。\"}\n  ],()=>next(\"去试车\",()=>experiment(1)));\n}\nfunction experiment(station){\n  present(station,station===1?\"看每秒多快一点\":\"配出一样长的纸带\",\"act\");\n  $(\"rails\").innerHTML=track(231)+track(369);\n  if(station===1){contrastedMass=false; contrastedPush=false;}\n  showBench(slider(\"mass\",\"乙车总质量\",MODEL.emptyMass,massMax,MODEL.cargoMass,\n                   station===1?MODEL.emptyMass:massMax,\"kg\")+\n            slider(\"force\",\"向右推乙车\",MODEL.minPush,MODEL.maxPush,MODEL.step,MODEL.push,\"N\")+\n            (station===2 ? slider(\"referenceForce\",\"向右推甲车\",MODEL.minPush,MODEL.push,MODEL.step,MODEL.push,\"N\") : \"\"));\n  hint(\"两车从静止出发，同推 1 秒。每车受到向左 2 N 的阻力。N 读作牛顿，kg 读作千克。\");\n  say(station===1?\"把乙车加到 4 千克，保持推力一样，看看哪张纸带更长。\":\"让乙车载着货，选定甲车的推力，再调乙车，使两张纸带一样长。\");\n  paint(); launchButton();\n}\nfunction launchButton(){\n  next(\"同时推 1 秒\",()=>startRun(finishTrial));\n}\nfunction finishTrial(){\n  const [a,b]=cars(MODEL.seconds);\n  const numbers=`这一秒，甲车快了 ${a.speed} 米每秒，乙车快了 ${b.speed} 米每秒。`;\n  const buttons=[{label:\"再试一趟\",cls:\"ghost\",go:()=>startRun(finishTrial)}];\n  if(S.station===1){\n    if(a.mass!==b.mass && a.net===b.net) contrastedMass=true;\n    if(a.mass===b.mass && a.net!==b.net) contrastedPush=true;\n    let instruction=\"保持两车推力一样，只给乙车加货，再试一次。\";\n    if(contrastedMass) instruction=\"卸掉货，让两车一样重，只改乙车的推力再试。\";\n    if(contrastedMass&&contrastedPush){\n      instruction=\"两种对照都留下了。每秒速度改变多少，叫加速度。\";\n      observedOnce(1); buttons.push({label:replay?\"回星卡\":\"配一对纸带\",go:replay?enterEnd:()=>experiment(2)});\n    }\n    say(numbers+instruction);\n  } else if(b.mass!==a.mass && b.acceleration===a.acceleration){\n    saved=[a,b];\n    observedOnce(2);\n    say(numbers+`乙车的质量和合力都是甲车的两倍。两张纸带可以共用一把尺了。`,\"good\");\n    buttons.push({label:\"收好我的纸带\",go:enterEnd});\n  } else {\n    say(numbers+(b.mass===a.mass?\"给乙车装一件货，再把两张纸带配成一样长。\":\n      (b.speed<a.speed?\"乙车的纸带还短一点。再加一点推力试试。\":\"乙车的纸带更长了。把推力调小试试。\")));\n  }\n  actions(buttons);\n}\nREPLAY[1]=()=>experiment(1);\nREPLAY[2]=()=>experiment(2);\nfunction enterEnd(){\n  if(!saved) return;\n  present(0,\"我的双车测速单\",\"end\");\n  $(\"rails\").innerHTML=\"\";\n  const slips=saved.map((v,i)=>{\n    const y=215+i*115;\n    return `<rect x=\"130\" y=\"${y-48}\" width=\"540\" height=\"102\" rx=\"10\" class=\"ticket\"/>`+\n      cart(i?\"乙\":\"甲\",200,y+7,v.mass)+T(270,y-8,`${v.mass} 千克 · 合力向右 ${v.net} 牛顿`,\"train-label\")+\n      T(270,y+31,`每秒快 ${v.acceleration} 米每秒`,\"measure\")+\n      P(Sk.line(510,y+22,510+v.acceleration*40,y+22,29),\"force-line\");\n  });\n  gDyn.innerHTML=slips.join(\"\");\n  hint(\"两辆车同时从静止出发。\");\n  readout(`两车的速度每秒都增加 ${saved[0].acceleration} 米每秒，加速度都是 ${saved[0].acceleration} 米每二次方秒。`);\n  say(\"你调出了相同的加速度。\"+(S.guess?.[1]?.correct?\"你开头就想到了，要比较一段时间内的改变。\":\"光看一眼车有多快，还得不到这两张测速单。\"),\"good\");\n  if(!completed){completed=true; Host.complete({station:2, mass:saved[1].mass,net:saved[1].net,acceleration:saved[1].acceleration});}\n  endActions();\n}\n\nHost.ready();\nfitView();\nenter1();\n<\/script>\n<\/body>\n<\/html>\n", "id": "act.simulation.push-track-01", "kind": "simulation", "targets": ["physics.motion.force-acceleration"], "title": "两辆车的测速纸带"}, {"age_band": "G3-4", "body": {"items": [{"answer": {"choices": [{"feedback": "甲虽然开得快，但纸带上它的速度读数一直相同。", "id": "a", "misconception": "speed-is-acceleration", "text": "甲车"}, {"feedback": "试着给每辆车的后一格读数减去前一格。", "id": "b", "misconception": "speed-is-acceleration", "text": "两车都在加速"}, {"correct": true, "id": "c", "text": "乙车"}], "type": "choice"}, "feedback": {"correct": "乙每过一秒就多出每秒 2 米的速度。甲的读数从头到尾没有变。", "wrong": "快慢先看每张读数，变化要看相邻两张。"}, "hints": ["快慢先看每张读数，变化要看相邻两张。", "在同一辆车的读数之间标出增加量。"], "id": "q1", "stem": "打点器每秒记一次向右的车速。甲车三次都是每秒 6 米。乙车三次依次是每秒 1、3、5 米。哪辆在加速？"}, {"answer": {"common_wrong": [{"feedback": "推同样的力还得看被推的总质量。", "misconception": "speed-is-acceleration", "value": 12}], "tolerance": 0, "type": "number", "unit": "米每秒", "value": 4}, "feedback": {"correct": "12 牛除以 3 千克，算出向右的加速度。每过一秒，速度向右增加 4 米每秒。", "wrong": "圈出合力和带货的总质量。"}, "hints": ["圈出合力和带货的总质量。", "把合力除以总质量，就能读到每秒的速度变化。"], "id": "q2", "stem": "总质量为 3 千克的车在水平直轨上受向右 12 牛的恒定合力。每过一秒，它的速度向右增加多少米每秒？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "调到 12 牛"}, {"feedback": "同样的合力推更重的车，每秒的速度变化会更小。", "id": "b", "misconception": "speed-is-acceleration", "text": "也用 6 牛"}, {"feedback": "车更重又减小推力，每秒的速度变化会更小。", "id": "c", "misconception": "speed-is-acceleration", "text": "调到 3 牛"}], "type": "choice"}, "feedback": {"correct": "乙车的质量是甲的两倍，合力也要加倍。两次合力除以质量都相同。", "wrong": "先比较两辆车的总质量。"}, "hints": ["先比较两辆车的总质量。", "让合力和质量按照相同的倍数一起变动。"], "id": "q3", "stem": "同一起点放两辆静止车。甲车总质量 2 千克，乙车 4 千克。甲受向右 6 牛恒定合力。乙车要和甲每秒加快得一样多，向右合力应怎样调？"}, {"answer": {"common_wrong": [{"feedback": "5 来自把两个力相加。阻力与拉绳方向相反。", "misconception": "speed-is-acceleration", "value": 5}], "tolerance": 0, "type": "number", "unit": "米每秒", "value": 2}, "feedback": {"correct": "先求向右合力 14 − 6 = 8 牛。再除以 4 千克，每过一秒向右增加 2 米每秒。", "wrong": "先把车身上相反方向的力合成一个。"}, "hints": ["先把车身上相反方向的力合成一个。", "再把合力平均分给车的总质量。"], "id": "q4", "stem": "一辆满载车总质量 4 千克。水平拉绳向右用 14 牛，阻力向左为 6 牛，两个力都恒定。每秒车速向右增加多少米每秒？"}, {"answer": {"choices": [{"feedback": "车速指向右，合力已经改向左。加速度跟着合力。", "id": "a", "misconception": "speed-is-acceleration", "text": "加速度向右，车继续加快"}, {"correct": true, "id": "b", "text": "加速度向左，车暂时变慢"}, {"feedback": "向左的力会先减小原有的向右速度，车不会立即反向。", "id": "c", "misconception": "speed-is-acceleration", "text": "加速度向左，车立刻向左加快"}], "type": "choice"}, "feedback": {"correct": "看合力判出加速度向左。它与原来的速度反向，先让向右的速度减小。", "wrong": "先只看力的箭头，判断加速度方向。"}, "hints": ["先只看力的箭头，判断加速度方向。", "再把这个方向和车原先的行驶方向比较。"], "id": "q5", "stem": "一辆 2 千克小车正向右滑。此刻水平合力变为向左 4 牛，并保持不变。刚开始、还没停住时，车的加速度和快慢怎样变？"}], "shuffle": false}, "duration_min": 7, "id": "act.quiz.push-track-01", "kind": "quiz", "targets": ["physics.motion.force-acceleration"], "title": "给加速小车选推杆"}], "dq": "更重的车，怎样才能和轻车一起加快？", "id": "physics.motion.force-acceleration", "misconceptions": {"speed-is-acceleration": "把速度当作加速度"}, "title": "牛顿第二定律：同一推力推两辆车"}, {"activities": [{"age_band": "G3-4", "duration_min": 7, "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>两辆车的互推印章<\/title>\n<style>\n/* kit:base —— 颜色、卡片、气泡、按钮。色值不要改；模块自己的样式写在最后一段 */\n/* 长按不选字、不弹菜单（#156）。输入框照常能选能改 */\nhtml{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\ninput,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}\n:root{\n  --bg:#F5F4EE; --pane:#FBFAF6; --rule:#E0DCD0; --hover:#E7E4D9;\n  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;\n  --accent:#C2603F; --accent-soft:#F3E0D6;\n  --grip:#2A7F7C; --grip-soft:#D3E8E5;\n  --sage:#CCD6C0; --sage-bg:#DCE3D )}\n@media (max-width:520px){ body{font-size:16px} h1{font-size:17px} .card header,.card footer{padding:8px 12px} .card footer{flex-wrap:wrap;row-gap:2px} .hint{white-space:nowrap} .readout{font-size:14px;flex:1 1 auto} }\n/* kit:grip 2026-11-14 —— 圆钮（「可抓」记号，g1.md A.4 G1～G8）。--grip 只给圆钮、托、按住按钮、焦点框用；--accent 不给任何控件用 */\n.btn.hold{touch-action:none;background:var(--grip);border-color:var(--grip);color:var(--bg);display:inline-flex;align-items:center;gap:10px;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}\n.btn.hold.on{filter:brightness(.82)}\n.btn.hold svg{width:18px;height:18px;flex:none}\n.btn.hold svg path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}\n.gfill{fill:var(--grip)} .gsoft{fill:var(--grip-soft)}\n.gring{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}\n.gring.on{stroke-width:3.2}\n.gridge{fill:none;stroke:var(--bg);stroke-width:2.2;stroke-linecap:round}\n.garrow{fill:none;stroke:var(--grip);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.gkbd{fill:none;stroke:var(--ink);stroke-width:1.6}\n#cue{fill:none;stroke:var(--grip);stroke-width:2.4;transform-box:fill-box;transform-origin:center;animation:cue 2.4s ease-out infinite}\n@keyframes cue{0%{transform:scale(1);opacity:.95}50%{transform:scale(1.8);opacity:0}100%{transform:scale(1.8);opacity:0}}\n@media (prefers-reduced-motion:reduce){#cue{animation:none;transform:scale(1.3);opacity:.9}}\n/* kit:frac 2026-11-14 —— 分数一律上下结构（A.4 第 2 条）。HTML 里用 .frac，SVG 里用 fracS() */\n.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-family:var(--f-mono);font-size:.84em;margin:0 .2em;font-variant-numeric:tabular-nums}\n.frac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .28em .04em}\n.frac>span:last-child{padding:.04em .28em 0}\n.fl{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}\n.fs{fill:var(--ink);font-family:var(--f-mono);font-size:16px} .fm{fill:var(--ink);font-family:var(--f-mono);font-size:22px} .fb{fill:var(--ink);font-family:var(--f-mono);font-size:34px}\nbody.narrow .fs{font-size:20px} body.narrow .fm{font-size:26px} body.narrow .fb{font-size:38px}\n/* 模块自己的画面样式写在这里：字号全写在类上，窄屏在 body.narrow 里放大（教训 14、28）。下面几个类可以直接用 */\n.food{fill:var(--apricot)} .lead{fill:var(--accent)} .papr{fill:var(--paper)} .pane{fill:var(--pane)}\n.kacc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.one{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:7 6}\n.faint{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;opacity:.75}\n.lb{fill:var(--ink);font-family:var(--f-sans);font-size:17px}\n.lbg{fill:var(--muted);font-family:var(--f-sans);font-size:16px}\n.lbm{fill:var(--ink);font-family:var(--f-mono);font-size:17px}\n.big{fill:var(--ink);font-family:var(--f-mono);font-size:44px}\n.ttl{fill:var(--ink);font-family:var(--f-serif);font-size:26px}\n.sign{fill:var(--ink);font-family:var(--f-serif);font-size:24px}\n.tk{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round} .tkd{fill:none;stroke:var(--accent);stroke-width:1.1}\nbody.narrow .lb{font-size:21px} body.narrow .lbg{font-size:20px} body.narrow .lbm{font-size:20px}\nbody.narrow .big{font-size:50px} body.narrow .ttl{font-size:30px} body.narrow .sign{font-size:28px}\n/* ============ 试车台：木箱、车身及记录纸带 ============ */\n.bench{display:flex;flex-wrap:wrap;gap:8px 18px;padding:0 16px 12px}\n.bench[hidden]{display:none}\n.bench label{flex:1 1 160px;padding:4px 10px;background:var(--paper);border-radius:8px;font-size:16px}\n.bench output{float:right;font-weight:700}\n.bench input{display:block;width:100%;height:48px;margin:0;accent-color:var(--ink)}\n.card footer{display:block}\n#hint,#readout{display:block;text-align:left;white-space:normal}\n#readout{font-family:var(--f-sans)}\n.ticket{fill:var(--paper);stroke:var(--muted);stroke-width:1}\n.cart-face{fill:var(--sage);stroke:var(--ink);stroke-width:2}\n.cart-b{fill:var(--sky)}\n.crate{fill:var(--apricot);stroke:var(--ink);stroke-width:2}\n.tyre{fill:var(--pane);stroke:var(--ink);stroke-width:3}\n.force-line{stroke:var(--accent);stroke-width:5;stroke-linecap:round;fill:none}\n.opposite{stroke:var(--ink)}\n.train-label{font-family:var(--f-sans);font-size:23px;fill:var(--ink);font-weight:600}\n.measure{font-family:var(--f-mono);font-size:21px;fill:var(--ink)}\n[data-car][role=\"button\"]{cursor:pointer}\n[data-car][role=\"button\"]:focus-visible{outline:3px solid var(--ink)}\nbody.narrow .measure{font-size:24px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\"><\/span><h1 id=\"title\"><\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 120 800 360\" role=\"group\" aria-label=\"小车试车台\">\n      <g id=\"rails\"><\/g><g id=\"dyn\"><\/g>\n      <g id=\"fx\"><circle id=\"cue\" cx=\"0\" cy=\"0\" r=\"10\" style=\"display:none\"/><\/g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->\n    <\/svg>\n    <div id=\"bench\" class=\"bench\" hidden><\/div>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* Curio · 动手探索模块骨架。复制本文件，把 {{…}} 换成具体内容，换掉两个示例站。\n   2026-11-14 起以切分机 act.simulation.fair-cut-01 为准（Luka 验收通过后抽出来的）：带 kit: 记号的段落照抄不改，\n   要改就先改这里，再同步到用它的模块。先读 lessons.md 和 docs/constellations/zero-to-one/notes-star1.md。 */\n/* ============ 1. 真相模型：页面上的每个数字都从这里算，每个值旁边写出处。只放数和纯函数，不碰页面 ============ */\nconst MODEL = {\n  emptyMass: 2, cargoMass: 2, seconds: 1,  // 水平桌面的理想小车，由静止出发；忽略其他水平力。\n  force: 4, minForce: 2, maxForce: 6, step: 2,  // 甲车自带恒力伸缩杆，包含在甲车总质量中；杆质量忽略，杆头持续接触乙车。\n  motion(mass, force, seconds){\n    const acceleration=force/mass; // OpenStax College Physics 2e 4.3、4.4；正方向向右。\n    return {mass,force,acceleration,speed:acceleration*seconds,distance:acceleration*seconds*seconds/2};\n  }\n};\n\n\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩）  kit:host ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); else (window.__sent = window.__sent || []).push({ type, payload: payload || {} }); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 每站的猜测和观察只记一次，complete 只发一次（C.0 第 3 条；教训 15、19）\nconst sentPred = new Set(), sentObs = new Set();\nlet completed = false;\nfunction observedOnce(station){ if (sentObs.has(station)) return; sentObs.add(station); Host.event(\"observed\", { station }); }\nlet lastState = \"\";\nfunction sendState(o){ const s = JSON.stringify(o); if (s === lastState) return; lastState = s; Host.state(o); }\n\n/* ============ 3. 手绘线条（平台的 sketchLib）  kit:sketch ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,curve,cr,R,f};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst TC = (x, y, s, cls, extra) => T(x, y, s, cls, 'text-anchor=\"middle\"' + (extra ? \" \" + extra : \"\"));\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst r1 = n => Math.round(n * 10) / 10;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\n// 角度：从正上方起、顺时针，和钟面一样\nconst pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };\nfunction sectorD(cx, cy, r, a0, a1){\n  if (a1 - a0 >= 359.9) return `M${r1(cx - r)} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;\n  const p0 = pol(cx, cy, r, a0), p1 = pol(cx, cy, r, a1);\n  return `M${r1(cx)} ${r1(cy)}L${r1(p0[0])} ${r1(p0[1])}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${r1(p1[0])} ${r1(p1[1])}Z`;\n}\nfunction arcD(cx, cy, r, a0, a1, seed){   // 手绘的一段圆弧\n  const rnd = Sk.R(seed), N = Math.max(2, Math.ceil((a1 - a0) / 14)), pts = [];\n  for (let i = 0; i <= N; i++) pts.push(pol(cx, cy, r * (1 + (rnd() - .5) * .012), a0 + (a1 - a0) * i / N));\n  return Sk.cr(pts, false);\n}\n\n/* ============ 4. 共用零件：分数、「1」记号、圆钮、数线条  kit:parts ============ */\nconst narrow = () => document.body.classList.contains(\"narrow\");\n// 4.1 分数：HTML 里的 .frac（带读法）和 SVG 里的 fracS（上下结构，手绘分数线）。任何地方都不用斜杠写法\nconst CN1 = [\"零\", \"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"七\", \"八\", \"九\", \"十\"];\nconst cnNum = n => (n = +n, n === 100 ? \"百\" : n === 1000 ? \"千\" : !Number.isInteger(n) || n < 1 || n > 99 ? undefined : n <= 10 ? CN1[n] : n < 20 ? \"十\" + CN1[n - 10] : CN1[Math.floor(n / 10)] + \"十\" + (n % 10 ? CN1[n % 10] : \"\"));   // 认 1 到 99、100（百）、1000（千）；别的数（含 0）不认，读出来是 undefined，用到先补这里\nconst cnFrac = (a, b) => `${cnNum(b)}分之${cnNum(a)}`;                // 读法：3/4 读作四分之三\nconst F = (a, b) => `<span class=\"frac\" role=\"img\" aria-label=\"${cnFrac(a, b)}\"><span aria-hidden=\"true\">${a}<\/span><span aria-hidden=\"true\">${b}<\/span><\/span>`;\nconst FSZ = { fs: [16, 20], fm: [22, 26], fb: [34, 38] };\nfunction fracS(x, y, a, b, cls, seed){   // x 是中线，y 是分数线的高度\n  const sz = FSZ[cls][narrow() ? 1 : 0], w = Math.max(String(a).length, String(b).length) * sz * .62 + sz * .5;\n  return `<g role=\"img\" aria-label=\"${cnFrac(a, b)}\">` + TC(x, r1(y - sz * .3), a, cls) + P(Sk.line(x - w / 2, y, x + w / 2, y, seed || 7, .45), \"fl\") + TC(x, r1(y + sz * .98), b, cls) + `<\/g>`;\n}\n// 4.2 「1」记号：整体外面一圈手绘虚线框，左上角挂一块写着 1 的纸色小牌\nfunction oneMark(x, y, w, h, seed, o){   // o.below：牌子挂在左下角（框上面要留给别的东西时用）\n  const tx = x + 4, ty = o && o.below ? y + h - 15 : y - 15;\n  return P(box(x, y, w, h, seed, .8), \"one\") +\n    `<g transform=\"rotate(-5 ${tx + 14} ${ty + 14})\"><rect x=\"${tx}\" y=\"${ty}\" width=\"28\" height=\"30\" rx=\"4\" class=\"papr\"/>` + P(box(tx, ty, 28, 30, seed + 9, .4), \"k1\") + TC(tx + 14, ty + 22, \"1\", \"fm\") + `<\/g>`;\n}\n// 4.3 圆钮：实心圆、墨线外圈、三道防滑纹、两侧箭头（G1）。dir 是能动的方向（单位向量）；arc 给出圆心时箭头沿圆弧\nconst vbW = () => svg.viewBox.baseVal.width || 800;\nconst pxScale = () => vbW() / (svg.clientWidth || 800);                 // 1 个屏幕像素合多少 viewBox 单位\nconst gripR = () => Math.max(17, 15 * pxScale());                       // 画出来直径不小于 28 px（G4）\nconst hitR = () => Math.max(30, 26 * pxScale());                        // 能点中的范围不小于 48 px（G4）\nfunction chevron(px, py, dx, dy, s){ const nx = -dy, ny = dx; return `M${r1(px - dx * s + nx * s)} ${r1(py - dy * s + ny * s)}L${r1(px + dx * s * .7)} ${r1(py + dy * s * .7)}L${r1(px - dx * s - nx * s)} ${r1(py - dy * s - ny * s)}`; }\nfunction grip(x, y, dir, o){\n  o = o || {}; const g = gripR(), on = !!o.on, k = on ? 1.12 : 1, r = g * k, [dx, dy] = dir, nx = -dy, ny = dx;\n  let s = `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r)}\" class=\"gfill\"/>` + P(Sk.ellipse(x, y, r, r, o.seed || 71, .5), \"gring\" + (on ? \" on\" : \"\"));\n  for (const i of [-1, 0, 1]){ const ox = dx * i * r * .36, oy = dy * i * r * .36, L = r * (i ? .36 : .5); s += P(`M${r1(x + ox - nx * L)} ${r1(y + oy - ny * L)}L${r1(x + ox + nx * L)} ${r1(y + oy + ny * L)}`, \"gridge\"); }\n  const gap = g + 11;\n  if (o.arc){ const [cx, cy] = o.arc, R = Math.hypot(x - cx, y - cy), a0 = Math.atan2(x - cx, cy - y) * 180 / Math.PI, da = gap / R * 180 / Math.PI;\n    for (const sg of [-1, 1]){ const [px, py] = pol(cx, cy, R, a0 + sg * da), a = (a0 + sg * da) * Math.PI / 180; s += P(chevron(px, py, sg * Math.cos(a), sg * Math.sin(a), 6), \"garrow\"); } }\n  else for (const sg of [-1, 1]) s += P(chevron(x + dx * sg * gap, y + dy * sg * gap, dx * sg, dy * sg, 6), \"garrow\");\n  if (o.kbd) s += `<circle cx=\"${r1(x)}\" cy=\"${r1(y)}\" r=\"${r1(r + 6)}\" class=\"gkbd\"/>`;\n  return s;\n}\n// 4.4 数线条：0 和 1 的刻度长，数写在线下面；fracs 是要钉上去的分数 [[分子, 分母], …]，标签太挤时只标一部分\nfunction lineStrip(lx, ly, lw, fracs, seed){\n  let s = P(Sk.line(lx - 10, ly, lx + lw + 14, ly, seed, .5)) + P(`M${lx} ${ly - 12}v24M${lx + lw} ${ly - 12}v24`) + TC(lx, ly + 38, \"0\", \"lbm\") + TC(lx + lw, ly + 38, \"1\", \"lbm\"), lastLab = 1e9;\n  for (const [a, b] of fracs.slice().sort((p, q) => q[0] / q[1] - p[0] / p[1])){\n    const x = r1(lx + lw * a / b);\n    s += P(`M${x} ${ly}v-15`, \"k1\") + `<circle cx=\"${x}\" cy=\"${ly - 18}\" r=\"5.5\" class=\"lead\"/>` + P(Sk.ellipse(x, ly - 18, 5.5, 5.5, seed + a * 13 + b, .3), \"k1\");\n    if (lastLab - x >= (narrow() ? 44 : 36)){ s += fracS(x, ly - 50, a, b, \"fs\", seed + b); lastLab = x; }\n  }\n  return s;\n}\nconst RIDGES = `<svg viewBox=\"0 0 18 18\" aria-hidden=\"true\"><path d=\"M4 3v12M9 3v12M14 3v12\"/><\/svg>`;   // 按住按钮上的防滑纹小图标\n\n/* ============ 5. 页面骨架  kit:shell ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gDyn = $(\"dyn\"), cueEl = $(\"cue\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 2;   // 一共几站\n// t 是孩子操作推到的进度（0～1），p 是画面上缓动跟随的进度；读数和画面都用 p（教训 2）\nconst S = { station: 1, mode: \"talk\", scene: \"s1q\", hold: false, press: false, kbd: false, dirty: true, t1: 0, p1: 0, t2: 0, p2: 0 };\nlet gen = 0;          // 每换一站加一：延时回调先确认还在原来的状态（教训 11）\nconst later = (ms, f) => { const g = gen; setTimeout(() => { if (g === gen) f(); }, reduced ? Math.min(ms, 60) : ms); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ if ($(\"readout\").innerHTML !== (html || \"\")) $(\"readout\").innerHTML = html || \"\"; }\nfunction say(html, tone){ const b = $(\"say\"); b.innerHTML = html; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; S.hold = false; });\nfunction actions(list){\n  const boxEl = $(\"actions\"); boxEl.replaceChildren();\n  S.dirty = true;   // 换按钮就是换了状态：一律重画一次，免得圆钮留在锁住的画面上\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.innerHTML = (a.hold ? RIDGES : \"\") + `<span>${a.label}<\/span>`;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); if (v) touched(); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setP eEl.setAttribute(\"cy\", r1(y)); cueEl.setAttribute(\"r\", r1((r || gripR()) + 2)); cueEl.style.display = \"\"; }   // 第三个数是被提醒的东西的半径（托里的一个）\n\n// 窄屏：viewBox 缩到中间 600 宽的操作区，字号类放大（教训 13、28）。每个场景写明自己用到的高度\n// 排版规矩：要紧的东西都画在 x = 110～690 之间；每个场景在这里写 [起始 y, 高度]\nconst VIEW = { s1q: [120, 360], s1: [120, 360], s2: [120, 360], end: [8, 596] };\nfunction fitView(){\n  const nar = (svg.clientWidth || 800) < 600, [y, h] = VIEW[S.scene] || [0, 610];\n  document.body.classList.toggle(\"narrow\", nar);\n  const v = (nar ? [100, y, 600, h] : [0, y, 800, h]).join(\" \");\n  if (svg.getAttribute(\"viewBox\") !== v){ svg.setAttribute(\"viewBox\", v); S.dirty = true; }\n}\naddEventListener(\"resize\", fitView);\nfunction scene(name){ S.scene = name; fitView(); S.dirty = true; }\n\n\n/* ============ 6. 水平直轨 ============ */\nfunction cart(name, x, y, mass, details = \"\", pick = false){\n  const side = name === \"甲\" ? \"a\" : \"b\";\n  const boxes = Math.round((mass - MODEL.emptyMass) / MODEL.cargoMass);\n  let crates = \"\";\n  for(let i=0;i<boxes;i++){\n    const left = -17+i*27;\n    crates += `<rect class=\"crate\" x=\"${left}\" y=\"-52\" width=\"25\" height=\"28\" rx=\"2\"/>` +\n      P(Sk.line(left+2,-50,left+22,-27,16), \"k1\") + P(Sk.line(left+22,-50,left+2,-27,17), \"k1\");\n  }\n  const role = pick ? ' role=\"button\" tabindex=\"0\" aria-label=\"贴到'+name+'车\"' : \"\";\n  return `<g data-car=\"${name}\" transform=\"translate(${x} ${y})\"${role}>\n    <rect x=\"-47\" y=\"-62\" width=\"94\" height=\"84\" fill=\"transparent\"/>\n    ${crates}<path class=\"cart-face cart-${side}\" d=\"M-38 -24 L36 -25 Q40 -24 39 -20 L36 1 L-35 2 Q-40 -1 -38 -24Z\"/>\n    <circle class=\"tyre\" cx=\"-24\" cy=\"7\" r=\"8\"/><circle class=\"tyre\" cx=\"24\" cy=\"7\" r=\"8\"/>\n    ${TC(0,-4,name,\"lb\")}${details}<\/g>`;\n}\nfunction arrow(from, y, len, label, dark=false){\n  const end = from + len, wing = 9 * Math.sign(len);\n  return `<g class=\"force-arrow\" data-length=\"${len}\">` +\n    P(`M${from} ${y}h${len}m${-wing} -6l${wing} 6l${-wing} 6`, \"force-line\"+(dark?\" opposite\":\"\")) +\n    TC((from+end)/2,y-13,label,\"measure\") + \"<\/g>\";\n}\nfunction track(y){\n  let s=P(Sk.line(115,y,685,y,81,.27))+P(Sk.line(115,y+5,685,y+5,83,.25),\"k1\");\n  for(let x=120; x<=680; x+=28) s+=P(Sk.line(x,y+7,x-5,y+13,x,.35),\"k1\");\n  return s;\n}\nfunction slider(id, label, min, max, step, value, unit){\n  return `<label for=\"${id}\">${label}<output for=\"${id}\">${value} ${unit}<\/output>\n    <input id=\"${id}\" type=\"range\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${value}\" data-unit=\"${unit}\"><\/label>`;\n}\nfunction showBench(html){\n  $(\"bench\").innerHTML = html;\n  $(\"bench\").hidden = !html;\n}\nfunction settingsChanged(e){\n  if(e.target.tagName!==\"INPUT\" || running) return;\n  e.target.previousElementSibling.textContent = e.target.value + \" \" + e.target.dataset.unit;\n  elapsed = 0;\n  paint();\n}\n$(\"bench\").addEventListener(\"input\",settingsChanged);\nlet running = false, elapsed = 0, frame = 0;\nfunction stopRun(){\n  cancelAnimationFrame(frame);\n  running = false;\n  elapsed = 0;\n}\nfunction startRun(done){\n  if(running) return;\n  running = true;\n  actions([]);\n  for(const input of $(\"bench\").querySelectorAll(\"input\")) input.disabled=true;\n  const start = performance.now();\n  function step(now){\n    elapsed = reduced ? MODEL.seconds : Math.max(0, Math.min(MODEL.seconds, (now-start)/1000));\n    paint();\n    if(elapsed < MODEL.seconds) frame=requestAnimationFrame(step);\n    else {\n      running=false;\n      for(const input of $(\"bench\").querySelectorAll(\"input\")) input.disabled=false;\n      done();\n    }\n  }\n  frame=requestAnimationFrame(step);\n}\nfunction present(n,title,mode){\n  gen++; stopRun(); S.station=n; S.mode=mode; head(n,title); scene(n===2?\"s2\":\"s1\"); hint(\"\"); readout(\"\"); showBench(\"\");\n}\n/* ============ 7. 恒力伸缩柱 ============ */\nconst massMax=MODEL.emptyMass+MODEL.cargoMass;\nlet equalTrial=false, unequalTrial=false, kept=null, stamped=[];\nfunction cars(t){\n  const force=$(\"force\") ? +$(\"force\").value : MODEL.force;\n  const ma=$(\"leftMass\") ? +$(\"leftMass\").value : MODEL.emptyMass;\n  const mb=$(\"rightMass\") ? +$(\"rightMass\").value : MODEL.emptyMass;\n  return [MODEL.motion(ma,-force,t),MODEL.motion(mb,force,t)];\n}\nfunction drawPair(pair,showForces=true,stamp=false){\n  const y=295, xA=340+pair[0].distance*76, xB=460+pair[1].distance*76;\n  const aEnd=xA+37, bEnd=xB-37;\n  const center=(aEnd+bEnd)/2;\n  // 推杆是甲车的一部分，杆头顶住乙车；在相同的接触处两车互推。\n  let drawing=`<rect x=\"${aEnd}\" y=\"${y-16}\" width=\"${center-aEnd+4}\" height=\"13\" rx=\"3\" class=\"cart-face\"/>\n    <rect x=\"${center}\" y=\"${y-13}\" width=\"${bEnd-center}\" height=\"7\" rx=\"2\" class=\"crate\"/>`;\n  for(const [i,v] of pair.entries()){\n    const name=i?\"乙\":\"甲\", x=i?xB:xA;\n    const forceArrow=showForces?arrow(i ? 37 : -37,-14,v.force*12,Math.abs(v.force)+\" N\"):\"\";\n    drawing+=cart(name,x,y,v.mass,forceArrow,stamp)+TC(x,y+48,\n      name+\"车 \"+v.mass+\" kg\",\"measure\");\n    if(stamp && stamped.includes(name)){\n      drawing+=TC(x,y+88,(i?\"甲推乙 →\":\"← 乙推甲\"),\"train-label\");\n    }\n  }\n  return drawing;\n}\nfunction paint(){\n  const pair=cars(elapsed);\n  const reading=elapsed===0?\"两辆车都停着\":`甲向左 ${r1(Math.abs(pair[0].speed))} 米每秒　乙向右 ${r1(pair[1].speed)} 米每秒`;\n  gDyn.innerHTML=drawPair(pair,S.mode!==\"talk\")+TC(400,416,reading,\"measure\");\n  if(S.mode===\"talk\") return;\n  readout(`<b>${r1(elapsed)} 秒<\/b>　乙推甲向左 ${-pair[0].force} N，甲推乙向右 ${pair[1].force} N。`);\n  if(elapsed===MODEL.seconds||elapsed===0){\n    sendState({station:1,time:elapsed,mass_a:pair[0].mass,mass_b:pair[1].mass,\n      force_a:pair[0].force,force_b:pair[1].force,acceleration_a:pair[0].acceleration,\n      acceleration_b:pair[1].acceleration,speed_a:pair[0].speed,speed_b:pair[1].speed});\n  }\n}\nfunction enter1(){\n  kept=null;\n  present(1,\"伸缩柱两头的车\",\"talk\");\n  $(\"rails\").innerHTML=track(310);\n  paint();\n  ask(\"甲车伸出自己的推杆，顶住乙车。猜猜两辆车会怎样？\",[\n    {label:\"各挨一下推，分开走\",correct:true,feedback:\"那就把推杆夹在中间，同时量两辆车。\"},\n    {label:\"两个力抵消，都停在原地\",mis:\"cancel-on-one\",feedback:\"两个方向的确相反。看仔细，每个力落在哪辆车上？\"}\n  ],()=>next(\"装好推杆\",experiment));\n}\nfunction experiment(){\n  equalTrial=false; unequalTrial=false;\n  present(1,\"伸缩柱两头的车\",\"act\"); $(\"rails\").innerHTML=track(310);\n  showBench(slider(\"leftMass\",\"甲车总质量\",MODEL.emptyMass,massMax,MODEL.cargoMass,MODEL.emptyMass,\"kg\")+\n    slider(\"rightMass\",\"乙车总质量\",MODEL.emptyMass,massMax,MODEL.cargoMass,MODEL.emptyMass,\"kg\")+\n    slider(\"force\",\"推杆力的大小\",MODEL.minForce,MODEL.maxForce,MODEL.step,MODEL.force,\"N\"));\n  hint(\"两车从静止出发，忽略摩擦。推杆属于甲车，杆头顶着乙车，持续推 1 秒。\");\n  say(\"让两辆一样重的车互推，再给其中一辆加货。kg 读作千克，N 读作牛顿。\");\n  paint(); next(\"让两车互推 1 秒\",()=>startRun(finishTrial));\n}\nfunction finishTrial(){\n  const pair=cars(MODEL.seconds);\n  if(pair[0].mass===pair[1].mass) equalTrial=true;\n  else {unequalTrial=true; kept=pair;}\n  const result=`这一秒，甲向左快了 ${-pair[0].speed} 米每秒，乙向右快了 ${pair[1].speed} 米每秒。`;\n  const buttons=[{label:\"再推一次\",cls:\"ghost\",go:()=>startRun(finishTrial)}];\n  if(equalTrial&&unequalTrial){\n    observedOnce(1);\n    say(result+\"两张力签总是一样大，轻车却能加快得更多。推杆两头今天都没偷懒。\",\"good\");\n    buttons.push({label:replay?\"回星卡\":\"去贴力签\",go:replay?enterEnd:tagStation});\n  } else say(result+(equalTrial?\"给其中一辆加货，再比比两支箭头。\":\"再让两辆一样重的车互推一次。\"));\n  actions(buttons);\n}\nfunction tagStation(){\n  if(!kept) return;\n  present(2,\"把力签贴回车身\",\"tag\"); stamped=[];\n  $(\"rails\").innerHTML=track(310);\n  hint(\"用手点车身，或用 Tab 选车、回车贴签。\");\n  showTags();\n}\nfunction showTags(){\n  const wanted=stamped.length?\"甲\":\"乙\";\n  gDyn.innerHTML=drawPair(kept,true,true);\n  const label=wanted===\"乙\"?\"甲推乙，向右\":\"乙推甲，向左\";\n  readout(`手里的力签　<b>${label} ${Math.abs(kept[0].force)} N<\/b>`);\n  say(\"签上画的是受力方向。把这张签贴到挨推的车上。\");\n  for(const el of gDyn.querySelectorAll(\"[data-car]\")){\n    const place=()=>{\n      const name=el.dataset.car;\n      if(name!==wanted){say(\"看力签的最后一个车名。哪辆车挨了推？\",\"hmm\");return;}\n      stamped.push(name);\n      if(stamped.length===1) showTags();\n      else{\n        gDyn.innerHTML=drawPair(kept,true)+TC(400,406,\"← 乙推甲　　　　　甲推乙 →\",\"train-label\");\n        sendState({station:2,labels:stamped.slice()});\n        observedOnce(2); readout(\"两张力签都贴好了。\");\n        say(\"两支箭头同时出现。每辆车上各有一支，方向相反。\",\"good\"); nextOr(\"收好我的互推印章\",enterEnd);\n      }\n    };\n    el.onclick=place;\n    el.onkeydown=e=>{if(e.key===\"Enter\"||e.key===\" \"){e.preventDefault();place();}};\n  }\n  if(stamped.length) gDyn.querySelector(\"[data-car]\").focus();\n}\nREPLAY[1]=experiment;\nREPLAY[2]=tagStation;\nfunction enterEnd(){\n  if(!kept) return;\n  present(0,\"我的互推印章\",\"end\");\n  $(\"rails\").innerHTML=track(310);\n  gDyn.innerHTML=drawPair(kept,true)+TC(400,395,\"← 乙给甲的力　　　甲给乙的力 →\",\"train-label\");\n  readout(`我装的车，甲 ${kept[0].mass} 千克，乙 ${kept[1].mass} 千克。各受 ${kept[1].force} 牛顿的推力。`);\n  say(`经过同一秒，甲向左快了 ${-kept[0].speed} 米每秒，乙向右快了 ${kept[1].speed} 米每秒。`+\n    (S.guess?.[1]?.correct?\"你猜到它们会分开了。\":\"把两张力签放回各自的车上，你开头的猜想就能用车来检验了。\"),\"good\");\n  if(!completed){completed=true;Host.complete({station:2,mass_a:kept[0].mass,mass_b:kept[1].mass,force:kept[1].force});}\n  endActions();\n}\n\nHost.ready();\nfitView();\nenter1();\n<\/script>\n<\/body>\n<\/html>\n", "id": "act.simulation.pair-track-01", "kind": "simulation", "targets": ["physics.motion.action-reaction"], "title": "两辆车的互推印章"}, {"age_band": "G3-4", "body": {"items": [{"answer": {"choices": [{"feedback": "两车互推时，它们对彼此的力方向相反。", "id": "a", "misconception": "cancel-on-one", "text": "乙对甲，向右"}, {"correct": true, "id": "b", "text": "乙对甲，向左"}, {"feedback": "这是轨道托住车的力。互推的那一对来自甲、乙两车。", "id": "c", "misconception": "cancel-on-one", "text": "轨道对乙，向上"}], "type": "choice"}, "feedback": {"correct": "找到同一次接触，再交换“谁推谁”。乙推甲的力朝左。", "wrong": "找正在互相接触的两辆车。"}, "hints": ["找正在互相接触的两辆车。", "交换施力者和受力者，再核对箭头方向。"], "id": "q1", "stem": "光滑水平轨道上，甲车在左，乙车在右。甲的弹簧向右推乙。哪张标签写的是这股力的伙伴？"}, {"answer": {"common_wrong": [{"feedback": "重车也在向左推轻车，两个力分别落在两辆车上。", "misconception": "cancel-on-one", "value": 0}], "tolerance": 0, "type": "number", "unit": "牛", "value": 6}, "feedback": {"correct": "同一对相互作用力大小相等。重车反推轻车的力也是 6 牛。", "wrong": "先在两张力签上各写一辆受力的车。"}, "hints": ["先在两张力签上各写一辆受力的车。", "两张力签记录同一次接触，比较它们的大小。"], "id": "q2", "stem": "轻车在左、重车在右。轻车向右推重车，此刻轻车的弹簧秤读 6 牛。重车同时向左推轻车的力有几牛？"}, {"answer": {"choices": [{"feedback": "改方向没有解决力签贴错车的问题。", "id": "a", "misconception": "cancel-on-one", "text": "把两个箭头都改成向右"}, {"feedback": "两张力签的受力者不同。找出名字在“推”字后面的那辆车。", "id": "b", "misconception": "cancel-on-one", "text": "两张都留在甲车图上"}, {"correct": true, "id": "c", "text": "把“甲推乙”移到乙车图上"}], "type": "choice"}, "feedback": {"correct": "“甲推乙”的受力者是乙。甲的图上只能把甲受到的力相加。", "wrong": "逐张读出是谁受到了推力。"}, "hints": ["逐张读出是谁受到了推力。", "用“推”字后面的名字给每张力签选车。"], "id": "q3", "stem": "甲乙两车互推。你把“甲推乙”和“乙推甲”两张力签都放到甲的受力图上，算出零。应该怎样改？"}, {"answer": {"common_wrong": [{"feedback": "重车向左推轻车的力作用在轻车上，不能从重车的受力栏里扣掉。", "misconception": "cancel-on-one", "value": 0}], "tolerance": 0, "type": "number", "unit": "米每秒", "value": 2}, "feedback": {"correct": "重车受的水平合力向右。8 ÷ 4 = 2，每秒向右增加 2 米每秒的速度。", "wrong": "只保留落到重车上的力签。"}, "hints": ["只保留落到重车上的力签。", "用重车的水平合力除以它自己的质量。"], "id": "q4", "stem": "光滑水平轨道上，两辆车只在水平方向互推。2 千克的轻车在左，4 千克的重车在右。轻车持续向右推重车 8 牛，重车每秒向右增加多少米每秒的速度？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "重车匀速向右，轻车受重车向左推"}, {"feedback": "重车受到的水平力平衡，原有速度会保持。", "id": "b", "misconception": "cancel-on-one", "text": "重车立刻停下，轻车受重车向左推"}, {"feedback": "绳的拉力也作用在重车上。两车接触时都会受到对方的推力。", "id": "c", "misconception": "cancel-on-one", "text": "重车向右加速，轻车没有受到推力"}], "type": "choice"}, "feedback": {"correct": "先看重车，两股力平衡，它保持向右的速度。再看互推的伙伴，重车对轻车的推力向左。", "wrong": "给重车画一张图，只放重车受到的力。"}, "hints": ["给重车画一张图，只放重车受到的力。", "再从两车的接触处找出作用在轻车上的那支箭头。"], "id": "q5", "stem": "水平直轨上，轻车从左向右推重车 4 牛，绳子同时向左拉重车 4 牛。两股力保持不变，重车原来向右滑，另无水平力。哪张记录能同时解释重车和轻车？"}], "shuffle": false}, "duration_min": 7, "id": "act.quiz.pair-track-01", "kind": "quiz", "targets": ["physics.motion.action-reaction"], "title": "给两辆车贴力签"}], "dq": "轻车跑得快，是它受到的推力比重车大吗？", "id": "physics.motion.action-reaction", "misconceptions": {"cancel-on-one": "反作用力在同一辆车上抵消"}, "title": "牛顿第三定律：两辆车互推"}]}</script>
<script>

const $app = document.getElementById("app"), $dock = document.getElementById("dock"), $dockIn = document.getElementById("dockIn");

// 这一页里的试玩记录，只放在内存里，刷新就没了

const ACTS = [];   // 按顺序排好的全部活动
for (const st of DATA.stars) for (const a of st.activities) ACTS.push({...a, star:st});
const actById = id => ACTS.find(a => a.id === id);

function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
function svgEl(markup){
  const t = document.createElement("template"); t.innerHTML = markup.trim(); return t.content.firstElementChild;
}

const AVA = `<svg class="ava" viewBox="0 0 48 48" aria-hidden="true">
  <circle cx="24" cy="27" r="16" fill="var(--c-sky)"/>
  <path class="k" d="M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z"/>
  <path class="k1" d="M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5"/>
  <circle cx="18.5" cy="25" r="2.2" fill="var(--ink)"/><circle cx="29.5" cy="25" r="2.2" fill="var(--ink)"/>
  <path class="k1" d="M18 32 C21 35 27 35 30 32"/></svg>`;
const SHIP = `<svg viewBox="0 0 100 100" aria-hidden="true">

  <path class="k" d="M50 10 C64 24 68 44 64 66 L36 66 C32 44 36 24 50 10 Z"/>
  <path class="k1" d="M44 40 C44 35 56 35 56 40 C56 45 44 45 44 40 Z"/>
  <path class="k" d="M36 52 L24 72 L37 66 M64 52 L76 72 L63 66"/>
  <path d="M43 70 C45 80 47 86 50 92 C53 86 55 80 57 70 Z" fill="var(--c-math)"/>

function scrollEnd(node){ node.scrollIntoView({block:"end", behavior: reduced ? "auto" : "smooth"}); }

/* 手绘线稿和挑战配图：从正式外壳 app/app.js 原样搬来（sketchLib、wedge、figureSvg），
   孩子在试玩页和正式外壳看到同一张图。改的时候两边一起改 */
function sketchLib() {
  const R = (seed) => { let s = ((seed | 0) * 2654435761) >>> 0 || 7; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; };
  const f = (n) => Math.round(n * 10) / 10;
  function cr(p, closed) {
    const n = p.length; let d = `M${f(p[0][0])} ${f(p[0][1])}`;
    for (let i = 0; i < (closed ? n : n - 1); i++) {
      const p1 = p[i], p2 = p[(i + 1) % n]; const p0 = (!closed && i === 0) ? p1 : p[(i - 1 + n) % n]; const p3 = (!closed && i + 2 >= n) ? p2 : p[(i + 2) % n];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return d;
  }
  function line(x1, y1, x2, y2, seed, j) {
    const r = R(seed); j = j == null ? 1 : j; const L = Math.hypot(x2 - x1, y2 - y1) || 1; const a = Math.min(1.8, .5 + L * .008) * j; const o = () => (r() - .5) * 2 * a;
    const nx = -(y2 - y1) / L, ny = (x2 - x1) / L, bow = (r() - .5) * Math.min(L * .035, 6) * j;
    return `M${f(x1 + o())} ${f(y1 + o())}Q${f((x1 + x2) / 2 + nx * bow)} ${f((y1 + y2) / 2 + ny * bow)} ${f(x2 + o())} ${f(y2 + o())}`;
  }
  function ellipse(cx, cy, rx, ry, seed, j) {
    const r = R(seed); j = j == null ? 1 : j; const N = 12, a0 = r() * Math.PI * 2, turn = 1.05 + r() * .06, p = [];
    for (let i = 0; i <= N; i++) { const t = a0 + i / N * Math.PI * 2 * turn, k = 1 + (r() - .5) * .07 * j; p.push([cx + Math.cos(t) * rx * k, cy + Math.sin(t) * ry * k]); }
    return cr(p, false);
  }
  function rect(x, y, w, h, seed, j) { return line(x, y, x + w, y, seed, j) + line(x + w, y, x + w, y + h, seed + 1, j) + line(x + w, y + h, x, y + h, seed + 2, j) + line(x, y + h, x, y, seed + 3, j); }
  function area(pts) { return "M" + pts.map((q) => f(q[0]) + " " + f(q[1])).join("L") + "Z"; }
  return { line, ellipse, rect, area, R };
}
const Sk = sketchLib();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const wedge = (cx, cy, r, a0, a1) => {
  const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
  return `M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z`;
};
const FIG_TYPES = ["pie", "rect", "rect-unequal", "number-line"];
/** 题目配图（内容规格 3.6），只画 FIG_TYPES 里的四种。 */
function figureSvg(fig, seed = 7) {
  let inner = "", vb = "0 0 200 120", label = "配图";
  if (fig.type === "pie") {
    const n = fig.parts, k = fig.shaded, cx = 100, cy = 60, r = 48;
    for (let i = 0; i < k; i++) inner += `<path class="fig-shade" d="${wedge(cx, cy, r, -Math.PI / 2 + i / n * 2 * Math.PI, -Math.PI / 2 + (i + 1) / n * 2 * Math.PI)}"/>`;
    inner += `<path class="k" d="${Sk.ellipse(cx, cy, r, r, seed, .5)}"/>`;
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i / n * 2 * Math.PI; inner += `<path class="k1" d="${Sk.line(cx, cy, cx + Math.cos(a) * r, cy + Math.sin(a) * r, seed + 3 + i, .4)}"/>`; }
    label = `一个圆，分成 ${n} 份，涂色 ${k} 份`; // 只描述形状：「平均」「不一样大」可能就是题目要问的
  } else if (fig.type === "rect" || fig.type === "rect-unequal") {
    const widths = fig.type === "rect" ? Array(fig.parts).fill(1) : fig.widths;
    const shaded = fig.type === "rect" ? [...Array(fig.shaded).keys()] : fig.shaded;
    const vertical = fig.type === "rect" && fig.direction === "v";
    const X = 20, Y = 20, W = 160, H = 80, sum = widths.reduce((a, b) => a + b, 0);
    let at = 0;
    widths.forEach((w, i) => {
      const a = at / sum, b = (at + w) / sum; at += w;
      const box = vertical ? [X, Y + a * H, W, (b - a) * H] : [X + a * W, Y, (b - a) * W, H];
      if (shaded.includes(i)) inner += `<path class="fig-shade" d="${Sk.area([[box[0], box[1]], [box[0] + box[2], box[1]], [box[0] + box[2], box[1] + box[3]], [box[0], box[1] + box[3]]])}"/>`;
      if (i > 0) inner += `<path class="k1" d="${vertical ? Sk.line(X, box[1], X + W, box[1], seed + 10 + i, .4) : Sk.line(box[0], Y, box[0], Y + H, seed + 10 + i, .4)}"/>`;
    });
    inner += `<path class="k" d="${Sk.rect(X, Y, W, H, seed, .5)}"/>`;
    label = `一个长方形，分成 ${widths.length} 份，涂色 ${shaded.length} 份`;
  } else if (fig.type === "number-line") {
    const from = Number(fig.from), to = Number(fig.to), stp = Number(fig.step) || 1;
    const x = (v) => 20 + (v - from) / ((to - from) || 1) * 160;
    vb = "0 0 200 70";
    inner += `<path class="k" d="${Sk.line(14, 34, 196, 34, seed, .4)}"/><path class="k1" d="${Sk.line(196, 34, 190, 30, seed + 1, .3) + Sk.line(196, 34, 190, 38, seed + 2, .3)}"/>`;   // 箭头在最后一个刻度（x=180）右边，不挨着
    const n = Math.min(60, Math.round((to - from) / stp));
    for (let i = 0; i <= n; i++) inner += `<path class="k1" d="${Sk.line(x(from + i * stp), 29, x(from + i * stp), 39, seed + 5 + i, .3)}"/>`;
    for (const m of fig.marks || []) inner += `<text x="${x(Number(m.at)).toFixed(1)}" y="58" text-anchor="middle" class="fig-txt">${esc(m.label ?? m.at)}</text>`;
    label = "一条数轴";
  }
  return `<svg class="fig" viewBox="${vb}" role="img" aria-label="${esc(label)}">${inner}</svg>`;
}

function figureNode(fig){
  const box = el("div", {class:"fig-box"});
  if (fig && FIG_TYPES.includes(fig.type)){
    box.classList.add("q-fig");
    box.append(svgEl(figureSvg(fig, 9)));   // 正式外壳挑战题用种子 9（app.js 里 figureSvg(item.figure, 9)）
  } else if (fig && fig.type === "svg" && DATA.figures[fig.src]){
    const s = svgEl(DATA.figures[fig.src]);
    s.removeAttribute("width"); s.removeAttribute("height");
    if (!reduced){
      s.querySelectorAll(".k,.k1").forEach(p => { if (!p.hasAttribute("stroke-dasharray")) p.setAttribute("pathLength","1"); else p.classList.remove("k","k1"); });
      s.classList.add("draw");
    }
    box.append(s);
  } else box.append(el("p", {class:"cap"}, "（这张图还没准备好）"));
  return box;
}

// ---------- 判分 ----------
function normNum(s){
  return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[．。]/g, ".").replace(/[－—]/g, "-").replace(/[，,\s]/g, "").replace(/[条对个本卷米厘次]+$/, "");
}
function parseNumber(s){
  const t = normNum(s); if (!/^-?\d+(\.\d+)?$/.test(t)) return null; return Number(t);
}
function parseFraction(s){
  const t = String(s).trim().replace(/／/g, "/").replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  let m = t.match(/^(\d+)\s*\/\s*(\d+)$/); if (m) return [Number(m[1]), Number(m[2])];
  m = t.match(/^(\d+)\s*分之\s*(\d+)$/); if (m) return [Number(m[2]), Number(m[1])];
  return null;
}
function grade(answer, input){
  // 返回 {ok, misconception, feedback} 或 null（写法认不出来，不算一次作答）
  if (answer.type === "choice"){
    const c = answer.choices.find(x => x.id === input);
    return {ok: !!c.correct, misconception: c.misconception || null, feedback: c.feedback || "", shown: c.text};
  }
  if (answer.type === "number"){
    const x = parseNumber(input); if (x === null) return null;
    const tol = answer.tolerance || 0, hit = v => Math.abs(x - v) <= tol + 1e-9;
    if (hit(answer.value)) return {ok:true, feedback:"", shown:String(x)};
    const w = (answer.common_wrong||[]).find(cw => hit(cw.value));
    return {ok:false, misconception: w && w.misconception || null, feedback: w && w.feedback || "", shown:String(x)};
  }
  if (answer.type === "fraction"){
    const f = parseFraction(input); if (!f) return null;
    const [a,b] = f; if (b === 0) return {ok:false, feedback:"", shown:`${a}/${b}`};
    const ok = answer.accept_equivalent ? a*answer.denominator === b*answer.numerator : (a === answer.numerator && b === answer.denominator);
    if (ok) return {ok:true, feedback:"", shown:`${a}/${b}`};
    const w = (answer.common_wrong||[]).find(cw => answer.accept_equivalent ? a*cw.denominator === b*cw.numerator : (a === cw.numerator && b === cw.denominator));
    return {ok:false, misconception: w && w.misconception || null, feedback: w && w.feedback || "", shown:`${a}/${b}`};
  }
  return null;
}
function answerText(answer){
  if (answer.type === "choice") return answer.choices.find(c => c.correct).text;
  if (answer.type === "number") return `${answer.value}${answer.unit ? " " + answer.unit : ""}`;
  if (answer.type === "fraction") return `${answer.numerator}/${answer.denominator}`;
  return "";
}

// ---------- 一道题（讲解里的小问题和挑战共用） ----------
// say(role, text)：role 是 nav / me / good / bad / hint
function askItem(host, item, say, onDone){
  const ans = item.answer, hints = item.hints || [];
  const rec = {stem:item.stem, tries:[], hints:0, result:null};
  let usedHints = 0, finished = false;
  const ctrl = el("div", {class:"ask"});
  let choiceBtns = [], numInput = null, okBtn = null;

  function finish(result){
    finished = true; rec.result = result;
    choiceBtns.forEach(b => b.disabled = true);
    if (numInput){ numInput.disabled = true; okBtn.disabled = true; }
    hintBtn.hidden = true;
    onDone(rec);
  }
  function submit(value, btn){
    if (finished) return;
    const g = grade(ans, value);
    if (!g){ say("nav", "写一个数字试试，比如 12。"); return; }
    rec.tries.push({shown:g.shown, ok:g.ok, misconception:g.misconception||null});
    if (ans.type !== "choice") say("me", g.shown + (ans.unit ? " " + ans.unit : ""));
    else say("me", g.shown);
    if (g.ok){
      if (btn) btn.classList.add("right");
      say("good", g.feedback ? "对了。" + g.feedback : (item.feedback?.correct || "对了。"));
      finish(rec.tries.length === 1 && usedHints === 0 ? "first" : "later");
    } else {
      if (btn){ btn.classList.add("wrong"); btn.disabled = true; }
      say("bad", g.feedback || item.feedback?.wrong || "这个想法很多人都有。再想想看，也可以要个提示。");
      if (numInput){ numInput.select(); }
    }
  }

  if (ans.type === "choice"){
    const box = el("div", {class:"choices"});
    for (const c of ans.choices){
      const b = el("button", {class:"choice", type:"button", onclick:()=>submit(c.id, b)}, c.text);
      choiceBtns.push(b); box.append(b);
    }
    ctrl.append(box);
  } else {
    numInput = el("input", {type:"text", inputmode: ans.type === "number" ? "decimal" : "text", "aria-label":"写答案", autocomplete:"off",
      placeholder: ans.type === "fraction" ? "比如 1/4" : "写数字",
      onkeydown: e => { if (e.key === "Enter") submit(numInput.value); }});
    okBtn = el("button", {class:"btn", type:"button", onclick:()=>submit(numInput.value)}, "确定");
    ctrl.append(el("div", {class:"numrow"}, numInput, ans.unit ? el("span", {class:"unit"}, ans.unit) : null, okBtn));
  }
  const hintBtn = el("button", {class:"btn ghost", type:"button", onclick: () => {
    if (finished) return;
    if (usedHints < hints.length){
      say("hint", hints[usedHints]); usedHints++; rec.hints = usedHints;
      if (usedHints >= hints.length) hintBtn.textContent = "看答案";
    } else {
      say("nav", "答案是：" + answerText(ans) + "。");
      choiceBtns.forEach((b, i) => { if (ans.choices[i].correct) b.classList.add("right"); });
      if (numInput) numInput.value = answerText(ans).split(" ")[0];
      finish("revealed");
    }
  }}, hints.length ? "要个提示" : "看答案");
  ctrl.append(el("div", {class:"row-btns"}, hintBtn));
  host.append(ctrl);
  return rec;
}

function bubbleRow(role, content){
  const cls = {nav:"", hint:"hint", good:"good", bad:"bad"}[role];
  if (role === "me") return el("div", {class:"row me pop"}, el("div", {class:"bub"}, content));
  const bub = el("div", {class:"bub " + (cls||"")}, role === "hint" ? el("span", {class:"lbl"}, "提示") : null, content);
  return el("div", {class:"row pop"}, svgEl(AVA), bub);
}

function viewExplain(a){
  const log = S.log[a.id] = {kind:"explain", items:[], questions:[]};
  const chat = el("div", {class:"chat"});
  $app.replaceChildren(chat);
  const steps = a.body.steps; let i = 0;
  const say = (role, text) => { const r = bubbleRow(role, text); chat.append(r); scrollEnd(r); };
  const contBtn = el("button", {class:"btn", type:"button", onclick:()=>step()}, "继续");
  const qBtn = el("button", {class:"btn ghost", type:"button", onclick:()=>openAsk()}, "我有个问题");

  function openAsk(){
    if (chat.querySelector(".composer")) return;
    const ta = el("textarea", {maxlength:"120", placeholder:"想问领航员什么？"});
    const box = el("div", {class:"composer pop"}, ta, el("div", {class:"row-btns"},
      el("button", {class:"btn ghost", type:"button", onclick:()=>box.remove()}, "算了"),
      el("button", {class:"btn", type:"button", onclick:()=>{
        const q = ta.value.trim(); if (!q) return; box.remove();
        log.questions.push(q); say("me", q);
        say("nav", "好问题。我把它记在试玩记录里了，等会儿和家长一起找答案。");
      }}, "问领航员")));
    chat.append(box); scrollEnd(box); ta.focus();
  }
  function step(){
    if (i >= steps.length) return;
    const s = steps[i++];
    if (s.type === "text") say("nav", s.text);
    else if (s.type === "figure"){
      const r = el("div", {class:"row pop"}, svgEl(AVA), el("div", {class:"bub fig"}, figureNode(s.figure), s.caption ? el("div", {class:"cap"}, s.caption) : null));
      chat.append(r); scrollEnd(r);
    } else if (s.type === "check"){
      const bub = el("div", {class:"bub"}, el("div", {class:"stem"}, s.item.stem));
      const r = el("div", {class:"row pop"}, svgEl(AVA), bub); chat.append(r);
      dock(qBtn);
      const rec = askItem(bub, s.item, say, rec => { log.items.push(rec); afterStep(); });
      scrollEnd(r);
      return;
    }
    afterStep();
  }
  function afterStep(){
    if (i < steps.length){ dock(qBtn, contBtn); return; }
    S.done[a.id] = true; dock(qBtn);
    const card = el("div", {class:"endcard pop"}, el("h3", {}, "这一段讲完了"), endButtons(a));
    chat.append(card); scrollEnd(card);
  }
  step();
}

function shuffled(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function viewQuiz(a){
  const items = a.body.shuffle ? shuffled(a.body.items) : a.body.items.slice();
  const log = S.log[a.id] = {kind:"quiz", items:[]};
  let k = 0;
  function show(){
    dock();
    if (k >= items.length) return summary();
    const it = items[k];
    const prog = el("div", {class:"progress"}, ...items.map((_, j) => el("i", {class: j < k ? (log.items[j].result === "first" ? "ok" : "on") : (j === k ? "on" : "")})), el("span", {}, ` 第 ${k+1} 题，共 ${items.length} 题`));
    const fb = el("div", {class:"fb"});
    const card = el("div", {class:"qcard pop"}, el("div", {class:"stem"}, it.stem));
    if (it.figure) card.append(figureNode(it.figure));
    const say = (role, text) => {
      if (role === "me") return;
      const cls = {nav:"", hint:"hint", good:"good", bad:"bad"}[role];
      if (role !== "hint") fb.querySelectorAll(".bub:not(.hint)").forEach(n => n.remove());
      const b = el("div", {class:"bub pop " + cls}, role === "hint" ? el("span", {class:"lbl"}, "提示") : null, text);
      fb.append(b); scrollEnd(b);
    };
    $app.replaceChildren(prog, card);
    askItem(card, it, say, rec => {
      log.items.push(rec);
      dock(el("button", {class:"btn", type:"button", onclick:()=>{ k++; show(); window.scrollTo(0,0); }}, k + 1 < items.length ? "下一题" : "看看结果"));
    });
    card.append(fb);
  }
  function summary(){
    S.done[a.id] = true;
    const first = log.items.filter(r => r.result === "first").length;
    const card = el("div", {class:"endcard pop"},
      el("h3", {}, "挑战完成"),
      el("p", {}, `${items.length} 道题里，一次就答对 ${first} 道。` + (first < items.length ? "想岔的地方，正好看清楚了。" : "全部一次答对。")),
      endButtons(a));
    $app.replaceChildren(card);
  }
  show();
}
