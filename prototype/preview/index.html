 = zT; seen2(S.want); }\n      else { render(); readoutZoom(); }\n    } else if (S.mode === \"zoomout\"){\n      render(); if (S.nzP >= 1) actNeuron();\n    } else if (S.mode === \"neuron\"){\n      if (S.nt >= .985 && S.np > .975){ S.nt = S.np = 1; doneNeuron(); }\n      else { render(); readoutNeuron(); }\n    } else if (S.mode === \"act3\"){\n      if (S.dt >= .985 && S.d > tOfD(.975)){ S.dt = 1; S.d = MODEL.divisions; S.holdKey = null; render(); readout3(); done3(); }   // 读数对齐到 45 次\n      else { milestones3(); render(); readout3(); }\n    } else render();\n  }\n  requestAnimationFrame(tick);\n}\nHost.ready();   // 先发 ready，再发别的消息\nenter1();\nrequestAnimationFrame(tick);\n<\/script>\n<\/body>\n<\/html>\n", "id": "act.simulation.cell-zoom-01", "kind": "simulation", "title": "显微镜下的小房间"}, {"body": {"steps": [{"text": "舰长，你的身体是用什么搭起来的？先想一想，不急着回答。", "type": "text"}, {"text": "房子能用一块块积木搭，身体能用一个个细胞搭。人和动物这样，大树、小草也这样。", "type": "text"}, {"item": {"answer": {"choices": [{"feedback": "很多人都先想到人和动物。大树、小草也是由一个个细胞组成的。", "id": "a", "misconception": "only-animals", "text": "只有人和动物"}, {"correct": true, "id": "b", "text": "人、动物和植物"}, {"feedback": "植物确实由细胞组成，不过人和动物的身体也是由细胞搭成的。", "id": "c", "text": "只有植物"}], "type": "choice"}, "hints": ["想想积木的比方，除了身体，还有谁也能这样搭？", "一片树叶、一棵小草，它们是不是也有生命？", "别把范围只放在会跑会跳的生命上。"], "id": "c1", "stem": "下面哪些是由细胞组成的？"}, "type": "check"}, {"text": "大多数细胞小得连放大镜都不够，要用显微镜才能看见。", "type": "text"}, {"caption": "从树叶到显微镜下的细胞：大多数细胞很小，要放大很多倍才看得见。", "figure": {"src": "content/assets/biology.cell.cell-intro/cell-zoom.svg", "type": "svg"}, "type": "figure"}, {"item": {"answer": {"choices": [{"feedback": "用眼睛看最方便，不过大多数细胞太小，眼睛直接看不清。", "id": "a", "misconception": "visible", "text": "只用眼睛"}, {"feedback": "放大镜能让东西变大，但大多数细胞还是太小，需要显微镜。", "id": "b", "misconception": "visible", "text": "放大镜"}, {"correct": true, "id": "c", "text": "显微镜"}], "type": "choice"}, "hints": ["先想想，大多数细胞有多小。", "放大镜能看清树叶上的细脉，还能看清更小的细胞吗？", "要找一种比放大镜本领更大的观察工具。"], "id": "c2", "stem": "想看看大多数细胞，用哪种工具更合适？"}, "type": "check"}, {"text": "神经细胞长长的，伸出许多分叉，负责传消息；红细胞圆圆扁扁，负责运氧气。肌肉细胞细细长长，能用力收缩。", "type": "text"}, {"caption": "神经细胞传消息，红细胞运氧气，肌肉细胞能收缩；它们的形状和本领各不一样。", "figure": {"src": "content/assets/biology.cell.cell-intro/cell-kinds.svg", "type": "svg"}, "type": "figure"}, {"text": "细胞可不像积木：它是活的，会吸收养料、会长大，还会一个分成两个。", "type": "text"}, {"caption": "一个细胞慢慢收紧，分成两个细胞。", "figure": {"src": "content/assets/biology.cell.cell-intro/cell-divide.svg", "type": "svg"}, "type": "figure"}, {"item": {"answer": {"choices": [{"feedback": "积木确实一直不变，但细胞会吸收养料、会长大，不是不变的小零件。", "id": "a", "misconception": "cells-are-dead", "text": "会像积木一样一直不变"}, {"correct": true, "id": "b", "text": "会吸收养料、长大，还能分成两个"}, {"feedback": "看起来确实像小零件，但细胞会吸收养料、会长大，还会分成两个。", "id": "c", "misconception": "cells-are-dead", "text": "只是身体里没有生命的小零件"}], "type": "choice"}, "hints": ["回忆一下，细胞和积木最不一样的地方。", "活的细胞不会一直停在原来的样子。", "找找哪个选项在说细胞会变化、会增加。"], "id": "c3", "stem": "下面哪件事说明细胞是活的？"}, "type": "check"}, {"text": "细胞这个小房间里，还有一个更小的房间，叫细胞核，里面放着一份“说明书”。", "type": "text"}, {"caption": "细胞核像小房间里的小房间，里面放着一份“说明书”。", "figure": {"src": "content/assets/biology.cell.cell-intro/cell-nucleus.svg", "type": "svg"}, "type": "figure"}, {"text": "动物和植物的细胞一般都有细胞核；人成熟的红细胞把细胞核扔掉了，是例外。", "type": "text"}, {"text": "这份“说明书”上写的是什么？舰长，去下一颗星 DNA 找答案吧。", "type": "text"}], "style": "tutor"}, "duration_min": 5, "id": "act.explain.cell-intro-01", "kind": "explain", "title": "细胞：生命的小房间"}, {"body": {"items": [{"answer": {"choices": [{"feedback": "人和动物由细胞组成，这很容易注意到；植物也是由细胞组成的。", "id": "b", "misconception": "only-animals", "text": "人和动物由细胞组成，植物不是"}, {"correct": true, "id": "a", "text": "人、动物和植物都由细胞组成"}, {"feedback": "植物确实由细胞组成；人和动物的身体也是由细胞组成的。", "id": "c", "text": "植物由细胞组成，人和动物不是"}], "type": "choice"}, "hints": ["想一想，人、动物和植物是不是都要算进去。", "不要只看会跑会跳的动物，也想想植物。"], "id": "q1", "stem": "舰长，下面哪种说法对？"}, {"answer": {"choices": [{"feedback": "把细胞想成小零件很方便，但细胞和零件不一样，它是活的。", "id": "b", "misconception": "cells-are-dead", "text": "只是身体里的小零件，不是活的"}, {"feedback": "细胞搭成身体，确实有点像积木；但细胞会变化，不是搭好就不动。", "id": "c", "misconception": "cells-are-dead", "text": "像积木一样，搭好以后就不再变化"}, {"correct": true, "id": "a", "text": "会吸收养料、长大，还会分成两个"}], "type": "choice"}, "hints": ["想想活的东西会做什么，积木会不会做这些事。", "回忆一下，细胞会不会吸收养料、长大和变化。"], "id": "q2", "stem": "下面哪件事说明细胞是活的？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "显微镜"}, {"feedback": "眼睛能看清许多东西，但大多数细胞太小，直接用眼睛通常看不见。", "id": "b", "misconception": "visible", "text": "眼睛"}, {"feedback": "放大镜确实能帮忙看小东西，但大多数细胞还需要放大得更多。", "id": "c", "misconception": "visible", "text": "放大镜"}], "type": "choice"}, "hints": ["这种工具能把很小的东西放得更大。", "放大镜能帮一点忙，但大多数细胞还需要更强的工具。"], "id": "q3", "stem": "大多数细胞很小，想看清楚它们，通常要用什么？"}, {"answer": {"choices": [{"feedback": "都叫细胞，听起来像同一种；其实神经细胞和肌肉细胞的样子并不一样。", "id": "b", "misconception": "one-kind", "text": "身体里的细胞都长得一样"}, {"feedback": "身体是一个整体，容易让人这样想；但不同细胞有不同的本领。", "id": "c", "misconception": "one-kind", "text": "身体里的细胞只有一种"}, {"correct": true, "id": "a", "text": "有很多种细胞，形状和本领各不一样"}], "type": "choice"}, "hints": ["想想神经细胞和肌肉细胞，它们做的事情一样吗？", "它们的名字已经告诉我们本领不同，再想想样子会不会也不同。"], "id": "q4", "stem": "关于身体里的细胞，下面哪种说法对？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "细胞核"}, {"feedback": "红细胞的名字里也有“细胞”，但它是一种细胞，不是放说明书的小房间。", "id": "b", "text": "红细胞"}, {"feedback": "显微镜能帮我们看细胞，但它是工具，不是细胞里面的小房间。", "id": "c", "text": "显微镜"}], "type": "choice"}, "hints": ["它在细胞里面，不是另一种细胞，也不是看细胞的工具。", "它在细胞里面，名字里有一个“核”字。"], "id": "q5", "stem": "细胞里放说明书的小房间是什么？"}, {"answer": {"choices": [{"feedback": "红细胞确实是细胞；但人成熟的红细胞没有细胞核，是一个例外。", "id": "b", "text": "所有细胞都有细胞核，人成熟的红细胞也有"}, {"correct": true, "id": "a", "text": "动物和植物的细胞一般都有细胞核"}, {"feedback": "动物细胞一般有细胞核，这点你想到了；植物细胞一般也有。", "id": "c", "text": "只有动物的细胞有细胞核，植物的细胞没有"}], "type": "choice"}, "hints": ["想想放说明书的小房间，大多数动物和植物的细胞里都有它。", "注意“一般”不等于“所有”，人成熟的红细胞是例外。"], "id": "q6", "stem": "关于细胞核，下面哪种说法对？"}], "shuffle": true}, "duration_min": 5, "id": "act.quiz.cell-intro-01", "kind": "quiz", "title": "细胞小房间挑战"}], "dq": "你的身体是用什么搭起来的？", "id": "biology.cell.cell-intro", "misconceptions": {"cells-are-dead": "细胞只是身体里的小零件，它们不是活的。", "one-kind": "身体里的细胞都长得一样。", "only-animals": "只有动物和人是由细胞组成的，植物不是。", "visible": "细胞用眼睛就能看见。"}, "title": "细胞：生命的小房间"}, {"activities": [{"age_band": "G3-4", "duration_min": 10, "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>翻开细胞里的说明书<\/title>\n<style>\n:root{\n  --bg:#F5F4EE; --pane:#FBFAF6; --rule:#E0DCD0; --hover:#E7E4D9;\n  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;\n  --accent:#C2603F; --accent-soft:#F3E0D6;\n  --sage:#CCD6C0; --sage-bg:#DCE3D2; --sky:#CFDCE6; --apricot:#ECCDB6; --paper:#EFE4D6;\n  --dad:#4F7FA8; --mom:#C2603F; --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;\n  --f-serif:\"Noto Serif SC\",\"Source Han Serif SC\",\"Songti SC\",Georgia,serif;\n  --f-sans:\"Noto Sans SC\",\"PingFang SC\",\"Microsoft YaHei\",system-ui,sans-serif;\n  --f-mono:ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n  color-scheme:light;\n}\n@media (prefers-color-scheme:dark){:root{\n  --bg:#1E1E1E; --pane:#252525; --rule:#353535; --hover:#2E2E2E;\n  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;\n  --accent:#E0876A; --accent-soft:#3A2A24;\n  --sage:#3C4836; --sage-bg:#28301F; --sky:#2D3B47; --apricot:#5A4536; --paper:#33302A;\n  --dad:#7FA9CF; --mom:#E0876A; --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;\n  color-scheme:dark;\n}}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}\nbutton{font:inherit;color:inherit;cursor:pointer}\n.wrap{max-width:820px;margin:0 auto;padding:12px 14px 28px}\n.card{background:var(--pane);border:1px solid var(--rule);border-radius:18px;overflow:hidden}\n.card header,.card footer{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 16px}\n.card header{border-bottom:1px solid var(--rule)}\n.card footer{border-top:1px solid var(--rule);min-height:44px;align-items:center;flex-wrap:wrap;row-gap:2px}\n.card footer .readout{margin-left:auto}\n.station{font-size:13px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}\nh1{font-family:var(--f-serif);font-size:20px;font-weight:600;color:var(--ink);margin:0;text-align:right}\n.hint{font-size:14px;color:var(--muted)}\n.readout{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px;text-align:right}\n.readout b{color:var(--accent);font-weight:600}\nsvg#stage{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}\nsvg#stage:focus{outline:none}\nsvg#stage:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}\n.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}\n.kf{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:4 7}\n.kr{fill:none;stroke:var(--bad);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}\n.ka{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n.kg{fill:none;stroke:var(--good);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n/* SVG 里的字一律用这几个类控制字号；窄屏在下面的 @media 里放大（写在属性上的 font-size 会被这里盖掉） */\n.t{fill:var(--ink);font-family:var(--f-sans);font-size:17px}\n.tm{fill:var(--muted);font-family:var(--f-sans);font-size:15px}\n.lab{fill:var(--ink);font-family:var(--f-sans);font-size:19px}\n.ttl{fill:var(--ink);font-family:var(--f-serif);font-size:28px}\n.big{fill:var(--ink);font-family:var(--f-serif);font-size:30px}\n.let{fill:var(--ink);font-family:var(--f-mono);font-size:17px;font-weight:600}\n.tb{fill:var(--pane);font-family:var(--f-serif);font-weight:700}\n.acc,.let.hi{fill:var(--accent)}\n.bold{font-weight:700}\n.pulse{animation:pulse 1.4s ease-in-out infinite}\n@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.95}}\n.talk{display:flex;gap:10px;align-items:flex-start;margin:14px 2px 6px}\n.ava{flex:none;width:42px;height:42px}\n.bubble{background:var(--pane);border:1px solid var(--rule);border-radius:16px 16px 16px 4px;padding:10px 14px;color:var(--ink);min-height:44px;flex:1}\n.bubble.good{background:var(--good-soft);border-color:transparent}\n.bubble.bad{background:var(--bad-soft);border-color:transparent}\n.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin:10px 0 0}\n.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 18px;min-height:48px;font-size:17px;font-weight:600;touch-action:manipulation}\n.btn.ghost{background:var(--pane);color:var(--ink)}\n.btn.choice{background:var(--bg);color:var(--ink);font-weight:500;text-align:left;flex:1 1 200px}\n.btn.choice:hover{background:var(--hover)}\n.btn.hold{background:var(--accent);border-color:var(--accent);color:#fff;touch-action:none;-webkit-touch-callout:none}\n.btn.hold.on{filter:brightness(.9)}\n.btn:disabled{opacity:.4;cursor:default}\n.btn.small{min-height:40px;font-size:15px;padding:6px 14px;font-weight:500}\n.qbox{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}\n.qbox textarea{flex:1 1 260px;font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);min-height:64px}\n@media (prefers-reduced-motion:reduce){ .pulse{animation:none;opacity:.8} }\n@media (max-width:520px){ body{font-size:16px} h1{font-size:17px} .card header,.card footer{padding:8px 12px}\n  .t{font-size:26px} .tm{font-size:24px} .lab{font-size:28px} .ttl{font-size:40px} .big{font-size:42px} .let{font-size:23px} }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\">第 1 站 · 共 4 站<\/span><h1 id=\"title\">打开小房间<\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 800 600\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <defs><clipPath id=\"lens\"><circle cx=\"575\" cy=\"280\" r=\"186\"/><\/clipPath><clipPath id=\"view2\"><circle cx=\"190\" cy=\"212\" r=\"150\"/><\/clipPath><\/defs>\n      <g id=\"static\"><\/g><g id=\"dyn\"><g id=\"d1\"><\/g><g id=\"d2\"><\/g><g id=\"d3\"><\/g><\/g>\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* ============ 1. 真相模型：页面上的每个数字都从这里算 ============\n   核对记录（2026-11 逐条查过）：\n   - 只有 4 种字母 A、T、C、G：NHGRI 词条「ACGT」 https://www.genome.gov/genetics-glossary/acgt\n     （\"the four types of bases found in a DNA molecule: adenine (A), cytosine (C), guanine (G), and thymine (T)\"）；\n     MedlinePlus「What is DNA?」 https://medlineplus.gov/genetics/understanding/basics/dna/\n   - 一个人体细胞里的字母数：Piovesan 等 2019，BMC Research Notes 12:106 https://pmc.ncbi.nlm.nih.gov/articles/PMC6391780\n     女性细胞（二倍体）6.37 Gbp，男性 6.27 Gbp；页面取 6.37e9，显示「约 64 亿」（男性约 63 亿，同样念约 200 年）。\n     Nature Scitable「DNA Packaging」 https://www.nature.com/scitable/topicpage/dna-packaging-nucleosomes-and-chromatin-310\n     给的是粗略的「每个细胞约 60 亿」；页面不提「两套」，那是下一颗星的内容。\n   - 念完要多少年：6.37e9 秒 ÷ 31,557,600 秒/年 ≈ 202 年，取整到十位显示「约 200 年」。\n   - 一辈子按 80 年：《2024 年我国卫生健康事业发展统计公报》人均预期寿命 79 岁（澎湃新闻转述\n     https://m.thepaper.cn/newsDetail_forward_32093559），取整成 80。202 ÷ 80 ≈ 2.5，说「2 个半辈子」。\n   - 绝大多数细胞带同一套说明书：MedlinePlus「Nearly every cell in a person's body has the same DNA.」；\n     读不同的部分：The Tech「Ask a Geneticist」 https://www.thetech.org/ask-a-geneticist/ask398\n     （\"each cell type only reads the genes it needs\"）。适龄简化成「同一本书，读不同的几处」。\n     真实细胞读的是散在全书的很多小段，页面画 3 个书签，并让领航员说明「这里是打个比方」。\n   - 成熟红细胞没有细胞核：Britannica「Red blood cell」 https://www.britannica.com/science/red-blood-cell （\"lacks a nucleus\"）；\n     白细胞有细胞核：Britannica「Blood: White blood cells」 https://www.britannica.com/science/blood-biochemistry/White-blood-cells-leukocytes\n   - 嘴里（口腔内壁）的细胞有细胞核，学校实验常用；手背最外层是死细胞，所以第 3 站不用「手上的皮肤」：\n     人教版七上「观察人的口腔上皮细胞」实验。\n   - 分成两个之前先抄一份、长个子和补伤口都靠细胞分裂：NIH NIGMS《Inside the Cell》第 4 章\n     https://webarchive.library.unt.edu/eot2008/20090130193729/http:/publications.nigms.nih.gov/insidethecell/chapter4.html\n     人教版七上第一单元第三章第一节「细胞通过分裂产生新细胞」。\n   - DNA 这个名字、遗传（爸爸妈妈传给孩子）：人教版八下第六单元第二章第二节（星座文档已核对）。\n   - 下面几项不是事实，是页面自己的换算和示意，界面上都说「如果」或不显示数字：\n     lettersPerPage：假设一页印 1 万个字母，只用来说「这本书有多少页」；tabs：三种细胞的书签位置只是示意；\n     woundSlots：伤口要补的格数，只是画面的格子数。 */\nconst MODEL = {\n  kinds: [\"A\", \"T\", \"C\", \"G\"],     // 4 种字母（NHGRI「ACGT」）\n  lettersPerCell: 6.37e9,          // 一个细胞里的字母数（Piovesan 2019，女性 6.37 Gbp）\n  readPerSec: 1,                   // 一秒念一个\n  secPerYear: 365.25 * 24 * 3600,  // 一年的秒数\n  slowLetters: 5,                  // 先一秒一个地念 5 个，再快进\n  lifeYears: 80,                   // 一辈子约 80 年（2024 年统计公报人均预期寿命 79 岁，取整）\n  lettersPerPage: 1e4,             // 假设：一页印 1 万个字母（只作换算，界面上写「如果」）\n  tabs: {                          // 书签在书里的位置（0 = 第一页，1 = 最后一页），只是示意\n    nerve:  [.12, .46, .80],\n    muscle: [.27, .60, .91],\n    skin:   [.05, .35, .69]\n  },\n  woundSlots: 6                    // 伤口宽 6 格（画面格子）\n};\nMODEL.readSec = MODEL.lettersPerCell / MODEL.readPerSec;\nMODEL.readYears = MODEL.readSec / MODEL.secPerYear;               // ≈ 202\nMODEL.pagesTotal = MODEL.lettersPerCell / MODEL.lettersPerPage;    // ≈ 63.7 万\nMODEL.lives = MODEL.readYears / MODEL.lifeYears;                   // ≈ 2.5\nconst YEARS = Math.round(MODEL.readYears / 10) * 10;               // 显示用：200\nconst LIVES2 = Math.round(MODEL.lives * 2) / 2;                    // 取到半个：2.5\nconst LIVES_TXT = Math.floor(LIVES2) + (LIVES2 % 1 ? \" 个半\" : \" 个\");   // 「2 个半」\nconst ORDER = [\"nerve\", \"muscle\", \"skin\"];\nconst CELLS = { nerve: { name: \"神经细胞\", short: \"神经\" }, muscle: { name: \"肌肉细胞\", short: \"肌肉\" }, skin: { name: \"皮肤细胞\", short: \"皮肤\" } };\nfunction fmtBig(n){   // 「64 亿」「1.2 万」；后面直接接量词：`${fmtBig(n)}个`\n  if (n >= 1e8) return (n >= 1e9 ? String(Math.round(n / 1e8)) : (n / 1e8).toFixed(1).replace(/\\.0$/, \"\")) + \" 亿\";\n  if (n >= 1e4) return (n >= 1e5 ? String(Math.round(n / 1e4)) : (n / 1e4).toFixed(1).replace(/\\.0$/, \"\")) + \" 万\";\n  return String(Math.round(n));\n}\nfunction fmtDur(s){\n  if (s < 60) return Math.round(s) + \" 秒\";\n  if (s < 3600) return Math.round(s / 60) + \" 分钟\";\n  if (s < 86400) return Math.round(s / 3600) + \" 小时\";\n  if (s < MODEL.secPerYear) return Math.round(s / 86400) + \" 天\";\n  return Math.round(s / MODEL.secPerYear) + \" 年\";\n}\nconst TOTAL_TXT = fmtBig(MODEL.lettersPerCell);   // 「64 亿」\nconst PAGES_TXT = fmtBig(MODEL.pagesTotal);       // 「64 万」\n\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩） ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n\n/* ============ 3. 手绘线条（平台的 sketchLib） ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function blob(cx,cy,rx,ry,seed){ const r=R(seed), N=9, p=[]; for(let i=0;i<N;i++){ const t=i/N*Math.PI*2, k=1+(r()-.5)*.1; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); } return cr(p,true)+\"Z\"; }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,blob,curve,cr,R};\n}\nconst Sk = sketchLib();\n// 线条：class 里的 stroke 会盖过同名属性，所以线宽、颜色写进 style\nfunction styl(extra){\n  let st = \"\";\n  let e = (extra || \"\").replace(/\\s*style=\"([^\"]*)\"/, (m, v) => { st += v.endsWith(\";\") ? v : v + \";\"; return \"\"; });\n  e = e.replace(/\\s*(stroke|stroke-width|stroke-dasharray|fill)=\"([^\"]+)\"/g, (m, k, v) => { st += `${k}:${v};`; return \"\"; });\n  return (e.trim() ? \" \" + e.trim() : \"\") + (st ? ` style=\"${st}\"` : \"\");\n}\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${styl(extra)}/>`;\n// 字：字号只用 CSS 类（t / tm / lab / ttl / big / let），颜色用 acc，粗细用 bold\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst F = (d, fill, op) => `<path d=\"${d}\" fill=\"var(--${fill})\" opacity=\"${op == null ? .7 : op}\"/>`;\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst smooth = t => t * t * (3 - 2 * t);\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);\nfunction lettersOf(seed, n){ const r = Sk.R(seed), k = MODEL.kinds; let s = \"\"; for (let i = 0; i < n; i++) s += k[Math.floor(r() * 4)]; return s; }\nconst xsOf = (x0, dx, n) => Array.from({ length: n }, (_, i) => (x0 + i * dx).toFixed(1)).join(\" \");\n\n/* ============ 4. 页面骨架 ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gStatic = $(\"static\"), LAYERS = [$(\"d1\"), $(\"d2\"), $(\"d3\")];\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst narrowMQ = matchMedia(\"(max-width:520px)\");\nconst narrow = () => narrowMQ.matches;\nconst STATIONS = 4;\nconst S = { round: 1 };\nfunction resetState(){\n  Object.assign(S, { station: 1, mode: \"intro\", hold: false, time: 0,\n    dt: 0, dp: 0, bx: 0, by: 0, snap: false, placed: false,\n    read: 0, ft: 0, fp: 0, flip: 0, fastSaid: false,\n    vt: 0, vp: 0, visited: {}, said2: {}, dragDial: false,\n    view: null, open: {}, openT: {}, found: {}, kf: 0, kbd: false,\n    ht: 0, hp: 0, pass: 0, passing: false, showCat: false, done: {}, wait2: false });\n  S.bx = C1.b0[0]; S.by = C1.b0[1];\n}\n// 事件只在第一轮发；「再玩一次」不再记猜测、观察和完成\nconst ev = (verb, result) => { if (S.round === 1) Host.event(verb, result); };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ $(\"readout\").innerHTML = html || \"\"; }\nfunction say(text, tone){ const b = $(\"say\"); b.textContent = text; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\n// 动手的时候（这些模式）不把焦点抢到按钮上，键盘留在画面里\nconst ACT = new Set([\"door\", \"pull\", \"read\", \"find\", \"heal\"]);\nconst acting = () => ACT.has(S.mode) || (S.mode === \"dial\" && !S.done[2]);\n// 手指还按着时换出来的新按钮，先禁用到手指抬起，免得松手时误点（按住类操作刚完成时最常见）\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev2 of [\"pointerup\", \"pointercancel\"]) addEventListener(ev2, () => { fingerDown = false; }, true);   // 抬起时立刻记下：随后的 click 里换出的按钮不必禁用\n// 键盘也一样：按住空格「念」到完成时，焦点会移到新按钮，松开空格那一下不能算点了它\nlet keyStart = null;\naddEventListener(\"keydown\", e => { if ((e.key === \" \" || e.key === \"Enter\") && !e.repeat) keyStart = performance.now(); }, true);\naddEventListener(\"keyup\", e => { if (e.key === \" \" || e.key === \"Enter\") setTimeout(() => { keyStart = null; }, 0); }, true);\nfunction actions(list){\n  const box = $(\"actions\"); box.replaceChildren();\n  const guard = fingerDown, born = performance.now();\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.textContent = a.label;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const e2 of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(e2, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); a.step(); } });\n      b.addEventListener(\"contextmenu\", e => e.preventDefault());\n    } else {\n      // 刚出现的 0.4 秒内不响应，免得双击「继续」时第二下替孩子选了答案\n      b.addEventListener(\"click\", e => { if (performance.now() - born < 400) return; if (e.detail === 0 && keyStart !== null && keyStart < born) return; a.go(e); });\n      if (guard){ b.disabled = true; const on = () => { setTimeout(() => { b.disabled = false; }, 120); removeEventListener(\"pointerup\", on, true); removeEventListener(\"pointercancel\", on, true); };\n        addEventListener(\"pointerup\", on, true); addEventListener(\"pointercancel\", on, true); }\n    }\n    box.append(b);\n  }\n  const first = box.querySelector(\"button\");\n  if (first && !acting()) first.focus({ preventScroll: true });   // 键盘用户不用再找按钮\n  return box;\n}\nfunction ask(question, options, onAnswer){\n  say(question);\n  actions(options.map((o, i) => ({ label: o.label, cls: \"choice\", go: () => {\n    ev(\"predicted\", { station: S.station, choice: i, correct: !!o.correct, misconception: o.mis || null });\n    say(o.feedback, o.correct ? \"good\" : \"bad\");\n    onAnswer(o);\n  }})));\n}\nfunction next(label, go, cls){ actions([{ label, go, cls }]); }\n// 一串只有「继续」的话\nfunction chain(lines, last){\n  const step = i => { const [text, tone] = Array.isArray(lines[i]) ? lines[i] : [lines[i]]; say(text, tone);\n    if (i + 1 < lines.length) next(\"继续\", () => step(i + 1)); else next(last[0], last[1]); };\n  step(0);\n}\n\n// 「我有个问题」：随时可以问，发到信号站\n(function(){\n  const area = $(\"qarea\");\n  const open = document.createElement(\"button\");\n  open.type = \"button\"; open.className = \"btn ghost small\"; open.textContent = \"我有个问题\";\n  open.style.marginTop = \"12px\";\n  open.addEventListener(\"click\", () => {\n    if (area.querySelector(\"textarea\")) return;\n    const ta = document.createElement(\"textarea\"); ta.maxLength = 120; ta.placeholder = \"想问领航员什么？\";\n    const send = document.createElement(\"button\"); send.type = \"button\"; send.className = \"btn small\"; send.textContent = \"发给领航员\";\n    const box = document.createElement(\"div\"); box.className = \"qbox\"; box.append(ta, send);\n    send.addEventListener(\"click\", () => {\n      const q = ta.value.trim(); if (!q) return;\n      Host.noteQuestion(q); box.remove(); say(\"好问题，我记下来了。等会儿一起找答案。\");\n    });\n    area.append(box); ta.focus();\n  });\n  area.append(open);\n})();\n\n/* ============ 5. 共用的画：书、细胞核的小门、几种细胞 ============ */\n// 合上的书（正面）。mark：dna（写 DNA）、bone（狗的）、fish（猫的）、none\nfunction bookShut(cx, cy, w, seed, mark, cover){\n  const h = w * 1.34, x = cx - w / 2, y = cy - h / 2, e = Math.max(2, w * .06);\n  let s = `<rect x=\"${(x + e).toFixed(1)}\" y=\"${(y + e).toFixed(1)}\" width=\"${w.toFixed(1)}\" height=\"${h.toFixed(1)}\" rx=\"${(w * .06).toFixed(1)}\" fill=\"var(--paper)\"/>` +\n    P(Sk.line(x + w, y + e + 2, x + w + e, y + e + 2, seed, .3) + Sk.line(x + w + e, y + e + 2, x + w + e, y + h + e, seed + 1, .4) + Sk.line(x + w + e, y + h + e, x + e + 2, y + h + e, seed + 2, .4), \"k1\") +\n    `<rect x=\"${x.toFixed(1)}\" y=\"${y.toFixed(1)}\" width=\"${w.toFixed(1)}\" height=\"${h.toFixed(1)}\" rx=\"${(w * .06).toFixed(1)}\" fill=\"var(--${cover || \"accent\"})\" opacity=\".9\"/>` +\n    P(box(x, y, w, h, seed + 3, Math.min(1, w / 60)), w > 40 ? \"k\" : \"k1\") + P(Sk.line(x + w * .17, y + 2, x + w * .17, y + h - 2, seed + 7, .5), \"k1\");\n  const mx = cx + w * .08, my = cy;\n  if (mark === \"dna\" && w >= 56) s += `<text x=\"${mx.toFixed(1)}\" y=\"${(my + w * .1).toFixed(1)}\" class=\"tb\" text-anchor=\"middle\" style=\"font-size:${Math.round(w * .27)}px\">DNA<\/text>`;\n  if (mark === \"bone\"){ const b = w * .2; s += `<g fill=\"var(--pane)\"><rect x=\"${mx - b}\" y=\"${my - b * .22}\" width=\"${b * 2}\" height=\"${b * .44}\" rx=\"${b * .2}\"/>` +\n    [[-1, -1], [-1, 1], [1, -1], [1, 1]].map(([i, j]) => `<circle cx=\"${mx + i * b}\" cy=\"${my + j * b * .28}\" r=\"${b * .3}\"/>`).join(\"\") + \"<\/g>\"; }\n  if (mark === \"fish\"){ const b = w * .2; s += `<g fill=\"var(--ink)\" opacity=\".85\"><ellipse cx=\"${mx - b * .2}\" cy=\"${my}\" rx=\"${b}\" ry=\"${b * .55}\"/><path d=\"M${mx + b * .6} ${my} L${mx + b * 1.3} ${my - b * .55} L${mx + b * 1.3} ${my + b * .55} Z\"/><\/g>` +\n    `<circle cx=\"${mx - b * .7}\" cy=\"${my - b * .1}\" r=\"${Math.max(1.2, b * .12)}\" fill=\"var(--pane)\"/>`; }\n  return s;\n}\n// 细胞核和它的小门。o：门打开的程度 0~1；inside：门里有没有书\nfunction nucDoor(cx, cy, r, o, seed, inside){\n  const dw = r * .7, hx = cx - dw / 2, top = cy - r * .18, bot = cy + r * .56, cls = r > 60 ? \"k\" : \"k1\";\n  let s = `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${r}\" fill=\"var(--sky)\" opacity=\".85\"/>` + P(Sk.ellipse(cx, cy, r, r, seed), cls);\n  const arch = `M${hx} ${bot} L${hx} ${top} A${dw / 2} ${dw / 2} 0 0 1 ${hx + dw} ${top} L${hx + dw} ${bot} Z`;\n  s += `<path d=\"${arch}\" fill=\"var(--ink)\" opacity=\".16\"/>` + P(arch, cls);\n  if (inside && o > .05) s += `<circle cx=\"${cx}\" cy=\"${bot - r * .22}\" r=\"${r * .3}\" fill=\"var(--accent)\" opacity=\"${(.25 * o).toFixed(2)}\"/>` + bookShut(cx - r * .02, bot - r * .24, r * .22, seed + 9, \"none\");\n  const w = dw * Math.cos(o * Math.PI * .92);\n  const panel = `M${hx} ${bot} L${hx} ${top} Q${hx + w / 2} ${top - dw * .62} ${hx + w} ${top} L${hx + w} ${bot} Z`;\n  s += `<path d=\"${panel}\" fill=\"var(--paper)\"/>` + P(panel, o < .999 ? cls : \"k1\");\n  if (o < .999) s += `<circle cx=\"${(hx + w * .8).toFixed(1)}\" cy=\"${(cy + r * .2).toFixed(1)}\" r=\"${Math.max(3, r * .055).toFixed(1)}\" fill=\"var(--ink)\"/>`;\n  return s;\n}\n// 打开的书：两页，一行行只有 A T C G；frac 是读到全书的哪里（决定两边书页的厚薄）\nfunction openBook(o){\n  const { cx, top, pw, ph } = o, b = top + ph;\n  let s = \"\";\n  const tl = 3 + 14 * o.frac, tr = 3 + 14 * (1 - o.frac);\n  s += `<path d=\"M${cx} ${b + 5} L${cx - pw} ${b - 1} L${cx - pw} ${b - 1 + tl} L${cx} ${b + 5 + tl} Z\" fill=\"var(--paper)\"/>` +\n       `<path d=\"M${cx} ${b + 5} L${cx + pw} ${b - 1} L${cx + pw} ${b - 1 + tr} L${cx} ${b + 5 + tr} Z\" fill=\"var(--paper)\"/>` +\n       P(Sk.line(cx - pw, b - 1 + tl, cx, b + 5 + tl, 501, .4) + Sk.line(cx - pw, b - 1, cx - pw, b - 1 + tl, 502, .2) +\n         Sk.line(cx, b + 5 + tr, cx + pw, b - 1 + tr, 503, .4) + Sk.line(cx + pw, b - 1, cx + pw, b - 1 + tr, 504, .2), \"k1\");\n  for (const side of [-1, 1]){\n    const ox = cx + side * pw;\n    const pg = `M${cx} ${top + 6} Q${(cx + ox) / 2} ${top - 8} ${ox} ${top} L${ox} ${b - 1} Q${(cx + ox) / 2} ${b - 9} ${cx} ${b + 5} Z`;\n    s += `<path d=\"${pg}\" fill=\"var(--pane)\"/><path d=\"${pg}\" fill=\"var(--paper)\" opacity=\".55\"/>` +\n      P(Sk.curve([[cx, top + 6], [(cx + ox) / 2, top - 4], [ox, top]], 510 + side, .4) + Sk.line(ox, top, ox, b - 1, 512 + side, .4) + Sk.curve([[ox, b - 1], [(cx + ox) / 2, b - 5], [cx, b + 5]], 514 + side, .4), \"k\");\n  }\n  s += P(Sk.line(cx, top + 6, cx, b + 5, 520, .3), \"k1\");\n  const rows = o.rows, cols = o.cols, dy = (ph - 64) / (rows - 1);\n  for (const side of [-1, 1]){\n    const x0 = side < 0 ? cx - pw + 26 : cx + 26, dx = (pw - 52) / (cols - 1);\n    for (let r = 0; r < rows; r++){\n      const y = top + 40 + r * dy;\n      const str = lettersOf(o.seed * 31 + (side > 0 ? 977 : 0) + r * 7, cols);\n      if (side < 0 && r === 0 && o.readN != null){\n        const n = Math.min(cols, o.readN);\n        if (n < cols) s += `<circle cx=\"${(x0 + n * dx).toFixed(1)}\" cy=\"${y - 7}\" r=\"14\" fill=\"var(--accent)\" opacity=\".22\"/>`;\n        if (n > 0) s += `<text class=\"let hi\" x=\"${xsOf(x0, dx, n)}\" y=\"${y}\" text-anchor=\"middle\">${str.slice(0, n)}<\/text>` + P(Sk.line(x0 - 8, y + 8, x0 + (n - 1) * dx + 8, y + 8, 530, .3), \"ka\");\n        if (n < cols) s += `<text class=\"let\" x=\"${xsOf(x0 + n * dx, dx, cols - n)}\" y=\"${y}\" text-anchor=\"middle\">${str.slice(n)}<\/text>`;\n        continue;\n      }\n      s += `<text class=\"let\" x=\"${xsOf(x0, dx, cols)}\" y=\"${y}\" text-anchor=\"middle\">${str}<\/text>`;\n    }\n  }\n  // 正在翻的一页\n  if (o.flip != null && o.flip > .02 && o.flip < .98){\n    const ox = cx + pw * Math.cos(o.flip * Math.PI);\n    const pg = `M${cx} ${top + 6} Q${(cx + ox) / 2} ${top - 18} ${ox.toFixed(1)} ${top - 4} L${ox.toFixed(1)} ${b - 5} Q${(cx + ox) / 2} ${b - 15} ${cx} ${b + 5} Z`;\n    s += `<path d=\"${pg}\" fill=\"var(--pane)\"/><path d=\"${pg}\" fill=\"var(--paper)\" opacity=\".8\"/>` + P(pg, \"k1\");\n  }\n  return s;\n}\n// 几种细胞。book：细胞核里画不画那本小书；q：画问号（还没揭晓）\nfunction nucMark(x, y, r, book, q, seed){\n  if (book) return bookShut(x, y, r * .75, seed, \"none\");\n  if (q) return `<text x=\"${x}\" y=\"${y + r * .38}\" text-anchor=\"middle\" style=\"font-size:${(r * 1.15).toFixed(1)}px;font-family:var(--f-serif);font-weight:700;fill:var(--muted)\">?<\/text>`;\n  return \"\";\n}\nfunction neuron(cx, cy, sc, t, o, book, q){\n  let s = `<g transform=\"translate(${cx} ${cy}) scale(${sc})\" opacity=\"${o.toFixed(2)}\">`;\n  const den = [[[-30, -20], [-70, -55], [-95, -60]], [[-70, -55], [-80, -90]], [[-8, -36], [-14, -80], [-34, -110]], [[-14, -80], [12, -108]], [[-36, 10], [-88, 20], [-112, 4]], [[-88, 20], [-104, 50]], [[24, -28], [56, -70], [60, -104]]];\n  const ax = [[30, 22], [70, 60], [110, 96], [150, 130]], axd = Sk.curve(ax, 41, .6);\n  // 粗轴突：先画一条粗墨线，再在上面画一条细一点的绿线，两边的墨边就严丝合缝\n  s += P(axd, \"k\", 'stroke-width=\"10\"') + P(axd, \"k\", 'stroke-width=\"6.5\" stroke=\"var(--sage)\"');\n  for (const [i, d] of den.entries()) s += P(Sk.curve(d, 60 + i, .5), \"k\", 'stroke-width=\"2.2\"');\n  for (const a of [[-30, 26], [0, 30], [26, 22]]) s += P(Sk.line(150, 130, 150 + a[0], 130 + a[1], 70 + a[0]), \"k1\");\n  s += F(Sk.blob(0, 0, 44, 40, 33), \"sage\", .85) + P(Sk.blob(0, 0, 44, 40, 33), \"k\");\n  s += `<circle cx=\"0\" cy=\"0\" r=\"17\" fill=\"var(--sky)\"/>` + P(Sk.ellipse(0, 0, 17, 17, 35), \"k1\") + nucMark(0, 0, 17, book, q, 36);\n  if (t != null){ const u = (t % 1.6) / 1.6, i = Math.min(2, Math.floor(u * 3)), f = u * 3 - i, p = [lerp(ax[i][0], ax[i + 1][0], f), lerp(ax[i][1], ax[i + 1][1], f)];\n    s += `<circle cx=\"${p[0].toFixed(1)}\" cy=\"${p[1].toFixed(1)}\" r=\"7\" fill=\"var(--ink)\" opacity=\".75\"/>`; }\n  return s + \"<\/g>\";\n}\nfunction muscle(cx, cy, sc, t, o, book, q){\n  const c = t == null ? 0 : (1 - Math.cos(t * 3.2)) / 2;\n  const L = 150 * (1 - .14 * c), H = 46 * (1 + .22 * c);\n  let s = `<g transform=\"translate(${cx} ${cy}) scale(${sc})\" opacity=\"${o.toFixed(2)}\">`;\n  const d = `M${-L} 0 Q${-L * .45} ${-H * 1.25} 0 ${-H} Q${L * .45} ${-H * 1.25} ${L} 0 Q${L * .45} ${H * 1.25} 0 ${H} Q${-L * .45} ${H * 1.25} ${-L} 0 Z`;\n  s += F(d, \"sage\", .85);\n  for (let x = -L + 22; x < L - 18; x += 16){ const hh = H * Math.sqrt(Math.max(0, 1 - (x / L) * (x / L))) * .9; if (Math.abs(x) < 26) continue; s += P(Sk.line(x, -hh, x, hh, 80 + Math.round(x), .3), \"k1\", 'opacity=\".45\"'); }\n  s += P(d, \"k\");\n  s += `<ellipse cx=\"0\" cy=\"0\" rx=\"22\" ry=\"16\" fill=\"var(--sky)\"/>` + P(Sk.ellipse(0, 0, 22, 16, 85), \"k1\") + nucMark(0, 0, 16, book, q, 86);\n  return s + \"<\/g>\";\n}\nconst SKIN_AROUND = [[0, -64], [56, -32], [56, 32], [0, 64], [-56, 32], [-56, -32]];\nfunction skin(cx, cy, sc, o, book){\n  let s = `<g transform=\"translate(${cx} ${cy}) scale(${sc})\" opacity=\"${o.toFixed(2)}\">`;\n  for (const [i, [x, y]] of [[0, 0], ...SKIN_AROUND].entries()){\n    s += F(Sk.blob(x, y, 33, 31, 90 + i), \"sage\", .8) + P(Sk.blob(x, y, 33, 31, 90 + i), \"k1\");\n    s += `<circle cx=\"${x}\" cy=\"${y}\" r=\"11\" fill=\"var(--sky)\"/>` + P(Sk.ellipse(x, y, 11, 11, 100 + i), \"k1\");\n    if (book) s += bookShut(x, y, 8, 110 + i, \"none\");\n  }\n  return s + \"<\/g>\";\n}\n// 红细胞：中间的凹陷只画一圈细线，不画实心的圆（实心圆像细胞核）。empty：已经看过，写上「空」\nfunction redCell(cx, cy, r, seed, empty){\n  return `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${r}\" fill=\"var(--apricot)\" opacity=\".95\"/>` + P(Sk.ellipse(cx, cy, r, r, seed)) +\n    P(Sk.curve([[cx - r * .5, cy - r * .12], [cx - r * .1, cy - r * .42], [cx + r * .42, cy - r * .2]], seed + 1, .4) + Sk.curve([[cx + r * .5, cy + r * .12], [cx + r * .1, cy + r * .42], [cx - r * .42, cy + r * .2]], seed + 2, .4), \"k1\", 'opacity=\".55\"') +\n    (empty ? T(cx, cy + 9, \"空\", \"t\", 'text-anchor=\"middle\"') : \"\");\n}\n// 嘴里（口腔内壁）的细胞：扁扁的、像一片片鳞\nfunction cheekCell(x, y, rx, ry, seed, nr){\n  return F(Sk.blob(x, y, rx, ry, seed), \"sage\", .78) + P(Sk.blob(x, y, rx, ry, seed), \"k1\") +\n    (nr ? `<circle cx=\"${x + rx * .1}\" cy=\"${y}\" r=\"${nr}\" fill=\"var(--sky)\"/>` + P(Sk.ellipse(x + rx * .1, y, nr, nr, seed + 1), \"k1\") : \"\");\n}\n// 小图标：星卡和清单上用\nfunction cellIcon(k, x, y, s, book){\n  let o = `<g transform=\"translate(${x} ${y}) scale(${s})\">`;\n  if (k === \"rbc\") o += redCell(0, 0, 22, 140);\n  else if (k === \"wbc\") o += F(Sk.blob(0, 0, 24, 22, 141), \"sage\", .85) + P(Sk.blob(0, 0, 24, 22, 141), \"k1\") + `<circle r=\"11\" fill=\"var(--sky)\"/>`;\n  else if (k === \"nerve\") o += P(Sk.curve([[0, 0], [18, 16], [30, 26]], 142, .3), \"k1\") + P(Sk.curve([[0, 0], [-22, -16]], 143, .3) + Sk.curve([[0, 0], [8, -24]], 144, .3) + Sk.curve([[0, 0], [-24, 10]], 145, .3), \"k1\") + F(Sk.blob(0, 0, 15, 14, 146), \"sage\", .9) + P(Sk.blob(0, 0, 15, 14, 146), \"k1\") + `<circle r=\"8\" fill=\"var(--sky)\"/>`;\n  else if (k === \"muscle\") o += F(\"M-30 0 Q-14 -18 0 -14 Q14 -18 30 0 Q14 18 0 14 Q-14 18 -30 0Z\", \"sage\", .9) + P(\"M-30 0 Q-14 -18 0 -14 Q14 -18 30 0 Q14 18 0 14 Q-14 18 -30 0Z\", \"k1\") + `<ellipse rx=\"9\" ry=\"6\" fill=\"var(--sky)\"/>`;\n  else if (k === \"mouth\") o += cheekCell(0, 0, 26, 18, 147, 7);\n  else o += F(Sk.blob(0, 0, 22, 20, 148), \"sage\", .9) + P(Sk.blob(0, 0, 22, 20, 148), \"k1\") + `<circle r=\"9\" fill=\"var(--sky)\"/>`;\n  if (book && k !== \"rbc\") o += bookShut(0, 0, 8, 150, \"none\");\n  return o + \"<\/g>\";\n}\nconst memoStore = {};\nfunction memo(name, key, fn){ const m = memoStore[name]; if (m && m.k === key) return m.v; const v = fn(); memoStore[name] = { k: key, v }; return v; }\n\n/* ============ 6. 第 1 站：打开小房间 ============ */\nconst C1 = { cx: 285, cy: 296, rx: 232, ry: 200, nr: 112, dest: [640, 312], w0: 24, w1: 108 };\nC1.b0 = [C1.cx, C1.cy + C1.nr * .56 - C1.nr * .24];\nconst D0 = Math.hypot(C1.dest[0] - C1.b0[0], C1.dest[1] - C1.b0[1]);\nconst pullProg = () => clamp(1 - Math.hypot(C1.dest[0] - S.bx, C1.dest[1] - S.by) / D0);\nfunction static1(){\n  return F(Sk.blob(C1.cx, C1.cy, C1.rx, C1.ry, 3), \"sage\", .6) + P(Sk.blob(C1.cx, C1.cy, C1.rx, C1.ry, 3), \"k1\") +\n    T(118, 214, \"细胞\", \"tm\") + T(C1.cx, 168, \"细胞核\", \"tm\", 'text-anchor=\"middle\"');\n}\nfunction knob1(){ const dw = C1.nr * .7, hx = C1.cx - dw / 2, w = dw * Math.cos(S.dp * Math.PI * .92); return [hx + w * .8, C1.cy + C1.nr * .2]; }\nfunction draw1(){\n  if (S.mode === \"read\" || S.mode === \"readdone\") return drawRead();\n  let s = \"\";\n  s += nucDoor(C1.cx, C1.cy, C1.nr, S.dp, 7, !S.placed && S.mode !== \"pull\" || S.mode === \"door\");\n  if (S.mode === \"pull\" || S.placed){\n    const g = S.placed ? 1 : pullProg();\n    if (!S.placed){\n      s += `<rect x=\"${C1.dest[0] - C1.w1 / 2 - 8}\" y=\"${C1.dest[1] - C1.w1 * .67 - 8}\" width=\"${C1.w1 + 16}\" height=\"${C1.w1 * 1.34 + 16}\" rx=\"10\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.6\" stroke-dasharray=\"6 7\"/>`;\n      s += P(Sk.curve([[440, 250], [500, 226], [556, 240]], 15, .4) + Sk.line(556, 240, 542, 230, 16) + Sk.line(556, 240, 542, 250, 17), \"kf\");\n    }\n    const w = lerp(C1.w0, C1.w1, smooth(g));\n    if (!S.placed) s += `<circle cx=\"${S.bx}\" cy=\"${S.by}\" r=\"${w * .9 + 12}\" fill=\"var(--accent)\" opacity=\".15\"/>`;\n    s += bookShut(S.bx, S.by, w, 200, \"dna\");\n  }\n  if (S.mode === \"door\"){ const [kx, ky] = knob1(); s += `<circle class=\"pulse\" cx=\"${kx.toFixed(1)}\" cy=\"${ky}\" r=\"17\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"3\"/>`; }\n  return s;\n}\n// 第 1 站的「哇」：念完要几辈子\nconst RB = { cx: 400, top: 46, pw: 300, ph: 330, rows: 8, cols: 11 };\nconst LIFE = { x0: 120, x1: 660, y: 520 };\nconst yrX = y => LIFE.x0 + (LIFE.x1 - LIFE.x0) * clamp(y / MODEL.readYears, 0, 1.05);\nfunction grandpa(x, y){   // 一个拄拐杖的老人（一辈子到头）\n  return `<circle cx=\"${x}\" cy=\"${y - 30}\" r=\"7\" fill=\"var(--pane)\"/>` + P(Sk.ellipse(x, y - 30, 7, 7, 640 + Math.round(x)), \"k1\") +\n    P(`M${x} ${y - 23} Q${x + 3} ${y - 12} ${x + 1} ${y - 4} M${x + 1} ${y - 4} L${x - 5} ${y + 8} M${x + 1} ${y - 4} L${x + 6} ${y + 8} M${x + 1} ${y - 17} L${x + 10} ${y - 10} M${x + 11} ${y - 12} L${x + 13} ${y + 8}`, \"k1\");\n}\nfunction lifePanel(years, done){\n  let s = T(LIFE.x0, LIFE.y - 44, \"念的时间\", \"tm\");\n  const n = Math.ceil(MODEL.lives);\n  for (let i = 0; i < n; i++){\n    const a = i * MODEL.lifeYears, full = (i + 1) * MODEL.lifeYears <= MODEL.readYears, b = full ? (i + 1) * MODEL.lifeYears : MODEL.readYears;\n    const xa = yrX(a) + 3, xb = yrX(b) - 3, reached = years >= b - 1e-9;\n    s += `<rect x=\"${xa.toFixed(1)}\" y=\"${LIFE.y - 15}\" width=\"${(xb - xa).toFixed(1)}\" height=\"30\" rx=\"15\" fill=\"var(--sage)\" opacity=\".7\"/>` + P(box(xa, LIFE.y - 15, xb - xa, 30, 650 + i, .4), full ? \"k1\" : \"kf\");\n    if (full && reached) s += grandpa(xb - 14, LIFE.y - 26);\n    if (reached || done) s += T(((xa + xb) / 2).toFixed(1), LIFE.y + 48, full ? \"一辈子\" : \"半辈子\", \"tm\", 'text-anchor=\"middle\"');\n  }\n  const xe = yrX(years);\n  if (years > 0) s += `<rect x=\"${LIFE.x0}\" y=\"${LIFE.y - 6}\" width=\"${Math.max(0, xe - LIFE.x0).toFixed(1)}\" height=\"12\" rx=\"6\" fill=\"var(--accent)\" opacity=\".9\"/>`;\n  s += `<circle cx=\"${xe.toFixed(1)}\" cy=\"${LIFE.y}\" r=\"10\" fill=\"var(--accent)\"/>` + P(Sk.ellipse(xe, LIFE.y, 10, 10, 630), \"k1\");\n  if (done) s += T(LIFE.x1, LIFE.y - 40, `约 ${YEARS} 年`, \"lab acc bold\", 'text-anchor=\"middle\"');\n  return s;\n}\nfunction lettersRead(){ return S.ft > 0 ? MODEL.slowLetters * Math.pow(MODEL.lettersPerCell / MODEL.slowLetters, S.fp) : Math.floor(S.read + 1e-6); }\nfunction drawRead(){\n  const L = lettersRead(), done = S.mode === \"readdone\";\n  let s = openBook({ ...RB, seed: S.ft > 0 ? 3 + Math.floor(S.flip) : 3, frac: L / MODEL.lettersPerCell, readN: S.ft > 0 ? null : Math.floor(S.read + 1e-6),\n    flip: S.ft > 0 && S.fp < 1 && !reduced ? S.flip % 1 : null });\n  if (S.ft > 0 || done) s += lifePanel(done ? MODEL.readYears : L / MODEL.readPerSec / MODEL.secPerYear, done);\n  return s;\n}\nfunction readout1(){\n  if (S.mode === \"door\") readout(`小门 打开 <b>${Math.round(S.dp * 100)}%<\/b>`);\n  else if (S.mode === \"pull\") readout(`拿出说明书 <b>${Math.round(pullProg() * 100)}%<\/b>`);\n  else if (S.mode === \"read\" || S.mode === \"readdone\"){\n    const L = lettersRead();\n    readout(S.mode === \"readdone\" ? `约 <b>${TOTAL_TXT}个<\/b>字母 · 念 <b>约 ${YEARS} 年<\/b>` : `念了 <b>${fmtBig(L)}个<\/b>字母 · 用了 ${fmtDur(L / MODEL.readPerSec)}`);\n    Host.state({ station: 1, letters_read: Math.round(L) });\n    return;\n  }\n  Host.state({ station: 1, door: +S.dp.toFixed(3) });\n}\nfunction enter1(){\n  S.station = 1; S.mode = \"intro\"; head(1, \"打开小房间\"); hint(\"\"); readout(\"\"); gStatic.innerHTML = static1(); render();\n  say(\"舰长，小狗生下来总是小狗，从来不会是小猫。\");\n  next(\"为什么呢？\", () => {\n    say(\"是谁「告诉」它长成小狗的？答案藏在细胞核这个小房间里。\");\n    next(\"去打开它\", act1);\n  });\n}\nfunction act1(){\n  S.mode = \"door\"; hint(\"拉住小门的把手，往左拉开\");\n  say(\"细胞核上有一扇小门。拉住闪光的把手，往左拉。\");\n  actions([]); render(); readout1(); svg.focus({ preventScroll: true });\n}\nfunction done d = r; enter1(); }, \"ghost\");\n}\n\n/* ============ 11. 画面和输入 ============ */\n// 窄屏（手机）时，操作区小的那几步把 viewBox 缩到操作区，相当于放大\nconst VB = { full: \"0 0 800 600\", door: \"40 84 490 424\", read: \"70 22 660 578\" };\nfunction fitView(){\n  const n = narrow();\n  let v = VB.full;\n  if (S.station === 5) v = n ? ENDL.narrow.vb : ENDL.wide.vb;\n  else if (n && S.station === 1 && (S.mode === \"intro\" || S.mode === \"door\")) v = VB.door;\n  else if (n && S.station === 1 && (S.mode === \"read\" || S.mode === \"readdone\")) v = VB.read;\n  if (svg.getAttribute(\"viewBox\") !== v) svg.setAttribute(\"viewBox\", v);\n}\nnarrowMQ.addEventListener && narrowMQ.addEventListener(\"change\", () => { for (const k in memoStore) delete memoStore[k]; render(); });\nconst DRAG = new Set([\"door\", \"pull\", \"dial\"]);\nconst layerCache = [\"\", \"\", \"\"];\nfunction render(){\n  fitView();\n  svg.style.touchAction = DRAG.has(S.mode) ? \"none\" : \"pan-y\";\n  const L = S.station === 1 ? [draw1(), \"\", \"\"] : S.station === 2 ? draw2() : S.station === 3 ? draw3() : S.station === 4 ? draw4() : drawEnd();\n  // 只重画变了的那一层（第 2、3 站拖动和动画时，书和清单不用每帧重建）\n  for (let i = 0; i < 3; i++) if (layerCache[i] !== L[i]){ layerCache[i] = L[i]; LAYERS[i].innerHTML = L[i]; }\n}\nfunction toSvg(e){\n  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;\n  return pt.matrixTransform(svg.getScreenCTM().inverse());\n}\nfunction dialFromPoint(q){\n  let d = Math.atan2(q.y - D2.y, q.x - D2.x) * 180 / Math.PI; if (d < 0) d += 360;\n  if (d < 90) return 2; if (d < D2.a0 && d >= 90) return 0;\n  return clamp((d - D2.a0) / D2.step, 0, 2);\n}\nlet drag = null;\nsvg.addEventListener(\"pointerdown\", e => {\n  const q = toSvg(e), hr = hitR(); S.kbd = false;\n  if (S.mode === \"door\"){\n    const [kx, ky] = knob1(), dw = C1.nr * .7;\n    if (Math.hypot(q.x - kx, q.y - ky) < Math.max(60, hr) || (Math.abs(q.x - C1.cx) < dw && Math.abs(q.y - C1.cy) < C1.nr * .7)) drag = { kind: \"door\", x0: q.x, t0: S.dt };\n  } else if (S.mode === \"pull\" && !S.snap){\n    const w = lerp(C1.w0, C1.w1, smooth(pullProg()));\n    if (Math.hypot(q.x - S.bx, q.y - S.by) < Math.max(52, w, hr)) drag = { kind: \"book\", ox: q.x - S.bx, oy: q.y - S.by };\n  } else if (S.mode === \"dial\"){\n    if (Math.hypot(q.x - D2.x, q.y - D2.y) < D2.r + Math.max(60, hr)){ drag = { kind: \"dial\" }; S.dragDial = true; S.vt = dialFromPoint(q); }\n  } else if (S.mode === \"find\"){\n    let best = null, bd = 1e9;\n    for (const t of targets3()){ const d = Math.hypot(q.x - t.x, q.y - t.y) - Math.max(t.r, hr); if (d < bd){ bd = d; best = t; } }\n    if (best && bd < 0) best.go();\n  }\n  if (drag){ svg.setPointerCapture(e.pointerId); e.preventDefault(); }\n});\nsvg.addEventListener(\"pointermove\", e => {\n  if (!drag) return;\n  const q = toSvg(e);\n  if (drag.kind === \"door\") S.dt = clamp(drag.t0 + (drag.x0 - q.x) / 140);\n  else if (drag.kind === \"book\"){ S.bx = clamp(q.x - drag.ox, 20, 780); S.by = clamp(q.y - drag.oy, 20, 580); render(); readout1(); }\n  else if (drag.kind === \"dial\") S.vt = dialFromPoint(q);\n});\nfor (const e2 of [\"pointerup\", \"pointercancel\"]) svg.addEventListener(e2, () => {\n  if (drag && drag.kind === \"book\" && pullProg() > .72) S.snap = true;\n  if (drag && drag.kind === \"dial\"){ S.vt = Math.round(S.vt); S.dragDial = false; render(); }\n  drag = null;\n});\nsvg.addEventListener(\"keydown\", e => {\n  const k = e.key, go = /Arrow|Enter| /.test(k);\n  if (!go) return;\n  if (S.mode === \"door\"){ e.preventDefault(); S.dt = clamp(S.dt + .08); }\n  else if (S.mode === \"pull\" && !S.snap){ e.preventDefault(); const dx = C1.dest[0] - S.bx, dy = C1.dest[1] - S.by, L = Math.hypot(dx, dy) || 1; const st = Math.min(L, 45);\n    S.bx += dx / L * st; S.by += dy / L * st; if (pullProg() > .72) S.snap = true; render(); readout1(); }\n  else if (S.mode === \"read\"){ e.preventDefault(); stepRead(); }\n  else if (S.mode === \"dial\"){ e.preventDefault(); const r = Math.round(S.vt); S.vt = clamp(r + (k === \"ArrowLeft\" || k === \"ArrowDown\" ? -1 : 1), 0, 2); }\n  else if (S.mode === \"find\"){ e.preventDefault(); if (!S.kbd){ S.kbd = true; S.kf = kfAuto(); if (k !== \"Enter\" && k !== \" \"){ render(); return; } } const n = targets3().length;\n    if (k === \"ArrowRight\" || k === \"ArrowDown\") S.kf = (S.kf + 1) % n; else if (k === \"ArrowLeft\" || k === \"ArrowUp\") S.kf = (S.kf - 1 + n) % n;\n    else { const t = targets3()[S.kf % n]; t.go(); S.kf = kfAuto(); }\n    render(); }\n  else if (S.mode === \"heal\"){ e.preventDefault(); S.ht = clamp(S.ht + .03); }\n});\n\nlet last = performance.now();\n// 进度到 98.5% 就算完成，并把读数对齐到真相表的终值\nconst fin = (tk, pk) => { if (S[tk] >= .985 && S[pk] > .975){ S[tk] = S[pk] = 1; S.hold = false; return true; } return false; };\nfunction tick(now){\n  const dt = Math.min(.05, (now - last) / 1000); last = now; S.time += dt;\n  const k = reduced ? 1 : 1 - Math.exp(-dt / .12);\n  const ease = (a, b) => Math.abs(b - a) < 1e-3 ? b : a + (b - a) * k;\n  let dirty = false;\n  if (S.station === 1){\n    if (S.mode === \"door\"){\n      if (Math.abs(S.dt - S.dp) > 1e-4){ S.dp = ease(S.dp, S.dt); dirty = true; readout1(); }\n      if (fin(\"dt\", \"dp\")){ doneDoor(); dirty = false; }\n    } else if (S.mode === \"pull\" && S.snap){\n      S.bx = ease(S.bx, C1.dest[0]); S.by = ease(S.by, C1.dest[1]); dirty = true; readout1();\n      if (Math.hypot(S.bx - C1.dest[0], S.by - C1.dest[1]) < .8){ S.bx = C1.dest[0]; S.by = C1.dest[1]; S.snap = false; donePull(); dirty = false; }\n    } else if (S.mode === \"read\"){\n      if (S.hold){\n        if (S.ft === 0){ S.read = Math.min(MODEL.slowLetters, S.read + dt * MODEL.readPerSec); if (S.read >= MODEL.slowLetters) goFast(); }\n        else { S.ft = clamp(S.ft + dt * .17); S.flip += dt * (1.2 + 5 * S.fp); }\n        dirty = true;\n      }\n      if (Math.abs(S.ft - S.fp) > 1e-4){ S.fp = ease(S.fp, S.ft); dirty = true; }\n      if (dirty) readout1();\n      if (S.ft > 0 && fin(\"ft\", \"fp\")){ doneRead(); dirty = false; }\n    }\n  } else if (S.station === 2 && S.mode === \"dial\"){\n    if (Math.abs(S.vt - S.vp) > 1e-4){ S.vp = ease(S.vp, S.vt); dirty = true; readout2(); }\n    const r = Math.round(S.vp); if (Math.abs(S.vp - r) < .1 && !S.dragDial) visit2(ORDER[r]);\n    if (!reduced) dirty = true;   // 细胞在动（传信号、收紧）；书和拨盘那两层没变就不重建\n  } else if (S.station === 3){\n    for (const key of Object.keys(S.openT)){ const o = S.open[key] || 0; if (Math.abs(S.openT[key] - o) > 1e-3){ S.open[key] = reduced ? 1 : Math.min(1, o + dt * 1.6); dirty = true; } }\n  } else if (S.station === 4){\n    if (S.mode === \"heal\"){\n      if (S.hold) S.ht = clamp(S.ht + dt * .12);\n      if (Math.abs(S.ht - S.hp) > 1e-4){ S.hp = ease(S.hp, S.ht); dirty = true; readout4(); }\n      if (fin(\"ht\", \"hp\")){ done4(); dirty = false; }\n    }\n    if (S.passing){ S.pass = reduced ? 1 : S.pass + dt / 1.4; dirty = true; if (S.pass >= 1){ S.pass = 1; afterPass(); dirty = false; } }\n  }\n  if (dirty) render();\n  requestAnimationFrame(tick);\n}\nresetState();\nenter1();\nHost.ready();\nrequestAnimationFrame(tick);\n<\/script>\n<\/body>\n<\/html>\n", "id": "act.simulation.dna-book-01", "kind": "simulation", "title": "翻开细胞里的说明书"}, {"body": {"steps": [{"text": "舰长，为什么小狗生下来的总是小狗，不会是小猫？先想一想。", "type": "text"}, {"text": "上一颗星说过，细胞核是细胞这个小房间里的小房间，里面放着一份说明书。它叫 DNA。", "type": "text"}, {"text": "DNA 像一本用 A、T、C、G 四种字母写成的说明书，记着身体怎么长、长成什么样。", "type": "text"}, {"caption": "小狗的说明书写着怎么长成小狗。", "figure": {"src": "content/assets/biology.genetics.dna-intro/dna-book.svg", "type": "svg"}, "type": "figure"}, {"text": "身体里绝大多数细胞，带的都是同一套说明书。", "type": "text"}, {"text": "神经细胞和肌肉细胞本领不同，是因为它们读的是同一本书的不同几页。", "type": "text"}, {"caption": "两本书是同一套，翻开的页不同，细胞的本领就不同。", "figure": {"src": "content/assets/biology.genetics.dna-intro/dna-pages.svg", "type": "svg"}, "type": "figure"}, {"item": {"answer": {"choices": [{"feedback": "看起来确实像各有一本书，其实它们带的是同一套，只是读的几页不同。", "id": "b", "misconception": "different-books", "text": "它们的说明书本来就不同"}, {"feedback": "看起来确实像书有厚薄，其实绝大多数细胞带的是同一套，只是用的页不同。", "id": "c", "misconception": "different-books", "text": "它们带的说明书页数不一样多"}, {"correct": true, "id": "a", "text": "它们读的是同一本书的不同几页"}], "type": "choice"}, "hints": ["想一想，刚才说的“同一套”是什么意思。", "本领不同，不一定是书不同，也可能是翻开的地方不同。"], "id": "c1", "stem": "神经细胞和肌肉细胞带着同一套说明书，为什么本领不一样？"}, "type": "check"}, {"text": "DNA 不是只在血液里。皮肤细胞、口腔里的细胞和肌肉细胞里，也都有 DNA。", "type": "text"}, {"item": {"answer": {"choices": [{"correct": true, "id": "a", "text": "不是，皮肤、口腔和肌肉细胞里也有"}, {"feedback": "很多人都这么想，其实血液只是身体的一部分，皮肤、口腔和肌肉细胞里也有 DNA。", "id": "b", "misconception": "blood-only", "text": "是，只在血液里"}, {"feedback": "看起来确实像血液最特别，其实别的许多细胞也有细胞核，也带着说明书。", "id": "c", "misconception": "blood-only", "text": "是，别的细胞都没有说明书"}], "type": "choice"}, "hints": ["血液只是身体的一部分，身体还有皮肤、口腔和肌肉。", "想想上一颗星：皮肤、肌肉里的细胞，一般都有细胞核吗？"], "id": "c2", "stem": "舰长，DNA 只在血液里吗？"}, "type": "check"}, {"text": "人的红细胞快长好的时候，会把细胞核连同说明书一起推出去，腾出地方多装氧气。它当初也是照着同一本说明书长出来的。", "type": "text"}, {"caption": "成熟红细胞没有细胞核，但年轻时也曾带着同一套说明书。", "figure": {"src": "content/assets/biology.genetics.dna-intro/red-cell.svg", "type": "svg"}, "type": "figure"}, {"text": "说明书不是放着不动的。你每天长个子、摔破的伤口长好，细胞都在照着它做。", "type": "text"}, {"item": {"answer": {"choices": [{"feedback": "这个想法有道理，因为说明书会传给孩子；但长个子、修补伤口时也要用它。", "id": "b", "misconception": "only-for-babies", "text": "只在生小宝宝时用"}, {"correct": true, "id": "a", "text": "长个子、修补伤口时都会用"}, {"feedback": "说明书确实会传给孩子，但它在自己身体里也有工作，比如帮助身体长大和修补。", "id": "c", "misconception": "only-for-babies", "text": "只有传给孩子时才用"}], "type": "choice"}, "hints": ["想想伤口长好的时候，细胞有没有在工作。", "身体每天长个子、修补伤口，要不要照着说明书做？"], "id": "c3", "stem": "身体里的说明书，什么时候会用？"}, "type": "check"}, {"text": "说明书是爸爸妈妈传给孩子的，这叫遗传。小狗从狗爸爸狗妈妈那里拿到狗的说明书，所以长成小狗。", "type": "text"}, {"text": "一个带细胞核的人体细胞里，DNA 全部拉直大约有 2 米，比大人还高。", "type": "text"}, {"text": "这么长，怎么装进小小的细胞核？请舰长去下一颗星“染色体”找答案。", "type": "text"}], "style": "tutor"}, "duration_min": 5, "id": "act.explain.dna-intro-01", "kind": "explain", "title": "DNA：细胞里的说明书"}, {"body": {"items": [{"answer": {"tolerance": 0, "type": "number", "unit": "种", "value": 4}, "hints": ["DNA 用的字母种类很少，不用想成一整张英文字母表。", "回忆讲解里数的字母种类，只填一个数字。"], "id": "q1", "stem": "DNA 这本说明书是用几种字母写成的？"}, {"answer": {"choices": [{"feedback": "很多人都这么想；其实 DNA 不只在血液里，它一般放在细胞核里。", "id": "b", "misconception": "blood-only", "text": "只在血液里"}, {"correct": true, "id": "a", "text": "细胞核"}, {"feedback": "说明书像是可以拿来拿去，容易让人这样想；但 DNA 一般在细胞核里，不在细胞外面。", "id": "c", "text": "细胞外面"}], "type": "choice"}, "hints": ["想一想细胞里那个“小房间里的小房间”。", "放说明书的地方，名字里有一个“核”字。"], "id": "q2", "stem": "舰长，DNA 这本说明书一般放在细胞的哪里？"}, {"answer": {"choices": [{"feedback": "它们本领不同，看起来确实像用了不同的书；其实它们读的是同一套说明书的不同几页。", "id": "b", "misconception": "different-books", "text": "它们各自带着完全不同的说明书"}, {"feedback": "很多人都这么想；其实肌肉细胞也带说明书，绝大多数细胞带的是同一套。", "id": "c", "text": "只有神经细胞带说明书，肌肉细胞不带"}, {"correct": true, "id": "a", "text": "它们带着同一套说明书"}], "type": "choice"}, "hints": ["它们的本领不同，但本领不同不等于带着不同的书。", "想想它们会不会读同一本书的不同几页。"], "id": "q3", "stem": "神经细胞和肌肉细胞带的 DNA 说明书，有什么关系？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "不带，因为它没有细胞核"}, {"feedback": "很多人都这么想；但红细胞没有细胞核，也就没有带 DNA 这本说明书。", "id": "b", "misconception": "blood-only", "text": "带着，因为 DNA 只在血液里"}, {"feedback": "不同细胞有不同本领，容易让人这样想；但红细胞没有细胞核，也就没有带说明书。", "id": "c", "misconception": "different-books", "text": "带着，因为每种细胞都有不同的说明书"}], "type": "choice"}, "hints": ["先想想，DNA 这本说明书一般放在细胞的哪里。", "红细胞成熟后没有那个放说明书的小房间，再判断它带不带。"], "id": "q4", "stem": "人成熟的红细胞没有细胞核，它还带着 DNA 这本说明书吗？"}, {"answer": {"choices": [{"feedback": "说明书能传给孩子，容易让人这样想；其实身体长大、修补伤口时也在用它。", "id": "b", "misconception": "only-for-babies", "text": "不用，它只在生小宝宝时有用"}, {"feedback": "用完一本书就收起来的想法很熟悉；但这本说明书一直在用，修补伤口时也要用。", "id": "c", "text": "不用，说明书用完一次就不再用了"}, {"correct": true, "id": "a", "text": "要用，修补伤口也要照着它做"}], "type": "choice"}, "hints": ["想想这本书是不是只在生小宝宝时才打开。", "身体每天长大、修补伤口，也要知道该怎么做。"], "id": "q5", "stem": "伤口慢慢长好时，身体还要不要用 DNA 这本说明书？"}], "shuffle": true}, "duration_min": 5, "id": "act.quiz.dna-intro-01", "kind": "quiz", "title": "DNA 说明书大挑战"}], "dq": "为什么小狗生下来的总是小狗，不会是小猫？", "id": "biology.genetics.dna-intro", "misconceptions": {"blood-only": "DNA 只在血液里。", "different-books": "身体不同地方的细胞，带的是不同的说明书。", "only-for-babies": "说明书只在生小宝宝的时候才有用，平时用不上。"}, "title": "DNA：细胞里的说明书"}, {"activities": [{"age_band": "G3-4", "duration_min": 10, "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>把 2 米说明书收进细胞核<\/title>\n<style>\n:root{\n  --bg:#F5F4EE; --pane:#FBFAF6; --rule:#E0DCD0; --hover:#E7E4D9;\n  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;\n  --accent:#C2603F; --accent-soft:#F3E0D6;\n  --sage:#CCD6C0; --sage-bg:#DCE3D2; --sky:#CFDCE6; --apricot:#ECCDB6; --paper:#EFE4D6;\n  --dad:#4F7FA8; --mom:#C2603F; --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;\n  --f-serif:\"Noto Serif SC\",\"Source Han Serif SC\",\"Songti SC\",Georgia,serif;\n  --f-sans:\"Noto Sans SC\",\"PingFang SC\",\"Microsoft YaHei\",system-ui,sans-serif;\n  --f-mono:ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n  color-scheme:light;\n}\n@media (prefers-color-scheme:dark){:root{\n  --bg:#1E1E1E; --pane:#252525; --rule:#353535; --hover:#2E2E2E;\n  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;\n  --accent:#E0876A; --accent-soft:#3A2A24;\n  --sage:#3C4836; --sage-bg:#28301F; --sky:#2D3B47; --apricot:#5A4536; --paper:#33302A;\n  --dad:#7FA9CF; --mom:#E0876A; --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;\n  color-scheme:dark;\n}}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}\nbutton{font:inherit;color:inherit;cursor:pointer}\n.wrap{max-width:820px;margin:0 auto;padding:12px 14px 28px}\n.card{background:var(--pane);border:1px solid var(--rule);border-radius:18px;overflow:hidden}\n.card header,.card footer{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 16px}\n.card header{border-bottom:1px solid var(--rule)}\n.card footer{border-top:1px solid var(--rule);min-height:44px;align-items:center}\n.station{font-size:13px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}\nh1{font-family:var(--f-serif);font-size:20px;font-weight:600;color:var(--ink);margin:0;text-align:right}\n.hint{font-size:14px;color:var(--muted)}\n.readout{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px;text-align:right}\n.readout b{color:var(--accent);font-weight:600}\nsvg#stage{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}\nsvg#stage:focus{outline:none}\nsvg#stage:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}\n.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}\n.kf{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:3 6}\n.thread{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}\n.thread-thin{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round}\n.t{fill:var(--ink);font-family:var(--f-sans);font-size:15px}\n.tm{fill:var(--muted);font-family:var(--f-sans);font-size:13px}\n.num{fill:var(--ink);font-family:var(--f-mono);font-size:12px}\n.ttl{font-family:var(--f-serif);font-size:28px}\n.big{font-family:var(--f-serif);font-size:30px}\n.talk{display:flex;gap:10px;align-items:flex-start;margin:14px 2px 6px}\n.ava{flex:none;width:42px;height:42px}\n.bubble{background:var(--pane);border:1px solid var(--rule);border-radius:16px 16px 16px 4px;padding:10px 14px;color:var(--ink);min-height:44px;flex:1}\n.bubble.good{background:var(--good-soft);border-color:transparent}\n.bubble.bad{background:var(--bad-soft);border-color:transparent}\n.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin:10px 0 0}\n.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 18px;min-height:48px;font-size:17px;font-weight:600;touch-action:manipulation}\n.btn.hold{touch-action:none}\n.btn.ghost{background:var(--pane);color:var(--ink)}\n.btn.choice{background:var(--bg);color:var(--ink);font-weight:500;text-align:left;flex:1 1 220px}\n.btn.choice:hover{background:var(--hover)}\n.btn.hold{background:var(--accent);border-color:var(--accent);color:#fff}\n.btn.hold.on{filter:brightness(.9)}\n.btn:disabled{opacity:.4;cursor:default}\n.btn.small{min-height:40px;font-size:15px;padding:6px 14px;font-weight:500}\n.qbox{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}\n.qbox textarea{flex:1 1 260px;font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);min-height:64px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n@media (max-width:520px){ body{font-size:16px} h1{font-size:17px} .card header,.card footer{padding:8px 12px}\n  .t{font-size:26px} .tm{font-size:22px} .num{font-size:20px} .ttl{font-size:38px} .big{font-size:42px} }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\">第 1 站 · 共 4 站<\/span><h1 id=\"title\">绕线轴<\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 800 610\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <g id=\"static\"><\/g><g id=\"dyn\"><\/g>\n      <rect id=\"touch\" x=\"-400\" y=\"-400\" width=\"1600\" height=\"1410\" fill=\"transparent\"/><!-- 永不重画的触摸层：重画 dyn 时不会删掉手指按着的元素 -->\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* ============ 1. 真相模型：页面上的每个数字都从这里算 ============ */\nconst MODEL = {\n  dnaMeters: 2,            // 一个人体细胞里的 DNA 拉直约 2 米（Nature Scitable；Wikipedia「Chromosome condensation」）\n  nucleusUm: 6,            // 细胞核直径约 6 微米（5～10 微米）\n  pingpongCm: 4,           // 乒乓球直径 4 厘米\n  walkKmh: 4.5,            // 大人步行每小时约 4.5 公里\n  lettersPerSpool: 147,    // 每个小线轴绕 147 个字母（Luger 等 1997）\n  turnsPerSpool: 1.65,     // 绕不到两圈\n  spools: 3e7,             // 约 64 亿 ÷ 200 ≈ 3000 万个小线轴\n  fold: { spools: 7, loops: 1000, rods: 10000 },  // 一共缩短的倍数：绕线轴 / 盘成环 / 卷成小短棒\n  // 各号染色体的字母数（百万，GRCh38）和着丝粒的大致位置（只用来画形状）\n  chr: [[\"1\",249,.50],[\"2\",242,.39],[\"3\",198,.47],[\"4\",190,.27],[\"5\",182,.27],[\"6\",171,.36],[\"7\",159,.38],[\"8\",145,.31],\n        [\"9\",138,.34],[\"10\",134,.30],[\"11\",135,.39],[\"12\",133,.27],[\"13\",114,.15],[\"14\",107,.15],[\"15\",102,.15],[\"16\",90,.42],\n        [\"17\",83,.31],[\"18\",80,.23],[\"19\",59,.45],[\"20\",64,.45],[\"21\",47,.15],[\"22\",51,.15],[\"X\",156,.39],[\"Y\",57,.20]]\n};\nMODEL.scale = (MODEL.pingpongCm / 100) / (MODEL.nucleusUm * 1e-6);          // 细胞核放大成乒乓球的倍数（约 6667）\nconst lenAt = fold => MODEL.dnaMeters / fold;                                 // 缩短 fold 倍后的长度（米）\nconst geo = (a, b, p) => a * Math.pow(b / a, p);                              // 两个倍数之间按比例过渡\nfunction fmtLen(m){\n  if (m >= 1000) return (m/1000).toFixed(m >= 9500 ? 0 : 1).replace(/\\.0$/, \"\") + \" 公里\";\n  if (m >= 1) return (m >= 10 ? Math.round(m) : m.toFixed(1).replace(/\\.0$/, \"\")) + \" 米\";\n  if (m >= 0.01) return Math.round(m*100) + \" 厘米\";\n  return (m*1000 >= 10 ? Math.round(m*1000) : (m*1000).toFixed(1).replace(/\\.0$/, \"\")) + \" 毫米\";\n}\nconst fmtFold = f => f >= 9500 ? \"1 万\" : String(Math.round(f));\nconst fmtWan = n => n >= 1e4 ? String(Math.round(n/1e4)) + \" 万\" : String(Math.round(n));   // 用法：`${fmtWan(x)}个`\nconst fmtLetters = mb => mb >= 100 ? (mb/100).toFixed(2).replace(/0$/, \"\") + \" 亿\" : String(Math.round(mb * 100)) + \" 万\";\n\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩） ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n\n/* ============ 3. 手绘线条（平台的 sketchLib） ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function blob(cx,cy,rx,ry,seed){ const r=R(seed), N=9, p=[]; for(let i=0;i<N;i++){ const t=i/N*Math.PI*2, k=1+(r()-.5)*.1; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); } return cr(p,true)+\"Z\"; }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,blob,curve,cr,R};\n}\nconst Sk = sketchLib();\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst smooth = t => t * t * (3 - 2 * t);\nconst lerp = (a, b, t) => a + (b - a) * t;\n\n/* ============ 4. 页面骨架 ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gStatic = $(\"static\"), gDyn = $(\"dyn\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 4;\nconst S = { station: 1, mode: \"talk\", hold: false, theta: -Math.PI/2,\n  t1: 0, p1: 0, t2: 0, p2: 0, t3: 0, p3: 0, count: 0, done: {}, pairs: 0, sel: null, boyReveal: false, girl: false,\n  round: 1, tries: 0, kcur: 0, wow: false };\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ $(\"readout\").innerHTML = html || \"\"; }\nfunction say(text, tone){ const b = $(\"say\"); b.textContent = text; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\n// 手指还按着时换出来的新按钮，先禁用到手指抬起，免得松手时误点（按住类操作刚完成时最常见）\nlet fingerDown = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);   // 抬起时立刻记下：随后的 click 里换出的按钮不必禁用\n// 键盘版：按住空格或回车时换出来的新按钮会拿到焦点，松键就会点到它。按键在按钮出现前就按下了，这次点击不算\nlet keysDown = 0;\naddEventListener(\"keydown\", e => { if (!e.repeat) keysDown++; }, true);\naddEventListener(\"keyup\", () => { keysDown = Math.max(0, keysDown - 1); }, true);\naddEventListener(\"blur\", () => { keysDown = 0; });\nfunction actions(list){\n  const box = $(\"actions\"); box.replaceChildren();\n  const guard = fingerDown, born = performance.now();\n  let keyGuard = keysDown > 0;\n  if (keyGuard){ const off = () => { if (keysDown === 0){ setTimeout(() => { keyGuard = false; }, 0); removeEventListener(\"keyup\", off, true); } }; addEventListener(\"keyup\", off, true); }\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.textContent = a.label;\n    if (a.hold){\n      const on = v => { S.hold = v; b.classList.toggle(\"on\", v); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"poin \"click\", () => {\n      const q = ta.value.trim(); if (!q) return;\n      Host.noteQuestion(q); box.remove(); say(\"好问题，我记下来了。等会儿一起找答案。\");\n    });\n    area.append(box); ta.focus();\n  });\n  area.append(open);\n})();\n\n/* ============ 5. 第 1 站：绕线轴 ============ */\nconst REEL = { x: 135, y: 250, r: 96 }, ROW = { x0: 290, dx: 54, y: 250, n: 9 };\nfunction staticBench(){\n  return P(Sk.line(26, 392, 774, 392, 11), \"k1\") +\n    `<circle cx=\"${REEL.x}\" cy=\"${REEL.y}\" r=\"${REEL.r}\" fill=\"var(--paper)\" opacity=\".7\"/>` + P(Sk.ellipse(REEL.x, REEL.y, REEL.r, REEL.r, 21)) +\n    P(Sk.line(REEL.x - 30, REEL.y + REEL.r - 4, REEL.x - 52, 392, 22) + Sk.line(REEL.x + 30, REEL.y + REEL.r - 4, REEL.x + 52, 392, 23), \"k\") +\n    T(REEL.x, 422, \"说明书 DNA\", \"tm\", 'text-anchor=\"middle\"') +\n    T(40, 488, \"说明书长度\", \"t\") + P(Sk.line(170, 482, 760, 482, 31), \"k1\") +\n    [[1, \"2 米\"], [.5, \"1 米\"], [1 / MODEL.fold.spools, \"约 \" + fmtLen(Math.round(lenAt(MODEL.fold.spools) * 10) / 10)]].map(([fr, lab], i) => {\n      const x = 170 + 590 * fr;\n      return P(Sk.line(x, 474, x, 490, 40 + i), \"k1\") + T(x, 512, lab, \"tm\", 'text-anchor=\"middle\"');\n    }).join(\"\");\n}\nfunction spoolSvg(cx, y, wraps, seed){\n  const w = 36, h = 46;\n  let s = `<rect x=\"${cx - w/2}\" y=\"${y - h/2}\" width=\"${w}\" height=\"${h}\" rx=\"8\" fill=\"var(--apricot)\" opacity=\".9\"/>` +\n    P(Sk.line(cx - w/2, y - h/2 + 6, cx - w/2, y + h/2 - 4, seed) + Sk.line(cx + w/2, y - h/2 + 6, cx + w/2, y + h/2 - 4, seed + 1), \"k1\") +\n    P(Sk.ellipse(cx, y - h/2 + 5, w/2, 6, seed + 2), \"k1\") + P(Sk.curve([[cx - w/2, y + h/2 - 6], [cx, y + h/2], [cx + w/2, y + h/2 - 6]], seed + 3, .5), \"k1\");\n  if (wraps > 0) s += P(Sk.curve([[cx - w/2 - 2, y - 13], [cx, y - 6], [cx + w/2 + 2, y - 1]], seed + 4, .4), \"thread\");\n  if (wraps > 1) s += P(Sk.curve([[cx - w/2 - 2, y + 3], [cx, y + 10], [cx + w/2 + 2, y + 15]], seed + 5, .4), \"thread\");\n  return s;\n}\nfunction draw1(){\n  const p = S.p1, k = p * ROW.n, full = Math.floor(k + 1e-6), frac = k - full;\n  const rr = 30 + 56 * (1 - p);\n  let s = `<circle cx=\"${REEL.x}\" cy=\"${REEL.y}\" r=\"${rr}\" fill=\"var(--accent)\" opacity=\".22\"/>`;\n  for (let i = 0; i < 4; i++) s += P(Sk.ellipse(REEL.x, REEL.y, rr * (0.5 + i * 0.16), rr * (0.5 + i * 0.16), 50 + i, .6), \"thread-thin\");\n  s += `<circle cx=\"${REEL.x}\" cy=\"${REEL.y}\" r=\"20\" fill=\"var(--pane)\"/>` + P(Sk.ellipse(REEL.x, REEL.y, 20, 20, 60), \"k1\");\n  // 线从卷筒顶上出来，连到一串小线轴\n  const pts = [[REEL.x + rr * 0.5, REEL.y - rr * 0.87], [REEL.x + rr + 30, REEL.y - rr * 0.6 - 10]];\n  const shown = Math.min(ROW.n, full + (frac > 0.02 ? 1 : 0));\n  const xs = i => ROW.x0 + i * ROW.dx;\n  let chain = \"\";\n  if (shown === 0){\n    pts.push([ROW.x0 - 30, ROW.y - 30], [ROW.x0 + 20, ROW.y + 20], [ROW.x0 + 90, ROW.y - 10], [ROW.x0 + 170, ROW.y + 16], [ROW.x0 + 260, ROW.y - 6], [ROW.x0 + 360, ROW.y + 14], [ROW.x0 + 470, ROW.y - 4]);\n    s += P(Sk.curve(pts, 70, .3), \"thread\");\n  } else {\n    pts.push([xs(0) - 22, ROW.y - 13]);\n    s += P(Sk.curve(pts, 70, .3), \"thread\");\n    for (let i = 0; i < shown; i++){\n      const wraps = i < full ? 2 : (frac > 0.75 ? 2 : frac > 0.3 ? 1 : 0);\n      if (i > 0) chain += P(Sk.curve([[xs(i - 1) + 20, ROW.y + 15], [(xs(i - 1) + xs(i)) / 2, ROW.y + 30], [xs(i) - 20, ROW.y - 13]], 80 + i, .3), \"thread\");\n      chain += spoolSvg(xs(i), ROW.y, wraps, 100 + i * 7);\n    }\n    s += chain;\n    if (shown < ROW.n){\n      const xe = xs(shown - 1) + 20;\n      s += P(Sk.curve([[xe, ROW.y + 15], [xe + 40, ROW.y + 34], [xe + 100, ROW.y + 10], [Math.min(780, xe + 190), ROW.y + 24]], 90, .3), \"thread\");\n    }\n    s += T(ROW.x0 + ROW.dx * 4, ROW.y + 70, \"蛋白质小线轴\", \"tm\", 'text-anchor=\"middle\"');\n  }\n  // 把手\n  const ax = REEL.x + Math.cos(S.theta) * 66, ay = REEL.y + Math.sin(S.theta) * 66;\n  s += P(Sk.line(REEL.x, REEL.y, ax, ay, 61), \"k\") + `<circle cx=\"${ax}\" cy=\"${ay}\" r=\"17\" fill=\"var(--pane)\"/>` + P(Sk.ellipse(ax, ay, 17, 17, 62)) +\n    `<circle cx=\"${ax}\" cy=\"${ay}\" r=\"5\" fill=\"var(--ink)\"/>` + `<circle id=\"knob\" cx=\"${ax}\" cy=\"${ay}\" r=\"36\" fill=\"transparent\"/>`;\n  // 长度条\n  const L = lenAt(geo(1, MODEL.fold.spools, p));\n  s += `<rect x=\"170\" y=\"472\" width=\"${Math.max(2, 590 * L / MODEL.dnaMeters)}\" height=\"20\" rx=\"4\" fill=\"var(--accent)\" opacity=\".85\"/>`;\n  return s;\n}\nfunction readout1(){\n  const p = S.p1, L = lenAt(geo(1, MODEL.fold.spools, p));\n  readout(`长 <b>${fmtLen(L)}<\/b> · 小线轴 ${p >= .995 ? \"约 \" + fmtWan(MODEL.spools) : fmtWan(MODEL.spools * p)}个`);\n  Host.state({ station: 1, length_m: +L.toFixed(3) });\n}\nfunction enter1(){\n  S.station = 1; S.mode = \"talk\"; head(1, \"绕线轴\"); hint(\"\"); gStatic.innerHTML = staticBench(); render();\n  say(\"舰长，细胞核比针尖还小得多，可里面的说明书拉直了有 2 米长。\");\n  next(\"然后呢？\", () => ask(\"细胞是怎么把它收进细胞核的？\", [\n    { label: \"剪成很多小段，塞进去\", mis: \"cut-into-pieces\", feedback: \"看起来最省事。可剪断了，说明书就不全了，有的页会丢。\" },\n    { label: \"揉成一团，塞进去\", mis: \"stuffed-in\", feedback: \"很多人都这么想。可揉成一团会打结，要读的那一页就找不到了。\" },\n    { label: \"一圈圈绕好，一层层收整齐\", correct: true, feedback: \"你猜对了。像把毛线绕在线轴上。我们亲手试试。\" }\n  ], o => next(o.correct ? \"开始绕\" : \"那该怎么收？\", o.correct ? act1 : () => { say(\"细胞的办法是一圈圈绕好，一层层收整齐。我们亲手试试。\"); next(\"开始绕\", act1); })));\n}\nfunction act1(){\n  S.mode = \"act1\"; hint(\"转动把手，或按住「转」\");\n  say(\"说明书要先绕在蛋白质做的小线轴上。转动把手，看看它变短了多少。\");\n  actions([{ label: \"按住 转\", cls: \"hold\", hold: true, step: () => { S.t1 = clamp(S.t1 + .04); S.theta += .5; } }]);\n  readout1(); svg.focus({ preventScroll: true });\n}\nfunction done1(){\n  S.mode = \"talk\"; S.hold = false; hint(\"\"); Host.event(\"observed\", { station: 1 });\n  say(`绕好了。每个小线轴上绕着 ${MODEL.lettersPerSpool} 个字母，绕不到两圈。说明书短了约 ${MODEL.fold.spools} 倍。`, \"good\");\n  next(\"继续\", () => { say(`一个细胞里，大约有 ${fmtWan(MODEL.spools)} 个这样的小线轴。`); next(\"去第 2 站\", enter2); });\n}\n\n/* ============ 6. 第 2 站：盘成环 ============ */\nconst NUC = { x: 400, y: 232, r: 196 }, M = 240;\nconst FIB = (() => {\n  const a = [], b = [], r = Sk.R(5);\n  for (let i = 0; i < M; i++){\n    a.push([NUC.x + 10 + i * 4.4, NUC.y + 26 * Math.sin(i * .33) + 9 * Math.sin(i * .12)]);\n    const th = i / M * Math.PI * 2 + .2, rad = 16 + 150 * Math.pow(Math.abs(Math.sin(3 * th)), .85) + (r() - .5) * 6;\n    b.push([NUC.x + Math.cos(th) * rad, NUC.y + Math.sin(th) * rad]);\n  }\n  return { a, b };\n})();\nconst KNOB_I = 80;\nfunction fiberPts(p){\n  return FIB.a.map((q, i) => { const s = smooth(clamp(p * 1.5 - .5 * (i / M))); return [lerp(q[0], FIB.b[i][0], s), lerp(q[1], FIB.b[i][1], s)]; });\n}\nfunction staticCell(){\n  return `<path d=\"${Sk.blob(400, 280, 365, 268, 3)}\" fill=\"var(--sage)\" opacity=\".55\"/>` + P(Sk.blob(400, 280, 365, 268, 3), \"k1\");\n}\nfunction nucleusSvg(dashFade){\n  const o = 1 - (dashFade || 0);\n  return `<circle cx=\"${NUC.x}\" cy=\"${NUC.y}\" r=\"${NUC.r}\" fill=\"var(--sky)\" opacity=\"${(.75 * o + .15).toFixed(2)}\"/>` +\n    P(Sk.ellipse(NUC.x, NUC.y, NUC.r, NUC.r, 7), \"k\", dashFade > .3 ? `stroke-dasharray=\"6 10\" opacity=\"${(o + .25).toFixed(2)}\"` : \"\");\n}\nfunction fiberSvg(pts, opacity, scale){\n  const sc = scale == null ? 1 : scale, q = sc === 1 ? pts : pts.map(([x, y]) => [NUC.x + (x - NUC.x) * sc, NUC.y + (y - NUC.y) * sc]);\n  let s = `<g opacity=\"${opacity == null ? 1 : opacity.toFixed(2)}\">` + `<path class=\"thread\" d=\"${Sk.cr(q, false)}\" stroke-width=\"${(3.2 * Math.max(.6, sc)).toFixed(1)}\"/>`;\n  for (let i = 3; i < q.length; i += 6) s += `<circle cx=\"${q[i][0].toFixed(1)}\" cy=\"${q[i][1].toFixed(1)}\" r=\"${(4.6 * Math.max(.6, sc)).toFixed(1)}\" fill=\"var(--apricot)\" stroke=\"var(--ink)\" stroke-width=\".9\"/>`;\n  return s + \"<\/g>\";\n}\nfunction draw2(){\n  const p = S.p2, pts = fiberPts(p);\n  let s = fiberSvg(pts);\n  const kq = pts[KNOB_I];\n  if (S.mode === \"act2\"){\n    s += `<circle cx=\"${kq[0]}\" cy=\"${kq[1]}\" r=\"15\" fill=\"var(--a
