<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>好奇号 · 试玩版 · 生命的说明书</title>
<style>
:root{
  --bg:#F5F4EE; --pane:#FBFAF6; --side:#EFEDE5; --hover:#E7E4D9; --rule:#E0DCD0;
  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;
  --accent:#C2603F; --accent-soft:#F3E0D6; --on-accent:#FFFFFF;
  --c-math:#ECCDB6; --c-sci:#CCD6C0; --c-sci-2:#93A982; --c-sci-bg:#DCE3D2;
  --c-sky:#CFDCE6; --wash:#EFE4D6; --dad:#4F7FA8; --mom:#C2603F;
  --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;
  --shadow:0 1px 2px rgba(31,30,28,.06),0 8px 28px rgba(31,30,28,.08);
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-hand:"ZCOOL KuaiLe","Kaiti SC","STKaiti","KaiTi","Noto Sans SC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1E1E1E; --pane:#252525; --side:#1B1B1B; --hover:#2E2E2E; --rule:#353535;
  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;
  --accent:#A797F7; --accent-soft:#2D2943; --on-accent:#15121F;
  --c-math:#5A4536; --c-sci:#3C4836; --c-sci-2:#6F8560; --c-sci-bg:#28301F;
  --c-sky:#2D3B47; --wash:#2A2738; --dad:#7FA9CF; --mom:#E0876A;
  --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 120px}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.topbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 18px;min-height:56px}
.topbar .title{flex:1;font-family:var(--f-serif);font-weight:600;color:var(--ink);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:1px solid var(--rule);background:var(--pane);border-radius:10px;padding:6px 12px;font-size:15px}
.tag{font-size:12px;color:var(--muted);border:1px dashed var(--rule);border-radius:999px;padding:1px 9px;white-space:nowrap}
h1,h2,h3{font-family:var(--f-serif);color:var(--ink);line-height:1.35;margin:0}
.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* 首页 */
.hero{margin:22px 0 8px;padding:22px;border-radius:18px;background:var(--c-sci-bg);display:flex;gap:16px;align-items:center}
.hero .eyebrow{font-size:13px;color:var(--muted);letter-spacing:.05em}
.hero h1{font-size:28px;margin:4px 0 6px}
.hero p{margin:0}
.hero svg{flex:none;width:96px;height:96px}
.note{font-size:14px;color:var(--muted);margin:10px 2px 18px}
.line{position:relative;padding-left:34px}
.line:before{content:"";position:absolute;left:13px;top:18px;bottom:18px;border-left:2px dashed var(--c-sci-2)}
.star{position:relative;background:var(--pane);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;margin:0 0 16px;box-shadow:var(--shadow)}
.star .dot{position:absolute;left:-34px;top:16px;width:28px;height:28px;border-radius:50%;background:var(--c-sci);border:2px solid var(--ink);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink)}
.star h2{font-size:20px}
.star .dq{font-family:var(--f-hand);color:var(--ink);font-size:18px;margin:6px 0 12px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.act{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--bg);border-radius:12px;padding:9px 14px;min-height:48px;font-size:16px}
.act:hover{background:var(--hover)}
.act small{color:var(--muted);font-size:13px}
.act.done{background:var(--good-soft);border-color:var(--good)}
.act .tick{color:var(--good);font-weight:700}
.parent{display:block;margin:26px auto 0;border:1px dashed var(--rule);background:transparent;border-radius:12px;padding:10px 16px;color:var(--muted);font-size:15px}

/* 领航员对话 */
.chat{padding:18px 0 8px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:flex-end}
.row.me{justify-content:flex-end}
.ava{flex:none;width:40px;height:40px}
.bub{max-width:min(560px,82%);background:var(--pane);border:1px solid var(--rule);border-radius:16px 16px 16px 4px;padding:10px 14px;color:var(--ink);box-shadow:var(--shadow)}
.row.me .bub{background:var(--accent-soft);border-color:transparent;border-radius:16px 16px 4px 16px}
.bub.hint{background:var(--c-sky);border-color:transparent}
.bub.good{background:var(--good-soft);border-color:transparent}
.bub.bad{background:var(--bad-soft);border-color:transparent}
.bub .lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.bub.fig{max-width:min(620px,88%);padding:10px}
.fig-box{background:var(--bg);border-radius:12px;padding:6px}
.fig-box svg{display:block;width:100%;height:auto;max-height:52vh}
.fig-box [fill="#CCD6C0" i]{fill:var(--c-sci)} .fig-box [fill="#CFDCE6" i]{fill:var(--c-sky)}
.fig-box [fill="#ECCDB6" i]{fill:var(--c-math)} .fig-box [fill="#EFE4D6" i]{fill:var(--wash)}
.fig-box [fill="#4F7FA8" i]{fill:var(--dad)} .fig-box [fill="#C2603F" i]{fill:var(--mom)}
.fig-box [stroke="#4F7FA8" i]{stroke:var(--dad)} .fig-box [stroke="#C2603F" i]{stroke:var(--mom)}
.fig-box [stroke="#1F1E1C" i]{stroke:var(--ink)} .fig-box text{fill:var(--ink)}
.cap{font-size:15px;color:var(--text);margin:8px 4px 2px}
.ask{margin-top:4px}
.ask .stem{font-weight:600}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choice{text-align:left;border:1.5px solid var(--ink);background:var(--bg);border-radius:12px;padding:10px 14px;min-height:48px;font-size:17px}
.choice:hover:not(:disabled){background:var(--hover)}
.choice:disabled{cursor:default}
.choice.wrong{border-color:var(--bad);color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.choice.right{border-color:var(--good);background:var(--good-soft);font-weight:600}
.numrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.numrow input{width:130px;font:inherit;font-size:20px;padding:8px 12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink)}
.numrow .unit{font-size:18px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 18px;min-height:48px;font-size:17px;font-weight:600}
.btn.ghost{background:var(--pane);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 26%);padding:26px 0 calc(14px + env(safe-area-inset-bottom,0))}
.dock .in{max-width:760px;margin:0 auto;padding:0 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.composer{background:var(--pane);border:1px solid var(--rule);border-radius:16px;padding:12px;box-shadow:var(--shadow);margin:6px 0}
textarea{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical;min-height:96px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px dashed var(--ink);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:16px;min-height:40px}
.row-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.endcard{background:var(--c-sci-bg);border-radius:16px;padding:18px;margin:16px 0}
.endcard h3{font-size:19px;margin-bottom:6px}
.endcard .row-btns{justify-content:flex-start}

/* 挑战 */
.qcard{background:var(--pane);border:1px solid var(--rule);border-radius:18px;padding:18px;margin-top:18px;box-shadow:var(--shadow)}
.progress{display:flex;gap:6px;margin:18px 0 0;align-items:center;color:var(--muted);font-size:14px}
.progress i{display:inline-block;width:20px;height:8px;border-radius:4px;background:var(--rule)}
.progress i.on{background:var(--ink)} .progress i.ok{background:var(--good)}
.qcard .stem{font-size:19px;font-weight:600;color:var(--ink)}
.fb{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.fb .bub{max-width:100%}
.counter{font-size:13px;color:var(--muted);text-align:right}

/* 记录 */
.rec h2{font-size:20px;margin:22px 0 8px}
.rec h3{font-size:17px;margin:14px 0 6px}
.rec ul{margin:4px 0;padding-left:20px}
.rec .muted{color:var(--muted)}
.rec pre{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--pane);border:1px solid var(--rule);border-radius:12px;padding:12px}

@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .28s ease-out both}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .draw .k,.draw .k1{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}
@media (max-width:520px){
  body{font-size:16px}
  .hero{padding:16px} .hero h1{font-size:24px} .hero svg{width:72px;height:72px}
  .bub{max-width:86%}
}
</style>
</head>

1 C530 169 509 174 491 164 C470 175 448 166 435 150 C421 133 420 103 433 85 Z\" fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"k\"/>\n  <circle cx=\"463\" cy=\"105\" r=\"7\" fill=\"#CFDCE6\" fill-opacity=\"0.85\"/>\n  <circle cx=\"489\" cy=\"96\" r=\"7\" fill=\"#CFDCE6\" fill-opacity=\"0.85\"/>\n  <circle cx=\"516\" cy=\"107\" r=\"7\" fill=\"#CFDCE6\" fill-opacity=\"0.85\"/>\n  <circle cx=\"473\" cy=\"133\" r=\"7\" fill=\"#CFDCE6\" fill-opacity=\"0.85\"/>\n  <circle cx=\"501\" cy=\"137\" r=\"7\" fill=\"#CFDCE6\" fill-opacity=\"0.85\"/>\n  <circle cx=\"526\" cy=\"132\" r=\"7\" fill=\"#CFDCE6\" fill-opacity=\"0.85\"/>\n  <path d=\"M166 115 C177 112 188 114 204 115 M196 108 L204 115 L196 122 M374 115 C384 112 394 114 410 115 M402 108 L410 115 L402 122\" fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"k\"/>\n  <text x=\"100\" y=\"222\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1F1E1C\">年轻红细胞<\/text>\n  <text x=\"285\" y=\"222\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1F1E1C\">推出细胞核<\/text>\n  <text x=\"490\" y=\"198\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1F1E1C\">氧气<\/text>\n  <text x=\"490\" y=\"228\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1F1E1C\">成熟红细胞<\/text>\n<\/svg>"}, "stars": [{"activities": [{"body": {"steps": [{"text": "舰长，你的身体是用什么搭起来的？先想一想，不急着回答。", "type": "text"}, {"text": "房子能用一块块积木搭，身体能用一个个细胞搭。人和动物这样，大树、小草也这样。", "type": "text"}, {"item": {"answer": {"choices": [{"feedback": "很多人都先想到人和动物。大树、小草也是由一个个细胞组成的。", "id": "a", "misconception": "only-animals", "text": "只有人和动物"}, {"correct": true, "id": "b", "text": "人、动物和植物"}, {"feedback": "植物确实由细胞组成，不过人和动物的身体也是由细胞搭成的。", "id": "c", "text": "只有植物"}], "type": "choice"}, "hints": ["想想积木的比方，除了身体，还有谁也能这样搭？", "一片树叶、一棵小草，它们是不是也有生命？", "别把范围只放在会跑会跳的生命上。"], "id": "c1", "stem": "下面哪些是由细胞组成的？"}, "type": "check"}, {"text": "大多数细胞小得连放大镜都不够，要用显微镜才能看见。", "type": "text"}, {"caption": "从树叶到显微镜下的细胞：大多数细胞很小，要放大很多倍才看得见。", "figure": {"src": "content/assets/biology.cell.cell-intro/cell-zoom.svg", "type": "svg"}, "type": "figure"}, {"item": {"answer": {"choices": [{"feedback": "用眼睛看最方便，不过大多数细胞太小，眼睛直接看不清。", "id": "a", "misconception": "visible", "text": "只用眼睛"}, {"feedback": "放大镜能让东西变大，但大多数细胞还是太小，需要显微镜。", "id": "b", "misconception": "visible", "text": "放大镜"}, {"correct": true, "id": "c", "text": "显微镜"}], "type": "choice"}, "hints": ["先想想，大多数细胞有多小。", "放大镜能看清树叶上的细脉，还能看清更小的细胞吗？", "要找一种比放大镜本领更大的观察工具。"], "id": "c2", "stem": "想看看大多数细胞，用哪种工具更合适？"}, "type": "check"}, {"text": "神经细胞长长的，伸出许多分叉，负责传消息；红细胞圆圆扁扁，负责运氧气。肌肉细胞细细长长，能用力收缩。", "type": "text"}, {"caption": "神经细胞传消息，红细胞运氧气，肌肉细胞能收缩；它们的形状和本领各不一样。", "figure": {"src": "content/assets/biology.cell.cell-intro/cell-kinds.svg", "type": "svg"}, "type": "figure"}, {"text": "细胞可不像积木：它是活的，会吃东西、会长大，还会一个分成两个。", "type": "text"}, {"caption": "一个细胞慢慢收紧，分成两个细胞。", "figure": {"src": "content/assets/biology.cell.cell-intro/cell-divide.svg", "type": "svg"}, "type": "figure"}, {"item": {"answer": {"choices": [{"feedback": "积木确实一直不变，但细胞会吃东西、会长大，不是不变的小零件。", "id": "a", "misconception": "cells-are-dead", "text": "会像积木一样一直不变"}, {"correct": true, "id": "b", "text": "会吃东西、长大，还能分成两个"}, {"feedback": "看起来确实像小零件，但细胞会吃东西、会长大，还会分成两个。", "id": "c", "misconception": "cells-are-dead", "text": "只是身体里没有生命的小零件"}], "type": "choice"}, "hints": ["回忆一下，细胞和积木最不一样的地方。", "活的细胞不会一直停在原来的样子。", "找找哪个选项在说细胞会变化、会增加。"], "id": "c3", "stem": "下面哪件事说明细胞是活的？"}, "type": "check"}, {"text": "细胞这个小房间里，还有一个更小的房间，叫细胞核，里面放着一份“说明书”。", "type": "text"}, {"caption": "细胞核像小房间里的小房间，里面放着一份“说明书”。", "figure": {"src": "content/assets/biology.cell.cell-intro/cell-nucleus.svg", "type": "svg"}, "type": "figure"}, {"text": "动物和植物的细胞一般都有细胞核；人成熟的红细胞把细胞核扔掉了，是例外。", "type": "text"}, {"text": "这份“说明书”上写的是什么？舰长，去下一颗星 DNA 找答案吧。", "type": "text"}], "style": "tutor"}, "duration_min": 5, "id": "act.explain.cell-intro-01", "kind": "explain", "title": "细胞：生命的小房间"}, {"body": {"items": [{"answer": {"choices": [{"correct": true, "id": "a", "text": "人、动物和植物都由细胞组成"}, {"feedback": "人和动物由细胞组成，这很容易注意到；植物也是由细胞组成的。", "id": "b", "misconception": "only-animals", "text": "人和动物由细胞组成，植物不是"}, {"feedback": "植物确实由细胞组成；人和动物的身体也是由细胞组成的。", "id": "c", "text": "植物由细胞组成，人和动物不是"}], "type": "choice"}, "hints": ["想一想，人、动物和植物是不是都要算进去。", "不要只看会跑会跳的动物，也想想植物。"], "id": "q1", "stem": "舰长，下面哪种说法对？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "会吃东西、长大，还会分成两个"}, {"feedback": "把细胞想成小零件很方便，但细胞和零件不一样，它是活的。", "id": "b", "misconception": "cells-are-dead", "text": "只是身体里的小零件，不是活的"}, {"feedback": "细胞搭成身体，确实有点像积木；但细胞会变化，不是搭好就不动。", "id": "c", "misconception": "cells-are-dead", "text": "像积木一样，搭好以后就不再变化"}], "type": "choice"}, "hints": ["想想活的东西会做什么，积木会不会做这些事。", "回忆一下，细胞会不会吃东西、长大和变化。"], "id": "q2", "stem": "下面哪件事说明细胞是活的？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "显微镜"}, {"feedback": "眼睛能看清许多东西，但大多数细胞太小，直接用眼睛通常看不见。", "id": "b", "misconception": "visible", "text": "眼睛"}, {"feedback": "放大镜确实能帮忙看小东西，但大多数细胞还需要放大得更多。", "id": "c", "misconception": "visible", "text": "放大镜"}], "type": "choice"}, "hints": ["这种工具能把很小的东西放得更大。", "放大镜能帮一点忙，但大多数细胞还需要更强的工具。"], "id": "q3", "stem": "大多数细胞很小，想看清楚它们，通常要用什么？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "有很多种细胞，形状和本领各不一样"}, {"feedback": "都叫细胞，听起来像同一种；其实神经细胞和肌肉细胞的样子并不一样。", "id": "b", "misconception": "one-kind", "text": "身体里的细胞都长得一样"}, {"feedback": "身体是一个整体，容易让人这样想；但不同细胞有不同的本领。", "id": "c", "misconception": "one-kind", "text": "身体里的细胞只有一种"}], "type": "choice"}, "hints": ["想想神经细胞和肌肉细胞，它们做的事情一样吗？", "它们的名字已经告诉我们本领不同，再想想样子会不会也不同。"], "id": "q4", "stem": "关于身体里的细胞，下面哪种说法对？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "细胞核"}, {"feedback": "红细胞的名字里也有“细胞”，但它是一种细胞，不是放说明书的小房间。", "id": "b", "text": "红细胞"}, {"feedback": "显微镜能帮我们看细胞，但它是工具，不是细胞里面的小房间。", "id": "c", "text": "显微镜"}], "type": "choice"}, "hints": ["它在细胞里面，不是另一种细胞，也不是看细胞的工具。", "它的名字和“中间”有关。"], "id": "q5", "stem": "细胞里放说明书的小房间是什么？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "动物和植物的细胞一般都有细胞核"}, {"feedback": "红细胞确实是细胞；但人成熟的红细胞没有细胞核，是一个例外。", "id": "b", "text": "所有细胞都有细胞核，人成熟的红细胞也有"}, {"feedback": "动物细胞一般有细胞核，这点你想到了；植物细胞一般也有。", "id": "c", "text": "只有动物的细胞有细胞核，植物的细胞没有"}], "type": "choice"}, "hints": ["想想放说明书的小房间，大多数动物和植物的细胞里都有它。", "注意“一般”不等于“所有”，人成熟的红细胞是例外。"], "id": "q6", "stem": "关于细胞核，下面哪种说法对？"}], "shuffle": true}, "duration_min": 5, "id": "act.quiz.cell-intro-01", "kind": "quiz", "title": "细胞小房间挑战"}], "dq": "你的身体是用什么搭起来的？", "id": "biology.cell.cell-intro", "misconceptions": {"cells-are-dead": "细胞只是身体里的小零件，它们不是活的。", "one-kind": "身体里的细胞都长得一样。", "only-animals": "只有动物和人是由细胞组成的，植物不是。", "visible": "细胞用眼睛就能看见。"}, "title": "细胞：生命的小房间"}, {"activities": [{"body": {"steps": [{"text": "舰长，为什么小狗生下来的总是小狗，不会是小猫？先想一想。", "type": "text"}, {"text": "上一颗星说过，细胞核是细胞这个小房间里的小房间，里面放着一份说明书。它叫 DNA。", "type": "text"}, {"text": "DNA 像一本用 A、T、C、G 四种字母写成的说明书，记着身体怎么长、长成什么样。", "type": "text"}, {"caption": "小狗的说明书写着怎么长成小狗。", "figure": {"src": "content/assets/biology.genetics.dna-intro/dna-book.svg", "type": "svg"}, "type": "figure"}, {"text": "身体里绝大多数细胞，带的都是同一套说明书。", "type": "text"}, {"text": "神经细胞和肌肉细胞本领不同，是因为它们读的是同一本书的不同几页。", "type": "text"}, {"caption": "两本书是同一套，翻开的页不同，细胞的本领就不同。", "figure": {"src": "content/assets/biology.genetics.dna-intro/dna-pages.svg", "type": "svg"}, "type": "figure"}, {"item": {"answer": {"choices": [{"correct": true, "id": "a", "text": "它们读的是同一本书的不同几页"}, {"feedback": "看起来确实像各有一本书，其实它们带的是同一套，只是读的几页不同。", "id": "b", "misconception": "different-books", "text": "它们的说明书本来就不同"}, {"feedback": "看起来确实像书有厚薄，其实绝大多数细胞带的是同一套，只是用的页不同。", "id": "c", "misconception": "different-books", "text": "它们带的说明书页数不一样多"}], "type": "choice"}, "hints": ["想一想，刚才说的“同一套”是什么意思。", "本领不同，不一定是书不同，也可能是翻开的地方不同。"], "id": "c1", "stem": "神经细胞和肌肉细胞带着同一套说明书，为什么本领不一样？"}, "type": "check"}, {"text": "DNA 不是只在血液里。皮肤细胞、口腔里的细胞和肌肉细胞里，也都有 DNA。", "type": "text"}, {"item": {"answer": {"choices": [{"correct": true, "id": "a", "text": "不是，皮肤、口腔和肌肉细胞里也有"}, {"feedback": "很多人都这么想，其实血液只是身体的一部分，皮肤、口腔和肌肉细胞里也有 DNA。", "id": "b", "misconception": "blood-only", "text": "是，只在血液里"}, {"feedback": "看起来确实像血液最特别，其实别的许多细胞也有细胞核，也带着说明书。", "id": "c", "misconception": "blood-only", "text": "是，别的细胞都没有说明书"}], "type": "choice"}, "hints": ["血液只是身体的一部分，身体还有皮肤、口腔和肌肉。", "红细胞是例外，不能代表身体里所有细胞。"], "id": "c2", "stem": "舰长，DNA 只在血液里吗？"}, "type": "check"}, {"text": "人成熟的红细胞长好以后，会把细胞核连同说明书一起扔掉，腾出地方多装氧气。它当初也是照着同一本说明书长出来的。", "type": "text"}, {"caption": "成熟红细胞没有细胞核，但年轻时也曾带着同一套说明书。", "figure": {"src": "content/assets/biology.genetics.dna-intro/red-cell.svg", "type": "svg"}, "type": "figure"}, {"text": "说明书不是放着不动的。你每天长个子、摔破的伤口长好，细胞都在照着它做。", "type": "text"}, {"item": {"answer": {"choices": [{"correct": true, "id": "a", "text": "长个子、修补伤口时都会用"}, {"feedback": "这个想法有道理，因为说明书会传给孩子；但长个子、修补伤口时也要用它。", "id": "b", "misconception": "only-for-babies", "text": "只在生小宝宝时用"}, {"feedback": "说明书确实会传给孩子，但它在自己身体里也有工作，比如帮助身体长大和修补。", "id": "c", "misconception": "only-for-babies", "text": "只有传给孩子时才用"}], "type": "choice"}, "hints": ["想想伤口长好的时候，细胞有没有在工作。", "身体每天长个子、修补伤口，要不要照着说明书做？"], "id": "c3", "stem": "身体里的说明书，什么时候会用？"}, "type": "check"}, {"text": "说明书是爸爸妈妈传给孩子的，这叫遗传。小狗从狗爸爸狗妈妈那里拿到狗的说明书，所以长成小狗。", "type": "text"}, {"text": "一个带细胞核的人体细胞里，DNA 全部拉直大约有 2 米，比大人还高。", "type": "text"}, {"text": "这么长，怎么装进小小的细胞核？请舰长去下一颗星“染色体”找答案。", "type": "text"}], "style": "tutor"}, "duration_min": 5, "id": "act.explain.dna-intro-01", "kind": "explain", "title": "DNA：细胞里的说明书"}, {"body": {"items": [{"answer": {"tolerance": 0, "type": "number", "unit": "种", "value": 4}, "hints": ["DNA 用的字母种类很少，不用想成一整张英文字母表。", "回忆讲解里数的字母种类，只填一个数字。"], "id": "q1", "stem": "DNA 这本说明书是用几种字母写成的？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "细胞核"}, {"feedback": "很多人都这么想；其实 DNA 不只在血液里，它一般放在细胞核里。", "id": "b", "misconception": "blood-only", "text": "只在血液里"}, {"feedback": "说明书像是可以拿来拿去，容易让人这样想；但 DNA 一般在细胞核里，不在细胞外面。", "id": "c", "text": "细胞外面"}], "type": "choice"}, "hints": ["想一想细胞里那个“小房间里的小房间”。", "放说明书的地方，名字里有一个“核”字。"], "id": "q2", "stem": "舰长，DNA 这本说明书一般放在细胞的哪里？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "它们带着同一套说明书"}, {"feedback": "它们本领不同，看起来确实像用了不同的书；其实它们读的是同一套说明书的不同几页。", "id": "b", "misconception": "different-books", "text": "它们各自带着完全不同的说明书"}, {"feedback": "很多人都这么想；其实肌肉细胞也带说明书，绝大多数细胞带的是同一套。", "id": "c", "text": "只有神经细胞带说明书，肌肉细胞不带"}], "type": "choice"}, "hints": ["它们的本领不同，但本领不同不等于带着不同的书。", "想想它们会不会读同一本书的不同几页。"], "id": "q3", "stem": "神经细胞和肌肉细胞带的 DNA 说明书，有什么关系？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "不带，因为它没有细胞核"}, {"feedback": "很多人都这么想；但红细胞没有细胞核，也就没有带 DNA 这本说明书。", "id": "b", "misconception": "blood-only", "text": "带着，因为 DNA 只在血液里"}, {"feedback": "不同细胞有不同本领，容易让人这样想；但红细胞没有细胞核，也就没有带说明书。", "id": "c", "misconception": "different-books", "text": "带着，因为每种细胞都有不同的说明书"}], "type": "choice"}, "hints": ["先想想，DNA 这本说明书一般放在细胞的哪里。", "红细胞成熟后没有那个放说明书的小房间，再判断它带不带。"], "id": "q4", "stem": "人成熟的红细胞没有细胞核，它还带着 DNA 这本说明书吗？"}, {"answer": {"choices": [{"correct": true, "id": "a", "text": "要用，修补伤口也要照着它做"}, {"feedback": "说明书能传给孩子，容易让人这样想；其实身体长大、修补伤口时也在用它。", "id": "b", "misconception": "only-for-babies", "text": "不用，它只在生小宝宝时有用"}, {"feedback": "用完一本书就收起来的想法很熟悉；但这本说明书一直在用，修补伤口时也要用。", "id": "c", "text": "不用，说明书用完一次就不再用了"}], "type": "choice"}, "hints": ["想想这本书是不是只在生小宝宝时才打开。", "身体每天长大、修补伤口，也要知道该怎么做。"], "id": "q5", "stem": "伤口慢慢长好时，身体还要不要用 DNA 这本说明书？"}], "shuffle": true}, "duration_min": 5, "id": "act.quiz.dna-intro-01", "kind": "quiz", "title": "DNA 说明书大挑战"}], "dq": "为什么小狗生下来的总是小狗，不会是小猫？", "id": "biology.genetics.dna-intro", "misconceptions": {"blood-only": "DNA 只在血液里。", "different-books": "身体不同地方的细胞，带的是不同的说明书。", "only-for-babies": "说明书只在生小宝宝的时候才有用，平时用不上。"}, "title": "DNA：细胞里的说明书"}, {"activities": [{"body": {"steps": [{"text": "舰长，这么长的说明书，小小的细胞是怎么装下的？先猜猜看。", "type": "text"}, {"text": "一个细胞里的 DNA 拉直了大约有 2 米长，细胞核却小得要用显微镜才能看见。", "type": "text"}, {"text": "就像一大堆毛线，先绕在小线轴上，再收成一团。DNA 缠在蛋白质上，再折叠成染色体。", "type": "text"}, {"caption": "长长的 DNA 缠在像小线轴一样的蛋白质上，再折叠成染色体。", "figure": {" ": "y-from-mother", "text": "X 来自爸爸，Y 来自妈妈"}, {"correct": true, "id": "b", "text": "X 来自妈妈，Y 来自爸爸"}, {"feedback": "爸爸给了男孩 Y 染色体，但男孩也从妈妈那里得到一条 X。", "id": "c", "misconception": "from-one-parent", "text": "X 和 Y 都来自爸爸"}], "type": "choice"}, "hints": ["妈妈只有 X 染色体，爸爸有 X 和 Y。", "先看看男孩那条短短的 Y，可能是谁给的？"], "id": "c3", "stem": "男孩的 X 染色体和 Y 染色体分别来自谁？"}, "type": "check"}, {"text": "狗有 78 条，小小的果蝇只有 8 条。染色体的多少，和个子大小、聪不聪明都没有关系。", "type": "text"}, {"item": {"answer": {"choices": [{"feedback": "看起来好像有道理，但染色体多少和个子大小没有关系。", "id": "a", "misconception": "bigger-more", "text": "个子一定比人大"}, {"feedback": "很多人都会这样猜，但染色体多少和聪不聪明没有关系。", "id": "b", "misconception": "more-is-smarter", "text": "一定比人聪明"}, {"correct": true, "id": "c", "text": "不能说明谁更大、谁更聪明"}], "type": "choice"}, "hints": ["再比比小小的果蝇和狗，它们的染色体数目很不一样。", "染色体的多少，只是在说说明书分成了多少卷。"], "id": "c4", "stem": "狗的染色体比人多，这说明狗一定怎样？"}, "type": "check"}, {"text": "身体由细胞搭成，细胞核里放着说明书 DNA，DNA 卷好收起来就是染色体。", "type": "text"}, {"text": "舰长，去写一句反思吧；还有想知道的，可以点「我有个问题」告诉我。", "type": "text"}], "style": "tutor"}, "duration_min": 5, "id": "act.explain.chromosome-intro-01", "kind": "explain", "title": "染色体：把说明书卷好收起来"}, {"body": {"items": [{"answer": {"choices": [{"correct": true, "id": "a", "text": "DNA 缠在蛋白质上，再折叠起来"}, {"feedback": "小线轴确实很重要，不过被缠住、卷好的是 DNA 说明书。", "id": "b", "text": "蛋白质缠在 DNA 上，再折叠起来"}, {"feedback": "直接放长说明书听起来很方便，不过它还要缠在蛋白质上，再折叠收好。", "id": "c", "text": "说明书拉直后直接放进细胞核"}], "type": "choice"}, "hints": ["想想长长的说明书怎样卷好收起来。", "先找缠说明书的小线轴，再想怎样折叠。"], "id": "q1", "stem": "卷好收起来的说明书——染色体，是怎么形成的？"}, {"answer": {"common_wrong": [{"feedback": "你想到的是对数；题目问的是一条一条数，共有多少条。", "value": 23}], "tolerance": 0, "type": "number", "unit": "条", "value": 46}, "hints": ["要一条一条地数，不要把两两配对后的对数当答案。", "每一对里有两条，要把所有对里的染色体都数进去。"], "id": "q2", "stem": "人的体细胞里一般有多少条染色体？"}, {"answer": {"common_wrong": [{"feedback": "你数的是一条一条的总数；两两配好以后，要数有多少对。", "value": 46}], "tolerance": 0, "type": "number", "unit": "对", "value": 23}, "hints": ["先让染色体两两配对，再数一数。", "每一对算一份，不要把一对里的两条分开数。"], "id": "q3", "st <script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const KIND = {explain:"讲解", quiz:"挑战", reflection:"反思"};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $app = document.getElementById("app"), $dock = document.getElementById("dock"), $dockIn = document.getElementById("dockIn");

// 这一页里的试玩记录，只放在内存里，刷新就没了
const S = {done:{}, log:{}};

const ACTS = [];   // 按顺序排好的全部活动
for (const st of DATA.stars) for (const a of st.activities) ACTS.push({...a, star:st});
const actById = id => ACTS.find(a => a.id === id);

function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
function svgEl(markup){
  const t = document.createElement("template"); t.innerHTML = markup.trim(); return t.content.firstElementChild;
}

const AVA = `<svg class="ava" viewBox="0 0 48 48" aria-hidden="true">
  <circle cx="24" cy="27" r="16" fill="var(--c-sky)"/>
  <path class="k" d="M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z"/>
  <path class="k1" d="M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5"/>
  <circle cx="18.5" cy="25" r="2.2" fill="var(--ink)"/><circle cx="29.5" cy="25" r="2.2" fill="var(--ink)"/>
  <path class="k1" d="M18 32 C21 35 27 35 30 32"/></svg>`;
const SHIP = `<svg viewBox="0 0 100 100" aria-hidden="true">
  <path d="M50 10 C64 24 68 44 64 66 L36 66 C32 44 36 24 50 10 Z" fill="var(--c-sky)"/>
  <path class="k" d="M50 10 C64 24 68 44 64 66 L36 66 C32 44 36 24 50 10 Z"/>
  <path class="k1" d="M44 40 C44 35 56 35 56 40 C56 45 44 45 44 40 Z"/>
  <path class="k" d="M36 52 L24 72 L37 66 M64 52 L76 72 L63 66"/>
  <path d="M43 70 C45 80 47 86 50 92 C53 86 55 80 57 70 Z" fill="var(--c-math)"/>
  <path class="k1" d="M43 70 C45 80 47 86 50 92 C53 86 55 80 57 70"/></svg>`;

function scrollEnd(node){ node.scrollIntoView({block:"end", behavior: reduced ? "auto" : "smooth"}); }

function figureNode(fig){
  const box = el("div", {class:"fig-box"});
  if (fig && fig.type === "svg" && DATA.figures[fig.src]){
    const s = svgEl(DATA.figures[fig.src]);
    s.removeAttribute("width"); s.removeAttribute("height");
    if (!reduced){
      s.querySelectorAll(".k,.k1").forEach(p => { if (!p.hasAttribute("stroke-dasharray")) p.setAttribute("pathLength","1"); else p.classList.remove("k","k1"); });
      s.classList.add("draw");
    }
    box.append(s);
  } else box.append(el("p", {class:"cap"}, "（这张图还没准备好）"));
  return box;
}

// ---------- 判分 ----------
function normNum(s){
  return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[．。]/g, ".").replace(/[－—]/g, "-").replace(/[，,\s]/g, "").replace(/[条对个本卷米厘次]+$/, "");
}
function parseNumber(s){
  const t = normNum(s); if (!/^-?\d+(\.\d+)?$/.test(t)) return null; return Number(t);
}
function parseFraction(s){
  const t = String(s).trim().replace(/／/g, "/").replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  let m = t.match(/^(\d+)\s*\/\s*(\d+)$/); if (m) return [Number(m[1]), Number(m[2])];
  m = t.match(/^(\d+)\s*分之\s*(\d+)$/); if (m) return [Number(m[2]), Number(m[1])];
  return null;
}
function grade(answer, input){
  // 返回 {ok, misconception, feedback} 或 null（写法认不出来，不算一次作答）
  if (answer.type === "choice"){
    const c = answer.choices.find(x => x.id === input);
    return {ok: !!c.correct, misconception: c.misconception || null, feedback: c.feedback || "", shown: c.text};
  }
  if (answer.type === "number"){
    const x = parseNumber(input); if (x === null) return null;
    const tol = answer.tolerance || 0, hit = v => Math.abs(x - v) <= tol + 1e-9;
    if (hit(answer.value)) return {ok:true, feedback:"", shown:String(x)};
    const w = (answer.common_wrong||[]).find(cw => hit(cw.value));
    return {ok:false, misconception: w && w.misconception || null, feedback: w && w.feedback || "", shown:String(x)};
  }
  if (answer.type === "fraction"){
    const f = parseFraction(input); if (!f) return null;
    const [a,b] = f; if (b === 0) return {ok:false, feedback:"", shown:`${a}/${b}`};
    const ok = answer.accept_equivalent ? a*answer.denominator === b*answer.numerator : (a === answer.numerator && b === answer.denominator);
    if (ok) return {ok:true, feedback:"", shown:`${a}/${b}`};
    const w = (answer.common_wrong||[]).find(cw => answer.accept_equivalent ? a*cw.denominator === b*cw.numerator : (a === cw.numerator && b === cw.denominator));
    return {ok:false, misconception: w && w.misconception || null, feedback: w && w.feedback || "", shown:`${a}/${b}`};
  }
  return null;
}
function answerText(answer){
  if (answer.type === "choice") return answer.choices.find(c => c.correct).text;
  if (answer.type === "number") return `${answer.value}${answer.unit ? " " + answer.unit : ""}`;
  if (answer.type === "fraction") return `${answer.numerator}/${answer.denominator}`;
  return "";
}

// ---------- 一道题（讲解里的小问题和挑战共用） ----------
// say(role, text)：role 是 nav / me / good / bad / hint
function askItem(host, item, say, onDone){
  const ans = item.answer, hints = item.hints || [];
  const rec = {stem:item.stem, tries:[], hints:0, result:null};
  let usedHints = 0, finished = false;
  const ctrl = el("div", {class:"ask"});
  let choiceBtns = [], numInput = null, okBtn = null;

  function finish(result){
    finished = true; rec.result = result;
    choiceBtns.forEach(b => b.disabled = true);
    if (numInput){ numInput.disabled = true; okBtn.disabled = true; }
    hintBtn.hidden = true;
    onDone(rec);
  }
  function submit(value, btn){
    if (finished) return;
    const g = grade(ans, value);
    if (!g){ say("nav", "写一个数字试试，比如 12。"); return; }
    rec.tries.push({shown:g.shown, ok:g.ok, misconception:g.misconception||null});
    if (ans.type !== "choice") say("me", g.shown + (ans.unit ? " " + ans.unit : ""));
    else say("me", g.shown);
    if (g.ok){
      if (btn) btn.classList.add("right");
      say("good", g.feedback ? "对了。" + g.feedback : "对了。");
      finish(rec.tries.length === 1 && usedHints === 0 ? "first" : "later");
    } else {
      if (btn){ btn.classList.add("wrong"); btn.disabled = true; }
      say("bad", g.feedback || "这个想法很多人都有。再想想看，也可以要个提示。");
      if (numInput){ numInput.select(); }
    }
  }

  if (ans.type === "choice"){
    const box = el("div", {class:"choices"});
    for (const c of ans.choices){
      const b = el("button", {class:"choice", type:"button", onclick:()=>submit(c.id, b)}, c.text);
      choiceBtns.push(b); box.append(b);
    }
    ctrl.append(box);
  } else {
    numInput = el("input", {type:"text", inputmode: ans.type === "number" ? "decimal" : "text", "aria-label":"写答案", autocomplete:"off",
      placeholder: ans.type === "fraction" ? "比如 1/4" : "写数字",
      onkeydown: e => { if (e.key === "Enter") submit(numInput.value); }});
    okBtn = el("button", {class:"btn", type:"button", onclick:()=>submit(numInput.value)}, "确定");
    ctrl.append(el("div", {class:"numrow"}, numInput, ans.unit ? el("span", {class:"unit"}, ans.unit) : null, okBtn));
  }
  const hintBtn = el("button", {class:"btn ghost", type:"button", onclick: () => {
    if (finished) return;
    if (usedHints < hints.length){
      say("hint", hints[usedHints]); usedHints++; rec.hints = usedHints;
      if (usedHints >= hints.length) hintBtn.textContent = "看答案";
    } else {
      say("nav", "答案是：" + answerText(ans) + "。");
      choiceBtns.forEach((b, i) => { if (ans.choices[i].correct) b.classList.add("right"); });
      if (numInput) numInput.value = answerText(ans).split(" ")[0];
      finish("revealed");
    }
  }}, hints.length ? "要个提示" : "看答案");
  ctrl.append(el("div", {class:"row-btns"}, hintBtn));
  host.append(ctrl);
  return rec;
}

// ---------- 页面 ----------
function setTop(title, showBack){
  document.getElementById("title").textContent = title;
  document.getElementById("back").hidden = !showBack;
}
function dock(...btns){ $dockIn.replaceChildren(...btns.filter(Boolean)); $dock.hidden = btns.filter(Boolean).length === 0; }
function nextAfter(a){ const i = ACTS.indexOf(a); return ACTS[i+1] || null; }
function endButtons(a){
  const n = nextAfter(a);
  return el("div", {class:"row-btns"},
    n ? el("button", {class:"btn", type:"button", onclick:()=>go("act:" + n.id)}, `${n.star !== a.star ? "下一颗星：" : "接着做"}${KIND[n.kind]}`) : null,
    el("button", {class:"btn ghost", type:"button", onclick:()=>go("home")}, "回星图"));
}

function viewHome(){
  setTop("好奇号", false); dock();
  const hero = el("div", {class:"hero"},
    el("div", {}, el("div", {class:"eyebrow"}, "好奇号 · 星座"), el("h1", {}, DATA.constellation),
      el("p", {}, "三颗星，按顺序飞：" + DATA.stars.map(s => s.title.split("：")[0]).join(" → ") + "。")),
    svgEl(SHIP));
  const line = el("div", {class:"line"});
  DATA.stars.forEach((st, i) => {
    const acts = el("div", {class:"acts"});
    for (const a of st.activities){
      const done = S.done[a.id];
      acts.append(el("button", {class:"act" + (done ? " done" : ""), type:"button", onclick:()=>go("act:" + a.id)},
        done ? el("span", {class:"tick"}, "✓") : null, KIND[a.kind], a.duration_min ? el("small", {}, `${a.duration_min} 分钟`) : null));
    }
    line.append(el("section", {class:"star"}, el("div", {class:"dot"}, i+1), el("h2", {}, st.title), el("div", {class:"dq"}, st.dq), acts));
  });
  $app.replaceChildren(hero, el("p", {class:"note"}, "这是试玩版：做过的不会保存，刷新页面就从头开始。"), line,
    el("button", {class:"parent", type:"button", onclick:()=>go("record")}, "试玩记录（给家长看）"));
}

function bubbleRow(role, content){
  const cls = {nav:"", hint:"hint", good:"good", bad:"bad"}[role];
  if (role === "me") return el("div", {class:"row me pop"}, el("div", {class:"bub"}, content));
  const bub = el("div", {class:"bub " + (cls||"")}, role === "hint" ? el("span", {class:"lbl"}, "提示") : null, content);
  return el("div", {class:"row pop"}, svgEl(AVA), bub);
}

function viewExplain(a){
  const log = S.log[a.id] = {kind:"explain", items:[], questions:[]};
  const chat = el("div", {class:"chat"});
  $app.replaceChildren(chat);
  const steps = a.body.steps; let i = 0;
  const say = (role, text) => { const r = bubbleRow(role, text); chat.append(r); scrollEnd(r); };
  const contBtn = el("button", {class:"btn", type:"button", onclick:()=>step()}, "继续");
  const qBtn = el("button", {class:"btn ghost", type:"button", onclick:()=>openAsk()}, "我有个问题");

  function openAsk(){
    if (chat.querySelector(".composer")) return;
    const ta = el("textarea", {maxlength:"120", placeholder:"想问领航员什么？"});
    const box = el("div", {class:"composer pop"}, ta, el("div", {class:"row-btns"},
      el("button", {class:"btn ghost", type:"button", onclick:()=>box.remove()}, "算了"),
      el("button", {class:"btn", type:"button", onclick:()=>{
        const q = ta.value.trim(); if (!q) return; box.remove();
        log.questions.push(q); say("me", q);
        say("nav", "好问题。我把它记在试玩记录里了，等会儿和家长一起找答案。");
      }}, "问领航员")));
    chat.append(box); scrollEnd(box); ta.focus();
  }
  function step(){
    if (i >= steps.length) return;
    const s = steps[i++];
    if (s.type === "text") say("nav", s.text);
    else if (s.type === "figure"){
      const r = el("div", {class:"row pop"}, svgEl(AVA), el("div", {class:"bub fig"}, figureNode(s.figure), s.caption ? el("div", {class:"cap"}, s.caption) : null));
      chat.append(r); scrollEnd(r);
    } else if (s.type === "check"){
      const bub = el("div", {class:"bub"}, el("div", {class:"stem"}, s.item.stem));
      const r = el("div", {class:"row pop"}, svgEl(AVA), bub); chat.append(r);
      dock(qBtn);
      const rec = askItem(bub, s.item, say, rec => { log.items.push(rec); afterStep(); });
      scrollEnd(r);
      return;
    }
    afterStep();
  }
  function afterStep(){
    if (i < steps.length){ dock(qBtn, contBtn); return; }
    S.done[a.id] = true; dock(qBtn);
    const card = el("div", {class:"endcard pop"}, el("h3", {}, "这一段讲完了"), endButtons(a));
    chat.append(card); scrollEnd(card);
  }
  step();
}

function shuffled(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function viewQuiz(a){
  const items = a.body.shuffle ? shuffled(a.body.items) : a.body.items.slice();
  const log = S.log[a.id] = {kind:"quiz", items:[]};
  let k = 0;
  function show(){
    dock();
    if (k >= items.length) return summary();
    const it = items[k];
    const prog = el("div", {class:"progress"}, ...items.map((_, j) => el("i", {class: j < k ? (log.items[j].result === "first" ? "ok" : "on") : (j === k ? "on" : "")})), el("span", {}, ` 第 ${k+1} 题，共 ${items.length} 题`));
    const fb = el("div", {class:"fb"});
    const card = el("div", {class:"qcard pop"}, el("div", {class:"stem"}, it.stem));
    if (it.figure) card.append(figureNode(it.figure));
    const say = (role, text) => {
      if (role === "me") return;
      const cls = {nav:"", hint:"hint", good:"good", bad:"bad"}[role];
      if (role !== "hint") fb.querySelectorAll(".bub:not(.hint)").forEach(n => n.remove());
      const b = el("div", {class:"bub pop " + cls}, role === "hint" ? el("span", {class:"lbl"}, "提示") : null, text);
      fb.append(b); scrollEnd(b);
    };
    $app.replaceChildren(prog, card);
    askItem(card, it, say, rec => {
      log.items.push(rec);
      dock(el("button", {class:"btn", type:"button", onclick:()=>{ k++; show(); window.scrollTo(0,0); }}, k + 1 < items.length ? "下一题" : "看看结果"));
    });
    card.append(fb);
  }
  function summary(){
    S.done[a.id] = true;
    const first = log.items.filter(r => r.result === "first").length;
    const card = el("div", {class:"endcard pop"},
      el("h3", {}, "挑战完成"),
      el("p", {}, `${items.length} 道题里，一次就答对 ${first} 道。` + (first < items.length ? "想岔的地方，正好看清楚了。" : "全部一次答对。")),
      endButtons(a));
    $app.replaceChildren(card);
  }
  show();
}

function viewReflection(a){
  const b = a.body, max = b.max_chars || 120;
  const log = S.log[a.id] = {kind:"reflection", text:""};
  const ta = el("textarea", {maxlength:String(max), placeholder:"想到什么就写什么。"});
  const counter = el("div", {class:"counter"}, `0 / ${max}`);
  const doneBtn = el("button", {class:"btn", type:"button", disabled:true}, "写好了");
  const upd = () => { counter.textContent = `${ta.value.length} / ${max}`; doneBtn.disabled = !ta.value.trim(); };
  ta.addEventListener("input", upd);
  const chips = el("div", {class:"chips"}, ...(b.starters||[]).map(s => el("button", {class:"chip", type:"button", onclick:()=>{
    const t = s.replace(/[…\.。]+$/, "");
    ta.value = (ta.value ? ta.value.replace(/\s*$/, "") + "\n" : "") + t; ta.focus(); upd();
  }}, s)));
  const chat = el("div", {class:"chat"});
  chat.append(bubbleRow("nav", b.prompt));
  const box = el("div", {class:"composer"}, b.starters && b.starters.length ? el("div", {class:"lbl muted", style:"font-size:13px;color:var(--muted)"}, "不知道怎么开头？点一个：") : null, chips, ta, counter, el("div", {class:"row-btns"}, doneBtn));
  doneBtn.addEventListener("click", () => {
    log.text = ta.value.trim(); S.done[a.id] = true;
    box.replaceWith(bubbleRow("me", log.text));
    const end = el("div", {class:"endcard pop"}, el("h3", {}, "记下来了"), el("p", {}, "家长可以在「试玩记录」里看到你写的话。"), endButtons(a));
    chat.append(bubbleRow("nav", "谢谢舰长。"), end); scrollEnd(end);
  });
  chat.append(box);
  $app.replaceChildren(chat);
}

function recordText(){
  const out = [`好奇号试玩记录 · ${DATA.constellation}`];
  for (const st of DATA.stars){
    out.push("", `【${st.title}】`);
    for (const a of st.activities){
      const L = S.log[a.id];
      out.push(`${KIND[a.kind]}：${S.done[a.id] ? "做完了" : (L ? "做到一半" : "没做")}`);
      if (!L) continue;
      (L.items||[]).forEach(r => {
        const res = r.result === "first" ? "一次答对" : r.result === "revealed" ? "看了答案" : `答错 ${r.tries.filter(t => !t.ok).length} 次后答对`;
        out.push(`  · ${r.stem}　${res}${r.hints ? `，用了 ${r.hints} 条提示` : ""}`);
        r.tries.filter(t => !t.ok).forEach(t => out.push(`      选了/写了「${t.shown}」${t.misconception ? `（误区：${st.misconceptions[t.misconception] || t.misconception}）` : ""}`));
      });
      (L.questions||[]).forEach(q => out.push(`  · 问了领航员：${q}`));
      if (L.text) out.push(`  · 写下：${L.text}`);
    }
  }
  return out.join("\n");
}
function viewRecord(){
  setTop("试玩记录", true); dock();
  const txt = recordText();
  const pre = el("pre", {}, txt);
  const msg = el("span", {class:"muted", style:"font-size:14px;color:var(--muted)"});
  const copy = el("button", {class:"btn", type:"button", onclick: async () => {
    try { await navigator.clipboard.writeText(txt); msg.textContent = "复制好了，可以粘贴发出去。"; }
    catch(e){ const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = "已经选中，长按或按 Ctrl+C 复制。"; }
  }}, "复制成文字");
  $app.replaceChildren(el("div", {class:"rec"},
    el("h2", {}, "这次试玩做了什么"),
    el("p", {class:"muted"}, "只记在这一页里，刷新就没了。试玩完可以复制下来，发给 Claude 当作试玩反馈。"),
    el("div", {class:"row-btns", style:"justify-content:flex-start"}, copy, msg), pre));
}

// 页面内切换，不用地址栏（托管网页里地址栏的 # 不一定传得进来）
let VIEW = "home";
function go(v){ VIEW = v; route(); }
function route(){
  window.scrollTo(0,0);
  const m = VIEW.match(/^act:(.+)$/);
  if (m){
    const a = actById(m[1]);
    if (a){
      setTop(`${KIND[a.kind]} · ${a.title}`, true);
      ({explain:viewExplain, quiz:viewQuiz, reflection:viewReflection})[a.kind](a);
      return;
    }
  }
  if (VIEW === "record") return viewRecord();
  viewHome();
}
document.getElementById("back").addEventListener("click", () => go("home"));
route();
</script>
