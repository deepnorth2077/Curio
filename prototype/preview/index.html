on readout2(){\n  const L = lenAt(geo(MODEL.fold.spools, MODEL.fold.loops, S.p2));\n  readout(`长 <b>${fmtLen(L)}<\/b> · 放大成乒乓球时 ${fmtLen(L * MODEL.scale)}`);\n  Host.state({ station: 2, length_m: +L.toFixed(5) });\n}\nfunction enter2(){\n  S.station = 2; S.mode = \"talk\"; head(2, \"盘成环\"); hint(\"\"); gStatic.innerHTML = staticCell() + nucleusSvg(0); render(); readout2();\n  say(`绕上线轴后短了约 ${MODEL.fold.spools} 倍，可还是比细胞核长得多。`);\n  next(\"怎么办？\", act2);\n}\nfunction act2(){\n  S.mode = \"act2\"; hint(\"把红点拖进细胞核\");\n  say(\"抓住红点，把这串小线轴拉进细胞核。它会自己一圈圈盘好。\");\n  actions([]); render(); svg.focus({ preventScroll: true });\n}\nfunction done2(){\n  S.mode = \"talk\"; S.done[2] = true; hint(\"\"); Host.event(\"observed\", { station: 2 }); render();\n  say(`收进去了，一点也不乱。一共短了约 ${fmtFold(MODEL.fold.loops)} 倍。`, \"good\");\n  next(\"继续\", () => {\n    say(\"细胞要读哪一段，就把那一段松开，读完再盘好。\");\n    next(\"继续\", () => {\n      S.wow = true; render();\n      say(`把细胞核放大成乒乓球，说明书拉直了约有 ${fmtLen(lenAt(1) * MODEL.scale)}，大人要走 ${Math.round(lenAt(1) * MODEL.scale / 1000 / MODEL.walkKmh)} 个小时。`);\n      next(\"继续\", () => {\n        say(`你刚才把它盘成了约 ${fmtLen(lenAt(MODEL.fold.loops) * MODEL.scale)}，收进了这个乒乓球。`);\n        next(\"去第 3 站\", enter3);\n      });\n    });\n  });\n}\n\n/* ============ 7. 第 3 站：卷紧、数一数、配对 ============ */\nconst ROD_W = 11, ROD_K = 88 / 249;   // 1 号长 88，其他按字母数等比例\nconst SLOT = { x0: 9, w: 34, base: 578 };\nfunction bandsOf(idx, len){\n  const r = Sk.R(300 + idx * 17), n = 2 + Math.round(len / 14), out = [];\n  for (let i = 0; i < n; i++) out.push([.08 + .84 * ((i + .2 + r() * .6) / n), 1.4 + r() * 3.2]);\n  return out;\n}\nconst RODS = [];\nfunction makeRods(){\n  RODS.length = 0;\n  const r = Sk.R(42), place = [];\n  // 这次的细胞来自一个男孩：1～22 号各两根，X 一根，Y 一根\n  const list = [];\n  MODEL.chr.forEach(([id, mb, c], idx) => {\n    const copies = id === \"X\" || id === \"Y\" ? 1 : 2;\n    for (let k = 0; k < copies; k++) list.push({ id, idx, mb, c, len: Math.max(14, mb * ROD_K), copy: k });\n  });\n  for (const rod of list){\n    // 在细胞核里找离别的短棒最远的位置（试 300 个候选，挑最空的那个）\n    let best = null, bestGap = -1e9;\n    for (let tries = 0; tries < 300; tries++){\n      const a = r() * Math.PI * 2, d = Math.sqrt(r()) * (NUC.r - 18 - rod.len / 2);\n      const x = NUC.x + Math.cos(a) * d, y = NUC.y + Math.sin(a) * d, ang = (r() - .5) * 150;\n      const gap = place.length ? Math.min(...place.map(q => Math.hypot(q.x - x, q.y - y) - (q.len + rod.len) * .5)) : 0;\n      if (gap > bestGap){ bestGap = gap; best = { x, y, ang }; }\n    }\n    place.push({ x: best.x, y: best.y, len: rod.len });\n    RODS.push(Object.assign(rod, { bands: bandsOf(rod.idx, rod.len), hx: best.x, hy: best.y, ha: best.ang,\n      x: best.x, y: best.y, a: best.ang, tx: best.x, ty: best.y, ta: best.ang, paired: false, from: null, shake: 0, n: 0 }));\n  }\n  // 编号用来「数一数」：从左上往右下\n  [...RODS].sort((u, v) => (u.hy - v.hy) || (u.hx - v.hx)).forEach((rod, i) => rod.n = i + 1);\n}\nfunction rodPath(len, c, w){\n  const h = (w || ROD_W) / 2, t = -len / 2, b = len / 2, yc = t + len * c;\n  if (len < 26 || yc - 4 < t + h || yc + 4 > b - h) return `M${-h} ${t + h}A${h} ${h} 0 0 1 ${h} ${t + h}L${h} ${b - h}A${h} ${h} 0 0 1 ${-h} ${b - h}Z`;\n  return `M${-h} ${t + h}A${h} ${h} 0 0 1 ${h} ${t + h}L${h} ${yc - 4}Q${h - 3} ${yc} ${h} ${yc + 4}L${h} ${b - h}A${h} ${h} 0 0 1 ${-h} ${b - h}L${-h} ${yc + 4}Q${-h + 3} ${yc} ${-h} ${yc - 4}Z`;\n}\nfunction rodSvg(rod, scale, extra){\n  const sc = scale == null ? 1 : scale, len = rod.len, W = rod.w || ROD_W, d = rodPath(len, rod.c, W);\n  const fill = rod.from === \"dad\" ? \"var(--dad)\" : rod.from === \"mom\" ? \"var(--mom)\" : \"var(--paper)\";\n  const op = rod.from ? .55 : .95, sel = S.sel === rod, cur = S.mode === \"pair\" && S.kbd && kbdRod() === rod;\n  const dx = rod.shake ? Math.sin(rod.shake * 40) * 4 * rod.shake : 0;\n  let s = `<g transform=\"translate(${(rod.x + dx).toFixed(1)} ${rod.y.toFixed(1)}) rotate(${rod.a.toFixed(1)}) scale(${sc.toFixed(3)})\"${extra || \"\"}>`;\n  if (sel) s += `<path d=\"${d}\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"7\" opacity=\".35\"/>`;\n  if (cur) s += `<path d=\"${d}\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"2\" stroke-dasharray=\"3 3\" transform=\"scale(1.5 1.15)\"/>`;\n  s += `<path d=\"${d}\" fill=\"${fill}\" fill-opacity=\"${op}\"/>`;\n  for (const [pos, w] of rod.bands){ const y = -len / 2 + len * pos; if (Math.abs(y) < len / 2 - 3) s += `<line x1=\"${-W/2 + 1}\" y1=\"${y.toFixed(1)}\" x2=\"${W/2 - 1}\" y2=\"${y.toFixed(1)}\" stroke=\"var(--ink)\" stroke-opacity=\".62\" stroke-width=\"${(w * W / ROD_W).toFixed(1)}\"/>`; }\n  s += `<path d=\"${d}\" fill=\"none\" stroke=\"${sel ? \"var(--accent)\" : \"var(--ink)\"}\" stroke-width=\"${sel ? 2.6 : 1.4}\" vector-effect=\"non-scaling-stroke\"/>`;\n  return s + \"<\/g>\";\n}\nfunction slotX(i){ return SLOT.x0 + SLOT.w / 2 + SLOT.w * i; }\nfunction slotsSvg(dy){\n  let s = \"\";\n  for (let i = 0; i < 23; i++){\n    const x = slotX(i), lab = i < 22 ? String(i + 1) : \"23\";\n    s += `<rect x=\"${x - 15}\" y=\"${SLOT.base - 92 + dy}\" width=\"30\" height=\"96\" rx=\"6\" fill=\"none\" stroke=\"var(--rule)\" stroke-dasharray=\"3 4\"/>` + T(x, SLOT.base + 19 + dy, lab, \"num\", 'text-anchor=\"middle\"');\n  }\n  return s;\n}\nfunction draw3(){\n  const p = S.p3;\n  let s = \"\";\n  if (S.mode !== \"pair\" && S.mode !== \"pairtalk\"){\n    s += fiberSvg(fiberPts(1), 1 - smooth(clamp(p * 1.4)), 1 - .55 * smooth(p));\n    for (const rod of RODS){\n      const g = smooth(clamp((p - .25) / .75));\n      if (g > 0) s += `<g opacity=\"${g.toFixed(2)}\">` + rodSvg(rod, .3 + .7 * g) + \"<\/g>\";\n      if (S.count >= rod.n) s += T((rod.x + 9).toFixed(0), (rod.y - 8).toFixed(0), rod.n, \"num\");\n    }\n  } else {\n    for (const rod of RODS) if (!rod.paired) s += rodSvg(rod);\n    for (const rod of RODS) if (rod.paired) s += rodSvg(rod);\n  }\n  return s;\n}\nfunction readout3(){\n  const L = lenAt(geo(MODEL.fold.loops, MODEL.fold.rods, S.p3));\n  if (S.mode === \"pair\" || S.mode === \"pairtalk\") readout(`配好 <b>${S.pairs}<\/b> / 23 对`);\n  else readout(`一共短了 <b>${fmtFold(geo(MODEL.fold.loops, MODEL.fold.rods, S.p3))}<\/b> 倍`);\n  Host.state({ station: 3, length_m: +L.toFixed(6), pairs: S.pairs });\n}\nfunction enter3(){\n  S.station = 3; S.mode = \"talk\"; head(3, \"卷紧、配对\"); hint(\"\"); makeRods();\n  gStatic.innerHTML = staticCell(); S.t3 = S.p3 = 0; render(); readout3();\n  say(\"细胞要分成两个了。说明书先抄一份，一个新细胞分一份。\");\n  next(\"继续\", () => { say(\"可是松松的线，分不清哪些给谁。\"); next(\"那怎么办？\", () => {\n    S.mode = \"act3\"; hint(\"按住「卷紧」\");\n    say(\"把它卷得更紧，卷成一根根小短棒。按住「卷紧」。\");\n    actions([{ label: \"按住 卷紧\", cls: \"hold\", hold: true, step: () => { S.t3 = clamp(S.t3 + .05); } }]);\n  }); });\n}\nfunction done3(){\n  S.mode = \"talk\"; hint(\"\"); Host.event(\"observed\", { station: 3 });\n  say(`卷成了一根根小短棒，一共短了约 ${fmtFold(MODEL.fold.rods)} 倍。`, \"good\");\n  next(\"继续\", () => { say(\"这样卷好的小短棒，就叫染色体。\"); next(\"继续\", () => ask(\"猜猜，一共有几根小短棒？\", [\n    { label: \"23 根\", feedback: \"23 是对数，一对有两根。我们数一数。\" },\n    { label: \"46 根\", correct: true, feedback: \"猜对了。我们数一数。\" },\n    { label: \"100 根\", feedback: \"比这少得多。我们数一数。\" }\n  ], () => next(\"数一数\", countUp))); });\n}\nfunction countUp(){\n  actions([]); hint(\"\");\n  const total = RODS.length;\n  const stepT = reduced ? 0 : 55;\n  let i = 0;\n  const go = () => { S.count = ++i; render(); if (i < total) setTimeout(go, stepT); else afterCount(); };\n  go();\n}\nfunction afterCount(){\n  say(`${RODS.length} 条染色体。科学家就是在这时候用显微镜数出来的。`);\n  next(\"继续\", () => {\n    say(`说明书本来就分成 ${RODS.length} 卷，每卷是完整的一根，不是剪断的。`);\n    next(\"继续\", () => { say(\"刚才为了看得清，我们只画了一根。\"); next(\"去配对台\", enterPair); });\n  });\n}\n// 窄屏（手机）配对时，画面只显示显微镜视野，相当于放大一倍\nfunction fitView(zoom){\n  const narrow = svg.clientWidth < 560;\n  svg.setAttribute(\"viewBox\", zoom && narrow ? `${NUC.x - NUC.r - 14} ${NUC.y - NUC.r - 14} ${2 * NUC.r + 28} ${2 * NUC.r + 28}` : \"0 0 800 610\");\n}\naddEventListener(\"resize\", () => { if (S.mode === \"pair\") fitView(true); });\nfunction hitR(){ const vb = svg.viewBox.baseVal; return Math.max(26, 24 * vb.width / Math.max(1, svg.clientWidth)); }\nfunction kbdList(){ return RODS.filter(r => !r.paired).sort((u, v) => u.n - v.n); }\nfunction kbdRod(){ const l = kbdList(); return l.length ? l[((S.kcur % l.length) + l.length) % l.length] : null; }\nfunction enterPair(){\n  S.mode = \"pair\"; S.count = 0; S.pairs = 0; S.sel = null; S.tries = 0; head(3, \"配对台\"); fitView(true);\n  gStatic.innerHTML = `<circle cx=\"${NUC.x}\" cy=\"${NUC.y}\" r=\"${NUC.r + 8}\" fill=\"var(--sky)\" opacity=\".25\"/>` + P(Sk.ellipse(NUC.x, NUC.y, NUC.r + 8, NUC.r + 8, 17), \"k1\") + slotsSvg(0);\n  hint(\"点一根，再点它的另一半\");\n  say(\"46 条两两成对。点一根，再点和它一样长、条纹也一样的那根。\");\n  actions([]); render(); readout3(); svg.focus({ preventScroll: true });\n}\nfunction pairUp(a, b, auto){\n  const slot = a.id === \"X\" || a.id === \"Y\" ? 22 : a.idx;\n  const dadFirst = a.id === \"X\" || a.id === \"Y\" ? a.id === \"Y\" : Sk.R(900 + a.idx)() < .5;\n  // 第 23 对：男孩的 X 来自妈妈，Y 来自爸爸\n  const [L, R2] = a.id === \"Y\" ? [b, a] : a.id === \"X\" ? [a, b] : [a, b];\n  const x = slotX(slot);\n  L.tx = x - 6.5; R2.tx = x + 6.5;\n  for (const r of [L, R2]){ r.ty = SLOT.base - r.len / 2; r.ta = 0; r.paired = true; }\n  if (slot === 22){ L.from = null; R2.from = null; }\n  else { L.from = dadFirst ? \"dad\" : \"mom\"; R2.from = dadFirst ? \"mom\" : \"dad\"; }\n  S.pairs++; S.sel = null;\n  readout3();\n}\nfunction tapRod(rod){\n  if (S.mode !== \"pair\" || rod.paired) return;\n  if (!S.sel){ S.sel = rod; render(); return; }\n  if (S.sel === rod){ S.sel = null; render(); return; }\n  const a = S.sel, b = rod;\n  const sex = (a.id === \"X\" || a.id === \"Y\") && (b.id === \"X\" || b.id === \"Y\");\n  if (a.id === b.id){\n    pairUp(a, b);\n    if (S.pairs === 1) say(\"配上了！蓝的那根来自爸爸，红的那根来自妈妈。每一对都是这样。\", \"good\");\n    else say(`${a.id} 号配好了。`, \"good\");\n    if (S.pairs === 3) helpButton();\n    checkLeft();\n  } else if (sex && !RODS.every(r => r.paired || r.id === \"X\" || r.id === \"Y\")){\n    a.shake = b.shake = 1; S.sel = null;\n    say(\"这两根有点特别，留到最后。先把别的配好。\", \"bad\");\n  } else if (sex){\n    pairUp(a, b);\n    say(\"这两根长短不一样，可它们也是一对！\", \"good\");\n    afterSexPair();\n  } else {\n    a.shake = b.shake = 1; S.sel = null; S.tries++;\n    const ratio = Math.min(a.len, b.len) / Math.max(a.len, b.len);\n    say(ratio < .88 ? \"这两根长短不一样，再找找。\" : \"长短差不多，再看看条纹。\", \"bad\");\n  }\n  render();\n}\nfunction helpButton(){\n  actions([{ label: \"剩下的让领航员帮忙\", cls: \"ghost\", go: autoPair }]);\n}\nfunction autoPair(){\n  actions([]);\n  const left = () => MODEL.chr.slice(0, 22).map(c => c[0]).find(id => RODS.some(r => r.id === id && !r.paired));\n  const go = () => {\n    if (S.mode !== \"pair\") return;\n    const id = left(); if (!id){ checkLeft(); return; }\n    const two = RODS.filter(r => r.id === id && !r.paired); pairUp(two[0], two[1], true); render();\n    setTimeout(go, reduced ? 0 : 140);\n  };\n  say(\"好，我来帮你排。\");\n  go();\n}\nfunction checkLeft(){\n  const rest = RODS.filter(r => !r.paired);\n  if (rest.length === 2 && rest.every(r => r.id === \"X\" || r.id === \"Y\")){\n    actions([]);\n    say(\"只剩最后两根了。它们一样长吗？点一根，再点另一根。\");\n  }\n}\nfunction afterSexPair(){\n  if (S.pairs !== 23) return;\n  S.mode = \"pairtalk\"; actions([]); fitView(false);\n  Host.event(\"answered\", { station: 3, item: \"pairing\", correct: true, tries: S.tries });\n  setTimeout(() => {\n    say(\"23 对都配好了。科学家也是这样排的。\");\n    next(\"看看第 23 对\", enter4);\n  }, reduced ? 0 : 700);\n}\n\n/* ============ 8. 第 4 站：第 23 对 ============ */\nfunction draw4(){\n  const X = MODEL.chr[22][1], Y = MODEL.chr[23][1], k = 250 / X;\n  const big = (x, mb, c, from, lab, idx) => {\n    const rod = { len: mb * k, w: 26, c, bands: bandsOf(idx, mb * k * .35).map(([p, w]) => [p, w * 1.6]), from, x, y: 430 - mb * k / 2, a: 0, shake: 0 };\n    return rodSvg(rod) + T(x, 466, lab, \"t\", 'text-anchor=\"middle\"');\n  };\n  let s = \"\";\n  const panel = (x0, title, o) => `<g opacity=\"${o}\"><rect x=\"${x0}\" y=\"60\" width=\"330\" height=\"430\" rx=\"16\" fill=\"var(--pane)\" stroke=\"var(--rule)\"/>` + T(x0 + 165, 96, title, \"t\", 'text-anchor=\"middle\"') + \"<\/g>\";\n  s += panel(45, \"这个细胞（男孩）\", 1);\n  s += big(170, X, MODEL.chr[22][2], S.boyReveal ? \"mom\" : null, \"X\", 22) + big(250, Y, MODEL.chr[23][2], S.boyReveal ? \"dad\" : null, \"Y\", 23);\n  if (S.girl){\n    s += panel(425, \"女孩的细胞\", 1);\n    s += big(550, X, MODEL.chr[22][2], \"dad\", \"X\", 22) + big(630, X, MODEL.chr[22][2], \"mom\", \"X\", 22);\n  }\n  if (S.boyReveal) s += `<rect x=\"250\" y=\"532\" width=\"22\" height=\"14\" rx=\"3\" fill=\"var(--dad)\" opacity=\".6\"/>` + T(280, 545, \"来自爸爸\", \"tm\") +\n    `<rect x=\"410\" y=\"532\" width=\"22\" height=\"14\" rx=\"3\" fill=\"var(--mom)\" opacity=\".6\"/>` + T(440, 545, \"来自妈妈\", \"tm\");\n  return s;\n}\nfunction enter4(){\n  fitView(false); S.station = 4; S.mode = \"talk\"; head(4, \"第 23 对\"); hint(\"\"); gStatic.innerHTML = \"\"; readout(`X：${fmtLetters(MODEL.chr[22][1])}个字母 · Y：${fmtLetters(MODEL.chr[23][1])}个`); render();\n  say(\"第 23 对的两根不一样长：长的叫 X 染色体，短的叫 Y 染色体。\");\n  next(\"继续\", () => { say(\"这个细胞来自一个男孩。男孩的第 23 对一般是 X 和 Y。\"); next(\"继续\", () => ask(\"男孩的 Y 染色体，是从谁那里来的？\", [\n    { label: \"爸爸\", correct: true, feedback: \"对。妈妈只有 X，没有 Y 可以给。Y 来自爸爸，X 来自妈妈。\" },\n    { label: \"妈妈\", mis: \"y-from-mother\", feedback: \"很多人这么想。可妈妈只有 X，没有 Y 可以给，Y 来自爸爸。\" }\n  ], o => { S.boyReveal = true; render();\n    next(\"那女孩呢？\", () => { S.girl = true; render(); say(\"女孩的第 23 对一般是两根 X，一根来自爸爸，一根来自妈妈。\");\n      next(\"继续\", () => { say(\"在染色体上，男孩和女孩一般只差在这一对。\"); next(\"看我的星卡\", enterEnd); }); }); }, \"answered\")); });\n}\n\n/* ============ 9. 结尾：星卡 ============ */\nfunction drawEnd(){\n  let s = `<rect x=\"30\" y=\"20\" width=\"740\" height=\"570\" rx=\"20\" fill=\"var(--pane)\" stroke=\"var(--rule)\"/>` +\n    `<path d=\"M712 44l7 14 15 2-11 11 3 15-14-7-14 7 3-15-11-11 15-2z\" fill=\"var(--accent)\" opacity=\".85\"/>` +\n    T(60, 76, \"舰长的染色体图\", \"t ttl\") +\n    \"\";\n  // 按固定排版摆：第 i 对在第 i 格，左边那根、右边那根；不依赖配对时的动画位置\n  const dy = -290;\n  for (let i = 0; i < 23; i++) s += T(slotX(i), SLOT.base + 19 + dy, i < 22 ? i + 1 : \"23\", \"num\", 'text-anchor=\"middle\"');\n  for (const rod of RODS){\n    const slot = rod.id === \"X\" || rod.id === \"Y\" ? 22 : rod.idx;\n    const left = rod.id === \"X\" || (rod.id !== \"Y\" && rod.copy === 0);\n    const from = rod.id === \"X\" ? \"mom\" : rod.id === \"Y\" ? \"dad\" : (rod.from || (left ? \"dad\" : \"mom\"));\n    s += rodSvg(Object.assign({}, rod, { x: slotX(slot) + (left ? -6.5 : 6.5), y: SLOT.base + dy - rod.len / 2, a: 0, shake: 0, from }));\n  }\n  const stat = (x, big, small) => T(x, 372, big, \"t big\", 'text-anchor=\"middle\"') + T(x, 404, small, \"tm\", 'text-anchor=\"middle\"');\n  s += stat(150, `约 ${fmtWan(MODEL.spools)}`, \"小线轴\") + stat(400, `约 ${fmtFold(MODEL.fold.rods)} 倍`, \"一共短了\") + stat(650, \"23 对\", \"亲手配好\");\n  // 「哇」：21 号和 22 号放大 6 倍并排，配一把尺子\n  const k3 = ROD_K * 6, r21 = RODS.find(r => r.id === \"21\"), r22 = RODS.find(r => r.id === \"22\"), base = 560;\n  s += P(Sk.line(60, 432, 740, 432, 77), \"k1\");\n  for (let i = 0; i <= 6; i++){ const y = base - i * 20; s += P(Sk.line(300, y, 312, y, 120 + i), \"k1\"); }\n  s += P(Sk.line(306, base, 306, base - 120, 119), \"k1\");\n  for (const [r, x, lab] of [[r21, 350, \"21 号\"], [r22, 420, \"22 号\"]]){\n    const len = r.mb * k3;\n    s += rodSvg(Object.assign({}, r, { len, w: 24, x, y: base - len / 2, a: 0, shake: 0, from: null, bands: bandsOf(r.idx, len) })) + T(x, base + 26, lab, \"tm\", 'text-anchor=\"middle\"');\n  }\n  s += T(470, 486, \"21 号\", \"t\") + T(470, 512, \"比 22 号还短\", \"t\");\n  return s;\n}\nfunction enterEnd(){\n  S.station = 5; S.mode = \"end\"; head(0, \"我的染色体图\"); hint(\"\"); readout(\"\"); gStatic.innerHTML = \"\"; render();\n  say(\"这是你亲手排好的染色体图。你把 2 米长的说明书收进了细胞核。\", \"good\");\n  next(\"继续\", () => {\n    say(`你发现了吗？21 号其实比 22 号还短：${fmtLetters(MODEL.chr[20][1])}对 ${fmtLetters(MODEL.chr[21][1])}个字母。`);\n    next(\"为什么？\", () => { say(\"编号是很久以前按显微镜下的样子排的，那时看走了眼。\");\n      next(\"再玩一次\", () => { Object.assign(S, { t1: 0, p1: 0, t2: 0, p2: 0, t3: 0, p3: 0, count: 0, done: {}, pairs: 0, sel: null, boyReveal: false, girl: false, theta: -Math.PI/2, round: S.round + 1, tries: 0, wow: false }); enter1(); }, \"ghost\"); });\n  });\n  // 只在第一轮告诉平台「做完了」，再玩不重复记\n  if (S.round === 1){ Host.event(\"observed\", { station: 4 }); Host.complete({}); }\n}\n\n/* ============ 10. 画面和输入 ============ */\nfunction render(){\n  svg.style.touchAction = /^act|^pair$/.test(S.mode) ? \"none\" : \"pan-y\";   // 只在要拖动、点选时锁住页面滚动\n  gDyn.innerHTML = S.station === 1 ? draw1() : S.station === 2 ? (nucleusOverlay() + draw2()) : S.station === 3 ? (nucleusOverlay() + draw3()) : S.station === 4 ? draw4() : drawEnd();\n}\nfunction nucleusOverlay(){\n  if (S.station === 2) return \"\";\n  if (S.mode === \"pair\" || S.mode === \"pairtalk\") return \"\";\n  return nucleusSvg(smooth(clamp(S.p3 * 1.2)));\n}\nfunction toSvg(e){\n  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;\n  return pt.matrixTransform(svg.getScreenCTM().inverse());\n}\nlet drag = null;\nsvg.addEventListener(\"pointerdown\", e => {\n  const q = toSvg(e);\n  if (S.mode === \"act1\" && Math.hypot(q.x - REEL.x, q.y - REEL.y) < 130){\n    drag = { kind: \"crank\", last: Math.atan2(q.y - REEL.y, q.x - REEL.x) };\n  } else if (S.mode === \"act2\"){\n    const kq = fiberPts(S.p2)[KNOB_I];\n    if (Math.hypot(q.x - kq[0], q.y - kq[1]) < 70) drag = { kind: \"pull\", x0: q.x, p0: S.t2 };\n  } else if (S.mode === \"pair\"){\n    let best = null, bd = 1e9;\n    for (const rod of RODS){\n      if (rod.paired) continue;\n      const a = rod.a * Math.PI / 180, ux = -Math.sin(a), uy = Math.cos(a);\n      const t = clamp(((q.x - rod.x) * ux + (q.y - rod.y) * uy) / (rod.len / 2), -1, 1) * rod.len / 2;\n      const d = Math.hypot(q.x - (rod.x + ux * t), q.y - (rod.y + uy * t));\n      if (d < bd){ bd = d; best = rod; }\n    }\n    if (best && bd < hitR()){ S.kbd = false; tapRod(best); }\n  }\n  if (drag){ svg.setPointerCapture(e.pointerId); e.preventDefault(); }\n});\nsvg.addEventListener(\"pointermove\", e => {\n  if (!drag) return;\n  const q = toSvg(e);\n  if (drag.kind === \"crank\"){\n    const ang = Math.atan2(q.y - REEL.y, q.x - REEL.x);\n    let d = ang - drag.last; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;\n    drag.last = ang; S.theta = ang; S.t1 = clamp(S.t1 + Math.abs(d) / (2 * Math.PI * 5));\n  } else if (drag.kind === \"pull\"){\n    S.t2 = clamp(drag.p0 + (drag.x0 - q.x) / 330);\n  }\n});\nfor (const ev of [\"pointerup\", \"pointercancel\"]) svg.addEventListener(ev, () => { drag = null; });\nsvg.addEventListener(\"keydown\", e => {\n  const k = e.key;\n  if (S.mode === \"act1\" && /Arrow|Enter| /.test(k)){ e.preventDefault(); S.t1 = clamp(S.t1 + .04); S.theta += .5; }\n  if (S.mode === \"act2\" && /Arrow|Enter| /.test(k)){ e.preventDefault(); S.t2 = clamp(S.t2 + .05); }\n  if (S.mode === \"act3\" && /Arrow|Enter| /.test(k)){ e.preventDefault(); S.t3 = clamp(S.t3 + .05); }\n  if (S.mode === \"pair\" && /Arrow|Enter| /.test(k)){\n    // 键盘：方向键在没配的短棒之间移动，回车或空格选中\n    e.preventDefault(); S.kbd = true;\n    if (/Right|Down/.test(k)) S.kcur++;\n    else if (/Left|Up/.test(k)) S.kcur--;\n    else { const r = kbdRod(); if (r) tapRod(r); }\n    const r = kbdRod(); if (r) hint(`第 ${r.n} 根，长 ${fmtLetters(r.mb)}个字母。回车选中`);\n    render();\n  }\n});\n\nlet last = performance.now();\nfunction tick(now){\n  const dt = Math.min(.05, (now - last) / 1000); last = now;\n  let dirty = false;\n  if (S.hold){\n    if (S.mode === \"act1\"){ S.t1 = clamp(S.t1 + dt * .16); S.theta += dt * 5; dirty = true; }\n    if (S.mode === \"act3\"){ S.t3 = clamp(S.t3 + dt * .22); }\n  }\n  const k = reduced ? 1 : <script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const KIND = {simulation:"动手探索", explain:"讲解", quiz:"挑战", reflection:"反思"};
const hasSim = st => st.activities.some(a => a.kind === "simulation");
const kindLabel = (a, st) => a.kind === "explain" && hasSim(st) ? "旧版讲解" : KIND[a.kind];
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $app = document.getElementById("app"), $dock = document.getElementById("dock"), $dockIn = document.getElementById("dockIn");

// 这一页里的试玩记录，只放在内存里，刷新就没了
const S = {done:{}, log:{}};

const ACTS = [];   // 按顺序排好的全部活动
for (const st of DATA.stars) for (const a of st.activities) ACTS.push({...a, star:st});
const actById = id => ACTS.find(a => a.id === id);

function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
function svgEl(markup){
  const t = document.createElement("template"); t.innerHTML = markup.trim(); return t.content.firstElementChild;
}

const AVA = `<svg class="ava" viewBox="0 0 48 48" aria-hidden="true">
  <circle cx="24" cy="27" r="16" fill="var(--c-sky)"/>
  <path class="k" d="M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z"/>
  <path class="k1" d="M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5"/>
  <circle cx="18.5" cy="25" r="2.2" fill="var(--ink)"/><circle cx="29.5" cy="25" r="2.2" fill="var(--ink)"/>
  <path class="k1" d="M18 32 C21 35 27 35 30 32"/></svg>`;
const SHIP = `<svg viewBox="0 0 100 100" aria-hidden="true">
  <path d="M50 10 C64 24 68 44 64 66 L36 66 C32 44 36 24 50 10 Z" fill="var(--c-sky)"/>
  <path class="k" d="M50 10 C64 24 68 44 64 66 L36 66 C32 44 36 24 50 10 Z"/>
  <path class="k1" d="M44 40 C44 35 56 35 56 40 C56 45 44 45 44 40 Z"/>
  <path class="k" d="M36 52 L24 72 L37 66 M64 52 L76 72 L63 66"/>
  <path d="M43 70 C45 80 47 86 50 92 C53 86 55 80 57 70 Z" fill="var(--c-math)"/>
  <path class="k1" d="M43 70 C45 80 47 86 50 92 C53 86 55 80 57 70"/></svg>`;

function scrollEnd(node){ node.scrollIntoView({block:"end", behavior: reduced ? "auto" : "smooth"}); }

function figureNode(fig){
  const box = el("div", {class:"fig-box"});
  if (fig && fig.type === "svg" && DATA.figures[fig.src]){
    const s = svgEl(DATA.figures[fig.src]);
    s.removeAttribute("width"); s.removeAttribute("height");
    if (!reduced){
      s.querySelectorAll(".k,.k1").forEach(p => { if (!p.hasAttribute("stroke-dasharray")) p.setAttribute("pathLength","1"); else p.classList.remove("k","k1"); });
      s.classList.add("draw");
    }
    box.append(s);
  } else box.append(el("p", {class:"cap"}, "（这张图还没准备好）"));
  return box;
}

// ---------- 判分 ----------
function normNum(s){
  return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[．。]/g, ".").replace(/[－—]/g, "-").replace(/[，,\s]/g, "").replace(/[条对个本卷米厘次]+$/, "");
}
function parseNumber(s){
  const t = normNum(s); if (!/^-?\d+(\.\d+)?$/.test(t)) return null; return Number(t);
}
function parseFraction(s){
  const t = String(s).trim().replace(/／/g, "/").replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  let m = t.match(/^(\d+)\s*\/\s*(\d+)$/); if (m) return [Number(m[1]), Number(m[2])];
  m = t.match(/^(\d+)\s*分之\s*(\d+)$/); if (m) return [Number(m[2]), Number(m[1])];
  return null;
}
function grade(answer, input){
  // 返回 {ok, misconception, feedback} 或 null（写法认不出来，不算一次作答）
  if (answer.type === "choice"){
    const c = answer.choices.find(x => x.id === input);
    return {ok: !!c.correct, misconception: c.misconception || null, feedback: c.feedback || "", shown: c.text};
  }
  if (answer.type === "number"){
    const x = parseNumber(input); if (x === null) return null;
    const tol = answer.tolerance || 0, hit = v => Math.abs(x - v) <= tol + 1e-9;
    if (hit(answer.value)) return {ok:true, feedback:"", shown:String(x)};
    const w = (answer.common_wrong||[]).find(cw => hit(cw.value));
    return {ok:false, misconception: w && w.misconception || null, feedback: w && w.feedback || "", shown:String(x)};
  }
  if (answer.type === "fraction"){
    const f = parseFraction(input); if (!f) return null;
    const [a,b] = f; if (b === 0) return {ok:false, feedback:"", shown:`${a}/${b}`};
    const ok = answer.accept_equivalent ? a*answer.denominator === b*answer.numerator : (a === answer.numerator && b === answer.denominator);
    if (ok) return {ok:true, feedback:"", shown:`${a}/${b}`};
    const w = (answer.common_wrong||[]).find(cw => answer.accept_equivalent ? a*cw.denominator === b*cw.numerator : (a === cw.numerator && b === cw.denominator));
    return {ok:false, misconception: w && w.misconception || null, feedback: w && w.feedback || "", shown:`${a}/${b}`};
  }
  return null;
}
function answerText(answer){
  if (answer.type === "choice") return answer.choices.find(c => c.correct).text;
  if (answer.type === "number") return `${answer.value}${answer.unit ? " " + answer.unit : ""}`;
  if (answer.type === "fraction") return `${answer.numerator}/${answer.denominator}`;
  return "";
}

// ---------- 一道题（讲解里的小问题和挑战共用） ----------
// say(role, text)：role 是 nav / me / good / bad / hint
function askItem(host, item, say, onDone){
  const ans = item.answer, hints = item.hints || [];
  const rec = {stem:item.stem, tries:[], hints:0, result:null};
  let usedHints = 0, finished = false;
  const ctrl = el("div", {class:"ask"});
  let choiceBtns = [], numInput = null, okBtn = null;

  function finish(result){
    finished = true; rec.result = result;
    choiceBtns.forEach(b => b.disabled = true);
    if (numInput){ numInput.disabled = true; okBtn.disabled = true; }
    hintBtn.hidden = true;
    onDone(rec);
  }
  function submit(value, btn){
    if (finished) return;
    const g = grade(ans, value);
    if (!g){ say("nav", "写一个数字试试，比如 12。"); return; }
    rec.tries.push({shown:g.shown, ok:g.ok, misconception:g.misconception||null});
    if (ans.type !== "choice") say("me", g.shown + (ans.unit ? " " + ans.unit : ""));
    else say("me", g.shown);
    if (g.ok){
      if (btn) btn.classList.add("right");
      say("good", g.feedback ? "对了。" + g.feedback : "对了。");
      finish(rec.tries.length === 1 && usedHints === 0 ? "first" : "later");
    } else {
      if (btn){ btn.classList.add("wrong"); btn.disabled = true; }
      say("bad", g.feedback || "这个想法很多人都有。再想想看，也可以要个提示。");
      if (numInput){ numInput.select(); }
    }
  }

  if (ans.type === "choice"){
    const box = el("div", {class:"choices"});
    for (const c of ans.choices){
      const b = el("button", {class:"choice", type:"button", onclick:()=>submit(c.id, b)}, c.text);
      choiceBtns.push(b); box.append(b);
    }
    ctrl.append(box);
  } else {
    numInput = el("input", {type:"text", inputmode: ans.type === "number" ? "decimal" : "text", "aria-label":"写答案", autocomplete:"off",
      placeholder: ans.type === "fraction" ? "比如 1/4" : "写数字",
      onkeydown: e => { if (e.key === "Enter") submit(numInput.value); }});
    okBtn = el("button", {class:"btn", type:"button", onclick:()=>submit(numInput.value)}, "确定");
    ctrl.append(el("div", {class:"numrow"}, numInput, ans.unit ? el("span", {class:"unit"}, ans.unit) : null, okBtn));
  }
  const hintBtn = el("button", {class:"btn ghost", type:"button", onclick: () => {
    if (finished) return;
    if (usedHints < hints.length){
      say("hint", hints[usedHints]); usedHints++; rec.hints = usedHints;
      if (usedHints >= hints.length) hintBtn.textContent = "看答案";
    } else {
      say("nav", "答案是：" + answerText(ans) + "。");
      choiceBtns.forEach((b, i) => { if (ans.choices[i].correct) b.classList.add("right"); });
      if (numInput) numInput.value = answerText(ans).split(" ")[0];
      finish("revealed");
    }
  }}, hints.length ? "要个提示" : "看答案");
  ctrl.append(el("div", {class:"row-btns"}, hintBtn));
  host.append(ctrl);
  return rec;
}

// ---------- 页面 ----------
function setTop(title, showBack){
  document.getElementById("title").textContent = title;
  document.getElementById("back").hidden = !showBack;
}
function dock(...btns){ $dockIn.replaceChildren(...btns.filter(Boolean)); $dock.hidden = btns.filter(Boolean).length === 0; }
function nextAfter(a){ const i = ACTS.indexOf(a); return ACTS[i+1] || null; }
function endButtons(a){
  const n = nextAfter(a);
  return el("div", {class:"row-btns"},
    n ? el("button", {class:"btn", type:"button", onclick:()=>go("act:" + n.id)}, `${n.star !== a.star ? "下一颗星：" : "接着做"}${kindLabel(n, n.star)}`) : null,
    el("button", {class:"btn ghost", type:"button", onclick:()=>go("home")}, "回星图"));
}

function viewHome(){
  setTop("Curio", false); dock();
  const hero = el("div", {class:"hero"},
    el("div", {}, el("div", {class:"eyebrow"}, "Curio · 星座"), el("h1", {}, DATA.constellation),
      el("p", {}, "三颗星，按顺序飞：" + DATA.stars.map(s => s.title.split("：")[0]).join(" → ") + "。")),
    svgEl(SHIP));
  const line = el("div", {class:"line"});
  DATA.stars.forEach((st, i) => {
    const acts = el("div", {class:"acts"});
    for (const a of st.activities){
      const done = S.done[a.id];
      acts.append(el("button", {class:"act" + (done ? " done" : "") + (a.kind === "simulation" ? " sim" : ""), type:"button", onclick:()=>go("act:" + a.id)},
        done ? el("span", {class:"tick"}, "✓") : null, kindLabel(a, st), a.kind === "simulation" ? el("small", {class:"new"}, "新") : null, a.duration_min ? el("small", {}, `${a.duration_min} 分钟`) : null));
    }
    line.append(el("section", {class:"star"}, el("div", {class:"dot"}, i+1), el("h2", {}, st.title), el("div", {class:"dq"}, st.dq), acts));
  });
  $app.replaceChildren(hero, el("p", {class:"note"}, "这是试玩版：做过的不会保存，刷新页面就从头开始。"), line,
    el("button", {class:"parent", type:"button", onclick:()=>go("record")}, "试玩记录（给家长看）"));
}

function bubbleRow(role, content){
  const cls = {nav:"", hint:"hint", good:"good", bad:"bad"}[role];
  if (role === "me") return el("div", {class:"row me pop"}, el("div", {class:"bub"}, content));
  const bub = el("div", {class:"bub " + (cls||"")}, role === "hint" ? el("span", {class:"lbl"}, "提示") : null, content);
  return el("div", {class:"row pop"}, svgEl(AVA), bub);
}

function viewExplain(a){
  const log = S.log[a.id] = {kind:"explain", items:[], questions:[]};
  const chat = el("div", {class:"chat"});
  $app.replaceChildren(chat);
  const steps = a.body.steps; let i = 0;
  const say = (role, text) => { const r = bubbleRow(role, text); chat.append(r); scrollEnd(r); };
  const contBtn = el("button", {class:"btn", type:"button", onclick:()=>step()}, "继续");
  const qBtn = el("button", {class:"btn ghost", type:"button", onclick:()=>openAsk()}, "我有个问题");

  function openAsk(){
    if (chat.querySelector(".composer")) return;
    const ta = el("textarea", {maxlength:"120", placeholder:"想问领航员什么？"});
    const box = el("div", {class:"composer pop"}, ta, el("div", {class:"row-btns"},
      el("button", {class:"btn ghost", type:"button", onclick:()=>box.remove()}, "算了"),
      el("button", {class:"btn", type:"button", onclick:()=>{
        const q = ta.value.trim(); if (!q) return; box.remove();
        log.questions.push(q); say("me", q);
        say("nav", "好问题。我把它记在试玩记录里了，等会儿和家长一起找答案。");
      }}, "问领航员")));
    chat.append(box); scrollEnd(box); ta.focus();
  }
  function step(){
    if (i >= steps.length) return;
    const s = steps[i++];
    if (s.type === "text") say("nav", s.text);
    else if (s.type === "figure"){
      const r = el("div", {class:"row pop"}, svgEl(AVA), el("div", {class:"bub fig"}, figureNode(s.figure), s.caption ? el("div", {class:"cap"}, s.caption) : null));
      chat.append(r); scrollEnd(r);
    } else if (s.type === "check"){
      const bub = el("div", {class:"bub"}, el("div", {class:"stem"}, s.item.stem));
      const r = el("div", {class:"row pop"}, svgEl(AVA), bub); chat.append(r);
      dock(qBtn);
      const rec = askItem(bub, s.item, say, rec => { log.items.push(rec); afterStep(); });
      scrollEnd(r);
      return;
    }
    afterStep();
  }
  function afterStep(){
    if (i < steps.length){ dock(qBtn, contBtn); return; }
    S.done[a.id] = true; dock(qBtn);
    const card = el("div", {class:"endcard pop"}, el("h3", {}, "这一段讲完了"), endButtons(a));
    chat.append(card); scrollEnd(card);
  }
  step();
}

function shuffled(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function viewQuiz(a){
  const items = a.body.shuffle ? shuffled(a.body.items) : a.body.items.slice();
  const log = S.log[a.id] = {kind:"quiz", items:[]};
  let k = 0;
  function show(){
    dock();
    if (k >= items.length) return summary();
    const it = items[k];
    const prog = el("div", {class:"progress"}, ...items.map((_, j) => el("i", {class: j < k ? (log.items[j].result === "first" ? "ok" : "on") : (j === k ? "on" : "")})), el("span", {}, ` 第 ${k+1} 题，共 ${items.length} 题`));
    const fb = el("div", {class:"fb"});
    const card = el("div", {class:"qcard pop"}, el("div", {class:"stem"}, it.stem));
    if (it.figure) card.append(figureNode(it.figure));
    const say = (role, text) => {
      if (role === "me") return;
      const cls = {nav:"", hint:"hint", good:"good", bad:"bad"}[role];
      if (role !== "hint") fb.querySelectorAll(".bub:not(.hint)").forEach(n => n.remove());
      const b = el("div", {class:"bub pop " + cls}, role === "hint" ? el("span", {class:"lbl"}, "提示") : null, text);
      fb.append(b); scrollEnd(b);
    };
    $app.replaceChildren(prog, card);
    askItem(card, it, say, rec => {
      log.items.push(rec);
      dock(el("button", {class:"btn", type:"button", onclick:()=>{ k++; show(); window.scrollTo(0,0); }}, k + 1 < items.length ? "下一题" : "看看结果"));
    });
    card.append(fb);
  }
  function summary(){
    S.done[a.id] = true;
    const first = log.items.filter(r => r.result === "first").length;
    const card = el("div", {class:"endcard pop"},
      el("h3", {}, "挑战完成"),
      el("p", {}, `${items.length} 道题里，一次就答对 ${first} 道。` + (first < items.length ? "想岔的地方，正好看清楚了。" : "全部一次答对。")),
      endButtons(a));
    $app.replaceChildren(card);
  }
  show();
}

function viewReflection(a){
  const b = a.body, max = b.max_chars || 120;
  const log = S.log[a.id] = {kind:"reflection", text:""};
  const ta = el("textarea", {maxlength:String(max), placeholder:"想到什么就写什么。"});
  const counter = el("div", {class:"counter"}, `0 / ${max}`);
  const doneBtn = el("button", {class:"btn", type:"button", disabled:true}, "写好了");
  const upd = () => { counter.textContent = `${ta.value.length} / ${max}`; doneBtn.disabled = !ta.value.trim(); };
  ta.addEventListener("input", upd);
  const chips = el("div", {class:"chips"}, ...(b.starters||[]).map(s => el("button", {class:"chip", type:"button", onclick:()=>{
    const t = s.replace(/[…\.。]+$/, "");
    ta.value = (ta.value ? ta.value.replace(/\s*$/, "") + "\n" : "") + t; ta.focus(); upd();
  }}, s)));
  const chat = el("div", {class:"chat"});
  chat.append(bubbleRow("nav", b.prompt));
  const box = el("div", {class:"composer"}, b.starters && b.starters.length ? el("div", {class:"lbl muted", style:"font-size:13px;color:var(--muted)"}, "不知道怎么开头？点一个：") : null, chips, ta, counter, el("div", {class:"row-btns"}, doneBtn));
  doneBtn.addEventListener("click", () => {
    log.text = ta.value.trim(); S.done[a.id] = true;
    box.replaceWith(bubbleRow("me", log.text));
    const end = el("div", {class:"endcard pop"}, el("h3", {}, "记下来了"), el("p", {}, "家长可以在「试玩记录」里看到你写的话。"), endButtons(a));
    chat.append(bubbleRow("nav", "谢谢舰长。"), end); scrollEnd(end);
  });
  chat.append(box);
  $app.replaceChildren(chat);
}

// 动手探索：沙箱 iframe + activity/1.1 契约
let simListener = null;
function viewSim(a){
  const log = S.log[a.id] = {kind:"simulation", events:[], questions:[]};
  dock();
  const frame = el("iframe", {class:"simframe", sandbox:"allow-scripts", title:a.title});
  frame.srcdoc = a.html;
  const end = el("div", {});
  if (simListener) removeEventListener("message", simListener);
  simListener = e => {
    if (e.source !== frame.contentWindow) return;
    const m = e.data; if (!m || m.contract !== "activity/1.1") return;
    const p = m.payload || {};
    const post = (type, payload) => frame.contentWindow.postMessage({contract:"activity/1.1", type, payload}, "*");
    if (m.type === "ready") post("init", {age_band:a.age_band || "G3-4", lang:"zh-CN", phase:"observe", palette:{}, mastery:null});
    else if (m.type === "resize" && p.h) frame.style.height = Math.max(600, Math.ceil(p.h) + 8) + "px";
    else if (m.type === "event") log.events.push(p);
    else if (m.type === "note_question" && p.text) log.questions.push(p.text);
    else if (m.type === "complete"){ S.done[a.id] = true; end.replaceChildren(el("div", {class:"endcard pop"}, el("h3", {}, "这一段做完了"), endButtons(a))); }
  };
  addEventListener("message", simListener);
  $app.replaceChildren(frame, end);
}

function recordText(){
  const out = [`Curio 试玩记录 · ${DATA.constellation}`];
  for (const st of DATA.stars){
    out.push("", `【${st.title}】`);
    for (const a of st.activities){
      const L = S.log[a.id];
      out.push(`${kindLabel(a, st)}：${S.done[a.id] ? "做完了" : (L ? "做到一半" : "没做")}`);
      if (!L) continue;
      (L.items||[]).forEach(r => {
        const res = r.result === "first" ? "一次答对" : r.result === "revealed" ? "看了答案" : `答错 ${r.tries.filter(t => !t.ok).length} 次后答对`;
        out.push(`  · ${r.stem}　${res}${r.hints ? `，用了 ${r.hints} 条提示` : ""}`);
        r.tries.filter(t => !t.ok).forEach(t => out.push(`      选了/写了「${t.shown}」${t.misconception ? `（误区：${st.misconceptions[t.misconception] || t.misconception}）` : ""}`));
      });
      (L.events||[]).filter(ev => ev.verb === "predicted" || ev.verb === "answered").forEach(ev => {
        const r = ev.result || {};
        if (r.item === "pair-try" || (r.item || "").startsWith("pair-")) return;
        out.push(`  · 第 ${r.station || "?"} 站${ev.verb === "predicted" ? "猜测" : "回答"}：${r.correct ? "对" : "错"}${r.misconception ? `（误区：${st.misconceptions[r.misconception] || r.misconception}）` : ""}`);
      });
      const tries = (L.events||[]).filter(ev => ev.verb === "answered" && (ev.result || {}).item === "pair-try").length;
      if (tries) out.push(`  · 配对时配错 ${tries} 次`);
      (L.questions||[]).forEach(q => out.push(`  · 问了领航员：${q}`));
      if (L.text) out.push(`  · 写下：${L.text}`);
    }
  }
  return out.join("\n");
}
function viewRecord(){
  setTop("试玩记录", true); dock();
  const txt = recordText();
  const pre = el("pre", {}, txt);
  const msg = el("span", {class:"muted", style:"font-size:14px;color:var(--muted)"});
  const copy = el("button", {class:"btn", type:"button", onclick: async () => {
    try { await navigator.clipboard.writeText(txt); msg.textContent = "复制好了，可以粘贴发出去。"; }
    catch(e){ const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = "已经选中，长按或按 Ctrl+C 复制。"; }
  }}, "复制成文字");
  $app.replaceChildren(el("div", {class:"rec"},
    el("h2", {}, "这次试玩做了什么"),
    el("p", {class:"muted"}, "只记在这一页里，刷新就没了。试玩完可以复制下来，发给 Claude 当作试玩反馈。"),
    el("div", {class:"row-btns", style:"justify-content:flex-start"}, copy, msg), pre));
}

// 页面内切换，不用地址栏（托管网页里地址栏的 # 不一定传得进来）
let VIEW = "home";
function go(v){ VIEW = v; route(); }
function route(){
  window.scrollTo(0,0);
  const m = VIEW.match(/^act:(.+)$/);
  if (m){
    const a = actById(m[1]);
    if (a){
      setTop(`${kindLabel(a, a.star)} · ${a.title}`, true);
      if (simListener && a.kind !== "simulation"){ removeEventListener("message", simListener); simListener = null; }
      ({simulation:viewSim, explain:viewExplain, quiz:viewQuiz, reflection:viewReflection})[a.kind](a);
      return;
    }
  }
  if (VIEW === "record") return viewRecord();
  viewHome();
}
document.getElementById("back").addEventListener("click", () => go("home"));
route();
</script>
