<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curio · 试玩版 · 生命的说明书</title>
<style>
:root{
  --bg:#F5F4EE; --pane:#FBFAF6; --side:#EFEDE5; --hover:#E7E4D9; --rule:#E0DCD0;
  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;
  --accent:#C2603F; --accent-soft:#F3E0D6; --on-accent:#FFFFFF;
  --c-math:#ECCDB6; --c-sci:#CCD6C0; --c-sci-2:#93A982; --c-sci-bg:#DCE3D2;
  --c-sky:#CFDCE6; --wash:#EFE4D6; --dad:#4F7FA8; --mom:#C2603F;
  --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;
  --shadow:0 1px 2px rgba(31,30,28,.06),0 8px 28px rgba(31,30,28,.08);
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-hand:"ZCOOL KuaiLe","Kaiti SC","STKaiti","KaiTi","Noto Sans SC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1E1E1E; --pane:#252525; --side:#1B1B1B; --hover:#2E2E2E; --rule:#353535;
  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;
  --accent:#A797F7; --accent-soft:#2D2943; --on-accent:#15121F;
  --c-math:#5A4536; --c-sci:#3C4836; --c-sci-2:#6F8560; --c-sci-bg:#28301F;
  --c-sky:#2D3B47; --wash:#2A2738; --dad:#7FA9CF; --mom:#E0876A;
  --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 120px}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.topbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 18px;min-height:56px}
.topbar .title{flex:1;font-family:var(--f-serif);font-weight:600;color:var(--ink);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:1px solid var(--rule);background:var(--pane);border-radius:10px;padding:6px 12px;font-size:15px}
.tag{font-size:12px;color:var(--muted);border:1px dashed var(--rule);border-radius:999px;padding:1px 9px;white-space:nowrap}
h1,h2,h3{font-family:var(--f-serif);color:var(--ink);line-height:1.35;margin:0}
.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* 首页 */
.hero{margin:22px 0 8px;padding:22px;border-radius:18px;background:var(--c-sci-bg);display:flex;gap:16px;align-items:center}
.hero .eyebrow{font-size:13px;color:var(--muted);letter-spacing:.05em}
.hero h1{font-size:28px;margin:4px 0 6px}
.hero p{margin:0}
.hero svg{flex:none;width:96px;height:96px}
.note{font-size:14px;color:var(--muted);margin:10px 2px 18px}
.line{position:relative;padding-left:34px}
.line:before{content:"";position:absolute;left:13px;top:18px;bottom:18px;border-left:2px dashed var(--c-sci-2)}
.star{position:relative;background:var(--pane);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;margin:0 0 16px;box-shadow:var(--shadow)}
.star .dot{position:absolute;left:-34px;top:16px;width:28px;height:28px;border-radius:50%;background:var(--c-sci);border:2px solid var(--ink);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink)}
.star h2{font-size:20px}
.star .dq{font-family:var(--f-hand);color:var(--ink);font-size:18px;margin:6px 0 12px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.act{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--bg);border-radius:12px;padding:9px 14px;min-height:48px;font-size:16px}
.act:hover{background:var(--hover)}
.act small{color:var(--muted);font-size:13px}
.act.done{background:var(--good-soft);border-color:var(--good)}
.act .tick{color:var(--good);font-weight:700}
.act small.new{color:var(--accent);font-weight:700}
.act.sim{border-color:var(--accent);border-width:2px}
.simframe{display:block;width:100%;border:0;min-height:600px;background:transparent;margin-top:8px}
.parent{display:block;margin:26px auto 0;border:1px dashed var(--rule);background:transparent;border-radius:12px;padding:10px 16px;color:var(--muted);font-size:15px}

/* 领航员对话 */
.chat{padding:18px 0 8px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:flex-end}
.row.me{justify-content:flex-end}
.ava{flex:none;width:40px;height:40px}
.bub{max-width:min(560px,82%);background:var(--pane);border:1px solid var(--rule);border-radius:16px 16px 16px 4px;padding:10px 14px;color:var(--ink);box-shadow:var(--shadow)}
.row.me .bub{background:var(--accent-soft);border-color:transparent;border-radius:16px 16px 4px 16px}
.bub.hint{background:var(--c-sky);border-color:transparent}
.bub.good{background:var(--good-soft);border-color:transparent}
.bub.bad{background:var(--bad-soft);border-color:transparent}
.bub .lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.bub.fig{max-width:min(620px,88%);padding:10px}
.fig-box{background:var(--bg);border-radius:12px;padding:6px}
.fig-box svg{display:block;width:100%;height:auto;max-height:52vh}
.fig-box [fill="#CCD6C0" i]{fill:var(--c-sci)} .fig-box [fill="#CFDCE6" i]{fill:var(--c-sky)}
.fig-box [fill="#ECCDB6" i]{fill:var(--c-math)} .fig-box [fill="#EFE4D6" i]{fill:var(--wash)}
.fig-box [fill="#4F7FA8" i]{fill:var(--dad)} .fig-box [fill="#C2603F" i]{fill:var(--mom)}
.fig-box [stroke="#4F7FA8" i]{stroke:var(--dad)} .fig-box [stroke="#C2603F" i]{stroke:var(--mom)}
.fig-box [stroke="#1F1E1C" i]{stroke:var(--ink)} .fig-box text{fill:var(--ink)}
.cap{font-size:15px;color:var(--text);margin:8px 4px 2px}
.ask{margin-top:4px}
.ask .stem{font-weight:600}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choice{text-align:left;border:1.5px solid var(--ink);background:var(--bg);border-radius:12px;padding:10px 14px;min-height:48px;font-size:17px}
.choice:hover:not(:disabled){background:var(--hover)}
.choice:disabled{cursor:default}
.choice.wrong{border-color:var(--bad);color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.choice.right{border-color:var(--good);background:var(--good-soft);font-weight:600}
.numrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.numrow input{width:130px;font:inherit;font-size:20px;padding:8px 12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink)}
.numrow .unit{font-size:18px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 18px;min-height:48px;font-size:17px;font-weight:600}
.btn.ghost{background:var(--pane);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 26%);padding:26px 0 calc(14px + env(safe-area-inset-bottom,0))}
.dock .in{max-width:760px;margin:0 auto;padding:0 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.composer{background:var(--pane);border:1px solid var(--rule);border-radius:16px;padding:12px;box-shadow:var(--shadow);margin:6px 0}
textarea{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical;min-height:96px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px dashed var(--ink);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:16px;min-height:40px}
.row-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.endcard{background:var(--c-sci-bg);border-radius:16px;padding:18px;margin:16px 0}
.endcard h3{font-size:19px;margin-bottom:6px}
.endcard .row-btns{justify-content:flex-start}

/* 挑战 */
.qcard{background:var(--pane);border:1px solid var(--rule);border-radius:18px;padding:18px;margin-top:18px;box-shadow:var(--shadow)}
.progress{display:flex;gap:6px;margin:18px 0 0;align-items:center;color:var(--muted);font-size:14px}
.progress i{display:inline-block;width:20px;height:8px;border-radius:4px;background:var(--rule)}
.progress i.on{background:var(--ink)} .progress i.ok{background:var(--good)}
.qcard .stem{font-size:19px;font-weight:600;color:var(--ink)}
.fb{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.fb .bub{max-width:100%}
.counter{font-size:13px;color:var(--muted);text-align:right}

/* 记录 */
.rec h2{font-size:20px;margin:22px 0 8px}
.rec h3{font-size:17px;margin:14px 0 6px}
.rec ul{margin:4px 0;padding-left:20px}
.rec .muted{color:var(--muted)}
.rec pre{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--pane);border:1px solid var(--rule);border-radius:12px;padding:12px}

@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .28s ease-out both}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .draw .k,.draw .k1{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
}
@media (max-width:520px){
  body{font-size:16px}
  .hero{padding:16px} .hero h1{font-size:24px} .hero svg{width:72px;height:72px}
  .bub{max-width:86%}
}
</style>
</head>

join=\"round\" class=\"k1\"/>\n  <path d=\"M166 115 C177 112 188 114 204 115 M196 108 L204 115 L196 122 M374 115 C384 112 394 114 410 115 M402 108 L410 115 L402 122\" fill=\"none\" stroke=\"#1F1E1C\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"k\"/>\n  <text x=\"100\" y=\"222\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1F1E1C\">年轻红细胞<\/text>\n  <text x=\"285\" y=\"222\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1F1E1C\">推出细胞核<\/text>\n  <text x=\"490\" y=\"222\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1F1E1C\">成熟红细胞<\/text>\n<\/svg>"}, "stars": [{"activities": [{"age_band": "G3-4", "duration_min": 12, "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>显微镜下的小房间<\/title>\n<style>\n:root{\n  --bg:#F5F4EE; --pane:#FBFAF6; --rule:#E0DCD0; --hover:#E7E4D9;\n  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;\n  --accent:#C2603F; --accent-soft:#F3E0D6;\n  --sage:#CCD6C0; --sage-bg:#DCE3D2; --sky:#CFDCE6; --apricot:#ECCDB6; --paper:#EFE4D6;\n  --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;\n  --f-serif:\"Noto Serif SC\",\"Source Han Serif SC\",\"Songti SC\",Georgia,serif;\n  --f-sans:\"Noto Sans SC\",\"PingFang SC\",\"Microsoft YaHei\",system-ui,sans-serif;\n  --f-mono:ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n  color-scheme:light;\n}\n@media (prefers-color-scheme:dark){:root{\n  --bg:#1E1E1E; --pane:#252525; --rule:#353535; --hover:#2E2E2E;\n  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;\n  --accent:#E0876A; --accent-soft:#3A2A24;\n  --sage:#3C4836; --sage-bg:#28301F; --sky:#2D3B47; --apricot:#5A4536; --paper:#33302A;\n  --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;\n  color-scheme:dark;\n}}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}\nbutton{font:inherit;color:inherit;cursor:pointer}\n.wrap{max-width:820px;margin:0 auto;padding:12px 14px 28px}\n.card{background:var(--pane);border:1px solid var(--rule);border-radius:18px;overflow:hidden}\n.card header,.card footer{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 16px}\n.card header{border-bottom:1px solid var(--rule)}\n.card footer{border-top:1px solid var(--rule);min-height:44px;align-items:center;flex-wrap:wrap}\n.station{font-size:13px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}\nh1{font-family:var(--f-serif);font-size:20px;font-weight:600;color:var(--ink);margin:0;text-align:right}\n.hint{font-size:14px;color:var(--muted);flex:1 1 auto}\n.readout{white-space:nowrap;margin-left:auto;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px;text-align:right}\n.readout b{color:var(--accent);font-weight:600}\n/* 画面占了大半屏：允许上下滑动页面；转旋钮、拖玻片、拖红点时在 touchstart 里拦下滚动 */\nsvg#stage{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}\nsvg#stage:focus{outline:none}\nbody.kbd svg#stage:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}\n.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}\n.kf{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:3 6}\n.thread{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}\n/* SVG 里的字号只在这里定：写在元素属性上的 font-size 会被这里盖掉。手机上统一放大 */\n.t{fill:var(--ink);font-family:var(--f-sans);font-size:16px}\n.tm{fill:var(--muted);font-family:var(--f-sans);font-size:15px}\n.num{fill:var(--ink);font-family:var(--f-mono);font-size:16px}\n.lab{fill:var(--ink);font-family:var(--f-sans);font-size:19px}\n.ttl{fill:var(--ink);font-family:var(--f-serif);font-size:26px}\n.big{fill:var(--ink);font-family:var(--f-serif);font-size:30px}\n.cnt{fill:var(--ink);font-family:var(--f-mono);font-size:40px}\n.huge{fill:var(--ink);font-family:var(--f-serif);font-size:84px}\n.c-cheek{fill:var(--paper);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}\n.c-onion{fill:var(--sage);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}\n.c-rbc{fill:var(--apricot);stroke:var(--ink);stroke-width:1.2}\n.dimple{fill:none;stroke:var(--ink);stroke-width:1;stroke-opacity:.35}\n.c-hero{fill:var(--accent);fill-opacity:.26;stroke:var(--accent);stroke-width:2.6;stroke-linejoin:round}\n.nuc{fill:var(--ink);fill-opacity:.55}\n.talk{display:flex;gap:10px;align-items:flex-start;margin:14px 2px 6px}\n.ava{flex:none;width:42px;height:42px}\n.bubble{background:var(--pane);border:1px solid var(--rule);border-radius:16px 16px 16px 4px;padding:10px 14px;color:var(--ink);min-height:44px;flex:1}\n.bubble.good{background:var(--good-soft);border-color:transparent}\n.bubble.bad{background:var(--bad-soft);border-color:transparent}\n.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin:10px 0 0}\n.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 18px;min-height:48px;font-size:17px;font-weight:600;touch-action:manipulation}\n.btn.ghost{background:var(--pane);color:var(--ink)}\n.btn.choice{background:var(--bg);color:var(--ink);font-weight:500;text-align:left;flex:1 1 220px}\n.btn.choice:hover{background:var(--hover)}\n.btn.hold{background:var(--accent);border-color:var(--accent);color:#fff;touch-action:none;-webkit-touch-callout:none}\n.btn.hold.on{filter:brightness(.9)}\n.btn:disabled{opacity:.4;cursor:default}\n.btn.small{min-height:40px;font-size:15px;padding:6px 14px;font-weight:500}\n.qbox{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}\n.qbox textarea{flex:1 1 260px;font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);min-height:64px}\n@media (max-width:520px){ body{font-size:16px} h1{font-size:17px} .card header,.card footer{padding:8px 12px}\n  .t{font-size:22px} .tm{font-size:22px} .num{font-size:22px} .lab{font-size:24px} .ttl{font-size:32px} .big{font-size:34px} .cnt{font-size:40px} .huge{font-size:72px} }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <header><span class=\"station\" id=\"station\">第 1 站 · 共 4 站<\/span><h1 id=\"title\">放大<\/h1><\/header>\n    <svg id=\"stage\" viewBox=\"0 0 800 610\" tabindex=\"0\" role=\"application\" aria-label=\"动手区\">\n      <defs><clipPath id=\"vclip\"><circle id=\"vclipc\" cx=\"285\" cy=\"272\" r=\"210\"/><\/clipPath><\/defs>\n      <g id=\"static\"><\/g><g id=\"dyn\"><\/g>\n      <!-- 一直不重绘的透明触摸层：手指按下的目标不会被 innerHTML 换掉，touchstart 才能到 svg、拦下滚动 -->\n      <rect id=\"hit\" x=\"0\" y=\"0\" width=\"800\" height=\"610\" fill=\"transparent\"/>\n    <\/svg>\n    <footer><span class=\"hint\" id=\"hint\"><\/span><span class=\"readout\" id=\"readout\"><\/span><\/footer>\n  <\/div>\n  <div class=\"talk\">\n    <svg class=\"ava\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n      <circle cx=\"24\" cy=\"27\" r=\"16\" fill=\"var(--sky)\"/>\n      <path class=\"k\" d=\"M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z\"/>\n      <path class=\"k1\" d=\"M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5\"/>\n      <circle cx=\"18.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/><circle cx=\"29.5\" cy=\"25\" r=\"2.2\" fill=\"var(--ink)\"/>\n      <path class=\"k1\" d=\"M18 32 C21 35 27 35 30 32\"/>\n    <\/svg>\n    <div class=\"bubble\" id=\"say\" aria-live=\"polite\"><\/div>\n  <\/div>\n  <div class=\"actions\" id=\"actions\"><\/div>\n  <div id=\"qarea\"><\/div>\n<\/div>\n\n<script>\n\"use strict\";\n/* ============ 1. 真相模型：页面上的每个数字都从这里算 ============\n   出处在 2026-11-06 / 11-07 用网络核对，见右边注释。 */\nconst MODEL = {\n  bodyCells: 3.72e13,   // 人体约 3.72×10¹³ 个细胞。Bianconi E 等 2013, Annals of Human Biology 40(6):463–471, doi:10.3109/03014460.2013.807878\n                        //   核对：BioNumbers BNID 109716 引同一篇，3.7×10¹³ ± 0.8×10¹³\n  rbcCells: 2.5e13,     // 红细胞约 2.5×10¹³ 个：Sender R, Fuchs S, Milo R 2016, PLoS Biol 14(8):e1002533——约 3.0×10¹³ 个人体细胞里红细胞占 84%\n                        //   核对：BioNumbers BNID 113005「The cell count is dominated by red blood cells (84%)」\n  earthKm: 40075,       // 地球赤道一圈约 40075 公里（NASA Earth Fact Sheet：赤道半径 6378 千米 × 2π）\n  hookeYear: 1665,      // 胡克《Micrographia》1665：看软木塞，一格格小空格像修道院的小房间，叫 cell（拉丁文 cella = 小房间）\n                        //   注意：软木塞的细胞已经死了，胡克看到的是空的格子壁。页面只说「小空格」\n  eyeMm: 0.1,           // 人眼能分辨的最小约 0.1 毫米。James Madison University 显微镜中心 resolution.pdf\n                        //   页面不说「比 0.1 毫米小就看不见」（一根 0.07 毫米的头发明明看得见），只说「又小、又挤在一起，眼睛就分不清」\n  hairMm: 0.07,         // 一根头发约 0.05～0.1 毫米，取 0.07。The Physics Factbook（扫描电镜实测 0.06～0.08 毫米）\n  cheekMm: 0.06,        // 口腔上皮细胞：扁平、边缘不规则，约 0.05～0.07 毫米，取 0.06。\n                        //   样本：人教版初中生物学七年级上册（2024 年版）第一单元第二章第三节「动物细胞」的实验「观察人的口腔上皮细胞」\n                        //   （和知识点卡 sources 一致；2024 年版原文没在网上查到全文，这个实验从 2012 年版起一直保留）。\n                        //   取样是用消毒牙签/棉签在口腔内侧轻刮，滴碘液染色后细胞核最清楚。\n                        //   「低倍镜可观察到边缘不规则的扁平细胞」：仪器信息网 口腔上皮细胞装片制作 instrument.com.cn/suppliers/SH103540/news_683844.html\n                        //   大小：Hande AH & Chaudhary MS 2010, Romanian Journal of Morphology and Embryology 51(3)：正常人颊黏膜细胞直径 72.9 ± 5.3 微米（取的是最长径）；\n                        //   中学资料多写 50～60 微米。取 0.06 毫米，页面写「约 0.06 毫米」。这些是口腔里表层的活细胞，有细胞核（和手背最外层的死细胞不同）\n  rbcMm: 0.0075,        // 红细胞直径 7～8 微米，双凹的圆饼；人成熟的红细胞没有细胞核（人教版七上；life-manual）\n  onionMm: 0.25,        // 洋葱表皮细胞约 0.2～0.4 毫米长，取 0.25。docbrown.info microscopy-3（约 200 微米）；Wayne's Word Lab Exercise 1（0.25～0.4 毫米）\n  onionWideMm: 0.05,    // 只用来画长砖的宽，页面上不显示这个数\n  neuronM: 1,           // 最长的神经细胞从脊髓下端伸到大脚趾，可以超过 1 米。Guinness World Records「Longest cell」。页面说「1 米多」\n  fov0Mm: 40,           // 画法约定（不是事实）：放大 1 倍时，视野圆圈当作 4 厘米宽，放大 m 倍就是 40/m 毫米。\n                        //   真的学生显微镜（目镜 10×、视场数约 18 毫米）同样倍数下视野约宽 4.5 倍，细胞看起来更小。页面上由领航员说明「飞船上的倍数简化过」\n  maxMag: 400,\n  target: { cheek: 100, onion: 40, blood: 400 }   // 每种样本放大到几倍算「看清了」：在这套约定下，细胞约占视野的 1/7～1/13\n};\nMODEL.divisions = Math.round(Math.log2(MODEL.bodyCells));   // 45：log2(3.72×10¹³) ≈ 45.1\nMODEL.cellsAfter = Math.pow(2, MODEL.divisions);            // 2^45 ≈ 35.2 万亿（算术，假设每次全部分成两个）\nMODEL.rbcLineKm = MODEL.rbcCells * MODEL.rbcMm / 1e6;       // 红细胞一个挨一个排成一排：2.5×10¹³ × 0.0075 毫米 ≈ 18.75 万公里\nMODEL.earthLoops = MODEL.rbcLineKm / MODEL.earthKm;         // ≈ 4.68 圈 →「4 圈多」\nMODEL.onionVsCheek = Math.floor(MODEL.onionMm / MODEL.cheekMm);                     // 4：0.25 / 0.06 ≈ 4.2 →「4 倍多」\nMODEL.neuronVsRbcWan = Math.floor(MODEL.neuronM * 1000 / MODEL.rbcMm / 1e4);        // 13：1 米 ÷ 0.0075 毫米 ≈ 13.3 万倍\nMODEL.cheekNearHair = Math.abs(MODEL.cheekMm / MODEL.hairMm - 1) < .25;             // 0.06 / 0.07 ≈ 0.86 →「差不多粗」\nconst magOf = z => Math.pow(MODEL.maxMag, z);\nconst zOf = m => Math.log(m) / Math.log(MODEL.maxMag);\nconst trim = s => String(s).replace(/\\.0+$/, \"\").replace(/(\\.\\d*?)0+$/, \"$1\");\nfunction fmtMm(mm){\n  if (mm >= 10) return trim((mm / 10).toFixed(mm >= 100 ? 0 : 1)) + \" 厘米\";\n  if (mm >= 1) return trim(mm.toFixed(mm >= 9.95 ? 0 : 1)) + \" 毫米\";\n  return String(+mm.toPrecision(2)) + \" 毫米\";\n}\nconst fmtMag = m => String(Math.max(1, Math.round(m)));\n// 用法：`${fmtCount(n)}个`——数和「万」之间空一格，「万」和量词之间不空\nfunction fmtCount(n){\n  const u = (v, w) => (v < 10 ? trim(v.toFixed(1)) : String(Math.round(v))) + \" \" + w;\n  if (n < 1e4) return String(Math.round(n));\n  if (n < 1e8) return u(n / 1e4, \"万\");\n  if (n < 1e12) return u(n / 1e8, \"亿\");\n  return u(n / 1e12, \"万亿\");\n}\n\n/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩） ============ */\nconst Host = (() => {\n  const h = {}, inFrame = window.parent !== window;\n  addEventListener(\"message\", e => { const m = e.data; if (m && m.contract === \"activity/1.1\" && h[m.type]) h[m.type](m.payload || {}); });\n  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: \"activity/1.1\", type, payload: payload || {} }, \"*\"); };\n  if (window.ResizeObserver) new ResizeObserver(() => send(\"resize\", { h: document.documentElement.scrollHeight })).observe(document.body);\n  return { on: (k, f) => { h[k] = f; }, ready: () => send(\"ready\"), event: (verb, result) => send(\"event\", { verb, result }),\n    state: o => send(\"state\", o), noteQuestion: text => send(\"note_question\", { text }), complete: r => send(\"complete\", r || {}) };\n})();\nHost.on(\"init\", p => {\n  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty(\"--\" + k, v);\n});\n// 事件只在第一轮发；同一件事只发一次（key 去重）。「再玩一次」不再发 predicted、observed、complete\nlet ROUND = 1;\nconst SENT = new Set();\nfunction emit(verb, result, key){\n  if (ROUND > 1) return;\n  if (key){ if (SENT.has(key)) return; SENT.add(key); }\n  Host.event(verb, result);\n}\n\n/* ============ 3. 手绘线条（平台的 sketchLib） ============ */\nfunction sketchLib(){\n  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };\n  const f=n=>Math.round(n*10)/10;\n  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;\n    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];\n      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }\n    return d; }\n  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;\n    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;\n    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }\n  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];\n    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }\n    return cr(p,false); }\n  function blob(cx,cy,rx,ry,seed){ const r=R(seed), N=9, p=[]; for(let i=0;i<N;i++){ const t=i/N*Math.PI*2, k=1+(r()-.5)*.1; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); } return cr(p,true)+\"Z\"; }\n  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }\n  return {line,ellipse,blob,curve,cr,R};\n}\nconst Sk = sketchLib();\nfunction ring(cx, cy, r, seed, j){   // 大圆：一笔画圈，末尾稍稍搭过头\n  const rnd = Sk.R(seed), N = 28, a0 = rnd() * Math.PI * 2, over = .03 + rnd() * .03, p = [];\n  j = j == null ? 1 : j;\n  for (let i = 0; i <= N; i++){ const t = a0 + i / N * Math.PI * 2 * (1 + over), k = 1 + (rnd() - .5) * .012 * j; p.push([cx + Math.cos(t) * r * k, cy + Math.sin(t) * r * k]); }\n  return Sk.cr(p, false);\n}\nconst P = (d, cls, extra) => `<path class=\"${cls || \"k\"}\" d=\"${d}\"${extra ? \" \" + extra : \"\"}/>`;\n// 字号只由 class 决定（.t .tm .num .lab .ttl .big .cnt .huge），手机上在 CSS 里统一放大\nconst T = (x, y, s, cls, extra) => `<text x=\"${x}\" y=\"${y}\" class=\"${cls || \"t\"}\"${extra ? \" \" + extra : \"\"}>${s}<\/text>`;\nconst clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));\nconst smooth = t => t * t * (3 - 2 * t);\nconst f1 = n => Math.round(n * 10) / 10;\nfunction hash(i, j, s){ let x = Math.imul(i | 0, 73856093) ^ Math.imul(j | 0, 19349663) ^ Math.imul((s | 0) + 1, 83492791); x = Math.imul(x ^ (x >>> 13), 1274126177); return ((x ^ (x >>> 16)) >>> 0) / 4294967296; }\nconst limb = (d, w, fill) => `<path d=\"${d}\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"${f1(w + 3)}\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"${d}\" fill=\"none\" stroke=\"${fill}\" stroke-width=\"${f1(w)}\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>`;\nconst rectP = (x0, y0, w, h) => `M${f1(x0)} ${f1(y0)}h${f1(w)}v${f1(h)}h${f1(-w)}Z`;\n\n/* ============ 4. 页面骨架 ============ */\nconst $ = id => document.getElementById(id);\nconst svg = $(\"stage\"), gStatic = $(\"static\"), gDyn = $(\"dyn\");\nconst reduced = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst STATIONS = 4;\nfunction fresh(){\n  return { station: 1, mode: \"talk\", holdKey: null, z: 0, zt: 0, sample: \"cheek\", seen: { cheek: false, onion: false, blood: false },\n    said: {}, band: -1, want: null, drag: null, cork: false,\n    nzT: 0, nzP: 0, nt: 0, np: 0, neuronDone: false,            // 神经细胞：镜头拉远的过渡、拖出来的长度\n    d: 0, dt: 0, earth: false, eP: 0,                            // 第 3 站：分裂进度、地球「哇」\n    pick: { cheek: null, onion: null, blood: null }, stain: { cheek: 0, onion: 0, blood: 0 }, staining: null,\n    found: {}, saidBook: false, saidSeen: false, focus: -1, kbd: false };\n}\nlet S = fresh();\n\nfunction head(n, title){ $(\"station\").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : \"星卡\"; $(\"title\").textContent = title; }\nfunction hint(s){ $(\"hint\").textContent = s || \"\"; }\nfunction readout(html){ $(\"readout\").innerHTML = html || \"\"; }\nfunction say(text, tone){ const b = $(\"say\"); b.textContent = text; b.className = \"bubble\" + (tone ? \" \" + tone : \"\"); }\n// 手指还按着时换出来的新按钮，先禁用到这次抬起（按住「放大」「分」刚完成时最常见）\nlet fingerDown = false, keyHeld = false;\naddEventListener(\"pointerdown\", () => { fingerDown = true; }, true);\nfor (const ev of [\"pointerup\", \"pointercancel\"]) addEventListener(ev, () => { fingerDown = false; }, true);   // 抬起时立刻记下\naddEventListener(\"keydown\", e => { if (e.repeat) keyHeld = true; if (e.key !== \"Shift\") document.body.classList.add(\"kbd\"); }, true);\naddEventListener(\"pointerdown\", () => document.body.classList.remove(\"kbd\"), true);\naddEventListener(\"keyup\", () => { keyHeld = false; }, true);\nconst FRESH_MS = 400, FRESH_KEY_MS = 900;   // 新按钮出现后 400 毫秒内不认点击：双击「继续」时第二下不会替孩子选答案；\n// 键盘连敲空格「放大」时，站点完成、焦点跳到新按钮，900 毫秒内的键盘点击也不认\nfunction actions(list, keepFocus){\n  const box = $(\"actions\");\n  const ae = document.activeElement;\n  const moveFocus = !keepFocus && (!ae || ae === document.body || ae === svg || box.contains(ae));\n  box.replaceChildren();\n  const guard = fingerDown, born = performance.now();\n  for (const a of list || []){\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.className = \"btn \" + (a.cls || \"\"); b.textContent = a.label;\n    if (a.hold){\n      const on = v => { S.holdKey = v ? a.hold : null; b.classList.toggle(\"on\", v); };\n      b.addEventListener(\"pointerdown\", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });\n      for (const ev of [\"pointerup\", \"pointercancel\", \"lostpointercapture\"]) b.addEventListener(ev, () => on(false));\n      b.addEventListener(\"keydown\", e => { if (e.key === \" \" || e.key === \"Enter\"){ e.preventDefault(); a.step(); } });\n      b.addEventListener(\"contextmenu\", e => e.preventDefault());\n    } else {\n      b.addEventListener(\"click\", e => {\n        if (performance.now() - born < (e.detail === 0 ? FRESH_KEY_MS : FRESH_MS)) return;      // 双击、连点、连敲\n        if (e.detail === 0 && keyHeld) return;                // 键盘一直按着、自动重复\n        a.go(e);\n      });\n      if (guard){ b.disabled = true; const on = () => { setTimeout(() => { b.disabled = false; }, 120); removeEventListener(\"pointerup\", on, true); }; addEventListener(\"pointerup\", on, true); }\n    }\n    box.append(b);\n  }\n  if (moveFocus && box.firstChild) box.firstChild.focus({ preventScroll: true });\n  return box;\n}\nfunction ask(item, question, options, onAnswer){\n  say(question);\n  actions(options.map((o, i) => ({ label: o.label, cls: \"choice\", go: () => {\n    emit(\"predicted\", { station: S.station, item ，斜着横过视野，离中心 0.12 毫米\n  const hd = .12 * u, hw = MODEL.hairMm / 2 * u;\n  if (hd - hw > VR) return \"\";\n  let s = `<g transform=\"translate(${VX} ${VY}) rotate(-18)\">`;\n  if (hw < 1) s += `<line x1=\"${-VR - 20}\" y1=\"${f1(hd)}\" x2=\"${VR + 20}\" y2=\"${f1(hd)}\" stroke=\"var(--ink)\" stroke-width=\"${Math.max(1.4, hw * 2).toFixed(1)}\" opacity=\".8\"/>`;\n  else {\n    s += `<rect x=\"${-VR - 40}\" y=\"${f1(hd - hw)}\" width=\"${2 * VR + 80}\" height=\"${f1(2 * hw)}\" fill=\"var(--muted)\" opacity=\".4\"/>` +\n      P(Sk.line(-VR - 40, hd - hw, VR + 40, hd - hw, 410) + Sk.line(-VR - 40, hd + hw, VR + 40, hd + hw, 411), \"k1\");\n    if (hw > 10) for (let x = -VR - 20; x < VR + 20; x += hw * 1.3) s += P(`M${f1(x)} ${f1(hd - hw)}Q${f1(x + hw * .5)} ${f1(hd)} ${f1(x)} ${f1(hd + hw)}`, \"k1\", 'opacity=\".3\"');\n  }\n  return s + \"<\/g>\";\n}\nfunction drawOnion(m){\n  const u = uOf(m), W = VR / u;\n  let s = `<path d=\"${wideBlob(-2, 1.5, 13, u, 420)}\" fill=\"var(--sage)\" opacity=\".5\"/>`;\n  s += `<path d=\"${wideBlob(-2, 1.5, 13, u, 420)}\" class=\"k1\" opacity=\"${(1 - fadeLog(m, 2, 6)).toFixed(2)}\"/>`;\n  const fc = fadeLog(m, 8, 25);\n  if (fc > .01){\n    const L = MODEL.onionMm, H = MODEL.onionWideMm;\n    let cells = \"\", heroS = \"\";\n    for (let j = Math.floor(-W / H) - 1; j <= Math.ceil(W / H) + 1; j++){\n      const off = (hash(j, 0, 11) - .5) * L;\n      for (let i = Math.floor((-W - off) / L) - 1; i <= Math.ceil((W - off) / L) + 1; i++){\n        const cx = off + i * L, cy = j * H;\n        const sx = VX + cx * u, sy = VY + cy * u, hw = L / 2 * u, hh = H / 2 * u;\n        if (Math.abs(sy - VY) > VR + hh || Math.abs(sx - VX) > VR + hw) continue;\n        const jt = k => (hash(i, j, 20 + k) - .5) * 4;\n        const d = `M${f1(sx - hw + jt(1))} ${f1(sy - hh + jt(2))}L${f1(sx + hw + jt(3))} ${f1(sy - hh + jt(4))}L${f1(sx + hw + jt(5))} ${f1(sy + hh + jt(6))}L${f1(sx - hw + jt(7))} ${f1(sy + hh + jt(8))}Z`;\n        if (j === 0 && Math.abs(cx) }v10M${f1(VX - w / 2)} ${y}H${f1(VX + w / 2)}M${f1(VX + w / 2)} ${y - 5}v10\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linecap=\"round\"/>` +\n    T(VX, y - 11, fmtMm(L), \"t\", 'text-anchor=\"middle\"');\n}\nfunction eyeRing(m){   // 0.1 毫米的虚线圈：眼睛能分辨的大约这么小\n  const D = MODEL.eyeMm * uOf(m);\n  if (D < 10 || D > 230) return \"\";\n  const o = Math.min(clamp((D - 10) / 10), clamp((230 - D) / 30)), cx = VX + 70, cy = VY - 70, lw = NR ? 96 : 80, lh = NR ? 32 : 26;\n  return `<g opacity=\"${o.toFixed(2)}\"><circle cx=\"${cx}\" cy=\"${cy}\" r=\"${f1(D / 2)}\" fill=\"var(--pane)\" fill-opacity=\".25\" stroke=\"var(--ink)\" stroke-width=\"2.4\" stroke-dasharray=\"5 6\"/>` +\n    `<rect x=\"${cx - lw / 2}\" y=\"${f1(cy - D / 2 - lh - 8)}\" width=\"${lw}\" height=\"${lh}\" rx=\"8\" fill=\"var(--pane)\" opacity=\".92\"/>` +\n    T(cx, f1(cy - D / 2 - 14), fmtMm(MODEL.eyeMm), \"t\", 'text-anchor=\"middle\"') + \"<\/g>\";\n}\nfunction centerMark(m, fadeAt){   // 主角：我们要找的那一小块\n  const o = 1 - fadeLog(m, fadeAt[0], fadeAt[1]);\n  if (o < .02) return \"\";\n  return `<rect x=\"${VX - 11}\" y=\"${VY - 11}\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"3\" opacity=\"${o.toFixed(2)}\"/>`;\n}\nconst FADE = { cheek: [40, 80], onion: [6, 15], blood: [180, 320] };\nfunction viewSvg(){\n  const m = magOf(S.z);\n  let s = `<circle cx=\"${VX}\" cy=\"${VY}\" r=\"${VR}\" fill=\"var(--pane)\"/><circle cx=\"${VX}\" cy=\"${VY}\" r=\"${VR}\" fill=\"var(--sky)\" opacity=\".25\"/><g clip-path=\"url(#vclip)\">`;\n  if (S.sample === \"cheek\") s += drawCheek(m, true) + centerMark(m, FADE.cheek);\n  else if (S.sample === \"onion\") s += drawOnion(m) + centerMark(m, FADE.onion);\n  else if (S.sample === \"blood\") s += drawBlood(m) + centerMark(m, FADE.blood);\n  if (S.station === 1) s += eyeRing(m);\n  s += \"<\/g>\" + P(ring(VX, VY, VR, 600), \"k\") + P(ring(VX, VY, VR + 7, 601, 2), \"k1\");\n  if (S.sample) s += scaleBar(m);\n  return s;\n}\n// 第 1 站底下：棉签和玻片。红框就是视野里那一块，越放大越小\nfunction illoSvg(){\n  const m = magOf(S.z), cx = ILLO.x, cy = ILLO.y, k = 1.5;   // 每毫米 1.5 个单位\n  let s = P(Sk.line(cx - 64, cy - 52, cx + 6, cy - 34, 803), \"k\", 'stroke-width=\"5\"') +\n    `<path d=\"${Sk.blob(cx + 14, cy - 31, 14, 8, 804)}\" fill=\"var(--pane)\"/>` + P(Sk.blob(cx + 14, cy - 31, 14, 8, 804), \"k1\");\n  s += `<rect x=\"${cx - 38 * k}\" y=\"${cy - 13 * k}\" width=\"${76 * k}\" height=\"${26 * k}\" rx=\"3\" fill=\"var(--sky)\" opacity=\".75\"/>` +\n    P(Sk.line(cx - 38 * k, cy - 13 * k, cx + 38 * k, cy - 13 * k, 805) + Sk.line(cx - 38 * k, cy + 13 * k, cx + 38 * k, cy + 13 * k, 806) + Sk.line(cx - 38 * k, cy - 13 * k, cx - 38 * k, cy + 13 * k, 807) + Sk.line(cx + 38 * k, cy - 13 * k, cx + 38 * k, cy + 13 * k, 808), \"k1\");\n  s += `<path d=\"${Sk.blob(cx + 5 * k, cy, 6 * k, 5 * k, 809)}\" fill=\"var(--apricot)\" opacity=\".9\"/>`;\n  const side = Math.max(5, MODEL.fov0Mm / m * k);\n  s += `<rect x=\"${f1(cx + 5 * k - side / 2)}\" y=\"${f1(cy - side / 2)}\" width=\"${f1(side)}\" height=\"${f1(side)}\" fill=\"var(--accent)\" fill-opacity=\".12\" stroke=\"var(--accent)\" stroke-width=\"2.6\"/>`;\n  const to = NR ? [VX + 150, VY + VR - 60] : [VX - 70, VY + VR - 8];\n  s += P(Sk.curve([[cx + 5 * k + side / 2, cy - side / 2], [(cx + to[0]) / 2 + (NR ? 40 : -10), (cy + to[1]) / 2 - 20], to], 802, .3), \"kf\");\n  return s;\n}\nfunction corkSvg(){   // 1665 年胡克画的软木塞：一格一格的空格子\n  const x0 = CORK.x, y0 = CORK.y, w = 300, h = 92;\n  let s = `<rect x=\"${x0}\" y=\"${y0}\" width=\"${w}\" height=\"${h}\" rx=\"12\" fill=\"var(--paper)\" opacity=\".92\"/>` + P(Sk.line(x0, y0, x0 + w, y0, 810) + Sk.line(x0, y0 + h, x0 + w, y0 + h, 811), \"k1\");\n  let cells = \"\";\n  const hx = 13, hy = 15;\n  for (let j = 0; j < 4; j++) for (let i = 0; i < 6; i++){\n    const cx = x0 + 22 + i * hx * 2 + (j & 1 ? hx : 0), cy = y0 + 16 + j * hy * 1.5, rr = Sk.R(820 + i + j * 7);\n    const pts = []; for (let q = 0; q < 6; q++){ const a = Math.PI / 6 + q * Math.PI / 3; pts.push([cx + Math.cos(a) * hx * 1.12 + (rr() - .5) * 2, cy + Math.sin(a) * hy * .98 + (rr() - .5) * 2]); }\n    if (cy + hy < y0 + h) cells += \"M\" + pts.map(q => f1(q[0]) + \" \" + f1(q[1])).join(\"L\") + \"Z\";\n  }\n  s += `<path d=\"${cells}\" fill=\"var(--pane)\" fill-opacity=\".7\" stroke=\"var(--ink)\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/>`;\n  s += T(x0 + 190, y0 + 42, MODEL.hookeYear, \"big\") + T(x0 + 190, y0 + 74, \"软木塞\", \"tm\");\n  return s;\n}\n\n/* ============ 8. 第 1 站：放大 ============ */\nfunction enter1(){\n  S.station = 1; S.mode = \"talk\"; S.sample = \"cheek\"; S.z = S.zt = 0; head(1, \"放大\"); hint(\"\");\n  fitView(); render(); readoutZoom();\n  say(\"舰长，用棉签在嘴巴里面轻轻刮一下，抹在玻片上。\");\n  next(\"抹好了\", () => {\n    say(\"玻片上只有一小片黏黏的东西，看不出别的。\");\n    next(\"猜一猜\", () => ask(\"zoom-guess\", \"这一小片黏黏的东西里，藏着什么？\", [\n      { label: \"什么也没有，就是黏黏的水\", mis: \"visible\", feedback: \"看起来确实只是黏黏的水。可放得够大，就不一样了。\" },\n      { label: \"一个个小房间，眼睛看不见\", correct: true, feedback: \"你猜对了。我们用显微镜亲眼看看。\" },\n      { label: \"一个个小房间，眼睛能看见\", mis: \"visible\", feedback: \"很多人这么想。可玻片上，你看得见小房间吗？放大看看。\" }\n    ], () => next(\"放大看看\", act1)));\n  });\n}\nfunction zoomButtons(){\n  actions([\n    { label: \"− 缩小\", cls: \"ghost\", hold: \"zout\", step: () => { S.zt = clamp(S.zt - .04, 0, zMax()); } },\n    { label: \"＋ 放大\", cls: \"hold\", hold: \"zin\", step: () => { S.zt = clamp(S.zt + .04, 0, zMax()); } }\n  ]);\n}\nconst zMax = () => zOf(MODEL.target[S.mode === \"act1\" ? \"cheek\" : S.want] || MODEL.maxMag);\nfunction act1(){\n  S.mode = \"act1\"; hint(\"转动旋钮，或按住「放大」\");\n  say(\"这是显微镜。转动右边的旋钮，把玻片放大。\");\n  zoomButtons(); render(); readoutZoom(); svg.focus({ preventScroll: true });\n}\nfunction readoutZoom(){\n  const m = +fmtMag(magOf(S.z));\n  readout(`放大 <b>${m}<\/b> 倍 · 圆圈宽 ${fmtMm(MODEL.fov0Mm / m)}`);\n  Host.state({ station: S.station, sample: S.sample, magnification: m, field_mm: +(MODEL.fov0Mm / m).toPrecision(3) });\n}\nfunction milestones1(){\n  const m = magOf(S.z), once = (k, c, text) => { if (c && !S.said[k]){ S.said[k] = true; say(text); } };\n  once(\"hair\", m >= 5, \"那条线是一根头发，放在玻片上比一比。头发眼睛看得见。\");\n  once(\"eye\", m >= 22, `虚线圈有 ${fmtMm(MODEL.eyeMm)}宽。比它小、又挤在一起，眼睛就分不清了。`);\n  once(\"cells\", m >= 50, \"出现一个一个的东西了。再转一点。\");\n}\nfunction done1(){\n  S.mode = \"talk\"; S.holdKey = null; hint(\"\"); S.seen.cheek = true;\n  emit(\"observed\", { station: 1, item: \"cheek\", magnification: MODEL.target.cheek }, \"o-cheek\");\n  render(); readout(`放大 <b>${MODEL.target.cheek}<\/b> 倍 · 一个细胞约 ${fmtMm(MODEL.cheekMm)}`);\n  say(\"一个一个的小房间！每一个就是一个细胞。\", \"good\");\n  next(\"继续\", () => {\n    S.cork = true; render();\n    say(`${MODEL.hookeYear} 年，胡克用显微镜看软木塞，也看到一格一格的小空格。`);\n    next(\"他叫它们什么？\", () => {\n      say(\"他叫它们 cell，意思是「小房间」。中文叫细胞。\");\n      next(\"再比一比\", () => {\n        say(MODEL.cheekNearHair ? \"看那根头发：一个口腔细胞，和一根头发差不多粗。\" : `一个口腔细胞约 ${fmtMm(MODEL.cheekMm)}，头发约 ${fmtMm(MODEL.hairMm)}。`);\n        next(\"继续\", () => {\n          say(\"飞船上的倍数是简化过的。学校显微镜开到同样倍数，细胞看起来更小。\");\n          next(\"去第 2 站\", enter2);\n        });\n      });\n    });\n  });\n}\n\n/* ============ 9. 第 2 站：换样本，再拉出一个神经细胞 ============ */\nfunction enter2(){\n  S.station = 2; S.mode = \"talk\"; S.cork = false; head(2, \"换样本\"); hint(\"\");\n  fitView(); render(); readoutZoom();\n  say(\"口腔里的细胞是一个一个的。那植物呢？\");\n  next(\"猜一猜\", () => ask(\"plant-guess\", \"洋葱是植物。放大以后，它也是一个一个的细胞吗？\", [\n    { label: \"是，也是一格一格的\", correct: true, feedback: \"你猜对了。拖洋葱片上去看看。\" },\n    { label: \"不是，植物是一整块的\", mis: \"only-animals\", feedback: \"很多人这么想，植物摸着也是一整块。我们放大看看。\" }\n  ], () => next(\"去拿洋葱片\", () => pick(\"onion\"))));\n}\nfunction pick(key){\n  S.mode = \"pick\"; S.want = key; hint(`把「${SLIDES[key].name}」片拖到显微镜上，或点一下它`);\n  say(`把${SLIDES[key].name}片拖到显微镜的台子上。`);\n  actions([]); render(); svg.focus({ preventScroll: true });\n}\nfunction place(key){\n  S.drag = null; S.sample = key; S.z = S.zt = 0;\n  if (S.mode === \"pick\" && key === S.want){\n    S.mode = \"zoom2\"; hint(\"转动旋钮，或按住「放大」\");\n    say(\"放好了。转动旋钮，放大看看。\"); zoomButtons(); svg.focus({ preventScroll: true });\n  }\n  render(); readoutZoom();\n}\nfunction seen2(key){\n  S.mode = \"talk\"; S.holdKey = null; S.seen[key] = true; hint(\"\");\n  emit(\"observed\", { station: 2, item: key, magnification: MODEL.target[key] }, \"o-\" + key);\n  render();\n  if (key === \"onion\"){\n    say(\"植物也是一格一格的！洋葱细胞像一块块长砖。\", \"good\");\n    readout(`放大 <b>${MODEL.target.onion}<\/b> 倍 · 洋葱细胞约 ${fmtMm(MODEL.onionMm)}长`);\n    next(\"继续\", () => {\n      say(`一个洋葱细胞，比口腔细胞长 ${MODEL.onionVsCheek} 倍多。`);\n      next(\"下一片\", () => ask(\"blood-guess\", \"血里的细胞，和口腔、洋葱的细胞长得一样吗？\", [\n        { label: \"一样，都是一格一格的\", mis: \"one-kind\", feedback: \"都叫细胞，听起来像一样的。可它们样子各不一样。看看吧。\" },\n        { label: \"不一样，形状各不同\", correct: true, feedback: \"你猜对了。拖血片上去看看。\" }\n      ], () => next(\"去拿血片\", () => pick(\"blood\"))));\n    });\n  } else {\n    say(\"血里最多的是红细胞，像一个个小圆饼，不连在一起。\", \"good\");\n    readout(`放大 <b>${MODEL.target.blood}<\/b> 倍 · 红细胞约 ${fmtMm(MODEL.rbcMm)}`);\n    next(\"继续\", () => {\n      say(\"口腔、洋葱、红细胞，形状各不一样。\");\n      next(\"还有更怪的吗？\", neuronIntro);\n    });\n  }\n}\n// 神经细胞：显微镜里装不下，先把镜头拉远（视野缩小、淡出），再看整个人\nfunction neuronIntro(){\n  S.mode = \"zoomout\"; S.nzT = 1; actions([]); readout(\"\");\n  say(\"有的神经细胞特别长，显微镜里装不下。我们把镜头拉远，看整个人。\");\n}\nfunction actNeuron(){\n  S.mode = \"neuron\"; hint(\"把红点从腰拖到脚趾\");\n  say(\"一个神经细胞从腰这里出发。拖着红点，把它一直拉到脚趾。\");\n  readoutNeuron(); svg.focus({ preventScroll: true });\n}\nfunction readoutNeuron(){\n  const L = S.np * MODEL.neuronM;\n  readout(S.neuronDone ? `神经细胞 <b>${MODEL.neuronM} 米<\/b>多` : `神经细胞长 <b>${L.toFixed(1)}<\/b> 米`);\n  Host.state({ station: 2, neuron_m: +L.toFixed(2) });\n}\nfunction doneNeuron(){\n  S.mode = \"talk\"; S.neuronDone = true; hint(\"\"); readoutNeuron(); render();\n  emit(\"observed\", { station: 2, item: \"neuron\", length_m: MODEL.neuronM }, \"o-neuron\");\n  say(`在大人身上，这一个细胞能长到 ${MODEL.neuronM} 米多！`, \"good\");\n  next(\"继续\", () => {\n    say(`它比一个红细胞长 ${MODEL.neuronVsRbcWan} 万多倍。`);\n    next(\"去第 3 站\", enter3);\n  });\n}\n// 人和神经细胞都按米画：地面在 floor，每米 perM 个单位\nfunction neuronGeo(){\n  return NR ? { px: 210, floor: 800, perM: 420, rx: 370 } : { px: 330, floor: 588, perM: 300, rx: 470 };\n}\nlet NPATH = null, NPATH_KEY = \"\";\nfunction neuronPath(){\n  const g = neuronGeo(), key = g.px + \",\" + g.floor;\n  if (NPATH && NPATH_KEY === key) return NPATH;\n  const X = dx => g.px + dx * g.perM, Y = h => g.floor - h * g.perM;\n  const ctrl = [[X(-.09), Y(1.0)], [X(-.075), Y(.78)], [X(-.065), Y(.5)], [X(-.07), Y(.2)], [X(-.03), Y(.05)], [X(.08), Y(.03)], [X(.2), Y(.03)]];\n  // 沿控制点插值出密的点，按弧长算进度\n  const pts = [];\n  for (let i = 0; i < ctrl.length - 1; i++){\n    const p0 = ctrl[Math.max(0, i - 1)], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[Math.min(ctrl.length - 1, i + 2)];\n    for (let k = 0; k < 20; k++){ const t = k / 20, t2 = t * t, t3 = t2 * t;\n      pts.push([0, 1].map(c => .5 * (2 * p1[c] + (-p0[c] + p2[c]) * t + (2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c]) * t2 + (-p0[c] + 3 * p1[c] - 3 * p2[c] + p3[c]) * t3))); }\n  }\n  pts.push(ctrl[ctrl.length - 1]);\n  const acc = [0]; for (let i = 1; i < pts.length; i++) acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));\n  NPATH = { pts, acc, L: acc[acc.length - 1] }; NPATH_KEY = key;\n  return NPATH;\n}\nfunction pathAt(p){\n  const N = neuronPath(), want = clamp(p) * N.L;\n  let i = 1; while (i < N.acc.length - 1 && N.acc[i] < want) i++;\n  const a = N.acc[i - 1], b = N.acc[i], t = b > a ? (want - a) / (b - a) : 0;\n  return [N.pts[i - 1][0] + (N.pts[i][0] - N.pts[i - 1][0]) * t, N.pts[i - 1][1] + (N.pts[i][1] - N.pts[i - 1][1]) * t, i];\n}\nfunction nearestOnPath(q, from){\n  const N = neuronPath();\n  let best = from, bd = 1e9;\n  for (let i = 0; i < N.pts.length; i++){\n    const p = N.acc[i] / N.L;\n    if (Math.abs(p - from) > .3) continue;     // 只在当前位置附近找，免得一下跳到脚趾\n    const d = Math.hypot(q.x - N.pts[i][0], q.y - N.pts[i][1]);\n    if (d < bd){ bd = d; best = p; }\n  }\n  return best;\n}\nfunction neuronScene(){\n  const g = neuronGeo(), X = dx => f1(g.px + dx * g.perM), Y = h => f1(g.floor - h * g.perM), M = v => v * g.perM;\n  let s = P(Sk.line(g.px - M(.6), g.floor + 4, g.px + M(.85), g.floor + 4, 700), \"k1\");\n  // 一个大人（侧面），身高约 1.7 米\n  s += limb(`M${X(-.01)} ${Y(.95)} L${X(.02)} ${Y(.5)} L${X(-.01)} ${Y(.07)}`, M(.13), \"var(--paper)\");\n  s += limb(`M${X(-.04)} ${Y(.045)} L${X(.2)} ${Y(.035)}`, M(.07), \"var(--paper)\");\n  const torso = Sk.blob(+X(0), +Y(1.2), M(.15), M(.3), 701);\n  s += `<path d=\"${torso}\" fill=\"var(--paper)\"/>` + P(torso, \"k\");\n  s += limb(`M${X(.03)} ${Y(1.4)} L${X(.09)} ${Y(1.1)} L${X(.13)} ${Y(.86)}`, M(.065), \"var(--paper)\");\n  s += `<circle cx=\"${X(.02)}\" cy=\"${Y(1.58)}\" r=\"${f1(M(.11))}\" fill=\"var(--paper)\"/>` + P(Sk.ellipse(+X(.02), +Y(1.58), M(.11), M(.11), 702), \"k\");\n  // 神经细胞：腰（脊髓下端）到脚趾。没拉到的部分用虚线引路\n  const N = neuronPath(), [hx, hy, hi] = pathAt(S.np);\n  s += P(Sk.cr(N.pts.filter((_, i) => i % 3 === 0 || i === N.pts.length - 1), false), \"kf\", 'stroke-width=\"2.2\"');\n  const done = N.pts.slice(0, hi).concat([[hx, hy]]);\n  if (done.length > 1) s += `<path class=\"thread\" d=\"M${done.map(q => f1(q[0]) + \" \" + f1(q[1])).join(\"L\")}\"/>`;\n  const [sx, sy] = N.pts[0];\n  s += `<circle cx=\"${f1(sx)}\" cy=\"${f1(sy)}\" r=\"13\" fill=\"var(--accent)\"/>` + P(Sk.ellipse(sx, sy, 13, 13, 704), \"k1\");\n  const [tx, ty] = N.pts[N.pts.length - 1];\n  if (!S.neuronDone) s += `<circle cx=\"${f1(tx)}\" cy=\"${f1(ty)}\" r=\"20\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-dasharray=\"4 5\"/>`;\n  if (S.mode === \"neuron\" || S.np > .02){\n    s += `<circle cx=\"${f1(hx)}\" cy=\"${f1(hy)}\" r=\"16\" fill=\"var(--accent)\"/>` + P(Sk.ellipse(hx, hy, 16, 16, 705), \"k\");\n  }\n  if (S.mode === \"neuron\" && S.kbd) s += `<circle cx=\"${f1(hx)}\" cy=\"${f1(hy)}\" r=\"28\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/>`;\n  // 尺子：从神经细胞的起点高度到地面，正好 1 米。拉完才写出「1 米」\n  const top = +Y(MODEL.neuronM);\n  s += P(Sk.line(g.rx, top, g.rx, g.floor, 707), \"k\");\n  for (let i = 0; i <= 10; i++){ const y = top + (g.floor - top) * i / 10; s += P(Sk.line(g.rx, y, g.rx + (i % 5 ? 8 : 16), y, 710 + i), \"k1\"); }\n  s += P(Sk.line(sx + 14, top, g.rx - 4, top, 721), \"kf\");\n  if (S.neuronDone){\n    s += `<rect x=\"${g.rx + 22}\" y=\"${f1((top + g.floor) / 2 - 24)}\" width=\"${NR ? 100 : 80}\" height=\"${NR ? 40 : 34}\" rx=\"8\" fill=\"var(--pane)\"/>` + T(g.rx + (NR ? 72 : 62), f1((top + g.floor) / 2 + 3), MODEL.neuronM + \" 米\", \"big\", 'text-anchor=\"middle\"');\n    s += T(sx - 18, sy - 22, \"一个神经细胞\", \"tm\", 'text-anchor=\"end\"');\n  }\n  return s;\n}\n\n/* ============ 10. 第 3 站：细胞是活的 ============ */\nconst DFIT = 300, FAST = 6, SHRINK_TO = 10;   // 第 6 次（64 个）以后铺成一整片；一直缩小到第 10 次，越分越密\nconst colsOf = g => Math.pow(2, Math.ceil(g / 2)), rowsOf = g => Math.pow(2, Math.floor(g / 2));\nconst scOf = g => DFIT / Math.max(colsOf(g), rowsOf(g));\nfunction unionPath(x1, y1, x2, y2, R){   // 两个一样大的圆合起来的轮廓（细胞中间正在收紧）\n  const dx = x2 - x1, dy = y2 - y1, s = Math.hypot(dx, dy);\n  if (s < .01) return `M${f1(x1 - R)} ${f1(y1)}a${f1(R)} ${f1(R)} 0 1 0 ${f1(2 * R)} 0a${f1(R)} ${f1(R)} 0 1 0 ${f1(-2 * R)} 0Z`;\n  if (s >= 2 * R) return null;\n  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, h = Math.sqrt(R * R - s * s / 4), px = -dy / s, py = dx / s;\n  const ax = mx + px * h, ay = my + py * h, bx = mx - px * h, by = my - py * h;\n  return `M${f1(ax)} ${f1(ay)}A${f1(R)} ${f1(R)} 0 1 1 ${f1(bx)} ${f1(by)}A${f1(R)} ${f1(R)} 0 1 1 ${f1(ax)} ${f1(ay)}Z`;\n}\nfunction cellPair(x, y, ax, ay, q, r, sc, nucOff, withWall, ox, oy){\n  ox = ox == null ? VX : ox; oy = oy == null ? VY : oy;\n  const c1x = x - ax * q / 2, c1y = y - ay * q / 2, c2x = x + ax * q / 2, c2y = y + ay * q / 2;\n  const X = v => ox + v * sc, Y = v => oy + v * sc, R = r * sc;\n  let s = \"\";\n  const d = unionPath(X(c1x), Y(c1y), X(c2x), Y(c2y), R);\n  if (d){\n    s += `<path class=\"c-hero\" d=\"${d}\"/>`;\n    if (withWall && q > .02){\n      const s2 = q * sc, h = Math.sqrt(Math.max(0, R * R - s2 * s2 / 4)) * Math.min(1, q * 3), mx = X(x), my = Y(y);\n      s += `<line x1=\"${f1(mx - ay * h)}\" y1=\"${f1(my + ax * h)}\" x2=\"${f1(mx + ay * h)}\" y2=\"${f1(my - ax * h)}\" stroke=\"var(--accent)\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>`;\n    }\n  } else s += `<circle class=\"c-hero\" cx=\"${f1(X(c1x))}\" cy=\"${f1(Y(c1y))}\" r=\"${f1(R)}\"/><circle class=\"c-hero\" cx=\"${f1(X(c2x))}\" cy=\"${f1(Y(c2y))}\" r=\"${f1(R)}\"/>`;\n  const nr = Math.max(1.2, .13 * sc);\n  if (nucOff < .001) s += `<circle class=\"nuc\" cx=\"${f1(X(x))}\" cy=\"${f1(Y(y))}\" r=\"${f1(nr)}\"/>`;\n  else s += `<circle class=\"nuc\" cx=\"${f1(X(x - ax * nucOff))}\" cy=\"${f1(Y(y - ay * nucOff))}\" r=\"${f1(nr)}\"/><circle class=\"nuc\" cx=\"${f1(X(x + ax * nucOff))}\" cy=\"${f1(Y(y + ay * nucOff))}\" r=\"${f1(nr)}\"/>`;\n  return s;\n}\nfunction divPhase(d){\n  const n = MODEL.divisions, g = Math.min(n, Math.floor(d + 1e-9)), ph = g >= n ? 0 : d - g;\n  const grow = smooth(clamp(ph / .4)), split = smooth(clamp((ph - .55) / .45)), nsplit = smooth(clamp((ph - .38) / .22));\n  return { g, ph, grow, split, nsplit };\n}\nfunction drawDivide(){\n  const { g, ph, grow, split, nsplit } = divPhase(S.d);\n  const xAxis = g % 2 === 0, ax = xAxis ? 1 : 0, ay = xAxis ? 0 : 1;\n  const sc0 = scOf(Math.min(g, SHRINK_TO)), sc1 = scOf(Math.min(g + 1, SHRINK_TO)), sc = sc0 * Math.pow(sc1 / sc0, split);\n  const cols = colsOf(g), rows = rowsOf(g);\n  const r = .45 * (ph < .55 ? 1 + .26 * grow : 1.26 - .26 * split);\n  const nucOff = split > 0 ? .2 * (1 - split) + .5 * split : .2 * nsplit;\n  let s = `<circle cx=\"${VX}\" cy=\"${VY}\" r=\"${VR}\" fill=\"var(--sage)\" opacity=\".25\"/>`;\n  if (g < FAST){\n    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++){\n      const x0 = i - (cols - 1) / 2, y0 = j - (rows - 1) / 2;\n      const x = xAxis ? x0 * (1 + split) : x0, y = xAxis ? y0 : y0 * (1 + split);\n      s += cellPair(x, y, ax, ay, split, r, sc, nucOff, true);\n      if (g <= 2 && ph > 0 && ph < .42){   // 养料：从四周被吸进来\n        for (let k = 0; k < 6; k++){\n          const a = k / 6 * Math.PI * 2 + i + j, rr = (1.25 - .75 * clamp(ph / .4)) * .6;\n          s += `<circle cx=\"${f1(VX + (x + Math.cos(a) * rr) * sc)}\" cy=\"${f1(VY + (y + Math.sin(a) * rr) * sc)}\" r=\"${f1(Math.max(2.5, .04 * sc))}\" fill=\"var(--good)\" opacity=\"${(.8 * (1 - clamp(ph / .4))).toFixed(2)}\"/>`;\n        }\n      }\n    }\n  } else {\n    // 太多了，视野里装不下：铺成一整片，每一格还是一个细胞，一起长大、一起分、越来越密\n    const tw = (xAxis ? 1 + split : 1) * sc, th = (xAxis ? 1 : 1 + split) * sc;\n    const inner = cellPair(0, 0, ax, ay, split, r, sc, nucOff, sc > 14, tw / 2, th / 2);\n    s += `<pattern id=\"tis\" patternUnits=\"userSpaceOnUse\" x=\"${VX}\" y=\"${VY}\" width=\"${f1(tw)}\" height=\"${f1(th)}\">${inner}<\/pattern>`;\n    s += `<rect x=\"${VX - VR}\" y=\"${VY - VR}\" width=\"${2 * VR}\" height=\"${2 * VR}\" fill=\"url(#tis)\"/>`;\n    const push = 10 * split;\n    for (let i = 0; i < 8; i++){\n      const a = i / 8 * Math.PI * 2 + Math.PI / 8, x1 = VX + Math.cos(a) * (VR - 46 + push), y1 = VY + Math.sin(a) * (VR - 46 + push);\n      const x2 = VX + Math.cos(a) * (VR - 18 + push), y2 = VY + Math.sin(a) * (VR - 18 + push);\n      s += `<g opacity=\".85\"><line x1=\"${f1(x1)}\" y1=\"${f1(y1)}\" x2=\"${f1(x2)}\" y2=\"${f1(y2)}\" stroke=\"var(--pane)\" stroke-width=\"8\" stroke-linecap=\"round\"/>` +\n        `<path class=\"k\" d=\"M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - Math.cos(a - .5) * 9)} ${f1(y2 - Math.sin(a - .5) * 9)}L${f1(x2)} ${f1(y2)}L${f1(x2 - Math.cos(a + .5) * 9)} ${f1(y2 - Math.sin(a + .5) * 9)}\"/><\/g>`;\n    }\n  }\n  return s;\n}\n// 「哇」：只把身体里的红细胞一个挨一个排成一排，能绕地球几圈\nfunction drawEarth(){\n  const R = 92, p = S.eP, loops = MODEL.earthLoops;\n  let s = `<circle cx=\"${VX}\" cy=\"${VY}\" r=\"${VR}\" fill=\"var(--sky)\" opacity=\".25\"/>`;\n  s += `<circle cx=\"${VX}\" cy=\"${VY}\" r=\"${R}\" fill=\"var(--sky)\"/>`;\n  for (const [dx, dy, rx, ry, sd] of [[-30, -28, 34, 24, 731], [26, 18, 30, 40, 732], [-36, 40, 18, 14, 733], [44, -44, 16, 12, 734]])\n    s += `<path d=\"${Sk.blob(VX + dx, VY + dy, rx, ry, sd)}\" fill=\"var(--sage)\"/>`;\n  s += P(Sk.ellipse(VX, VY, R, R, 735, .4), \"k\");\n  const turns = loops * p, N = Math.max(2, Math.ceil(turns * 64)), pts = [];\n  for (let i = 0; i <= N; i++){ const th = i / N * turns * Math.PI * 2 - Math.PI / 2, rr = R + 12 + 8.5 * (th + Math.PI / 2) / (Math.PI * 2); pts.push(f1(VX + Math.cos(th) * rr) + \" \" + f1(VY + Math.sin(th) * rr)); }\n  if (p > .001) s += `<path class=\"thread\" stroke-width=\"3.2\" d=\"M${pts.join(\"L\")}\"/>`;\n  s += T(VX, VY + 8, \"地球\", \"lab\", 'text-anchor=\"middle\"') + T(VX, VY - VR + (NR ? 44 : 38), \"红细胞排成的一排\", \"tm\", 'text-anchor=\"middle\"');\n  const done = Math.floor(turns + 1e-6);\n  s += `<rect x=\"${VX - (NR ? 120 : 100)}\" y=\"${VY + VR - (NR ? 54 : 46)}\" width=\"${NR ? 240 : 200}\" height=\"${NR ? 40 : 34}\" rx=\"10\" fill=\"var(--pane)\" opacity=\".92\"/>` +\n    T(VX, VY + VR - (NR ? 24 : 22), p >= 1 ? `绕 ${done} 圈多` : `绕了 ${done} 圈`, \"t\", 'text-anchor=\"middle\"');\n  return s;\n}\nfunction counterStatic(){\n  if (NR) return `<rect x=\"20\" y=\"478\" width=\"480\" height=\"150\" rx=\"16\" fill=\"var(--paper)\" opacity=\".6\"/>` +\n    P(Sk.line(30, 478, 490, 478, 900) + Sk.line(30, 628, 490, 628, 901) + Sk.line(260, 494, 260, 612, 902), \"k1\") +\n    T(140, 512, \"分了几次\", \"t\", 'text-anchor=\"middle\"') + T(380, 512, \"现在有\", \"t\", 'text-anchor=\"middle\"') + T(380, 612, \"个细胞\", \"t\", 'text-anchor=\"middle\"');\n  return `<rect x=\"560\" y=\"64\" width=\"216\" height=\"420\" rx=\"16\" fill=\"var(--paper)\" opacity=\".6\"/>` +\n    P(Sk.line(570, 64, 766, 64, 900) + Sk.line(570, 484, 766, 484, 901) + Sk.line(560, 74, 560, 474, 903) + Sk.line(776, 74, 776, 474, 904), \"k1\") +\n    T(668, 112, \"分了几次\", \"lab\", 'text-anchor=\"middle\"') + P(Sk.line(588, 262, 748, 262, 902), \"k1\") + T(668, 310, \"现在有\", \"lab\", 'text-anchor=\"middle\"') +\n    T(668, 446, \"个细胞\", \"lab\", 'text-anchor=\"middle\"');\n}\nfunction counterDyn(){\n  const { g } = divPhase(S.d), n = Math.pow(2, g);\n  if (NR) return T(140, 600, g, \"huge\", 'text-anchor=\"middle\"') + T(380, 570, fmtCount(n), \"cnt\", 'text-anchor=\"middle\"');\n  return T(668, 220, g, \"huge\", 'text-anchor=\"middle\"') + T(668, 392, fmtCount(n), \"cnt\", 'text-anchor=\"middle\"');\n}\nfunction barsSvg(){\n  const { g } = divPhase(S.d), n = Math.pow(2, g);\n  const [x0, W, y1, y2, lx] = NR ? [130, 370, 652, 698, 20] : [120, 390, 520, 566, 30];\n  const w1 = Math.max(3, W * n / MODEL.bodyCells);\n  return T(lx, y1 + 18, \"分出来的\", \"t\") + `<rect x=\"${x0}\" y=\"${y1}\" width=\"${f1(Math.min(W, w1))}\" height=\"26\" rx=\"5\" fill=\"var(--accent)\" opacity=\".85\"/>` +\n    T(lx, y2 + 18, \"你身体里\", \"t\") + `<rect x=\"${x0}\" y=\"${y2}\" width=\"${W}\" height=\"26\" rx=\"5\" fill=\"var(--sage)\" opacity=\".85\"/>` + P(Sk.line(x0, y2, x0 + W, y2, 910) + Sk.line(x0, y2 + 26, x0 + W, y2 + 26, 911) + Sk.line(x0 + W, y2, x0 + W, y2 + 26, 912), \"k1\") +\n    T(x0 + 10, y2 + 19, \"约 \" + fmtCount(MODEL.bodyCells), \"t\");\n}\nfunction readout3(){\n  const { g } = divPhase(S.d);\n  readout(`分了 <b>${g}<\/b> 次 · 现在 ${fmtCount(Math.pow(2, g))}个`);\n  Host.state({ station: 3, divisions: g, cells: Math.pow(2, g) });\n}\nfunction enter3(){\n  S.station = 3; S.mode = \"talk\"; S.d = S.dt = 0; S.band = -1; S.earth = false; head(3, \"细胞是活的\"); hint(\"\");\n  fitView(); render(); readout3();\n  say(\"舰长，我们凑近看你身体里的一个细胞。\");\n  next(\"然后呢？\", () => ask(\"alive-guess\", \"细胞是活的，还是像积木一样的零件？\", [\n    { label: \"是活的，会长大、会分开\", correct: true, feedback: \"你猜对了。我们看看它怎么分。\" },\n    { label: \"像积木， [];\n  for (let j = -4; j <= 4; j++) for (let i = -4; i <= 4; i++){\n    const core = Math.abs(i) <= 1 && Math.abs(j) <= 1;\n    if (!core && hash(i + 9, j + 9, 60) < .24) continue;   // 刮下来的细胞：大多挨在一起，中间有空隙\n    const x = (i + (j & 1 ? .5 : 0)) * 52 + (hash(i, j, 61) - .5) * 8, y = j * 45 + (hash(i, j, 62) - .5) * 8;\n    if (Math.hypot(x, y) > B + 30) continue;\n    const n = 5 + Math.floor(hash(i, j, 63) * 3), a0 = hash(i, j, 64) * 6.283, poly = [];\n    for (let k = 0; k < n; k++){ const a = a0 + k / n * 6.283, rk = 25 * (.76 + .3 * hash(i * 7 + k, j, 65)); poly.push([Math.cos(a) * rk, Math.sin(a) * rk]); }\n    CELLS.cheek.push({ x, y, poly, nx: (hash(i, j, 66) - .5) * 8, ny: (hash(i, j, 67) - .5) * 8, cand: Math.hypot(x, y) <= B - 26 });\n  }\n  CELLS.onion = [];\n  for (let j = -3; j <= 3; j++){\n    const off = (hash(j, 0, 44) - .5) * 150;\n    for (let i = -2; i <= 2; i++){\n      const x = off + i * 150, y = j * 44;\n      if (Math.abs(x) > B + 80 || Math.abs(y) > B + 22) continue;\n      const nx = (hash(i, j, 45) - .5) * 70, ny = (hash(i, j, 46) - .5) * 10;\n      CELLS.onion.push({ x, y, w: 146, h: 40, nx, ny, cand: Math.hypot(clamp(0, x - 73, x + 73), y) <= B - 30 });\n    }\n  }\n  const r = Sk.R(77), pts = [];\n  for (let k = 0; k < 22; k++){\n    let best = null, bg = -1e9;\n    for (let t = 0; t < 300; t++){   // 挑离别的红细胞最远的位置，互不重叠\n      const a = r() * Math.PI * 2, d = Math.sqrt(r()) * (B - 10), x = Math.cos(a) * d, y = Math.sin(a) * d;\n      const gap = pts.length ? Math.min(...pts.map(p => Math.hypot(p.x - x, p.y - y))) : 99;\n      if (gap > bg){ bg = gap; best = { x, y }; }\n    }\n    pts.push(best);\n  }\n  CELLS.blood = pts.map(p => ({ x: p.x, y: p.y, r: 17, cand: Math.hypot(p.x, p.y) <= B - 20 }));\n}\n// 一个格子在格子坐标（半径 118）里的中心\nconst cellCenter = (key, c) => key === \"onion\" ? [clamp(0, c.x - c.w / 2 + 14, c.x + c.w / 2 - 14), c.y] : [c.x, c.y];\nfunction tileSvg(key, cx, cy, R, pick, stain, id){\n  const k = R / 118, X = v => f1(cx + v *
