<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>好奇号 Curio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one navigation only — ribbon (tablet/desktop) or bottom bar (phone). Explorer = knowledge index. Centre = star chart / metro / tools. Note pane = the planet.
   Light = warm paper with ink drawings; dark = Obsidian night. */
:root{
  --bg:#F5F4EE; --pane:#FBFAF6; --side:#EFEDE5; --hover:#E7E4D9; --rule:#E0DCD0;
  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;
  --accent:#C2603F; --accent-soft:#F3E0D6; --on-accent:#FFFFFF;
  --c-math:#ECCDB6; --c-math-2:#D59E7A; --c-math-bg:#F2E1D3;
  --c-sci:#CCD6C0; --c-sci-2:#93A982; --c-sci-bg:#DCE3D2;
  --c-sky:#CFDCE6; --wash:#EFE4D6;
  --good:#3B7A56; --bad:#B4432E;
  --l1:#C2603F; --l2:#C9962A; --l3:#4F7FA8; --l4:#8E5B8A; --l5:#3E8C86; --l6:#D07A2E; --l7:#6E9A4E; --l8:#5D6B8A;
  --shadow:0 1px 2px rgba(31,30,28,.06),0 8px 28px rgba(31,30,28,.08);
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hand:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1E1E; --pane:#252525; --side:#1B1B1B; --hover:#2E2E2E; --rule:#353535;
  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;
  --accent:#A797F7; --accent-soft:#2D2943; --on-accent:#15121F;
  --c-math:#5A4536; --c-math-2:#9A7558; --c-math-bg:#33291F;
  --c-sci:#3C4836; --c-sci-2:#6F8560; --c-sci-bg:#28301F;
  --c-sky:#2D3B47; --wash:#2A2738; --good:#7CC79A; --bad:#EF8A72;
  --l1:#E08A6C; --l2:#E0B65A; --l3:#7FA8D0; --l4:#B98AB5; --l5:#6CB8B1; --l6:#E9A05F; --l7:#97C277; --l8:#93A0C2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1E1E; --pane:#252525; --side:#1B1B1B; --hover:#2E2E2E; --rule:#353535;
  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;
  --accent:#A797F7; --accent-soft:#2D2943; --on-accent:#15121F;
  --c-math:#5A4536; --c-math-2:#9A7558; --c-math-bg:#33291F;
  --c-sci:#3C4836; --c-sci-2:#6F8560; --c-sci-bg:#28301F;
  --c-sky:#2D3B47; --wash:#2A2738; --good:#7CC79A; --bad:#EF8A72;
  --l1:#E08A6C; --l2:#E0B65A; --l3:#7FA8D0; --l4:#B98AB5; --l5:#6CB8B1; --l6:#E9A05F; --l7:#97C277; --l8:#93A0C2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--ink);font-weight:600;line-height:1.3}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hand{font-family:var(--f-hand)}
.muted{color:var(--muted)}
.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.kq{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-linecap:round;vector-effect:non-scaling-stroke}
.f{fill:var(--icon-fill,var(--c-sci))}
.f2{fill:var(--icon-fill-2,var(--c-sci-2))}
.fa{fill:var(--accent)}
.fp{fill:var(--pane)}

/* ---------- workspace ---------- */
.app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "center" "nav"}
.ribbon,.explorer,.notepane,.statusbar{display:none}
.topbar{grid-area:top;display:flex;align-items:center;gap:4px;background:var(--side);border-bottom:1px solid var(--rule);
  padding-block:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.topbar .title{flex:1;font-family:var(--f-serif);font-weight:600;color:var(--ink);font-size:17px;padding-left:4px}
.ibtn{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--muted);position:relative}
.ibtn:hover{background:var(--hover);color:var(--ink)}
.ibtn[aria-current="page"],.ibtn[aria-expanded="true"]{color:var(--accent);background:var(--accent-soft)}
.ibtn svg{width:20px;height:20px}
.badge{position:absolute;top:4px;right:4px;min-width:15px;height:15px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10px;font-family:var(--f-mono);display:grid;place-items:center;padding:0 3px;line-height:1}
.bottomnav{grid-area:nav;display:grid;grid-template-columns:repeat(5,1fr);background:var(--side);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.bottomnav a,.bottomnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;color:var(--muted);text-decoration:none;font-size:11px;position:relative}
.bottomnav svg{width:22px;height:22px}
.bottomnav [aria-current="page"],.bottomnav [aria-expanded="true"]{color:var(--accent)}
.bottomnav .badge{top:6px;right:calc(50% - 20px)}
.center{grid-area:center;background:var(--pane);min-width:0;min-height:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto}
.statusbar{grid-area:status;align-items:center;gap:4px;background:var(--side);border-top:1px solid var(--rule);font-size:12px;color:var(--muted);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));min-height:30px;overflow-x:auto}
.statusbar .sp{flex:1}
.sitem{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;white-space:nowrap}
button.sitem:hover{background:var(--hover);color:var(--ink)}
.ribbon .sep{width:22px;height:1px;background:var(--rule);margin:6px 0}
@media (min-width:760px){
  .app{grid-template-columns:48px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"ribbon center" "status status"}
  .app.note-open{grid-template-columns:48px minmax(300px,1fr) minmax(400px,1.35fr);grid-template-areas:"ribbon center note" "status status status"}
  .topbar,.bottomnav{display:none}
  .ribbon{grid-area:ribbon;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:var(--side);border-right:1px solid var(--rule);padding-left:env(safe-area-inset-left,0px)}
  .ribbon .sp{flex:1}
  .app.note-open .notepane{display:block}
  .notepane{grid-area:note;position:relative;background:var(--pane);border-left:1px solid var(--rule);overflow:auto;padding-right:env(safe-area-inset-right,0px)}
  .statusbar{display:flex}
}
@media (min-width:1280px){
  .tree-btn{display:none!important}
  .app{grid-template-columns:48px 232px minmax(0,1fr);grid-template-areas:"ribbon explorer center" "status status status"}
  .app.note-open{grid-template-columns:48px 232px minmax(320px,1fr) minmax(460px,1.4fr);grid-template-areas:"ribbon explorer center note" "status status status status"}
  .explorer{grid-area:explorer;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--rule);overflow:auto}
}

/* ---------- explorer: knowledge index ---------- */
.vault{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.vault b{font-family:var(--f-serif);color:var(--ink);font-size:17px;font-weight:600;display:block;line-height:1.2}
.vault small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.xsearch{margin:6px 12px 4px;position:relative}
.xsearch input{width:100%;border:1px solid var(--rule);border-radius:8px;background:var(--pane);padding:6px 10px 6px 30px;font-size:13px;min-height:34px}
.xsearch svg{position:absolute;left:9px;top:9px;width:15px;height:15px;color:var(--muted)}
.tree{padding:4px 8px 16px;display:grid;gap:1px}
.tree .sec{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);padding:12px 8px 4px}
.tree .grp{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;color:var(--ink);font-size:13.5px;width:100%;text-align:left}
.tree .grp:hover{background:var(--hover)}
.tree .grp>svg{width:12px;height:12px;flex:none;transition:transform .15s;color:var(--muted)}
.tree .grp[aria-expanded="false"]>svg{transform:rotate(-90deg)}
.tree .grp .sw{width:8px;height:8px;border-radius:2px;flex:none}
.tree .grp .c{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tree .grp.band{font-weight:600}
.tree .leaf{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 34px;border-radius:6px;font-size:13.5px;color:var(--text);width:100%;text-align:left}
.tree .leaf:hover{background:var(--hover);color:var(--ink)}
.tree .leaf[aria-current="true"]{background:var(--hover);color:var(--ink);font-weight:500}
.tree .leaf .g{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.tree .ind{padding-left:22px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid var(--muted)}
.dot.lit{background:var(--ink);border-color:var(--ink)}
.dot.landed{border-color:var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.dot.ahead{border-style:dashed}
.xfoot{margin-top:auto;padding:10px 14px 16px;border-top:1px solid var(--rule);font-size:13px}
.xfoot a{color:var(--muted)}

/* ---------- view headers ---------- */
.vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-block:14px 6px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.vhead h1{font-family:var(--f-serif);font-size:24px}
.vhead .sub{font-size:13px;color:var(--muted)}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.crumb button{color:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--pane)}
.seg button{padding:6px 14px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--pane)}

/* ---------- star chart ---------- */
.graphwrap{position:absolute;inset:0;display:flex;flex-direction:column}
.graph{flex:1;min-height:0;position:relative}
.graph>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.graph.scroll{overflow:auto}
.graph.scroll>svg{position:static;height:auto;max-width:860px;margin:0 auto}
.cons,.node{cursor:pointer;transition:opacity .25s}
.cons .hit,.node .hit{fill:transparent}
.cons:hover .cname,.cons:focus-visible .cname{fill:var(--accent)}
.cons:focus-visible{outline:none}
.graph.focusing .cons:not(.nb){opacity:.25}
.graph.focusing .clink:not(.nb){opacity:.1}
.clink{transition:opacity .25s}
.lbl{font-family:var(--f-sans);font-size:14px;fill:var(--ink)}
.cname{font-family:var(--f-sans);font-size:14px;fill:var(--ink);font-weight:500;transition:fill .2s}
.cname.small{font-size:11.5px;font-weight:400;fill:var(--muted)}
.ccount{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.ring-lbl{font-family:var(--f-hand);font-size:15px;fill:var(--muted)}
.sector-lbl{font-family:var(--f-serif);font-size:18px;fill:var(--ink);font-weight:600}
.anno{font-family:var(--f-hand);font-size:17px;fill:var(--accent)}
.unit-lbl{font-family:var(--f-hand);font-size:16px;fill:var(--muted)}
.graph.narrow .lbl,.graph.narrow .cname{font-size:19px}.graph.narrow .cname.small{font-size:15px}.graph.narrow .ring-lbl{font-size:18px}.graph.narrow .anno{font-size:21px}.graph.narrow .ccount{font-size:14px}
.band-now{fill:none;stroke:var(--wash);opacity:.9}
.ping{fill:none;stroke:var(--accent);stroke-width:1.6;transform-box:fill-box;transform-origin:center}
.sel-ring{fill:none;stroke:var(--accent);stroke-width:2.2}
@media (prefers-reduced-motion:no-preference){.ping{animation:ping 2.6s ease-out infinite}@keyframes ping{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.9);opacity:0}}}

/* ---------- metro ---------- */
.metro{position:absolute;inset:0;display:flex;flex-direction:column}
.mscroll{flex:1;min-height:0;overflow:auto;position:relative}
.mscroll svg{display:block}
.station{cursor:pointer}
.station .hit{fill:transparent}
.station:hover .slbl,.station:focus-visible .slbl{fill:var(--accent)}
.station:focus-visible{outline:none}
.slbl{font-family:var(--f-sans);font-size:12.5px;fill:var(--ink)}
.slbl.dim{fill:var(--muted)}
.zone-lbl{font-family:var(--f-serif);font-size:14px;fill:var(--ink);font-weight:600}
.zone-sub{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.line-lbl{font-family:var(--f-sans);font-size:13px;fill:var(--ink);font-weight:500}
.cards{padding-block:6px 40px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.cards h2{font-size:15px;display:flex;align-items:center;gap:8px;font-family:var(--f-serif)}
.cards h2 i{width:18px;height:6px;border-radius:9px;display:inline-block}
.cards h2 small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted)}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin-top:10px}
.spec{border:1px solid var(--rule);border-radius:12px;background:var(--pane);padding:10px 10px 12px;display:grid;gap:2px;text-align:left;position:relative;transition:transform .15s,box-shadow .15s}
.spec:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.spec .no{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.spec svg{width:64px;height:64px;margin:2px auto 4px;display:block}
.spec b{font-size:13px;color:var(--ink);font-weight:500;line-height:1.35}
.spec small{font-size:11px;color:var(--muted)}
.spec.locked{background:transparent;border-style:dashed}
.spec.locked svg{filter:grayscale(1);opacity:.32}
.spec.locked b{color:var(--muted)}
.spec .stamp{position:absolute;top:8px;right:8px;font-family:var(--f-hand);font-size:12px;color:var(--accent);transform:rotate(8deg)}

/* ---------- note pane ---------- */
.note-x{position:sticky;top:10px;float:right;margin:10px 10px 0 0;z-index:2;background:var(--pane)}
@media (prefers-reduced-motion:no-preference){.app.note-open .notepane{animation:notein .22s cubic-bezier(.2,.8,.2,1)}@keyframes notein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}}
.note{padding-block:18px 40px;padding-left:22px;padding-right:22px;display:grid;gap:16px;max-width:760px;margin:0 auto}
@media (min-width:760px){.note{padding-inline:32px;padding-block:26px 48px;gap:18px}.note h1{font-size:30px}.signal-card{padding:20px 20px 20px 24px;grid-template-columns:1fr 128px}.signal-card svg{width:128px;height:128px}.signal-card p.q{font-size:21px}.taskrow{padding:12px 14px}}
.crumbs{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs span+span::before{content:"/";margin-right:6px;opacity:.6}
.note h1{font-family:var(--f-serif);font-size:26px}
.props{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;border-block:1px solid var(--rule);padding-block:10px}
.props dt{color:var(--muted)}
.props dd{margin:0;color:var(--ink);min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:0 9px;font-size:12px;background:var(--hover);color:var(--text);line-height:22px}
.pill.lit{background:var(--ink);color:var(--pane)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.meter{height:6px;border-radius:99px;background:var(--hover);overflow:hidden;margin-top:6px;max-width:180px}
.meter i{display:block;height:100%;background:var(--ink);border-radius:99px}
.signal-card{border-radius:14px;padding:16px 16px 16px 18px;display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:center;background:var(--card-bg,var(--c-sci-bg))}
.signal-card .eyebrow{font-size:12px;color:var(--text)}
.signal-card p.q{font-family:var(--f-serif);font-size:19px;line-height:1.45;color:var(--ink);font-weight:600;margin-top:4px}
.signal-card svg{width:100px;height:100px}
.note h2{font-family:var(--f-serif);font-size:17px;display:flex;align-items:center;gap:8px}
.note h2::before{content:"#";font-family:var(--f-mono);color:var(--muted);font-weight:400;font-size:14px}
.tasklist{display:grid;gap:8px}
.taskrow{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--rule);border-radius:12px;background:var(--pane)}
.taskrow svg{width:48px;height:48px}
.taskrow b{color:var(--ink);display:block;font-weight:500}
.taskrow small{color:var(--muted);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:9px;font-weight:500;font-size:14px;border:1px solid var(--rule);background:var(--pane);color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--pane)}
.btn.ink:hover{opacity:.88;background:var(--ink)}
.btn.big{min-height:46px;padding:0 20px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.links{display:flex;flex-wrap:wrap;gap:6px 10px}
.wikilink{color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:3px;font-size:14px}
.lenses{display:grid;gap:6px;font-size:14px}
.lenses div{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--rule)}
.lenses .b{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.lenses .on .b{color:var(--accent)}
details.parent summary{cursor:pointer;color:var(--muted);font-size:13px}
details.parent div{font-size:13px;margin-top:8px}
.capture{display:flex;gap:6px}
.capture input{flex:1;min-width:0;border:1px solid var(--rule);border-radius:9px;background:var(--bg);padding:8px 12px;min-height:40px}
.callout{border-radius:10px;padding:12px 14px;background:var(--callout-bg,var(--hover));display:grid;gap:4px}
.callout .ct{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--callout-ink,var(--ink));font-size:14px}
.callout.q{--callout-bg:var(--accent-soft);--callout-ink:var(--accent)}
.callout.tip{--callout-bg:var(--c-sci-bg)}

/* ---------- pages ---------- */
.page{max-width:820px;margin:0 auto;padding-block:22px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.hero{border-radius:16px;padding:22px 22px 22px 24px;display:grid;grid-template-columns:1fr 132px;gap:16px;align-items:center;background:var(--hero-bg,var(--c-sci-bg))}

.hero .actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.hero svg{width:132px;height:132px}
@media (max-width:520px){.hero{grid-template-columns:1fr 88px}.hero svg{width:88px;height:88px}.hero h1{font-size:25px}}
.empty{border:1.5px dashed var(--rule);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
.tickets{display:grid;gap:10px}
.ticket{display:grid;grid-template-columns:96px 1fr;gap:14px;border:1px solid var(--rule);border-radius:14px;padding:12px;background:var(--pane)}
.ticket .th{width:96px;height:72px;border-radius:8px;background:var(--hover);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px}

.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 28%,transparent);display:flex;align-items:flex-end;justify-content:center}

  padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

.drawer{position:fixed;top:0;bottom:0;left:0;z-index:35;width:min(300px,86vw);background:var(--side);border-right:1px solid var(--rule);overflow:auto;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);display:flex;flex-direction:column}
.pop{position:fixed;z-index:36;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));
  background:var(--pane);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:grid;gap:14px;max-height:74vh;overflow:auto}

}

<script>
"use strict";
/* ============================================================
   SKETCH — tiny hand-drawn line generator (deterministic, seeded). Shared with modules.
   ============================================================ */
function sketchLib(){
  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };
  const f=n=>Math.round(n*10)/10;
  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;
    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];
      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }
    return d; }
  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;
    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;
    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }
  function dline(x1,y1,x2,y2,seed,j){ return line(x1,y1,x2,y2,seed,j)+line(x1,y1,x2,y2,seed+97,(j==null?1:j)*.6); }
  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];
    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }
    return cr(p,false); }
  function blob(cx,cy,rx,ry,seed){ const r=R(seed), N=9, p=[]; for(let i=0;i<N;i++){ const t=i/N*Math.PI*2, k=1+(r()-.5)*.1; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); } return cr(p,true)+"Z"; }
  function rect(x,y,w,h,seed,j){ return line(x,y,x+w,y,seed,j)+line(x+w,y,x+w,y+h,seed+1,j)+line(x+w,y+h,x,y+h,seed+2,j)+line(x,y+h,x,y,seed+3,j); }
  function poly(pts,seed,closed,j){ let d=""; const n=pts.length; for(let i=0;i<(closed?n:n-1);i++){ const a=pts[i],b=pts[(i+1)%n]; d+=line(a[0],a[1],b[0],b[1],seed+i*3,j);} return d; }
  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }
  function area(pts){ return "M"+pts.map(q=>f(q[0])+" "+f(q[1])).join("L")+"Z"; }
  return {line,dline,ellipse,blob,rect,poly,curve,area,R};
}
const Sk = sketchLib();

/* ---------- hand-drawn illustrations (100×100 box) ---------- */
const P = (d,c)=>`<path class="${c||"k"}" d="${d}"/>`;
const wedge=(cx,cy,r,a0,a1)=>{ const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1); return `M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z`; };
const ICONS = {
  cake: s=>P(Sk.blob(54,56,34,34,s),"f")+`<path class="f2" d="${wedge(52,52,33,-Math.PI/2,Math.PI/6)}"/>`+P(Sk.ellipse(52,52,34,34,s+1))+P(Sk.line(52,52,52,18,s+2)+Sk.line(52,52,81,69,s+3)+Sk.line(52,52,23,69,s+4))+P(Sk.curve([[66,24],[72,14],[76,12]],s+5),"k1"),
  clock: s=>P(Sk.blob(53,57,32,32,s),"f")+P(Sk.ellipse(50,54,32,32,s+1))+P(Sk.line(50,54,50,33,s+2)+Sk.line(50,54,64,61,s+3))+P(Sk.line(50,24,50,29,s+4)+Sk.line(80,54,75,54,s+5)+Sk.line(50,84,50,79,s+6)+Sk.line(20,54,25,54,s+7),"k1")+P(Sk.ellipse(30,22,8,6,s+8)+Sk.ellipse(70,22,8,6,s+9),"k1"),

      case "ready": clearTimeout(readyTimer); send("init",{age_band:ageBand(),lang:"zh",phase:run.phase,palette:palette(),mastery:mastery(node.id)}); logEvent(Object.assign({verb:"started"},base)); break;

        if(p.verb==="observed"&&poe){ run.phase="explain"; drawPOE(); } break;

      case "resize": frame.style.height=Math.max(420,Math.min(2400,+p.h||0))+"px"; frame.style.minHeight="0"; break;
      default: logEvent(Object.assign({verb:"contract_warning",kind:"warn",result:{reason:"未知消息",type:m.type}},base)); } }
  window.addEventListener("message",onMsg);
  frame.srcdoc=srcdoc(MODULES[A.entry]);
  function drawPOE(){ const box=lab.querySelector("#poe"); if(!box) return; const P=A.predict, order=["predict","observe","explain","done"], cur=order.indexOf(run.phase);

          ${f&&b?`<p style="font-size:14px">你看到：亮度从「${esc(f.brightness)}」变成「${esc(b.brightness)}」，清楚程度从「${esc(f.sharpness)}」变成「${esc(b.sharpness)}」，像一直是「${esc(b.orientation)}」的。</p>`:""}
          <p style="font-size:14px;color:var(--ink)">${esc(A.explain)}</p>
          ${run.phase==="explain"?`<div class="field"><label for="refl">用一句话说说你发现了什么</label><textarea id="refl" maxlength="120" placeholder="我发现……"></textarea></div><button class="btn ink big" id="finP">写好了，完成实验</button>`
            :`<div style="display:flex;align-items:center;gap:8px;color:var(--good)"><svg class="drawn-check" width="28" height="28" viewBox="0 0 28 28"><path d="M5 15l6 6L23 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><b>实验完成，能量 +1</b></div>`}`:""}</div>`;
    box.querySelectorAll("[data-p]").forEach(o=>o.onclick=()=>{ run.prediction=+o.dataset.p; drawPOE(); });
    const lp=box.querySelector("#lockP"); if(lp) lp.onclick=()=>{ logEvent(Object.assign({verb:"predicted",result:{choice:P.options[run.prediction],correct:run.prediction===P.correct}},base)); run.phase="observe"; send("phase",{phase:"observe"}); drawPOE(); };

  if(poe) drawPOE();
  function finish(r){ if(run.phase==="done") return; run.phase="done";

    const tr=lab.querySelector("#toRep"); if(tr) tr.onclick=()=>{ wrong.forEach(w=>createRepair({source:"quiz",stem:w.stem,childAnswer:w.response,rightAnswer:w.right,node:node.id,misconception:w.misconceptionText})); close(); location.hash="#repair"; toast(`${wrong.length} 道题已送进维修舱`); }; }
}

        {id:"q3",stem:"涂色部分是这个长方形的 1/2 吗？",pic:bars,opts:["是","不是"],right:1,mis:{0:["not-equal-parts","没有平均分也叫几分之一"]},hints:["两块一样大吗？","几分之一的前提是「平均分」。","左边那块明显大很多。"]}];
      let i=0,score=0,lv=0,done=false; const app=document.getElementById("app");
      function render(fb){ const q=Q[i];
        app.innerHTML=`<div class="top"><span>第 ${i+1} / ${Q.length} 题</span><span>答对 ${score}</span></div><h2>${q.stem}</h2>${q.pic}<div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")}</div>${fb||""}
          <div class="row"><button class="btn" id="hb" ${done||lv>=3?"disabled":""}>要个提示${lv?`（已用 ${lv}）`:""}</button>${done?`<button class="btn ink" id="nx">${i<Q.length-1?"下一题":"完成挑战"}</button>`:""}</div>`;
        app.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>pick(+b.dataset.j)); const hb=document.getElementById("hb"); if(hb) hb.onclick=()=>Host.requestHint();
        const nx=document.getElementById("nx"); if(nx) nx.onclick=()=>{ if(i<Q.length-1){ i++; lv=0; done=false; render(); } else { Host.complete({score,total:Q.length}); app.innerHTML=`<h2>挑战完成，答对 ${score} / ${Q.length}</h2><p style="color:var(--muted)">结果已交回飞船。</p>`; } }; }
      function pick(j){ if(done) return; done=true; const q=Q[i], ok=j===q.right; if(ok) score++; const m=q.mis[j];
        Host.event("answered",{qid:q.id,correct:ok,response:q.opts[j],right:q.opts[q.right],stem:q.stem,misconception:m?m[0]:null,misconceptionText:m?m[1]:null,hintsUsed:lv});
        render(`<div class="fb">${ok?"答对了！":`正确答案是「${q.opts[q.right]}」。${m?`小心陷阱：${m[1]}。`:""}`}</div>`);
        app.querySelectorAll("[data-j]").forEach(b=>{ const k=+b.dataset.j; if(k===q.right) b.classList.add("right"); else if(k===j) b.classList.add("wrong"); b.disabled=true; }); }
      Host.on("hint",p=>{ lv=p.level; render(`<div class="fb h">提示 ${lv}：${Q[i].hints[Math.min(lv,3)-1]}</div>`); });
      Host.on("init",p=>{ if(p.palette) for(const k in p.palette) document.documentElement.style.setProperty("--"+k,p.palette[k]); render(); });
      Host.ready();
    }
  }
};

function intake(){

  const steps=()=>sm.innerHTML=STEPS.map((t,i)=>`<span class="${i+1===st.step?"on":""}">${i+1} ${t}</span>`).join("");
  function s1(){ st.step=1; steps(); box.innerHTML=`<p class="muted" style="font-size:14px">平板和手机上会直接打开相机。照片只在这台设备上处理，上传前会裁剪并遮住姓名。</p>

    box.querySelector("#sp").onclick=()=>{ const im=new Image(); im.onload=()=>{ st.img=im; st.sample=true; s2(); }; im.src=samplePhoto(); }; }

    box.innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="seg" role="group" aria-label="模式"><button id="mc" aria-pressed="${st.mode==="crop"}">框选题目</button><button id="mm" aria-pressed="${st.mode==="mask"}">遮挡姓名</button></div><button class="btn" id="rs">重来</button></div>
      <div class="cropper"><canvas id="cc"></canvas></div><p class="muted" style="font-size:13px">先拖出题目区域，再切到「遮挡姓名」把名字和班级涂掉。原图不会保存。</p>
      <div style="display:flex;justify-content:flex-end"><button class="btn ink big" id="n2">下一步：识别</button></div>`;
    const cc=box.querySelector("#cc"), cx=cc.getContext("2d"), k=Math.min(1,1000/st.img.width); cc.width=Math.round(st.img.width*k); cc.height=Math.round(st.img.height*k);
    if(!st.rect) st.rect={x:cc.width*.04,y:cc.height*.12,w:cc.width*.92,h:cc.height*.82};
    const paint=tmp=>{ cx.drawImage(st.img,0,0,cc.width,cc.height); const r=st.rect; cx.fillStyle="rgba(31,30,28,.5)"; cx.beginPath(); cx.rect(0,0,cc.width,cc.height); cx.rect(r.x,r.y+r.h,r.w,-r.h); cx.fill("evenodd");
      cx.strokeStyle="#C2603F"; cx.lineWidth=3; cx.setLineDash([10,7]); cx.strokeRect(r.x,r.y,r.w,r.h); cx.setLineDash([]); cx.fillStyle="#1F1E1C"; st.masks.concat(tmp?[tmp]:[]).forEach(q=>cx.fillRect(q.x,q.y,q.w,q.h)); };
    paint(); let drag=null, tmp=null; const pos=e=>{ const b=cc.getBoundingClientRect(); return {x:(e.clientX-b.left)*cc.width/b.width,y:(e.clientY-b.top)*cc.height/b.height}; };
    cc.onpointerdown=e=>{ cc.setPointerCapture(e.pointerId); drag=pos(e); };
    cc.onpointermove=e=>{ if(!drag) return; const p=pos(e), r={x:Math.min(drag.x,p.x),y:Math.min(drag.y,p.y),w:Math.abs(p.x-drag.x),h:Math.abs(p.y-drag.y)}; if(st.mode==="crop"){ st.rect=r; paint(); } else { tmp=r; paint(tmp); } };
    cc.onpointerup=()=>{ if(tmp&&tmp.w>6&&tmp.h>6) st.masks.push(tmp); tmp=null; if(st.rect.w<20||st.rect.h<20) st.rect={x:0,y:0,w:cc.width,h:cc.height}; drag=null; paint(); };
    box.querySelector("#mc").onclick=()=>{ st.mode="crop"; s2(); }; box.querySelector("#mm").onclick=()=>{ st.mode="mask"; s2(); }; box.querySelector("#rs").onclick=()=>{ st.rect=null; st.masks=[]; s2(); };
    box.querySelector("#n2").onclick=()=>{ const r=st.rect, out=document.createElement("canvas"), sc=Math.min(1,720/r.w); out.width=Math.round(r.w*sc); out.height=Math.round(r.h*sc); const o=out.getContext("2d");
      o.drawImage(st.img,r.x/k,r.y/k,r.w/k,r.h/k,0,0,out.width,out.height); o.fillStyle="#1F1E1C"; st.masks.forEach(q=>o.fillRect((q.x-r.x)*sc,(q.y-r.y)*sc,q.w*sc,q.h*sc));
      st.crop=out.toDataURL("image/jpeg",.82); st.img=null; s3(); }; }
  async function s3(){ st.step=3; steps(); box.innerHTML=`<img src="${st.crop}" alt="裁剪后的题目" style="border-radius:12px;max-height:260px;object-fit:contain;background:var(--hover)"><p class="muted" style="font-size:14px">原图已丢弃，只留这张裁剪图。正在识别……</p>`;

  function s4(){ st.step=4; steps(); const R=st.rec;

      <div class="callout ${R.needsEdit?"q":""}"><span class="ct">${R.needsEdit?"AI 网关还没接入，请手动填写":"识别结果（模拟），请核对"}</span></div>

      <div style="display:flex;justify-content:flex-end"><button class="btn ink big" id="n4">没问题，诊断错因</button></div>`;

  function s5(){ const D=st.diag, n=NODE[D.node];

function samplePhoto(){ const c=document.createElement("canvas"); c.width=900; c.height=640; const x=c.getContext("2d");
  x.fillStyle="#FBFAF6"; x.fillRect(0,0,900,640); x.strokeStyle="#DCE3EC"; for(let y=60;y<640;y+=36){ x.beginPath(); x.moveTo(0,y); x.lineTo(900,y); x.stroke(); }
  x.fillStyle="#333"; x.font="26px 'Noto Sans SC', sans-serif"; x.fillText("姓名：王小宇    班级：三（2）班",40,44);
  x.font="600 30px 'Noto Sans SC', sans-serif"; x.fillText("5. 圆被平均分成 4 份，涂色部分是这个圆的几分之几？",40,130);
  const cx=230,cy=340,R=130; for(let i=0;i<4;i++){ x.beginPath(); x.moveTo(cx,cy); x.arc(cx,cy,R,i*Math.PI/2-Math.PI/2,(i+1)*Math.PI/2-Math.PI/2); x.closePath(); x.fillStyle=i===0?"#9DB4D3":"#FBFAF6"; x.fill(); x.strokeStyle="#333"; x.lineWidth=3; x.stroke(); }
  x.fillStyle="#1F4FA8"; x.font="italic 64px serif"; x.fillText("1/3",520,370); x.strokeStyle="#D0342C"; x.lineWidth=7; x.beginPath(); x.moveTo(690,300); x.lineTo(770,390); x.moveTo(770,300); x.lineTo(690,390); x.stroke();
  return c.toDataURL("image/jpeg",.9); }

function renderGround(){
  const B=$("#groundPage");
  if(!unlocked){ B.innerHTML=`<div class="card" style="max-width:340px;margin:40px auto 0;text-align:center"><h3>家长入口</h3><p class="muted" style="font-size:13px">原型默认 PIN：1234</p><div class="pdots">${[0,1,2,3].map(i=>`<i class="${i<pin.length?"f":""}"></i>`).join("")}</div>
      <div class="pin">${[1,2,3,4,5,6,7,8,9,"",0,"删"].map(k=>k===""?"<span></span>":`<button data-k="${k}">${k}</button>`).join("")}</div></div>`;
    B.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; if(k==="删") pin=pin.slice(0,-1); else if(pin.length<4) pin+=k; if(pin.length===4){ if(pin===S.pin){ unlocked=true; } else toast("PIN 不对，再试一次"); pin=""; } renderGround(); }); return; }
  const R=S.rewardGoal, today=todayStr(), calls=S.ai.calls.filter(c=>c.at.slice(0,10)===today);
  // hand-drawn chart: learning events per day, last 7 days
  const days=[...Array(7)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-6+i); const k=todayStr(d); return [k,S.events.filter(e=>(e.ts||"").slice(0,10)===k&&e.node&&!e.kind).length]; });
  const mx=Math.max(4,...days.map(d=>d[1])), pts=days.map(([k,v],i)=>[40+i*70, 130-v/mx*100]);
  const chart=`<svg viewBox="0 0 500 170" width="100%" aria-label="近 7 天学习事件数"><path class="kq" d="${Sk.line(30,130,480,130,801,.4)}"/>`+
    `<path d="${Sk.area([...pts,[460,130],[40,130]])}" style="fill:var(--c-sci)" opacity=".7"/><path class="k" d="${Sk.curve(pts,802,.6)}"/>`+
    pts.map(([x,y],i)=>`<path class="k1" d="${Sk.ellipse(x,y,4,4,810+i)}" style="fill:var(--pane)"/><text x="${x}" y="152" text-anchor="middle" font-size="12" style="fill:var(--muted)" font-family="var(--f-sans)">${days[i][0].slice(8)}日</text>${days[i][1]?`<text x="${x}" y="${y-12}" text-anchor="middle" font-size="12" style="fill:var(--ink)" font-family="var(--f-mono)">${days[i][1]}</text>`:""}`).join("")+`</svg>`;
  B.innerHTML=`<div class="hero" style="--hero-bg:var(--c-sky)"><div><h1>指挥中心</h1><p>家长才能进。孩子看不到这里的入口提示。</p><div class="actions"><button class="btn" id="lk">锁上</button></div></div>${icon("ship",null,132,7)}</div>
    ${settingsCard()}
    <div class="card"><h3>近 7 天的探索</h3>${chart}<p class="muted" style="font-size:12px">按学习事件计数（预测、观察、作答、反思等）</p></div>
    <div class="grid2">
      <div class="card"><h3>奖励</h3>${R.status==="requested"?`<div class="callout q"><span class="ct">孩子申请兑换「${esc(R.name)}」</span><div><button class="btn ink" id="rd">确认已兑换</button></div></div>`:""}
        <div class="field"><label for="gn">下一份奖励</label><input type="text" id="gn" value="${esc(R.name)}" maxlength="18"></div><div class="field"><label for="gt">需要的点数</label><input type="number" id="gt" min="3" max="99" value="${R.target}"></div><div><button class="btn ink" id="gs">保存</button></div></div>
      <div class="card"><h3>任务库</h3><div class="chips">${S.tasks.map((t,i)=>`<span class="chip">${esc(t)} <button data-del="${i}" aria-label="删除 ${esc(t)}" style="margin-left:4px;color:var(--muted)">×</button></span>`).join("")}</div>
        <form id="tf" style="display:flex;gap:8px"><div class="field" style="flex:1"><input type="text" id="ti" placeholder="新任务" maxlength="6" aria-label="新任务"></div><button class="btn" type="submit">添加</button></form></div>
      <div class="card"><h3>AI 答疑 <span class="pill" style="font-weight:400">${S.ai.relay.url?"已填地址 · 还没接通":"模拟模式"}</span></h3>
        <p class="muted" style="font-size:13px">DeepSeek 的密钥不填在这里：它只放在中转服务自己的设置里，页面永远拿不到。这里填中转服务的地址和家庭口令。</p>
        <div class="field"><label for="ru">中转服务地址</label><input type="url" id="ru" inputmode="url" autocomplete="off" placeholder="https://…" value="${esc(S.ai.relay.url)}"></div>
        <div class="field"><label for="rp">家庭口令</label><input type="password" id="rp" autocomplete="off" value="${esc(S.ai.relay.passphrase)}"></div>
        <div class="field"><label for="cp">每天最多问几次</label><input type="number" id="cp" min="1" max="200" value="${S.ai.dailyCap}"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ink" id="cs">保存</button><button class="btn" id="rt" disabled title="中转服务做好之后才能用">连通测试</button></div>
        <dl class="kv"><dt>今日调用</dt><dd>${calls.length} / ${S.ai.dailyCap}</dd><dt>今日费用</dt><dd>¥0.00</dd></dl>
        <div class="log">${S.ai.calls.slice(-20).reverse().map(c=>`<div>${c.at.slice(5,16).replace("T"," ")} · ${c.capability}</div>`).join("")||"<div>还没有调用</div>"}</div></div>
      <div class="card"><h3>数据</h3><dl class="kv"><dt>学习事件</dt><dd>${S.events.length}</dd><dt>维修舱</dt><dd>${S.repairs.length}</dd><dt>信号</dt><dd>${S.questions.length}</dd><dt>数据版本</dt><dd>v${S.version}</dd></dl>
        <label class="toggle"><input type="checkbox" id="dbg" ${S.debug?"checked":""}>显示黑匣子（调试学习事件流）</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="ex">导出数据</button><button class="btn" id="rst">恢复示例数据</button></div><div id="eb"></div></div>
    </div>`;
  $("#lk").onclick=()=>{ unlocked=false; location.hash="#chart"; };
  const rd=$("#rd"); if(rd) rd.onclick=()=>{ S.rewardPoints=Math.max(0,S.rewardPoints-R.target); S.rewardHistory.push({name:R.name,date:today}); R.status="active"; save(); renderStatus(); renderGround(); toast("已兑换"); };
  $("#gs").onclick=()=>{ const n=$("#gn").value.trim(); if(!n) return; S.rewardGoal={name:n,target:Math.max(3,Math.min(99,+$("#gt").value||18)),status:R.status}; save(); renderGround(); toast("已保存"); };
  B.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ S.tasks.splice(+b.dataset.del,1); save(); renderGround(); });
  $("#tf").onsubmit=e=>{ e.preventDefault(); const t=$("#ti").value.trim(); if(t&&!S.tasks.includes(t)){ S.tasks.push(t); save(); renderGround(); } };
  $("#cs").onclick=()=>{ const u=$("#ru").value.trim();
    if(u&&!/^https:\/\/[^\s]+$/.test(u)){ toast("地址要以 https:// 开头"); return; }
    S.ai.relay={url:u.replace(/\/+$/,""),passphrase:$("#rp").value}; S.ai.dailyCap=Math.max(1,Math.min(200,+$("#cp").value||30)); save(); renderGround(); toast("已保存"); };
  bindSettings();
  $("#dbg").onchange=e=>{ S.debug=e.target.checked; save(); renderStatus(); };
  $("#ex").onclick=()=>{ const json=JSON.stringify(Object.assign({},S,{ai:Object.assign({},S.ai,{relay:{url:S.ai.relay.url,passphrase:S.ai.relay.passphrase?"(不导出)":""}}),repairs:S.repairs.map(r=>Object.assign({},r,{crop:r.crop?"(裁剪图略)":null}))}),null,2);
    $("#eb").innerHTML=`<textarea id="et" readonly style="font-family:var(--f-mono);font-size:12px;min-height:150px">${esc(json)}</textarea><button class="btn" id="cpy" style="margin-top:8px">复制</button>`;
    $("#cpy").onclick=()=>{ const ta=$("#et"); if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(()=>toast("已复制"),()=>{ ta.select(); toast("已选中，请手动复制"); }); else { ta.select(); toast("已选中，请手动复制"); } }; };
  $("#rst").onclick=()=>{ const b=$("#rst"); if(b.dataset.arm){ const keep={profile:S.profile,relay:S.ai.relay,pin:S.pin,dailyCap:S.ai.dailyCap}; S=seedState(); S.profile=keep.profile; S.ai.relay=keep.relay; S.ai.dailyCap=keep.dailyCap; S.pin=keep.pin; applyProfile(); save(); unlocked=true; renderStatus(); renderExplorer(); renderGround(); toast("已恢复示例数据"); } else { b.dataset.arm="1"; b.textContent="再点一次确认"; b.style.color="var(--bad)"; b.style.borderColor="var(--bad)"; } };
}
function openBlackBox(){ const was=$(".pop.box"); closePops(); if(was) return; const p=document.createElement("div"); p.className="pop right box";
  p.innerHTML=`<h3>黑匣子 · 学习事件流</h3><div class="log" style="max-height:52vh">${S.events.slice(-60).reverse().map(e=>`<div class="ev ${e.kind||""}"><span class="v">${esc(e.verb)}</span> <span class="muted">${esc((e.ts||"").slice(11,19))}${e.seed?" · 示例":""}</span><br><span class="muted">${esc(e.node||"")}${e.activity?" · "+esc(e.activity):""}</span>${e.result?`<br>${esc(JSON.stringify(e.result))}`:""}</div>`).join("")}</div>`;
  document.body.appendChild(p); }

/* boot */
renderExplorer(); renderStatus(); route();
</script>

</body>
</html>
