<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Curio</title>
<style>
/* 长按不选字、不弹菜单（#156）。输入框照常能选能改 */
html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* 平台 20 个通用色位由 kit/tokens.css 唯一维护（tools/kit.py sync） */
/* curio-tokens begin */
:root{
  --bg:#F5F4EE; --pane:#FBFAF6; --hover:#E7E4D9; --rule:#E0DCD0;
  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;
  --accent:#C2603F; --accent-soft:#F3E0D6;
  --grip:#2A7F7C; --grip-soft:#D3E8E5;
  --sage:#CCD6C0; --sage-bg:#DCE3D2; --sky:#CFDCE6; --apricot:#ECCDB6; --paper:#EFE4D6;
  --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1E1E; --pane:#252525; --hover:#2E2E2E; --rule:#353535;
  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;
  --accent:#A797F7; --accent-soft:#2D2943;
  --grip:#5FC4BE; --grip-soft:#1F3634;
  --sage:#3C4836; --sage-bg:#28301F; --sky:#2D3B47; --apricot:#5A4536; --paper:#2A2738;
  --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1E1E1E; --pane:#252525; --hover:#2E2E2E; --rule:#353535;
  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;
  --accent:#A797F7; --accent-soft:#2D2943;
  --grip:#5FC4BE; --grip-soft:#1F3634;
  --sage:#3C4836; --sage-bg:#28301F; --sky:#2D3B47; --apricot:#5A4536; --paper:#2A2738;
  --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;
  color-scheme:dark;
}
/* curio-tokens end */
:root{
  --side:#EFEDE5; --on-accent:#FFFFFF;
  --c-math:var(--apricot); --c-math-2:#D59E7A; --c-math-bg:#F2E1D3;
  --c-sci:var(--sage); --c-sci-bg:var(--sage-bg); --c-sci-2:#93A982;
  --c-sky:var(--sky); --wash:var(--paper); --gold:#E7B84A;
  --l1:#C2603F; --l2:#C9962A; --l3:#4F7FA8; --l4:#8E5B8A; --l5:#3E8C86; --l6:#D07A2E; --l7:#6E9A4E; --l8:#5D6B8A;
  --shadow:0 1px 2px rgba(31,30,28,.06),0 8px 28px rgba(31,30,28,.08);
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hand:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --side:#1B1B1B; --on-accent:#15121F;
  --c-math-2:#9A7558; --c-math-bg:#33291F; --c-sci-2:#6F8560; --gold:#D9AE4E;
  --l1:#E08A6C; --l2:#E0B65A; --l3:#7FA8D0; --l4:#B98AB5; --l5:#6CB8B1; --l6:#E9A05F; --l7:#97C277; --l8:#93A0C2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{
  --side:#1B1B1B; --on-accent:#15121F;
  --c-math-2:#9A7558; --c-math-bg:#33291F; --c-sci-2:#6F8560; --gold:#D9AE4E;
  --l1:#E08A6C; --l2:#E0B65A; --l3:#7FA8D0; --l4:#B98AB5; --l5:#6CB8B1; --l6:#E9A05F; --l7:#97C277; --l8:#93A0C2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2{margin:0;color:var(--ink);font-family:var(--f-serif);font-weight:600;line-height:1.3;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 手绘线稿：两种模式共用 */
.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.kq{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.fp{fill:var(--pane)}
.f{fill:var(--icon-fill,var(--c-sci))}
.f2{fill:var(--icon-fill-2,var(--c-sci-2))}
.fa{fill:var(--accent)}
.star-fill{fill:var(--gold)}
.star-half{fill:var(--c-math-2)}
.fig-shade{fill:var(--c-math)}
.fig-txt{fill:var(--ink);font-size:12px}

/* 外框 */
.app{min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.topbar{display:flex;align-items:center;gap:10px;background:var(--side);border-bottom:1px solid var(--rule);
  padding-block:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.topbar .logo{width:30px;height:30px;flex:none}
.topbar .title{font-family:var(--f-serif);font-weight:600;color:var(--ink);font-size:18px}
.top-prefs{margin-left:auto;display:flex;align-items:center;gap:2px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border-bottom:1px solid var(--rule);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner p{flex:1 1 240px}
.shell{flex:1;display:flex;min-height:0}
main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}

/* 导航（照原型的 .ribbon、.bottomnav，#233）：桌面左侧工具条，手机底部入口，只有一套。挑战、动手探索里不显示 */
.ribbon{display:none}
.ibtn{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--muted);position:relative;flex:none}
.ibtn:hover{background:var(--hover);color:var(--ink)}
.ibtn[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.ibtn svg{width:20px;height:20px}
.ribbon .sep{width:22px;height:1px;background:var(--rule);margin:6px 0}
.ribbon .sp{flex:1}
.ndot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.lock-hint{position:absolute;left:calc(100% + 8px);bottom:9px;white-space:nowrap;font-size:12px;line-height:22px;padding:0 8px;border-radius:99px;background:var(--accent-soft);color:var(--ink);z-index:20;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .15s}
.ibtn:hover .lock-hint,.ibtn:focus-visible .lock-hint{opacity:1}
.bottomnav{position:sticky;bottom:0;z-index:4;display:grid;grid-template-columns:repeat(4,1fr);background:var(--side);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.bottomnav a,.bottomnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;color:var(--muted);text-decoration:none;font-size:12px;position:relative}
.bottomnav svg{width:22px;height:22px}
.bottomnav [aria-current="page"],.bottomnav [aria-expanded="true"]{color:var(--accent)}
.bottomnav .ndot{top:8px;right:calc(50% - 17px)}
.explorer,.notepane{display:none}
@media (min-width:760px){
  .bottomnav{display:none}
  .ribbon{display:flex;flex:none;flex-direction:column;align-items:center;gap:4px;width:48px;padding:8px 0;background:var(--side);border-right:1px solid var(--rule);margin-left:env(safe-area-inset-left,0px);position:relative;z-index:6}
  /* 有工具条的页面：整页不滚，星图、索引、笔记各自滚；Curio 标识在索引顶上（照原型，桌面不显示顶栏） */
  .app:not(:has(main>:is(.quiz,.exploration,.stop))){height:100%}
  .app:not(:has(main>:is(.quiz,.exploration,.stop))) .topbar{display:none}
  .explorer{display:flex;flex-direction:column;flex:none;width:232px;background:var(--side);border-right:1px solid var(--rule);overflow:auto;overscroll-behavior:contain;padding-bottom:40px}
  .app.ex-closed .explorer{display:none}
}
.app:has(main>:is(.quiz,.exploration,.stop)) :is(.ribbon,.bottomnav,.explorer,.notepane){display:none!important}

/* 知识索引（照原型 .vault、.xsearch、.tree） */
.vault{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.vault .vlogo{width:34px;height:34px;flex:none}
.vault b{font-family:var(--f-serif);color:var(--ink);font-size:17px;font-weight:600;display:block;line-height:1.2}
.vault small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.xsearch{margin:6px 12px 4px;position:relative}
.xsearch input{width:100%;font:inherit;border:1px solid var(--rule);border-radius:8px;background:var(--pane);color:var(--ink);padding:6px 10px 6px 30px;font-size:14px;min-height:36px}
.xsearch svg{position:absolute;left:9px;top:10px;width:15px;height:15px;color:var(--muted)}
.xbar{display:flex;align-items:center;padding:2px 12px 2px}
.xfilter{font-size:12px;line-height:24px;padding:0 10px;border-radius:99px;border:1px solid var(--rule);background:var(--pane);color:var(--muted)}
.xfilter:hover{background:var(--hover);color:var(--ink)}
.xfilter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--pane)}
.tree{padding:4px 8px 16px;display:grid;gap:1px}
.tree :focus-visible{outline-offset:-2px}
.tree .sec{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);padding:12px 8px 4px}
.tree .grp{display:flex;align-items:center;gap:6px;padding:5px 8px;min-height:32px;border-radius:6px;color:var(--ink);font-size:13.5px;width:100%;text-align:left;line-height:1.35}
.tree .grp:hover{background:var(--hover)}
.tree .grp>svg{width:12px;height:12px;flex:none;color:var(--muted)}
.tree .grp[aria-expanded="false"]>svg{transform:rotate(-90deg)}
.tree .grp .sw{width:8px;height:8px;border-radius:2px;flex:none}
.tree .grp .gn{min-width:0}
.tree .grp .gb{color:var(--muted);font-size:11.5px}
.tree .grp .c{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);flex:none}
.tree .leaf{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 30px;min-height:32px;border-radius:6px;font-size:13.5px;color:var(--text);width:100%;text-align:left;line-height:1.35}
.tree .leaf:hover{background:var(--hover);color:var(--ink)}
.tree .leaf[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:500}
.tree .leaf[data-state="closed"] .lt{color:var(--muted)}
.tree .leaf .lstar{flex:none}
.tree .leaf .lt{min-width:0;flex:1}
.tree .leaf .alias{display:block;font-size:11px;color:var(--muted);font-weight:400}
.tree .leaf .g{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--muted);flex:none}
.tree .ind{padding-left:12px}
@media (prefers-reduced-motion:no-preference){.tree .grp>svg{transition:transform .15s}}
/* 手机：知识索引从左边滑出（照原型 openTree） */
.drawer-scrim{position:fixed;inset:0;z-index:34;background:color-mix(in srgb,var(--ink) 28%,transparent)}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:35;width:min(300px,86vw);background:var(--side);border-right:1px solid var(--rule);overflow:auto;overscroll-behavior:contain;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);display:flex;flex-direction:column}
.drawer:focus{outline:none}
@media (prefers-reduced-motion:no-preference){.drawer{animation:drawer-in .2s cubic-bezier(.2,.8,.2,1)}}
@keyframes drawer-in{from{transform:translateX(-100%)}to{transform:none}}

/* 星球笔记（照原型 .notepane、.sheet-note、.note）：只在星图和地铁页。手机是底部抽屉，平板宽度盖在右边，宽屏是右边一栏 */
.app.note-open:has(main>.chart) .notepane{display:block}
.notepane{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:80vh;overflow:auto;overscroll-behavior:contain;background:var(--pane);border-top:1px solid var(--rule);border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.notepane .grab{width:40px;height:4px;border-radius:9px;background:var(--rule);margin:8px auto 0}
@media (min-width:760px){
  .notepane{top:0;left:auto;width:min(420px,62vw);max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--rule);padding-left:0}
  .notepane .grab{display:none}
}
/* 地方够时（宽屏，或索引收起时）照原型把星图往左推，笔记占右边一栏；中等宽度打开笔记时自动收起索引，避免左右夹挤 */
@media (min-width:1200px){.notepane{position:relative;flex:0 0 clamp(340px,33vw,460px);box-shadow:none;z-index:1}}
@media (min-width:760px){.app.ex-closed .notepane{position:relative;flex:0 0 clamp(320px,42%,460px);width:auto;box-shadow:none;z-index:1}}
@media (prefers-reduced-motion:no-preference){
  .app.note-open .notepane{animation:sheetin .24s cubic-bezier(.2,.8,.2,1)}
  @media (min-width:760px){.app.note-open .notepane{animation-name:notein}}
}
@keyframes notein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.close{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.close:hover{background:var(--hover);color:var(--ink)}
.note-x{position:sticky;top:10px;float:right;margin:10px 10px 0 0;z-index:2;background:var(--pane)}
.note{padding:18px 20px 40px;display:grid;gap:16px;max-width:760px;margin:0 auto;color:var(--text)}
@media (min-width:760px){.note{padding:24px clamp(16px,2.2vw,28px) 48px;gap:18px}.note h1{font-size:28px!important}}
.note h1{font-size:24px}
.note h1:focus{outline:none}
.crumbs{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;padding-right:40px}
.crumbs span+span::before{content:"/";margin-right:6px;opacity:.6}
.props{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px;border-block:1px solid var(--rule);padding-block:10px;margin:0}
.props dt{color:var(--muted)}
.props dd{margin:0;color:var(--ink);min-width:0}
.props .lsw{display:inline-block;width:14px;height:5px;border-radius:9px;vertical-align:middle;margin-right:6px}
.links{display:flex;flex-wrap:wrap;gap:6px 10px}
.wikilink{color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:3px;font-size:14px}
/* 信号卡、任务、图鉴提示、不同年龄看到的样子（照原型 .signal-card、.taskrow、.minispec、.lenses） */
.signal-card{border-radius:14px;padding:16px 16px 16px 18px;color:var(--ink);display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:center}
.signal-card .eyebrow{font-size:12px;color:var(--text)}
.signal-card p.dq{font-family:var(--f-serif);font-size:19px;line-height:1.45;color:var(--ink);font-weight:600;margin-top:4px}
.signal-card svg{width:100px;height:100px}
@media (max-width:420px){.signal-card{grid-template-columns:1fr 72px}.signal-card svg{width:72px;height:72px}}
@media (min-width:760px){.signal-card{padding:20px 20px 20px 24px}}
.minispec{display:flex;gap:10px;align-items:center;border:1px dashed var(--rule);border-radius:10px;padding:8px 10px}
.minispec svg{width:40px;height:40px;flex:none}
.minispec>div{flex:1;min-width:0}
.minispec.locked svg{filter:grayscale(1);opacity:.35}
.minispec b{display:block;font-size:13px;color:var(--ink);font-weight:600}
.minispec small{display:block;color:var(--muted);font-size:12px}
.spec-go{flex:none;white-space:nowrap;font-size:13px}
.lenses{display:grid;gap:6px;font-size:14px}
.lenses div{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--rule)}
.lenses .b{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.lenses .on .b{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .drawin .k,.drawin .k1{stroke-dasharray:400;animation:drawin 1.1s ease-out both}
  @keyframes drawin{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
}
.note h2{font-size:17px;display:flex;align-items:center;gap:8px}
.note h2::before{content:"#";font-family:var(--f-mono);color:var(--muted);font-weight:400;font-size:14px}
.tasklist{display:grid;gap:8px}
.taskrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--rule);border-radius:12px;background:var(--pane)}
.taskrow svg{width:44px;height:44px}
@media (min-width:760px){.taskrow{padding:11px 12px}}
.taskrow b{color:var(--ink);display:block;font-weight:500;line-height:1.35;text-wrap:balance}
.taskrow small{color:var(--muted);font-size:12.5px}
.taskrow .btn{padding:0 14px;flex:none;white-space:nowrap}
.callout{border-radius:10px;padding:12px 14px;background:var(--hover);display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.callout svg{flex:none;margin-top:3px}

/* 知识地铁（#233）：照原型的 .metro、.mscroll、.station；站的样子和星图同一套（chartStar） */
.app:has(main>.metro){height:100%}
main:has(>.metro){overflow:hidden}
.mscroll{flex:1;min-height:200px;overflow:auto;position:relative;overscroll-behavior:contain}
.mscroll>svg{display:block}
.station,.lline{cursor:pointer}
.station .hit,.lline .hit{fill:transparent}
.station:hover .slbl,.station:focus-visible .slbl{fill:var(--accent)}
.station:focus-visible,.lline:focus-visible{outline:none}
.station:focus-visible .hit,.lline:focus-visible .hit{stroke:var(--accent);stroke-width:2.5}
.lline[aria-pressed="true"] .line-lbl{fill:var(--accent)}
.slbl{font-family:var(--f-sans);font-size:12.5px;fill:var(--ink)}
.slbl.dim{fill:var(--muted)}
.zone-now{fill:var(--wash);pointer-events:none}
.zone-lbl{font-family:var(--f-serif);font-size:14px;fill:var(--ink);font-weight:600}
.zone-lbl.here{fill:var(--accent)}
.zone-cut{stroke-width:1.6}
.zone-sub{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.line-lbl{font-family:var(--f-sans);font-size:13px;fill:var(--ink);font-weight:500}
.hand{font-family:var(--f-hand)}
.inter-ring{fill:var(--pane);stroke:var(--ink);stroke-width:2}
/* 站在线上留一小段纸色：没开放的站（不填色的虚线星）和在星图上一样看得清 */
.station-gap{fill:var(--pane)}
.station .sel-ring{fill:none}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--bg)}
.seg button{padding:5px 13px;font-size:13px;color:var(--muted);min-height:32px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--pane);font-weight:500}
.cards{padding:8px max(18px,env(safe-area-inset-right,0px)) 40px max(18px,env(safe-area-inset-left,0px));display:grid;gap:22px}
.card-sec h2{font-size:15px;display:flex;align-items:center;gap:8px;font-family:var(--f-serif)}
.card-sec h2 i{width:18px;height:6px;border-radius:9px;display:inline-block}
.card-sec h2 small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted)}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:10px}
.spec{border:1px solid var(--rule);border-radius:12px;background:var(--bg);padding:10px 10px 12px;display:grid;gap:3px;text-align:left;position:relative}
.spec:hover{background:var(--hover);border-color:var(--ink)}
.spec.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.spec .no{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.spec svg{width:64px;height:64px;margin:2px auto 4px;display:block}
.spec b{font-size:13px;color:var(--ink);font-weight:500;line-height:1.35}
.spec small{font-size:11.5px;color:var(--muted)}
.spec.locked{background:transparent;border-style:dashed}
.spec.locked svg{filter:grayscale(1);opacity:.35}
.spec.locked b{color:var(--muted)}
.spec .stamp{position:absolute;top:8px;right:8px;font-family:var(--f-hand);font-size:12px;color:var(--accent);transform:rotate(8deg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--ink);background:var(--pane);color:var(--ink);font-size:16px}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.ink{background:var(--ink);color:var(--pane)}
.btn.ink:hover:not(:disabled){background:var(--text)}
.btn.big{min-height:52px;font-size:17px;padding:0 24px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.btns.center{justify-content:center}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:0 10px;font-size:13px;background:var(--hover);color:var(--text);line-height:24px}
.pill.lit{background:var(--ink);color:var(--pane)}

/* 星图（#230）：照原型首页主题形状试玩版（?shapes=1）的样子 */
.chart{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--pane)}
.vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;flex-wrap:wrap;padding-block:14px 6px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.vhead h1{font-size:24px}
.vhead h1:focus{outline:none}
.sub{color:var(--muted);font-size:14px}
.crumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);flex-wrap:wrap;margin-left:-6px}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:4px}
.graph{flex:1;min-height:300px;position:relative}
.graph>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.graph.scroll{flex:none;min-height:0;padding:0 max(6px,env(safe-area-inset-right,0px)) 8px max(6px,env(safe-area-inset-left,0px))}
.graph.scroll>svg{position:static;display:block;width:100%;height:auto;max-width:860px;margin:0 auto}
/* 手机竖屏：图是方的，不留上下大片空白 */
@media (max-width:619px){.graph:not(.scroll){flex:none;width:100%;aspect-ratio:1/1;min-height:0}}
.grade-hint{font-size:13px;color:var(--muted);padding:2px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.cons,.node{cursor:pointer;transition:opacity .25s}
.cons .hit,.node .hit{fill:transparent}
.cons:hover .cname,.cons:focus-visible .cname{fill:var(--accent)}
.cons:focus-visible{outline:none}
.cons:focus-visible .hit,.node:focus-visible .hit{stroke:var(--accent);stroke-width:2.5;vector-effect:non-scaling-stroke}
.node:focus-visible{outline:none}
.graph.focusing .cons:not(.nb){opacity:.25}
.graph.focusing .clink:not(.nb){opacity:.1}
.clink{transition:opacity .25s}
.lbl{font-family:var(--f-sans);font-size:14px;fill:var(--ink)}
.lbl.muted-lbl{fill:var(--muted)}
.cname{font-family:var(--f-sans);font-size:14px;fill:var(--ink);font-weight:500;transition:fill .2s}
.cname.small{font-size:11.5px;font-weight:400;fill:var(--muted)}
.ccount{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.ring-lbl{font-family:var(--f-hand);font-size:15px;fill:var(--muted)}
.sector-lbl{font-family:var(--f-serif);font-size:18px;fill:var(--ink);font-weight:600}
.anno{font-family:var(--f-hand);font-size:17px;fill:var(--accent)}
.unit-lbl{font-family:var(--f-hand);font-size:16px;fill:var(--muted)}
.graph.narrow .lbl,.graph.narrow .cname{font-size:19px}.graph.narrow .cname.small{font-size:15px}.graph.narrow .ring-lbl{font-size:18px}.graph.narrow .anno{font-size:21px}.graph.narrow .ccount{font-size:14px}
.band-now{fill:none;stroke:var(--wash);opacity:.9}
.sel-ring{fill:none;stroke:var(--accent);stroke-width:2.2}
.spark{stroke:var(--accent)}
/* 四种样子：点亮（金色实心加光芒）、探过（半边填色）、未探（实线空心）、未开放（淡墨虚线，不填色） */
.shape-stroke{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-opacity:.76;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.shape-face{fill:var(--bg)}
.shape-mark.lit .shape-face{fill:var(--l2)}
.shape-half{fill:var(--l2)}
.shape-outline,.star-rays{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shape-mark.untouched .shape-outline{stroke:var(--muted)}
.shape-mark.closed .shape-outline{stroke:var(--muted);stroke-opacity:.7;stroke-width:1.3;stroke-dasharray:3 2.6}

/* 星图详情里的星（照原型 renderConstellation）：暖色实心加 ✓、实线圆加进度弧、淡墨空心圆；未开放是更淡的虚线空心圆 */
.dmark.closed{opacity:.6}
.dot.lit{fill:var(--ink)}
.dot.explored{fill:var(--pane);stroke:var(--ink);stroke-width:1.2}
.dot.untouched{fill:var(--pane);stroke:var(--muted);stroke-width:1.2}
.dot.closed{fill:none;stroke:var(--muted);stroke-width:1;stroke-opacity:.8;stroke-dasharray:1.3 1.3}
.shape-overview .shape-stroke{stroke-width:1.4;stroke-opacity:.94}
.shape-overview .shape-point .shape-outline{stroke-width:.9;vector-effect:non-scaling-stroke}
.shape-overview .shape-point .shape-mark.closed .shape-outline{stroke-width:1.25;stroke-dasharray:2 1.4;stroke-opacity:.85}
.shape-overview #gsvg>path.kq{stroke-width:.8;stroke-opacity:.48}
.shape-overview .cname,.shape-overview .ring-lbl,.shape-overview .ccount,.shape-overview .anno{paint-order:stroke;stroke:var(--pane);stroke-width:2px;stroke-linejoin:round}
.chart-foot{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;margin-top:6px;padding:0 12px max(6px,env(safe-area-inset-bottom,0px))}
.chart-note{text-align:center;font-size:12px}
.clean-hint{position:relative;margin-top:8px;font-size:16px;text-align:center;padding:0 12px}
.clean-hint a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;text-decoration-thickness:2px}
.banner-btns{display:flex;gap:10px;flex-wrap:wrap}

/* 家长页（backup.md 第 10 节） */
.parent{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default} /* 家长页照常能选字（复制恢复密钥等，#156） */
.parent{width:100%;max-width:720px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.p-head{display:flex;align-items:center;gap:12px}
.p-head h1{font-size:24px}
.p-head h1:focus{outline:none}
a.back{text-decoration:none}
.card{background:var(--pane);border:1px solid var(--rule);border-radius:18px;padding:18px 20px;margin-top:14px;box-shadow:var(--shadow);color:var(--ink)}
.card h2{font-size:20px;margin-bottom:8px}
.card p+p{margin-top:6px}
.card.main-card{border:1.5px solid var(--ink)}
.card.warn-card{background:var(--bad-soft);border-color:transparent}
.card.good-card{background:var(--good-soft);border-color:transparent}
.btns.start{justify-content:flex-start}
.card .btns+p{margin-top:10px}
a.btn{text-decoration:none}
.p-stat{font-size:18px}
.p-stat .loud{color:var(--bad)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.p-msg{margin-top:12px;background:var(--bad-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:600}
.p-ok{margin-top:12px;background:var(--good-soft);color:var(--ink);border-radius:12px;padding:10px 14px}
.p-busy{font-size:18px;padding:12px 0}
.p-note{margin-top:18px;line-height:1.7}
.p-form{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.p-label{font-weight:600;color:var(--ink);margin-top:8px}
.p-input{font:inherit;font-family:var(--f-mono);font-size:24px;letter-spacing:.08em;max-width:280px;min-height:52px;padding:8px 14px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink)}
.p-select{font:inherit;font-size:17px;width:100%;max-width:320px;min-height:48px;padding:6px 12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink)}
.p-row{align-items:center}
.p-aside{color:var(--muted);flex:1 1 180px}
.p-confirm{margin-top:14px;background:var(--bad-soft);color:var(--ink);border-radius:12px;padding:12px 14px}
#profileCard:focus{outline:none}
.p-file{font:inherit;font-size:16px;max-width:100%;padding:8px 0;color:var(--ink)}
.p-file::file-selector-button{font:inherit;min-height:44px;padding:0 16px;margin-right:12px;border-radius:12px;border:1.5px solid var(--ink);background:var(--pane);color:var(--ink);cursor:pointer}
.p-list{margin:8px 0 0;padding-left:1.3em;font-size:17px}
.keybig{font-size:clamp(46px,13vw,76px);line-height:1.2;letter-spacing:.06em;text-align:center;color:var(--ink);background:var(--bg);border:2px dashed var(--muted);border-radius:16px;padding:18px 8px;margin-bottom:12px;white-space:nowrap}
#printSheet{display:none}
@media print{
  .app{display:none!important}
  #printSheet{display:block;color:#000;font-family:var(--f-sans);padding:24px}
  #printSheet h1{font-size:22px;color:#000}
  #printSheet .print-key{font-family:var(--f-mono);font-size:56px;letter-spacing:.08em;margin:18px 0}
}
.toast{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--pane);border-radius:12px;padding:8px 16px;font-size:15px;max-width:90%;text-align:center;box-shadow:var(--shadow)}

/* 在星上选择活动，进入后把可用宽度留给实物。 */
.activity-menu,.exploration{width:100%;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.activity-menu{position:relative;max-width:760px}
.activity-menu h1{font-size:clamp(24px,4vw,34px);margin:18px 0 24px}
.activity-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:14px}
.activity-option{display:grid;text-align:left;align-content:start;gap:8px;border:1px solid var(--rule);border-radius:18px;padding:18px 20px;background:var(--pane);color:var(--ink)}
.activity-option:hover{border-color:var(--ink)}
.activity-option strong{font-family:var(--f-serif);font-size:20px}
.activity-meta{font-size:14px;color:var(--muted)}
.activity-go{margin-top:12px}
.exploration{max-width:900px;padding-top:6px;padding-bottom:20px}
/* 手机上实物比一屏长；退出始终在屏上，免得在滑回页首时错触实物。 */
main:has(>.exploration){overflow:visible}
.exploration .quiz-head{position:sticky;top:0;z-index:1;background:var(--bg);padding-block:4px;margin-bottom:4px}
.exploration .quiz-head h1{font-size:19px}
.exploration .quiz-head .sub{font-size:13px}
.workbench iframe{display:block;width:100%;border:0}
.explore-status{background:var(--pane);border-radius:12px;padding:12px 16px}
@media (max-width:520px){.exploration{padding-left:0;padding-right:0}.exploration .quiz-head{padding:6px 12px}.activity-menu h1{margin:10px 0 16px}}

/* 挑战 */
.quiz{width:100%;max-width:760px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.quiz-head{display:flex;align-items:center;gap:12px}
.quiz-head h1{font-size:21px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 6px;border-radius:10px;color:var(--muted);font-size:15px}
.back:hover{background:var(--hover);color:var(--ink)}
.prog{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;margin:12px 0 4px;font-family:var(--f-mono)}
.prog i{display:inline-block;width:22px;height:8px;border-radius:4px;background:var(--rule)}
.prog i.on{background:var(--ink)}
.prog span{margin-left:6px}
.q{background:var(--pane);border:1px solid var(--rule);border-radius:18px;padding:18px;margin-top:12px;box-shadow:var(--shadow)}
.figbox{background:var(--bg);border-radius:12px;padding:8px;margin-bottom:12px;display:flex;justify-content:center}
.fig{display:block;width:100%;max-width:340px;height:auto}
.fig-missing{color:var(--muted);font-size:15px}
.stem{font-size:19px;color:var(--ink);font-weight:600;line-height:1.6}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.choice{display:flex;align-items:center;gap:4px;text-align:left;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 16px;min-height:54px;font-size:18px;width:100%}
.choice:hover:not(:disabled){background:var(--hover)}
.choice.wrong{border-color:var(--bad);color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.choice.right{border-color:var(--good);background:var(--good-soft);font-weight:600}
.choice:disabled:not(.wrong):not(.right){opacity:.7}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.92em;margin:0 .15em;font-variant-numeric:tabular-nums}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.frac>span:last-child{padding:0 .2em}
.choice.wrong .frac{text-decoration:line-through}
.bub{display:flex;gap:10px;align-items:center;border-radius:16px;padding:12px 16px;margin-top:12px;color:var(--ink)}
.bub.good{background:var(--good-soft)}
.bub.bad{background:var(--bad-soft);display:block}
.bub:focus{outline:none}.bub:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.result h2:focus{outline:none}
.bub .mini{width:30px;height:30px;flex:none}
.save{margin-top:12px;font-size:15px}
.save.bad{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bad-soft);color:var(--ink);border-radius:14px;padding:10px 14px}
/* 1b：数字框、分数框、提示、看答案 */
.ansrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.numbox{width:132px;font:inherit;font-size:22px;font-variant-numeric:tabular-nums;text-align:center;padding:8px 10px;min-height:52px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink)}
.numbox:disabled{opacity:.6}
.unit{font-size:20px;color:var(--ink)}
.fracbox{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.fracbox .numbox{width:96px}
.fracline{display:block;width:112px;height:0;border-top:2px solid var(--ink);border-radius:2px}
.ansrow.done{min-height:52px}
.ansval{display:inline-flex;align-items:center;gap:6px;font-size:22px;padding:6px 16px;min-height:52px;border-radius:12px;border:1.5px solid var(--good);background:var(--good-soft);color:var(--ink);font-weight:600}
.hints{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.bub.hint{background:var(--c-sky);display:block}
.bub.hint .tag{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.bub.reveal{background:var(--wash);display:block}
.btns.tools{justify-content:flex-start}
.btns.tools .btn{gap:6px}

.result{text-align:center;background:var(--pane);border:1px solid var(--rule);border-radius:20px;padding:24px 18px;margin-top:16px;box-shadow:var(--shadow)}
.result-star{display:flex;justify-content:center;margin-bottom:6px}
.result h2{font-size:22px;margin-bottom:6px}

/* 领航员（docs/specs/navigators.md 第 1、5 节）：脸只用十个类 k、k1、f-*，颜色取外壳的变量，深浅色共用一套线稿；线稿跟着脸一起缩放 */
.navsvg{display:block;overflow:visible}
.navsvg .k,.navsvg .k1{vector-effect:none}
.navsvg .f-ink{fill:var(--ink)} .navsvg .f-pane{fill:var(--pane)} .navsvg .f-sky{fill:var(--c-sky)} .navsvg .f-sage{fill:var(--c-sci)}
.navsvg .f-apricot{fill:var(--c-math)} .navsvg .f-paper{fill:var(--wash)} .navsvg .f-muted{fill:var(--muted)} .navsvg .f-accent{fill:var(--accent)}
.vtitle{display:flex;align-items:center;gap:8px}
.nav-ava{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;margin-left:-6px;background:var(--bg);border:1.5px solid var(--rule)}
.nav-ava:hover{border-color:var(--ink)}
.nav-ava .navsvg{width:44px;height:44px}
.pick{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;width:100%;max-width:680px;margin:0 auto;
  padding:28px max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px))}
.pick h1:focus{outline:none}
.pick-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2.5vw,18px);width:100%}
.nav-card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;border:1.5px solid var(--rule);border-radius:20px;background:var(--pane);color:var(--ink);padding:16px clamp(8px,2vw,16px) 16px}
button.nav-card:hover{border-color:var(--ink)}
.nav-card.on{border:2px solid var(--ink);box-shadow:var(--shadow)}
.nav-card:focus{outline:none}.nav-card:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.card-face{width:clamp(92px,24vw,150px);height:auto;aspect-ratio:1/1}
.nc-name{font-family:var(--f-serif);font-size:22px;font-weight:600;line-height:1.3}
.nc-intro{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:8px 12px;font-size:15px;line-height:1.55;color:var(--ink);width:100%;text-wrap:pretty}
@media (max-width:420px){.nc-intro{font-size:14px;padding:6px 8px}.nc-name{font-size:20px}}
.pick-line{font-size:18px;color:var(--ink);text-align:center;text-wrap:balance}
.pick .btns{margin-top:0;min-height:52px}
.pick-msg{background:var(--bad-soft);color:var(--ink);border-radius:12px;padding:8px 14px;margin-top:10px;text-align:center}
.with-you{display:inline-flex;align-items:center;border-radius:99px;padding:0 12px;line-height:26px;font-size:14px;background:var(--ink);color:var(--pane);margin-top:2px}
.cabin-scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 28%,transparent)}
.cabin{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 20px));max-height:calc(100dvh - 20px);overflow:auto;overscroll-behavior:contain;
  background:var(--bg);border:1px solid var(--rule);border-radius:20px;box-shadow:var(--shadow);padding:12px clamp(10px,3vw,18px) 18px}
.cabin:focus{outline:none}
.cabin-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cabin-head h2{font-size:20px}
.cabin .card-face{width:clamp(80px,20vw,112px)}
.cabin .nav-card.still{opacity:.92}
.cabin-note{margin-top:12px;text-align:center;color:var(--muted);font-size:15px}
.pilot{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.pilot-face{width:46px;height:46px;flex:none;margin-top:2px}
.pilot-says{flex:1;min-width:0}
.pilot-says>:first-child{margin-top:0}
@media (prefers-reduced-motion:no-preference){
  .nav-card.on .card-face{animation:nav-pop .32s cubic-bezier(.2,.8,.3,1)}
  .cabin{animation:cabin-in .18s ease-out}
}
@keyframes nav-pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:none}}
@keyframes cabin-in{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}

.stop{max-width:520px;margin:12vh auto 0;text-align:center;padding:0 20px}
.stop-art{display:flex;justify-content:center;margin-bottom:12px}
.stop h1{font-size:22px;margin-bottom:8px}

@media (prefers-reduced-motion:no-preference){
  .choice,.btn,.back{transition:background-color .15s,border-color .15s,transform .08s}
  .choice:active:not(:disabled),.btn:active:not(:disabled),.back:active{transform:scale(.98)}
  /* 点亮动效：一共 1.2 秒（规格 6.4：不超过 1.5 秒）；reduced-motion 时没有这些规则，直接是亮的样子 */
  .result-star.lighting svg{animation:light-pop 1.2s cubic-bezier(.2,.8,.3,1) both;transform-origin:50% 52%}
  .result-star.lighting .star-fill{animation:light-fill .8s ease-out .15s both}
  .result-star.lighting .ray{animation:light-ray .45s ease-out .75s both}
}
@keyframes light-pop{0%{transform:scale(.72) rotate(-10deg)}55%{transform:scale(1.12) rotate(3deg)}100%{transform:none}}
@keyframes light-fill{from{fill:var(--pane)}to{fill:var(--gold)}}
@keyframes light-ray{from{opacity:0}to{opacity:1}}
@media (min-width:760px){
  .vhead h1{font-size:28px}
  .stem{font-size:20px}
}
</style>
</head>
