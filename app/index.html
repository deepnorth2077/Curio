<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>好奇号 Curio</title>
<style>
/* 和原型同一套颜色：浅色是暖纸面加手绘墨线，深色是 Obsidian 风格（prototype/index.html 的 CSS 变量） */
:root{
  --bg:#F5F4EE; --pane:#FBFAF6; --side:#EFEDE5; --hover:#E7E4D9; --rule:#E0DCD0;
  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;
  --accent:#C2603F; --accent-soft:#F3E0D6; --on-accent:#FFFFFF;
  --c-math:#ECCDB6; --c-math-2:#D59E7A; --c-math-bg:#F2E1D3;
  --c-sci:#CCD6C0; --c-sci-2:#93A982; --c-sci-bg:#DCE3D2;
  --c-sky:#CFDCE6; --wash:#EFE4D6; --gold:#E7B84A;
  --good:#3B7A56; --bad:#B4432E; --good-soft:#DCEBDF; --bad-soft:#F5DFD8;
  --shadow:0 1px 2px rgba(31,30,28,.06),0 8px 28px rgba(31,30,28,.08);
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1E1E; --pane:#252525; --side:#1B1B1B; --hover:#2E2E2E; --rule:#353535;
  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;
  --accent:#A797F7; --accent-soft:#2D2943; --on-accent:#15121F;
  --c-math:#5A4536; --c-math-2:#9A7558; --c-math-bg:#33291F;
  --c-sci:#3C4836; --c-sci-2:#6F8560; --c-sci-bg:#28301F;
  --c-sky:#2D3B47; --wash:#2A2738; --gold:#D9AE4E;
  --good:#7CC79A; --bad:#EF8A72; --good-soft:#203528; --bad-soft:#3A2420;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1E1E; --pane:#252525; --side:#1B1B1B; --hover:#2E2E2E; --rule:#353535;
  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;
  --accent:#A797F7; --accent-soft:#2D2943; --on-accent:#15121F;
  --c-math:#5A4536; --c-math-2:#9A7558; --c-math-bg:#33291F;
  --c-sci:#3C4836; --c-sci-2:#6F8560; --c-sci-bg:#28301F;
  --c-sky:#2D3B47; --wash:#2A2738; --gold:#D9AE4E;
  --good:#7CC79A; --bad:#EF8A72; --good-soft:#203528; --bad-soft:#3A2420;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2{margin:0;color:var(--ink);font-family:var(--f-serif);font-weight:600;line-height:1.3;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 手绘线稿：两种模式共用 */
.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.kq{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.fp{fill:var(--pane)}
.star-fill{fill:var(--gold)}
.star-half{fill:var(--c-math-2)}
.fig-shade{fill:var(--c-math)}
.fig-txt{fill:var(--ink);font-size:12px}

/* 外框 */
.app{min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.topbar{display:flex;align-items:center;gap:10px;background:var(--side);border-bottom:1px solid var(--rule);
  padding-block:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.topbar .logo{width:30px;height:30px;flex:none}
.topbar .title{font-family:var(--f-serif);font-weight:600;color:var(--ink);font-size:18px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border-bottom:1px solid var(--rule);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner p{flex:1 1 240px}
main{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--ink);background:var(--pane);color:var(--ink);font-size:16px}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.ink{background:var(--ink);color:var(--pane)}
.btn.ink:hover:not(:disabled){background:var(--text)}
.btn.big{min-height:52px;font-size:17px;padding:0 24px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.btns.center{justify-content:center}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:0 10px;font-size:13px;background:var(--hover);color:var(--text);line-height:24px}
.pill.lit{background:var(--ink);color:var(--pane)}

/* 星图 */
.chart{position:relative;flex:1;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 40px;overflow:hidden;background:var(--pane)}
.sky{position:absolute;inset:0;width:100%;height:100%}
.sky-dot{fill:var(--muted);opacity:.45}
.sky-line{opacity:.22}
.chart-head{position:absolute;top:16px;left:max(18px,env(safe-area-inset-left,0px))}
.chart-head h1{font-size:24px}
.sub{color:var(--muted);font-size:14px}
.stars{position:relative;list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
.star{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 18px 16px;border-radius:24px;min-width:180px}
.star:hover{background:color-mix(in srgb,var(--hover) 70%,transparent)}
.star svg{display:block}
.star-name{font-family:var(--f-serif);font-weight:600;color:var(--ink);font-size:19px}
.chart-tip{position:relative;margin-top:18px;font-size:15px}
.toast{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--pane);border-radius:12px;padding:8px 16px;font-size:15px;max-width:90%;text-align:center;box-shadow:var(--shadow)}

/* 挑战 */
.quiz{width:100%;max-width:760px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.quiz-head{display:flex;align-items:center;gap:12px}
.quiz-head h1{font-size:21px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 6px;border-radius:10px;color:var(--muted);font-size:15px}
.back:hover{background:var(--hover);color:var(--ink)}
.prog{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;margin:12px 0 4px;font-family:var(--f-mono)}
.prog i{display:inline-block;width:22px;height:8px;border-radius:4px;background:var(--rule)}
.prog i.on{background:var(--ink)}
.prog span{margin-left:6px}
.q{background:var(--pane);border:1px solid var(--rule);border-radius:18px;padding:18px;margin-top:12px;box-shadow:var(--shadow)}
.figbox{background:var(--bg);border-radius:12px;padding:8px;margin-bottom:12px;display:flex;justify-content:center}
.fig{display:block;width:100%;max-width:340px;height:auto}
.fig-missing{color:var(--muted);font-size:15px}
.stem{font-size:19px;color:var(--ink);font-weight:600;line-height:1.6}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.choice{display:flex;align-items:center;gap:4px;text-align:left;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 16px;min-height:54px;font-size:18px;width:100%}
.choice:hover:not(:disabled){background:var(--hover)}
.choice.wrong{border-color:var(--bad);color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.choice.right{border-color:var(--good);background:var(--good-soft);font-weight:600}
.choice:disabled:not(.wrong):not(.right){opacity:.7}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.92em;margin:0 .15em;font-variant-numeric:tabular-nums}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.frac>span:last-child{padding:0 .2em}
.choice.wrong .frac{text-decoration:line-through}
.bub{display:flex;gap:10px;align-items:center;border-radius:16px;padding:12px 16px;margin-top:12px;color:var(--ink)}
.bub.good{background:var(--good-soft)}
.bub.bad{background:var(--bad-soft);display:block}
.bub:focus{outline:none}.bub:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.result h2:focus{outline:none}
.bub .mini{width:30px;height:30px;flex:none}
.save{margin-top:12px;font-size:15px}
.save.bad{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bad-soft);color:var(--ink);border-radius:14px;padding:10px 14px}
.result{text-align:center;background:var(--pane);border:1px solid var(--rule);border-radius:20px;padding:24px 18px;margin-top:16px;box-shadow:var(--shadow)}
.result-star{display:flex;justify-content:center;margin-bottom:6px}
.result h2{font-size:22px;margin-bottom:6px}

.stop{max-width:520px;margin:12vh auto 0;text-align:center;padding:0 20px}
.stop-art{display:flex;justify-content:center;margin-bottom:12px}
.stop h1{font-size:22px;margin-bottom:8px}

@media (prefers-reduced-motion:no-preference){
  .choice,.btn,.star,.back{transition:background-color .15s ease,border-color .15s ease}
}
@media (min-width:760px){
  .chart-head h1{font-size:28px}
  .stem{font-size:20px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <path class="k" d="M50 10C62 26 66 40 64 58C62 70 58 76 50 78C42 76 38 70 36 58C34 40 38 26 50 10Z"/>
      <circle cx="50" cy="40" r="7" class="k1"/>
      <path class="k1" d="M37 58L25 76L39 72M63 58L75 76L61 72"/>
      <path d="M44 80q6 14 12 0z" fill="var(--accent)" opacity=".85"/>
    </svg>
    <span class="title">好奇号</span>
  </header>
  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
  <main id="main"><section class="stop"><p class="muted">正在打开……</p></section></main>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
