# prompt_ref: prompts/act.simulation.glide-track-01.md
id: act.quiz.glide-track-01
schema: activity-def/1
kind: quiz
version: 1
title: 读轨道上的车印
targets:
- physics.motion.inertia
age_band: G3-4
duration_min: 7
review: pending
engine: 1
sources:
- type: reference
  ref: OpenStax · College Physics 2e · 4.2
  url: https://github.com/openstax/osbooks-college-physics-bundle/blob/66fcef29596e3a32818162b837dd0c85b754cbad/modules/m42130/index.cnxml
body:
  shuffle: false
  items:
  - id: q1
    stem: 光滑水平轨道上，手给车向右一推就松开。之后没有水平外力。松手时车还在动，下一秒会怎样？
    answer:
      type: choice
      choices:
      - id: a
        text: 立刻停住
        misconception: keep-pushing
        feedback: 松手取消了推力，此刻的速度还在。
      - id: b
        text: 按原速度继续向右
        correct: true
      - id: c
        text: 继续向右加快
        misconception: keep-pushing
        feedback: 松手后没有水平合力使它继续加速。
    feedback:
      correct: 车已经在向右走，松手后水平合力为零，车保持原来的速度。
      wrong: 分开看手还碰着车和手已离开这两个时刻。
    hints:
    - 分开看手还碰着车和手已离开这两个时刻。
    - 只看手离开之后，有谁能改变它的水平速度。
  - id: q2
    stem: 在一段水平直轨上，小车向右滑，每秒走 3 米。它离开手后不受水平外力。接下来 4 秒一共向右走几米？
    answer:
      type: number
      value: 12
      tolerance: 0
      unit: 米
      common_wrong:
      - value: 0
        misconception: keep-pushing
        feedback: 手离开时小车仍在动，接下来的每秒仍会前进。
    feedback:
      correct: 每秒的距离保持 3 米，四段相连正好走 12 米。
      wrong: 把记录带剪成同样长的时间段。
    hints:
    - 把记录带剪成同样长的时间段。
    - 先填好每段的路程，再把各段相加。
  - id: q3
    stem: 一辆车松手后向右滑进粗糙水平垫。打点器每秒印一点，车还在向右走，但相邻点越来越近。哪一项能解释这串点？
    answer:
      type: choice
      choices:
      - id: a
        text: 车受到向左的摩擦力
        correct: true
      - id: b
        text: 松手后所有力都消失了
        misconception: keep-pushing
        feedback: 若水平合力为零，每秒印出的间距应相等。
      - id: c
        text: 车受到向右的合力
        misconception: keep-pushing
        feedback: 车向右时受向右的合力，在相同时间里会走得越来越远。
    feedback:
      correct: 点越密，同样一秒走得越少。向左的摩擦力能让向右滑的车减速。
      wrong: 先比较两对相邻点的间距。
    hints:
    - 先比较两对相邻点的间距。
    - 找一个能使向右速度变小的力的方向。
  - id: q4
    stem: 一辆车以不变的速度向右滑行，水平方向可能有拉力和阻力。它在 2 秒里走了 8 米，再保持原速走 3 秒会走几米？
    answer:
      type: number
      value: 12
      tolerance: 0
      unit: 米
      common_wrong:
      - value: 0
        misconception: keep-pushing
        feedback: 向右运动可以在水平合力为零时继续。
    feedback:
      correct: 从前一段读出每秒 8 ÷ 2 = 4 米。后面三秒仍走 4 × 3 = 12 米。
      wrong: 把前一段的距离均分给每一秒。
    hints:
    - 把前一段的距离均分给每一秒。
    - 按同样的每秒距离延长纸带。
  - id: q5
    stem: 车沿直轨向右匀速滑，等时车印间距相同。甲说车没有水平力，乙说向右拉力与向左阻力相等。这两种情况，哪些能留下这样的车印？
    answer:
      type: choice
      choices:
      - id: a
        text: 只有甲说的能
        misconception: keep-pushing
        feedback: 如果拉力恰好抵住阻力，水平合力也为零。
      - id: b
        text: 只有乙说的能
        misconception: keep-pushing
        feedback: 即使根本没有水平力，原本在运动的车仍会向前。
      - id: c
        text: 两种都能
        correct: true
    feedback:
      correct: 两种情形的水平合力都为零，都能让速度保持。只看这些车印，分不出是哪一种。
      wrong: 相邻车印之间的时间相等，先读出车速有没有变。
    hints:
    - 相邻车印之间的时间相等，先读出车速有没有变。
    - 分别把甲、乙描述的水平力合起来，再对照车印。
# END OF FILE
