<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
/* curio-kit:2 begin */

  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;

}

.f-ink{fill:var(--ink)} .f-pane{fill:var(--pane)} .f-sky{fill:var(--sky)} .f-sage{fill:var(--sage)} .f-apricot{fill:var(--apricot)} .f-paper{fill:var(--paper)} .f-muted{fill:var(--muted)} .f-accent{fill:var(--accent)}

@keyframes cue{0%{transform:scale(1);opacity:.95}50%{transform:scale(1.8);opacity:0}100%{transform:scale(1.8);opacity:0}}

.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-family:var(--f-mono);font-size:.84em;margin:0 .2em;font-variant-numeric:tabular-nums}

/* ============ 本活动 ============ */
#workbench{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;padding:0 12px 12px}

.water{fill:var(--sky)} .wash{fill:var(--sage)} .paperline{stroke:var(--pane);stroke-width:1}
.table-line{stroke:var(--rule);stroke-width:2}.unit-label{fill:var(--muted);font:16px var(--f-sans)}

#stage .hit{pointer-events:all;touch-action:none;cursor:grab;fill:transparent}

.pour-row[data-selected="true"] .digit-face{fill:var(--accent)}
#workbench [data-select-row][aria-pressed="true"]{background:var(--paper);box-shadow:inset 0 0 0 1px var(--ink)}

<body>
<div class="wrap">
  <div class="card">
    <header><span class="station" id="station"></span><h1 id="title"></h1></header>
    <svg id="stage" viewBox="0 0 800 610" tabindex="0" role="application" aria-label="动手区">
      <g id="fixed"></g><g id="dyn"></g>
      <g id="fx"><circle id="cue" cx="0" cy="0" r="10" style="display:none"/></g><!-- 提醒环用 CSS 动画，不跟着每帧重画（教训 23） -->
      <rect id="touch" x="-400" y="-400" width="1600" height="1410" fill="transparent"/><!-- 永不重画的触摸层（教训 25） -->
    </svg>
    <div id="workbench" aria-label="操作台"></div>
    <footer><span class="hint" id="hint"></span><span class="readout" id="readout"></span></footer>
  </div>
  <div class="talk">
    <svg class="ava" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="27" r="16" fill="var(--sky)"/>
      <path class="k" d="M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z"/>
      <path class="k1" d="M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5"/>
      <circle cx="18.5" cy="25" r="2.2" fill="var(--ink)"/><circle cx="29.5" cy="25" r="2.2" fill="var(--ink)"/>
      <path class="k1" d="M18 32 C21 35 27 35 30 32"/>
    </svg>
    <div class="bubble" id="say" aria-live="polite"></div>
  </div>
  <div class="actions" id="actions"></div>
  <div id="qarea"></div>
</div>

<script>
"use strict";
/* curio-kit:2 begin */
const PALETTE_KEYS = new Set([
  "bg", "pane", "hover", "rule", "ink", "text", "muted",
  "accent", "accent-soft", "grip", "grip-soft",
  "sage", "sage-bg", "sky", "apricot", "paper",
  "good", "good-soft", "bad", "bad-soft"
]);
const HEX_COLOR = /^#(?:[0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/;

/* curio-sfx begin */
/**
 * 纯工厂函数，便于单测注入假 AudioContext 与假时钟。
 * @param {{AudioCtx?: any, nowMs?: () => number, requireGesture?: boolean, eventTarget?: any}} [opts]
 */
function createSfx(opts = {}) {
  const explicitCtx = "AudioCtx" in opts;
  const AudioCtx = explicitCtx
    ? opts.AudioCtx
    : (typeof globalThis !== "undefined" ? (/** @type {any} */ (globalThis).AudioContext || /** @type {any} */ (globalThis).webkitAudioContext || null) : null);
  const nowMs = opts.nowMs || (() => (typeof performance !== "undefined" ? performance.now() : Date.now()));
  const target = "eventTarget" in opts ? opts.eventTarget : (typeof globalThis !== "undefined" ? globalThis : null);
  let isMuted = false;
  let ctx = null;
  let unlocked = explicitCtx && !opts.requireGesture;
  let lastTick = -1e9;
  let noiseBuf = null;
  let nSeq = 0;
  const counts = new Map();
  let master = null;
  const sources = new Set();

  function unlock() {
    unlocked = true;
    if (isMuted || !AudioCtx) return;
    try {
      if (!ctx) ctx = new AudioCtx();
      if (ctx && (ctx.state === "suspended" || ctx.state === "interrupted")) {
        const p = ctx.resume();
        if (p && typeof p.catch === "function") p.catch(() => {});
      }
    } catch { /* 音频受限时静默降级 */ }
  }

  if (target && typeof target.addEventListener === "function") {
    // iOS 在触摸结束时才授予激活；继续使用系统默认音频类别，尊重侧边静音开关。
    for (const gesture of ["pointerdown", "touchend", "click", "keydown"]) {
      target.addEventListener(gesture, unlock, true);
    }
  }

  function readyCtx(name) {
    // 记录操作所请求的声位，即使静音也让按钮和走查得到相同的反馈语义。
    nSeq++;
    counts.set(name, (counts.get(name) || 0) + 1);
    if (isMuted || !AudioCtx || !unlocked) return null;
    try {
      if (!ctx) ctx = new AudioCtx();
      if (!ctx || ctx.state !== "running") return null;
      if (!master) {
        const gain = ctx.createGain(), compressor = ctx.createDynamicsCompressor();
        gain.gain.value = 3;
        compressor.threshold.value = -18;
        compressor.ratio.value = 4;
        compressor.attack.value = 0.003;
        compressor.release.value = 0.12;
        gain.connect(compressor);
        compressor.connect(ctx.destination);
        master = gain;
      }
      return ctx;
    } catch { return null; }
  }

  function getNoise(c) {
    if (noiseBuf) return noiseBuf;
    const len = Math.max(1, Math.floor(c.sampleRate * 0.06));
    const b = c.createBuffer(1, len, c.sampleRate);
    const d = b.getChannelData(0);
    // 固定种子生成短噪声，同采样率下宿主与沙箱得到相同波形。
    let seed = 0x63757269;
    for (let i = 0; i < len; i++) {
      seed ^= seed << 13;
      seed ^= seed >>> 17;
      seed ^= seed << 5;
      const sample = (seed >>> 0) / 0x80000000 - 1;
      d[i] = sample * Math.exp(-i / (len * 0.35));
    }
    noiseBuf = b;
    return b;
  }

  function clean(src, nodes) {
    sources.add(src);
    src.onended = () => {
      sources.delete(src);
      try { src.disconnect(); } catch { /* ignore */ }
      for (const nd of nodes) { try { nd.disconnect(); } catch { /* ignore */ } }
    };
  }

  function tone(c, type, f0, f1, t0, dur, peak, vibrato = false) {
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(0.0008, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + Math.min(0.008, dur * 0.25));
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    if (vibrato) {
      const lfo = c.createOscillator(), depth = c.createGain();
      lfo.frequency.value = 5.5;
      depth.gain.value = 6;
      lfo.connect(depth);
      depth.connect(osc.detune);
      clean(lfo, [depth]);
      lfo.start(t0);
      lfo.stop(t0 + dur + 0.004);
    }
    osc.connect(g);
    g.connect(master);
    clean(osc, [g]);
    osc.start(t0);
    osc.stop(t0 + dur + 0.004);
  }

  function burst(c, filterType, freq, q, t0, dur, peak) {
    const src = c.createBufferSource(), flt = c.createBiquadFilter(), g = c.createGain();
    src.buffer = getNoise(c);
    flt.type = filterType;
    flt.frequency.setValueAtTime(freq, t0);
    flt.Q.setValueAtTime(q, t0);
    g.gain.setValueAtTime(0.0008, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    src.connect(flt);
    flt.connect(g);
    g.connect(master);
    clean(src, [flt, g]);
    src.start(t0);
    src.stop(t0 + dur + 0.004);
  }

  return {
    /** @param {boolean} v */
    setMuted(v) {
      isMuted = !!v;
      if (isMuted) {
        // 连尚未开始的琶音一起撤掉。重新开声时只播放新的操作。
        for (const src of sources) {
          src.disconnect();
          src.stop();
        }
        sources.clear();
      }
    },
    muted() { return isMuted; },
    seq() { return nSeq; },
    count(name) { return counts.get(name) || 0; },
    /** @param {number} [step] */
    tick(step = 0) {
      const now = nowMs();
      if (now - lastTick < 35) return false;
      lastTick = now;
      const c = readyCtx("tick");
      if (!c) return false;
      const k = Math.max(-6, Math.min(12, +step || 0));
      burst(c, "bandpass", 1480 * Math.pow(2, k * 0.03), 4.5, c.currentTime, 0.018, 0.042);
      return true;
    },
    /** @param {number} [step] */
    hop(step = 0) {
      const c = readyCtx("hop");
      if (!c) return false;
      const k = Math.max(0, Math.min(12, +step || 0));
      const f0 = 330 * Math.pow(2, k / 18);
      tone(c, "triangle", f0, f0 * 1.28, c.currentTime, 0.055, 0.085);
      return true;
    },
    snap() {
      const c = readyCtx("snap");
      if (!c) return false;
      const t = c.currentTime;
      burst(c, "highpass", 2200, 1.2, t, 0.016, 0.052);
      tone(c, "sine", 620, 420, t, 0.045, 0.055);
      tone(c, "sine", 1240, 1240, t, 0.045, 0.055 * 0.18);
      return true;
    },
    tap() {
      const c = readyCtx("tap");
      if (!c) return false;
      tone(c, "sine", 880, 660, c.currentTime, 0.020, 0.045);
      return true;
    },
    right() {
      const c = readyCtx("right");
      if (!c) return false;
      const t = c.currentTime;
      tone(c, "triangle", 523.25, 523.25, t, 0.11, 0.075);
      tone(c, "triangle", 783.99, 783.99, t + 0.065, 0.12, 0.08);
      return true;
    },
    nudge() {
      const c = readyCtx("nudge");
      if (!c) return false;
      const t = c.currentTime;
      for (const [from, to, delay, duration, peak] of [[440, 370, 0, 0.04, 0.06], [392, 330, 0.048, 0.045, 0.055]]) {
        tone(c, "sine", from, to, t + delay, duration, peak);
        tone(c, "sine", from * 2, to * 2, t + delay, duration, peak * 0.35);
      }
      return true;
    },
    discover() {
      const c = readyCtx("discover");
      if (!c) return false;

    say("换了两筒水，这回你想怎么倒？");
  });
}
function grab(p, target){
  if(S.station !== 3 || poured)return null;
  const group = target.closest(".pour-row");
  if(!group)return null;
  const row = group.dataset.row;
  selectRow(row);
  return {x:p.x, offset:rowOffsets[row]};
}
function move(d,p){
  if(S.station===3)shiftRow(d.offset + Math.round((p.x-d.x)/cellWidth));
}
function key(k,back){
  if(S.station===1){
    if(/^\d$/.test(k)){put(+k);return true;}
    if(free && (k==="ArrowLeft"||k==="ArrowRight")){slot=clamp(slot+(k==="ArrowLeft"?-1:1),0,2);syncSlots();return true;}
    if(free&&k==="Tab"&&!back&&side===0){side=1;slot=0;syncSlots();return true;}
  }
  if(S.station===2&&["ArrowLeft","ArrowRight"].includes(k)){bench.querySelectorAll("button")[k==="ArrowLeft"?0:1].focus();return true;}
  if(S.station===3 && !poured){
    if(k==="ArrowUp" || k==="ArrowDown"){selectRow(k==="ArrowUp"?"top":"bottom");return true;}
    if(k==="ArrowLeft" || k==="ArrowRight"){shiftRow(rowOffsets[selectedRow]+(k==="ArrowRight"?1:-1));return true;}
    if(k==="Enter"){pour();return true;}
  }
  return false;
}
function revelation(){
  if(S.station===1)return "十分位的一块顶百分位的十片。先从最大的格子往右比，第一处不同就能看出大小。";
  if(S.station===2)return "末尾添 0，水没多也没少。把 0 放到小数点后第一格，3 就搬进了更小的格子。";
  return "十分位满 10 就进 1。博尔特用 9.58 秒跑完 100 米。按全程平均速度算，短短 0.02 秒也能跑大约 20 厘米。";
}
function card(){
  const [a,b]=personal;
  let s=TC(400,43,"我的量筒","ttl");
  for(const [x,val] of [[247,a],[553,b]])s+=water(x,68,65,109,+val)+vessel(x,68,65,109)+TC(x,206,val,"sign");
  s+=P("M170 254h460M170 247v14m460 -14v14","k")+TC(170,284,"0","lb")+TC(630,284,"1","lb");
  for(const [i,val] of personal.entries()){const x=170+Number(val)*460;s+=P(`M${x} 254v-${i?15:28}`,"kacc");}
  for(const x of [222,321])s+=water(x,301,46,44,.3)+vessel(x,301,46,44);
  return s+TC(271,330,"＝","lb")+TC(467,329,"0.3 = 0.30","lbm")+TC(400,373,"比过 2 对小数，倒成 3 次","lb")+TC(400,399,"0.75 筒　·　1.55 筒　·　1.0 筒","lbm");
}
let dragging=null;
svg.addEventListener("pointerdown",e=>{
  if(!S.mode.startsWith("act"))return;
  const p=svgPoint(e), start=grab(p,e.target);
  if(!start)return;
  touched();dragging={...start,id:e.pointerId};svg.setPointerCapture(e.pointerId);e.preventDefault();
});
svg.addEventListener("pointermove",e=>{
  if(dragging && e.pointerId===dragging.id && S.mode.startsWith("act"))move(dragging,svgPoint(e));
});
for(const ev of ["pointerup","pointercancel","lostpointercapture"])svg.addEventListener(ev,e=>{
  if(dragging && e.pointerId===dragging.id)dragging=null;
});
svg.addEventListener("keydown",e=>{
  if(!S.mode.startsWith("act") || e.ctrlKey||e.metaKey||e.altKey)return;
  if(key(e.key,e.shiftKey)){e.preventDefault();touched();svg.classList.add("kbd");}
});
function onResize(){
  fitView();
  if(S.mode.startsWith("act")||S.mode==="end"||S.mode==="reveal") draw();
}
addEventListener("pointercancel", () => {
  const pending = [...$("actions").querySelectorAll("button:disabled")];
  if (pending.length) setTimeout(() => {
    for (const b of pending) if (b.isConnected && !fingerDown) b.disabled = false;
  }, 120);
}, true);
Kit.start(() => {
  onResize();
  addEventListener("resize", onResize);
  if (window.ResizeObserver){
    new ResizeObserver(onResize).observe(svg);
    new ResizeObserver(() => {
      const h = document.body.scrollHeight;
      if (Host.inFrame) parent.postMessage({ contract: "activity/1.2", type: "resize", payload: { h } }, "*");
      else (window.__sent = window.__sent || []).push({ type: "resize", payload: { h } });
    }).observe(document.body);
  }
  enter1();
}, { stations: {} });

</script>
