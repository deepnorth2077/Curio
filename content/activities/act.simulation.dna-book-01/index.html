<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻开细胞里的说明书</title>
<style>
:root{
  --bg:#F5F4EE; --pane:#FBFAF6; --rule:#E0DCD0; --hover:#E7E4D9;
  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;
  --accent:#C2603F; --accent-soft:#F3E0D6;
  --sage:#CCD6C0; --sage-bg:#DCE3D2; --sky:#CFDCE6; --apricot:#ECCDB6; --paper:#EFE4D6;
  --dad:#4F7FA8; --mom:#C2603F; --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1E1E1E; --pane:#252525; --rule:#353535; --hover:#2E2E2E;
  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;
  --accent:#E0876A; --accent-soft:#3A2A24;
  --sage:#3C4836; --sage-bg:#28301F; --sky:#2D3B47; --apricot:#5A4536; --paper:#33302A;
  --dad:#7FA9CF; --mom:#E0876A; --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:12px 14px 28px}
.card{background:var(--pane);border:1px solid var(--rule);border-radius:18px;overflow:hidden}
.card header,.card footer{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 16px}
.card header{border-bottom:1px solid var(--rule)}
.card footer{border-top:1px solid var(--rule);min-height:44px;align-items:center;flex-wrap:wrap;row-gap:2px}
.card footer .readout{margin-left:auto}
.station{font-size:13px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
h1{font-family:var(--f-serif);font-size:20px;font-weight:600;color:var(--ink);margin:0;text-align:right}
.hint{font-size:14px;color:var(--muted)}
.readout{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px;text-align:right}
.readout b{color:var(--accent);font-weight:600}
svg#stage{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
svg#stage:focus{outline:none}
svg#stage:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.kf{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:4 7}
.kr{fill:none;stroke:var(--bad);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ka{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.t{fill:var(--ink);font-family:var(--f-sans);font-size:16px}
.tm{fill:var(--muted);font-family:var(--f-sans);font-size:15px}
.tb{fill:var(--pane);font-family:var(--f-serif);font-weight:700}
.let{fill:var(--ink);font-family:var(--f-mono);font-size:17px;font-weight:600}
.let.hi{fill:var(--accent)}
.talk{display:flex;gap:10px;align-items:flex-start;margin:14px 2px 6px}
.ava{flex:none;width:42px;height:42px}
.bubble{background:var(--pane);border:1px solid var(--rule);border-radius:16px 16px 16px 4px;padding:10px 14px;color:var(--ink);min-height:44px;flex:1}
.bubble.good{background:var(--good-soft);border-color:transparent}
.bubble.bad{background:var(--bad-soft);border-color:transparent}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin:10px 0 0}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 18px;min-height:48px;font-size:17px;font-weight:600;touch-action:none}
.btn.ghost{background:var(--pane);color:var(--ink)}
.btn.choice{background:var(--bg);color:var(--ink);font-weight:500;text-align:left;flex:1 1 220px}
.btn.choice:hover{background:var(--hover)}
.btn.hold{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.hold.on{filter:brightness(.9)}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{min-height:40px;font-size:15px;padding:6px 14px;font-weight:500}
.qbox{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.qbox textarea{flex:1 1 260px;font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);min-height:64px}
@media (max-width:520px){ body{font-size:16px} h1{font-size:17px} .card header,.card footer{padding:8px 12px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <header><span class="station" id="station">第 1 站 · 共 4 站</span><h1 id="title">打开小房间</h1></header>
    <svg id="stage" viewBox="0 0 800 600" tabindex="0" role="application" aria-label="动手区">
      <defs><clipPath id="lens"><circle cx="575" cy="280" r="186"/></clipPath><clipPath id="view2"><circle cx="200" cy="245" r="162"/></clipPath></defs>
      <g id="static"></g><g id="dyn"></g>
    </svg>
    <footer><span class="hint" id="hint"></span><span class="readout" id="readout"></span></footer>
  </div>
  <div class="talk">
    <svg class="ava" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="27" r="16" fill="var(--sky)"/>
      <path class="k" d="M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z"/>
      <path class="k1" d="M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5"/>
      <circle cx="18.5" cy="25" r="2.2" fill="var(--ink)"/><circle cx="29.5" cy="25" r="2.2" fill="var(--ink)"/>
      <path class="k1" d="M18 32 C21 35 27 35 30 32"/>
    </svg>
    <div class="bubble" id="say" aria-live="polite"></div>
  </div>
  <div class="actions" id="actions"></div>
  <div id="qarea"></div>
</div>

<script>
"use strict";
/* ============ 1. 真相模型：页面上的每个数字都从这里算 ============
   核对记录（2026-11 逐条查过）：
   - 只有 4 种字母 A、T、C、G：NHGRI 词条「ACGT」 https://www.genome.gov/genetics-glossary/acgt
     （"the four types of bases found in a DNA molecule: adenine (A), cytosine (C), guanine (G), and thymine (T)"）；
     MedlinePlus「What is DNA?」 https://medlineplus.gov/genetics/understanding/basics/dna/
   - 一个人体细胞里的字母数：Piovesan 等 2019，BMC Research Notes 12:106 https://pmc.ncbi.nlm.nih.gov/articles/PMC6391780
     女性细胞（二倍体）6.37 Gbp，男性 6.27 Gbp；页面取 6.37e9，显示「约 64 亿」（男性约 63 亿，同样念约 200 年）。
     Nature Scitable「DNA Packaging」 https://www.nature.com/scitable/topicpage/dna-packaging-nucleosomes-and-chromatin-310
     给的是粗略的「每个细胞约 60 亿」和「约 2 米」；MedlinePlus：一套约 30 亿。页面不提「两套」，那是下一颗星的内容。
   - 念完要多少年：6.37e9 秒 ÷ 31,557,600 秒/年 ≈ 202 年，取整到十位显示「约 200 年」（6.27e9 时 ≈ 199 年，结论不变）。
   - 绝大多数细胞带同一套说明书：MedlinePlus「Nearly every cell in a person's body has the same DNA.」；
     读不同的部分：The Tech「Ask a Geneticist」 https://www.thetech.org/ask-a-geneticist/ask398
     （"each cell type only reads the genes it needs"）。适龄简化成「同一本书翻开不同的页」。
   - 成熟红细胞没有细胞核：Britannica「Red blood cell」 https://www.britannica.com/science/red-blood-cell （"lacks a nucleus"）；
     白细胞有细胞核：Britannica「Blood: White blood cells」 https://www.britannica.com/science/blood-biochemistry/White-blood-cells-leukocytes
     （"White blood cells (leukocytes), unlike red cells, are nucleated"）。
   - 分成两个之前先抄一份、长个子和补伤口都靠细胞分裂：NIH NIGMS《Inside the Cell》第 4 章
     https://webarchive.library.unt.edu/eot2008/20090130193729/http:/publications.nigms.nih.gov/insidethecell/chapter4.html
     （"mitosis doesn't begin until after the genetic material has been copied"；"responsible for growth ... replacing injured ... cells"）；
     人教版七上第一单元第三章第一节「细胞通过分裂产生新细胞」。
   - DNA 这个名字、遗传（爸爸妈妈传给孩子）：人教版八下第六单元第二章第二节（星座文档已核对）。
   - 下面两项不是事实，是页面自己的换算和示意，界面上都说「如果」或只当页码用：
     lettersPerPage：假设一页印 1 万个字母，只用来说「这本书有多少页」；pages：三种细胞翻到的页码只是示意，不对应真实位置。
   - 伤口要补的格数 woundSlots 只是画面的格子数。 */
const MODEL = {
  kinds: ["A", "T", "C", "G"],     // 4 种字母（NHGRI「ACGT」）
  lettersPerCell: 6.37e9,          // 一个细胞里的字母数（Piovesan 2019，女性 6.37 Gbp）
  readPerSec: 1,                   // 一秒念一个
  secPerYear: 365.25 * 24 * 3600,  // 一年的秒数
  slowLetters: 5,                  // 先一秒一个地念 5 个，再快进
  lettersPerPage: 1e4,             // 假设：一页印 1 万个字母（只作换算）
  cells: {                         // 页码只是示意
    nerve:  { name: "神经细胞", short: "神经", page: 214060, place: "脑子里" },
    muscle: { name: "肌肉细胞", short: "肌肉", page: 388512, place: "腿上" },
    skin:   { name: "皮肤细胞", short: "皮肤", page: 527338, place: "手上" }
  },
  woundSlots: 6                    // 伤口宽 6 格（画面格子）
};
MODEL.readSec = MODEL.lettersPerCell / MODEL.readPerSec;
MODEL.readYears = MODEL.readSec / MODEL.secPerYear;               // ≈ 202
MODEL.pagesTotal = MODEL.lettersPerCell / MODEL.lettersPerPage;    // ≈ 63.7 万
const YEARS = Math.round(MODEL.readYears / 10) * 10;               // 显示用：200
const ORDER = ["nerve", "muscle", "skin"];
function fmtBig(n){
  if (n >= 1e8) return (n >= 1e9 ? String(Math.round(n / 1e8)) : (n / 1e8).toFixed(1).replace(/\.0$/, "")) + " 亿";
  if (n >= 1e4) return (n >= 1e5 ? String(Math.round(n / 1e4)) : (n / 1e4).toFixed(1).replace(/\.0$/, "")) + " 万";
  return String(Math.round(n));
}
function fmtDur(s){
  if (s < 60) return Math.round(s) + " 秒";
  if (s < 3600) return Math.round(s / 60) + " 分钟";
  if (s < 86400) return Math.round(s / 3600) + " 小时";
  if (s < MODEL.secPerYear) return Math.round(s / 86400) + " 天";
  return Math.round(s / MODEL.secPerYear) + " 年";
}
const TOTAL_TXT = fmtBig(MODEL.lettersPerCell);   // 「64 亿」
const PAGES_TXT = fmtBig(MODEL.pagesTotal);       // 「64 万」

/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩） ============ */
const Host = (() => {
  const h = {}, inFrame = window.parent !== window;
  addEventListener("message", e => { const m = e.data; if (m && m.contract === "activity/1.1" && h[m.type]) h[m.type](m.payload || {}); });
  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: "activity/1.1", type, payload: payload || {} }, "*"); };
  if (window.ResizeObserver) new ResizeObserver(() => send("resize", { h: document.documentElement.scrollHeight })).observe(document.body);
  return { on: (k, f) => { h[k] = f; }, ready: () => send("ready"), event: (verb, result) => send("event", { verb, result }),
    state: o => send("state", o), noteQuestion: text => send("note_question", { text }), complete: r => send("complete", r || {}) };
})();
Host.on("init", p => {
  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty("--" + k, v);
});

/* ============ 3. 手绘线条（平台的 sketchLib） ============ */
function sketchLib(){
  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };
  const f=n=>Math.round(n*10)/10;
  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;
    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];
      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }
    return d; }
  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;
    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;
    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }
  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];
    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }
    return cr(p,false); }
  function blob(cx,cy,rx,ry,seed){ const r=R(seed), N=9, p=[]; for(let i=0;i<N;i++){ const t=i/N*Math.PI*2, k=1+(r()-.5)*.1; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); } return cr(p,true)+"Z"; }
  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }
  return {line,ellipse,blob,curve,cr,R};
}
const Sk = sketchLib();
// class 里的 CSS 会盖过 SVG 的同名属性，所以字号、线宽、颜色一律改写成 style
function styl(extra, keys){
  let st = "";
  let e = (extra || "").replace(/\s*style="([^"]*)"/, (m, v) => { st += v.endsWith(";") ? v : v + ";"; return ""; });
  e = e.replace(new RegExp(`\\s*(${keys})="([^"]+)"`, "g"), (m, k, v) => { st += `${k}:${k === "font-size" && /^[\d.]+$/.test(v) ? v + "px" : v};`; return ""; });
  return (e.trim() ? " " + e.trim() : "") + (st ? ` style="${st}"` : "");
}
const P = (d, cls, extra) => `<path class="${cls || "k"}" d="${d}"${styl(extra, "stroke|stroke-width|stroke-dasharray|fill")}/>`;
const T = (x, y, s, cls, extra) => `<text x="${x}" y="${y}" class="${cls || "t"}"${styl(extra, "font-size|font-family|font-weight|fill")}>${s}</text>`;
const F = (d, fill, op) => `<path d="${d}" fill="var(--${fill})" opacity="${op == null ? .7 : op}"/>`;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = t => t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const box = (x, y, w, h, seed, j) => Sk.line(x, y, x + w, y, seed, j) + Sk.line(x + w, y, x + w, y + h, seed + 1, j) + Sk.line(x + w, y + h, x, y + h, seed + 2, j) + Sk.line(x, y + h, x, y, seed + 3, j);
function lettersOf(seed, n){ const r = Sk.R(seed), k = MODEL.kinds; let s = ""; for (let i = 0; i < n; i++) s += k[Math.floor(r() * 4)]; return s; }

/* ============ 4. 页面骨架 ============ */
const $ = id => document.getElementById(id);
const svg = $("stage"), gStatic = $("static"), gDyn = $("dyn");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const STATIONS = 4;
const S = {};
function resetState(){
  Object.assign(S, { station: 1, mode: "talk", hold: false, time: 0,
    dt: 0, dp: 0, bx: 0, by: 0, snap: false, placed: false,
    read: 0, ft: 0, fp: 0, flip: 0, fastSaid: false,
    vt: 0, vp: 0, visited: {}, said2: {}, dragDial: false,
    view: null, open: {}, openT: {}, found: {}, rbcI: -1, kf: 0, kbd: false,
    ht: 0, hp: 0, pass: 0, passing: false, showCat: false, done: {} });
  S.bx = C1.b0[0]; S.by = C1.b0[1];
}

function head(n, title){ $("station").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : "星卡"; $("title").textContent = title; }
function hint(s){ $("hint").textContent = s || ""; }
function readout(html){ $("readout").innerHTML = html || ""; }
function say(text, tone){ const b = $("say"); b.textContent = text; b.className = "bubble" + (tone ? " " + tone : ""); }
function actions(list){
  const box = $("actions"); box.replaceChildren();
  for (const a of list || []){
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn " + (a.cls || ""); b.textContent = a.label;
    if (a.hold){
      const on = v => { S.hold = v; b.classList.toggle("on", v); };
      b.addEventListener("pointerdown", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });
      for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) b.addEventListener(ev, () => on(false));
      b.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); a.step(); } });
      b.addEventListener("contextmenu", e => e.preventDefault());
    } else b.addEventListener("click", a.go);
    box.append(b);
  }
  return box;
}
function ask(question, options, onAnswer){
  say(question);
  actions(options.map((o, i) => ({ label: o.label, cls: "choice", go: () => {
    Host.event("predicted", { station: S.station, choice: i, correct: !!o.correct, misconception: o.mis || null });
    say(o.feedback, o.correct ? "good" : "bad");
    onAnswer(o);
  }})));
}
function next(label, go, cls){ actions([{ label, go, cls }]); }

// 「我有个问题」：随时可以问，发到信号站
(function(){
  const area = $("qarea");
  const open = document.createElement("button");
  open.type = "button"; open.className = "btn ghost small"; open.textContent = "我有个问题";
  open.style.marginTop = "12px";
  open.addEventListener("click", () => {
    if (area.querySelector("textarea")) return;
    const ta = document.createElement("textarea"); ta.maxLength = 120; ta.placeholder = "想问领航员什么？";
    const send = document.createElement("button"); send.type = "button"; send.className = "btn small"; send.textContent = "发给领航员";
    const box = document.createElement("div"); box.className = "qbox"; box.append(ta, send);
    send.addEventListener("click", () => {
      const q = ta.value.trim(); if (!q) return;
      Host.noteQuestion(q); box.remove(); say("好问题，我记下来了。等会儿一起找答案。");
    });
    area.append(box); ta.focus();
  });
  area.append(open);
})();

/* ============ 5. 共用的画：书、细胞核的小门、几种细胞 ============ */
// 合上的书。mark：dna（写 DNA）、bone（狗的）、fish（猫的）、none
function bookShut(cx, cy, w, seed, mark, cover){
  const h = w * 1.34, x = cx - w / 2, y = cy - h / 2, e = Math.max(2, w * .06);
  let s = `<rect x="${(x + e).toFixed(1)}" y="${(y + e).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${(w * .06).toFixed(1)}" fill="var(--paper)"/>` +
    P(Sk.line(x + w, y + e + 2, x + w + e, y + e + 2, seed, .3) + Sk.line(x + w + e, y + e + 2, x + w + e, y + h + e, seed + 1, .4) + Sk.line(x + w + e, y + h + e, x + e + 2, y + h + e, seed + 2, .4), "k1") +
    `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${(w * .06).toFixed(1)}" fill="var(--${cover || "accent"})" opacity=".9"/>` +

  } else if (S.station === 3){
    for (const key of Object.keys(S.openT)){ const o = S.open[key] || 0; if (Math.abs(S.openT[key] - o) > 1e-3){ S.open[key] = reduced ? 1 : Math.min(1, o + dt * 1.6); dirty = true; } }
    if (!reduced && S.mode === "find") dirty = true;
  } else if (S.station === 4){
    if (S.mode === "heal"){
      if (S.hold) S.ht = clamp(S.ht + dt * .12);
      if (Math.abs(S.ht - S.hp) > 1e-4){ S.hp = Math.abs(S.ht - S.hp) < 1e-3 ? S.ht : S.hp + (S.ht - S.hp) * k; dirty = true; readout4(); }
      if (fin("ht", "hp")){ render(); readout4(); done4(); }
    }
    if (S.passing){ S.pass = reduced ? 1 : S.pass + dt / 1.4; dirty = true; if (S.pass >= 1){ S.pass = 1; afterPass(); } }
  }
  if (dirty && S.station <= 4) render();
  requestAnimationFrame(tick);
}
resetState();
enter1();
Host.ready();
requestAnimationFrame(tick);
</script>
