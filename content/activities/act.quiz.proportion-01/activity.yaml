id: act.quiz.proportion-01
schema: activity-def/1
kind: quiz
version: 1
title: 拉伸相框大挑战
targets:
- math.ratio.proportion
age_band: G5-6
duration_min: 5
review: pending
engine: 1
sources:
- type: textbook
  ref: 人教版小学数学六年级下册（旧版）第四单元「比例的意义和基本性质」「正比例」「比例尺」
- type: reference
  ref: NASA JPL：按比例制作地球和月球的模型
  url: https://www.jpl.nasa.gov/edu/resources/lesson-plan/modeling-the-earth-moon-system/
body:
  shuffle: false
  items:
  - id: q1
    stem: 一张照片宽 6 厘米、高 4 厘米。放大成哪种大小，里面的人像不会走样？
    answer:
      type: choice
      choices:
      - id: a
        text: 8 × 6 厘米
        misconception: add-same-keeps-ratio
        feedback: 宽高都加了 2 厘米，宽和高放大的倍数一样吗？
      - id: b
        text: 12 × 8 厘米
        correct: true
      - id: c
        text: 12 × 4 厘米
        misconception: bigger-is-similar
        feedback: 宽变成两倍，高还在原地。看相框里的人会不会变扁。
    feedback:
      correct: 宽和高都变成原来的 2 倍，形状保留下来了。
      wrong: 比较两条边各自放大的倍数。
    hints:
    - 比较两条边各自放大的倍数。
    - 找到宽和高放大倍数相同的一张。
  - id: q2
    stem: '相框保持形状。4 : 3 = 20 : □。方框里填几？'
    answer:
      type: number
      value: 15
      tolerance: 0
      common_wrong:
      - value: 19
        feedback: 你给两边各加了 16。照片不走样时，两边放大的倍数相同。
        misconception: add-same-keeps-ratio
    feedback:
      correct: 20 是 4 的 5 倍，高也变成 3 × 5 = 15。
      wrong: 4 变成 20，是放大几倍？
    hints:
    - 4 变成 20，是放大几倍？
    - 让高也放大同样的倍数。
  - id: q3
    stem: '地图比例尺为 1 : 50000。图上量得 6 厘米，实际有几千米？'
    answer:
      type: number
      value: 3
      tolerance: 0
      unit: 千米
      common_wrong:
      - value: 30
        feedback: 6 × 50000 得到的是厘米。1 千米等于多少厘米？
        misconception: unit-slip
      - value: 50000
        feedback: 50000 厘米是图上 1 厘米的实际长度。题里的线有 6 厘米。
        misconception: scale-as-distance
    feedback:
      correct: 6 × 50000 = 300000 厘米，也就是 3000 米，等于 3 千米。
      wrong: 先算实际长度有多少厘米。
    hints:
    - 先算实际长度有多少厘米。
    - 1 千米是 1000 米，每米有 100 厘米。
  - id: q4
    stem: 每支笔 3 元。在格子纸上横着数支数，竖着数总价。把这些点连起来是什么样？
    answer:
      type: choice
      choices:
      - id: a
        text: 越来越陡的弯线
        misconception: curve-growth
        feedback: 每多买一支，总价都恰好多 3 元。看看上升的步子变没变。
      - id: b
        text: 散乱的点
        misconception: no-pattern
        feedback: 列出 0、1、2、3 支的总价，看看每步是不是一样大。
      - id: c
        text: 一条经过 0 的直线
        correct: true
    feedback:
      correct: 0 支是 0 元。每向右 1 格都向上 3 格，点在一条经过 0 的直线上。
      wrong: 先标出 0 支笔和 1 支笔。
    hints:
    - 先标出 0 支笔和 1 支笔。
    - 每多买一支，点向右走几格、向上走几格？
  - id: q5
    stem: 把月球直径粗略看成地球直径的四分之一。地球模型直径 4 厘米，月球模型直径约几厘米？
    answer:
      type: number
      value: 1
      tolerance: 0
      unit: 厘米
      common_wrong:
      - value: 16
        feedback: 月球比地球小。你的模型比地球模型大还是小？
      - value: 0.25
        feedback: 0.25 说的是月球占地球直径多少，还要用上模型的直径。
    feedback:
      correct: 4 厘米平均分成 4 段，每段 1 厘米。月球模型直径约 1 厘米。
      wrong: 月球模型比地球模型小。
    hints:
    - 月球模型比地球模型小。
    - 把 4 厘米平均分成 4 段，取其中一段。
# END OF FILE
