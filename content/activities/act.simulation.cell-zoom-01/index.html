<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>显微镜下的小房间</title>
<style>
:root{
  --bg:#F5F4EE; --pane:#FBFAF6; --rule:#E0DCD0; --hover:#E7E4D9;
  --ink:#1F1E1C; --text:#3B3833; --muted:#7A766D;
  --accent:#C2603F; --accent-soft:#F3E0D6;
  --sage:#CCD6C0; --sage-bg:#DCE3D2; --sky:#CFDCE6; --apricot:#ECCDB6; --paper:#EFE4D6;
  --good:#3B7A56; --good-soft:#DCEBDF; --bad:#B4432E; --bad-soft:#F5DFD8;
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1E1E1E; --pane:#252525; --rule:#353535; --hover:#2E2E2E;
  --ink:#E4E0D8; --text:#CBC6BC; --muted:#8C887F;
  --accent:#E0876A; --accent-soft:#3A2A24;
  --sage:#3C4836; --sage-bg:#28301F; --sky:#2D3B47; --apricot:#5A4536; --paper:#33302A;
  --good:#7CC79A; --good-soft:#203528; --bad:#EF8A72; --bad-soft:#3A2420;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:12px 14px 28px}
.card{background:var(--pane);border:1px solid var(--rule);border-radius:18px;overflow:hidden}
.card header,.card footer{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 16px}
.card header{border-bottom:1px solid var(--rule)}
.card footer{border-top:1px solid var(--rule);min-height:44px;align-items:center}
.station{font-size:13px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
h1{font-family:var(--f-serif);font-size:20px;font-weight:600;color:var(--ink);margin:0;text-align:right}
.card footer{flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted);flex:1 1 auto}
.readout{white-space:nowrap;margin-left:auto;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px;text-align:right}
.readout b{color:var(--accent);font-weight:600}
svg#stage{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
svg#stage:focus{outline:none}
svg#stage:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.k{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.k1{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.kf{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:3 6}
.thread{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.t{fill:var(--ink);font-family:var(--f-sans);font-size:16px}
.tm{fill:var(--muted);font-family:var(--f-sans);font-size:15px}
.num{fill:var(--ink);font-family:var(--f-mono);font-size:16px}
.c-skin{fill:var(--paper);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
.c-onion{fill:var(--sage);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
.c-rbc{fill:var(--apricot);stroke:var(--ink);stroke-width:1.2}
.c-hero{fill:var(--accent);fill-opacity:.26;stroke:var(--accent);stroke-width:2.6;stroke-linejoin:round}
.nuc{fill:var(--ink);fill-opacity:.5}
.talk{display:flex;gap:10px;align-items:flex-start;margin:14px 2px 6px}
.ava{flex:none;width:42px;height:42px}
.bubble{background:var(--pane);border:1px solid var(--rule);border-radius:16px 16px 16px 4px;padding:10px 14px;color:var(--ink);min-height:44px;flex:1}
.bubble.good{background:var(--good-soft);border-color:transparent}
.bubble.bad{background:var(--bad-soft);border-color:transparent}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin:10px 0 0}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 18px;min-height:48px;font-size:17px;font-weight:600;touch-action:none}
.btn.ghost{background:var(--pane);color:var(--ink)}
.btn.choice{background:var(--bg);color:var(--ink);font-weight:500;text-align:left;flex:1 1 220px}
.btn.choice:hover{background:var(--hover)}
.btn.hold{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.hold.on{filter:brightness(.9)}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{min-height:40px;font-size:15px;padding:6px 14px;font-weight:500}
.qbox{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.qbox textarea{flex:1 1 260px;font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);min-height:64px}
@media (max-width:520px){ body{font-size:16px} h1{font-size:17px} .card header,.card footer{padding:8px 12px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <header><span class="station" id="station">第 1 站 · 共 4 站</span><h1 id="title">放大</h1></header>
    <svg id="stage" viewBox="0 0 800 610" tabindex="0" role="application" aria-label="动手区">
      <defs><clipPath id="vclip"><circle cx="285" cy="272" r="210"/></clipPath></defs>
      <g id="static"></g><g id="dyn"></g>
    </svg>
    <footer><span class="hint" id="hint"></span><span class="readout" id="readout"></span></footer>
  </div>
  <div class="talk">
    <svg class="ava" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="27" r="16" fill="var(--sky)"/>
      <path class="k" d="M9 27 C9 18 15 11 24 11 C33 11 39 18 39 27 C39 36 33 43 24 43 C15 43 9 36 9 27 Z"/>
      <path class="k1" d="M24 11 L24 5 M21 4.5 C22 3.5 26 3.5 27 4.5"/>
      <circle cx="18.5" cy="25" r="2.2" fill="var(--ink)"/><circle cx="29.5" cy="25" r="2.2" fill="var(--ink)"/>
      <path class="k1" d="M18 32 C21 35 27 35 30 32"/>
    </svg>
    <div class="bubble" id="say" aria-live="polite"></div>
  </div>
  <div class="actions" id="actions"></div>
  <div id="qarea"></div>
</div>

<script>
"use strict";
/* ============ 1. 真相模型：页面上的每个数字都从这里算 ============
   每一条都在 2026-11-06 用网络核对过出处，见右边注释。 */
const MODEL = {
  bodyCells: 3.72e13,   // 人体约 3.72×10¹³ 个细胞。Bianconi E 等 2013, Annals of Human Biology 40(6):463–471, doi:10.3109/03014460.2013.807878
                        //   核对：BioNumbers BNID 109716（https://bionumbers.hms.harvard.edu/bionumber.aspx?id=109716）引同一篇，3.7×10¹³ ± 0.8×10¹³
  hookeYear: 1665,      // 胡克《Micrographia》1665：看软木塞，一格格小空格像修道院的小房间，叫 cell（拉丁文 cella = 小房间）
                        //   核对：https://communities.springernature.com/posts/why-did-robert-hooke-call-them-cells ；Wikipedia「Cell (biology)」
                        //   注意：软木塞的细胞已经死了，胡克看到的是空的格子壁。页面只说「小空格」
  eyeMm: 0.1,           // 人眼能分辨的最小约 0.1 毫米。核对：James Madison University 显微镜中心 https://www.jmu.edu/microscopy/access-and-training/resolution.pdf
  hairMm: 0.07,         // 一根头发约 0.05～0.1 毫米，取 0.07。核对：The Physics Factbook https://hypertextbook.com/facts/1999/BrianLey.shtml
                        //   （汇总各家 0.017～0.181 毫米；扫描电镜实测 0.06～0.08 毫米）
  skinMm: 0.015,        // 皮肤（表皮里活的那层）细胞约 0.011～0.02 毫米，取 0.015。核对：Barrandon & Green 1985, PNAS 82:5390 https://pmc.ncbi.nlm.nih.gov/articles/PMC390574
                        //   原任务写「常见人体细胞大多 10～30 微米」，查到的可靠数是这一条，所以只用皮肤细胞这一个数。
                        //   注意：皮肤最外面那层是已经死掉、压扁、没有细胞核的细胞；这里画的是下面活的那层（有细胞核）。
  rbcMm: 0.0075,        // 红细胞直径 7～8 微米，双凹的圆饼，成熟时没有细胞核。核对：https://histo.uaz.edu.mx/pathology/ed/keywords/kw_red_bloo.htm ；人教版七上（life-manual）
  onionMm: 0.25,        // 洋葱表皮细胞约 0.2～0.4 毫米长，取 0.25。核对：https://docbrown.info/ebiology/microscopy-3.htm（约 200 微米）；
                        //   Wayne's Word Lab Exercise 1 https://waynesword.net/lmexer1.htm（0.25～0.4 毫米）。原任务写 0.1～0.3 毫米，按出处改为 0.2～0.4 毫米
  onionWideMm: 0.05,    // 只用来画长砖的宽，页面上不显示这个数
  neuronM: 1,           // 最长的神经细胞从脊髓下端伸到大脚趾，约 1.3 米。核对：Guinness World Records https://www.guinnessworldrecords.com/world-records/67725-longest-cell
                        //   页面说「1 米多」，用 1 作下限算倍数（所以说「6 万多倍」）
  fov0Mm: 40,           // 画法约定（不是事实）：放大 1 倍时，视野圆圈当作 4 厘米宽的一块。比例尺和「圆圈宽」都从这里算，彼此一致
  maxMag: 400,
  target: { skin: 400, onion: 100, blood: 400 }   // 每种样本放大到几倍算「看清了」
};
MODEL.divisions = Math.round(Math.log2(MODEL.bodyCells));   // 45：log2(3.72×10¹³) ≈ 45.1
MODEL.cellsAfter = Math.pow(2, MODEL.divisions);            // 2^45 = 35 184 372 088 832 ≈ 35 万亿（算术，假设每次全部分成两个）
MODEL.hairFit = Math.floor(MODEL.hairMm / MODEL.skinMm);    // 头发那么宽，能并排放下 4 个皮肤细胞
MODEL.onionVsSkin = Math.floor(MODEL.onionMm / MODEL.skinMm / 10) * 10;   // 洋葱细胞比皮肤细胞长 10 倍还多（0.25 / 0.015 ≈ 16.7）
MODEL.neuronVsSkinWan = Math.floor(MODEL.neuronM * 1000 / MODEL.skinMm / 1e4);   // 6：1 米 ÷ 0.015 毫米 ≈ 6.7 万倍 → 「6 万多倍」
const magOf = z => Math.pow(MODEL.maxMag, z);
const zOf = m => Math.log(m) / Math.log(MODEL.maxMag);
const trim = s => String(s).replace(/\.0+$/, "").replace(/(\.\d*?)0+$/, "$1");
function fmtMm(mm){
  if (mm >= 10) return trim((mm / 10).toFixed(mm >= 100 ? 0 : 1)) + " 厘米";
  if (mm >= 1) return trim(mm.toFixed(mm >= 9.95 ? 0 : 1)) + " 毫米";
  return String(+mm.toPrecision(2)) + " 毫米";
}
const fmtMag = m => String(Math.max(1, Math.round(m)));
function fmtCount(n){
  const u = (v, w) => (v < 10 ? trim(v.toFixed(1)) : String(Math.round(v))) + " " + w;
  if (n < 1e4) return String(Math.round(n));
  if (n < 1e8) return u(n / 1e4, "万");
  if (n < 1e12) return u(n / 1e8, "亿");
  return u(n / 1e12, "万亿");
}

/* ============ 2. 平台契约 activity/1.1（单独打开时也能玩） ============ */
const Host = (() => {
  const h = {}, inFrame = window.parent !== window;
  addEventListener("message", e => { const m = e.data; if (m && m.contract === "activity/1.1" && h[m.type]) h[m.type](m.payload || {}); });
  const send = (type, payload) => { if (inFrame) parent.postMessage({ contract: "activity/1.1", type, payload: payload || {} }, "*"); };
  if (window.ResizeObserver) new ResizeObserver(() => send("resize", { h: document.documentElement.scrollHeight })).observe(document.body);
  return { on: (k, f) => { h[k] = f; }, ready: () => send("ready"), event: (verb, result) => send("event", { verb, result }),
    state: o => send("state", o), noteQuestion: text => send("note_question", { text }), complete: r => send("complete", r || {}) };
})();
Host.on("init", p => {
  if (p && p.palette) for (const [k, v] of Object.entries(p.palette)) if (/^[a-z-]+$/.test(k)) document.documentElement.style.setProperty("--" + k, v);
});

/* ============ 3. 手绘线条（平台的 sketchLib） ============ */
function sketchLib(){
  const R=(seed)=>{ let s=((seed|0)*2654435761)>>>0||7; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };
  const f=n=>Math.round(n*10)/10;
  function cr(p,closed){ const n=p.length; let d=`M${f(p[0][0])} ${f(p[0][1])}`;
    for(let i=0;i<(closed?n:n-1);i++){ const p1=p[i],p2=p[(i+1)%n]; const p0=(!closed&&i===0)?p1:p[(i-1+n)%n]; const p3=(!closed&&i+2>=n)?p2:p[(i+2)%n];
      d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }
    return d; }
  function line(x1,y1,x2,y2,seed,j){ const r=R(seed); j=j==null?1:j; const L=Math.hypot(x2-x1,y2-y1)||1; const a=Math.min(1.8,.5+L*.008)*j; const o=()=>(r()-.5)*2*a;
    const nx=-(y2-y1)/L, ny=(x2-x1)/L, bow=(r()-.5)*Math.min(L*.035,6)*j;
    return `M${f(x1+o())} ${f(y1+o())}Q${f((x1+x2)/2+nx*bow)} ${f((y1+y2)/2+ny*bow)} ${f(x2+o())} ${f(y2+o())}`; }
  function ellipse(cx,cy,rx,ry,seed,j){ const r=R(seed); j=j==null?1:j; const N=12, a0=r()*Math.PI*2, turn=1.05+r()*.06, p=[];
    for(let i=0;i<=N;i++){ const t=a0+i/N*Math.PI*2*turn, k=1+(r()-.5)*.07*j; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); }
    return cr(p,false); }
  function blob(cx,cy,rx,ry,seed){ const r=R(seed), N=9, p=[]; for(let i=0;i<N;i++){ const t=i/N*Math.PI*2, k=1+(r()-.5)*.1; p.push([cx+Math.cos(t)*rx*k, cy+Math.sin(t)*ry*k]); } return cr(p,true)+"Z"; }
  function curve(pts,seed,j){ const r=R(seed); j=j==null?1:j; return cr(pts.map(q=>[q[0]+(r()-.5)*2*j,q[1]+(r()-.5)*2*j]),false); }
  return {line,ellipse,blob,curve,cr,R};
}
const Sk = sketchLib();
function ring(cx, cy, r, seed, j){   // 大圆：一笔画圈，末尾稍稍搭过头，半径抖动很小，贴着裁剪圆
  const rnd = Sk.R(seed), N = 28, a0 = rnd() * Math.PI * 2, over = .03 + rnd() * .03, p = [];
  j = j == null ? 1 : j;
  for (let i = 0; i <= N; i++){ const t = a0 + i / N * Math.PI * 2 * (1 + over), k = 1 + (rnd() - .5) * .012 * j; p.push([cx + Math.cos(t) * r * k, cy + Math.sin(t) * r * k]); }
  return Sk.cr(p, false);
}
const P = (d, cls, extra) => `<path class="${cls || "k"}" d="${d}"${extra ? " " + extra : ""}/>`;
// 字号、字体写进 style：写成属性会被 .t / .tm 的 CSS 盖掉
function T(x, y, s, cls, extra){
  let st = "";
  extra = (extra || "").replace(/font-size="(\d+)"/, (m0, v) => { st += `font-size:${v}px;`; return ""; }).replace(/font-family="([^"]+)"/, (m0, v) => { st += `font-family:${v};`; return ""; }).trim();
  return `<text x="${x}" y="${y}" class="${cls || "t"}"${st ? ` style="${st}"` : ""}${extra ? " " + extra : ""}>${s}</text>`;
}
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = t => t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const f1 = n => Math.round(n * 10) / 10;
// 固定的伪随机：同一个格子每一帧抖动都一样
function hash(i, j, s){ let x = Math.imul(i | 0, 73856093) ^ Math.imul(j | 0, 19349663) ^ Math.imul((s | 0) + 1, 83492791); x = Math.imul(x ^ (x >>> 13), 1274126177); return ((x ^ (x >>> 16)) >>> 0) / 4294967296; }
// 两头圆的胶囊：先画墨线粗笔，再盖一层颜色细一点的笔
const limb = (d, w, fill) => `<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="${w + 3}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${fill}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

/* ============ 4. 页面骨架 ============ */
const $ = id => document.getElementById(id);
const svg = $("stage"), gStatic = $("static"), gDyn = $("dyn");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const STATIONS = 4;
const VX = 285, VY = 272, VR = 210;          // 目镜视野
const DX = 665, DY = 462, KR = 44;            // 放大旋钮
const STAGE = { x: 652, y: 186 };             // 载物台上放玻片的位置
function fresh(){
  return { station: 1, mode: "talk", holdKey: null, z: 0, zt: 0, sample: "skin", seen: { skin: false, onion: false, blood: false },
    said: {}, want: null, drag: null, cork: false, neuron: false, d: 0, dt: 0, lastG: 0,
    tap: { skin: null, onion: null, blood: null }, nuclei: new Set(), focus: -1, kbd: false };
}
let S = fresh();

function head(n, title){ $("station").textContent = n ? `第 ${n} 站 · 共 ${STATIONS} 站` : "星卡"; $("title").textContent = title; }
function hint(s){ $("hint").textContent = s || ""; }
function readout(html){ $("readout").innerHTML = html || ""; }
function say(text, tone){ const b = $("say"); b.textContent = text; b.className = "bubble" + (tone ? " " + tone : ""); }
function actions(list){
  const box = $("actions"); box.replaceChildren();
  for (const a of list || []){
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn " + (a.cls || ""); b.textContent = a.label;
    if (a.hold){
      const on = v => { S.holdKey = v ? a.hold : null; b.classList.toggle("on", v); };
      b.addEventListener("pointerdown", e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); on(true); });
      for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) b.addEventListener(ev, () => on(false));
      b.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); a.step(); } });
      b.addEventListener("contextmenu", e => e.preventDefault());
    } else {
      // 只认在这个按钮上按下去的点击：按住「放大」时站点完成、按钮换成「继续」，松手不能误点到它
      b.addEventListener("pointerdown", () => { b._down = true; });
      b.addEventListener("click", e => { if (e.detail > 0 && !b._down) return; a.go(e); });
    }
    box.append(b);
  }
  return box;
}
function ask(item, question, options, onAnswer){
  say(question);
  actions(options.map((o, i) => ({ label: o.label, cls: "choice", go: () => {
    Host.event("predicted", { station: S.station, item, choice: i, correct: !!o.correct, misconception: o.mis || null });
    say(o.feedback, o.correct ? "good" : "bad");
    onAnswer(o);
  }})));
}
function next(label, go, cls){ actions([{ label, go, cls }]); }

// 「我有个问题」：随时可以问，发到信号站
(function(){
  const area = $("qarea");
  const open = document.createElement("button");
  open.type = "button"; open.className = "btn ghost small"; open.textContent = "我有个问题";
  open.style.marginTop = "12px";
  open.addEventListener("click", () => {
    if (area.querySelector("textarea")) return;
    const ta = document.createElement("textarea"); ta.maxLength = 120; ta.placeholder = "想问领航员什么？";
    const send = document.createElement("button"); send.type = "button"; send.className = "btn small"; send.textContent = "发给领航员";
    const box = document.createElement("div"); box.className = "qbox"; box.append(ta, send);
    send.addEventListener("click", () => {
      const q = ta.value.trim(); if (!q) return;
      Host.noteQuestion(q); box.remove(); say("好问题，我记下来了。等会儿一起找答案。");
    });
    area.append(box); ta.focus();
  });
  area.append(open);
})();

/* ============ 5. 显微镜、旋钮、玻片 ============ */
function microscopeSvg(){
  let s = "";

  for (let j = 0; j < 4; j++) for (let i = 0; i < 6; i++){
    const cx = x0 + 22 + i * hx * 2 + (j & 1 ? hx : 0), cy = y0 + 16 + j * hy * 1.5, rr = Sk.R(820 + i + j * 7);
    const pts = []; for (let k = 0; k < 6; k++){ const a = Math.PI / 6 + k * Math.PI / 3; pts.push([cx + Math.cos(a) * hx * 1.12 + (rr() - .5) * 2, cy + Math.sin(a) * hy * .98 + (rr() - .5) * 2]); }

  }
  s += `<path d="${cells}" fill="var(--pane)" fill-opacity=".7" stroke="var(--ink)" stroke-width="1.3" stroke-linejoin="round"/>`;
  s += T(x0 + 196, y0 + 40, MODEL.hookeYear, "t", 'font-size="24" font-family="var(--f-serif)"') + T(x0 + 196, y0 + 68, "软木塞", "tm");
  return s;
}

/* ============ 9. 第 3 站：细胞是活的 ============ */
const DFIT = 300, FAST = 6;   // 分到第 6 次（64 个）以后，视野装不下，改成铺满的一整片
const colsOf = g => Math.pow(2, Math.ceil(g / 2)), rowsOf = g => Math.pow(2, Math.floor(g / 2));
const scOf = g => DFIT / Math.max(colsOf(g), rowsOf(g));
function unionPath(x1, y1, x2, y2, R){   // 两个一样大的圆合起来的轮廓（细胞中间正在收紧）
  const dx = x2 - x1, dy = y2 - y1, s = Math.hypot(dx, dy);
  if (s < .01) return `M${f1(x1 - R)} ${f1(y1)}a${f1(R)} ${f1(R)} 0 1 0 ${f1(2 * R)} 0a${f1(R)} ${f1(R)} 0 1 0 ${f1(-2 * R)} 0Z`;
  if (s >= 2 * R) return null;
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, h = Math.sqrt(R * R - s * s / 4), px = -dy / s, py = dx / s;
  const ax = mx + px * h, ay = my + py * h, bx = mx - px * h, by = my - py * h;
  return `M${f1(ax)} ${f1(ay)}A${f1(R)} ${f1(R)} 0 1 1 ${f1(bx)} ${f1(by)}A${f1(R)} ${f1(R)} 0 1 1 ${f1(ax)} ${f1(ay)}Z`;
}
function cellPair(x, y, ax, ay, q, r, sc, nucOff, withWall){
  // 一个正在分开的细胞：中心 (x,y)，沿 (ax,ay) 分开，分开程度 q
  const c1x = x - ax * q / 2, c1y = y - ay * q / 2, c2x = x + ax * q / 2, c2y = y + ay * q / 2;
  const X = v => VX + v * sc, Y = v => VY + v * sc, R = r * sc;
  let s = "";
  const d = unionPath(X(c1x), Y(c1y), X(c2x), Y(c2y), R);
  if (d){
    s += `<path class="c-hero" d="${d}"/>`;
    if (withWall && q > .02){
      const s2 = q * sc, h = Math.sqrt(Math.max(0, R * R - s2 * s2 / 4)) * Math.min(1, q * 3);
      const mx = X(x), my = Y(y);
      s += `<line x1="${f1(mx - ay * h)}" y1="${f1(my + ax * h)}" x2="${f1(mx + ay * h)}" y2="${f1(my - ax * h)}" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/>`;
    }
  } else s += `<circle class="c-hero" cx="${f1(X(c1x))}" cy="${f1(Y(c1y))}" r="${f1(R)}"/><circle class="c-hero" cx="${f1(X(c2x))}" cy="${f1(Y(c2y))}" r="${f1(R)}"/>`;
  const nr = Math.max(1.2, .13 * sc);
  if (nucOff < .001) s += `<circle class="nuc" cx="${f1(X(x))}" cy="${f1(Y(y))}" r="${f1(nr)}"/>`;
  else s += `<circle class="nuc" cx="${f1(X(x - ax * nucOff))}" cy="${f1(Y(y - ay * nucOff))}" r="${f1(nr)}"/><circle class="nuc" cx="${f1(X(x + ax * nucOff))}" cy="${f1(Y(y + ay * nucOff))}" r="${f1(nr)}"/>`;
  return s;
}
function divPhase(d){
  const n = MODEL.divisions, g = Math.min(n, Math.floor(d + 1e-9)), ph = g >= n ? 0 : d - g;
  const grow = smooth(clamp(ph / .4)), split = smooth(clamp((ph - .55) / .45)), nsplit = smooth(clamp((ph - .38) / .22));
  return { g, ph, grow, split, nsplit };
}
function drawDivide(){
  const { g, ph, grow, split, nsplit } = divPhase(S.d);
  const xAxis = g % 2 === 0, ax = xAxis ? 1 : 0, ay = xAxis ? 0 : 1;
  const fast = g >= FAST;
  const sc0 = scOf(Math.min(g, FAST)), sc1 = scOf(Math.min(g + 1, FAST)), sc = sc0 * Math.pow(sc1 / sc0, split);
  const cols = colsOf(g), rows = rowsOf(g);
  const r = .45 * (ph < .55 ? 1 + .26 * grow : 1.26 - .26 * split);
  const nucOff = split > 0 ? .2 * (1 - split) + .5 * split : .2 * nsplit;
  let s = `<circle cx="${VX}" cy="${VY}" r="${VR}" fill="var(--sage)" opacity=".25"/>`;
  if (!fast){
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++){
      const x0 = i - (cols - 1) / 2, y0 = j - (rows - 1) / 2;
      const x = xAxis ? x0 * (1 + split) : x0, y = xAxis ? y0 : y0 * (1 + split);
      s += cellPair(x, y, ax, ay, split, r, sc, nucOff, true);
      if (g <= 2 && ph > 0 && ph < .42){   // 养料：从四周被吸进来
        for (let k = 0; k < 6; k++){
          const a = k / 6 * Math.PI * 2 + i + j, rr = (1.25 - .75 * clamp(ph / .4)) * .6;
          s += `<circle cx="${f1(VX + (x + Math.cos(a) * rr) * sc)}" cy="${f1(VY + (y + Math.sin(a) * rr) * sc)}" r="${f1(Math.max(2.5, .04 * sc))}" fill="var(--good)" opacity="${(.8 * (1 - clamp(ph / .4))).toFixed(2)}"/>`;
        }
      }
    }
  } else {
    // 太多了，视野里装不下：铺成一整片，每一格还是一个细胞，所有细胞一起长大、一起分，往外挤
    const tw = (xAxis ? 1 + split : 1) * sc, th = (xAxis ? 1 : 1 + split) * sc;
    const inner = cellPair(0, 0, ax, ay, split, r, sc, nucOff, true);
    s += `<pattern id="tis" patternUnits="userSpaceOnUse" x="${VX}" y="${VY}" width="${f1(tw)}" height="${f1(th)}"><g transform="translate(${f1(tw / 2 - VX)} ${f1(th / 2 - VY)})">${inner}</g></pattern>`;
    s += `<rect x="${VX - VR}" y="${VY - VR}" width="${2 * VR}" height="${2 * VR}" fill="url(#tis)"/>`;
    // 外沿往外挤的箭头：越来越多，装不下了
    const push = 10 * split;
    for (let i = 0; i < 8; i++){
      const a = i / 8 * Math.PI * 2 + Math.PI / 8, x1 = VX + Math.cos(a) * (VR - 46 + push), y1 = VY + Math.sin(a) * (VR - 46 + push);
      const x2 = VX + Math.cos(a) * (VR - 18 + push), y2 = VY + Math.sin(a) * (VR - 18 + push);
      s += `<g opacity=".8"><line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="var(--pane)" stroke-width="7" stroke-linecap="round"/>` +
        `<path class="k" d="M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - Math.cos(a - .5) * 9)} ${f1(y2 - Math.sin(a - .5) * 9)}L${f1(x2)} ${f1(y2)}L${f1(x2 - Math.cos(a + .5) * 9)} ${f1(y2 - Math.sin(a + .5) * 9)}"/></g>`;
    }
  }
  return s;
}
function counterStatic(){
  return `<rect x="560" y="64" width="216" height="420" rx="16" fill="var(--paper)" opacity=".6"/>` +
    P(Sk.line(570, 64, 766, 64, 900) + Sk.line(570, 484, 766, 484, 901) + Sk.line(560, 74, 560, 474, 903) + Sk.line(776, 74, 776, 474, 904), "k1") +

function counterDyn(){

}
function barsSvg(){

    T(x0 + 10, 584, "约 " + fmtCount(MODEL.bodyCells), "t");
}
function readout3(){
  const { g } = divPhase(S.d);

const tOfD = t => t < .4 ? 3 * t / .4 : 3 + (MODEL.divisions - 3) * (t - .4) / .6;   // 前 3 次慢慢分，后面越来越快

/* ============ 10. 第 4 站：小房间里的小房间 ============ */
const TILE = { skin: { x: 140, name: "皮肤" }, onion: { x: 400, name: "洋葱" }, blood: { x: 660, name: "血" } };
const TY = 284, TR = 118;
const CELLS = { skin: [], onion: [], blood: [] };
let CANDS = [];
function makeTiles(){
  CELLS.skin = []; CELLS.onion = []; CELLS.blood = [];
  for (let j = -4; j <= 4; j++) for (let i = -4; i <= 4; i++){
    const x = (i + (j & 1 ? .5 : 0)) * 52 + (hash(i, j, 40) - .5) * 6, y = j * 45 + (hash(i, j, 41) - .5) * 6;
    if (Math.hypot(x, y) > TR + 28) continue;
    CELLS.skin.push({ x, y, r: 24, nx: (hash(i, j, 42) - .5) * 8, ny: (hash(i, j, 43) - .5) * 8, seed: 1000 + i * 9 + j * 91, cand: Math.hypot(x, y) <= TR - 24 });
  }
  for (let j = -3; j <= 3; j++){
    const off = (hash(j, 0, 44) - .5) * 150;
    for (let i = -2; i <= 2; i++){
      const x = off + i * 150, y = j * 44;
      if (Math.abs(x) > TR + 80 || Math.abs(y) > TR + 22) continue;
      CELLS.onion.push({ x, y, w: 146, h: 40, nx: (hash(i, j, 45) - .5) * 70, ny: (hash(i, j, 46) - .5) * 10, cand: Math.hypot(x, y) <= TR - 30 && Math.abs(x) < 70 + (TR - 30) });
    }
  }
  CELLS.onion.forEach(c => c.cand = Math.hypot(Math.max(0, Math.abs(c.nx + c.x) - 0), c.y) <= TR - 28);
  const r = Sk.R(77), pts = [];
  for (let k = 0; k < 22; k++){
    let best = null, bg = -1e9;
    for (let t = 0; t < 200; t++){
      const a = r() * Math.PI * 2, d = Math.sqrt(r()) * (TR - 10), x = Math.cos(a) * d, y = Math.sin(a) * d;
      const gap = pts.length ? Math.min(...pts.map(p => Math.hypot(p.x - x, p.y - y))) : 99;
      if (gap > bg){ bg = gap; best = { x, y }; }
    }
    pts.push(best);
  }
  CELLS.blood = pts.map(p => ({ x: p.x, y: p.y, r: 17, cand: Math.hypot(p.x, p.y) <= TR - 20 }));
  CANDS = [];
  for (const key of ["skin", "onion", "blood"]) CELLS[key].forEach((c, idx) => { if (c.cand) CANDS.push({ key, idx }); });
}
function nucPos(key, c){ return key === "skin" ? [c.x + c.nx, c.y + c.ny] : [c.x + c.nx, c.y + c.ny]; }
function tileSvg(key, cx, cy, R, sel, opts){
  const k = R / TR, id = "tc-" + key + (opts && opts.end ? "e" : "");
  const X = v => f1(cx + v * k), Y = v => f1(cy + v * k);
  let s = `<clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath><circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--pane)"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--sky)" opacity=".25"/><g clip-path="url(#${id})">`;
  if (key === "skin"){
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--apricot)" opacity=".6"/>`;
    CELLS.skin.forEach((c, i) => { const hl = sel === i; s += `<path class="${hl ? "c-hero" : "c-skin"}" d="${Sk.blob(cx + c.x * k, cy + c.y * k, c.r * k, c.r * k * .95, c.seed)}"/>`; });
    CELLS.skin.forEach((c, i) => { const [nx, ny] = nucPos(key, c); s += sel === i ? `<circle cx="${X(nx)}" cy="${Y(ny)}" r="${f1(9 * k)}" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.4"/>` : `<circle class="nuc" cx="${X(nx)}" cy="${Y(ny)}" r="${f1(7 * k)}"/>`; });
  } else if (key === "onion"){
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--sage)" opacity=".4"/>`;
    CELLS.onion.forEach((c, i) => {
      const hl = sel === i, x0 = cx + (c.x - c.w / 2) * k, y0 = cy + (c.y - c.h / 2) * k, w = c.w * k, h = c.h * k;
      s += `<path class="${hl ? "c-hero" : "c-onion"}" d="M${f1(x0)} ${f1(y0)}h${f1(w)}v${f1(h)}h${f1(-w)}Z" ${hl ? "" : 'fill-opacity=".75"'}/>`;
    });
    CELLS.onion.forEach((c, i) => { const [nx, ny] = nucPos(key, c); s += sel === i ? `<ellipse cx="${X(nx)}" cy="${Y(ny)}" rx="${f1(10 * k)}" ry="${f1(8 * k)}" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.4"/>` : `<ellipse class="nuc" cx="${X(nx)}" cy="${Y(ny)}" rx="${f1(8 * k)}" ry="${f1(6 * k)}"/>`; });
  } else {
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--apricot)" opacity=".3"/>`;
    CELLS.blood.forEach((c, i) => { const hl = sel === i; s += `<circle class="${hl ? "c-hero" : "c-rbc"}" cx="${X(c.x)}" cy="${Y(c.y)}" r="${f1(c.r * k)}"/><circle cx="${X(c.x)}" cy="${Y(c.y)}" r="${f1(c.r * k * .42)}" fill="var(--pane)" opacity=".55"/>`; });
  }
  s += "</g>" + P(ring(cx, cy, R, 1100 + key.length), "k");
  return s;
}
function calloutSvg(key, idx){   // 放大镜：把点中的那个细胞再放大一点
  const c = CELLS[key][idx], tx = TILE[key].x, cx = tx, cy = 88, R = 54;
  let s = P(Sk.line(tx + (key === "onion" ? c.x + c.nx : c.x), TY + c.y, cx, cy + R, 1200), "kf");
  s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--pane)"/>`;
  if (key === "skin") s += `<path class="c-hero" d="${Sk.blob(cx, cy, 40, 37, c.seed)}"/><circle cx="${f1(cx + c.nx * 1.6)}" cy="${f1(cy + c.ny * 1.6)}" r="14" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.6"/>`;
  else if (key === "onion") s += `<path class="c-hero" d="M${cx - 48} ${cy - 20}h96v40h-96Z"/><ellipse cx="${f1(cx + c.nx * .5)}" cy="${cy}" rx="14" ry="11" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.6"/>`;
  else s += `<circle class="c-hero" cx="${cx}" cy="${cy}" r="38"/><circle cx="${cx}" cy="${cy}" r="16" fill="var(--pane)" opacity=".6"/>`;
  return s + P(ring(cx, cy, R, 1201), "k") + P(Sk.line(cx - R * .72, cy + R * .72, cx - R * .72 - 16, cy + R * .72 + 16, 1202), "k", 'stroke-width="5"');
}
function draw4(){
  let s = "";
  for (const key of ["skin", "onion", "blood"]){
    const t = TILE[key], sel = S.tap[key];
    s += tileSvg(key, t.x, TY, TR, sel);
    s += T(t.x, TY + TR + 34, t.name, "t", 'text-anchor="middle" font-size="20"');
    if (sel != null){
      s += calloutSvg(key, sel);
      const has = key !== "blood";
      s += `<circle cx="${t.x - 52}" cy="${TY + TR + 63}" r="7" fill="${has ? "var(--accent)" : "none"}" stroke="var(--ink)" stroke-width="1.5" ${has ? "" : 'stroke-dasharray="3 3"'}/>` + T(t.x - 38, TY + TR + 69, has ? "有细胞核" : "没有细胞核", "t");
    }
  }
  if (S.nuclei.size) s += legendSvg();
  const ringAt = (x, y, w) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="31" fill="none" stroke="var(--pane)" stroke-width="${w + 3}" opacity=".8"/><circle cx="${f1(x)}" cy="${f1(y)}" r="31" fill="none" stroke="var(--ink)" stroke-width="${w}" stroke-dasharray="5 5"/>`;
  const cpos = (key, c) => [TILE[key].x + (key === "onion" ? c.x + c.nx : c.x), TY + c.y];
  if (S.mode === "tap4" && !S.kbd) for (const key of ["skin", "onion", "blood"]){   // 没点过的那一片：提示「点这样一个」
    if (S.tap[key] != null) continue;
    const c = CELLS[key].filter(c => c.cand).sort((u, v) => Math.hypot(u.x, u.y) - Math.hypot(v.x, v.y))[0];
    if (c) s += `<g opacity=".7">${ringAt(...cpos(key, c), 2)}</g>`;
  }
  if (S.kbd && S.focus >= 0){ const f = CANDS[S.focus]; s += ringAt(...cpos(f.key, CELLS[f.key][f.idx]), 3.2); }
  return s;
}
function legendSvg(){   // 小房间 → 小房间里的小房间 → 说明书
  const y = 556, room = (x, w, h, cls, seed) => { const d = `M${x - w / 2} ${y + h / 2}V${y - h / 2 + 10}L${x} ${y - h / 2 - 8}L${x + w / 2} ${y - h / 2 + 10}V${y + h / 2}Z`; return `<path class="${cls}" d="${d}"/>`; };
  let s = room(150, 70, 52, "c-skin", 1) + room(150, 32, 24, "c-hero", 2) + T(205, y + 6, "细胞", "t", 'font-size="18"');
  s += P(Sk.line(250, y, 292, y, 1500) + Sk.line(282, y - 7, 292, y, 1501) + Sk.line(282, y + 7, 292, y, 1502), "k1");
  s += room(340, 44, 34, "c-hero", 3) + T(374, y + 6, "细胞核", "t", 'font-size="18"');
  s += P(Sk.line(440, y, 482, y, 1503) + Sk.line(472, y - 7, 482, y, 1504) + Sk.line(472, y + 7, 482, y, 1505), "k1");
  s += `<rect x="506" y="${y - 18}" width="44" height="34" rx="4" fill="var(--paper)"/>` + P(Sk.line(506, y - 18, 550, y - 18, 1506) + Sk.line(506, y + 16, 550, y + 16, 1507) + Sk.line(506, y - 18, 506, y + 16, 1508) + Sk.line(550, y - 18, 550, y + 16, 1509), "k1") +
    P(Sk.line(514, y - 8, 542, y - 8, 1510) + Sk.line(514, y, 542, y, 1511) + Sk.line(514, y + 8, 534, y + 8, 1512), "k1", 'opacity=".6"') + T(562, y + 6, "说明书", "t", 'font-size="18"');
  return s;
}
function readout4(){
  const k = ["skin", "onion", "blood"].filter(x => S.tap[x] != null).length;
  readout(`找到细胞核 <b>${S.nuclei.size}</b> 个 · 看过 ${k} / 3 种`);
}
function enter4(){
  S.station = 4; S.mode = "tap4"; head(4, "小房间里的小房间"); hint("点视野里的细胞");
  makeTiles(); gStatic.innerHTML = ""; S.focus = -1; render(); readout4(); actions([]);
  say("每个细胞里，还藏着一个更小的房间。点一个细胞找找看。");
  svg.focus({ preventScroll: true });
}
function tapCell(key, idx){
  if (S.mode !== "tap4") return;
  const firstNuc = S.nuclei.size === 0, again = S.tap[key] != null;
  S.tap[key] = idx;
  if (key !== "blood") S.nuclei.add(key + idx);
  Host.event("observed", { station: 4, item: key, nucleus: key !== "blood" });
  if (key === "blood") say(again ? "这个也没有细胞核。" : "咦，红细胞里没有细胞核。长大了的红细胞是个例外。", "good");
  else if (firstNuc) say("找到了。这是细胞核，小房间里的小房间。里面放着一份说明书。", "good");
  else say(again ? "这个里面也有细胞核。" : (key === "onion" ? "洋葱细胞里也有细胞核。" : "皮肤细胞里也有细胞核。"), "good");
  render(); readout4();
  if (S.tap.skin != null && S.tap.onion != null && S.tap.blood != null) next("看我的图鉴", enterEnd);
}
function hitTile(q){
  let best = null, bd = 1e9;
  for (const key of ["skin", "onion", "blood"]){
    const t = TILE[key];
    if (Math.hypot(q.x - t.x, q.y - TY) > TR) continue;
    CELLS[key].forEach((c, idx) => {
      if (!c.cand) return;
      let d;
      if (key === "onion"){ const lx = q.x - t.x - c.x, ly = q.y - TY - c.y; d = Math.hypot(Math.max(0, Math.abs(lx) - c.w / 2), Math.max(0, Math.abs(ly) - c.h / 2)); }
      else d = Math.max(0, Math.hypot(q.x - t.x - c.x, q.y - TY - c.y) - c.r);
      if (d < bd){ bd = d; best = { key, idx }; }
    });
  }
  return best && bd <= 26 ? best : null;
}

/* ============ 11. 结尾：星卡 ============ */
function drawEnd(){
  let s = `<rect x="30" y="20" width="740" height="570" rx="20" fill="var(--pane)" stroke="var(--rule)"/>` +
    `<path d="M712 44l7 14 15 2-11 11 3 15-14-7-14 7 3-15-11-11 15-2z" fill="var(--accent)" opacity=".85"/>` +
    T(60, 72, "我的显微镜图鉴", "t", 'font-size="26" font-family="var(--f-serif)"') + T(60, 100, "舰长亲手放大、亲手找到的", "tm");
  const items = [["skin", 160, "皮肤细胞", "约 " + fmtMm(MODEL.skinMm)], ["onion", 400, "洋葱细胞", "约 " + fmtMm(MODEL.onionMm) + "长"], ["blood", 640, "红细胞", "约 " + fmtMm(MODEL.rbcMm)]];
  for (const [key, x, name, size] of items){
    s += tileSvg(key, x, 214, 76, S.tap[key], { end: true });
    s += T(x, 322, name, "t", 'text-anchor="middle" font-size="19"') + T(x, 348, size, "tm", 'text-anchor="middle"') +
      T(x, 372, key === "blood" ? "没有细胞核" : "找到了细胞核", "t", 'text-anchor="middle" font-size="15"');
  }
  s += P(Sk.line(60, 398, 740, 398, 1300), "k1");
  const stat = (x, big, small) => T(x, 452, big, "t", 'font-size="30" font-family="var(--f-serif)" text-anchor="middle"') + T(x, 482, small, "tm", 'text-anchor="middle"');
  s += stat(160, `${MODEL.maxMag} 倍`, "放大到") + stat(400, `${MODEL.divisions} 次`, `分成两个，就有约 ${fmtCount(MODEL.cellsAfter)}`) + stat(640, `约 ${fmtCount(MODEL.bodyCells)}`, "你身体里的细胞");
  s += P(Sk.line(60, 512, 740, 512, 1301), "k1") +
    T(60, 548, `找到 ${S.nuclei.size} 个细胞核，还见到了 ${MODEL.neuronM} 米多长的神经细胞。`, "t");
  return s;
}
function enterEnd(){
  S.station = 5; S.mode = "end"; head(0, "我的显微镜图鉴"); hint(""); readout(""); gStatic.innerHTML = ""; render();
  say("这是舰长的显微镜图鉴。细胞核里的说明书写了什么？下一颗星见。", "good");
  Host.event("observed", { station: 4, item: "card", nuclei: S.nuclei.size });
  Host.complete({});
  next("再玩一次", () => { S = fresh(); enter1(); }, "ghost");
}

/* ============ 12. 画面和输入 ============ */
function render(){
  let s = "";
  if (S.station === 1 || S.station === 2){
    s += viewSvg() + knobSvg(S.mode === "act1" || S.mode === "zoom2") + stageSlideSvg();
    if (S.station === 1){ s += handSvg(); if (S.cork) s += corkSvg(); }
    else {
      for (const key of ["skin", "onion", "blood"]){
        if (S.drag && S.drag.key === key) continue;
        if (S.sample === key) continue;
        s += slideSvg(key, SLIDES[key].x, SLIDE_Y, S.mode === "pick" && key !== S.want);
      }
      if (S.mode === "pick"){
        s += `<ellipse cx="${STAGE.x}" cy="${STAGE.y}" rx="70" ry="22" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 6"/>`;
        if (!S.drag){ const w = SLIDES[S.want]; s += P(Sk.curve([[w.x + 40, SLIDE_Y - 30], [530, 300], [STAGE.x - 60, STAGE.y + 26]], 1400, .4), "kf"); }
      }
      if (S.drag) s += slideSvg(S.drag.key, S.drag.x, S.drag.y, false);
    }
  } else if (S.station === 3){
    s += `<circle cx="${VX}" cy="${VY}" r="${VR}" fill="var(--pane)"/><g clip-path="url(#vclip)">${drawDivide()}</g>` + P(ring(VX, VY, VR, 600), "k") + P(ring(VX, VY, VR + 7, 601, 2), "k1");
    s += counterDyn() + barsSvg();
  } else if (S.station === 4) s += draw4();
  else s += drawEnd();
  gDyn.innerHTML = s;
}
function toSvg(e){
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
let drag = null;
const angAt = q => Math.atan2(q.x - DX, -(q.y - DY)) * 180 / Math.PI;
svg.addEventListener("pointerdown", e => {
  const q = toSvg(e); S.kbd = false;
  if ((S.mode === "act1" || S.mode === "zoom2") && Math.hypot(q.x - DX, q.y - DY) < 96){
    drag = { kind: "knob", last: angAt(q) };
  } else if (S.mode === "pick"){
    for (const key of ["skin", "onion", "blood"]){
      if (key !== S.want) continue;
      const sx = SLIDES[key].x;
      if (Math.abs(q.x - sx) < SW / 2 + 10 && Math.abs(q.y - SLIDE_Y) < SH / 2 + 12){
        S.drag = { key, x: sx, y: SLIDE_Y, ox: q.x - sx, oy: q.y - SLIDE_Y, x0: q.x, y0: q.y, moved: false };
        drag = { kind: "slide" }; render();
      }
    }
  } else if (S.mode === "tap4"){
    const h = hitTile(q); if (h) tapCell(h.key, h.idx);
  }
  if (drag){ svg.setPointerCapture(e.pointerId); e.preventDefault(); }
});
svg.addEventListener("pointermove", e => {
  if (!drag) return;
  const q = toSvg(e);
  if (drag.kind === "knob"){
    const a = angAt(q); let d = a - drag.last; if (d > 180) d -= 360; if (d < -180) d += 360;
    drag.last = a; S.zt = clamp(S.zt + d / 300);
  } else if (drag.kind === "slide" && S.drag){
    S.drag.x = q.x - S.drag.ox; S.drag.y = q.y - S.drag.oy;
    if (Math.hypot(q.x - S.drag.x0, q.y - S.drag.y0) > 8) S.drag.moved = true;
    render();
  }
});
function endDrag(){
  if (drag && drag.kind === "slide" && S.drag){
    const d = S.drag;
    if (!d.moved || Math.hypot(d.x - STAGE.x, d.y - STAGE.y) < 130) place(d.key);
    else { S.drag = null; render(); }
  }
  drag = null;
}
for (const ev of ["pointerup", "pointercancel"]) svg.addEventListener(ev, endDrag);
svg.addEventListener("keydown", e => {
  const k = e.key;
  if (S.mode === "act1" || S.mode === "zoom2"){
    if (/ArrowUp|ArrowRight|^\+$|^=$/.test(k)){ e.preventDefault(); S.zt = clamp(S.zt + .04); }
    if (/ArrowDown|ArrowLeft|^-$/.test(k)){ e.preventDefault(); S.zt = clamp(S.zt - .04); }
  } else if (S.mode === "pick" && (k === "Enter" || k === " ")){ e.preventDefault(); place(S.want); }
  else if (S.mode === "act3" && /Arrow|Enter| /.test(k)){ e.preventDefault(); S.dt = clamp(S.dt + .02); }
  else if (S.mode === "tap4"){
    if (/ArrowRight|ArrowDown/.test(k)){ e.preventDefault(); S.kbd = true; S.focus = (S.focus + 1) % CANDS.length; render(); }
    if (/ArrowLeft|ArrowUp/.test(k)){ e.preventDefault(); S.kbd = true; S.focus = (S.focus - 1 + CANDS.length) % CANDS.length; render(); }
    if ((k === "Enter" || k === " ") && S.focus >= 0){ e.preventDefault(); const f = CANDS[S.focus]; tapCell(f.key, f.idx); }
  }
});

let last = performance.now();
function tick(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  let dirty = false;
  if (S.holdKey === "zin" || S.holdKey === "zout"){ if (S.mode === "act1" || S.mode === "zoom2") S.zt = clamp(S.zt + (S.holdKey === "zin" ? 1 : -1) * dt * .2); }
  if (S.holdKey === "div" && S.mode === "act3") S.dt = clamp(S.dt + dt * .09);
  const k = reduced ? 1 : 1 - Math.exp(-dt / .12);
  if (Math.abs(S.zt - S.z) > 1e-4){ S.z = Math.abs(S.zt - S.z) < 1e-3 ? S.zt : S.z + (S.zt - S.z) * k; dirty = true; }
  const dTarget = tOfD(S.dt);
  if (Math.abs(dTarget - S.d) > 1e-4){ S.d = Math.abs(dTarget - S.d) < 1e-3 ? dTarget : S.d + (dTarget - S.d) * k; dirty = true; }
  if (dirty && S.station <= 4){
    if (S.mode === "act1"){
      milestones1();
      if (S.zt >= .985 && S.z > .975){ S.z = S.zt = 1; render(); readoutZoom(); done1(); }   // 98.5% 就算完成，读数对齐到 400 倍
      else { render(); readoutZoom(); }
    } else if (S.mode === "zoom2"){
      const zT = zOf(MODEL.target[S.want]);
      if (S.zt >= .985 * zT && S.z > .975 * zT){ S.z = S.zt = zT; seen2(S.want); }
      else { render(); readoutZoom(); }
    } else if (S.mode === "act3"){
      if (S.dt >= .985 && S.d > tOfD(.975)){ S.dt = 1; S.d = MODEL.divisions; render(); readout3(); done3(); }   // 读数对齐到 45 次
      else { milestones3(); render(); readout3(); }
    } else render();
  }
  requestAnimationFrame(tick);
}
Host.ready();   // 先发 ready，再发别的消息
enter1();
requestAnimationFrame(tick);
</script>
