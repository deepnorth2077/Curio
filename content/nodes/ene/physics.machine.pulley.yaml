theme: ene
grade: G6
unit: 手里的力
prerequisites: []
driving_question: 都是一个轮子，为什么有的能把手上的力减半？
objectives:
- 忽略轮绳质量和摩擦，匀速；定滑轮一段竖绳承重，动滑轮两段同张力竖绳承重。8 N 箱升 1 m 时输入分别为 8 N×1 m 与 4 N×2 m。
- 留下两种绳路在同一高度的手力和绳长。
