id: physics.energy.power
schema: knode/1
title: 功率：一秒能搬多少
subjects:
- physics
theme: ene
grade: G8
unit: 看秒表，追能量
prerequisites:
- physics.energy.work
driving_question: 先到站的机器，每秒一定做更多功吗？
objectives:
- 平均功率=W/t；12 J用3 s为4 W，用6 s为2 W。比较不同工作量必须同时看时间。
- 两台机器各留一张每秒做功的工票。
misconceptions:
- id: first-is-powerful
  text: 先完成就功率大
