lenses:
- band: G3-4
  approach: 跑同一单任务改用时；接着给第二台不同货量，两台同时开，比较完成时间和每秒做功。
- band: G7-9
  approach: 平均功率=W/t；12 J用3 s为4 W，用6 s为2 W。比较不同工作量必须同时看时间。
