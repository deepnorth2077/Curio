lenses:
- band: G3-4
  approach: 让相同质量两车互推；给其中一辆加货，同一瞬间比较两箭头和两辆车速度变化。
- band: G7-9
  approach: 相互作用的两力同时、等大、反向、分属不同物体。2 kg和4 kg小车互推4 N时加速度大小为2和1 m/s²。水平外力忽略。
