id: physics.motion.action-reaction
schema: knode/1
title: 牛顿第三定律：两辆车互推
subjects:
- physics
theme: ene
grade: G10
unit: 改变运动，再看伙伴
prerequisites:
- physics.motion.force-acceleration
driving_question: 轻车跑得快，是它受到的推力比重车大吗？
objectives:
- 相互作用的两力同时、等大、反向、分属不同物体。2 kg和4 kg小车互推4 N时加速度大小为2和1 m/s²。水平外力忽略。
- 把两张力签分别贴回受力的那辆车。
misconceptions:
- id: cancel-on-one
  text: 反作用力在同一辆车上抵消
