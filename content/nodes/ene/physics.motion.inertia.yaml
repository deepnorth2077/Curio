driving_question: 松开手，同一辆小车为何有时停、有时一直滑？
objectives:
- 在惯性参考系中合力为零时，静止或匀速直线运动。无阻力直轨模型上已在动的小车每秒走相同距离；普通轨上阻力使它减速。
- 两条同一时间拍下的轨道足迹。
