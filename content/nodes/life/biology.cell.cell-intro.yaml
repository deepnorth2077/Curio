id: biology.cell.cell-intro
schema: knode/1
title: 细胞：生命的小房间
subjects: [science, biology]
theme: life
grade: G7
unit: 七上 · 第一单元 生物和细胞 · 第二章 认识细胞
curriculum:
  - textbook: 人教版初中生物学七年级上册（2024 年版）
    unit: 第一单元 生物和细胞 · 第二章 认识细胞
prerequisites: []
related: []
driving_question: 你的身体是用什么搭起来的？
objectives:
  - 知道人、动物和植物都是由细胞组成的。
  - 知道细胞是活的：会吸收养料、会长大，还会分成两个。
  - 知道细胞很小，大多数要用显微镜才能看见。
  - 知道身体里有很多种细胞，形状和本领各不一样。
  - 知道动物和植物的细胞里一般都有细胞核，它是细胞里放「说明书」的小房间；人成熟的红细胞没有细胞核，是例外。
misconceptions:
  - id: only-animals
    text: 只有动物和人是由细胞组成的，植物不是。
  - id: one-kind
    text: 身体里的细胞都长得一样。
  - id: visible
    text: 细胞用眼睛就能看见。
  - id: cells-are-dead
    text: 细胞只是身体里的小零件，它们不是活的。
sources:
  - type: textbook
    ref: 人教版初中生物学七年级上册（2024 年版）第一单元「生物和细胞」第二章「认识细胞」（第二节 植物细胞、第三节 动物细胞、第四节 细胞的生活）
  - type: curriculum
    ref: 《义务教育生物学课程标准（2022 年版）》「生物体的结构层次」
lenses:
  - band: G3-4
    approach: 从「用积木搭房子」类比细胞搭成身体，再说清细胞和积木不一样的地方：细胞是活的，会吸收养料、会长大、会分成两个；用放大镜和显微镜下的照片说明细胞很小；比较几种细胞的样子；认识细胞核这个放「说明书」的小房间，为下一颗星 DNA 铺路。
  - band: G7-8
    approach: 用显微镜观察洋葱表皮和口腔上皮细胞，认识细胞膜、细胞质、细胞核等结构；知道人成熟的红细胞没有细胞核。
activities: [act.explain.cell-intro-01, act.quiz.cell-intro-01]
status: draft
version: 1
