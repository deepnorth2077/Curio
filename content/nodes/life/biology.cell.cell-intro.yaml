id: biology.cell.cell-intro
schema: knode/1
title: 细胞：生命的小房间
subjects: [science, biology]
theme: life
grade: G7
unit: 七上 · 细胞是生命活动的基本单位
curriculum:
  - textbook: 人教版初中生物学七年级上册
    unit: 细胞是生命活动的基本单位
prerequisites: []
related: []
driving_question: 你的身体是用什么搭起来的？
objectives:
  - 知道人、动物和植物都是由细胞组成的。
  - 知道细胞很小，大多数要用显微镜才能看见。
  - 知道身体里有很多种细胞，形状和本领各不一样。
  - 知道动物和植物的细胞里一般都有细胞核。
misconceptions:
  - id: only-animals
    text: 只有动物和人是由细胞组成的，植物不是。
  - id: one-kind
    text: 身体里的细胞都长得一样。
  - id: visible
    text: 细胞用眼睛就能看见。
sources:
  - type: textbook
    ref: 人教版初中生物学七年级上册「细胞是生命活动的基本单位」（具体章节待交叉核对时确认）
  - type: curriculum
    ref: 《义务教育生物学课程标准（2022 年版）》「生物体的结构层次」
lenses:
  - band: G3-4
    approach: 从「用积木搭房子」类比细胞搭成身体；用放大镜和显微镜下的照片说明细胞很小；比较几种细胞的样子。
  - band: G7-8
    approach: 用显微镜观察洋葱表皮和口腔上皮细胞，认识细胞膜、细胞质、细胞核等结构。
activities: []
status: draft
version: 1
