# PR 检查：先跑检查脚本自己的测试，再检查这个 PR。工作流见 docs/collaboration.md。
# 在分支保护里把「检查」和「走查」设为必须通过。「走查」只在改了动手探索模块或走查代码时才真跑，别的 PR 几秒结束。
name: PR 检查

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    name: 检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r tools/requirements.txt
      - name: 检查脚本自测
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          python -m unittest discover -s tools/tests -v
      - name: 检查这个 PR
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python tools/ci_checks.py
      - name: 核对本次设计说明、知识点卡与配套挑战
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python tools/brief_lint.py --base "origin/$BASE_REF"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 中转服务测试
        run: |
          if [ -f relay/src/handler.js ]; then node --test 'relay/test/*.test.js'; else echo "还没有 relay/src/handler.js，跳过"; fi
      - name: 竖切片 1 的向量和验收测试
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -f kernel/js/log.js ]; then
            node --test kernel/test/*.test.js engine/test/*.test.js app/test/*.test.js
          elif [[ "$HEAD_REF" == feat/slice-1* ]]; then
            echo "切片 1 的实现分支必须带 kernel/js/log.js，不能跳过验收测试"; exit 1
          else
            echo "还没有 kernel/js/log.js，跳过"
          fi

  walk:
    name: 走查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 选这次要走查的模块
        id: pick
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          n=$(python -c "import sys; sys.path.insert(0, 'tools'); import walk_all; print(len(walk_all.select(walk_all.changed_files(), walk_all.modules())))")
          echo "要走查 $n 个模块"
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - name: 装 playwright 和 chromium
        if: steps.pick.outputs.n != '0'
        run: |
          pip install --quiet -r tools/requirements-walk.txt
          python -m playwright install --with-deps chromium
      - name: 走查
        if: steps.pick.outputs.n != '0'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python tools/walk_all.py --out walk-shots
      - name: 上传截图
        if: always() && steps.pick.outputs.n != '0'
        uses: actions/upload-artifact@v4
        with:
          name: walk-shots
          path: walk-shots
          if-no-files-found: ignore
