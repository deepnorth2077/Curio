# PR 检查：先跑检查脚本自己的测试，再检查这个 PR。工作流见 docs/collaboration.md。
# 在分支保护里把「检查」设为必须通过。
name: PR 检查

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    name: 检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r tools/requirements.txt
      - name: 检查脚本自测
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          python -m unittest discover -s tools/tests -v
      - name: 检查这个 PR
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python tools/ci_checks.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 中转服务测试
        run: |
          if [ -f relay/src/handler.js ]; then node --test 'relay/test/*.test.js'; else echo "还没有 relay/src/handler.js，跳过"; fi
      - name: 竖切片 1 的向量和验收测试
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -f kernel/js/log.js ]; then
            node --test kernel/test/*.test.js engine/test/*.test.js app/test/*.test.js
          elif [[ "$HEAD_REF" == feat/slice-1* ]]; then
            echo "切片 1 的实现分支必须带 kernel/js/log.js，不能跳过验收测试"; exit 1
          else
            echo "还没有 kernel/js/log.js，跳过"
          fi
