# 把 prototype/ 发布到 GitHub Pages，同时把中转服务打成 zip 放在 relay/ 下（部署手册第 7 步下载它）。
# 竖切片 1 的演示页：app/、kernel/、engine/ 原样发布，release/ 是从真实内容 content/ 构建的发布包（切片规格第 8 节）。
# main 分支上这些目录一变化就自动发布，也可以在 Actions 页面手动运行。
name: 发布原型到 GitHub Pages

on:
  push:
    branches: [main]
    paths: ["prototype/**", "relay/**", "app/**", "kernel/**", "engine/**", "tools/build_release.py", "content/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 组装网站，打包中转服务
        run: |
          mkdir -p _site/relay
          cp -r prototype/. _site/
          # 在 Linux 上打包，scf_bootstrap 的可执行位（755）会保存在 zip 里；Windows 上重新压缩会丢掉它
          if [ -f relay/scf_bootstrap ]; then
            test -x relay/scf_bootstrap
            (cd relay && zip -X -r ../_site/relay/curio-relay.zip scf_bootstrap package.json src adapters)
            unzip -Z _site/relay/curio-relay.zip | grep -q '^-rwx.*scf_bootstrap$'
            cp relay/tools/passphrase.html _site/relay/passphrase.html
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 竖切片 1 演示页（https://deepnorth2077.github.io/Curio/app/）
        run: |
          if [ -f app/index.html ]; then
            pip install --quiet -r tools/requirements.txt
            python tools/build_release.py --content content --out _site/release
            mkdir -p _site/app _site/kernel _site/engine
            cp -r kernel/js _site/kernel/js
            cp -r engine/js _site/engine/js
            find app -maxdepth 1 -type f -exec cp {} _site/app/ \;
            test -f _site/release/release.json
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
