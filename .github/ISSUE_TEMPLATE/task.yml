name: 任务
description: 一件要做的事。开工前先在下面留言认领，并打上「进行中」标签。
title: "[任务] "
labels: ["待认领"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      description: 决定用哪个分支前缀，见 docs/collaboration.md
      options:
        - 知识点（kp/<知识点 id>）
        - 架构 / 规格（arch/…）
        - 平台功能（feat/…）
        - 修复（fix/…）
        - 杂项（chore/…）
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 要做什么
      description: 一两句话说清楚。知识点任务写上知识点 id 和教材单元。
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 验收标准
      description: 怎样算做完。写成勾选框，Luka 要能照着验收：打开什么、点哪里、应该看到什么。
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: 相关文件和资料
      description: 要读的文档、规格、提示词、教材照片等
